name: Discover IAT Auto broker reports 20261020

on:
  push:
    paths:
      - '.github/workflows/ialt-300825-broker-report-discover-20261020.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Eastmoney report API
        shell: bash
        run: |
          python - <<'PY'
          import json, requests
          s = requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0',
              'Referer':'https://data.eastmoney.com/report/300825.html'
          })
          ep='https://reportapi.eastmoney.com/report/list'
          all_rows=[]
          for page in range(1, 11):
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2018-01-01','endTime':'2026-10-20','pageNo':str(page),'fields':'',
                  'qType':'0','orgCode':'','code':'300825','rcode':'','p':str(page),
                  'pageNum':str(page),'pageNumber':str(page)
              }
              r=s.get(ep, params=params, timeout=30)
              print('PAGE', page, 'STATUS', r.status_code, 'LEN', len(r.content), 'URL', r.url)
              r.raise_for_status()
              obj=r.json()
              rows=obj.get('data') or []
              print('HITS', obj.get('hits'), 'SIZE', obj.get('size'), 'ROWS', len(rows))
              if not rows:
                  break
              all_rows.extend(rows)
              if len(rows) < 100:
                  break
          seen=set(); clean=[]
          for rec in all_rows:
              code=rec.get('infoCode')
              if not code or code in seen:
                  continue
              seen.add(code)
              keep={k:rec.get(k) for k in [
                  'infoCode','title','orgSName','orgName','researcher','publishDate','emRatingName',
                  'attachPages','attachSize','reportType','stockCode','stockName','indvInduName','encodeUrl'
              ]}
              clean.append(keep)
          clean.sort(key=lambda x:(x.get('attachPages') or 0, x.get('publishDate') or ''), reverse=True)
          print('TOTAL_UNIQUE', len(clean))
          for rec in clean:
              print('REPORT', json.dumps(rec, ensure_ascii=False, sort_keys=True))
          PY
