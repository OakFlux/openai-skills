name: Temporary Fosun International report search

on:
  push:
    branches:
      - tmp/fosun-international-reports-20260828
    paths:
      - .github/workflows/tmp-fosun-international-search.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Search public report catalogues
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out = Path('fosun_search')
          out.mkdir(exist_ok=True)
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'

          # Eastmoney report catalogue
          session = requests.Session()
          session.headers.update({'User-Agent': ua, 'Referer': 'https://data.eastmoney.com/'})
          endpoint = 'https://reportapi.eastmoney.com/report/list'
          east_rows = []
          seen = set()
          code_variants = ['00656', '0656', '656', 'HK00656', '116.00656']
          for code in code_variants:
              for qtype in ['0','1','2','3']:
                  for page in range(1, 21):
                      params = {
                          'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                          'beginTime':'2017-01-01','endTime':'2026-08-28','pageNo':str(page),'fields':'',
                          'qType':qtype,'orgCode':'','code':code,'rcode':'','p':str(page),
                          'pageNum':str(page),'pageNumber':str(page),
                      }
                      try:
                          r = session.get(endpoint, params=params, timeout=60)
                          r.raise_for_status()
                          rows = (r.json().get('data') or [])
                      except Exception as exc:
                          print('EAST_ERROR', code, qtype, page, repr(exc))
                          break
                      print('EAST_PAGE', code, qtype, page, len(rows))
                      for row in rows:
                          title = str(row.get('title') or '')
                          stock_code = str(row.get('stockCode') or row.get('code') or '')
                          stock_name = str(row.get('stockName') or row.get('name') or '')
                          blob = f'{title} {stock_code} {stock_name}'.lower()
                          if not any(k in blob for k in ['复星国际','fosun international','00656','0656']):
                              continue
                          key = row.get('infoCode') or (title, row.get('publishDate'), row.get('orgSName'))
                          if key in seen:
                              continue
                          seen.add(key)
                          item = {
                              'query_code':code,'qType':qtype,
                              'publishDate':(row.get('publishDate') or '')[:10],
                              'title':title,'orgSName':row.get('orgSName'),'researcher':row.get('researcher'),
                              'infoCode':row.get('infoCode'),'attachPages':row.get('attachPages'),
                              'attachSize':row.get('attachSize'),'reportType':row.get('reportType'),
                              'industryName':row.get('industryName'),'ratingName':row.get('ratingName'),
                              'stockCode':stock_code,'stockName':stock_name,
                              'pdfUrl':f"https://pdf.dfcfw.com/pdf/H3_{row.get('infoCode')}_1.pdf" if row.get('infoCode') else None,
                          }
                          east_rows.append(item)
                          print('EAST_MATCH', json.dumps(item, ensure_ascii=False))
                      if len(rows) < 100:
                          break
                      time.sleep(0.3)

          # Unfiltered date-window search can recover records whose code filter is ignored/mismapped.
          for qtype in ['0','1','2','3']:
              for page in range(1, 101):
                  params = {
                      'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                      'beginTime':'2017-01-01','endTime':'2026-08-28','pageNo':str(page),'fields':'',
                      'qType':qtype,'orgCode':'','code':'','rcode':'','p':str(page),
                      'pageNum':str(page),'pageNumber':str(page),
                  }
                  try:
                      r = session.get(endpoint, params=params, timeout=60)
                      r.raise_for_status(); rows = r.json().get('data') or []
                  except Exception as exc:
                      print('EAST_ALL_ERROR', qtype, page, repr(exc)); break
                  for row in rows:
                      title = str(row.get('title') or '')
                      stock_code = str(row.get('stockCode') or row.get('code') or '')
                      stock_name = str(row.get('stockName') or row.get('name') or '')
                      blob = f'{title} {stock_code} {stock_name}'.lower()
                      if not any(k in blob for k in ['复星国际','fosun international','00656']):
                          continue
                      key = row.get('infoCode') or (title, row.get('publishDate'), row.get('orgSName'))
                      if key in seen: continue
                      seen.add(key)
                      item = {
                          'query_code':'ALL','qType':qtype,
                          'publishDate':(row.get('publishDate') or '')[:10],
                          'title':title,'orgSName':row.get('orgSName'),'researcher':row.get('researcher'),
                          'infoCode':row.get('infoCode'),'attachPages':row.get('attachPages'),
                          'attachSize':row.get('attachSize'),'reportType':row.get('reportType'),
                          'industryName':row.get('industryName'),'ratingName':row.get('ratingName'),
                          'stockCode':stock_code,'stockName':stock_name,
                          'pdfUrl':f"https://pdf.dfcfw.com/pdf/H3_{row.get('infoCode')}_1.pdf" if row.get('infoCode') else None,
                      }
                      east_rows.append(item)
                      print('EAST_ALL_MATCH', json.dumps(item, ensure_ascii=False))
                  if len(rows) < 100: break

          # SDYanbao public catalogue
          sd = requests.Session()
          sd.headers.update({'User-Agent':ua,'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          sd_rows = []
          sd_seen = set()
          for keyword in ['复星国际','复星国际 00656','00656 公司研究','Fosun International','复星 国际 深度']:
              for page in range(1, 6):
                  try:
                      r = sd.post('https://api.sdyanbao.com/api/file/search', json={'page':page,'pageSize':100,'keyword':keyword}, timeout=60)
                      r.raise_for_status()
                      payload = r.json().get('data') or {}
                      rows = payload.get('files') or []
                  except Exception as exc:
                      print('SD_ERROR', keyword, page, repr(exc)); break
                  print('SD_PAGE', keyword, page, len(rows), 'total=', payload.get('total'))
                  for row in rows:
                      name = str(row.get('name') or '')
                      blob = name.lower()
                      if not any(k in blob for k in ['复星国际','fosun international','00656']):
                          continue
                      fid = row.get('id')
                      if fid in sd_seen: continue
                      sd_seen.add(fid)
                      item = {
                          'id':fid,'name':name,'page_count':row.get('page_count'),'file_size':row.get('file_size'),
                          'create_time':row.get('create_time'),'update_time':row.get('update_time'),
                          'time_text':row.get('time_text'),'page_url':row.get('page_url'),'share_url':row.get('share_url'),
                          'online_url':row.get('online_url'),'data_source':row.get('data_source'),
                          'data_source_uuid':row.get('data_source_uuid'),'original_id':row.get('original_id'),
                          'organization':(row.get('organization') or {}).get('name'),
                          'type':(row.get('type') or {}).get('name'),'industry':(row.get('industry') or {}).get('name'),
                      }
                      # Fetch public detail metadata.
                      try:
                          detail = sd.post('https://api.sdyanbao.com/api/file/detail', json={'id':fid}, timeout=60).json().get('data') or {}
                          for field in ['online_url','summary','content','time_text','page_count','file_size','page_url','share_url','data_source_uuid','original_id']:
                              if detail.get(field) not in [None,'']:
                                  item[field] = detail.get(field)
                          if detail.get('organization'):
                              item['organization'] = detail['organization'].get('name')
                      except Exception as exc:
                          item['detail_error'] = repr(exc)
                      sd_rows.append(item)
                      print('SD_MATCH', json.dumps({k:v for k,v in item.items() if k!='content'}, ensure_ascii=False))
                  if len(rows) < 100: break

          # Sina report search pages (metadata only)
          sina_results=[]
          for term in ['复星国际','00656','Fosun International']:
              url='https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml'
              params={'t1':'2','symbol':term}
              try:
                  r=requests.get(url,params=params,headers={'User-Agent':ua},timeout=60)
                  r.encoding='gb18030'
                  soup=BeautifulSoup(r.text,'html.parser')
                  links=[]
                  for a in soup.find_all('a', href=True):
                      label=a.get_text(' ',strip=True)
                      href=a.get('href')
                      blob=(label+' '+href).lower()
                      if any(k in blob for k in ['复星国际','00656','fosun']):
                          links.append({'label':label,'href':href})
                  sina_results.append({'term':term,'status':r.status_code,'url':r.url,'links':links})
                  print('SINA',term,json.dumps(links[:50],ensure_ascii=False))
              except Exception as exc:
                  sina_results.append({'term':term,'error':repr(exc)})

          east_rows.sort(key=lambda x:((x.get('publishDate') or ''), x.get('attachPages') or 0), reverse=True)
          sd_rows.sort(key=lambda x:((x.get('time_text') or ''), x.get('page_count') or 0), reverse=True)
          (out/'eastmoney.json').write_text(json.dumps(east_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'sdyanbao.json').write_text(json.dumps(sd_rows,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'sina.json').write_text(json.dumps(sina_results,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL',len(east_rows),len(sd_rows),len(sina_results))
          PY
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: fosun-international-search-results
          path: fosun_search/
          retention-days: 1
          if-no-files-found: error
