name: Temporary Daan Gene NXNY source probe

on:
  push:
    branches:
      - tmp/daan-gene-broker-reports-20260829
    paths:
      - .github/workflows/tmp-daan-nxny-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4
      - name: Inspect page, scripts, forms, and likely download endpoints
        run: |
          python - <<'PY'
          from __future__ import annotations
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          pages=[
            'https://www.nxny.com/report/view_4461177.html',
            'https://www.9fzt.com/detail/sz_002030_10_648229670402.html',
            'https://www.9fzt.com/detail/sz_002030_10_684425869377.html',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          for page_url in pages:
            print('\n===== PAGE',page_url,'=====')
            try:
              r=s.get(page_url,timeout=60,allow_redirects=True)
            except Exception as e:
              print('GET_ERROR',repr(e)); continue
            text=r.text; decoded=html.unescape(text).replace('\\/','/')
            soup=BeautifulSoup(text,'html.parser')
            print('STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),'COOKIES',s.cookies.get_dict())
            print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else None)
            for form in soup.find_all('form'):
              inputs=[]
              for tag in form.find_all(['input','button','select','textarea']):
                inputs.append({k:tag.get(k) for k in ['name','id','type','value','onclick','formaction','class'] if tag.get(k) is not None})
              print('FORM',json.dumps({'action':form.get('action'),'method':form.get('method'),'id':form.get('id'),'class':form.get('class'),'inputs':inputs},ensure_ascii=False)[:10000])
            links=[]
            for tag in soup.find_all(['a','script','iframe','embed','object','link','img','source','button','input']):
              attrs={k:tag.get(k) for k in ['href','src','data','onclick','action','value','id','name','class'] if tag.get(k) is not None}
              label=tag.get_text(' ',strip=True)[:300]
              blob=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
              if any(token in blob for token in ['download','pdf','报告下载','下载报告','附件','file','report','4461177','648229670402','684425869377']):
                print('TAG',tag.name,json.dumps({'label':label,'attrs':attrs},ensure_ascii=False)[:6000])
              for key in ['href','src','data','action','formaction']:
                v=tag.get(key)
                if v:
                  absolute=urljoin(r.url,v)
                  if any(token in absolute.lower() for token in ['pdf','download','file','report','attach','doc','view']): links.append(absolute)
            links.extend(re.findall(r'https?://[^"\'<>\s]+(?:\.pdf|download|file|report|attach|doc)[^"\'<>\s]*',decoded,re.I))
            print('LINKS',json.dumps(sorted(set(links))[:500],ensure_ascii=False))
            needles=['4461177','648229670402','684425869377','.pdf','download','downUrl','downloadUrl','fileUrl','file_url','attachment','attach','reportId','report_id','docId','doc_id','ajax','api/','login']
            for needle in needles:
              poss=[m.start() for m in re.finditer(re.escape(needle),decoded,re.I)]
              if not poss: continue
              print('NEEDLE',needle,'COUNT',len(poss))
              for pos in poss[:20]:
                print('CONTEXT',re.sub(r'\s+',' ',decoded[max(0,pos-700):pos+1600])[:3000])
            # Fetch external JS referenced by page and inspect for route strings.
            scripts=[]
            for tag in soup.find_all('script'):
              src=tag.get('src')
              if src: scripts.append(urljoin(r.url,src))
            for js_url in scripts[:50]:
              try:
                jr=s.get(js_url,timeout=45)
                jtext=jr.text
                if any(k.lower() in jtext.lower() for k in ['download','report','pdf','4461177','fileurl']):
                  print('JS',js_url,'STATUS',jr.status_code,'BYTES',len(jr.content))
                  for needle in ['download','pdf','report','fileUrl','file_url','attachment','login']:
                    poss=[m.start() for m in re.finditer(re.escape(needle),jtext,re.I)]
                    if poss:
                      print('JS_NEEDLE',needle,'COUNT',len(poss))
                      for pos in poss[:12]: print('JS_CONTEXT',re.sub(r'\s+',' ',jtext[max(0,pos-500):pos+1200])[:2000])
              except Exception as e: print('JS_ERROR',js_url,repr(e))
          PY
