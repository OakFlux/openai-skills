name: Discover Super Hi International broker reports 20260927

on:
  push:
    paths:
      - '.github/workflows/super-hi-broker-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf beautifulsoup4

      - name: Search report APIs and public web
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, time, html
          from pathlib import Path
          from urllib.parse import quote_plus, urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          out = Path('super-hi-broker-discovery')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          all_rows = []
          api = 'https://reportapi.eastmoney.com/report/list'
          for code in ['09658', '9658', '09658.HK', 'HK09658']:
              for qtype in ['0', '1', '2']:
                  params = {
                      'cb': 'datatable', 'pageSize': '100', 'beginTime': '2018-01-01',
                      'endTime': '2026-09-27', 'pageNo': '1', 'fields': '', 'qType': qtype,
                      'orgCode': '', 'author': '', 'code': code, 'industryCode': '*',
                      'industry': '*', 'rating': '*', 'ratingChange': '*',
                  }
                  try:
                      r = s.get(api, params=params, timeout=(20, 90))
                      print('EASTMONEY_API', code, qtype, r.status_code, r.url, len(r.content), flush=True)
                      r.raise_for_status()
                      txt = r.text.strip()
                      m = re.match(r'^[^(]+\((.*)\)\s*;?$', txt, re.S)
                      if m: txt = m.group(1)
                      payload = json.loads(txt)
                      rows = payload.get('data') or []
                      print('ROWS', code, qtype, len(rows), 'hits', payload.get('hits'), flush=True)
                      for row in rows:
                          row['_query_code'] = code
                          row['_qtype'] = qtype
                          all_rows.append(row)
                  except Exception as e:
                      print('API_ERR', code, qtype, repr(e), flush=True)

          uniq = {}
          for row in all_rows:
              info = str(row.get('infoCode') or row.get('infocode') or '')
              key = info or json.dumps(row, ensure_ascii=False, sort_keys=True)
              uniq[key] = row
          rows = list(uniq.values())
          rows.sort(key=lambda x: str(x.get('publishDate') or ''), reverse=True)
          print('UNIQUE_API_ROWS', len(rows), flush=True)
          for row in rows:
              print('API_META', json.dumps({k: row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','stockName','stockCode','researcher','emRatingName']}, ensure_ascii=False), flush=True)
          (out/'api_rows.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')

          pdf_records = []
          for i, row in enumerate(rows[:100], 1):
              info = str(row.get('infoCode') or '')
              if not info: continue
              urls = [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf', f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf']
              p = out / f'{i:03d}_{info}.pdf'
              final = None
              for u in urls:
                  try:
                      with s.get(u, timeout=(20, 150), stream=True, allow_redirects=True,
                                 headers={'Referer':'https://data.eastmoney.com/'}) as r:
                          print('PDF_GET', info, r.status_code, u, flush=True)
                          if r.status_code != 200: continue
                          with p.open('wb') as f:
                              for chunk in r.iter_content(1024*1024):
                                  if chunk: f.write(chunk)
                          if p.stat().st_size < 30000 or not p.read_bytes()[:8].startswith(b'%PDF-'):
                              p.unlink(missing_ok=True); continue
                          final = r.url; break
                  except Exception as e:
                      print('PDF_ERR', info, repr(e), flush=True); p.unlink(missing_ok=True)
              if not final: continue
              try:
                  reader = PdfReader(str(p), strict=False)
                  pages = len(reader.pages)
                  text = ''
                  for page in reader.pages[:min(10,pages)]:
                      try: text += '\n' + (page.extract_text() or '')
                      except: pass
                  compact = re.sub(r'\s+','',text)
                  identity = any(x in compact for x in ['特海国际','特海國際','SuperHiInternational','SuperHi']) and any(x in compact for x in ['09658','9658','HDL'])
                  rec = {
                      'infoCode': info, 'title': row.get('title'), 'broker': row.get('orgSName') or row.get('orgName'),
                      'publishDate': row.get('publishDate'), 'stockName': row.get('stockName'),
                      'pages': pages, 'bytes': p.stat().st_size, 'identity_ok': identity, 'pdf_url': final,
                      'sample': text[:3000]
                  }
                  pdf_records.append(rec)
                  print('PDF_OK', json.dumps({k:rec[k] for k in ['infoCode','title','broker','publishDate','pages','bytes','identity_ok','pdf_url']}, ensure_ascii=False), flush=True)
              except Exception as e:
                  print('PARSE_ERR', info, repr(e), flush=True)
              finally:
                  p.unlink(missing_ok=True)

          # Search Bing HTML for additional report/PDF leads.
          queries = [
              '特海国际 券商 深度报告 pdf',
              '特海国际 首次覆盖 研报 pdf',
              '特海国际 09658 研究报告 pdf',
              'Super Hi International broker research pdf',
              '特海國際 09658 研究報告 pdf',
          ]
          web_results=[]
          for q in queries:
              u='https://www.bing.com/search?q='+quote_plus(q)+'&count=50'
              try:
                  r=s.get(u,timeout=(20,90)); print('BING',q,r.status_code,len(r.content),flush=True); r.raise_for_status()
                  soup=BeautifulSoup(r.text,'html.parser')
                  for a in soup.select('li.b_algo h2 a, a'):
                      href=a.get('href') or ''
                      title=' '.join(a.get_text(' ',strip=True).split())
                      if not href.startswith('http'): continue
                      low=(href+' '+title).lower()
                      if any(k.lower() in low for k in ['特海','09658','super hi','research','report','研报','pdf']):
                          web_results.append({'query':q,'title':title,'url':href})
                          print('WEB_RESULT',json.dumps(web_results[-1],ensure_ascii=False),flush=True)
              except Exception as e: print('BING_ERR',q,repr(e),flush=True)
              time.sleep(0.3)

          # De-duplicate web results.
          seen=set(); wr=[]
          for x in web_results:
              if x['url'] in seen: continue
              seen.add(x['url']); wr.append(x)
          (out/'web_results.json').write_text(json.dumps(wr,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'pdf_candidates.json').write_text(json.dumps(pdf_records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOP_PDF_CANDIDATES',flush=True)
          pdf_records.sort(key=lambda x:(x['identity_ok'],x['pages'],str(x['publishDate'])),reverse=True)
          for x in pdf_records[:30]:
              print(json.dumps({k:x[k] for k in ['infoCode','title','broker','publishDate','pages','bytes','identity_ok','pdf_url']},ensure_ascii=False),flush=True)
          PY

      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: super-hi-broker-discovery
          path: super-hi-broker-discovery/
          if-no-files-found: error
          retention-days: 7
