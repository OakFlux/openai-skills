name: Probe Shaanxi Jinye full-text report APIs

on:
  push:
    branches:
      - tmp-shaanxi-jinye-broker-reports-20261029

permissions:
  contents: read

jobs:
  shaanxi-fulltext-api-probe-20261029:
    name: shaanxi-fulltext-api-probe-20261029
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Probe Hibor archives and Fxbaogao APIs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import html, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          def get(u,**kw):
            try:
              r=s.get(u,timeout=(20,180),allow_redirects=True,**kw)
              print('GET',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              return r
            except Exception as e:
              print('GETERR',u,repr(e)); return None
          titles=['烟标整合有望加速','主业仍处困难期','烟标主业迎春来','陕西金叶']
          for u in ['https://wt.hibor.com.cn/archiver_houtai/201604.html','https://sysbg.hibor.com.cn/archiver_houtai/201608.html','https://www.hibor.com.cn/archiver/201604.html','https://www.hibor.com.cn/archiver/201608.html']:
            print('\nARCHIVE',u)
            r=get(u)
            if not r: continue
            r.encoding=r.apparent_encoding or 'utf-8'
            soup=BeautifulSoup(r.text,'html.parser')
            for a in soup.find_all('a',href=True):
              txt=' '.join(a.get_text(' ',strip=True).split())
              if any(k in txt for k in titles): print('HIT',txt,urljoin(r.url,a['href']))
          probes=[
            'https://m.hibor.com.cn/search.aspx?key=%E9%99%95%E8%A5%BF%E9%87%91%E5%8F%B6',
            'https://wap.hibor.com.cn/search.aspx?key=%E9%99%95%E8%A5%BF%E9%87%91%E5%8F%B6',
            'https://www.hibor.com.cn/search.aspx?key=%E9%99%95%E8%A5%BF%E9%87%91%E5%8F%B6',
          ]
          for u in probes:
            print('\nSEARCH',u); r=get(u)
            if r:
              r.encoding=r.apparent_encoding or 'utf-8'; soup=BeautifulSoup(r.text,'html.parser')
              for a in soup.find_all('a',href=True):
                txt=' '.join(a.get_text(' ',strip=True).split())
                if '陕西金叶' in txt: print('SEARCH_HIT',txt,urljoin(r.url,a['href']))
          for doc in ['70124','80303','660072']:
            for page in [f'https://www.fxbaogao.com/detail/{doc}',f'https://www.fxbaogao.com/view?id={doc}']:
              print('\nFXPAGE',page); r=get(page)
              if not r: continue
              r.encoding=r.apparent_encoding or 'utf-8'
              soup=BeautifulSoup(r.text,'html.parser')
              scripts=[urljoin(r.url,x['src']) for x in soup.find_all('script',src=True)]
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
              print('SCRIPTS',scripts)
              blobs=[('PAGE',r.text)]
              for su in scripts:
                sr=get(su)
                if sr and len(sr.content)<10_000_000: blobs.append((su,sr.text))
              for name,text in blobs:
                dec=html.unescape(text).replace('\\/','/')
                vals=[]
                pats=[r'https?://[^\s"\'<>]+',r'["\']([^"\']*(?:download|pdf|document|report|doc)[^"\']*)["\']',r'(?:axios|fetch|ajax)\s*\([^\n]{0,300}',r'/mofoun/[^\s"\'<>]+']
                for pat in pats:
                  for m in re.findall(pat,dec,flags=re.I):
                    if isinstance(m,tuple): m=''.join(m)
                    if m not in vals: vals.append(m)
                rel=[v for v in vals if any(k in v.lower() for k in ['download','pdf','document','report','doc','mofoun','api.fxbaogao'])]
                if rel:
                  print('BLOB',name)
                  for v in rel[:500]: print('API_CAND',v[:1000])
          PY