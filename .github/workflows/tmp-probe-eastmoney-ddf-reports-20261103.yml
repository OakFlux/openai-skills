name: Probe Eastmoney Dadongfang report API

on:
  push:
    branches:
      - tmp-probe-eastmoney-ddf-reports-20261103

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query report API and PDF candidates
        shell: bash
        run: |
          python3 -m pip install --quiet requests pypdf
          python3 - <<'PY'
          from __future__ import annotations
          import io, json, re
          import requests
          from pypdf import PdfReader

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9',
            'Referer':'https://data.eastmoney.com/report/600327.html',
          })
          endpoints=[
            'https://reportapi.eastmoney.com/report/list',
            'https://reportapi.eastmoney.com/report/list?cb=',
          ]
          params={
            'code':'600327',
            'qType':'0',
            'industryCode':'*',
            'industry':'*',
            'pageSize':'100',
            'pageNo':'1',
            'beginTime':'2010-01-01',
            'endTime':'2026-11-03',
            'rating':'',
            'ratingChange':'',
            'fields':'',
            'orgCode':'',
            'p':'1',
            'pageNum':'1',
          }
          payload=None
          for ep in endpoints:
            try:
              r=s.get(ep,params=params,timeout=(15,60),allow_redirects=True)
              print('API',r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              print(r.text[:3000])
              if r.ok:
                text=r.text.strip()
                if text.startswith('{'):
                  payload=r.json(); break
                m=re.search(r'\((\{.*\})\)\s*;?$',text,re.S)
                if m:
                  payload=json.loads(m.group(1)); break
            except Exception as e: print('API_ERROR',repr(e))
          if not payload:
            raise RuntimeError('No JSON payload from report API')
          rows=payload.get('data') or payload.get('result') or []
          if isinstance(rows,dict):
            rows=rows.get('data') or rows.get('list') or rows.get('items') or []
          print('ROW_COUNT',len(rows))
          targets=[]
          for x in rows:
            title=str(x.get('title') or x.get('reportName') or x.get('researchTitle') or '')
            org=str(x.get('orgSName') or x.get('orgName') or x.get('publishOrgName') or '')
            date=str(x.get('publishDate') or x.get('publishTime') or x.get('date') or '')
            info=str(x.get('infoCode') or x.get('info_code') or x.get('reportId') or x.get('id') or '')
            print('ROW',json.dumps({'title':title,'org':org,'date':date,'infoCode':info,'raw':x},ensure_ascii=False)[:2500])
            if any(k in title for k in ['夯实存量挖掘增量','向宽而行','无锡零售巨头发力儿科医疗','新起点新征程','儿科']) or org in ['华安证券','浙商证券','中泰证券','长城证券']:
              targets.append((title,org,date,info))
          print('TARGETS',json.dumps(targets,ensure_ascii=False))
          for title,org,date,info in targets:
            if not info: continue
            for host in ['H2','H3']:
              for ext in ['pdf','PDF']:
                url=f'https://pdf.dfcfw.com/pdf/{host}_{info}_1.{ext}'
                try:
                  x=s.get(url,headers={'Referer':f'https://data.eastmoney.com/report/info/{info}.html','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},timeout=(15,90),allow_redirects=True)
                  data=x.content
                  pages=0; company=False; broker=False
                  if data.startswith(b'%PDF-'):
                    try:
                      rr=PdfReader(io.BytesIO(data),strict=False); pages=len(rr.pages)
                      text=''.join((p.extract_text() or '') for p in rr.pages[:min(5,pages)])
                      company=('大东方' in text or '600327' in text)
                      broker=(org.replace('证券','') in text or org in text)
                    except Exception as e: print('PDF_PARSE_ERROR',repr(e))
                  print('PDF',title,org,url,'STATUS',x.status_code,'BYTES',len(data),'TYPE',x.headers.get('content-type'),'HEAD',data[:5],'PAGES',pages,'COMPANY',company,'BROKER',broker)
                except Exception as e: print('PDF_ERROR',url,repr(e))
          PY
