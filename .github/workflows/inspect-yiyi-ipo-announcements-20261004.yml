name: Inspect Yiyi IPO announcements 20261004

on:
  push:
    paths:
      - '.github/workflows/inspect-yiyi-ipo-announcements-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Query CNInfo and public issue pages
        run: |
          python - <<'PY'
          import json, requests, re
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Origin':'https://www.cninfo.com.cn','Referer':'https://www.cninfo.com.cn/','X-Requested-With':'XMLHttpRequest'})
          url='https://www.cninfo.com.cn/new/hisAnnouncement/query'
          for stock in ['001206,gfbj0870245','001206,gssz0001206','001206']:
            for key in ['招股说明书','首次公开发行','招股意向书','']:
              data={'pageNum':'1','pageSize':'100','column':'szse','tabName':'fulltext','plate':'sz','stock':stock,'searchkey':key,'secid':'','category':'','trade':'','seDate':'2019-01-01~2022-12-31','sortName':'','sortType':'','isHLtitle':'true'}
              r=s.post(url,data=data,timeout=120)
              print('\nQUERY',stock,key,r.status_code,len(r.content))
              try:
                j=r.json()
              except Exception:
                print(r.text[:1000]); continue
              for x in j.get('announcements') or []:
                t=re.sub(r'<[^>]+>','',str(x.get('announcementTitle') or ''))
                if any(k in t for k in ['招股','首次公开发行','发行股票','上市公告']):
                  print('ITEM',t,x.get('announcementTime'),x.get('adjunctUrl'),x.get('secCode'),x.get('secName'))
          for u in ['https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/001206.phtml','https://www.lixinger.com/equity/company/detail/sz/001206/1206/announcement?type=ipo']:
            try:
              r=s.get(u,timeout=120)
              print('\nPAGE',r.status_code,len(r.content),r.url)
              txt=r.content.decode('gb18030','ignore') if 'sina' in u else r.text
              for m in re.findall(r'https?://[^\"\'<> ]+|href=[\"\']([^\"\']+)',txt,re.I):
                v=m if isinstance(m,str) else m[0]
                if any(k in v.lower() for k in ['pdf','issue','raise','download']): print('LINK',v[:500])
              for m in re.finditer('首次公开发行股票招股说明书',txt):
                print('CTX',txt[max(0,m.start()-500):m.end()+700].replace('\n',' ')[:1500])
            except Exception as e: print('ERR',u,repr(e))
          PY
