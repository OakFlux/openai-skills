name: Build Yiyi 001206 annual prospectus latest 20261004 v3

on:
  push:
    paths:
      - '.github/workflows/yiyi-001206-annual-prospectus-latest-20261004-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Assemble and run package script
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/yiyi_pkg_p*.txt > /tmp/yiyi_pkg.py
          python -m py_compile /tmp/yiyi_pkg.py
          python /tmp/yiyi_pkg.py

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: yiyi-001206-annual-prospectus-latest-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: yiyi-001206-verification-renders
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
