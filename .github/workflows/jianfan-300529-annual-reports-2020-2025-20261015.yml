name: Build Jianfan Biotech 300529 annual reports package 20261015

on:
  push:
    paths:
      - '.github/workflows/jianfan-300529-annual-reports-2020-2025-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '300529'
          COMPANY_SHORT = '健帆生物'
          COMPANY_FULL_NAMES = ['健帆生物科技集团股份有限公司', '珠海健帆生物科技股份有限公司']
          PACKAGE = '健帆生物_300529_2020-2025年报及最新季报'
          ROOT = Path(PACKAGE)
          ROOT.mkdir(exist_ok=True)
          PREVIEWS = Path('_validation_previews')
          PREVIEWS.mkdir(exist_ok=True)

          annual_specs = [
              ('2020', '01_健帆生物_2020年年度报告.pdf'),
              ('2021', '02_健帆生物_2021年年度报告.pdf'),
              ('2022', '03_健帆生物_2022年年度报告.pdf'),
              ('2023', '04_健帆生物_2023年年度报告.pdf'),
              ('2024', '05_健帆生物_2024年年度报告.pdf'),
              ('2025', '06_健帆生物_2025年年度报告.pdf'),
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer': f'https://data.eastmoney.com/notices/stock/{STOCK_CODE}.html',
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          all_rows: list[dict[str, Any]] = []
          search_pages: list[dict[str, Any]] = []

          for page_index in range(1, 101):
              params = {
                  'sr': '-1',
                  'page_size': '50',
                  'page_index': str(page_index),
                  'ann_type': 'A',
                  'client_source': 'web',
                  'stock_list': STOCK_CODE,
                  'f_node': '0',
                  's_node': '0',
              }
              payload = None
              last: Any = None
              for attempt in range(8):
                  try:
                      response = session.get(api, params=params, timeout=(20, 120))
                      last = {'status': response.status_code, 'text': response.text[:300]}
                      if response.status_code == 200:
                          payload = response.json()
                          break
                  except Exception as exc:
                      last = {'error': repr(exc)}
                  time.sleep(1 + attempt)
              if payload is None:
                  raise RuntimeError(f'Announcement API failed page {page_index}: {last}')
              rows = ((payload.get('data') or {}).get('list') or [])
              search_pages.append({'page': page_index, 'count': len(rows)})
              print('PAGE', page_index, 'ROWS', len(rows))
              if not rows:
                  break
              all_rows.extend(rows)
              time.sleep(0.08)

          def compact(text: str) -> str:
              return re.sub(r'\s+', '', text or '')

          def art_code(row: dict[str, Any]) -> str:
              return str(row.get('art_code') or row.get('artCode') or '')

          def date_value(row: dict[str, Any]) -> str:
              return str(row.get('display_time') or '')

          excluded_terms = [
              '摘要', '英文版', '取消', '问询', '回复', '审计报告', '董事会', '监事会',
              '更正公告', '提示性公告', '社会责任报告', '环境、社会及管治报告',
              '可持续发展报告', '独立董事述职报告', '内部控制评价报告', '财务决算报告',
              '年度报告说明会', '年度报告网上说明会', '募集资金', '会计师事务所',
              '前期会计差错更正后的财务报表', '财务报表及相关附注', '业绩预告',
              '股东大会', '权益分派', '网上说明会', '决议公告',
          ]

          def choose_report(variants: list[str], period: str):
              candidates = []
              for row in all_rows:
                  raw_title = str(row.get('title') or '')
                  title = compact(raw_title)
                  matched = next((variant for variant in variants if compact(variant) in title), None)
                  if not matched or any(compact(term) in title for term in excluded_terms):
                      continue
                  score = 50
                  key = compact(matched)
                  if title.endswith(key):
                      score += 35
                  if title == key:
                      score += 20
                  if COMPANY_SHORT in title:
                      score += 10
                  if any(term in title for term in ['更正后', '修订版', '更新后', '修订稿']):
                      score += 100
                  if any(term in title for term in ['取消版', '已取消']):
                      score -= 100
                  candidates.append((score, date_value(row), row, matched))
              candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
              if not candidates:
                  nearby = [str(row.get('title') or '') for row in all_rows if period in str(row.get('title') or '')][:80]
                  raise RuntimeError(f'Missing {variants}; nearby={nearby}')
              log = [
                  {
                      'period': period,
                      'score': score,
                      'date': date,
                      'title': row.get('title'),
                      'art_code': art_code(row),
                      'matched': matched,
                  }
                  for score, date, row, matched in candidates[:20]
              ]
              return candidates[0][2], log

          selected = []
          candidate_logs = {}
          for year, filename in annual_specs:
              row, log = choose_report([f'{year}年年度报告', f'{year}年度报告'], year)
              candidate_logs[f'{year}年年度报告'] = log
              selected.append({
                  'period': year,
                  'filename': filename,
                  'min_pages': 80,
                  'doc_type': '年度报告',
                  'row': row,
              })

          quarter_options = [
              (['2026年第三季度报告', '2026年三季度报告', '2026年第三季报告'], '2026Q3', '2026年第三季度报告'),
              (['2026年第一季度报告', '2026年一季度报告', '2026年第一季报告'], '2026Q1', '2026年第一季度报告'),
              (['2025年第三季度报告', '2025年三季度报告', '2025年第三季报告'], '2025Q3', '2025年第三季度报告'),
              (['2025年第一季度报告', '2025年一季度报告', '2025年第一季报告'], '2025Q1', '2025年第一季度报告'),
          ]
          quarter_row = None
          quarter_period = None
          quarter_label = None
          quarter_log = []
          for variants, period, label in quarter_options:
              try:
                  quarter_row, quarter_log = choose_report(variants, period)
                  quarter_period = period
                  quarter_label = label
                  break
              except RuntimeError:
                  continue
          if quarter_row is None:
              raise RuntimeError('No quarterly report found')
          candidate_logs['最新季报'] = quarter_log
          selected.append({
              'period': quarter_period,
              'filename': f'07_健帆生物_{quarter_label}_最新季报.pdf',
              'min_pages': 5,
              'doc_type': '最新季报',
              'row': quarter_row,
          })

          def fetch_pdf(art: str, referer: str):
              urls = [f'https://pdf.dfcfw.com/pdf/H{host}_{art}_1.pdf' for host in (2, 3, 1, 4)]
              last = {}
              for url in urls:
                  for attempt in range(6):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 420),
                              allow_redirects=True,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': referer,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                          )
                          last = {
                              'url': url,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          }
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 30_000:
                              return response.content, last, url
                      except Exception as exc:
                          last = {'url': url, 'error': repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed {art}: {last}')

          manifest = []
          for index, spec in enumerate(selected, 1):
              row = spec.pop('row')
              art = art_code(row)
              if not art:
                  raise RuntimeError(f'No art code: {spec["filename"]}')
              detail_page = f'https://data.eastmoney.com/notices/detail/{STOCK_CODE}/{art}.html'
              pdf_bytes, download_meta, pdf_url = fetch_pdf(art, detail_page)
              destination = ROOT / spec['filename']
              destination.write_bytes(pdf_bytes)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < spec['min_pages']:
                  raise RuntimeError(f'Too few pages {destination.name}: {pages}')

              extracted = ''
              for page in reader.pages[:min(20, pages)]:
                  try:
                      extracted += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              identity_terms = [COMPANY_SHORT, STOCK_CODE, *COMPANY_FULL_NAMES]
              identity_ok = any(term in extracted for term in identity_terms)
              if not identity_ok:
                  raise RuntimeError(f'Issuer mismatch: {destination.name}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = PREVIEWS / f'{index:02d}'
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(destination), str(preview_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'Preview failed: {destination.name}')

              sha256 = hashlib.sha256(pdf_bytes).hexdigest()
              manifest.append({
                  **spec,
                  'announcement_title': row.get('title'),
                  'announcement_date': row.get('display_time'),
                  'art_code': art,
                  'announcement_detail_page': detail_page,
                  'mirror_pdf_url': pdf_url,
                  'official_cninfo_index': f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={STOCK_CODE}',
                  'official_szse_profile': f'https://www.szse.cn/disclosure/listed/notice/index.html?stock={STOCK_CODE}',
                  'actual_pages': pages,
                  'bytes': len(pdf_bytes),
                  'sha256': sha256,
                  'identity_text_check': identity_ok,
                  'download_meta': download_meta,
                  'validation': [
                      'PDF header', 'announcement title', 'issuer identity', 'page count',
                      'qpdf structure', 'first-page render'
                  ],
              })

          readme = [
              '健帆生物（300529.SZ）2020-2025年年度报告及最新季报资料包',
              '整理日期：2026-10-15',
              '',
              '本包收录2020年至2025年六份完整年度报告，以及截至整理日最新已正式披露的独立季度报告。',
              '年度报告均为全文，不以年度报告摘要替代；如存在修订版或更正后版本，优先收录最新修订文件。',
              '半年度报告不属于“季报”，因此未混入本标准包。',
              '',
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f'{index}. {item["filename"]}',
                  f'   公告标题：{item["announcement_title"]}',
                  f'   公告日期：{item["announcement_date"]}；页数：{item["actual_pages"]}',
                  f'   公告页面：{item["announcement_detail_page"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
          readme += [
              '来源说明：PDF取自公开公告镜像，并按证券代码、公司名称、公告标题和报告年份逐一核验。',
              '核验项目：PDF文件头、公告标题、公司名称/证券代码、页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]

          (ROOT / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'candidate_selection_log.json').write_text(json.dumps(candidate_logs, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'announcement_search_pages.json').write_text(json.dumps(search_pages, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),
              encoding='utf-8',
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for file_path in sorted(ROOT.rglob('*')):
                  if file_path.is_file():
                      archive.write(file_path, arcname=f'{PACKAGE}/{file_path.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              pdf_files = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad_file or len(pdf_files) != 7:
                  raise RuntimeError(f'ZIP validation failed bad={bad_file} pdfs={len(pdf_files)}')

          alias_path = Path('jianfan_300529_2020_2025_annual_latest_quarterly.zip')
          alias_path.write_bytes(zip_path.read_bytes())
          zip_sha256 = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', zip_sha256)
          print('LATEST_QUARTER', quarter_period, quarter_label)
          print('TOTAL_PAGES', sum(item['actual_pages'] for item in manifest))
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: jianfan-300529-annual-reports-final
          path: |
            健帆生物_300529_2020-2025年报及最新季报.zip
            jianfan_300529_2020_2025_annual_latest_quarterly.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
