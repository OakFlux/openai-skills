name: Temporary 299sucai link probe

on:
  push:
    branches:
      - tmp/china-everbright-sgpjbg-probe-20260831
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Inspect links and scripts
        shell: bash
        run: |
          python - <<'PY'
          import json,re,urllib.parse,requests
          from bs4 import BeautifulSoup
          u='https://299sucai.com/hybg/11983/'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://299sucai.com/'})
          r=s.get(u,timeout=60); r.encoding=r.apparent_encoding or r.encoding or 'utf-8'; html=r.text
          print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
          print('TITLE',BeautifulSoup(html,'lxml').title,flush=True)
          terms=['中国光大控股','百度网盘','夸克网盘','提取码','下载','pan.baidu','drive.uc','cloud.189','aliyundrive','lanzou','pay','会员','11983']
          for term in terms:
              poses=[m.start() for m in re.finditer(re.escape(term),html,re.I)]
              print('TERM',term,'COUNT',len(poses),flush=True)
              for p in poses[:10]: print('SNIP',term,html[max(0,p-1500):p+3500],flush=True)
          soup=BeautifulSoup(html,'lxml')
          for a in soup.find_all('a',href=True):
              href=urllib.parse.urljoin(r.url,a['href']); text=a.get_text(' ',strip=True)
              if any(k in href.lower() for k in ['pan.baidu','drive.uc','aliyundrive','cloud.189','lanzou','download','pay','vip','11983','login']) or any(k in text for k in ['下载','网盘','购买','获取','会员']):
                  print('A',repr(text),href,json.dumps(dict(a.attrs),ensure_ascii=False),flush=True)
          for tag in soup.find_all(['form','input','button','script']):
              blob=(str(tag)+tag.get_text(' ',strip=True)).lower()
              if any(k in blob for k in ['download','pay','pan.baidu','提取码','vip','11983','ajax','nonce','token']):
                  print('TAG',tag.name,str(tag)[:12000],flush=True)
          # all outbound and data attributes
          out=[]
          for tag in soup.find_all(True):
              for key,val in tag.attrs.items():
                  vals=val if isinstance(val,list) else [val]
                  for v in vals:
                      sv=str(v)
                      if any(k in sv.lower() for k in ['http','download','pay','pan','cloud','drive','token','nonce']): out.append((tag.name,key,sv,tag.get_text(' ',strip=True)[:100]))
          print('OUT_ATTRS',json.dumps(out,ensure_ascii=False,indent=2)[:80000],flush=True)
          # WordPress JSON API probes
          for api in [
            'https://299sucai.com/wp-json/wp/v2/search?search=11983',
            'https://299sucai.com/wp-json/wp/v2/posts?slug=11983',
            'https://299sucai.com/wp-json/wp/v2/hybg?slug=11983',
            'https://299sucai.com/wp-json/wp/v2/posts?search=中国光大控股&per_page=10',
          ]:
              try:
                  x=s.get(api,timeout=30); print('API',x.status_code,len(x.content),x.url,x.text[:30000],flush=True)
              except Exception as e: print('API_ERR',api,repr(e),flush=True)
          PY