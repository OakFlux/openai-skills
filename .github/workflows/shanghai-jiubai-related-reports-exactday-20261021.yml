name: Exact-day lookup Shanghai Jiubai related reports

on:
  push:
    paths:
      - '.github/workflows/shanghai-jiubai-related-reports-exactday-20261021.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - run: python -m pip install --quiet requests
      - name: Search exact publication dates
        shell: bash
        run: |
          python - <<'PY'
          import requests,json
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          for d in ['2022-05-02','2022-05-03','2022-05-30','2022-05-31']:
            for qtype in ['0','1','2']:
              allrows=[]
              for page in range(1,8):
                p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':d,'endTime':d,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                r=s.get(api,params=p,timeout=(15,60))
                if r.status_code!=200:break
                payload=r.json();data=payload.get('data') or []
                if isinstance(data,dict):data=data.get('list') or data.get('data') or []
                allrows.extend(data)
                total=int(payload.get('TotalPage') or 1)
                if page>=total or len(data)<100:break
              found=[]
              for row in allrows:
                title=str(row.get('title') or '')
                if any(x in title for x in ['复工复产','恢复营业','本地商业股','修复机会']):
                  found.append({k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']})
              if found:print('DATE',d,'QTYPE',qtype,json.dumps(found,ensure_ascii=False,indent=2))
          PY
