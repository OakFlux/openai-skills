name: Archive Sina Henghe report page sources

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-sina-source-archive-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch pages and linked scripts
        run: |
          python - <<'PY'
          import json, re, requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          out=Path('out'); out.mkdir()
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://stock.finance.sina.com.cn/'})
          ids=['740567795901','548839599653','524851845385','763337834029','820241551050']
          manifest=[]
          scripts=set()
          for rid in ids:
            url=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml'
            r=s.get(url,timeout=60); print('PAGE',rid,r.status_code,len(r.content),r.url,r.headers.get('content-type')); r.raise_for_status()
            r.encoding=r.apparent_encoding or 'gb18030'
            path=out/f'{rid}.html'; path.write_text(r.text,encoding='utf-8')
            soup=BeautifulSoup(r.text,'html.parser')
            meta={'rptid':rid,'url':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '','scripts':[],'links':[]}
            for tag in soup.find_all(['script','link','iframe','a','form']):
              attr='src' if tag.name in ('script','iframe') else ('href' if tag.name in ('link','a') else 'action')
              val=tag.get(attr)
              if not val: continue
              full=urljoin(r.url,val)
              item={'tag':tag.name,'attr':attr,'url':full,'text':' '.join(tag.get_text(' ',strip=True).split())[:500]}
              if tag.name=='script':
                meta['scripts'].append(item); scripts.add(full)
              else: meta['links'].append(item)
            manifest.append(meta)
          for i,url in enumerate(sorted(scripts)):
            try:
              r=s.get(url,timeout=60); print('SCRIPT',i,r.status_code,len(r.content),url,r.headers.get('content-type'))
              if r.status_code==200 and len(r.content)<5_000_000:
                name=re.sub(r'[^A-Za-z0-9._-]+','_',urlparse(url).path.rsplit('/',1)[-1] or f'script_{i}.js')
                (out/f'{i:03d}_{name}').write_bytes(r.content)
            except Exception as e: print('SCRIPT_ERROR',url,repr(e))
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          for p in out.iterdir():
            if p.is_file():
              text=p.read_text('utf-8',errors='ignore')
              hits=[]
              for pat in ['pdf','download','rptid','vReport','report','研报','附件','原文','fileUrl','attach','docUrl']:
                if pat.lower() in text.lower(): hits.append(pat)
              print('FILE',p.name,p.stat().st_size,'HITS',hits)
          PY
      - name: Upload sources
        uses: actions/upload-artifact@v4
        with:
          name: henghe-300539-sina-source-archive-20261021
          path: out
          compression-level: 6
          retention-days: 7
