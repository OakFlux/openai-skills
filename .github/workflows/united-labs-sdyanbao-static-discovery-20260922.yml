name: Static inspect United Laboratories report pages 20260922

on:
  push:
    paths:
      - '.github/workflows/united-labs-sdyanbao-static-discovery-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install parsers
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect pages and scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,re,json,html,time
          from pathlib import Path
          from urllib.parse import urljoin,urlparse
          from bs4 import BeautifulSoup
          targets={
            'dongwu':'https://www.sdyanbao.com/detail/902006',
            'cmschina':'https://www.sdyanbao.com/detail/920346',
            'qingbaoyuan':'https://m.qingbaoyuan.vip/doc/142469/',
            'baogaobox':'https://www.baogaobox.com/reports/250730000070021.html',
          }
          s=requests.Session();s.trust_env=False;s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          results={}
          for name,u in targets.items():
            try:
              r=s.get(u,timeout=(30,120),allow_redirects=True)
              text=r.content.decode('utf-8','replace')
              Path(f'out/{name}.html').write_text(text,encoding='utf-8')
              soup=BeautifulSoup(text,'lxml')
              scripts=[]; links=[]; candidates=set()
              for tag in soup.find_all(['script','a','iframe','embed','object','img','source']):
                for attr in ('src','href','data','data-src','data-url','download-url'):
                  v=tag.get(attr)
                  if v:
                    h=urljoin(r.url,html.unescape(v))
                    links.append({'tag':tag.name,'attr':attr,'url':h,'text':tag.get_text(' ',strip=True)[:200]})
                    if tag.name=='script' and attr=='src': scripts.append(h)
                    if any(k in h.lower() for k in ('pdf','download','file','report','preview','oss','cos','api')): candidates.add(h)
              pats=[
                r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',
                r'["\']([^"\']*(?:download|down|file|pdf|report|preview|resource|attachment|api)[^"\']*)["\']',
                r'(?:fileUrl|file_url|pdfUrl|pdf_url|downloadUrl|download_url|reportUrl|resourceUrl|url)\s*[:=]\s*["\']([^"\']+)["\']',
              ]
              for pat in pats:
                for m in re.finditer(pat,text,re.I):
                  v=m.group(1) if m.lastindex else m.group(0)
                  v=html.unescape(v).replace('\\/','/')
                  candidates.add(urljoin(r.url,v))
              script_records=[]
              for i,su in enumerate(sorted(set(scripts))[:40]):
                try:
                  sr=s.get(su,timeout=(20,90),allow_redirects=True)
                  if sr.status_code==200 and len(sr.content)<15_000_000:
                    st=sr.content.decode('utf-8','replace')
                    Path(f'out/{name}_script_{i:02d}.js').write_text(st,encoding='utf-8')
                    hits=[]
                    for pat in pats:
                      for m in re.finditer(pat,st,re.I):
                        v=m.group(1) if m.lastindex else m.group(0)
                        v=html.unescape(v).replace('\\/','/')
                        h=urljoin(sr.url,v)
                        if any(k in h.lower() for k in ('pdf','download','file','report','preview','oss','cos','api')):
                          hits.append(h); candidates.add(h)
                    script_records.append({'url':su,'status':sr.status_code,'bytes':len(sr.content),'hits':sorted(set(hits))[:500]})
                except Exception as e:
                  script_records.append({'url':su,'error':repr(e)})
              results[name]={'input':u,'status':r.status_code,'final':r.url,'content_type':r.headers.get('content-type',''),'bytes':len(r.content),'title':soup.title.get_text(' ',strip=True) if soup.title else '', 'scripts':scripts,'links':links,'candidates':sorted(candidates),'script_records':script_records}
            except Exception as e:
              results[name]={'input':u,'error':repr(e)}
          Path('out/results.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
          grep -RInE 'https?[^[:space:]"'\''<>]+\.pdf|downloadUrl|download_url|fileUrl|file_url|pdfUrl|pdf_url|/api/|report.*download|download.*report' out > out/grep_hits.txt || true
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > out/file_sizes.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: united-labs-sdyanbao-static-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
