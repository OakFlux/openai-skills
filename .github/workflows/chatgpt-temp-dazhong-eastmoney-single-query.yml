name: chatgpt-temp-dazhong-eastmoney-single-query
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-dazhong-eastmoney-single-query.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query exact stock-report endpoint
        shell: bash
        run: |
          python - <<'PY'
          import json,time,urllib.parse,urllib.request
          from pathlib import Path
          W=Path('dazhong_single_query');W.mkdir(exist_ok=True)
          bases=['https://reportapi.eastmoney.com/report/list','https://reportapi.eastmoney.com/report/jg']
          variants=[]
          for code in ['600635','600635.SH','01635']:
            for begin,end in [('2010-01-01','2026-09-07'),('2022-01-01','2024-01-01'),('2016-01-01','2019-01-01')]:
              for page_size in [50,500,1000]:
                variants.append({'code':code,'beginTime':begin,'endTime':end,'pageSize':page_size,'pageNo':1,'qType':0,'industryCode':'*','industry':'*','rating':'*','ratingchange':'*','ratingChange':'*','fields':'','orgCode':'','rcode':'','cb':'showData'})
          out=[]
          for base in bases:
            for p in variants:
              u=base+'?'+urllib.parse.urlencode(p)
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/600635.html','Accept':'application/json,text/javascript,*/*'})
              try:
                with urllib.request.urlopen(req,timeout=60) as r:b=r.read()
                t=b.decode('utf-8','ignore');print('QUERY',u,'bytes',len(b),'head',t[:500].replace('\n',' '),flush=True)
                item={'url':u,'bytes':len(b),'text':t}
              except Exception as e:
                print('ERROR',u,repr(e),flush=True);item={'url':u,'error':repr(e)}
              out.append(item)
          W.joinpath('responses.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Dazhong-Eastmoney-Single-Query
          path: dazhong_single_query
          retention-days: 1
          compression-level: 6
