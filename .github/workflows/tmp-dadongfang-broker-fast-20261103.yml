name: Build Dadongfang broker reports fast

on:
  push:
    branches:
      - tmp-dadongfang-broker-fast-20261103

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='大东方_600327_券商深度报告'
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE" /tmp/ddf_render

          python3 - <<'PY'
          from __future__ import annotations
          import concurrent.futures, hashlib, json, re
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out=Path('大东方_600327_券商深度报告')
          reports=[
            dict(order=1,broker='华安证券',date='2022-04-17',title='夯实存量挖掘增量，零售+医疗双轮驱动',filename='01_华安证券_夯实存量挖掘增量零售医疗双轮驱动_2022-04-17.pdf',min_pages=30,url='https://pdf.dfcfw.com/pdf/H3_AP202204181559970208_1.pdf?1650280142000.pdf=',info='https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=600327'),
            dict(order=2,broker='浙商证券',date='2024-02-23',title='向宽而行，打造连锁儿科生态圈',filename='02_浙商证券_向宽而行打造连锁儿科生态圈_2024-02-23.pdf',min_pages=20,url='https://aigc.idigital.com.cn/djyanbao/%E3%80%90%E6%B5%99%E5%95%86%E8%AF%81%E5%88%B8%E3%80%91%E5%A4%A7%E4%B8%9C%E6%96%B9%EF%BC%88600327%EF%BC%89%E9%A6%96%E6%AC%A1%E8%A6%86%E7%9B%96%E6%8A%A5%E5%91%8A%EF%BC%9A%E5%90%91%E5%AE%BD%E8%80%8C%E8%A1%8C%EF%BC%8C%E6%89%93%E9%80%A0%E8%BF%9E%E9%94%81%E5%84%BF%E7%A7%91%E7%94%9F%E6%80%81%E5%9C%88-2024-02-26.pdf',info='https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/company/rptid/762257628514/index.phtml'),
            dict(order=3,broker='中泰证券',date='2024-06-27',title='无锡零售巨头发力儿科医疗，第二成长曲线逐步兑现',filename='03_中泰证券_无锡零售巨头发力儿科医疗第二成长曲线逐步兑现_2024-06-27.pdf',min_pages=25,url='https://file.iyanbao.com/pdf/a38f0-9706dcd8-f162-4ef1-add2-2a33f360b73c.pdf',info='https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=600327'),
          ]

          def fetch(r):
              s=requests.Session(); s.trust_env=False
              s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Referer':r['info']})
              resp=s.get(r['url'],timeout=(20,90),allow_redirects=True)
              data=resp.content
              if resp.status_code!=200 or not data.startswith(b'%PDF-') or len(data)<100000:
                  raise RuntimeError(f"HTTP={resp.status_code} bytes={len(data)} type={resp.headers.get('content-type')}")
              path=out/r['filename']; path.write_bytes(data)
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages)
              if pages<r['min_pages']: raise RuntimeError(f'pages={pages}')
              text=''
              for p in reader.pages:
                  try: text += '\n'+(p.extract_text() or '')
                  except Exception: pass
              compact=re.sub(r'\s+','',text)
              if '大东方' not in compact and '600327' not in compact: raise RuntimeError('company mismatch')
              key=r['broker'].replace('证券','')
              if r['broker'] not in compact and key not in compact: raise RuntimeError('broker mismatch')
              sha=hashlib.sha256(data).hexdigest()
              print('DOWNLOADED',r['broker'],r['title'],'pages=',pages,'bytes=',len(data),'source=',resp.url,'sha256=',sha)
              return {**r,'pages':pages,'bytes':len(data),'source':resp.url,'sha256':sha}

          records=[]; failures=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              futs={ex.submit(fetch,r):r for r in reports}
              for f,r in futs.items():
                  try: records.append(f.result())
                  except Exception as e:
                      (out/r['filename']).unlink(missing_ok=True)
                      failures.append({**r,'error':repr(e)})
                      print('SKIPPED',r['broker'],repr(e))
          if len(records)<2: raise RuntimeError(f'only {len(records)} valid reports: {failures!r}')
          records.sort(key=lambda x:x['order'])
          lines=['大东方（600327）券商深度报告资料包','整理日期：2026-11-03','',f'共收录{len(records)}份公开可下载且通过校验的完整PDF。','未使用网页摘要、预览截图或重新排版文件。','','文件清单：']
          sums=[]; tp=0; tb=0
          for i,x in enumerate(records,1):
              tp+=x['pages']; tb+=x['bytes']
              lines += [f"{i}. {x['broker']}｜{x['title']}",f"   报告日期：{x['date']}",f"   页数：{x['pages']}页",f"   文件：{x['filename']}",f"   原始PDF：{x['source']}",f"   信息页：{x['info']}",f"   SHA-256：{x['sha256']}",'']
              sums.append(f"{x['sha256']}  {x['filename']}")
          if failures:
              lines += ['未纳入候选：']+[f"- {x['broker']}｜{x['title']}：公开附件下载或校验未通过。" for x in failures]+['']
          lines += [f'合计：{len(records)}份PDF，{tp}页，{tb}字节。','资料仅供研究参考，不构成投资建议。']
          (out/'00_文件清单与来源说明.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          (out/'_metadata.json').write_text(json.dumps({'records':records,'failures':failures},ensure_ascii=False,indent=2),encoding='utf-8')
          print('\n'.join(lines))
          PY

          count=$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)
          test "$count" -ge 2 && test "$count" -le 3
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            set +e; qpdf --check "$pdf" >"$pdf.qpdf" 2>&1; rc=$?; set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 20
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '大东方|600327' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/ddf_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/ddf_test.zip "$PACKAGE"
          unzip -t /tmp/ddf_test.zip >/dev/null
          rm -f /tmp/ddf_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Dadongfang-600327-broker-deep-reports-fast
          path: 大东方_600327_券商深度报告/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
