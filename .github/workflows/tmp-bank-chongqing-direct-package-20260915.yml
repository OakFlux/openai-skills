name: Repackage Bank of Chongqing direct archive
on:
  push:
    branches:
      - tmp-bank-chongqing-reports-20260915
permissions:
  contents: read
  actions: read
jobs:
  repackage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download and unwrap prior verified artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p outer package
          curl --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o verified-artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10384104174/zip"
          unzip -q verified-artifact.zip -d outer
          test -f outer/CQBankReports.zip
          unzip -q outer/CQBankReports.zip -d package
          python - <<'PY'
          from pathlib import Path
          import json, zipfile

          package = Path('package')
          pdfs = sorted(package.glob('*.pdf'))
          if len(pdfs) != 8:
              raise RuntimeError(f'Expected 8 PDFs, found {len(pdfs)}: {[p.name for p in pdfs]}')
          required = ['README.txt', '文件清单与校验值.csv', '验证记录.json']
          missing = [name for name in required if not (package / name).exists()]
          if missing:
              raise RuntimeError(f'Missing metadata files: {missing}')
          # Re-open each PDF sufficiently to verify header/trailer through zip-free file checks.
          for pdf in pdfs:
              data = pdf.read_bytes()
              if b'%PDF-' not in data[:2048] or len(data) < 100000:
                  raise RuntimeError(f'Invalid PDF payload: {pdf.name}')
          print(json.dumps({
              'pdf_count': len(pdfs),
              'files': [p.name for p in pdfs],
              'metadata': required,
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload direct downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: cqbank-reports-direct
          path: package/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
