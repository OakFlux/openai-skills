name: Discover Yangnong Chemical brokerage reports 20261016
on:
  push:
    paths:
      - '.github/workflows/yangnong-600486-broker-discover-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query Eastmoney public research API
        run: |
          python - <<'PY'
          import json, requests
          url = 'https://reportapi.eastmoney.com/report/list'
          params = {
              'industryCode':'*','pageSize':'100','industry':'*',
              'rating':'*','ratingChange':'*','beginTime':'2015-01-01',
              'endTime':'2030-01-01','pageNo':'1','fields':'','qType':'0',
              'orgCode':'','code':'600486','rcode':'','p':'1',
              'pageNum':'1','pageNumber':'1'
          }
          headers = {'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'}
          r = requests.get(url, params=params, headers=headers, timeout=30)
          print('STATUS', r.status_code, r.url)
          r.raise_for_status()
          data = r.json()
          rows = data.get('data') or []
          print('HITS', data.get('hits'), 'ROWS', len(rows))
          for i, rec in enumerate(rows, 1):
              out = {k: rec.get(k) for k in [
                  'infoCode','title','publishDate','orgSName','orgName','researcher',
                  'emRatingName','ratingName','ratingChange','attachPages','attachSize',
                  'stockCode','stockName','industryName','reportType'
              ]}
              print('REPORT', i, json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY
