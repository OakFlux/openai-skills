name: Discover Hipine historical filings

on:
  push:
    branches:
      - tmp-hipine-filings-20260914

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Discover URLs and brute-force adjacent Sina IDs
        shell: bash
        run: |
          cat > /tmp/discover.py <<'PY'
          from __future__ import annotations
          import concurrent.futures as cf
          import io, json, re, sys
          from urllib.parse import urljoin, quote
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})

          print('=== NEEQ page source and scripts ===', flush=True)
          starts=[
            'https://www.neeq.com.cn/disclosure/companies_announcement.html',
            'https://www.neeq.cc/disclosure/companies_announcement.html',
            'https://www.neeq.cc/m/company/info_public.html',
            'https://www.neeq.com.cn/',
          ]
          for u in starts:
            try:
              r=S.get(u,timeout=30); print('PAGE',u,r.status_code,r.url,len(r.content),r.headers.get('content-type'))
              txt=r.text
              for line in txt.splitlines():
                if any(k in line.lower() for k in ('announcement','disclosure','nqxx','query','ajax','api/','.do','companycode')):
                  print('HTMLMATCH',line[:1000])
              soup=BeautifulSoup(txt,'html.parser')
              scripts=[urljoin(r.url,x.get('src')) for x in soup.find_all('script') if x.get('src')]
              print('SCRIPTS',json.dumps(scripts,ensure_ascii=False))
              for su in scripts:
                try:
                  rr=S.get(su,timeout=30)
                  st=rr.text
                  matches=[]
                  for pat in [r'["\']([^"\']*(?:announcement|disclosure|nqxx|company|notice)[^"\']*)["\']',r'["\']([^"\']+\.do[^"\']*)["\']',r'["\']([^"\']+/api/[^"\']*)["\']']:
                    matches += re.findall(pat,st,re.I)
                  if matches: print('JSMATCH',su,len(rr.content),json.dumps(sorted(set(matches))[:100],ensure_ascii=False))
                except Exception as e: print('JSERR',su,repr(e))
            except Exception as e: print('PAGEERR',u,repr(e))

          print('=== Common guessed NEEQ APIs ===')
          candidates=[
            ('GET','https://www.neeq.com.cn/nqxxController/nqxx.do',{'page':1,'companyCode':'873888'}),
            ('GET','https://www.neeq.com.cn/disclosureInfoController/companyAnnouncement.do',{'page':1,'companyCode':'873888'}),
            ('POST','https://www.neeq.com.cn/disclosureInfoController/companyAnnouncement.do',{'page':1,'companyCode':'873888'}),
            ('POST','https://www.neeq.com.cn/nqxxController/nqxx.do',{'page':1,'companyCode':'873888'}),
            ('GET','https://www.neeq.com.cn/info/list.do',{'companyCode':'873888'}),
          ]
          for method,u,data in candidates:
            try:
              r=S.request(method,u,params=data if method=='GET' else None,data=data if method=='POST' else None,timeout=30)
              print('API',method,u,r.status_code,len(r.content),r.headers.get('content-type'),r.text[:1000].replace('\n',' '))
            except Exception as e: print('APIERR',method,u,repr(e))

          print('=== Sina adjacent scan 2023 annual report ===',flush=True)
          base='https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/SBGG/2024/2024-2/2024-02-02/{}.PDF'
          def check(i):
            u=base.format(i)
            try:
              r=S.get(u,timeout=20)
              if r.status_code!=200 or not r.content.startswith(b'%PDF') or len(r.content)<5000: return None
              rd=PdfReader(io.BytesIO(r.content),strict=False)
              text='\n'.join((p.extract_text() or '') for p in rd.pages[:5])
              if '873888' in text or '西普尼' in text or '穿金戴银' in text:
                return {'id':i,'url':u,'bytes':len(r.content),'pages':len(rd.pages),'text':re.sub(r'\s+',' ',text)[:1200]}
            except Exception: pass
            return None
          with cf.ThreadPoolExecutor(max_workers=16) as ex:
            for x in ex.map(check,range(9821150,9821351)):
              if x: print('SINAHIT',json.dumps(x,ensure_ascii=False),flush=True)

          print('=== Search-engine HTML probes ===')
          qs=[
            '"穿金戴银：2018年年度报告"',
            '"穿金戴银：2017年年度报告"',
            '"穿金戴银：2016年年度报告"',
            '"深圳西普尼精密科技股份有限公司2023年年度报告"',
            '"尊尚（深圳）穿金戴银技术股份有限公司公开转让说明书"',
          ]
          for q in qs:
            for engine in [f'https://www.google.com/search?q={quote(q)}',f'https://www.bing.com/search?q={quote(q)}']:
              try:
                r=S.get(engine,timeout=30); print('SEARCH',q,engine,r.status_code,len(r.content))
                urls=re.findall(r'https?://[^\s"<>]+',r.text)
                hits=[u.replace('&amp;','&') for u in urls if any(d in u for d in ('neeq','dfcfw','sina','tianyancha','10jqka','xueqiu','qixin','cninfo'))]
                print('SEARCHHITS',json.dumps(hits[:50],ensure_ascii=False))
              except Exception as e: print('SEARCHERR',q,engine,repr(e))
          PY
          python /tmp/discover.py | tee discover.log
      - uses: actions/upload-artifact@v4
        with:
          name: hipine-discovery-log
          path: discover.log
          retention-days: 3
