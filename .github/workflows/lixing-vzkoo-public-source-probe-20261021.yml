name: Probe Vzkoo bearing report source 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-vzkoo-public-source-probe-20261021.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect public report page and assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,html,urllib.parse
          from bs4 import BeautifulSoup
          urls=[
            'https://www.vzkoo.com/read/20240308f15b7c408ecce00c4fa05de8.html',
            'https://www.sohu.com/a/764778076_121640652',
            'https://caifuhao.eastmoney.com/news/20220601164901472943590',
          ]
          s=requests.Session();s.trust_env=False
          h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'}
          for url in urls:
            print('\n===== PAGE',url)
            try:
              r=s.get(url,headers=h,timeout=(20,120),allow_redirects=True)
              print('STATUS',r.status_code,'BYTES',len(r.content),'CT',r.headers.get('content-type'),'FINAL',r.url)
              text=r.text
              for i,line in enumerate(text.splitlines(),1):
                low=line.lower()
                if any(k in low for k in ['.pdf','download','fileurl','pdfurl','oss','document','preview','sourceurl','20240308f15','轴承','imageurl','pages']):
                  if len(line)<10000: print('LINE',i,line[:9500])
              soup=BeautifulSoup(text,'lxml')
              found=[]
              for tag in soup.find_all(True):
                for attr in ['href','src','data-src','data-url','data-file','data-pdf','content']:
                  v=tag.get(attr)
                  if not v:continue
                  v=html.unescape(str(v))
                  if any(k in v.lower() for k in ['pdf','download','20240308f15','oss','report']):found.append(urllib.parse.urljoin(r.url,v))
              for m in re.findall(r'https?://[^\s"\'<>]+',text):
                m=html.unescape(m)
                if any(k in m.lower() for k in ['pdf','download','20240308f15','oss','report']):found.append(m)
              print('FOUND_URLS',json.dumps(list(dict.fromkeys(found))[:500],ensure_ascii=False,indent=2))
            except Exception as e:print('ERROR',repr(e))
          PY
