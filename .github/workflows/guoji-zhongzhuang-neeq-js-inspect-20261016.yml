name: Inspect NEEQ disclosure search interface 20261016
on:
  push:
    paths:
      - '.github/workflows/guoji-zhongzhuang-neeq-js-inspect-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect disclosure page and scripts
        run: |
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          base='https://www.neeq.com.cn/disclosure/examine.html'
          r=s.get(base,timeout=30); print('PAGE',r.status_code,r.url,'LEN',len(r.text)); print(r.text[:3000])
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',r.text,re.I)
          print('SCRIPTS',scripts)
          for src in scripts:
              u=urljoin(base,src)
              try:
                  rr=s.get(u,timeout=30); txt=rr.text
                  if any(k in txt for k in ('infoResult.do','companyCd','disclosureType')):
                      print('\nMATCH_SCRIPT',u,'STATUS',rr.status_code,'LEN',len(txt))
                      for pat in ['infoResult.do','companyCd','disclosureType','isNewThree','xxfcbj']:
                          pos=0
                          while True:
                              pos=txt.find(pat,pos)
                              if pos<0: break
                              print('CONTEXT',pat,repr(txt[max(0,pos-300):pos+600]))
                              pos+=len(pat)
              except Exception as exc:
                  print('ERR',u,repr(exc))
          PY
