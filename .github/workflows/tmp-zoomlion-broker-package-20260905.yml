name: Temporary Zoomlion broker research archive

on:
  push:
    branches:
      - tmp-zoomlion-broker-reports-20260905

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download, validate, render, and package reports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf pymupdf pillow
          python - <<'PY'
          import csv
          import hashlib
          import io
          import re
          import time
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader

          root = Path.cwd()
          reports_dir = root / 'reports'
          output_dir = root / 'output'
          qa_dir = root / 'qa'
          for folder in (reports_dir, output_dir, qa_dir):
              folder.mkdir(exist_ok=True)

          reports = [
              {
                  'filename': '01_华安证券_中联重科_国际化成果显著新兴业务高速发展_20240607_19页.pdf',
                  'broker': '华安证券',
                  'date': '2024-06-07',
                  'title': '国际化成果显著，新兴业务高速发展',
                  'info_code': 'AP202406071635859741',
                  'min_pages': 18,
                  'expected_pages': 19,
                  'label': 'Huaan 2024 (19 pages)',
              },
              {
                  'filename': '02_国金证券_中联重科_行业筑底出口高增行业巨头再启航_20230731_22页.pdf',
                  'broker': '国金证券',
                  'date': '2023-07-31',
                  'title': '行业筑底、出口高增，行业巨头再启航',
                  'info_code': 'AP202307311592916107',
                  'min_pages': 20,
                  'expected_pages': 22,
                  'label': 'Guojin 2023 (22 pages)',
              },
              {
                  'filename': '03_东吴证券_中联重科_三年业绩预计翻倍估值向上大幅修正_20200701_38页.pdf',
                  'broker': '东吴证券',
                  'date': '2020-07-01',
                  'title': '三年业绩预计翻倍，估值向上大幅修正',
                  'info_code': 'AP202007011388657661',
                  'min_pages': 35,
                  'expected_pages': 38,
                  'label': 'Dongwu 2020 (38 pages)',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Referer': 'https://data.eastmoney.com/',
              'Connection': 'keep-alive',
          })

          def info_url(item):
              return f"https://data.eastmoney.com/report/info/{item['info_code']}.html"

          def candidate_urls(item):
              code = item['info_code']
              return [
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?download=1',
              ]

          def download_report(item):
              errors = []
              try:
                  session.get(info_url(item), timeout=30)
              except Exception:
                  pass
              for url in candidate_urls(item):
                  for attempt in range(1, 5):
                      try:
                          print(f"Downloading {item['filename']} url={url} attempt={attempt}", flush=True)
                          response = session.get(url, timeout=(30, 300), allow_redirects=True)
                          data = response.content
                          if response.status_code >= 400:
                              raise RuntimeError(f'HTTP {response.status_code}')
                          if len(data) < 100000:
                              raise RuntimeError(f'file too small: {len(data)} bytes')
                          if b'%PDF-' not in data[:1024]:
                              raise RuntimeError(f"not PDF: content-type={response.headers.get('content-type')}, head={data[:60]!r}")
                          return data, response.url
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc}')
                          time.sleep(attempt * 2)
              raise RuntimeError(f"Unable to download {item['filename']}: {errors}")

          manifest_rows = []
          covers = []
          for item in reports:
              raw, final_url = download_report(item)
              reader = PdfReader(io.BytesIO(raw), strict=False)
              pages = len(reader.pages)
              if pages < item['min_pages']:
                  raise RuntimeError(f"{item['filename']}: only {pages} pages; expected >= {item['min_pages']}")

              pdf = pymupdf.open(stream=raw, filetype='pdf')
              first_text = re.sub(r'\s+', '', pdf.load_page(0).get_text('text'))
              if '中联重科' not in first_text:
                  raise RuntimeError(f"{item['filename']}: first page does not identify 中联重科")
              pix = pdf.load_page(0).get_pixmap(matrix=pymupdf.Matrix(1.35, 1.35), alpha=False)
              cover_path = qa_dir / f"{item['broker']}_{item['date']}.png"
              pix.save(str(cover_path))
              pdf.close()

              path = reports_dir / item['filename']
              path.write_bytes(raw)
              sha = hashlib.sha256(raw).hexdigest()
              manifest_rows.append({
                  '文件名': item['filename'],
                  '券商': item['broker'],
                  '发布日期': item['date'],
                  '报告标题': item['title'],
                  'PDF页数': pages,
                  '东方财富标注页数': item['expected_pages'],
                  '文件大小（字节）': len(raw),
                  'SHA256': sha,
                  '研报信息页': info_url(item),
                  'PDF原始来源': final_url,
              })
              covers.append((item['label'], cover_path))
              print(f"VALID {item['filename']}: pages={pages}, bytes={len(raw)}, sha256={sha}", flush=True)

          manifest_path = reports_dir / '文件清单与校验值.csv'
          with manifest_path.open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(manifest_rows[0].keys()))
              writer.writeheader()
              writer.writerows(manifest_rows)

          readme_path = reports_dir / 'README.txt'
          readme_path.write_text(
              '中联重科股份有限公司（000157.SZ / 01157.HK）券商深度报告资料包\n\n'
              '包含3份完整券商公司深度报告：\n'
              '1. 华安证券，2024-06-07，19页：《国际化成果显著，新兴业务高速发展》；\n'
              '2. 国金证券，2023-07-31，22页：《行业筑底、出口高增，行业巨头再启航》；\n'
              '3. 东吴证券，2020-07-01，38页：《三年业绩预计翻倍，估值向上大幅修正》。\n\n'
              '选择标准：优先公司深度、首次覆盖或篇幅较长的系统性研究，排除3-5页年报、季报和事件点评。\n'
              '来源：东方财富研报中心所链接的券商PDF原文。\n'
              '校验：全部PDF已检查文件头、可解析性、实际页数、首页公司名称和SHA-256；压缩包已执行CRC完整性测试。\n'
              '提示：研报中的盈利预测、目标价和投资评级均对应报告发布时点，不代表当前观点。\n',
              encoding='utf-8'
          )

          tile_w, tile_h = 430, 610
          thumbs = []
          for label, cover_path in covers:
              image = Image.open(cover_path).convert('RGB')
              image.thumbnail((tile_w - 30, tile_h - 80), Image.Resampling.LANCZOS)
              canvas = Image.new('RGB', (tile_w, tile_h), 'white')
              canvas.paste(image, ((tile_w - image.width) // 2, 10))
              ImageDraw.Draw(canvas).text((15, tile_h - 55), label, fill='black')
              thumbs.append(canvas)
          sheet = Image.new('RGB', (tile_w * len(thumbs), tile_h), 'white')
          for index, thumb in enumerate(thumbs):
              sheet.paste(thumb, (index * tile_w, 0))
          sheet.save(output_dir / '中联重科_券商深度报告_首页核验图.jpg', quality=92)

          archive_path = output_dir / '中联重科_000157_券商深度报告_3份.zip'
          with zipfile.ZipFile(archive_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(reports_dir.iterdir(), key=lambda p: p.name):
                  archive.write(path, arcname=path.name)

          with zipfile.ZipFile(archive_path, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              names = archive.namelist()
              pdf_count = sum(name.lower().endswith('.pdf') for name in names)
              if pdf_count != 3:
                  raise RuntimeError(f'Expected 3 PDFs, got {pdf_count}: {names}')

          (output_dir / '文件清单与校验值.csv').write_bytes(manifest_path.read_bytes())
          (output_dir / 'README.txt').write_bytes(readme_path.read_bytes())
          print(f'ARCHIVE_READY={archive_path}', flush=True)
          print(f'ARCHIVE_SIZE={archive_path.stat().st_size}', flush=True)
          print('PDF_COUNT=3', flush=True)
          PY

      - name: Upload archive and QA files
        uses: actions/upload-artifact@v4
        with:
          name: zoomlion-broker-reports-archive
          path: output/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
