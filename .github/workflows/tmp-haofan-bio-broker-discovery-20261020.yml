name: Discover Haofan Bio broker reports

on:
  push:
    branches: [tmp-haofan-bio-broker-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-bio-broker-discovery-20261020.yml']

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query public broker report index
        shell: bash
        run: |
          set -euo pipefail
          curl --http1.1 -fL --retry 6 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -A 'Mozilla/5.0' \
            -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=301393' \
            'https://reportapi.eastmoney.com/report/list?cb=datatable4263982&industryCode=*&pageSize=500&industry=*&rating=*&ratingChange=*&beginTime=2010-01-01&endTime=2026-10-20&pageNo=1&fields=&qType=0&orgCode=&code=301393&rcode=' \
            -o reports.jsonp
          python3 - <<'PY'
          import json, re
          text=open('reports.jsonp',encoding='utf-8').read()
          payload=json.loads(re.sub(r'^datatable\d*\(|\)$','',text))
          rows=payload.get('data') or []
          print('HITS',payload.get('hits'),'SIZE',payload.get('size'),'ROWS',len(rows))
          rows.sort(key=lambda r:r.get('publishDate') or '',reverse=True)
          for r in rows:
              print('\t'.join([
                  str(r.get('publishDate',''))[:10],
                  str(r.get('orgSName') or r.get('orgName') or ''),
                  str(r.get('attachPages') or 0),
                  str(r.get('infoCode') or ''),
                  str(r.get('reportType') or r.get('column') or ''),
                  str(r.get('ratingName') or r.get('emRatingName') or ''),
                  str(r.get('title') or ''),
              ]))
          PY
