name: Package Ascletis Pharma financial reports v4

on:
  push:
    branches:
      - chatgpt-ascletis-financial-reports-20260906
    paths:
      - '.github/workflows/package-ascletis-financial-reports-v4-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf fonttools
      - name: Download, validate and package reports
        run: |
          set -o pipefail
          python scripts/package_ascletis_financial_reports_v4b_20260906.py 2>&1 | tee ascletis_packaging_v4.log
      - name: Upload report package
        uses: actions/upload-artifact@v4
        with:
          name: ascletis-financial-reports-v4-20260906
          path: |
            Ascletis_Financial_Reports_2020_2025.zip
            歌礼制药_2020-2025年报及最新季报.zip
            PACKAGE_SHA256.txt
            ascletis_packaging_v4.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ascletis-financial-reports-v4-diagnostics
          path: |
            ascletis_packaging_v4.log
            _work_ascletis_financial/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
