name: Inspect Qianzhan Dongbei B PDF links

on:
  push:
    paths:
      - '.github/workflows/qianzhan-dongbei-pdf-link-inspect-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Inspect source
        run: |
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://stock.qianzhan.com/hs/sourcefiles_900956.SH.html'
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://stock.qianzhan.com/'})
          r=s.get(url,timeout=60);print('PAGE',r.status_code,len(r.content),r.url,r.headers.get('content-type'));r.raise_for_status();r.encoding=r.apparent_encoding or 'utf-8';text=r.text
          soup=BeautifulSoup(text,'lxml')
          for tr in soup.find_all('tr'):
            row=' '.join(tr.get_text(' ',strip=True).split())
            if any(y in row for y in ('1999','2000','2001','2002','2003','2004','2005')):
              print('ROW_TEXT',row)
              print('ROW_HTML',str(tr)[:5000])
          for a in soup.find_all(['a','button','input'],href=True):
            label=' '.join(a.get_text(' ',strip=True).split())
            href=urljoin(r.url,a.get('href'))
            if '下载' in label or any(k in href.lower() for k in ('pdf','source','download','file')):
              print('LINK',json.dumps({'label':label,'href':href,'attrs':dict(a.attrs)},ensure_ascii=False))
          for tag in soup.find_all(['a','button','input']):
            attrs=dict(tag.attrs); raw=json.dumps(attrs,ensure_ascii=False)
            if any(k in raw.lower() for k in ('download','pdf','file','source')):
              print('TAG',tag.name,raw[:3000],'TEXT',' '.join(tag.get_text(' ',strip=True).split())[:500])
          for script in soup.find_all('script'):
            src=script.get('src')
            if src: print('SCRIPT_SRC',urljoin(r.url,src))
            body=script.get_text('\n')
            if any(k in body.lower() for k in ('download','sourcefile','pdf','fileurl','report')):
              print('SCRIPT_BODY',body[:15000])
          pats=[r'https?://[^\"\'<>\s]+',r'[\"\']([^\"\']*(?:pdf|download|sourcefile)[^\"\']*)[\"\']',r'(?:url|href|file|pdf)[A-Za-z_]*\s*[:=]\s*[\"\']([^\"\']+)[\"\']']
          for pat in pats:
            vals=[]
            for m in re.finditer(pat,text,re.I):
              v=m.group(1) if m.lastindex else m.group(0)
              if any(k in v.lower() for k in ('pdf','download','sourcefile','file')): vals.append(v)
            for v in list(dict.fromkeys(vals))[:300]: print('REGEX',v[:2000])
          open('qianzhan.html','w',encoding='utf-8').write(text)
          PY
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: qianzhan-dongbei-source-20261028
          path: qianzhan.html
          retention-days: 7
