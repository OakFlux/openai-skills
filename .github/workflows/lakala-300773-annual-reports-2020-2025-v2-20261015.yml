name: Package Lakala 300773 reports v2 20261015

on:
  push:
    paths:
      - '.github/workflows/lakala-300773-annual-reports-2020-2025-v2-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Build verified ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          from typing import Any
          import requests
          from pypdf import PdfReader

          CODE='300773'
          SHORT='拉卡拉'
          FULL='拉卡拉支付股份有限公司'
          PACKAGE='拉卡拉_300773_2020-2025年报及最新季报_截至20261015'
          root=Path(PACKAGE); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)

          specs=[
            ('2020',['2020年年度报告'],'01_拉卡拉_2020年年度报告.pdf',60,'年度报告'),
            ('2021',['2021年年度报告'],'02_拉卡拉_2021年年度报告.pdf',60,'年度报告'),
            ('2022',['2022年年度报告'],'03_拉卡拉_2022年年度报告.pdf',60,'年度报告'),
            ('2023',['2023年年度报告'],'04_拉卡拉_2023年年度报告.pdf',60,'年度报告'),
            ('2024',['2024年年度报告'],'05_拉卡拉_2024年年度报告.pdf',60,'年度报告'),
            ('2025',['2025年年度报告'],'06_拉卡拉_2025年年度报告.pdf',60,'年度报告'),
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Referer':f'https://data.eastmoney.com/notices/stock/{CODE}.html',
            'Accept':'application/json,text/plain,*/*','Accept-Language':'zh-CN,zh;q=0.9'
          })
          api='https://np-anotice-stock.eastmoney.com/api/security/ann'
          rows=[]; search_log=[]
          for page in range(1,61):
            params={'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':CODE,'f_node':'0','s_node':'0'}
            payload=None; last=None
            for attempt in range(8):
              try:
                r=s.get(api,params=params,timeout=(20,120)); last=(r.status_code,r.text[:200])
                if r.status_code==200:
                  payload=r.json(); break
              except Exception as exc: last=repr(exc)
              time.sleep(1+attempt)
            if payload is None: raise RuntimeError(f'公告接口失败 page={page} last={last}')
            batch=((payload.get('data') or {}).get('list') or [])
            search_log.append({'page':page,'count':len(batch)})
            if not batch: break
            rows.extend(batch)

          def c(x): return re.sub(r'\s+','',str(x or ''))
          def art(r): return str(r.get('art_code') or r.get('artCode') or '')
          bad=['摘要','英文版','取消','问询','回复','审计报告','董事会','监事会','更正公告','提示性公告','社会责任报告','可持续发展报告','独立董事述职报告','内部控制评价报告','财务决算报告','说明会','募集资金','会计师事务所','财务报表及相关附注']

          def choose(variants,period):
            cand=[]
            for row in rows:
              title=c(row.get('title'))
              matched=next((v for v in variants if c(v) in title),None)
              if not matched or any(c(x) in title for x in bad): continue
              score=50
              if title.endswith(c(matched)): score+=35
              if title==c(matched): score+=20
              if title.startswith(SHORT) or title.startswith(FULL): score+=15
              if any(x in title for x in ['更正后','修订版','更新后','修订稿']): score+=100
              cand.append((score,str(row.get('display_time') or ''),row,matched))
            cand.sort(key=lambda x:(x[0],x[1]),reverse=True)
            if not cand: raise RuntimeError(f'未找到 {period}: {variants}')
            return cand[0][2],[{'score':x[0],'date':x[1],'title':x[2].get('title'),'art_code':art(x[2]),'matched':x[3]} for x in cand[:20]]

          selected=[]; candidate_log={}
          for period,variants,filename,min_pages,doc_type in specs:
            row,log=choose(variants,period); candidate_log[period]=log
            selected.append({'period':period,'filename':filename,'min_pages':min_pages,'doc_type':doc_type,'row':row})

          quarter_options=[
            ('2026Q3',['2026年第三季度报告','2026年三季度报告']),
            ('2026Q1',['2026年第一季度报告','2026年一季度报告']),
            ('2025Q3',['2025年第三季度报告','2025年三季度报告']),
            ('2025Q1',['2025年第一季度报告','2025年一季度报告']),
          ]
          qrow=None; qperiod=None
          for period,variants in quarter_options:
            try:
              qrow,qlog=choose(variants,period); qperiod=period; candidate_log['latest_quarter']=qlog; break
            except RuntimeError: pass
          if qrow is None: raise RuntimeError('未找到最新季度报告')
          selected.append({'period':qperiod,'filename':f'07_拉卡拉_{qperiod}_最新季报.pdf','min_pages':4,'doc_type':'最新季度报告','row':qrow})

          def download_pdf(code,referer):
            urls=[f'https://pdf.dfcfw.com/pdf/H2_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H1_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H4_{code}_1.pdf']
            last={}
            for url in urls:
              for attempt in range(5):
                try:
                  r=s.get(url,timeout=(30,420),allow_redirects=True,headers={'User-Agent':s.headers['User-Agent'],'Referer':referer,'Accept':'application/pdf,*/*;q=0.8'})
                  last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>30000: return r.content,url,last
                except Exception as exc: last={'url':url,'error':repr(exc)}
                time.sleep(1+attempt)
            raise RuntimeError(f'PDF下载失败 {code}: {last}')

          manifest=[]
          for item in selected:
            row=item.pop('row'); ac=art(row)
            if not ac: raise RuntimeError(f'art_code缺失: {item["filename"]}')
            detail=f'https://data.eastmoney.com/notices/detail/{CODE}/{ac}.html'
            data,pdf_url,dlmeta=download_pdf(ac,detail)
            dest=root/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<item['min_pages']: raise RuntimeError(f'页数异常 {dest.name}: {pages}')

            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            info=subprocess.run(['pdfinfo',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,errors='replace').stdout
            if f'Pages:          {pages}' not in info and 'Pages:' not in info: raise RuntimeError(f'pdfinfo异常: {dest.name}')

            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','140','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError(f'首页渲染失败: {dest.name}')

            text=''
            for p in reader.pages[:min(25,pages)]:
              try: text+='\n'+(p.extract_text() or '')
              except Exception: pass
            if len(c(text))<100:
              txt=dest.with_suffix('.extract.txt')
              subprocess.run(['pdftotext','-raw','-f','1','-l',str(min(25,pages)),str(dest),str(txt)],check=False,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if txt.exists(): text+='\n'+txt.read_text(encoding='utf-8',errors='ignore')
            text_identity=[x for x in [SHORT,FULL,CODE] if x in text]
            identity_method='pdf_text' if text_identity else 'stock-scoped announcement API + exact report-period title + PDF structure + rendered first page'

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **item,'announcement_title':row.get('title'),'announcement_date':row.get('display_time'),'art_code':ac,
              'announcement_detail_page':detail,'pdf_url':pdf_url,'actual_pages':pages,'bytes':len(data),'sha256':sha,
              'text_identity_terms':text_identity,'identity_validation_method':identity_method,'download_meta':dlmeta,
              'preview_file':str(Path('首页预览')/preview.name),
              'validation':['PDF header','stock-scoped announcement match','report-period title','minimum page count','qpdf structure','pdfinfo','first-page render']
            })

          readme=[f'{FULL}（{CODE}.SZ）2020-2025年年度报告及最新季度报告资料包','整理日期：2026-10-15','',f'最新独立季度报告：{qperiod}。','本包共7份PDF：2020-2025年年度报告6份，加最新季度报告1份。','']
          for i,x in enumerate(manifest,1):
            readme += [f"{i}. {x['filename']}",f"   公告标题：{x['announcement_title']}",f"   公告日期：{x['announcement_date']}；页数：{x['actual_pages']}页",f"   公告页面：{x['announcement_detail_page']}",f"   身份核验方式：{x['identity_validation_method']}",f"   SHA-256：{x['sha256']}",'']
          readme += ['来源：公开信息披露公告及其PDF镜像。','已核验PDF文件头、公告范围、报告期标题、页数、qpdf结构、pdfinfo、首页渲染、ZIP CRC及SHA-256。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'candidate_selection_log.json').write_text(json.dumps(candidate_log,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'announcement_search_log.json').write_text(json.dumps({'pages':search_log,'rows_scanned':len(rows)},ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=7: raise RuntimeError(f'ZIP核验失败 bad={bad} pdfs={len(pdfs)}')
          Path('lakala_300773_reports.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('LATEST_QUARTER',qperiod)
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lakala-300773-reports-final-v2-20261015
          path: |
            拉卡拉_300773_2020-2025年报及最新季报_截至20261015.zip
            lakala_300773_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
