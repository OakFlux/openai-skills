name: Build Bona Film 001330 broker deep reports 20261012

on:
  push:
    paths:
      - '.github/workflows/bona-film-001330-deep-reports-package-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow img2pdf pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any
          from urllib.parse import urljoin

          import img2pdf
          import requests
          from PIL import Image, ImageOps
          from pypdf import PdfReader

          TODAY = '2026-10-12'
          PACKAGE = '博纳影业_001330_券商深度报告_3份_公开完整PDF'
          WORK = Path('bona_film_deep_work')
          DOWNLOADS = WORK / 'downloads'
          FINAL = WORK / 'final' / PACKAGE
          ART = Path('artifact_out')
          VERIFY = Path('verification_renders')
          for directory in (DOWNLOADS, FINAL, ART, VERIFY):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'text/html,application/xhtml+xml,application/pdf,image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
          })

          modern_reports: list[dict[str, Any]] = [
              {
                  'stock_code': '001330',
                  'stock_name': '博纳影业',
                  'broker': '太平洋证券',
                  'publish_date': '2024-12-30',
                  'title': '立足主旋律电影，积极探索品类扩张与AI赋能',
                  'report_id': '4651571',
                  'pages': 30,
                  'source_page': 'https://www.fxbaogao.com/detail/4651571',
                  'document_type': '公司首次覆盖/深度研究',
                  'source_form': '公开完整页图重建PDF',
              },
              {
                  'stock_code': '001330',
                  'stock_name': '博纳影业',
                  'broker': '德邦证券',
                  'publish_date': '2024-06-19',
                  'title': '首次覆盖：深耕电影25载势头正强劲，储备丰富AI赋能业绩更可期',
                  'report_id': '4354754',
                  'pages': 23,
                  'source_page': 'https://www.fxbaogao.com/detail/4354754',
                  'document_type': '公司首次覆盖报告',
                  'source_form': '公开完整页图重建PDF',
              },
              {
                  'stock_code': '001330',
                  'stock_name': '博纳影业',
                  'broker': '国盛证券',
                  'publish_date': '2024-06-16',
                  'title': '首次覆盖报告：民营影视龙头公司，多元化发展拓宽成长空间',
                  'report_id': '4350373',
                  'pages': 32,
                  'source_page': 'https://www.fxbaogao.com/detail/4350373',
                  'document_type': '公司首次覆盖报告',
                  'source_form': '公开完整页图重建PDF',
              },
          ]

          fallback_reports: list[dict[str, Any]] = [
              {
                  'stock_code': '001330',
                  'stock_name': '博纳影业',
                  'broker': '华鑫证券',
                  'publish_date': '2022-08-11',
                  'title': '归来用内容丈量中国文化厚度',
                  'info_code': 'AP202208111577108605',
                  'pages': 34,
                  'document_type': '公司深度/首次覆盖报告',
                  'source_form': '公开原始PDF',
              },
              {
                  'stock_code': '001330',
                  'stock_name': '博纳影业',
                  'broker': '东吴证券',
                  'publish_date': '2022-09-05',
                  'title': '主旋律商业化电影领军者，优质内容投制能力可持续',
                  'info_code': 'AP202209051578046652',
                  'pages': 23,
                  'document_type': '公司首次覆盖/深度研究',
                  'source_form': '公开原始PDF',
              },
          ]

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:108]

          def get_detail_html(report: dict[str, Any]) -> tuple[str, str]:
              candidates = [
                  report['source_page'],
                  f"https://www.fxbaogao.com/report/detail/{report['report_id']}",
                  f"https://www.fxbaogao.com/detail/{report['report_id']}?source=chatgpt",
              ]
              last = ''
              for url in candidates:
                  try:
                      response = session.get(url, timeout=(25, 120), allow_redirects=True)
                      print('DETAIL', report['report_id'], response.status_code, len(response.content), response.url, flush=True)
                      if response.status_code == 200 and len(response.content) > 1000:
                          return response.text, str(response.url)
                      last = f'{response.status_code}/{len(response.content)}'
                  except Exception as exc:
                      last = repr(exc)
              print('DETAIL_UNAVAILABLE', report['report_id'], last, flush=True)
              return '', report['source_page']

          def discover_image_urls(report: dict[str, Any], detail_html: str, detail_url: str) -> dict[int, list[str]]:
              found: dict[int, list[str]] = {}
              text = html.unescape(detail_html).replace('\\/', '/')
              patterns = [
                  r'https?://[^\s"\'<>]+report-image[^\s"\'<>]+',
                  r'//[^\s"\'<>]+report-image[^\s"\'<>]+',
                  r'["\']([^"\']*report-image[^"\']+)["\']',
              ]
              raw_urls: list[str] = []
              for pattern in patterns:
                  for match in re.finditer(pattern, text, re.I):
                      value = match.group(1) if match.lastindex else match.group(0)
                      if value.startswith('//'):
                          value = 'https:' + value
                      elif value.startswith('/'):
                          value = urljoin(detail_url, value)
                      raw_urls.append(value.rstrip(');,]'))
              for url in dict.fromkeys(raw_urls):
                  if report['report_id'] not in url:
                      continue
                  match = re.search(rf'{re.escape(report["report_id"])}[-_](\d+)\.(?:png|jpe?g|webp)', url, re.I)
                  if match:
                      page = int(match.group(1))
                      found.setdefault(page, []).append(url)
              print('DISCOVERED_IMAGES', report['report_id'], len(found), sorted(found)[:5], sorted(found)[-5:] if found else [], flush=True)
              return found

          def candidate_urls(report: dict[str, Any], page: int, discovered: dict[int, list[str]]) -> list[str]:
              y, m, d = report['publish_date'].split('-')
              report_id = report['report_id']
              base_variants = [
                  f'https://public.fxbaogao.com/report-image/{y}/{m}/{d}/{report_id}-{page}',
                  f'https://public.fxbaogao.com/report-image/{y}/{int(m):02d}/{int(d):02d}/{report_id}-{page}',
                  f'https://public.fxbaogao.com/report-image/{y}/{int(m)}/{int(d)}/{report_id}-{page}',
                  f'https://public.fxbaogao.com/report-image/{report_id}-{page}',
              ]
              urls: list[str] = list(discovered.get(page, []))
              for base in base_variants:
                  for ext in ['.png', '.jpg', '.jpeg', '.webp']:
                      urls.append(base + ext)
              return list(dict.fromkeys(urls))

          def download_image(report: dict[str, Any], page: int, discovered: dict[int, list[str]], detail_url: str, output: Path) -> str:
              headers = {
                  'User-Agent': session.headers['User-Agent'],
                  'Referer': detail_url,
                  'Accept': 'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8',
              }
              last = ''
              for url in candidate_urls(report, page, discovered):
                  try:
                      response = session.get(url, timeout=(25, 180), allow_redirects=True, headers=headers)
                      if response.status_code != 200 or len(response.content) < 15_000:
                          last = f'{response.status_code}/{len(response.content)} {url}'
                          continue
                      temp = output.with_suffix('.raw')
                      temp.write_bytes(response.content)
                      try:
                          with Image.open(temp) as image:
                              image.verify()
                          with Image.open(temp) as image:
                              width, height = image.size
                              if width < 700 or height < 900:
                                  raise RuntimeError(f'image too small {width}x{height}')
                              image = ImageOps.exif_transpose(image).convert('RGB')
                              image.save(output, 'JPEG', quality=96, optimize=True, subsampling=0)
                      finally:
                          temp.unlink(missing_ok=True)
                      print('IMAGE', report['report_id'], page, output.stat().st_size, response.url, flush=True)
                      return str(response.url)
                  except Exception as exc:
                      last = f'{url}: {exc!r}'
                      output.unlink(missing_ok=True)
              raise RuntimeError(f'page {page} unavailable: {last}')

          def validate_pdf(path: Path, expected_pages: int, identity_terms: list[str] | None = None) -> tuple[int, str]:
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages != expected_pages:
                  raise RuntimeError(f'page-count mismatch for {path.name}: {pages} != {expected_pages}')
              check = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf failed for {path.name}: {check.stderr[-1000:]}')
              if identity_terms:
                  parts: list[str] = []
                  for index in range(min(20, pages)):
                      try:
                          parts.append(reader.pages[index].extract_text() or '')
                      except Exception:
                          pass
                  text = '\n'.join(parts)
                  if not any(term in text for term in identity_terms):
                      raise RuntimeError(f'identity not verified for {path.name}')
              raw = path.read_bytes()
              if len(raw) < 100_000 or not raw.startswith(b'%PDF-'):
                  raise RuntimeError(f'invalid PDF bytes for {path.name}')
              return pages, hashlib.sha256(raw).hexdigest()

          built: list[dict[str, Any]] = []
          failures: list[dict[str, str]] = []
          seen_hashes: set[str] = set()

          for report in modern_reports:
              report_dir = DOWNLOADS / report['report_id']
              report_dir.mkdir(parents=True, exist_ok=True)
              output_pdf = DOWNLOADS / f"{report['report_id']}.pdf"
              try:
                  detail_html, detail_url = get_detail_html(report)
                  title_blob = re.sub(r'<[^>]+>', ' ', detail_html)
                  if detail_html and not any(term in title_blob for term in ['博纳影业', report['title'][:8], report['broker'].replace('证券','')]):
                      raise RuntimeError('detail page identity check failed')
                  discovered = discover_image_urls(report, detail_html, detail_url)
                  image_paths: list[Path] = []
                  page_sources: list[str] = []
                  for page in range(1, int(report['pages']) + 1):
                      path = report_dir / f'{page:03d}.jpg'
                      source = download_image(report, page, discovered, detail_url, path)
                      image_paths.append(path)
                      page_sources.append(source)
                  output_pdf.write_bytes(img2pdf.convert([str(path) for path in image_paths]))
                  pages, digest = validate_pdf(output_pdf, int(report['pages']))
                  if digest in seen_hashes:
                      raise RuntimeError('duplicate report PDF')
                  seen_hashes.add(digest)
                  record = {
                      **report,
                      'pages': pages,
                      'bytes': output_pdf.stat().st_size,
                      'sha256': digest,
                      'pdf_path': str(output_pdf),
                      'detail_final_url': detail_url,
                      'page_image_sources': page_sources,
                      'text_searchable': False,
                  }
                  built.append(record)
                  print('VALIDATED_MODERN', json.dumps({k:v for k,v in record.items() if k not in {'page_image_sources','pdf_path'}}, ensure_ascii=False), flush=True)
              except Exception as exc:
                  failures.append({'report_id': report['report_id'], 'title': report['title'], 'error': repr(exc)})
                  print('MODERN_FAILED', report['report_id'], report['title'], repr(exc), flush=True)
                  output_pdf.unlink(missing_ok=True)
                  shutil.rmtree(report_dir, ignore_errors=True)

          def download_fallback(report: dict[str, Any]) -> tuple[Path, str]:
              output = DOWNLOADS / f"{report['info_code']}.pdf"
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H3_{report['info_code']}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H3_{report['info_code']}_01.pdf",
                  f"https://pdf.dfcfw.com/pdf/H2_{report['info_code']}_1.pdf",
              ]
              last = ''
              for url in urls:
                  try:
                      response = session.get(url, timeout=(30, 300), allow_redirects=True, headers={
                          'User-Agent': session.headers['User-Agent'],
                          'Referer': 'https://data.eastmoney.com/',
                          'Accept': 'application/pdf,*/*',
                      })
                      print('FALLBACK_PDF', report['info_code'], response.status_code, len(response.content), url, flush=True)
                      if response.status_code == 200 and len(response.content) > 100_000 and response.content.startswith(b'%PDF-'):
                          output.write_bytes(response.content)
                          return output, str(response.url)
                      last = f'{response.status_code}/{len(response.content)}'
                  except Exception as exc:
                      last = repr(exc)
              raise RuntimeError(f'fallback download failed: {last}')

          if len(built) < 3:
              for report in fallback_reports:
                  if len(built) >= 3:
                      break
                  try:
                      output_pdf, source_url = download_fallback(report)
                      pages, digest = validate_pdf(output_pdf, int(report['pages']), ['博纳影业', '001330'])
                      if digest in seen_hashes:
                          continue
                      seen_hashes.add(digest)
                      record = {
                          **report,
                          'pages': pages,
                          'bytes': output_pdf.stat().st_size,
                          'sha256': digest,
                          'pdf_path': str(output_pdf),
                          'source_url': source_url,
                          'text_searchable': True,
                      }
                      built.append(record)
                      print('VALIDATED_FALLBACK', json.dumps({k:v for k,v in record.items() if k != 'pdf_path'}, ensure_ascii=False), flush=True)
                  except Exception as exc:
                      failures.append({'info_code': report['info_code'], 'title': report['title'], 'error': repr(exc)})
                      print('FALLBACK_FAILED', report['info_code'], repr(exc), flush=True)

          if len(built) < 2:
              raise RuntimeError(f'Only {len(built)} validated reports; failures={failures}')

          built = built[:3]
          manifest: list[dict[str, Any]] = []
          for index, record in enumerate(built, 1):
              filename = f"{index:02d}_{safe(record['publish_date'])}_{safe(record['broker'])}_{safe(record['title'])}.pdf"
              shutil.copy2(record['pdf_path'], FINAL / filename)
              clean = {k:v for k,v in record.items() if k != 'pdf_path'}
              clean['filename'] = filename
              manifest.append(clean)

          mode = '3份公司长篇深度报告' if len(manifest) == 3 else f'{len(manifest)}份公司长篇深度报告'
          readme = [
              '博纳影业（001330.SZ）券商深度报告资料包',
              f'整理日期：{TODAY}',
              f'收录数量：{len(manifest)}份（{mode}）',
              '',
              '口径说明：',
              '1. 优先收录首次覆盖、公司深度或篇幅较完整的专题研究，剔除季报点评、年报点评、业绩预告和事件短评。',
              '2. 标记为“公开完整页图重建PDF”的文件由公开展示的完整逐页报告图片按原页序合成为PDF，页面完整，但通常不能直接全文检索或复制文字。',
              '3. 标记为“公开原始PDF”的文件保留原始PDF结构，可进行文字检索。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(manifest, 1):
              readme += [
                  f'{index}. {record["filename"]}',
                  f'   券商：{record["broker"]}；日期：{record["publish_date"]}；页数：{record["pages"]}',
                  f'   标题：{record["title"]}',
                  f'   类型：{record["document_type"]}；来源形态：{record["source_form"]}',
                  f'   大小：{record["bytes"] / 1048576:.2f} MB；SHA-256：{record["sha256"]}',
                  '',
              ]
          if failures:
              readme += ['未纳入候选及原因：'] + [f'- {item.get("title", "")}: {item.get("error", "")}' for item in failures] + ['']
          readme.append('完整性核验：已核对报告元数据与页数，检查PDF文件头、qpdf结构、重复文件和SHA-256，并渲染每份PDF首页；最终ZIP已通过CRC测试。')

          (FINAL / '00_文件清单与口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (FINAL / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL / 'SHA256SUMS.txt').write_text(''.join(f'{record["sha256"]}  {record["filename"]}\n' for record in manifest), encoding='utf-8')

          for index, record in enumerate(manifest, 1):
              source = FINAL / record['filename']
              prefix = VERIFY / f'{index:02d}'
              result = subprocess.run(['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '120', str(source), str(prefix)], capture_output=True, text=True)
              if result.returncode != 0:
                  raise RuntimeError(f'Render failed for {source.name}: {result.stderr[-1000:]}')

          zip_path = ART / f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(FINAL.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              if len(pdfs) != len(manifest):
                  raise RuntimeError(f'Expected {len(manifest)} PDFs, found {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2), flush=True)
          print('FAILURES', json.dumps(failures, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(manifest), 'SHA256', zip_sha, flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: bona-film-001330-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: bona-film-001330-deep-reports-renders
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
