name: Probe one Daqin report URL 20260927
on:
  push:
    paths:
      - '.github/workflows/daqin-one-url-probe-20260927.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import requests,json
          from pathlib import Path
          path='/disclosure/listedinfo/announcement/c/new/2026-04-30/601006_20260430_VFZD.pdf'
          out=[]
          for trust in (False,True):
            s=requests.Session();s.trust_env=trust
            for base in ('https://www.sse.com.cn','https://static.sse.com.cn','http://static.sse.com.cn'):
              for ref in ('https://www.sse.com.cn/','https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId=601006',''):
                try:
                  h={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'application/pdf,*/*;q=0.8'}
                  if ref:h['Referer']=ref
                  r=s.get(base+path,headers=h,timeout=(8,15),allow_redirects=True)
                  out.append({'trust_env':trust,'base':base,'referer':ref,'status':r.status_code,'final':r.url,'type':r.headers.get('content-type'),'server':r.headers.get('server'),'bytes':len(r.content),'head_ascii':repr(r.content[:50]),'headers':dict(r.headers)})
                except Exception as e:out.append({'trust_env':trust,'base':base,'referer':ref,'error':repr(e)})
          Path('out/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: daqin-one-url-probe
          path: out
          retention-days: 7
