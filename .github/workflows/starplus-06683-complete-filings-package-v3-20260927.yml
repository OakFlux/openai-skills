name: Build Star Plus Legend 06683 complete filings package v3 20260927

on:
  push:
    paths:
      - '.github/workflows/starplus-06683-complete-filings-package-v3-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download official PDFs, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          BASE='https://www1.hkexnews.hk'
          PACKAGE='巨星传奇_06683_全部年报_招股说明书_最新定期报告_截至2026-09-27'
          OUT=Path(PACKAGE); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8','Referer':BASE+'/'})

          fixed_docs=[
              {'kind':'年度报告','title':'二零二三年年报','year':2023,'date':'29/04/2024 07:12','url':BASE+'/listedco/listconews/sehk/2024/0429/2024042900066_c.pdf','filename':'2023_巨星传奇_06683_2023年年度报告_中文版_官方原文.pdf','min_pages':100,'min_bytes':300000},
              {'kind':'年度报告','title':'二零二四年年报','year':2024,'date':'29/04/2025 16:34','url':BASE+'/listedco/listconews/sehk/2025/0429/2025042900818_c.pdf','filename':'2024_巨星传奇_06683_2024年年度报告_中文版_官方原文.pdf','min_pages':100,'min_bytes':300000},
              {'kind':'年度报告','title':'二零二五年年报','year':2025,'date':'28/04/2026 16:29','url':BASE+'/listedco/listconews/sehk/2026/0428/2026042800517_c.pdf','filename':'2025_巨星传奇_06683_2025年年度报告_中文版_官方原文.pdf','min_pages':100,'min_bytes':300000},
              {'kind':'最新定期财务披露','title':'截至2026年6月30日止六个月的中期业绩公告及有关2025年年报的补充资料','year':2026,'date':'31/08/2026 22:43','url':BASE+'/listedco/listconews/sehk/2026/0831/2026083102980_c.pdf','filename':'2026_巨星传奇_06683_2026年中期业绩公告_最新定期财务披露_中文版_官方原文.pdf','min_pages':10,'min_bytes':100000},
              {'kind':'最新完整中期报告','title':'2025中期报告','year':2025,'date':'30/09/2025 06:10','url':BASE+'/listedco/listconews/sehk/2025/0930/2025093000016_c.pdf','filename':'2025_巨星传奇_06683_2025年中期报告_最新完整中期报告_中文版_官方原文.pdf','min_pages':50,'min_bytes':200000},
          ]
          prospectus_candidates=[
              {'title':'全球發售','year':2023,'date':'30/06/2023 06:10','url':BASE+'/listedco/listconews/sehk/2023/0630/2023063000038_c.pdf'},
              {'title':'全球發售','year':2023,'date':'30/06/2023 06:06','url':BASE+'/listedco/listconews/sehk/2023/0630/2023063000016_c.pdf'},
          ]

          def download(url,dest,min_bytes):
              urls=[url]
              if 'www1.hkexnews.hk' in url: urls.append(url.replace('www1.hkexnews.hk','www.hkexnews.hk'))
              errors=[]
              for u in dict.fromkeys(urls):
                  for attempt in range(1,6):
                      tmp=dest.with_suffix(dest.suffix+'.part')
                      try:
                          with s.get(u,timeout=(30,300),allow_redirects=True,stream=True) as r:
                              print('DOWNLOAD',dest.name,'attempt',attempt,'status',r.status_code,u,'->',r.url,flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as f:
                                  for chunk in r.iter_content(1024*1024):
                                      if chunk: f.write(chunk)
                          size=tmp.stat().st_size; head=tmp.open('rb').read(8)
                          if size<min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF payload size={size}, head={head!r}')
                          tmp.replace(dest); return str(r.url)
                      except Exception as exc:
                          errors.append(f'{u} attempt {attempt}: {exc!r}'); tmp.unlink(missing_ok=True); time.sleep(attempt*2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          def inspect(path):
              reader=PdfReader(str(path),strict=False); pages=len(reader.pages); text=''
              for page in reader.pages[:min(30,pages)]:
                  try: text+='\n'+(page.extract_text() or '')
                  except Exception: pass
              return pages,text

          # Identify the larger base prospectus and the shorter supplemental prospectus by actual page count.
          probes=[]
          for i,d in enumerate(prospectus_candidates,1):
              p=OUT/f'_prospectus_probe_{i}.pdf'; source=download(d['url'],p,100000); pages,text=inspect(p)
              probes.append((d,p,source,pages,text))
          probes.sort(key=lambda x:x[3],reverse=True)
          print('PROSPECTUS_PAGE_COUNTS',[x[3] for x in probes],flush=True)
          if probes[0][3]<300 or probes[1][3]>=probes[0][3]:
              raise RuntimeError('prospectus classification failed')
          base,bp,bu,bpages,btext=probes[0]
          sup,sp,su,spages,stext=probes[1]
          base.update({'kind':'最终招股章程','title':'全球发售——最终招股章程（中文版）','filename':'2023_巨星传奇_06683_最终招股章程_中文版_官方原文.pdf','min_pages':300,'min_bytes':1000000,'preloaded':(bp,bu,bpages,btext)})
          sup.update({'kind':'补充招股章程','title':'全球发售——补充招股章程（中文版）','filename':'2023_巨星传奇_06683_补充招股章程_中文版_官方原文.pdf','min_pages':2,'min_bytes':100000,'preloaded':(sp,su,spages,stext)})
          docs=fixed_docs[:3]+[base,sup]+fixed_docs[3:]

          records=[]; seen=set()
          for d in docs:
              dest=OUT/d['filename']
              if 'preloaded' in d:
                  p,source,pages,text=d.pop('preloaded'); p.replace(dest)
              else:
                  source=download(d['url'],dest,d['min_bytes']); pages,text=inspect(dest)
              if pages<d['min_pages']: raise RuntimeError(f'page count too small for {dest.name}: {pages}')
              check=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
              if check.returncode not in (0,3): raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-2000:]}')
              data=dest.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha in seen: raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen.add(sha)
              rec={'filename':dest.name,'document_type':d['kind'],'document_title':re.sub(r'\s+',' ',d['title']).strip(),'reporting_year':d['year'],'disclosure_datetime':d['date'],'source':'香港交易所披露易（HKEXnews）','source_url':source,'pages':pages,'bytes':len(data),'sha256':sha}
              records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          records.sort(key=lambda r:(r['reporting_year'],r['document_type'],r['filename']))
          readme=[
              '巨星传奇集团有限公司（06683.HK）全部年度报告、最终招股文件及最新定期财务报告',
              '整理日期：2026-09-27','资料来源：香港交易所披露易（HKEXnews）中文官方PDF原件','',
              '收录口径：',
              '1. 公司于2023年7月13日在香港联交所上市，上市主体独立完整年度报告为2023、2024、2025年；上市前2020—2022年历史财务资料载于最终招股章程及会计师报告。',
              '2. 招股文件收录2023年6月30日重新启动全球发售后正式刊发的最终招股章程及补充招股章程，不以早期上市申请稿替代。',
              '3. 港股主板公司通常不发布A股口径的一季报和三季报。截至2026年9月27日，最新定期财务披露为2026年中期业绩公告；2026年完整中期报告尚未刊发，因此同时收录最新完整的2025年中期报告。',
              '4. 本包为中文官方原件，未重复加入内容等价的英文版本，以控制压缩包体积。','', '文件清单：'
          ]
          for i,r in enumerate(records,1):
              readme += [f"{i}. {r['document_type']}｜{r['document_title']}",f"   文件：{r['filename']}",f"   披露时间：{r['disclosure_datetime']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MB",f"   官方来源：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          readme += ['完整性核验：PDF文件头、实际页数、qpdf结构检查、重复哈希排除、SHA-256清单及ZIP CRC校验。']
          (OUT/'00_文件清单与范围说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')
          with (OUT/'sources.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(records[0])); w.writeheader(); w.writerows(records)

          zp=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zp,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
              for p in sorted(OUT.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zp) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              if len(pdfs)!=7: raise RuntimeError(f'expected 7 PDFs, got {len(pdfs)}')
          print('FINAL_ZIP',zp.name,zp.stat().st_size,'PDF_COUNT',len(pdfs),'SHA256',hashlib.sha256(zp.read_bytes()).hexdigest(),flush=True)
          print('FINAL_MANIFEST',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: starplus-06683-complete-filings-final-v3
          path: 巨星传奇_06683_全部年报_招股说明书_最新定期报告_截至2026-09-27.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
