name: Build AviChina report package from verified filing mirrors
on:
  push:
    branches: [tmp-avichina-fast-package-20260908]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests pypdf pymupdf pillow
      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output reports renders
          python - <<'PY'
          import csv, hashlib, io, json, re, shutil, time, zipfile
          from pathlib import Path
          import pymupdf, requests
          from PIL import Image, ImageDraw
          from pypdf import PdfReader

          out=Path('output'); report_dir=Path('reports'); render_dir=Path('renders')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*','Referer':'https://stockanalysis.com/'})
          specs=[
            (1,2020,'年度报告','2020年年度报告','01_AviChina_2020_Annual_Report.pdf',180,'https://files.quartr.com/reports/0cfe9-2026-03-09.pdf?ref=U3RvY2tBbmFseXNpcw=='),
            (2,2021,'年度报告','2021年年度报告','02_AviChina_2021_Annual_Report.pdf',300,'https://files.quartr.com/reports/727ad-2025-12-05-09-01-31.pdf?ref=U3RvY2tBbmFseXNpcw=='),
            (3,2022,'年度报告','2022年年度报告','03_AviChina_2022_Annual_Report.pdf',230,'https://files.quartr.com/reports/bf706-2025-12-05-09-00-23.pdf?ref=U3RvY2tBbmFseXNpcw=='),
            (4,2023,'年度报告','2023年年度报告','04_AviChina_2023_Annual_Report.pdf',280,'https://files.quartr.com/reports/4a62a-2025-12-05-09-23-10.pdf?ref=U3RvY2tBbmFseXNpcw=='),
            (5,2024,'年度报告','2024年年度报告','05_AviChina_2024_Annual_Report.pdf',260,'https://files.quartr.com/reports/6c962-2025-04-24-08-00-48.pdf?ref=U3RvY2tBbmFseXNpcw=='),
            (6,2025,'年度报告','2025年年度报告','06_AviChina_2025_Annual_Report.pdf',240,'https://files.quartr.com/reports/49cc6-2026-04-22-08-56-19.pdf?ref=U0E='),
            (7,2026,'最新集团财务披露','2026年中期业绩公告','07_AviChina_2026_Interim_Results_Announcement.pdf',20,'https://files.quartr.com/reports/5710708f9e903f56acc755b56b4a2053-2026-08-26-11-09-49.pdf?ref=U0E='),
            (8,2025,'最新完整中期报告补充','2025年中期报告（完整报告补充）','08_AviChina_2025_Interim_Report_Supplement.pdf',70,'https://files.quartr.com/reports/5e172-2025-12-05-09-18-00.pdf?ref=U3RvY2tBbmFseXNpcw=='),
          ]
          manifest=[]; renders=[]
          def compact(x): return re.sub(r'\s+','',x or '').upper()
          for seq,year,kind,display,filename,min_pages,url in specs:
            last=None
            for attempt in range(1,4):
              try:
                r=s.get(url,timeout=(25,180),allow_redirects=True)
                print('DOWNLOAD',seq,attempt,r.status_code,len(r.content),r.url,flush=True)
                r.raise_for_status(); data=r.content
                if b'%PDF-' not in data[:2048] or len(data)<50000: raise RuntimeError('invalid PDF payload')
                reader=PdfReader(io.BytesIO(data),strict=False); pages=len(reader.pages)
                if pages<min_pages: raise RuntimeError(f'incomplete PDF: {pages} pages')
                text='\n'.join((p.extract_text() or '') for p in reader.pages[:12])
                n=compact(text)
                if not any(x in n for x in ['AVICHINAINDUSTRY&TECHNOLOGY','AVICHINAINDUSTRYANDTECHNOLOGY','中国航空科技工业股份有限公司','中國航空科技工業股份有限公司']):
                  raise RuntimeError('company identity not found')
                if str(year) not in n and {2020:'二零二零',2021:'二零二一',2022:'二零二二',2023:'二零二三',2024:'二零二四',2025:'二零二五',2026:'二零二六'}[year] not in text:
                  raise RuntimeError('year identity not found')
                if kind=='年度报告' and not any(x in n for x in ['ANNUALREPORT','年度报告','年度報告','年報']): raise RuntimeError('annual marker missing')
                if seq==7 and not any(x in n for x in ['INTERIMRESULTS','中期业绩','中期業績']): raise RuntimeError('interim results marker missing')
                if seq==8 and not any(x in n for x in ['INTERIMREPORT','中期报告','中期報告']): raise RuntimeError('interim report marker missing')
                path=report_dir/filename; path.write_bytes(data)
                doc=pymupdf.open(path); pix=doc[0].get_pixmap(matrix=pymupdf.Matrix(1.15,1.15),alpha=False); rp=render_dir/f'{seq:02d}.png'; pix.save(str(rp)); doc.close(); renders.append(rp)
                manifest.append({'序号':seq,'文件名':filename,'报告类型':kind,'报告说明':display,'报告年度':year,'PDF页数':pages,'文件大小_字节':len(data),'SHA256':hashlib.sha256(data).hexdigest(),'来源':'Quartr保存的官方披露镜像','实际下载地址':r.url})
                print('VERIFIED',filename,pages,len(data),flush=True); break
              except Exception as e:
                last=e; print('RETRY',seq,attempt,repr(e),flush=True); time.sleep(3*attempt)
            else: raise RuntimeError(f'failed {filename}: {last!r}')
          if len(manifest)!=8: raise RuntimeError('expected 8 PDFs')
          with (report_dir/'文件清单与校验值.csv').open('w',encoding='utf-8-sig',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(manifest[0].keys())); w.writeheader(); w.writerows(manifest)
          lines=['中国航空科技工业股份有限公司（中航科工，02357.HK）','2020—2025年年度报告及最新集团财务披露资料包','打包日期：2026-09-08','','内容：2020—2025年完整年报6份、2026年中期业绩公告、2025年完整中期报告补充。','中航科工为港股上市公司，不按A股格式发布集团一季报和三季报；本包未混入旗下A股子公司报告。','PDF均为公开披露文件镜像，已校验文件头、页数、公司、年度、报告类型、SHA-256和ZIP CRC。','']
          lines += [f"{r['序号']}. {r['报告说明']}｜{r['PDF页数']}页｜{r['文件名']}" for r in manifest]
          (report_dir/'README.txt').write_text('\n'.join(lines),encoding='utf-8')
          cards=[]
          for rp in renders:
            with Image.open(rp) as im:
              rgb=im.convert('RGB'); rgb.thumbnail((400,560)); card=Image.new('RGB',(440,610),'white'); card.paste(rgb,((440-rgb.width)//2,10)); ImageDraw.Draw(card).text((12,580),rp.stem,fill='black'); cards.append(card)
          sheet=Image.new('RGB',(1760,1220),'white')
          for i,c in enumerate(cards): sheet.paste(c,((i%4)*440,(i//4)*610)); c.close()
          sheet.save(out/'first_page_contact_sheet.jpg',quality=90); sheet.close()
          eng=out/'AviChina_02357_2020-2025_Annual_and_Latest_Reports.zip'
          with zipfile.ZipFile(eng,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(report_dir.iterdir()): z.write(p,p.name)
          with zipfile.ZipFile(eng) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=8: raise RuntimeError(f'ZIP check failed {bad} {len(pdfs)}')
          chi=out/'中航科工_02357_2020-2025年报及最新财务报告.zip'; shutil.copy2(eng,chi)
          result={'ok':True,'archive':eng.name,'chinese_archive':chi.name,'archive_bytes':eng.stat().st_size,'pdf_count':8,'zip_crc_ok':True,'reports':manifest}
          (out/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PACKAGE_OK',json.dumps(result,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: avichina-fast-verified-package
          path: output/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
