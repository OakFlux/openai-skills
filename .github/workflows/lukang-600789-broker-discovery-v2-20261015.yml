name: Diagnose LuKang 600789 broker report API 20261015

on:
  push:
    paths:
      - '.github/workflows/lukang-600789-broker-discovery-v2-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query report APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, time
          from pathlib import Path
          import requests

          out=Path('diagnostics'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Referer':'https://data.eastmoney.com/report/600789.html','Accept':'application/json,text/plain,*/*'})
          params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2017-01-01','endTime':'2026-10-15','pageNo':'1','fields':'','qType':'0','orgCode':'','code':'600789','rcode':'','p':'1','pageNum':'1','pageNumber':'1','_':str(int(time.time()*1000))}
          results={}
          for endpoint,method in [('https://reportapi.eastmoney.com/report/list','GET'),('https://reportapi.eastmoney.com/report/list2','GET'),('https://reportapi.eastmoney.com/report/list2','POST')]:
            key=endpoint.rsplit('/',1)[-1]+'_'+method
            try:
              r=s.request(method,endpoint,params=params if method=='GET' else None,json=params if method=='POST' else None,data=params if method=='POST' else None,timeout=(20,90))
              text=r.text.lstrip('\ufeff')
              (out/f'{key}.txt').write_text(text,encoding='utf-8',errors='replace')
              parsed=None
              try: parsed=r.json()
              except Exception:
                m=re.search(r'^[^(]*\((.*)\)\s*;?$',text,re.S)
                if m:
                  try: parsed=json.loads(m.group(1))
                  except Exception: pass
              summary={'status':r.status_code,'url':r.url,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'text_head':text[:500]}
              if isinstance(parsed,dict):
                summary['top_keys']=list(parsed.keys())
                data=parsed.get('data')
                summary['data_type']=type(data).__name__
                if isinstance(data,list):
                  summary['data_len']=len(data)
                  summary['first_rows']=data[:5]
                elif isinstance(data,dict):
                  summary['data_keys']=list(data.keys())
                  for k,v in data.items():
                    if isinstance(v,list):
                      summary['list_key']=k; summary['data_len']=len(v); summary['first_rows']=v[:5]; break
              results[key]=summary
            except Exception as e:
              results[key]={'error':repr(e)}
          (out/'summary.json').write_text(json.dumps(results,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2,default=str))
          PY

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lukang-600789-broker-api-diagnostics
          path: diagnostics
          retention-days: 7
          if-no-files-found: error
