name: Discover Zhejiang Expressway broker reports on public report API

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-sdyanbao-discovery-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Query report search API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery
          python - <<'PY'
          import json, urllib.request, time, re
          from pathlib import Path

          url='https://api.sdyanbao.com/api/file/search'
          keywords=[
            '浙江沪杭甬','浙江沪杭甬高速公路','0576.HK','00576.HK','沪杭甬高速',
            '区域经济赋能车流量长期增长','改扩建重塑资产久期','公司深度 浙江沪杭甬'
          ]
          allrows={}
          raw=[]
          for keyword in keywords:
            for only_title in (1,0):
              for page in range(1,8):
                body={
                  'device':1,'hideTrader':0,'onlyTitle':only_title,'order':0,
                  'page':page,'pageSize':100,'keyword':keyword,'pageCount':'',
                  'dateRange':'','startTime':'','endTime':'','typeIds':[],
                  'industryIds':[],'opFrom':1
                }
                data=json.dumps(body,ensure_ascii=False).encode('utf-8')
                req=urllib.request.Request(url,data=data,headers={
                  'Content-Type':'application/json','User-Agent':'Mozilla/5.0',
                  'Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com',
                  'device':'1'
                },method='POST')
                try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                    payload=json.loads(r.read().decode('utf-8'))
                except Exception as e:
                  print('FAIL',keyword,only_title,page,repr(e),flush=True)
                  break
                rows=(payload.get('data') or {}).get('files') or []
                total=int((payload.get('data') or {}).get('total') or 0)
                print('QUERY',keyword,'TITLE',only_title,'PAGE',page,'ROWS',len(rows),'TOTAL',total,flush=True)
                raw.append({'keyword':keyword,'onlyTitle':only_title,'page':page,'total':total,'rows':rows})
                for x in rows:
                  blob=json.dumps(x,ensure_ascii=False).replace(' ','').lower()
                  if any(t in blob for t in ('浙江沪杭甬','浙江滬杭甬','0576.hk','00576.hk','zhejiangexpressway')):
                    allrows[str(x.get('id'))]=x
                if not rows or page*100>=total:
                  break
                time.sleep(.25)

          compact=[]
          for x in allrows.values():
            compact.append({
              'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),
              'pages':x.get('page_count'),'page_url':x.get('page_url'),
              'share_url':x.get('share_url'),'file_size':x.get('file_size'),
              'data_source':x.get('data_source'),'uuid':x.get('data_source_uuid'),
              'type':(x.get('type') or {}).get('name'),
              'org':(x.get('organization') or {}).get('name'),
              'researcher':(x.get('researcher') or {}).get('name'),
              'stock':x.get('stock'),'content_prefix':str(x.get('content') or '')[:2000]
            })
          compact.sort(key=lambda z:((z.get('date') or ''),int(z.get('pages') or 0)),reverse=True)
          Path('discovery/matches.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('discovery/raw.json').write_text(json.dumps(raw,ensure_ascii=False),encoding='utf-8')
          print('RESULTS',json.dumps(compact,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-sdyanbao-discovery
          path: discovery/
          retention-days: 7
          if-no-files-found: error
