name: Temporary Inspect Raw SGPJBG Mengtai Topic Context

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-topic-context-mengtai.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Print raw HTML surrounding exact report title
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, requests
          urls=[
            'https://www.sgpjbg.com/zhuanti/xianweixingyequshibaogao.html',
            'https://bg.sgpjbg.com/zhuanti/xianweixingyequshibaogao.html',
          ]
          needles=['蒙泰高新','丙纶长丝行业领跑者','双基地强势进军碳纤维','230613（33页）','230613(33页)']
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          for url in urls:
            r=s.get(url,timeout=90,allow_redirects=True);t=html.unescape(r.text).replace('\\/','/')
            print('META='+json.dumps({'url':url,'final':r.url,'status':r.status_code,'bytes':len(r.content),'encoding':r.encoding},ensure_ascii=False))
            for needle in needles:
              positions=[m.start() for m in re.finditer(re.escape(needle),t,re.I)]
              print('COUNT='+json.dumps({'url':url,'needle':needle,'count':len(positions),'positions':positions[:30]},ensure_ascii=False))
              for i,pos in enumerate(positions[:10]):
                frag=t[max(0,pos-2500):pos+3500]
                print('CONTEXT='+json.dumps({'url':url,'needle':needle,'index':i,'fragment':frag},ensure_ascii=False))
            # Also inspect all numeric IDs near any string containing 蒙泰.
            for m in re.finditer('蒙泰',t):
              frag=t[max(0,m.start()-5000):m.start()+5000]
              ids=sorted(set(re.findall(r'(?:baogao|bgdown|View\.aspx\?id=|id[=:/"\'])(\d{5,8})',frag,re.I)))
              nums=sorted(set(re.findall(r'\b(12\d{4}|13\d{4}|\d{6})\b',frag)))
              print('NEAR_IDS='+json.dumps({'url':url,'position':m.start(),'ids':ids,'numbers':nums,'fragment':frag},ensure_ascii=False))
          PY
