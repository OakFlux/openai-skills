name: Temporary Loongson fast original report package

on:
  push:
    branches:
      - tmp/loongson-broker-reports-20260830
    paths:
      - .github/workflows/tmp-loongson-fast-originals.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests PyMuPDF Pillow
      - name: Download and package original reports
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time, zipfile
          from pathlib import Path
          import pymupdf, requests
          from PIL import Image, ImageDraw

          CODE='688047'; COMPANY='龙芯中科'; FULL='龙芯中科技术股份有限公司'
          OUT=Path('loongson_fast'); PDFDIR=OUT/'pdfs'; RENDER=OUT/'renders'
          for p in (OUT,PDFDIR,RENDER): p.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          sd=requests.Session(); sd.headers.update({'User-Agent':s.headers['User-Agent'],'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          logs=[]; candidates=[]; saved=[]; renders=[]
          def note(*x):
              line=' '.join(map(str,x)); print(line,flush=True); logs.append(line)
          def clean(x,n=95): return (re.sub(r'[\\/:*?"<>|\r\n]+','_',str(x or '')).strip(' ._') or 'report')[:n]
          def norm(x): return re.sub(r'[\W_]+','',str(x or ''),flags=re.UNICODE).lower()
          def company(x):
              t=re.sub(r'\s+','',str(x or '')); return COMPANY in t or CODE in t or FULL in t
          def score(x):
              title=str(x.get('title') or ''); pages=int(x.get('pages_meta') or 0); v=pages*2
              if any(k in title for k in ['深度报告','公司深度','深度研究','投资价值研究']): v+=120
              elif '深度' in title: v+=80
              if any(k in title for k in ['首次覆盖','首次评级','首次推荐']): v+=90
              if any(k in title for k in ['国产CPU','自主指令集','处理器','生态','国产替代','龙头','领军']): v+=25
              if any(k in title for k in ['点评','季报','中报','年报','业绩快报']): v-=80
              try:v+=max(0,int(str(x.get('date') or '')[:4])-2021)*5
              except:pass
              return v
          def add(x):
              title=str(x.get('title') or '')
              if not company(title+' '+str(x.get('stockName') or '')+' '+str(x.get('stockCode') or '')+' '+json.dumps(x.get('stock') or {},ensure_ascii=False)): return
              if any(k in title for k in ['年度报告','半年度报告','季度报告','招股说明书','调研纪要','会议纪要','摘要','问询函']): return
              if int(x.get('pages_meta') or 0) and int(x.get('pages_meta') or 0)<10: return
              code=str(x.get('code') or '')
              if not code.startswith('AP'): return
              key=(code,norm(title))
              if any(y['_key']==key for y in candidates): return
              x['_key']=key; x['_score']=score(x); candidates.append(x); note('CANDIDATE',json.dumps(x,ensure_ascii=False))

          api='https://reportapi.eastmoney.com/report/list2'
          for begin,end in [('2022-01-01','2023-12-31'),('2024-01-01','2025-12-31'),('2026-01-01','2026-08-30')]:
              for page in range(1,6):
                  body={'beginTime':begin,'endTime':end,'industryCode':'*','ratingChange':'*','rating':'*','orgCode':'*','code':CODE,'rcode':'','pageSize':100,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'qType':0}
                  try:
                      r=s.post(api,json=body,timeout=45,headers={'Content-Type':'application/json','Origin':'https://data.eastmoney.com','Referer':'https://data.eastmoney.com/report/stock.jshtml'})
                      o=r.json(); rows=o.get('data') or []; total=int(o.get('TotalPage') or 1); note('EM',begin,end,page,len(rows),total)
                  except Exception as e: note('EMERR',begin,end,page,repr(e)); break
                  for x in rows:
                      add({'source':'eastmoney','title':x.get('title') or '','org':x.get('orgSName') or x.get('orgName') or '','date':str(x.get('publishDate') or '')[:10],'pages_meta':x.get('attachPages'),'code':x.get('infoCode'),'stockCode':x.get('stockCode') or x.get('code'),'stockName':x.get('stockName') or x.get('name')})
                  if page>=total or not rows: break

          for q in [COMPANY,CODE,f'{COMPANY} 深度报告',f'{COMPANY} 首次覆盖']:
              try:
                  r=sd.post('https://api.sdyanbao.com/api/file/search',json={'page':1,'pageSize':100,'keyword':q},timeout=45); rows=(r.json().get('data') or {}).get('files') or []; note('SD',q,len(rows))
              except Exception as e: note('SDERR',q,repr(e)); continue
              for row in rows:
                  if not company((row.get('name') or '')+' '+json.dumps(row,ensure_ascii=False)): continue
                  detail={}
                  try:
                      d=sd.post('https://api.sdyanbao.com/api/file/detail',json={'id':row.get('id')},timeout=45).json(); detail=d.get('data') if d.get('status')==1 else {}
                  except Exception as e: note('DETAILERR',row.get('id'),repr(e))
                  add({'source':'sdyanbao','title':detail.get('name') or row.get('name') or '','org':((detail.get('organization') or {}).get('name') or (row.get('organization') or {}).get('name') or ''),'date':str(detail.get('time_text') or row.get('time_text') or '')[:10],'pages_meta':detail.get('page_count') or row.get('page_count'),'code':detail.get('data_source_uuid') or row.get('data_source_uuid'),'stock':detail.get('stock') or row.get('stock')})

          candidates.sort(key=lambda x:(x['_score'],x.get('date') or '',int(x.get('pages_meta') or 0)),reverse=True)
          (OUT/'candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2),encoding='utf-8')
          note('TOTAL_CANDIDATES',len(candidates))

          hashes=set()
          for meta in candidates:
              if len(saved)>=8: break
              code=meta['code']; data=None; source=None
              for u in [f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{code}.pdf',f'https://pdf.dfcfw.com/pdf/H3_{code}_1.pdf?{int(time.time()*1000)}.pdf=']:
                  try:
                      r=s.get(u,timeout=90,headers={'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*'}); note('PDF',r.status_code,len(r.content),r.headers.get('content-type'),r.url)
                      if r.status_code==200 and len(r.content)>50000 and r.content.lstrip().startswith(b'%PDF'): data=r.content; source=r.url; break
                  except Exception as e: note('PDFERR',u,repr(e))
              if data is None: continue
              h=hashlib.sha256(data).hexdigest()
              if h in hashes: continue
              tmp=PDFDIR/f'_tmp_{h[:12]}.pdf'; tmp.write_bytes(data)
              try:
                  doc=pymupdf.open(str(tmp)); pages=doc.page_count
                  if pages<10: raise ValueError(f'only {pages} pages')
                  ids=sorted(set([0,1,min(5,pages-1),pages//2,pages-1])); text='\n'.join(doc.load_page(i).get_text('text') for i in ids)
                  if not company(text): raise ValueError('company identity not found')
                  stem=clean(meta['title'],50)
                  for label,i in [('first',0),('middle',pages//2),('last',pages-1)]:
                      pix=doc.load_page(i).get_pixmap(matrix=pymupdf.Matrix(.8,.8),alpha=False); p=RENDER/f'{stem}_{label}.png'; pix.save(str(p)); renders.append((f'{stem}-{label}',p))
                  encrypted=bool(doc.is_encrypted); doc.close()
              except Exception as e:
                  note('VALIDATEERR',meta['title'],repr(e)); tmp.unlink(missing_ok=True); continue
              hashes.add(h); fn=f"{meta['date']}_{clean(meta['org'],30)}_{clean(meta['title'],90)}_{pages}页_原始PDF.pdf"; final=PDFDIR/fn; final.unlink(missing_ok=True); tmp.rename(final)
              saved.append({'file':fn,'title':meta['title'],'org':meta['org'],'date':meta['date'],'pages':pages,'bytes':len(data),'sha256':h,'encrypted':encrypted,'source_url':source,'score':meta['_score']}); note('SAVED',fn)

          unique=[]; seen_titles=set()
          for x in sorted(saved,key=lambda y:(y['score'],y['pages'],y['date']),reverse=True):
              k=norm(x['title'])
              if k in seen_titles: continue
              seen_titles.add(k); unique.append(x)
          selected=[]; orgs=set()
          for x in unique:
              if len(selected)>=3: break
              if x['org'] in orgs: continue
              selected.append(x); orgs.add(x['org'])
          if len(selected)<3:
              for x in unique:
                  if x not in selected: selected.append(x)
                  if len(selected)>=3: break
          selected=selected[:3]
          if len(selected)<2: raise RuntimeError(f'Only {len(selected)} complete original PDFs obtained')
          keep={x['file'] for x in selected}
          for p in PDFDIR.glob('*.pdf'):
              if p.name not in keep: p.unlink()

          thumbs=[]
          for label,p in renders:
              if not p.exists(): continue
              with Image.open(p) as im:
                  im=im.convert('RGB'); im.thumbnail((280,365)); c=Image.new('RGB',(300,405),'white'); c.paste(im,((300-im.width)//2,10)); ImageDraw.Draw(c).text((8,382),label[:48],fill='black'); thumbs.append(c)
          if thumbs:
              cols=3; rows=(len(thumbs)+cols-1)//cols; sheet=Image.new('RGB',(cols*300,rows*405),'white')
              for i,t in enumerate(thumbs): sheet.paste(t,((i%cols)*300,(i//cols)*405))
              sheet.save(OUT/'contact_sheet.jpg',quality=88)

          (OUT/'selected_reports.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2),encoding='utf-8')
          read=['龙芯中科（688047.SH）券商深度报告下载包','',f'完整原始PDF数量：{len(selected)}份','']+[f"{i}. {x['date']}｜{x['org']}｜{x['title']}｜{x['pages']}页" for i,x in enumerate(selected,1)]+['','均为公开原始PDF；未使用短篇点评、网页摘要或缺页预览。','已核验PDF文件头、报告主体、实际页数，并检查首页、中间页和末页。','版权归原发布机构及作者所有，仅供研究参考。']
          (OUT/'README.txt').write_text('\n'.join(read),encoding='utf-8'); (OUT/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  {x['file']}" for x in selected)+'\n',encoding='utf-8'); (OUT/'log.txt').write_text('\n'.join(logs),encoding='utf-8')
          zp=OUT/'loongson_original_broker_reports.zip'
          with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED) as z:
              for p in PDFDIR.glob('*.pdf'): z.write(p,p.name)
              for n in ['README.txt','selected_reports.json','SHA256SUMS.txt']: z.write(OUT/n,n)
          with zipfile.ZipFile(zp) as z:
              if z.testzip(): raise RuntimeError('ZIP integrity failed')
              if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=len(selected): raise RuntimeError('PDF count failed')
          print('\n'.join(read)); print('FINAL_ZIP',zp.stat().st_size)
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: loongson-fast-original-reports
          path: loongson_fast/
          retention-days: 3
          if-no-files-found: error
