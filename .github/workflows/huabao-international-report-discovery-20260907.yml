name: Discover Huabao International broker reports 20260907

on:
  push:
    paths:
      - '.github/workflows/huabao-international-report-discovery-20260907.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query public report APIs and validate available pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p discovery
          python - <<'PY'
          from __future__ import annotations
          import json, re, time, urllib.request, urllib.error
          from pathlib import Path
          from urllib.parse import quote

          out=Path('discovery')
          rows={}
          keywords=[
              '华宝国际','華寶國際','00336','0336.HK','00336.HK','华宝国际 深度',
              '华宝国际 首次覆盖','华宝国际 香精','华宝国际 雾化','Huabao International'
          ]
          api='https://api.sdyanbao.com/api/file/search'
          for keyword in keywords:
              for only_title in (1,0):
                  for page in range(1,5):
                      body={
                          'device':1,'hideTrader':0,'onlyTitle':only_title,'order':0,
                          'page':page,'pageSize':100,'keyword':keyword,'pageCount':'',
                          'dateRange':'','startTime':'','endTime':'','typeIds':[],
                          'industryIds':[],'opFrom':1
                      }
                      data=json.dumps(body,ensure_ascii=False).encode('utf-8')
                      req=urllib.request.Request(api,data=data,headers={
                          'Content-Type':'application/json','User-Agent':'Mozilla/5.0',
                          'Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com',
                          'device':'1'
                      },method='POST')
                      try:
                          with urllib.request.urlopen(req,timeout=90) as r:
                              payload=json.loads(r.read().decode('utf-8'))
                      except Exception as e:
                          print('SEARCH_FAIL',keyword,only_title,page,repr(e),flush=True)
                          break
                      data_obj=payload.get('data') or {}
                      files=data_obj.get('files') or []
                      total=int(data_obj.get('total') or 0)
                      print('SEARCH',keyword,'TITLE',only_title,'PAGE',page,'ROWS',len(files),'TOTAL',total,flush=True)
                      for x in files:
                          blob=json.dumps(x,ensure_ascii=False).replace(' ','').lower()
                          if any(t in blob for t in ['华宝国际','華寶國際','00336','0336.hk','00336.hk','huabaointernational']):
                              rows[str(x.get('id'))]=x
                      if not files or page*100>=total:
                          break
                      time.sleep(.3)

          compact=[]
          for x in rows.values():
              org=x.get('organization') or {}
              res=x.get('researcher') or {}
              typ=x.get('type') or {}
              compact.append({
                  'id':x.get('id'),'name':x.get('name'),'time_text':x.get('time_text'),
                  'page_count':x.get('page_count'),'page_url':x.get('page_url'),
                  'share_url':x.get('share_url'),'data_source':x.get('data_source'),
                  'data_source_uuid':x.get('data_source_uuid'),
                  'organization':org.get('name'),'researcher':res.get('name'),
                  'type':typ.get('name'),'stock':x.get('stock'),
                  'raw':x
              })
          compact.sort(key=lambda z:(str(z.get('time_text') or ''),int(z.get('page_count') or 0)),reverse=True)
          (out/'sdyanbao_results.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2),encoding='utf-8')
          print('SDY_RESULTS',json.dumps([{k:v for k,v in z.items() if k!='raw'} for z in compact],ensure_ascii=False,indent=2),flush=True)

          # For each candidate, inspect detail page and determine exact consecutive public image count.
          inspected=[]
          for row in compact[:80]:
              rid=row.get('id')
              detail=f'https://www.sdyanbao.com/detail/{rid}'
              try:
                  req=urllib.request.Request(detail,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      html=r.read().decode('utf-8','replace')
                  m=re.search(r'page_url:"([^"]+)"',html)
                  pm=re.search(r'page_count:(\d+)',html)
                  page_url=None
                  if m:
                      page_url=m.group(1).replace('\\u002F','/').replace('\\/','/')
                      page_url=page_url.replace('https:////','https://',1)
                  advertised=int(pm.group(1)) if pm else row.get('page_count')
                  available=0; page_sizes=[]
                  if page_url:
                      limit=min(int(advertised or 80),100)
                      for i in range(limit):
                          ok=False
                          for ext in ('png','jpg','jpeg'):
                              u=f'{page_url}/{i}.{ext}'
                              try:
                                  req2=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':detail,'Accept':'image/*'})
                                  with urllib.request.urlopen(req2,timeout=45) as rr:
                                      b=rr.read()
                                      ct=rr.headers.get('content-type','')
                                  sig=b[:16]
                                  if len(b)>10000 and (sig.startswith(b'\x89PNG') or sig.startswith(b'\xff\xd8\xff') or sig.startswith(b'RIFF')):
                                      ok=True; page_sizes.append(len(b)); break
                              except Exception:
                                  pass
                          if not ok:
                              break
                          available += 1
                  rec={k:v for k,v in row.items() if k!='raw'}
                  rec.update({'detail_url':detail,'parsed_page_url':page_url,'advertised_pages':advertised,'available_consecutive_pages':available,'page_sizes':page_sizes})
                  inspected.append(rec)
                  print('INSPECT',rid,'advertised',advertised,'available',available,'title',row.get('name'),flush=True)
              except Exception as e:
                  rec={k:v for k,v in row.items() if k!='raw'}
                  rec.update({'detail_url':detail,'error':repr(e)})
                  inspected.append(rec)
                  print('INSPECT_FAIL',rid,repr(e),flush=True)
          (out/'inspected.json').write_text(json.dumps(inspected,ensure_ascii=False,indent=2),encoding='utf-8')

          # Eastmoney keyword report API as an alternate source.
          em=[]
          endpoints=[
              ('https://reportapi.eastmoney.com/report/list2', {'pageSize':100,'pageNo':1,'beginTime':'2008-01-01','endTime':'2026-09-07','code':'00336','industryCode':'*'}),
              ('https://reportapi.eastmoney.com/report/list2', {'pageSize':100,'pageNo':1,'beginTime':'2008-01-01','endTime':'2026-09-07','code':'0336','industryCode':'*'}),
          ]
          for endpoint,body in endpoints:
              try:
                  req=urllib.request.Request(endpoint,data=json.dumps(body).encode(),headers={'Content-Type':'application/json','User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'},method='POST')
                  with urllib.request.urlopen(req,timeout=90) as r:
                      payload=json.loads(r.read().decode('utf-8','replace'))
                  for x in payload.get('data') or []:
                      blob=json.dumps(x,ensure_ascii=False).lower()
                      if any(t in blob for t in ['华宝国际','華寶國際','00336','0336']):
                          em.append(x)
                  print('EM_ENDPOINT',body.get('code'),'ROWS',len(payload.get('data') or []),'HITS',payload.get('hits'),flush=True)
              except Exception as e:
                  print('EM_FAIL',body.get('code'),repr(e),flush=True)
          # de-duplicate Eastmoney
          ded={}
          for x in em:
              ded[str(x.get('infoCode') or x.get('encodeUrl') or len(ded))]=x
          em=list(ded.values())
          (out/'eastmoney_results.json').write_text(json.dumps(em,ensure_ascii=False,indent=2),encoding='utf-8')
          print('EASTMONEY_RESULTS',json.dumps(em,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-international-report-discovery
          path: discovery/
          if-no-files-found: error
          retention-days: 7
