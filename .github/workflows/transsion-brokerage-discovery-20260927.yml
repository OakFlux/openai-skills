name: Discover public Transsion brokerage reports 20260927

on:
  push:
    paths:
      - '.github/workflows/transsion-brokerage-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query Eastmoney research-report API and probe PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, requests, re
          from urllib.parse import urlencode

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/javascript,*/*;q=0.8',
          })

          url = 'https://reportapi.eastmoney.com/report/list'
          params = {
              'industryCode': '*',
              'pageSize': '100',
              'industry': '*',
              'rating': '*',
              'ratingchange': '*',
              'beginTime': '2019-01-01',
              'endTime': '2026-09-27',
              'pageNo': '1',
              'fields': '',
              'qType': '0',
              'orgCode': '',
              'code': '688036',
              'rcode': '',
              'p': '1',
              'pageNum': '1',
              'pageNumber': '1',
              '_': str(int(time.time()*1000)),
          }
          r = s.get(url, params=params, timeout=60)
          print('API_STATUS', r.status_code, r.url, len(r.content), flush=True)
          print('API_TEXT_HEAD', r.text[:500], flush=True)
          r.raise_for_status()
          data = r.json()
          print('TOP_KEYS', list(data) if isinstance(data, dict) else type(data), flush=True)
          rows = []
          if isinstance(data, dict):
              for key in ('data', 'result', 'reports'):
                  if isinstance(data.get(key), list):
                      rows = data[key]
                      break
              if not rows and isinstance(data.get('data'), dict):
                  for key in ('list','data','rows'):
                      if isinstance(data['data'].get(key), list):
                          rows = data['data'][key]
                          break
          if not rows and isinstance(data, list):
              rows = data
          print('ROW_COUNT', len(rows), flush=True)
          for row in rows:
              print('REPORT_ROW', json.dumps(row, ensure_ascii=False, sort_keys=True), flush=True)
              info = row.get('infoCode') or row.get('info_code') or row.get('INFO_CODE') or row.get('id')
              if not info:
                  continue
              candidates = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info}_1.PDF',
              ]
              for u in candidates:
                  try:
                      rr = s.get(u, timeout=(20,60), allow_redirects=True, stream=True,
                                 headers={'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*;q=0.8'})
                      head = next(rr.iter_content(16), b'')
                      print('PDF_PROBE', rr.status_code, len(rr.headers), rr.headers.get('content-length'), head[:8], u, 'final', rr.url, flush=True)
                      rr.close()
                      if rr.status_code == 200 and head.startswith(b'%PDF-'):
                          break
                  except Exception as e:
                      print('PDF_PROBE_ERROR', repr(e), u, flush=True)
          PY
