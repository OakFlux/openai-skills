name: Build Dongya Pharma 605177 filing package

on:
  push:
    branches: [tmp-dongya-pharma-605177-reports-20261020]
    paths: ['.github/workflows/tmp-dongya-pharma-605177-reports-20261020.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='东亚药业_605177_全部年报_招股说明书_最新季报'
          mkdir -p "$PACKAGE"

          cat > /tmp/build.py <<'PY'
          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import unquote, urljoin

          import requests

          STOCK = '605177'
          COMPANY = '东亚药业'
          OUT = Path('东亚药业_605177_全部年报_招股说明书_最新季报')
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36'
          S = requests.Session()
          S.headers.update({
              'User-Agent': UA,
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7',
              'Accept-Encoding': 'gzip, deflate, br',
          })

          ANNUAL = f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK}/page_type/ndbg.phtml'
          Q1 = f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinYi/stockid/{STOCK}/page_type/yjdbg.phtml'
          Q3 = f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_BulletinSan/stockid/{STOCK}/page_type/sjdbg.phtml'
          PROSPECTUS = f'https://vip.stock.finance.sina.com.cn/corp/go.php/vISSUE_RaiseExplanation/stockid/{STOCK}.phtml'

          anchor_re = re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''', re.I | re.S)
          pdf_re = re.compile(r'''https?://[^\s"'<>]+?\.pdf(?:\?[^\s"'<>]*)?''', re.I)
          revision_words = ('更新后', '修订版', '修订稿', '更正后', '更新版', '修订', '更正')

          def get(url, referer=None, pdf=False):
              headers = {
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,text/html;q=0.8,*/*;q=0.7',
              }
              if referer:
                  headers['Referer'] = referer
              last = None
              for n in range(8):
                  try:
                      r = S.get(url, headers=headers, timeout=300, allow_redirects=True)
                      r.raise_for_status()
                      if pdf and not r.content.startswith(b'%PDF-'):
                          raise RuntimeError(f'not PDF: {r.status_code} {r.headers.get("content-type")} {r.content[:60]!r}')
                      return r.content, r.url
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + n)
              raise RuntimeError(f'fetch failed {url}: {last}')

          def decode(raw):
              for enc in ('utf-8', 'gb18030', 'gbk'):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return raw.decode('utf-8', errors='replace')

          def anchors(page_url):
              raw, final = get(page_url)
              text = decode(raw)
              items = []
              for m in anchor_re.finditer(text):
                  href = unquote(html.unescape(m.group(1).strip()))
                  label = re.sub(r'<[^>]+>', '', m.group(2))
                  label = html.unescape(re.sub(r'\s+', '', label))
                  items.append((label, urljoin(final, href)))
              return items

          def choose_annuals():
              items = anchors(ANNUAL)
              rows = []
              for idx, year in enumerate(range(2020, 2026), 1):
                  candidates = [
                      (label, url) for label, url in items
                      if (f'{year}年年度报告' in label or f'{year}年度报告' in label)
                      and '摘要' not in label and '英文' not in label
                  ]
                  if not candidates:
                      raise RuntimeError(f'No full annual report found for {year}')
                  candidates.sort(key=lambda x: (
                      0 if any(w in x[0] for w in revision_words) else 1,
                      len(x[0]),
                  ))
                  label, url = candidates[0]
                  suffix = '_更新或修订版' if any(w in label for w in revision_words) else ''
                  rows.append(dict(
                      order=idx,
                      kind='年度报告',
                      period=f'{year}年度',
                      title=label,
                      source=url,
                      filename=f'{idx:02d}_东亚药业_{year}年年度报告{suffix}.pdf',
                      min_pages=50,
                  ))
              return rows

          def choose_prospectus(order):
              items = anchors(PROSPECTUS)
              candidates = []
              for label, url in items:
                  if '招股说明书' not in label:
                      continue
                  if any(x in label for x in ('招股意向书', '申报稿', '摘要', '意见落实函', '问询回复')):
                      continue
                  score = 0
                  if '首次公开发行' in label:
                      score -= 10
                  if '上市' in label:
                      score -= 5
                  candidates.append((score, len(label), label, url))
              if not candidates:
                  raise RuntimeError('No formal IPO prospectus found')
              candidates.sort()
              _, _, label, url = candidates[0]
              return dict(
                  order=order,
                  kind='招股说明书',
                  period='首次公开发行并上市',
                  title=label,
                  source=url,
                  filename=f'{order:02d}_东亚药业_首次公开发行股票并上市招股说明书.pdf',
                  min_pages=100,
              )

          def choose_latest_quarter(order):
              q3_items = anchors(Q3)
              q3_candidates = [
                  (label, url) for label, url in q3_items
                  if '2026年' in label
                  and ('第三季度报告' in label or '三季度报告' in label)
                  and '摘要' not in label
              ]
              if q3_candidates:
                  q3_candidates.sort(key=lambda x: (0 if any(w in x[0] for w in revision_words) else 1, len(x[0])))
                  label, url = q3_candidates[0]
                  suffix = '_更新或修订版' if any(w in label for w in revision_words) else ''
                  return dict(
                      order=order,
                      kind='最新季报',
                      period='2026年第三季度',
                      title=label,
                      source=url,
                      filename=f'{order:02d}_东亚药业_2026年第三季度报告{suffix}_最新季报.pdf',
                      min_pages=5,
                  )

              q1_items = anchors(Q1)
              q1_candidates = [
                  (label, url) for label, url in q1_items
                  if '2026年' in label
                  and ('第一季度报告' in label or '一季度报告' in label)
                  and '摘要' not in label
              ]
              if not q1_candidates:
                  raise RuntimeError('No 2026 quarterly report found')
              q1_candidates.sort(key=lambda x: (0 if any(w in x[0] for w in revision_words) else 1, len(x[0])))
              label, url = q1_candidates[0]
              suffix = '_更新或修订版' if any(w in label for w in revision_words) else ''
              return dict(
                  order=order,
                  kind='最新季报',
                  period='2026年第一季度',
                  title=label,
                  source=url,
                  filename=f'{order:02d}_东亚药业_2026年第一季度报告{suffix}_最新季报.pdf',
                  min_pages=5,
              )

          rows = choose_annuals()
          rows.append(choose_prospectus(7))
          rows.append(choose_latest_quarter(8))

          def obtain(row):
              raw, detail = get(row['source'])
              if raw.startswith(b'%PDF-'):
                  return raw, detail
              text = decode(raw)
              candidates = []
              for m in anchor_re.finditer(text):
                  href = unquote(html.unescape(m.group(1).strip()))
                  label = html.unescape(re.sub(r'\s+', '', re.sub(r'<[^>]+>', '', m.group(2))))
                  full = urljoin(detail, href)
                  if '.pdf' in full.lower() or '下载公告' in label or '公告原文' in label or '下载' == label:
                      candidates.append((0 if '下载公告' in label else 1, full))
              for m in pdf_re.finditer(text):
                  candidates.append((2, unquote(html.unescape(m.group(0)))))

              seen = set()
              errors = []
              for _, candidate in sorted(candidates, key=lambda x: (x[0], len(x[1]))):
                  if candidate in seen:
                      continue
                  seen.add(candidate)
                  try:
                      data, final = get(candidate, referer=detail, pdf=True)
                      if len(data) > 50000:
                          return data, final
                  except Exception as exc:
                      errors.append(f'{candidate}: {exc}')
              raise RuntimeError(f'No valid PDF for {row["title"]}; candidates={len(candidates)} errors={errors[:6]}')

          for row in rows:
              data, final = obtain(row)
              if len(data) < 50000:
                  raise RuntimeError(f'too small: {row["title"]} {len(data)}')
              (OUT / row['filename']).write_bytes(data)
              row['pdf_url'] = final
              row['bytes'] = len(data)
              print('SAVED', row['filename'], len(data), final)

          (OUT / '_metadata.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          python3 /tmp/build.py

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5

            pdftotext -f 1 -l 40 "$pdf" "$pdf.txt" 2>/dev/null
            grep -Eq '浙江东亚药业股份有限公司|东亚药业' "$pdf.txt"
            rm -f "$pdf.txt"

            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$pdf" "$pdf.first" >/dev/null 2>&1
            test -s "$pdf.first.png"
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 72 "$pdf" "$pdf.last" >/dev/null 2>&1
            test -s "$pdf.last.png"
            rm -f "$pdf.first.png" "$pdf.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          folder = Path('东亚药业_605177_全部年报_招股说明书_最新季报')
          rows = json.loads((folder / '_metadata.json').read_text(encoding='utf-8'))
          by_name = {r['filename']: r for r in rows}
          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 8:
              raise SystemExit(f'Expected 8 PDFs, found {len(pdfs)}')

          latest = next(r for r in rows if r['kind'] == '最新季报')
          lines = [
              '浙江东亚药业股份有限公司（东亚药业，605177）',
              '上市以来全部年度报告、正式招股说明书及最新季报',
              '整理日期：2026-10-20',
              '',
              '收录说明：',
              '1. 收录公司上市以来2020—2025年度报告全文，共6份；如存在更新、修订或更正版本，优先采用后续版本。',
              '2. 招股说明书采用首次公开发行股票并上市的正式发行版，排除招股意向书、申报稿和摘要。',
              f"3. 截至2026-10-20，最新已披露季度报告为《{latest['title']}》。",
              '4. 2026年半年度报告不属于季度报告，未用其替代“最新季报”。',
              '5. 文件均为公开披露的完整PDF原件；排除年报摘要、英文版和提示性公告。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              r = by_name[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL)
              pages = int(next(x.split(':', 1)[1].strip() for x in info.splitlines() if x.startswith('Pages:')))
              if pages < int(r['min_pages']):
                  raise SystemExit(f'{pdf.name}: only {pages} pages')
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  类型：{r['kind']}；报告期：{r['period']}；页数：{pages}；大小：{len(data)}字节",
                  f"  标题：{r['title']}",
                  f"  PDF来源：{r['pdf_url']}",
                  f'  SHA-256：{sha}',
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、实际页数、正文公司名称、首末页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (folder / '_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 8
          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 8
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Dongya-Pharma-605177-all-annual-prospectus-latest-quarter
          path: 东亚药业_605177_全部年报_招股说明书_最新季报/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
