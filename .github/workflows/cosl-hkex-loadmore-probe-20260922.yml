name: Inspect COSL HKEX load more 20260922
on:
  push:
    paths:
      - '.github/workflows/cosl-hkex-loadmore-probe-20260922.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect scripts
        run: |
          python - <<'PY'
          import re, requests
          s=requests.Session(); s.trust_env=False; s.headers['User-Agent']='Mozilla/5.0 Chrome/151 Safari/537.36'
          for u in ['https://www1.hkexnews.hk/ncms/js/titlesearch.js','https://www1.hkexnews.hk/ncms/js/titlesearch_research.js','https://www1.hkexnews.hk/ncms/js/search.js']:
              r=s.get(u,timeout=120); print('\n===',u,r.status_code,len(r.content),r.headers.get('content-type')); r.raise_for_status(); t=r.text
              for pat in ['function loadMore','loadMoreRange','javax.faces.source','titleSearchResultPanel','recordCountPanel','execute','render']:
                  print('\nPAT',pat)
                  found=False
                  for m in re.finditer(re.escape(pat),t,re.I):
                      print(t[max(0,m.start()-1200):m.start()+3000])
                      found=True
                      break
                  if not found: print('NOT_FOUND')
          PY