name: Probe NESC endpoint and Jingxue report

on:
  push:
    branches:
      - tmp-nesc-endpoint-probe-20261103

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Discover API and search
        shell: bash
        run: |
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          from __future__ import annotations
          import html, json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','X-Requested-With':'XMLHttpRequest'})
          root='https://www.nesc.cn'
          page=s.get(root+'/main/home/search/index.shtml?keyword=%E6%99%B6%E9%9B%AA%E8%8A%82%E8%83%BD',timeout=(20,90),allow_redirects=True)
          page.encoding=page.apparent_encoding or 'utf-8'
          text=html.unescape(page.text).replace('\\/','/')
          soup=BeautifulSoup(text,'html.parser')
          print('SEARCH_PAGE',page.status_code,len(page.content),page.url,page.encoding)
          script_urls=[]
          for tag in soup.find_all('script',src=True):
              u=urljoin(page.url,tag.get('src'))
              if u not in script_urls: script_urls.append(u)
          # Include likely globals even if not explicit.
          for u in [root+'/public/base.js',root+'/static/js/common.js',root+'/static/js/thinkiveJs.min.js',root+'/public/home/search.js']:
              if u not in script_urls: script_urls.append(u)
          candidate_bases=set([root,'http://180.153.57.65/api/cms-gw','https://180.153.57.65/api/cms-gw'])
          for u in script_urls:
              try:
                  r=s.get(u,timeout=(15,60),allow_redirects=True)
                  r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
                  b=html.unescape(r.text).replace('\\/','/')
                  print('\nSCRIPT',u,'STATUS',r.status_code,'BYTES',len(r.content),'URL',r.url)
                  # Print only relevant lines and contexts.
                  for m in re.finditer(r'(?i)(serverPath|cms-gw|/search/list|searchList|baseURL|apiPath)',b):
                      print('SCRIPT_CTX',b[max(0,m.start()-500):m.start()+1800])
                  patterns=[
                      r'(?:var|let|const)\s+serverPath\s*=\s*[\"\']([^\"\']+)',
                      r'serverPath\s*[:=]\s*[\"\']([^\"\']+)',
                      r'(https?://[^\"\'\s]+?/api/cms-gw)',
                      r'([\"\']/[^\"\']*cms-gw[^\"\']*[\"\'])',
                  ]
                  for pat in patterns:
                      for x in re.findall(pat,b,flags=re.I):
                          x=str(x).strip('"\'')
                          if x.startswith('/'):
                              x=urljoin(root,x)
                          if x.startswith('http'):
                              candidate_bases.add(x.rstrip('/'))
              except Exception as e:
                  print('SCRIPT_ERROR',u,repr(e))
          print('\nCANDIDATE_BASES',sorted(candidate_bases))
          endpoints=set()
          for base in candidate_bases:
              endpoints.add(base.rstrip('/')+'/search/list')
          endpoints.update([
              root+'/search/list',root+'/api/cms-gw/search/list',root+'/main/search/list',root+'/cms-gw/search/list',
              root+'/api/search/list',root+'/main/home/search/list',
          ])
          payloads=[
              {'keyword':'晶雪节能','pageNo':'1','pageSize':'100','type':''},
              {'keyword':'301010','pageNo':'1','pageSize':'100','type':''},
              {'keyword':'晶雪节能','pageNo':1,'pageSize':100,'type':'research'},
          ]
          for ep in sorted(endpoints):
              for data in payloads:
                  try:
                      r=s.post(ep,data=data,headers={'Referer':page.url,'Origin':root},timeout=(15,60),allow_redirects=True)
                      body=r.text
                      count=body.count('晶雪节能')+body.count('301010')
                      print('\nPOST',ep,'DATA',data,'STATUS',r.status_code,'BYTES',len(r.content),'URL',r.url,'TYPE',r.headers.get('content-type'),'COUNT',count)
                      print('BODY',body[:8000])
                  except Exception as e:
                      print('POST_ERROR',ep,data,repr(e))
          PY
