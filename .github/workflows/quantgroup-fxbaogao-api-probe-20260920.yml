name: Probe FXBaogao public report APIs 20260920

on:
  push:
    paths:
      - '.github/workflows/quantgroup-fxbaogao-api-probe-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe public APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir out
          python - <<'PY'
          import requests,json
          from pathlib import Path
          s=requests.Session();s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/json, text/plain, */*',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Origin':'https://www.fxbaogao.com',
            'Referer':'https://www.fxbaogao.com/',
            'CLIENT-TYPE-X':'pc',
            'version':'1.0.0',
            'user-id':'0'
          })
          endpoints=[]
          for rid in ('5553065','5609436'):
            endpoints += [
              f'https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId={rid}',
              f'https://api.fxbaogao.com/mofoun/report/searchReport/detail?reportId={rid}',
              f'https://api.fxbaogao.com/mofoun/report/searchReport/detail?id={rid}',
              f'https://api.fxbaogao.com/mofoun/report/searchReportData/detail/anon?chartId={rid}&needParas=0',
              f'https://api.fxbaogao.com/mofoun/report/report/report/preDownV2?reportId={rid}',
              f'https://api.fxbaogao.com/mofoun/report/report/file/downloadReport?reportId={rid}',
            ]
          out=[]
          for i,u in enumerate(endpoints):
            try:
              r=s.get(u,timeout=(15,60),allow_redirects=True)
              rec={'url':u,'status':r.status_code,'final':r.url,'headers':dict(r.headers),'bytes':len(r.content),'body':r.text[:100000]}
              Path(f'out/resp_{i:02d}.txt').write_bytes(r.content)
            except Exception as e: rec={'url':u,'error':repr(e)}
            out.append(rec)
          Path('out/results.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quantgroup-fxbaogao-api-probe
          path: out
          retention-days: 7
