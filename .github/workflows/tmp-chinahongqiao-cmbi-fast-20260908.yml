name: Fast fetch official CMBI China Hongqiao PDFs
on:
  push:
    branches:
      - tmp-chinahongqiao-cmbi-fast-20260908
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install packages
        run: python -m pip install --quiet requests beautifulsoup4 lxml pypdf
      - name: Fetch article links and PDFs
        run: |
          set -euo pipefail
          mkdir -p output/pdfs output/html
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          ids=[6833,10002,10267,11073,12805]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'en-US,en;q=0.9,zh;q=0.8'})
          out={'articles':{},'pdfs':[]}
          for aid in ids:
            url=f'https://www.cmbi.com.hk/article/{aid}.html?lang=en'
            rec={'url':url}
            try:
              r=s.get(url,timeout=30); rec.update(status=r.status_code,final_url=r.url,bytes=len(r.content))
              Path(f'output/html/{aid}.html').write_text(r.text,encoding='utf-8')
              soup=BeautifulSoup(r.text,'lxml'); rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
              rec['body']=' '.join(soup.get_text(' ',strip=True).split())[:5000]
              links=[]
              for t in soup.find_all(['iframe','a','embed','object']):
                raw=t.get('src') or t.get('href') or t.get('data')
                if raw: links.append(urljoin(r.url,raw))
              rec['links']=links
              pdfs=sorted(set([u for u in links if '.pdf' in u.lower()] + re.findall(r'https?://[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',r.text.replace('\\/','/'),re.I)))
              rec['pdf_candidates']=pdfs
              for purl in pdfs:
                ok=False
                for h in [
                  {'Referer':url,'Accept':'application/pdf,*/*'},
                  {'Referer':'https://www.cmbi.com.hk/','Origin':'https://www.cmbi.com.hk','Accept':'application/pdf,*/*'},
                  {'User-Agent':'Mozilla/5.0','Accept':'application/pdf,*/*'}]:
                  try:
                    pr=s.get(purl,headers=h,timeout=60,allow_redirects=True)
                    print('GET',aid,pr.status_code,pr.url,pr.headers.get('content-type'),len(pr.content),flush=True)
                    if pr.content.startswith(b'%PDF'):
                      sha=hashlib.sha256(pr.content).hexdigest(); fn=Path('output/pdfs')/f'{aid}_{sha[:12]}.pdf'; fn.write_bytes(pr.content)
                      rd=PdfReader(str(fn)); pages=len(rd.pages); txt=' '.join(' '.join((rd.pages[i].extract_text() or '') for i in range(min(pages,4))).split())[:12000]
                      row={'article_id':aid,'article_url':url,'pdf_url':pr.url,'file':str(fn),'pages':pages,'bytes':len(pr.content),'sha256':sha,'text_preview':txt}
                      out['pdfs'].append(row); print('PDF',json.dumps(row,ensure_ascii=False),flush=True); ok=True; break
                  except Exception as e: print('ERR',aid,purl,repr(e),flush=True)
                if ok: break
            except Exception as e: rec['error']=repr(e)
            out['articles'][str(aid)]=rec
            print('ARTICLE',aid,json.dumps(rec,ensure_ascii=False)[:20000],flush=True)
          Path('output/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chinahongqiao-cmbi-fast
          path: output/*
          retention-days: 1
