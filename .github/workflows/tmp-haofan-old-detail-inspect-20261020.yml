name: Inspect old Haofan annual detail pages

on:
  push:
    branches: [tmp-haofan-bio-301393-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-old-detail-inspect-20261020.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect links and embedded URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html,re,urllib.parse,urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          urls=[
            'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=3389063',
            'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?stockid=301393&id=3186542',
          ]
          pat=re.compile(r'''<a\b[^>]*href=["']([^"']+)["'][^>]*>(.*?)</a>''',re.I|re.S)
          for url in urls:
            print('\n===== ',url,' =====')
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*;q=0.8'})
            with urllib.request.urlopen(req,timeout=180) as r:
              raw=r.read(); final=r.geturl(); headers=dict(r.headers)
            print('FINAL',final,'LEN',len(raw),'HEADERS',headers)
            text=None
            for enc in ('utf-8','gb18030','gbk'):
              try:
                text=raw.decode(enc); print('ENC',enc); break
              except UnicodeDecodeError:
                pass
            if text is None: text=raw.decode('utf-8','replace')
            print('PDF TOKENS')
            for m in re.finditer(r'[^\s"\'<>]{0,100}(?:pdf|PDF)[^\s"\'<>]{0,180}',text):
              print(m.group(0))
            print('ANCHORS')
            for m in pat.finditer(text):
              href=html.unescape(m.group(1).strip())
              label=re.sub(r'<[^>]+>','',m.group(2))
              label=html.unescape(re.sub(r'\s+','',label))
              full=urllib.parse.urljoin(final,href)
              if '下载' in label or '公告' in label or 'pdf' in full.lower() or 'attach' in full.lower() or 'file' in full.lower():
                print(repr(label),'\t',full)
            print('BODY SNIP',text[-5000:])
          PY
