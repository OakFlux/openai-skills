name: Temporary Reportify expanded viewer inspection
on:
  push:
    branches:
      - tmp-reportify-expand-20260906
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Chromium
        shell: bash
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Click expanded view and record resources
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          records=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':1200})
              page.on('response',lambda response: records.append({'url':response.url,'status':response.status,'type':response.request.resource_type,'content_type':response.headers.get('content-type','')}))
              page.goto('https://reportify.cn/reports/1278761946887360512',wait_until='domcontentloaded',timeout=120000)
              page.wait_for_timeout(8000)
              target=page.locator('[data-original-title="展开"]')
              print('TARGET_COUNT',target.count(),flush=True)
              if target.count():
                  target.first.click(timeout=30000)
                  page.wait_for_timeout(12000)
              print('AFTER_TITLE',page.title(),'URL',page.url,flush=True)
              Path('output/after.html').write_text(page.content(),encoding='utf-8')
              Path('output/responses.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
              page.screenshot(path='output/after.png',full_page=True)
              print('FRAMES',[frame.url for frame in page.frames],flush=True)
              print('IMAGES',page.locator('img').count(),'IFRAMES',page.locator('iframe').count(),flush=True)
              for record in records:
                  value=(record['url']+' '+record['content_type']).lower()
                  if any(key in value for key in ['api.reportify','document','pdf','page','image','preview','file']): print(json.dumps(record,ensure_ascii=False),flush=True)
              browser.close()
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: reportify-expanded-viewer
          path: output/*
          retention-days: 1
          if-no-files-found: error
