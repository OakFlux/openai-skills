name: Query Xinbang announcement metadata
on:
  push:
    paths:
      - '.github/workflows/xinbang-announcements-query-20261014.yml'
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-24.04
    steps:
      - name: Query
        run: |
          mkdir -p out
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0' \
            'https://np-anotice-stock.eastmoney.com/api/security/ann?sr=-1&page_size=100&page_index=1&ann_type=A&client_source=web&stock_list=301112&f_node=0&s_node=0' \
            -o out/announcements.json
          python -m json.tool out/announcements.json > out/announcements.pretty.json
          grep -E '证券|保荐|财务顾问|核查|跟踪报告|投资价值' out/announcements.pretty.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: xinbang-announcement-metadata
          path: out
          retention-days: 7
