name: Diagnose Tianwei report sources v2

on:
  pull_request:
    paths:
      - 'tasks/tianwei-broker-diagnostic-v2-20261012.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Inspect source endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re, pathlib, urllib.parse, html
          import requests
          from bs4 import BeautifulSoup

          out = pathlib.Path('diag2')
          out.mkdir(exist_ok=True)
          s = requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def fetch(name,url,**kwargs):
            try:
              r=s.get(url,timeout=(20,120),allow_redirects=True,**kwargs)
              (out/f'{name}.bin').write_bytes(r.content)
              print(f'FETCH {name} status={r.status_code} bytes={len(r.content)} type={r.headers.get("content-type")} url={r.url}')
              print('HEAD',repr(r.content[:400]))
              return r
            except Exception as e:
              print('FETCH_ERROR',name,repr(e),url)
              return None

          login=fetch('baogaobox_login','https://www.baogaobox.com/e/member/login/loginjs_report.php?id=20971')
          if login is not None:
            try: print('LOGIN_TEXT',login.content.decode('utf-8','ignore')[:10000])
            except Exception: pass

          cover='https://zy.baogaobox.com/file/p/2024/06-24/imguh6a1626h5plhqkyt9xid00020971.webp'
          stem='uh6a1626h5plhqkyt9xid00020971'
          candidates=[]
          for d in ['p','f','r','pdf','d','download']:
            for prefix in ['', 'img','pdf','file','doc','report']:
              for ext in ['pdf','PDF']:
                candidates.append(f'https://zy.baogaobox.com/file/{d}/2024/06-24/{prefix}{stem}.{ext}')
          candidates += [
            'https://zy.baogaobox.com/file/p/2024/06-24/imguh6a1626h5plhqkyt9xid00020971.webp.pdf',
            'https://zy.baogaobox.com/file/p/2024/06-24/20971.pdf',
            'https://zy.baogaobox.com/file/pdf/20971.pdf',
            'https://www.baogaobox.com/e/DownSys/DownSoft/?classid=21&id=20971&pathid=0',
            'https://www.baogaobox.com/e/DownSys/GetDownPath/?classid=21&id=20971&pathid=0',
            'https://www.baogaobox.com/e/DownSys/DownSoft/?classid=2&id=20971&pathid=0',
          ]
          seen=set()
          for i,u in enumerate(candidates):
            if u in seen: continue
            seen.add(u)
            try:
              r=s.get(u,timeout=(10,40),allow_redirects=True,stream=True,headers={'Referer':'https://www.baogaobox.com/reports/240622000020971.html'})
              first=next(r.iter_content(1024),b'')
              if r.status_code != 404 or first.startswith(b'%PDF') or len(first)>0 and r.headers.get('content-length') not in (None,'0'):
                print('CANDIDATE',i,r.status_code,r.headers.get('content-type'),r.headers.get('content-length'),r.url,repr(first[:80]))
              if first.startswith(b'%PDF'):
                data=first+b''.join(r.iter_content(1024*1024))
                (out/f'candidate_{i}.pdf').write_bytes(data)
                print('FOUND_PDF',u,len(data))
            except Exception as e:
              print('CANDIDATE_ERROR',i,repr(e),u)

          # Parse Bing result cards accurately.
          queries=[
            '"天微电子" "军用灭火防爆系统龙头"',
            '天微电子 688511 券商 研报 PDF',
            '"天微电子" "首次覆盖"',
            '"天微电子" 研究报告',
            'site:hangyan.co/reports 天微电子',
            'site:sgpjbg.com 天微电子 研报',
            'site:reportify.cn 天微电子',
            'site:fxbaogao.com 天微电子 688511',
          ]
          all_results=[]
          for qi,q in enumerate(queries):
            u='https://www.bing.com/search?q='+urllib.parse.quote(q)+'&count=50'
            r=fetch(f'bing_{qi}',u)
            if r is None: continue
            soup=BeautifulSoup(r.text,'lxml')
            for li in soup.select('li.b_algo'):
              a=li.select_one('h2 a')
              if not a: continue
              title=' '.join(a.get_text(' ',strip=True).split())
              href=a.get('href','')
              snippet=' '.join((li.select_one('.b_caption') or li).get_text(' ',strip=True).split())[:1000]
              rec={'q':q,'title':title,'href':href,'snippet':snippet}
              all_results.append(rec)
              print('BING_RESULT',json.dumps(rec,ensure_ascii=False))
          (out/'bing_results.json').write_text(json.dumps(all_results,ensure_ascii=False,indent=2),encoding='utf-8')

          # Parse Baidu cards and attempt redirect resolution.
          bq='"天微电子" "军用灭火防爆系统龙头" PDF'
          br=fetch('baidu_results','https://www.baidu.com/s?wd='+urllib.parse.quote(bq))
          bres=[]
          if br is not None:
            soup=BeautifulSoup(br.text,'lxml')
            for a in soup.select('h3 a'):
              title=' '.join(a.get_text(' ',strip=True).split())
              href=a.get('href','')
              final=href
              try:
                rr=s.get(href,timeout=(10,30),allow_redirects=True,stream=True)
                final=rr.url
                rr.close()
              except Exception as e:
                final=href+' ERROR '+repr(e)
              rec={'title':title,'href':href,'final':final}
              bres.append(rec); print('BAIDU_RESULT',json.dumps(rec,ensure_ascii=False))
          (out/'baidu_results.json').write_text(json.dumps(bres,ensure_ascii=False,indent=2),encoding='utf-8')

          # Fetch Hangyan JS and inspect endpoint strings.
          js=fetch('hangyan_js','https://cdn.hangyan.co/assets/application-ec845e69.js')
          if js is not None:
            text=js.text
            strings=set()
            for m in re.findall(r'["\']([^"\']{3,250})["\']',text):
              if any(k in m.lower() for k in ('report','chart','search','api','download','qingstor','s3')):
                strings.add(m)
            for x in sorted(strings): print('JS_STRING',x[:500])
            (out/'hangyan_strings.txt').write_text('\n'.join(sorted(strings)),encoding='utf-8')

          # Probe likely Hangyan report/search endpoints.
          probes=[
            'https://www.hangyan.co/reports?keyword=%E5%A4%A9%E5%BE%AE%E7%94%B5%E5%AD%90',
            'https://www.hangyan.co/reports?q=%E5%A4%A9%E5%BE%AE%E7%94%B5%E5%AD%90',
            'https://www.hangyan.co/reports?query=%E5%A4%A9%E5%BE%AE%E7%94%B5%E5%AD%90',
            'https://www.hangyan.co/reports?search=%E5%A4%A9%E5%BE%AE%E7%94%B5%E5%AD%90',
            'https://www.hangyan.co/reports/3396484144153232497',
            'https://www.hangyan.co/api/charts/3396484144153232497',
            'https://www.hangyan.co/charts/3396484144153232497.json',
          ]
          for i,u in enumerate(probes):
            r=fetch(f'probe_{i}',u)
            if r is not None:
              txt=r.text
              for m in re.findall(r'https?://[^\s"\'<>]+',txt):
                if any(k in m.lower() for k in ('pdf','qingstor','report','download')):
                  print('PROBE_LINK',i,m[:1000])
              if '天微电子' in txt or '军用灭火' in txt:
                print('PROBE_CONTAINS_TIANWEI',i,txt[:10000])
          PY
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: tianwei-report-source-diagnostics-v2
          path: diag2/
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
