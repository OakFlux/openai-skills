name: Package Songyuan Safety 300893 broker deep reports 20261020

on:
  push:
    paths:
      - '.github/workflows/songyuan-300893-broker-deep-reports-package-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          COMPANY='松原安全'
          OLD_NAME='松原股份'
          FULL='浙江松原汽车安全系统股份有限公司'
          CODE='300893'
          OUT=Path('final_out')
          RENDER=Path('verification_renders')
          ART=Path('artifact_out')
          for d in (OUT, RENDER, ART):
              d.mkdir(parents=True, exist_ok=True)

          reports=[
            {
              'order':1,
              'broker':'开源证券',
              'date':'2026-02-23',
              'title':'公司首次覆盖报告：本土汽车被动安全新星，业绩高增迈向全球',
              'info_code':'AP202602231819984097',
              'expected_pages':19,
              'filename':'01_2026-02-23_开源证券_首次覆盖_本土汽车被动安全新星_业绩高增迈向全球.pdf'
            },
            {
              'order':2,
              'broker':'上海证券',
              'date':'2025-10-29',
              'title':'被动安全第二曲线发力，海外业务订单助力营收稳步增长',
              'info_code':'AP202510291771110329',
              'expected_pages':20,
              'filename':'02_2025-10-29_上海证券_被动安全第二曲线发力_海外订单助力营收增长.pdf'
            },
            {
              'order':3,
              'broker':'中邮证券',
              'date':'2023-09-07',
              'title':'汽车被动安全实力新秀，零部件国产替代优选标的',
              'info_code':'AP202309061597839776',
              'expected_pages':38,
              'filename':'03_2023-09-07_中邮证券_汽车被动安全实力新秀_零部件国产替代优选标的.pdf'
            },
          ]

          session=requests.Session(); session.trust_env=False
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':f'https://data.eastmoney.com/report/{CODE}.html',
            'Accept':'application/pdf,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download_pdf(info_code:str):
              urls=[
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
              ]
              last={}
              for url in urls:
                  for attempt in range(1,7):
                      try:
                          r=session.get(url,timeout=(30,420),allow_redirects=True)
                          last={
                              'requested_url':url,'final_url':str(r.url),'status':r.status_code,
                              'bytes':len(r.content),'content_type':r.headers.get('content-type','')
                          }
                          if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100_000:
                              return r.content,str(r.url),last
                      except Exception as exc:
                          last={'requested_url':url,'error':repr(exc)}
                      time.sleep(attempt)
              raise RuntimeError(f'PDF download failed {info_code}: {last}')

          manifest=[]
          for item in reports:
              data,source_url,download_meta=download_pdf(item['info_code'])
              dest=OUT/item['filename']
              dest.write_bytes(data)

              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages<15:
                  raise RuntimeError(f'Too few pages: {dest.name} = {pages}')
              if abs(pages-item['expected_pages'])>2:
                  raise RuntimeError(f'Unexpected page count: {dest.name}; actual={pages}, expected={item["expected_pages"]}')

              sample=[]
              sample_indices=list(range(min(14,pages)))+[max(0,pages-2),pages-1]
              for index in dict.fromkeys(sample_indices):
                  try:
                      sample.append(reader.pages[index].extract_text() or '')
                  except Exception:
                      pass
              text='\n'.join(sample)
              if not any(token in text for token in [COMPANY,OLD_NAME,FULL,CODE,'浙江松原']):
                  txt=dest.with_suffix('.txt')
                  subprocess.run(['pdftotext','-f','1','-l',str(min(16,pages)),str(dest),str(txt)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  text=txt.read_text(encoding='utf-8',errors='ignore')
                  txt.unlink(missing_ok=True)
              identity_ok=any(token in text for token in [COMPANY,OLD_NAME,FULL,CODE,'浙江松原'])
              broker_ok=item['broker'] in text or item['broker'].replace('证券','') in text
              if not identity_ok:
                  raise RuntimeError(f'Issuer identity check failed: {dest.name}')
              if not broker_ok:
                  raise RuntimeError(f'Broker identity check failed: {dest.name}')

              q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              if q.returncode!=0:
                  raise RuntimeError(f'qpdf check failed: {dest.name}: {q.stdout[-1200:]}')

              first=RENDER/f'{item["order"]:02d}_first'
              last=RENDER/f'{item["order"]:02d}_last'
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(first)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','100','-singlefile',str(dest),str(last)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              first_png=Path(str(first)+'.png')
              last_png=Path(str(last)+'.png')
              if not first_png.exists() or first_png.stat().st_size<8_000:
                  raise RuntimeError(f'First-page render failed: {dest.name}')
              if not last_png.exists() or last_png.stat().st_size<3_000:
                  raise RuntimeError(f'Last-page render failed: {dest.name}')

              sha=hashlib.sha256(data).hexdigest()
              manifest.append({
                  'stock_code':CODE,
                  'stock_name_current':COMPANY,
                  'stock_name_at_report': COMPANY if item['date'] >= '2025-01-01' else OLD_NAME,
                  'broker':item['broker'],
                  'publish_date':item['date'],
                  'title':item['title'],
                  'info_code':item['info_code'],
                  'pages':pages,
                  'bytes':len(data),
                  'sha256':sha,
                  'source_url':source_url,
                  'report_page':f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
                  'filename':item['filename'],
                  'identity_check':identity_ok,
                  'broker_check':broker_ok,
                  'validation':['PDF header','company identity','broker identity','page count','qpdf structure','first-page render','last-page render'],
                  'download_meta':download_meta,
              })

          if len(manifest)!=3 or len({item['sha256'] for item in manifest})!=3:
              raise RuntimeError('Report count or duplicate check failed')

          readme=[
              '松原安全（300893.SZ；原简称“松原股份”）券商深度报告资料包',
              '整理日期：2026-10-20','',
              '收录数量：3份，均为公司专属、公开可完整下载的长篇券商研究报告。',
              '筛选口径：优先首次覆盖、公司深度和系统性研究；排除季报点评、转债报告、短篇跟踪、网页摘要、缺页预览及同业报告。','',
              '文件清单：'
          ]
          for index,item in enumerate(manifest,1):
              readme += [
                  f'{index}. {item["filename"]}',
                  f'   券商：{item["broker"]}；发布日期：{item["publish_date"]}；实际页数：{item["pages"]}页',
                  f'   标题：{item["title"]}',
                  f'   研报页面：{item["report_page"]}',
                  f'   PDF来源：{item["source_url"]}',
                  f'   SHA-256：{item["sha256"]}',''
              ]
          readme += [
              '核验说明：每份PDF均已检查文件头、公司名称/证券代码、券商身份、实际页数、qpdf结构以及首页和末页渲染；已排除重复文件。',
              '最终ZIP已执行CRC完整性检查。'
          ]
          (OUT/'00_文件清单与筛选口径.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'松原安全长篇研报候选清单.json').write_text(json.dumps([
              {'publishDate':'2026-02-23','attachPages':19,'orgSName':'开源证券','title':'公司首次覆盖报告：本土汽车被动安全新星，业绩高增迈向全球','infoCode':'AP202602231819984097'},
              {'publishDate':'2025-10-29','attachPages':20,'orgSName':'上海证券','title':'被动安全第二曲线发力，海外业务订单助力营收稳步增长','infoCode':'AP202510291771110329'},
              {'publishDate':'2023-12-13','attachPages':35,'orgSName':'国信证券','title':'汽车安全带国产领军企业，品类拓展加速自主崛起','infoCode':'AP202312131614065128'},
              {'publishDate':'2023-09-07','attachPages':38,'orgSName':'中邮证券','title':'汽车被动安全实力新秀，零部件国产替代优选标的','infoCode':'AP202309061597839776'},
              {'publishDate':'2023-05-25','attachPages':26,'orgSName':'东吴证券','title':'被动安全自主龙头，国产替代空间广阔','infoCode':'AP202305241587149202'},
              {'publishDate':'2022-12-05','attachPages':20,'orgSName':'开源证券','title':'公司首次覆盖报告：被动安全系统集成供应商，加速推进国产替代','infoCode':'AP202212051580832181'},
              {'publishDate':'2022-08-02','attachPages':20,'orgSName':'国金证券','title':'汽车安全系统优质供应商，国产替代前景可期','infoCode':'AP202208021576790153'},
              {'publishDate':'2021-11-23','attachPages':32,'orgSName':'太平洋','title':'松原股份：优质赛道潜力之星，深度受益自主崛起','infoCode':'AP202111231530679919'},
          ],ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest),encoding='utf-8')

          zip_path=ART/'松原安全_300893_券商深度报告_3份_公开完整PDF.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path,arcname=path.name)
          with zipfile.ZipFile(zip_path,'r') as archive:
              bad=archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
              if len([name for name in archive.namelist() if name.lower().endswith('.pdf')])!=3:
                  raise RuntimeError('ZIP PDF count mismatch')

          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: songyuan-300893-broker-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
