name: Build corrected Hytera 002583 annual reports and latest quarter 20261029

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hytera-002583-all-filings-20261029-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import math
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '002583'
          ORG_ID = '9900019838'
          SHORT = '海能达'
          FULL = '海能达通信股份有限公司'
          PACKAGE = '海能达_002583_2020-2025年报及最新季报'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36'
          common_headers = {
              'User-Agent': ua,
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          }

          def clean_title(value: str) -> str:
              value = html.unescape(value or '')
              value = re.sub(r'<[^>]+>', '', value)
              value = re.sub(r'\s+', '', value)
              return value

          def query_cninfo(start: str, end: str) -> list[dict]:
              endpoint = 'https://www.cninfo.com.cn/new/hisAnnouncement/query'
              headers = {
                  **common_headers,
                  'Referer': f'https://www.cninfo.com.cn/new/commonUrl/pageOfSearch?url=disclosure/list/search&code={CODE}',
                  'X-Requested-With': 'XMLHttpRequest',
                  'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                  'Accept': 'application/json, text/javascript, */*; q=0.01',
              }
              try:
                  session.get('https://www.cninfo.com.cn/new/index', headers=common_headers, timeout=(20, 60))
              except Exception:
                  pass
              rows: list[dict] = []
              page = 1
              while True:
                  data = {
                      'pageNum': str(page), 'pageSize': '100', 'column': 'szse',
                      'tabName': 'fulltext', 'plate': 'sz',
                      'stock': f'{CODE},{ORG_ID}', 'searchkey': '', 'secid': '',
                      'category': '', 'trade': '', 'seDate': f'{start}~{end}',
                      'sortName': '', 'sortType': '', 'isHLtitle': 'true',
                  }
                  r = session.post(endpoint, headers=headers, data=data, timeout=(30, 120))
                  print('CNINFO_QUERY', start, end, page, r.status_code, len(r.content), r.headers.get('content-type', ''))
                  r.raise_for_status()
                  obj = r.json()
                  anns = obj.get('announcements') or []
                  rows.extend(anns)
                  total = int(obj.get('totalAnnouncement') or len(rows))
                  if not anns or len(rows) >= total or page >= max(1, math.ceil(total / 100)):
                      break
                  page += 1
              return rows

          def choose_report_by_phrase(phrase: str, announcements: list[dict]) -> dict:
              exclusions = ('摘要', '董事会工作报告', '审计报告', '社会责任报告', '财务决算报告', '更正公告', '取消', '关于')
              candidates = []
              for a in announcements:
                  title = clean_title(a.get('announcementTitle', ''))
                  if phrase not in title or any(x in title for x in exclusions):
                      continue
                  score = 0
                  if title.endswith(phrase):
                      score += 100
                  if title == phrase:
                      score += 50
                  if any(x in title for x in ('更新后', '修订版', '更正后')):
                      score += 200
                  candidates.append((score, int(a.get('announcementTime') or 0), a, title))
              if not candidates:
                  available = [clean_title(a.get('announcementTitle', '')) for a in announcements]
                  raise RuntimeError(f'No report found for phrase {phrase}. Available: {available}')
              candidates.sort(key=lambda x: (x[0], x[1]), reverse=True)
              chosen = candidates[0][2]
              chosen['_clean_title'] = candidates[0][3]
              return chosen

          def choose_q3(announcements: list[dict]) -> dict:
              candidates = []
              for a in announcements:
                  title = clean_title(a.get('announcementTitle', ''))
                  if ('2026年三季度报告' in title or '2026年第三季度报告' in title) and not any(x in title for x in ('摘要', '关于')):
                      score = 100 if title.endswith('报告') else 0
                      candidates.append((score, int(a.get('announcementTime') or 0), a, title))
              if not candidates:
                  available = [clean_title(a.get('announcementTitle', '')) for a in announcements]
                  raise RuntimeError(f'No 2026 Q3 report found. Available: {available}')
              candidates.sort(key=lambda x: (x[0], x[1]), reverse=True)
              chosen = candidates[0][2]
              chosen['_clean_title'] = candidates[0][3]
              return chosen

          annual_2022 = choose_report_by_phrase('2022年年度报告', query_cninfo('2023-03-01', '2023-05-31'))
          q3 = choose_q3(query_cninfo('2026-10-28', '2026-10-29'))

          def cninfo_url(a: dict) -> str:
              adjunct = (a.get('adjunctUrl') or '').lstrip('/')
              if not adjunct:
                  raise RuntimeError(f'Missing adjunctUrl: {a}')
              return f'https://static.cninfo.com.cn/{adjunct}'

          sources = [
              {
                  'label': '2020年年度报告（更新后）', 'year': 2020, 'kind': 'annual',
                  'url': 'https://static.cninfo.com.cn/finalpage/2021-05-14/1209971169.PDF',
                  'announcement_title': '2020年年度报告（更新后）',
              },
              {
                  'label': '2021年年度报告', 'year': 2021, 'kind': 'annual',
                  'url': 'https://www.hytera.com/iwov-resources/hytera/12_investors/regular_notice/cn_hytera_2021_annual_report_20220408.PDF',
                  'announcement_title': '2021年年度报告',
              },
              {
                  'label': '2022年年度报告', 'year': 2022, 'kind': 'annual',
                  'url': cninfo_url(annual_2022),
                  'announcement_title': annual_2022.get('_clean_title') or clean_title(annual_2022.get('announcementTitle', '')),
                  'announcement_id': annual_2022.get('announcementId'),
                  'announcement_time': annual_2022.get('announcementTime'),
              },
              {
                  'label': '2023年年度报告', 'year': 2023, 'kind': 'annual',
                  'url': 'https://static.cninfo.com.cn/finalpage/2024-04-30/1219922364.PDF',
                  'announcement_title': '2023年年度报告',
              },
              {
                  'label': '2024年年度报告', 'year': 2024, 'kind': 'annual',
                  'url': 'https://static.cninfo.com.cn/finalpage/2025-04-29/1223378490.PDF',
                  'announcement_title': '2024年年度报告',
              },
              {
                  'label': '2025年年度报告', 'year': 2025, 'kind': 'annual',
                  'url': 'https://static.cninfo.com.cn/finalpage/2026-04-08/1225083403.PDF',
                  'announcement_title': '2025年年度报告',
              },
              {
                  'label': '2026年第三季度报告', 'year': 2026, 'kind': 'quarter',
                  'url': cninfo_url(q3),
                  'announcement_title': q3.get('_clean_title') or clean_title(q3.get('announcementTitle', '')),
                  'announcement_id': q3.get('announcementId'),
                  'announcement_time': q3.get('announcementTime'),
              },
          ]
          (ROOT / 'selected_sources.json').write_text(json.dumps(sources, ensure_ascii=False, indent=2), encoding='utf-8')

          manifest = []
          for index, item in enumerate(sources, 1):
              url = item['url']
              attempts = []
              data = None
              for attempt in range(5):
                  try:
                      if 'hytera.com' in url:
                          referer = 'https://www.hytera.com/cn/investor/regular-notice.html'
                      else:
                          referer = 'https://www.cninfo.com.cn/'
                      r = session.get(
                          url,
                          headers={**common_headers, 'Referer': referer, 'Accept': 'application/pdf,*/*;q=0.8'},
                          timeout=(30, 360), allow_redirects=True,
                      )
                      attempts.append({
                          'attempt': attempt + 1, 'url': url, 'status': r.status_code,
                          'bytes': len(r.content), 'content_type': r.headers.get('content-type', ''),
                          'final_url': r.url,
                      })
                      if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 50000:
                          data = r.content
                          break
                  except Exception as exc:
                      attempts.append({'attempt': attempt + 1, 'url': url, 'error': repr(exc)})
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f'Download failed for {item["label"]}: {attempts}')

              filename = f'{index:02d}_海能达_{item["label"]}.pdf'
              dest = PDFDIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              minimum_pages = 100 if item['kind'] == 'annual' else 5
              if pages < minimum_pages:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(35, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              identity_hits = [x for x in (SHORT, FULL, CODE) if re.sub(r'\s+', '', x) in compact]
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch: {filename}')

              subprocess.run(['qpdf', '--warning-exit-0', '--check', str(dest)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              prefix = PREV / dest.stem
              subprocess.run(['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8000:
                  raise RuntimeError(f'Preview failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **item,
                  'filename': str(Path('原始PDF') / filename),
                  'pages': pages, 'bytes': len(data), 'sha256': sha,
                  'identity_hits': identity_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': ['PDF header', 'issuer identity', 'page count', 'qpdf structure', 'first-page render'],
              })
              print('VERIFIED', item['label'], pages, len(data), sha, url)

          total_pages = sum(x['pages'] for x in manifest)
          readme = [
              '海能达通信股份有限公司（002583.SZ）年度报告及最新季度报告资料包',
              '整理日期：2026-10-29', '',
              '收录范围：2020—2025年年度报告全文，以及截至整理日最新披露的2026年第三季度报告。',
              '2020年年度报告采用后续披露的更新后版本；不收录年度报告摘要、董事会工作报告或单独审计附件。', '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f'{i}. {x["label"]}',
                  f'   页数：{x["pages"]}页；文件：{x["filename"]}',
                  f'   来源：{x["url"]}',
                  f'   SHA-256：{x["sha256"]}', '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与来源.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest), encoding='utf-8')

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')
          english_zip = Path('hytera_002583_2020_2025_annual_reports_latest_quarter.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: hytera-002583-all-filings-final-v2
          path: |
            海能达_002583_2020-2025年报及最新季报.zip
            hytera_002583_2020_2025_annual_reports_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
