name: Inspect Air China Cargo deep report sources 20260927

on:
  push:
    paths:
      - '.github/workflows/air-china-cargo-deep-source-inspect-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect public source pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, html as htmllib
          from urllib.parse import urljoin, unquote
          import requests
          from bs4 import BeautifulSoup

          pages = [
            'https://stock.9fzt.com/list/sz_001391_3.html',
            'https://gmg.9fzt.com/report/SZSE/001391/index.html',
            'https://www.yanbaoke.com/info/W9rfPApogg3R6yGFaoYSTo',
            'https://www.baogaobox.com/reports/260104000089436.html',
            'https://www.nxny.com/author/11378.html',
            'https://emcreative.eastmoney.com/app_fortune/article/index.html?artCode=20260118234710036070960&postId=1655433478',
          ]
          s = requests.Session(); s.trust_env = False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8',
          })
          keywords = ['国货航','001391','跨境电商方兴未艾','航空货运龙头顺势而为','浙商证券','李丹','李逸','pdf','download','file','attach','s3url','encodeUrl','reportId','report_id','url']
          for u in pages:
            print('\n\n================ PAGE ================', flush=True)
            print('URL', u, flush=True)
            try:
              r=s.get(u,timeout=(30,120),allow_redirects=True)
              print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.content),'CTYPE',r.headers.get('content-type'),'ENC',r.encoding,flush=True)
              print('HEADBYTES',r.content[:20],flush=True)
              r.raise_for_status()
              r.encoding=r.apparent_encoding or r.encoding or 'utf-8'
              t=r.text
            except Exception as e:
              print('ERROR',repr(e),flush=True); continue
            title=re.findall(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)
            print('TITLE', [re.sub(r'\s+',' ',x)[:500] for x in title[:3]], flush=True)
            # JSON-LD / Next data
            soup=BeautifulSoup(t,'lxml')
            for sc in soup.find_all('script'):
              sid=sc.get('id') or ''
              stype=sc.get('type') or ''
              txt=sc.string or sc.get_text() or ''
              if sid=='__NEXT_DATA__' or stype=='application/ld+json' or any(k in txt for k in ['跨境电商方兴未艾','001391','s3url','encodeUrl']):
                print('SCRIPT_BLOCK',sid,stype,'LEN',len(txt),txt[:12000].replace('\n',' '),flush=True)
            # links and source URLs
            vals=[]
            patterns=[
              r'https?://[^"\'<>\s\\]+',
              r'(?:href|src|data-url|data-file|data-pdf|data-download|data-src|value)=["\']([^"\']+)["\']',
              r'["\']([^"\']*(?:\.pdf(?:\?[^"\']*)?|download|attach|file|report|001391|W9rfPApogg3R6yGFaoYSTo)[^"\']*)["\']',
            ]
            for pat in patterns:
              for x in re.findall(pat,t,re.I|re.S):
                v=x if isinstance(x,str) else x[0]
                v=htmllib.unescape(v).replace('\\/','/')
                if v.startswith('//'): v='https:'+v
                if v.startswith('/'): v=urljoin(r.url,v)
                if v not in vals: vals.append(v)
            print('CANDIDATE_COUNT',len(vals),flush=True)
            for v in vals:
              low=v.lower()
              if any(k.lower() in low for k in ['pdf','download','attach','file','report','001391','w9rfpapogg3r6ygfaoysto','ap2025','an2025']):
                print('CANDIDATE',v[:2500],flush=True)
            # snippets for key terms
            for kw in keywords:
              ms=list(re.finditer(re.escape(kw),t,re.I))
              if not ms: continue
              print('\nKEYWORD',kw,'COUNT',len(ms),flush=True)
              for m in ms[:12]:
                sn=t[max(0,m.start()-700):min(len(t),m.end()+1800)]
                print('SNIP',re.sub(r'\s+',' ',sn)[:2600],flush=True)
            # Fetch same-origin/detail-looking scripts and inspect API literals (bounded)
            scripts=[]
            for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',t,re.I):
              su=urljoin(r.url,htmllib.unescape(src))
              if su not in scripts: scripts.append(su)
            print('SCRIPT_URLS',json.dumps(scripts[:80],ensure_ascii=False),flush=True)
            for su in scripts[:40]:
              try:
                rr=s.get(su,timeout=(20,80));
                if rr.status_code!=200 or len(rr.content)>3_000_000: continue
                rr.encoding=rr.apparent_encoding or rr.encoding or 'utf-8'; st=rr.text
                if any(k.lower() in st.lower() for k in ['s3url','downloadpdf','pdfurl','reportid','getreport','001391','download']):
                  print('SCRIPT_MATCH',su,'LEN',len(st),flush=True)
                  for kw in ['s3url','downloadpdf','pdfurl','reportid','getreport','001391','download']:
                    for m in list(re.finditer(kw,st,re.I))[:10]:
                      print('SCRIPT_SNIP',kw,re.sub(r'\s+',' ',st[max(0,m.start()-800):min(len(st),m.end()+2000)])[:3000],flush=True)
              except Exception as e:
                print('SCRIPT_ERR',su,repr(e),flush=True)
          PY
