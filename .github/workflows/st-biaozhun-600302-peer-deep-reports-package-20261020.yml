name: Package ST Biaozhun 600302 peer broker deep reports 20261020

on:
  push:
    paths:
      - '.github/workflows/st-biaozhun-600302-peer-deep-reports-package-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package peer reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          TARGET_NAME='ST标准'
          TARGET_FORMER='标准股份'
          TARGET_FULL='西安标准工业股份有限公司'
          TARGET_CODE='600302'
          OUT=Path('final_out'); RENDER=Path('verification_renders'); ART=Path('artifact_out')
          for d in (OUT,RENDER,ART): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'order':1,'peer':'杰克股份','peer_code':'603337','broker':'国金证券','date':'2024-08-22',
              'title':'工业缝纫机龙头，周期成长双轮驱动','info_code':'AP202408221639391858',
              'expected_pages':34,'filename':'01_同业深度_杰克股份_国金证券_工业缝纫机龙头_周期成长双轮驱动.pdf'
            },
            {
              'order':2,'peer':'上工申贝','peer_code':'600843','broker':'粤开证券','date':'2021-06-02',
              'title':'周期上行重启、智能化浪潮已至，龙头进入收获期','info_code':'AP202106021495520267',
              'expected_pages':36,'filename':'02_同业深度_上工申贝_粤开证券_周期上行重启_智能化浪潮已至.pdf'
            },
            {
              'order':3,'peer':'大豪科技','peer_code':'603025','broker':'开源证券','date':'2024-05-12',
              'title':'公司首次覆盖报告：缝制设备电控龙头，拐点或已至','info_code':'AP202405121632918729',
              'expected_pages':20,'filename':'03_同业深度_大豪科技_开源证券_缝制设备电控龙头_拐点或已至.pdf'
            },
          ]

          session=requests.Session(); session.trust_env=False
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept':'application/pdf,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download_pdf(info_code:str):
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
            ]
            last={}
            for url in urls:
              for attempt in range(1,7):
                try:
                  r=session.get(url,timeout=(30,420),allow_redirects=True)
                  last={'requested_url':url,'final_url':str(r.url),'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100_000:
                    return r.content,str(r.url),last
                except Exception as exc:
                  last={'requested_url':url,'error':repr(exc)}
                time.sleep(attempt)
            raise RuntimeError(f'PDF download failed for {info_code}: {last}')

          manifest=[]
          for item in reports:
            data,source_url,download_meta=download_pdf(item['info_code'])
            dest=OUT/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages < 15 or abs(pages-item['expected_pages'])>3:
              raise RuntimeError(f'Unexpected page count: {dest.name} actual={pages} expected={item["expected_pages"]}')

            txt=RENDER/f'{item["order"]:02d}_full.txt'
            subprocess.run(['pdftotext',str(dest),str(txt)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            text=txt.read_text(encoding='utf-8',errors='ignore')
            peer_ok=item['peer'] in text or item['peer_code'] in text
            broker_short=item['broker'].replace('证券','')
            broker_ok=item['broker'] in text or broker_short in text
            sector_ok=any(k in text for k in ['缝制','缝纫','工业缝纫机','缝制设备','缝制机械'])
            if not peer_ok: raise RuntimeError(f'Peer identity check failed: {dest.name}')
            if not broker_ok: raise RuntimeError(f'Broker identity check failed: {dest.name}')
            if not sector_ok: raise RuntimeError(f'Sector relevance check failed: {dest.name}')

            mention_terms=[TARGET_NAME,TARGET_FORMER,TARGET_FULL,TARGET_CODE,'西安标准']
            mention_counts={term:text.count(term) for term in mention_terms}
            target_mentions=sum(mention_counts.values())

            q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            if q.returncode!=0: raise RuntimeError(f'qpdf check failed: {dest.name}: {q.stdout[-1200:]}')

            first=RENDER/f'{item["order"]:02d}_first'; last=RENDER/f'{item["order"]:02d}_last'
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(first)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','100','-singlefile',str(dest),str(last)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            first_png=Path(str(first)+'.png'); last_png=Path(str(last)+'.png')
            if not first_png.exists() or first_png.stat().st_size<8_000: raise RuntimeError(f'First-page render failed: {dest.name}')
            if not last_png.exists() or last_png.stat().st_size<3_000: raise RuntimeError(f'Last-page render failed: {dest.name}')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              'target_stock_name':TARGET_NAME,'target_former_name':TARGET_FORMER,'target_stock_code':TARGET_CODE,
              'material_type':'缝制设备同业券商深度报告（非ST标准公司专属）',
              'peer_company':item['peer'],'peer_stock_code':item['peer_code'],'broker':item['broker'],
              'publish_date':item['date'],'title':item['title'],'info_code':item['info_code'],
              'pages':pages,'bytes':len(data),'sha256':sha,'filename':item['filename'],
              'source_url':source_url,'report_page':f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
              'peer_identity_check':peer_ok,'broker_check':broker_ok,'sector_relevance_check':sector_ok,
              'st_biaozhun_mention_counts':mention_counts,'st_biaozhun_total_mentions':target_mentions,
              'validation':['PDF header','peer company identity','broker identity','sewing-equipment relevance','page count','qpdf structure','first-page render','last-page render'],
              'download_meta':download_meta
            })

          if len(manifest)!=3 or len({m['sha256'] for m in manifest})!=3:
            raise RuntimeError('Report count or duplicate check failed')

          direct_search={
            'target':'ST标准/标准股份（600302）',
            'database':'东方财富券商研报数据库 reportapi.eastmoney.com',
            'search_period':'2000-01-01 至 2026-10-20',
            'exact_company_report_count':0,
            'note':'公开券商研报数据库未返回600302公司专属研报。网页检索结果主要为公司公告、定期报告、行情资讯或非券商自媒体分析。'
          }
          (OUT/'ST标准公司专属券商研报检索结果.json').write_text(json.dumps(direct_search,ensure_ascii=False,indent=2),encoding='utf-8')

          readme=[
            'ST标准（600302.SH，原简称：标准股份）券商研究替代资料包',
            '整理日期：2026-10-20','',
            '重要说明：公开券商研报数据库按证券代码600302检索结果为0，未找到可完整下载并核验的ST标准公司专属深度/首次覆盖报告。',
            '因此本包收录3份与ST标准主营业务最接近的缝制设备同业券商深度报告，供行业格局、产品结构、智能化、周期与估值比较使用。',
            '三份文件均不是券商对ST标准本身的评级、盈利预测或目标价，请勿混同。','',
            '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
            readme += [
              f'{i}. {m["filename"]}',
              f'   同业公司：{m["peer_company"]}（{m["peer_stock_code"]}）；券商：{m["broker"]}',
              f'   发布日期：{m["publish_date"]}；实际页数：{m["pages"]}页',
              f'   标题：{m["title"]}',
              f'   报告内ST标准/标准股份相关关键词合计出现：{m["st_biaozhun_total_mentions"]}次',
              f'   PDF来源：{m["source_url"]}',
              f'   研报页面：{m["report_page"]}',
              f'   SHA-256：{m["sha256"]}',''
            ]
          readme += [
            '筛选与核验口径：优先缝制设备整机、缝制设备智能化及电控系统的公司深度/首次覆盖报告；排除短篇财报点评、网页摘要、行业无关报告和缺页预览。',
            '每份PDF均完成文件头、同业公司、券商、缝制设备主题、页数、qpdf结构、首页和末页渲染检查；最终ZIP已通过CRC完整性检查。'
          ]
          (OUT/'00_文件清单与使用说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["filename"]}\n' for m in manifest),encoding='utf-8')

          zip_path=ART/'ST标准_600302_券商研究替代资料_3份_缝制设备同业深度.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(OUT.iterdir()): z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path,'r') as z:
            bad=z.testzip()
            if bad: raise RuntimeError(f'ZIP CRC failure: {bad}')
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3: raise RuntimeError('ZIP PDF count mismatch')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: st-biaozhun-600302-peer-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
