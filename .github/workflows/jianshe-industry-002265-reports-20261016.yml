name: Build Jianshe Industry 002265 reports package 20261016

on:
  push:
    paths:
      - '.github/workflows/jianshe-industry-002265-reports-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '002265'
          PACKAGE = '建设工业_002265_2020-2025年报及最新季报'
          ROOT = Path(PACKAGE)
          PREVIEW_DIR = ROOT / '首页预览'
          ROOT.mkdir(exist_ok=True)
          PREVIEW_DIR.mkdir(exist_ok=True)

          annual_specs = [
              {'variants':['2020年年度报告'], 'period':'2020', 'filename':'01_建设工业_002265_2020年年度报告_原西仪股份.pdf', 'min_pages':80,
               'fallback':'https://static.cninfo.com.cn/finalpage/2021-03-31/1209492038.PDF'},
              {'variants':['2021年年度报告'], 'period':'2021', 'filename':'02_建设工业_002265_2021年年度报告_原西仪股份.pdf', 'min_pages':80,
               'fallback':'https://static.cninfo.com.cn/finalpage/2022-03-31/1212742504.PDF'},
              {'variants':['2022年年度报告'], 'period':'2022', 'filename':'03_建设工业_002265_2022年年度报告_原西仪股份.pdf', 'min_pages':80,
               'fallback':'https://stockn.xueqiu.com/SZ002265/20230424699310.pdf'},
              {'variants':['2023年年度报告'], 'period':'2023', 'filename':'04_建设工业_002265_2023年年度报告.pdf', 'min_pages':80,
               'fallback':'https://static.cninfo.com.cn/finalpage/2024-04-18/1219650522.PDF'},
              {'variants':['2024年年度报告'], 'period':'2024', 'filename':'05_建设工业_002265_2024年年度报告.pdf', 'min_pages':80,
               'fallback':'https://static.cninfo.com.cn/finalpage/2025-04-24/1223236966.PDF'},
              {'variants':['2025年年度报告'], 'period':'2025', 'filename':'06_建设工业_002265_2025年年度报告.pdf', 'min_pages':80,
               'fallback':'https://static.cninfo.com.cn/finalpage/2026-04-23/1225148136.PDF'},
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/notices/stock/{STOCK_CODE}.html',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api = 'https://np-anotice-stock.eastmoney.com/api/security/ann'
          all_rows: list[dict[str, Any]] = []
          search_pages: list[dict[str, Any]] = []
          for page in range(1, 61):
              params = {
                  'sr':'-1', 'page_size':'100', 'page_index':str(page),
                  'ann_type':'A', 'client_source':'web', 'stock_list':STOCK_CODE,
                  'f_node':'0', 's_node':'0',
              }
              data = None
              last: Any = None
              for attempt in range(8):
                  try:
                      r = session.get(api, params=params, timeout=(20, 120))
                      last = {'status':r.status_code,'text':r.text[:300]}
                      if r.status_code == 200:
                          data = r.json()
                          break
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f'Announcement API failed page {page}: {last}')
              rows = ((data.get('data') or {}).get('list') or [])
              search_pages.append({'page':page,'count':len(rows)})
              if not rows:
                  break
              all_rows.extend(rows)
              if len(rows) < 100:
                  break
              time.sleep(0.08)

          def compact(text: str) -> str:
              return re.sub(r'\s+', '', text or '')

          def art_code(row: dict[str, Any]) -> str:
              return str(row.get('art_code') or row.get('artCode') or '')

          def date_value(row: dict[str, Any]) -> str:
              return str(row.get('display_time') or row.get('displayTime') or '')

          bad_common = [
              '摘要','英文版','取消','问询','回复','审计报告','董事会','监事会',
              '更正公告','提示性公告','社会责任报告','环境、社会及管治报告',
              '可持续发展报告','独立董事述职报告','内部控制评价报告','财务决算报告',
              '年度报告说明会','年度报告网上说明会','募集资金','会计师事务所',
              '前期会计差错更正后的财务报表','财务报表及相关附注',
          ]

          def choose_report(variants: list[str], period: str) -> tuple[dict[str, Any], list[dict[str, Any]]]:
              candidates: list[tuple[int, str, dict[str, Any], str]] = []
              for row in all_rows:
                  raw = str(row.get('title') or '')
                  title = compact(raw)
                  matched = next((key for key in variants if compact(key) in title), None)
                  if not matched or any(compact(x) in title for x in bad_common):
                      continue
                  score = 50
                  key = compact(matched)
                  if title.endswith(key): score += 35
                  if title == key: score += 20
                  if any(x in title for x in ['建设工业','西仪股份','云南西仪']): score += 15
                  if any(x in title for x in ['更正后','修订版','更新后','修订稿']): score += 100
                  if any(x in title for x in ['取消版','已取消']): score -= 100
                  candidates.append((score, date_value(row), row, matched))
              candidates.sort(key=lambda x:(x[0],x[1]), reverse=True)
              if not candidates:
                  raise RuntimeError(f'Missing report {period}: {variants}')
              log = [
                  {'period':period,'matched_variant':matched,'score':score,'date':date,'title':row.get('title'),'art_code':art_code(row)}
                  for score,date,row,matched in candidates[:20]
              ]
              return candidates[0][2], log

          selected: list[dict[str, Any]] = []
          candidate_logs: dict[str, Any] = {}
          for spec in annual_specs:
              row, log = choose_report(spec['variants'], spec['period'])
              candidate_logs[f"{spec['period']}年年度报告"] = log
              selected.append({**spec, 'doc_type':'年度报告', 'row':row})

          quarter_options = [
              (['2026年第三季度报告','2026年三季度报告'], '2026Q3', None),
              (['2026年第一季度报告','2026年一季度报告'], '2026Q1', 'https://static.cninfo.com.cn/finalpage/2026-04-23/1225148150.PDF'),
              (['2025年第三季度报告','2025年三季度报告'], '2025Q3', None),
              (['2025年第一季度报告','2025年一季度报告'], '2025Q1', None),
          ]
          quarter_row = None
          quarter_period = None
          quarter_fallback = None
          quarter_log: list[dict[str, Any]] = []
          for variants, period, fallback in quarter_options:
              try:
                  quarter_row, log = choose_report(variants, period)
                  quarter_period = period
                  quarter_fallback = fallback
                  quarter_log.extend(log)
                  break
              except RuntimeError:
                  continue
          if quarter_row is None or quarter_period is None:
              raise RuntimeError('Missing latest independent quarterly report')
          candidate_logs['最新季报'] = quarter_log
          quarter_title = compact(str(quarter_row.get('title') or ''))
          selected.append({
              'variants':[quarter_title], 'period':quarter_period,
              'filename':f'07_建设工业_002265_{quarter_period}_最新季报.pdf',
              'min_pages':5, 'fallback':quarter_fallback,
              'doc_type':'最新季报', 'row':quarter_row,
          })

          def candidate_urls(row: dict[str, Any], fallback: str | None) -> list[str]:
              art = art_code(row)
              urls: list[str] = []
              if art:
                  urls.extend([
                      f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H1_{art}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H4_{art}_1.pdf',
                  ])
              for key in ['attach_url','adjunct_url','adjunctUrl','url','file_url']:
                  value = row.get(key)
                  if isinstance(value, str) and value.startswith('http'):
                      urls.append(value)
              if fallback:
                  urls.append(fallback)
              unique: list[str] = []
              for url in urls:
                  if url not in unique:
                      unique.append(url)
              return unique

          def fetch_pdf(row: dict[str, Any], fallback: str | None, referer: str) -> tuple[bytes, dict[str, Any], str]:
              last: dict[str, Any] = {}
              for url in candidate_urls(row, fallback):
                  for attempt in range(5):
                      try:
                          rr = session.get(url, timeout=(30, 420), allow_redirects=True, headers={
                              'User-Agent':session.headers['User-Agent'],
                              'Referer':referer,
                              'Accept':'application/pdf,*/*;q=0.8',
                          })
                          last = {
                              'url':url,'status':rr.status_code,'final_url':rr.url,
                              'content_type':rr.headers.get('content-type',''),'bytes':len(rr.content),
                          }
                          if rr.status_code == 200 and rr.content[:5] == b'%PDF-' and len(rr.content) > 25_000:
                              return rr.content, last, url
                      except Exception as exc:
                          last = {'url':url,'error':repr(exc)}
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed {art_code(row)}: {last}')

          accepted_identity = ['建设工业','西仪股份','云南西仪','002265','建设工业集团（云南）股份有限公司','云南西仪工业股份有限公司']
          manifest: list[dict[str, Any]] = []
          for spec in selected:
              row = spec.pop('row')
              fallback = spec.pop('fallback', None)
              art = art_code(row)
              detail_page = f'https://data.eastmoney.com/notices/detail/{STOCK_CODE}/{art}.html' if art else f'https://data.eastmoney.com/notices/stock/{STOCK_CODE}.html'
              data, download_meta, source_url = fetch_pdf(row, fallback, detail_page)
              dest = ROOT / spec['filename']
              dest.write_bytes(data)

              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < spec['min_pages']:
                  raise RuntimeError(f'Too few pages {dest.name}: {pages} < {spec["min_pages"]}')

              extracted = ''
              for p in reader.pages[:min(18, pages)]:
                  try:
                      extracted += '\n' + (p.extract_text() or '')
                  except Exception:
                      pass
              identity_ok = any(x in extracted for x in accepted_identity)
              if not identity_ok:
                  raise RuntimeError(f'Issuer identity check failed: {dest.name}')

              subprocess.run(
                  ['qpdf','--warning-exit-0','--check',str(dest)],
                  check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              prefix = PREVIEW_DIR / dest.stem
              subprocess.run([
                  'pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)
              ], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 8_000:
                  raise RuntimeError(f'Preview render failed: {dest.name}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **spec,
                  'announcement_title':row.get('title'),
                  'announcement_date':date_value(row),
                  'art_code':art,
                  'announcement_detail_page':detail_page,
                  'download_source':source_url,
                  'official_cninfo_index':f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={STOCK_CODE}',
                  'actual_pages':pages,
                  'bytes':len(data),
                  'sha256':sha,
                  'identity_text_check':identity_ok,
                  'download_meta':download_meta,
                  'preview_file':str(Path('首页预览') / preview.name),
                  'validation':['PDF header','announcement-title match','issuer identity','minimum page count','qpdf structure','first-page render'],
              })

          if len(manifest) != 7:
              raise RuntimeError(f'Expected 7 PDFs, got {len(manifest)}')
          expected_periods = {'2020','2021','2022','2023','2024','2025'}
          if {m['period'] for m in manifest if m['doc_type']=='年度报告'} != expected_periods:
              raise RuntimeError('Annual report period set mismatch')

          readme = [
              '建设工业集团（云南）股份有限公司（002265.SZ）2020—2025年年度报告及最新季报资料包',
              '整理日期：2026-10-16',
              '',
              '收录范围：2020—2025年完整年度报告6份，以及截至整理日最新已披露的独立季度报告1份。',
              '公司原证券简称为“西仪股份”，因此2020—2022年年度报告沿用原披露名称。',
              '“最新季报”按第三季度报告优先、其次第一季度报告的顺序自动检索，不将半年度报告替代为季报。',
              '',
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f"{i}. {item['filename']}",
                  f"   类型：{item['doc_type']}；公告标题：{item['announcement_title']}",
                  f"   公告日期：{item['announcement_date']}；页数：{item['actual_pages']}；字节数：{item['bytes']}",
                  f"   公告页面：{item['announcement_detail_page']}",
                  f"   下载来源：{item['download_source']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '校验项目：PDF文件头、公告标题、公司名称/证券代码、最低页数、qpdf结构、首页渲染、ZIP CRC和SHA-256。',
          ]

          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'candidate_selection_log.json').write_text(json.dumps(candidate_logs, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'announcement_search_log.json').write_text(
              json.dumps({'pages':search_pages,'rows_scanned':len(all_rows)}, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest), encoding='utf-8'
          )

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in z.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 7:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')

          ascii_path = Path('jianshe_industry_002265_reports.zip')
          ascii_path.write_bytes(zip_path.read_bytes())
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest())
          print('PDF_COUNT', len(manifest), 'TOTAL_PAGES', sum(x['actual_pages'] for x in manifest))
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: jianshe-industry-002265-reports-final
          path: |
            建设工业_002265_2020-2025年报及最新季报.zip
            jianshe_industry_002265_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
