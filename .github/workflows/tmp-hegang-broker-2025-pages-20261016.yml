name: Find 2025 Hegang report across pages

on:
  push:
    branches: [tmp-hegang-000709-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hegang-broker-2025-pages-20261016.yml']

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query all pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,subprocess,urllib.parse
          for page in range(1,8):
            p={'cb':'datatable1','industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2025-04-12','endTime':'2025-04-17','pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':''}
            url='https://reportapi.eastmoney.com/report/list?'+urllib.parse.urlencode(p,safe='*')
            out=subprocess.check_output(['curl','--http1.1','-fsSL','--retry','4','-A','Mozilla/5.0','-e','https://data.eastmoney.com/report/',url],text=True)
            d=json.loads(re.sub(r'^datatable\d*\(|\)$','',out)); rows=d.get('data') or []
            print('PAGE',page,'ROWS',len(rows),'HITS',d.get('hits'))
            for x in rows:
              code=str(x.get('stockCode') or ''); name=str(x.get('stockName') or ''); title=str(x.get('title') or '')
              if code=='000709' or '河钢股份' in name or '河北钢铁' in name or '河钢股份' in title or '河北钢铁' in title:
                print('MATCH',str(x.get('publishDate',''))[:10],x.get('orgSName') or x.get('orgName'),x.get('attachPages'),x.get('infoCode'),code,name,title)
            if not rows: break
          PY
