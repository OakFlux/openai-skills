name: Temporary Global Eastmoney List2 Search for Orient Gene

on:
  push:
    branches:
      - tmp/orient-gene-broker-reports-20260830
    paths:
      - .github/workflows/tmp-orient-gene-list2-global.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query exact report date windows with JSON POST
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,requests
          from pathlib import Path

          dates=['2020-01-13','2020-11-09','2021-08-05','2022-03-13','2022-03-14']
          needles=['东方生物','东方基因','东方POCT龙头呼之欲出','深耕POCT国际市场','深耕国际市场的POCT全产业链企业','新生代国际化IVD龙头']
          url='https://reportapi.eastmoney.com/report/list2'
          headers={'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/report/stock.jshtml','Origin':'https://data.eastmoney.com','Accept':'application/json,text/plain,*/*','X-Requested-With':'XMLHttpRequest'}
          s=requests.Session();s.headers.update(headers)
          matches=[];diag=[]
          for date in dates:
            for page in range(1,15):
              payload={'beginTime':date,'endTime':date,'industryCode':'*','ratingChange':'*','rating':'*','orgCode':'*','code':'*','rcode':'','pageSize':500,'pageNo':page,'qType':0,'industry':'*','fields':''}
              response=None;error=''
              for attempt in range(1,5):
                try:
                  response=s.post(url,json=payload,timeout=60)
                  if response.status_code==200:break
                  error=f'status={response.status_code} {response.text[:300]}'
                except Exception as e:error=repr(e)
                time.sleep(attempt)
              if response is None or response.status_code!=200:
                diag.append({'date':date,'page':page,'error':error});break
              try:data=response.json();rows=data.get('data') or []
              except Exception as e:
                diag.append({'date':date,'page':page,'error':'json '+repr(e),'head':response.text[:500]});break
              diag.append({'date':date,'page':page,'hits':data.get('hits'),'size':data.get('size'),'rows':len(rows),'totalPage':data.get('TotalPage')})
              for row in rows:
                blob=json.dumps(row,ensure_ascii=False)
                if any(n in blob for n in needles):matches.append(row)
              total=data.get('TotalPage') or 1
              if page>=total or len(rows)<500:break
          dedup=[];seen=set()
          for row in matches:
            key=(row.get('infoCode'),row.get('title'),row.get('publishDate'))
            if key not in seen:seen.add(key);dedup.append(row)
          Path('out').mkdir(exist_ok=True)
          Path('out/orient_gene_list2_global.json').write_text(json.dumps({'matches':dedup,'diagnostics':diag},ensure_ascii=False,indent=2),encoding='utf-8')
          slim=[]
          for x in dedup:
            slim.append({k:x.get(k) for k in ['infoCode','publishDate','orgSName','orgName','title','researcher','ratingName','attachPages','attachSize','encodeUrl','stockName','stockCode'] if k in x})
          print('MATCHES='+json.dumps(slim,ensure_ascii=False),flush=True)
          print('DIAGNOSTICS='+json.dumps(diag,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: orient-gene-list2-global
          path: out/orient_gene_list2_global.json
          if-no-files-found: error
          retention-days: 3
