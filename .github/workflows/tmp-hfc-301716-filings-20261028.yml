name: Build HFC 301716 filing package

on:
  push:
    branches: [tmp-hfc-301716-filings-20261028]
    paths: ['.github/workflows/tmp-hfc-301716-filings-20261028.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests beautifulsoup4 pypdf

      - name: Download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='鸿富诚_301716_招股说明书_上市前审计报告_最新季报'
          mkdir -p "$PACKAGE" /tmp/hfc_check

          python3 - <<'PY'
          from __future__ import annotations

          import html
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import unquote, urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          OUT = Path('鸿富诚_301716_招股说明书_上市前审计报告_最新季报')
          STOCK = '301716'
          COMPANY = '鸿富诚'
          FULL_COMPANY = '深圳市鸿富诚新材料股份有限公司'
          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36'
          S = requests.Session()
          S.trust_env = False
          S.headers.update({
              'User-Agent': UA,
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Accept': 'text/html,application/xhtml+xml,application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
          })

          ANNUAL = f'https://money.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK}/page_type/ndbg.phtml'
          Q3 = f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/{STOCK}/page_type/sjdbg.phtml'
          ALL = f'https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/{STOCK}.phtml'

          def fetch(url: str, *, referer: str | None = None, expect_pdf: bool = False, attempts: int = 8):
              last = None
              for i in range(attempts):
                  try:
                      headers = {}
                      if referer:
                          headers['Referer'] = referer
                      if expect_pdf:
                          headers['Accept'] = 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'
                      r = S.get(url, headers=headers or None, timeout=(30, 360), allow_redirects=True)
                      r.raise_for_status()
                      if expect_pdf and not r.content.startswith(b'%PDF-'):
                          raise RuntimeError(f'not PDF: {r.status_code}, {r.headers.get("content-type")}, {r.content[:40]!r}')
                      return r.content, r.url, r.headers.get('content-type', '')
                  except Exception as exc:
                      last = exc
                      time.sleep(min(2 + i, 10))
              raise RuntimeError(f'fetch failed {url}: {last!r}')

          def decode(raw: bytes, ctype: str = '') -> str:
              prefs = []
              if any(x in ctype.lower() for x in ('gbk', 'gb2312', 'gb18030')):
                  prefs.append('gb18030')
              prefs.extend(['utf-8', 'gb18030', 'gbk'])
              for enc in prefs:
                  try:
                      text = raw.decode(enc)
                      if text.count('\ufffd') < 8:
                          return text
                  except UnicodeDecodeError:
                      pass
              return raw.decode('utf-8', errors='replace')

          def page_links(url: str):
              raw, final, ctype = fetch(url)
              text = decode(raw, ctype)
              soup = BeautifulSoup(text, 'html.parser')
              items = []
              for a in soup.find_all('a', href=True):
                  label = re.sub(r'\s+', '', a.get_text('', strip=True))
                  href = unquote(html.unescape(a.get('href', '').strip()))
                  if href:
                      items.append((label, urljoin(final, href)))
              return items

          pdf_re = re.compile(r'''(?:https?:)?//[^\s"'<>]+?\.pdf(?:\?[^\s"'<>]*)?''', re.I)

          def pdf_candidates(detail_url: str):
              raw, final, ctype = fetch(detail_url)
              if raw.startswith(b'%PDF-'):
                  return [final]
              text = decode(raw, ctype)
              soup = BeautifulSoup(text, 'html.parser')
              scored = []
              for a in soup.find_all('a', href=True):
                  label = re.sub(r'\s+', '', a.get_text('', strip=True))
                  href = unquote(html.unescape(a.get('href', '').strip()))
                  full = urljoin(final, href)
                  if '.pdf' in full.lower() or '下载公告' in label or '公告原文' in label or label == '下载':
                      score = 0 if '下载公告' in label else 1 if '.pdf' in full.lower() else 2
                      scored.append((score, full))
              for m in pdf_re.finditer(text):
                  token = unquote(html.unescape(m.group(0)))
                  if token.startswith('//'):
                      token = 'https:' + token
                  scored.append((2, token))
              seen = set()
              result = []
              for _, candidate in sorted(scored, key=lambda x: (x[0], len(x[1]))):
                  variants = [candidate]
                  if candidate.startswith('http://'):
                      variants.insert(0, 'https://' + candidate[7:])
                  for v in variants:
                      if v not in seen:
                          seen.add(v)
                          result.append(v)
              return result

          def obtain_from_detail(detail_url: str):
              errors = []
              for candidate in pdf_candidates(detail_url):
                  try:
                      data, final, _ = fetch(candidate, referer=detail_url, expect_pdf=True, attempts=5)
                      if len(data) < 50_000:
                          raise RuntimeError(f'too small: {len(data)}')
                      return data, final
                  except Exception as exc:
                      errors.append(f'{candidate}: {exc!r}')
              raise RuntimeError(f'no valid PDF from {detail_url}; {errors[:8]}')

          # Check whether any standalone listed-company annual reports exist.
          annual_items = page_links(ANNUAL)
          standalone_annuals = [
              {'title': label, 'detail_url': url}
              for label, url in annual_items
              if '年度报告' in label and '摘要' not in label and '英文' not in label
          ]

          records = []

          # Formal issued prospectus.
          prospectus_url = 'https://static.cninfo.com.cn/finalpage/2026-09-22/1225574817.PDF'
          data, final, _ = fetch(prospectus_url, expect_pdf=True)
          p = OUT / '01_鸿富诚_首次公开发行股票并在创业板上市招股说明书_正式发行版_2026-09-22.pdf'
          p.write_bytes(data)
          records.append({
              'order': 1,
              'kind': '正式招股说明书',
              'period': '首次公开发行并上市',
              'title': '首次公开发行股票并在创业板上市招股说明书',
              'filename': p.name,
              'source': final,
              'pages': len(PdfReader(str(p), strict=False).pages),
              'bytes': len(data),
          })

          # Official pre-listing audited annual financial statements for 2023-2025.
          audit_url = 'https://reportdocs.static.szse.cn/UpFiles/rasinfodisc1/202605/RAS_202605_211540ECE8AACCF37E418E9B96519ECC553DD8.pdf'
          data, final, _ = fetch(audit_url, expect_pdf=True)
          p = OUT / '02_鸿富诚_2023-2025年度财务报告及审计报告_上市前财务资料.pdf'
          p.write_bytes(data)
          records.append({
              'order': 2,
              'kind': '上市前财务报告及审计报告',
              'period': '2023年度至2025年度',
              'title': '2023年度至2025年度财务报告及审计报告',
              'filename': p.name,
              'source': final,
              'pages': len(PdfReader(str(p), strict=False).pages),
              'bytes': len(data),
          })

          # Latest quarterly report: 2026 Q3.
          q3_items = page_links(Q3)
          candidates = [(label, url) for label, url in q3_items if '2026年' in label and ('第三季度报告' in label or '三季度报告' in label) and '摘要' not in label]
          if not candidates:
              all_items = page_links(ALL)
              candidates = [(label, url) for label, url in all_items if '2026年' in label and ('第三季度报告' in label or '三季度报告' in label) and '摘要' not in label]
          if not candidates:
              raise RuntimeError('2026 third-quarter report not found in public bulletin index')
          candidates.sort(key=lambda x: len(x[0]))
          q3_title, q3_detail = candidates[0]
          data, final = obtain_from_detail(q3_detail)
          p = OUT / '03_鸿富诚_2026年第三季度报告_最新季报.pdf'
          p.write_bytes(data)
          records.append({
              'order': 3,
              'kind': '最新季报',
              'period': '2026年第三季度',
              'title': q3_title,
              'filename': p.name,
              'source': final,
              'detail_url': q3_detail,
              'pages': len(PdfReader(str(p), strict=False).pages),
              'bytes': len(data),
          })

          (OUT / '_metadata.json').write_text(json.dumps({
              'records': records,
              'standalone_annual_reports_found': standalone_annuals,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          for r in records:
              print('SAVED', r['filename'], r['pages'], r['bytes'], r['source'])
          print('STANDALONE_ANNUAL_REPORTS', json.dumps(standalone_annuals, ensure_ascii=False))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 50000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf.txt" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 5
            pdftotext -f 1 -l "$pages" "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '深圳市鸿富诚新材料股份有限公司|鸿富诚' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/hfc_check/$(basename "$pdf")"
            pdftoppm -f 1 -l 1 -singlefile -png -r 90 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 90 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          folder = Path('鸿富诚_301716_招股说明书_上市前审计报告_最新季报')
          meta = json.loads((folder / '_metadata.json').read_text(encoding='utf-8'))
          records = sorted(meta['records'], key=lambda x: x['order'])
          standalone = meta['standalone_annual_reports_found']
          lines = [
              '深圳市鸿富诚新材料股份有限公司（鸿富诚，301716）',
              '招股说明书、上市前年度财务资料及最新季度报告',
              '整理日期：2026-10-28',
              '',
              '收录说明：',
              '1. 鸿富诚于2026年9月29日在深交所创业板上市，截至整理日尚未到首次上市公司年度报告披露期，因此没有可收录的独立上市公司年度报告。',
              '2. 为覆盖用户需要的年度历史财务资料，本包补充收录深交所公开的2023—2025年度财务报告及审计报告；该文件属于IPO上市前审计资料，不冒充上市公司年度报告。',
              '3. 招股说明书采用2026年9月22日披露的正式发行版，不使用招股意向书、申报稿、上会稿或注册稿替代。',
              '4. 最新季报采用2026年第三季度报告，已于2026年10月27日披露。',
              f'5. 年报目录检索结果：独立年度报告数量为{len(standalone)}。',
              '',
              '文件清单：',
          ]
          sums=[]; total_pages=0; total_bytes=0
          for r in records:
              p = folder / r['filename']
              data = p.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              total_pages += int(r['pages']); total_bytes += len(data)
              lines += [
                  f"- {p.name}",
                  f"  类型：{r['kind']}；报告期：{r['period']}；页数：{r['pages']}；大小：{len(data)}字节",
                  f"  标题：{r['title']}",
                  f"  PDF来源：{r['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {p.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、实际页数、正文公司名称及首末页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n', encoding='utf-8')
          (folder / '_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: HFC-301716-prospectus-audit-latest-quarter
          path: 鸿富诚_301716_招股说明书_上市前审计报告_最新季报/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
