name: Inspect Ascletis public report page
on:
  push:
    branches: [chatgpt-ascletis-broker-reports-20260906]
    paths: ['.github/workflows/inspect-sdyanbao-ascletis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/inspect_sdyanbao_ascletis.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdyanbao-ascletis-inspect
          path: |
            sdyanbao_338702.html
            sdyanbao_js_urls.json
          if-no-files-found: error
          retention-days: 1
