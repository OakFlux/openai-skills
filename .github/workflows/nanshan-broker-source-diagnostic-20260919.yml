name: Diagnose Nanshan broker source pages 20260919

on:
  push:
    paths:
      - '.github/workflows/nanshan-broker-source-diagnostic-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium
      - name: Inspect sources
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diag
          python - <<'PY' > diag/diagnostic.log 2>&1
          import asyncio, json, traceback
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          urls = [
              'https://www.360why.com/enterprise/260706000010654.html',
              'https://www.360why.com/enterprise/260702000010607.html',
              'https://www.baogaobox.com/insights/260211000025523.html',
          ]
          out=Path('diag')
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          print('=== REQUESTS ===', flush=True)
          for i,u in enumerate(urls,1):
              try:
                  r=s.get(u,timeout=(20,90),allow_redirects=True)
                  print(i,u,'status',r.status_code,'final',r.url,'type',r.headers.get('content-type'),'bytes',len(r.content),'encoding',r.encoding, flush=True)
                  (out/f'{i:02d}_requests.html').write_bytes(r.content)
                  soup=BeautifulSoup(r.content,'lxml')
                  text=soup.get_text('\n',strip=True)
                  (out/f'{i:02d}_requests_text.txt').write_text(text,encoding='utf-8')
                  print('title',soup.title.get_text(' ',strip=True) if soup.title else None,'textlen',len(text),'company',('南山铝业国际' in text), flush=True)
              except Exception:
                  traceback.print_exc()

          async def main():
              print('=== PLAYWRIGHT ===', flush=True)
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  for i,u in enumerate(urls,1):
                      c=await b.new_context(locale='zh-CN',viewport={'width':1440,'height':1200},user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36')
                      pg=await c.new_page()
                      try:
                          resp=await pg.goto(u,wait_until='domcontentloaded',timeout=90000)
                          print(i,u,'goto status',resp.status if resp else None,'final',pg.url,'title',await pg.title(),flush=True)
                          await pg.wait_for_timeout(5000)
                          text=await pg.locator('body').inner_text()
                          html=await pg.content()
                          print('textlen',len(text),'company',('南山铝业国际' in text),'body-start',repr(text[:500]),flush=True)
                          (out/f'{i:02d}_playwright.html').write_text(html,encoding='utf-8')
                          (out/f'{i:02d}_playwright_text.txt').write_text(text,encoding='utf-8')
                          await pg.screenshot(path=str(out/f'{i:02d}_page.png'),full_page=True)
                      except Exception:
                          traceback.print_exc()
                      finally:
                          await c.close()
                  await b.close()
          try:
              asyncio.run(main())
          except Exception:
              traceback.print_exc()
          PY
          cat diag/diagnostic.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanshan-broker-source-diagnostic
          path: diag
          retention-days: 7
          compression-level: 6
