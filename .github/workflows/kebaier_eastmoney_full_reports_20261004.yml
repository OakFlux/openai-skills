name: Kebaier Eastmoney Full Broker Reports

on:
  push:
    branches:
      - chatgpt-kebaier-broker-reports-20261004
    paths:
      - .github/workflows/kebaier_eastmoney_full_reports_20261004.yml

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Query public API, download and package full PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/reports
          python - <<'PY'
          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          OUT = Path('output')
          REPORTS = OUT / 'reports'
          API = 'https://reportapi.eastmoney.com/report/list'
          PDF_TPL = 'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
          COMPANY_CODE = '920066'
          COMPANY_NAME = '科拜尔'

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def query(code):
              all_rows = []
              for page in range(1, 6):
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*',
                      'rating': '*', 'ratingChange': '*',
                      'beginTime': '2020-01-01', 'endTime': '2030-01-01',
                      'pageNo': str(page), 'fields': '', 'qType': '0',
                      'orgCode': '', 'code': code, 'rcode': '',
                      'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
                  }
                  r = session.get(API, params=params, timeout=90, allow_redirects=True)
                  print('API', code, page, r.status_code, len(r.content), r.url, r.headers.get('content-type'))
                  r.raise_for_status()
                  text = r.text.strip()
                  try:
                      obj = r.json()
                  except Exception:
                      m = re.search(r'^[^(]+\((.*)\)\s*;?$', text, re.S)
                      if not m:
                          raise
                      obj = json.loads(m.group(1))
                  rows = obj.get('data') or obj.get('Data') or obj.get('result') or []
                  if isinstance(rows, dict):
                      rows = rows.get('data') or rows.get('list') or rows.get('records') or []
                  print('ROWS', code, page, len(rows), 'HITS', obj.get('hits'), 'TOTALPAGE', obj.get('TotalPage') or obj.get('totalPage'))
                  for row in rows:
                      print('ROW', json.dumps(row, ensure_ascii=False))
                  all_rows.extend(rows)
                  total_page = obj.get('TotalPage') or obj.get('totalPage') or 1
                  try:
                      if page >= int(total_page):
                          break
                  except Exception:
                      if not rows:
                          break
              return all_rows

          rows = []
          for code in ('920066', '873664', 'BJ920066'):
              try:
                  got = query(code)
                  rows.extend(got)
                  if got:
                      break
              except Exception as exc:
                  print('QUERY_ERROR', code, repr(exc))

          # De-duplicate and retain only Kebaier records.
          dedup = {}
          for row in rows:
              info = str(row.get('infoCode') or row.get('info_code') or row.get('reportId') or '')
              title = str(row.get('title') or row.get('reportTitle') or '')
              stock_code = str(row.get('stockCode') or row.get('code') or '')
              stock_name = str(row.get('stockName') or row.get('name') or '')
              if not info:
                  continue
              if COMPANY_NAME not in title and COMPANY_NAME not in stock_name and COMPANY_CODE not in stock_code:
                  continue
              dedup[info] = row
          records = list(dedup.values())
          print('KEBAIER_RECORD_COUNT', len(records))
          if not records:
              raise RuntimeError('Eastmoney API returned no Kebaier company reports')

          def get_date(row):
              return str(row.get('publishDate') or row.get('publishTime') or row.get('date') or row.get('reportDate') or '')[:10]

          def get_title(row):
              return str(row.get('title') or row.get('reportTitle') or '').strip()

          def get_org(row):
              return str(row.get('orgSName') or row.get('orgName') or row.get('orgNameCn') or '').strip()

          def get_researcher(row):
              value = row.get('researcher') or row.get('researcherName') or row.get('author') or ''
              if isinstance(value, list):
                  return '、'.join(str(x) for x in value)
              return str(value)

          # Prioritize the IPO/deep report plus the latest two updates.
          def priority(row):
              title = get_title(row)
              date = get_date(row)
              if '新股申购' in title or '小巨人' in title:
                  group = 0
              else:
                  group = 1
              return (group, '' if group == 0 else date)

          deep = [r for r in records if '新股申购' in get_title(r) or '小巨人' in get_title(r)]
          deep.sort(key=get_date, reverse=True)
          updates = [r for r in records if r not in deep]
          updates.sort(key=get_date, reverse=True)
          selected = (deep[:1] + updates[:2])[:3]
          if len(selected) < 2:
              selected = sorted(records, key=get_date, reverse=True)[:3]

          manifest = []
          for idx, row in enumerate(selected, 1):
              info = str(row.get('infoCode') or row.get('info_code') or row.get('reportId'))
              title = get_title(row)
              pubdate = get_date(row) or 'unknown-date'
              org = get_org(row) or '券商'
              researcher = get_researcher(row)
              safe_title = re.sub(r'[\\/:*?"<>|]+', '_', title).strip()[:90]
              filename = f'{idx:02d}_{org}_{COMPANY_NAME}_{safe_title}_{pubdate}.pdf'
              url = PDF_TPL.format(info=info)
              last = None
              for attempt in range(4):
                  try:
                      r = session.get(url, timeout=180, allow_redirects=True)
                      print('PDF', info, attempt + 1, r.status_code, len(r.content), r.url, r.headers.get('content-type'))
                      if r.ok and r.content.startswith(b'%PDF-') and len(r.content) > 100_000:
                          path = REPORTS / filename
                          path.write_bytes(r.content)
                          reader = PdfReader(str(path))
                          if reader.is_encrypted:
                              try:
                                  reader.decrypt('')
                              except Exception:
                                  pass
                          pages = len(reader.pages)
                          if pages < 3:
                              raise RuntimeError(f'PDF too short: {pages} pages')
                          data = path.read_bytes()
                          rec = {
                              'filename': filename,
                              'title': title,
                              'institution': org,
                              'researcher': researcher,
                              'publish_date': pubdate,
                              'info_code': info,
                              'source_api': API,
                              'download_url': url,
                              'final_url': r.url,
                              'pages': pages,
                              'bytes': len(data),
                              'sha256': hashlib.sha256(data).hexdigest(),
                              'file_nature': '东方财富公开原始PDF',
                              'raw_metadata': row,
                          }
                          manifest.append(rec)
                          print('VERIFIED', json.dumps({k: rec[k] for k in ('filename','title','institution','publish_date','pages','bytes','sha256')}, ensure_ascii=False))
                          last = None
                          break
                      last = RuntimeError(f'HTTP {r.status_code}, head={r.content[:80]!r}')
                  except Exception as exc:
                      last = exc
                  time.sleep(2 * (attempt + 1))
              if last is not None:
                  raise RuntimeError(f'Failed to download {title}: {last!r}')

          if len(manifest) < 2:
              raise RuntimeError(f'Only {len(manifest)} full PDFs downloaded')

          readme = [
              '科拜尔（920066.BJ）券商研究报告资料包',
              '',
              '文件性质：均为东方财富公开研报接口提供的券商原始PDF，不是网页摘要或人工整理版。',
              '选取口径：优先一份覆盖面较完整的新股申购/深度报告，并搭配两份较新的公司跟踪报告。',
              '文件仅供个人研究与学习使用，版权归原券商及作者所有，不构成投资建议。',
              '',
              '文件清单：',
          ]
          for rec in manifest:
              readme.append(f"- {rec['filename']} | {rec['pages']}页 | {rec['bytes']}字节 | SHA-256 {rec['sha256']}")
          (REPORTS / '00_资料说明.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')
          (REPORTS / '00_文件清单及校验值.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (REPORTS / '00_SHA256SUMS.txt').write_text('\n'.join(f"{r['sha256']}  {r['filename']}" for r in manifest) + '\n', encoding='utf-8')

          zip_path = OUT / 'kebaier_brokerage_deep_reports.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED, compresslevel=8) as zf:
              for path in sorted(REPORTS.iterdir(), key=lambda p: p.name):
                  zf.write(path, arcname=path.name)
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')

          summary = {
              'zip_filename': zip_path.name,
              'zip_bytes': zip_path.stat().st_size,
              'zip_sha256': hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              'report_count': len(manifest),
              'total_pages': sum(r['pages'] for r in manifest),
              'reports': manifest,
              'all_api_records': records,
          }
          (OUT / 'BUILD_SUMMARY.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print('FINAL_SUMMARY', json.dumps({k: summary[k] for k in ('zip_filename','zip_bytes','zip_sha256','report_count','total_pages')}, ensure_ascii=False))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: kebaier-full-brokerage-reports
          path: |
            output/kebaier_brokerage_deep_reports.zip
            output/BUILD_SUMMARY.json
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
