name: Build Baiyun Electric 603861 brokerage reports package 20261014

on:
  push:
    paths:
      - '.github/workflows/baiyun-electric-603861-brokerage-reports-package-20261014-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install PDF validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests pypdf

      - name: Discover, download, validate, and package reports
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          STOCK_CODE = '603861'
          COMPANY = '白云电器'
          OUT_BASE = '白云电器_603861_券商深度及重点研究报告精选'

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          endpoint = 'https://reportapi.eastmoney.com/report/list'
          periods = [
              ('2015-01-01', '2018-12-31'),
              ('2019-01-01', '2022-12-31'),
              ('2023-01-01', '2024-12-31'),
              ('2025-01-01', '2026-10-14'),
          ]

          rows_all: list[dict] = []
          seen_codes: set[str] = set()
          for begin, end in periods:
              for page in range(1, 20):
                  params = {
                      'industryCode': '*',
                      'pageSize': '100',
                      'industry': '*',
                      'rating': '*',
                      'ratingchange': '*',
                      'beginTime': begin,
                      'endTime': end,
                      'pageNo': str(page),
                      'fields': '',
                      'qType': '0',
                      'orgCode': '',
                      'code': STOCK_CODE,
                      'rcode': '',
                      'p': str(page),
                      'pageNum': str(page),
                      'pageNumber': str(page),
                      '_': str(int(time.time() * 1000)),
                  }
                  response = session.get(endpoint, params=params, timeout=60)
                  print('REPORT_QUERY', begin, end, page, response.status_code, len(response.content), response.url, flush=True)
                  response.raise_for_status()
                  payload = response.json()
                  rows = payload.get('data', []) if isinstance(payload, dict) else []
                  print('REPORT_COUNT', len(rows), flush=True)
                  if not rows:
                      break
                  for row in rows:
                      info_code = str(row.get('infoCode') or '')
                      if not info_code or info_code in seen_codes:
                          continue
                      if str(row.get('stockCode') or '') != STOCK_CODE:
                          continue
                      seen_codes.add(info_code)
                      rows_all.append(row)
                  if len(rows) < 100:
                      break

          print('REPORT_TOTAL', len(rows_all), flush=True)
          for row in rows_all:
              compact = {key: row.get(key) for key in [
                  'title', 'stockName', 'stockCode', 'orgSName', 'publishDate',
                  'infoCode', 'attachPages', 'attachSize', 'researcher',
                  'column', 'emRatingName', 'reportType'
              ]}
              print('REPORT_ROW', json.dumps(compact, ensure_ascii=False), flush=True)

          def norm(value: object) -> str:
              text = str(value or '').lower()
              return re.sub(r'[\s，,：:、。·—－\-（）()]+', '', text)

          def pages_of(row: dict) -> int:
              try:
                  return int(row.get('attachPages') or 0)
              except Exception:
                  return 0

          def score(row: dict) -> tuple[int, int, str]:
              title = norm(row.get('title'))
              pages = pages_of(row)
              s = pages * 10
              if '深度' in title:
                  s += 1800
              if '首次覆盖' in title or '首次' in title or '首予' in title:
                  s += 1500
              if '投资价值分析' in title or '专题' in title:
                  s += 1200
              if '公司研究' in title or '公司报告' in title:
                  s += 500
              if '出海' in title or 'aidc' in title or '算力' in title:
                  s += 120
              if any(k in title for k in ['点评', '快评', '动态研究', '业绩', '年报', '季报', '中报', '事件点评', '跟踪报告']):
                  s -= 900
              if pages < 10:
                  s -= 1000
              return (s, pages, str(row.get('publishDate') or ''))

          candidates = [r for r in rows_all if pages_of(r) >= 10]
          candidates.sort(key=score, reverse=True)

          chosen: list[dict] = []
          used_codes: set[str] = set()
          used_brokers: set[str] = set()

          # First pass: deep / first-coverage style reports, preferring broker diversity.
          for row in candidates:
              title = norm(row.get('title'))
              broker = str(row.get('orgSName') or '')
              code = str(row.get('infoCode') or '')
              if code in used_codes:
                  continue
              if not any(k in title for k in ['深度', '首次覆盖', '首次', '首予', '专题', '投资价值分析']):
                  continue
              if broker in used_brokers and len(chosen) < 2:
                  continue
              chosen.append(row)
              used_codes.add(code)
              used_brokers.add(broker)
              if len(chosen) >= 3:
                  break

          # Second pass: longest substantial company reports, still preferring broker diversity.
          if len(chosen) < 3:
              for row in candidates:
                  code = str(row.get('infoCode') or '')
                  broker = str(row.get('orgSName') or '')
                  if code in used_codes:
                      continue
                  if pages_of(row) < 14:
                      continue
                  if broker in used_brokers and len(chosen) < 2:
                      continue
                  chosen.append(row)
                  used_codes.add(code)
                  used_brokers.add(broker)
                  if len(chosen) >= 3:
                      break

          # Final fallback allows 10+ page company research if public long-form coverage is scarce.
          if len(chosen) < 2:
              for row in candidates:
                  code = str(row.get('infoCode') or '')
                  if code in used_codes:
                      continue
                  chosen.append(row)
                  used_codes.add(code)
                  if len(chosen) >= 2:
                      break

          if len(chosen) < 2:
              raise RuntimeError(f'only {len(chosen)} suitable reports found')
          chosen = chosen[:3]
          print('CHOSEN', json.dumps(chosen, ensure_ascii=False, indent=2), flush=True)

          package_name = f'{OUT_BASE}_{len(chosen)}份'
          out_dir = Path(package_name)
          out_dir.mkdir(parents=True, exist_ok=True)

          def clean_filename(value: object) -> str:
              text = str(value or '').strip()
              text = re.sub(r'[\\/:*?"<>|]+', '_', text)
              text = re.sub(r'\s+', '', text)
              return text[:86]

          def pdf_candidates(info_code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.PDF',
              ]

          def download(row: dict, destination: Path) -> str:
              errors: list[str] = []
              expected_kb = int(row.get('attachSize') or 0)
              min_bytes = max(150_000, int(expected_kb * 1024 * 0.40)) if expected_kb else 150_000
              for url in pdf_candidates(str(row.get('infoCode') or '')):
                  for attempt in range(1, 4):
                      temp = destination.with_suffix(destination.suffix + '.part')
                      temp.unlink(missing_ok=True)
                      try:
                          with session.get(
                              url,
                              headers={
                                  'Referer': 'https://data.eastmoney.com/report/',
                                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              },
                              stream=True,
                              allow_redirects=True,
                              timeout=(30, 900),
                          ) as response:
                              print('DOWNLOAD', destination.name, attempt, response.status_code, url, 'final', response.url, flush=True)
                              response.raise_for_status()
                              with temp.open('wb') as fh:
                                  for chunk in response.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = temp.stat().st_size
                          with temp.open('rb') as fh:
                              header = fh.read(8)
                          if size < min_bytes or not header.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF: size={size}, expected_min={min_bytes}, header={header!r}')
                          temp.replace(destination)
                          return str(response.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          temp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {destination.name}: {errors}')

          records: list[dict] = []
          hashes: set[str] = set()
          for index, row in enumerate(chosen, start=1):
              broker = str(row.get('orgSName') or '券商')
              date = str(row.get('publishDate') or '')[:10]
              title = str(row.get('title') or '公司研究报告')
              researcher = str(row.get('researcher') or '').strip()
              rating = str(row.get('emRatingName') or '').strip()
              expected_pages = pages_of(row)
              filename = f'{index:02d}_{clean_filename(broker)}_{date}_{clean_filename(title)}.pdf'
              destination = out_dir / filename
              source_url = download(row, destination)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < 10:
                  raise RuntimeError(f'report too short: {destination.name}, pages={pages}')
              if expected_pages and abs(pages - expected_pages) > 3:
                  raise RuntimeError(f'page count mismatch: {destination.name}, got={pages}, metadata={expected_pages}')

              qpdf = subprocess.run(['qpdf', '--warning-exit-0', '--check', str(destination)], capture_output=True, text=True)
              if qpdf.returncode != 0:
                  raise RuntimeError(f'qpdf failed for {destination.name}: {qpdf.stderr[-2000:]}')

              render_root = out_dir / (destination.stem + '_render_check')
              render = subprocess.run(
                  ['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '96', str(destination), str(render_root)],
                  capture_output=True,
                  text=True,
              )
              render_file = Path(str(render_root) + '.png')
              if render.returncode != 0 or not render_file.exists() or render_file.stat().st_size < 8_000:
                  raise RuntimeError(f'first-page render failed for {destination.name}: {render.stderr[-1000:]}')
              render_size = render_file.stat().st_size
              render_file.unlink(missing_ok=True)

              sample_parts: list[str] = []
              for page_index in range(min(6, pages)):
                  try:
                      sample_parts.append(reader.pages[page_index].extract_text() or '')
                  except Exception:
                      pass
              sample_text = ''.join(''.join(sample_parts).split()).lower()
              if '白云电器' not in sample_text and STOCK_CODE not in sample_text:
                  raise RuntimeError(f'company identity check failed for {destination.name}')

              data = destination.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  raise RuntimeError(f'duplicate PDF detected: {destination.name}')
              hashes.add(digest)

              record = {
                  'filename': destination.name,
                  'company': '广州白云电器设备股份有限公司',
                  'stock_code': '603861.SH',
                  'broker': broker,
                  'date': date,
                  'title': title,
                  'researcher': researcher,
                  'rating': rating,
                  'classification': str(row.get('column') or ''),
                  'info_code': str(row.get('infoCode') or ''),
                  'detail_url': f"https://data.eastmoney.com/report/info/{row.get('infoCode')}.html",
                  'source_pdf_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
                  'first_page_render_bytes': render_size,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '广州白云电器设备股份有限公司（白云电器，603861.SH）券商深度及重点研究报告精选',
              '整理日期：2026-10-14',
              '',
              f'本包收录 {len(records)} 份券商原始排版完整PDF。',
              '筛选原则：优先选择深度、首次覆盖、专题或篇幅较长且研究框架完整的公司报告；不以普通新闻或网页摘要补足数量。',
              '来源：东方财富研究报告公开文件服务器。',
              '全部PDF均完成文件头、文件大小、页数、公司身份、qpdf结构、首页渲染、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for idx, record in enumerate(records, 1):
              readme.extend([
                  f"{idx}. {record['broker']}，{record['date']}，{record['pages']}页",
                  f"   标题：{record['title']}",
                  f"   分析师：{record['researcher'] or '公开元数据未列明'}；评级：{record['rating'] or '公开元数据未列明'}",
                  f"   文件：{record['filename']}",
                  f"   信息代码：{record['info_code']}",
                  f"   PDF来源：{record['source_pdf_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (out_dir / '00_报告清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out_dir / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out_dir / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(package_name + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(out_dir.iterdir()):
                  archive.write(path, arcname=f'{package_name}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != len(records):
                  raise RuntimeError(f'expected {len(records)} PDFs, found {len(pdfs)}')

          print('FINAL_PACKAGE_NAME', package_name, flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: baiyun-electric-603861-brokerage-reports-20261014-v1
          path: 白云电器_603861_券商深度及重点研究报告精选_*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
