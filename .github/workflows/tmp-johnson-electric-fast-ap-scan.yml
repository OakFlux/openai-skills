name: Temporary Johnson Electric fast AP scan

on:
  push:
    branches:
      - tmp-johnson-electric-reports-20260831
    paths:
      - .github/workflows/tmp-johnson-electric-fast-ap-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Scan narrow publication dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests, re
          from datetime import date, timedelta

          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          s=requests.Session(); s.headers.update({'User-Agent':ua,'Referer':'https://data.eastmoney.com/','Accept':'application/json,text/plain,*/*'})
          base_dates=['2025-03-06','2025-03-18','2025-09-28','2025-10-16','2025-11-06','2026-03-04']
          needles=['德昌电机控股','车用电机龙头','有内生优势的人形机器人供应链公司','汽车微电机单车价值提升','液冷水泵、人形机器人零部件弹性可期','全球化电机企业探索人形机器人应用','全球微型电机领军企业']
          hits={}
          for ds in base_dates:
              d=date.fromisoformat(ds)
              for offset in [-1,0,1]:
                  day=(d+timedelta(days=offset)).isoformat()
                  for endpoint in ['list2','list']:
                      for page in range(1,8):
                          try:
                              if endpoint=='list2':
                                  body={'pageSize':500,'pageNo':page,'p':page,'pageNum':page,'pageNumber':page,'beginTime':day,'endTime':day,'code':'','industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''}
                                  r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/','Content-Type':'application/json','Accept':'application/json,text/plain,*/*'},timeout=90)
                              else:
                                  params={'pageNo':str(page),'pageSize':'500','code':'','industryCode':'*','industry':'*','rating':'*','ratingChange':'*','beginTime':day,'endTime':day,'fields':'','qType':'0','orgCode':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                                  r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=90)
                              print('REQ',day,endpoint,page,r.status_code,len(r.content))
                              if r.status_code!=200: break
                              obj=r.json(); rows=obj.get('data') or []
                              print('ROWS',len(rows),'TOTAL_PAGE',obj.get('TotalPage'),'HITS',obj.get('hits'))
                              for row in rows:
                                  blob=' '.join(str(row.get(k) or '') for k in ['title','stockName','stockCode','orgSName','orgName'])
                                  if any(n in blob for n in needles):
                                      info=str(row.get('infoCode') or '')
                                      hits[info or blob]=row
                                      print('MATCH',json.dumps(row,ensure_ascii=False))
                                      if info:
                                          for pre in ['H3','H2','H1']:
                                              u=f'https://pdf.dfcfw.com/pdf/{pre}_{info}_1.pdf'
                                              x=requests.get(u,headers={'User-Agent':ua,'Referer':'https://data.eastmoney.com/','Accept':'application/pdf,*/*','Range':'bytes=0-4095'},timeout=60,allow_redirects=True)
                                              print('PDF',info,pre,x.status_code,len(x.content),x.headers.get('content-type'),x.headers.get('content-range'),repr(x.content[:30]),x.url)
                              total=int(obj.get('TotalPage') or 0)
                              if not rows or (total and page>=total): break
                          except Exception as e:
                              print('ERR',day,endpoint,page,repr(e)); break
          print('FINAL_HITS',json.dumps(hits,ensure_ascii=False,indent=2))
          PY
