name: Find public Eastmoney PDF for 2021 ST Guangtang report v2 20261004

on:
  push:
    paths:
      - '.github/workflows/st-guangtang-eastmoney-2021-report-discovery-v2-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Search Eastmoney by nearby dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests, time
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'application/json,*/*'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          windows=[('2021-10-15','2021-10-20'),('2021-10-01','2021-10-31')]
          seen=set()
          for begin,end in windows:
            print('\nWINDOW',begin,end,flush=True)
            for page in range(1,50):
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingchange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),'_':str(int(time.time()*1000))}
              r=s.get(endpoint,params=params,timeout=60); r.raise_for_status()
              rows=r.json().get('data',[])
              print('PAGE',page,'COUNT',len(rows),flush=True)
              for row in rows:
                info=row.get('infoCode')
                if info in seen: continue
                seen.add(info)
                blob=' '.join(str(row.get(k) or '') for k in ['title','stockName','stockCode','researcher','orgSName'])
                if any(k in blob for k in ['南宁糖业','000911','改革风劲','涅槃重生','糖价助力']):
                  print('MATCH',json.dumps(row,ensure_ascii=False,sort_keys=True),flush=True)
              if len(rows)<100: break
          PY
