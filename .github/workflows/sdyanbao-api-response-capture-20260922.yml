name: Capture Sdyanbao API responses 20260922

on:
  push:
    paths:
      - '.github/workflows/sdyanbao-api-response-capture-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Capture API traffic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/capture.py <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from playwright.async_api import async_playwright
          OUT=Path('out')
          URLS=['https://www.sdyanbao.com/detail/902006','https://www.sdyanbao.com/detail/920346']
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              ctx=await b.new_context(viewport={'width':1440,'height':1000},locale='zh-CN',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36')
              for url in URLS:
                rid=url.rsplit('/',1)[-1]
                page=await ctx.new_page(); rec=[]
                async def on_response(resp):
                  req=resp.request
                  if req.resource_type in ('xhr','fetch') or 'api.sdyanbao.com' in resp.url:
                    item={'url':resp.url,'status':resp.status,'method':req.method,'post_data':req.post_data,'request_headers':await req.all_headers(),'response_headers':await resp.all_headers()}
                    try:
                      body=await resp.body()
                      item['body_bytes']=len(body)
                      try: item['body_text']=body.decode('utf-8')[:1000000]
                      except: item['body_hex']=body[:1000].hex()
                    except Exception as e: item['body_error']=repr(e)
                    rec.append(item)
                page.on('response',on_response)
                await page.goto(url,wait_until='networkidle',timeout=120000)
                await page.wait_for_timeout(5000)
                # click first download and capture API calls after
                try:
                  loc=page.get_by_text('立即下载',exact=True).first
                  if await loc.is_visible(): await loc.click(); await page.wait_for_timeout(6000)
                except Exception: pass
                (OUT/f'{rid}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
                await page.close()
              await b.close()
          asyncio.run(main())
          PY
          python /tmp/capture.py
          grep -RInE 'download|pdf|file|oss|original|url|token|auth|login' out > out/hits.txt || true
          cat out/*.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sdyanbao-api-response-capture
          path: out
          retention-days: 7
          if-no-files-found: error
