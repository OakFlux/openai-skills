name: Package Kangyuan 600557 broker deep reports 20261015

on:
  push:
    paths:
      - '.github/workflows/kangyuan-600557-broker-deep-reports-final-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='康缘药业_600557_券商深度报告_完整版_3份_截至20261015'
          root=Path(package); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)

          reports=[
            {
              'broker':'西南证券','date':'2023-04-13','analysts':'杜向阳','rating':'未标注',
              'title':'引领中药创新，产品矩阵持续丰富','info_code':'AP202304131585417481',
              'terms':['康缘药业','中药创新','产品矩阵'],'min_pages':30,
              'filename':'01_西南证券_康缘药业_引领中药创新产品矩阵持续丰富_2023-04-13_完整版.pdf'
            },
            {
              'broker':'万联证券','date':'2023-06-06','analysts':'黄婧婧','rating':'买入',
              'title':'首次覆盖：创新赋能，独家品种有望受益于销售组织架构优化持续放量','info_code':'AP202306061590474095',
              'terms':['康缘药业','首次覆盖','创新赋能','独家品种'],'min_pages':28,
              'filename':'02_万联证券_康缘药业_首次覆盖创新赋能独家品种持续放量_2023-06-06_完整版.pdf'
            },
            {
              'broker':'东吴证券','date':'2023-01-08','analysts':'朱国广','rating':'买入',
              'title':'国内中药创新龙头，创新产品梯队丰富','info_code':'AP202301081581791842',
              'terms':['康缘药业','中药创新龙头','创新产品梯队'],'min_pages':28,
              'filename':'03_东吴证券_康缘药业_国内中药创新龙头创新产品梯队丰富_2023-01-08_完整版.pdf'
            }
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download(info_code:str)->tuple[bytes,str,dict]:
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
            ]
            last={}
            for url in urls:
              for attempt in range(6):
                try:
                  r=s.get(url,timeout=(30,300),allow_redirects=True,headers={
                    'User-Agent':s.headers['User-Agent'],
                    'Referer':f'https://data.eastmoney.com/report/info/{info_code}.html',
                    'Accept':'application/pdf,*/*;q=0.8'
                  })
                  last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url}
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                    return r.content,url,last
                except Exception as e:
                  last={'url':url,'error':repr(e)}
                time.sleep(1+attempt)
            raise RuntimeError(f'download failed {info_code}: {last}')

          manifest=[]
          for r in reports:
            data,url,download_meta=download(r['info_code'])
            dest=root/r['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<r['min_pages']:
              raise RuntimeError(f'too few pages {dest.name}: {pages}')
            text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(20,pages)])
            if len(re.sub(r'\s+','',text))<100:
              txt=dest.with_suffix('.txt')
              subprocess.run(['pdftotext','-f','1','-l',str(min(20,pages)),str(dest),str(txt)],check=False,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if txt.exists(): text+='\n'+txt.read_text(encoding='utf-8',errors='ignore')
            compact=re.sub(r'\s+','',text)
            identity=[x for x in ['康缘药业','江苏康缘药业股份有限公司','600557'] if x in compact]
            matched=[t for t in r['terms'] if re.sub(r'\s+','',t) in compact]
            if not identity:
              raise RuntimeError(f'issuer identity mismatch: {dest.name}')
            if not matched:
              raise RuntimeError(f'title keyword mismatch: {dest.name}')
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000:
              raise RuntimeError(f'preview failed: {dest.name}')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **r,'actual_pages':pages,'bytes':len(data),'sha256':sha,
              'source_report_page':f"https://data.eastmoney.com/report/info/{r['info_code']}.html",
              'pdf_url':url,'download_meta':download_meta,'identity_terms':identity,
              'matched_terms':matched,'preview_file':str(Path('首页预览')/preview.name),
              'document_nature':'券商原始完整PDF',
              'validation':['PDF header','issuer identity','title keywords','page count','qpdf structure','first-page render']
            })

          readme=[
            '江苏康缘药业股份有限公司（600557.SH）券商深度报告完整版资料包',
            '整理日期：2026-10-15','',
            '本包收录3份公开可直接取得的券商原始完整PDF，均为30页以上公司深度或首次覆盖报告。',''
          ]
          for i,x in enumerate(manifest,1):
            readme += [
              f"{i}. {x['broker']}：《{x['title']}》",
              f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
              f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
              f"   来源页面：{x['source_report_page']}",
              f"   SHA-256：{x['sha256']}",'',
            ]
          readme += [
            '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
            '核验项目：PDF文件头、公司名称/证券代码、标题关键词、实际页数、qpdf结构、首页渲染、ZIP CRC和SHA-256。'
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3:
              raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)}')
          alias=Path('kangyuan_600557_broker_deep_reports_3_full_20261015.zip')
          alias.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: kangyuan-600557-broker-deep-reports-final-20261015
          path: |
            康缘药业_600557_券商深度报告_完整版_3份_截至20261015.zip
            kangyuan_600557_broker_deep_reports_3_full_20261015.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
