name: Inspect public Hangyan search results
on:
  push:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Query public report search pages
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urlencode, urljoin

          base='https://www.hangyan.co/reports'
          variants=[{}, {'q':'华润建材科技'}, {'query':'华润建材科技'}, {'keyword':'华润建材科技'}, {'search':'华润建材科技'}, {'keywords':'华润建材科技'}]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          for params in variants:
              r=s.get(base,params=params,timeout=60)
              print('\nPAGE',r.url,'STATUS',r.status_code,'SIZE',len(r.content))
              soup=BeautifulSoup(r.text,'html.parser')
              for form in soup.find_all('form'):
                  print('FORM',form.get('action'),form.get('method'),[(x.get('name'),x.get('type'),x.get('placeholder')) for x in form.find_all(['input','select'])])
              hits=[]
              for a in soup.find_all('a',href=True):
                  href=urljoin(r.url,a['href'])
                  text=a.get_text(' ',strip=True)
                  if '/reports/' in href and '/favor' not in href and href.rstrip('/').split('/')[-1].isdigit():
                      hits.append((text,href))
              for text,href in hits[:40]:
                  print('REPORT',text[:300],'|',href)
          PY
