name: Temporary Inspect Exact Jiuding Research Pages

on:
  push:
    branches:
      - tmp/fetch-jiuding-research-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect exact report pages and download metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, requests
          from urllib.parse import urljoin, unquote

          pages = [
              ('中信建投','2009-06-02','细分龙头，风电将获益','https://www.hibor.com.cn/docdetail_191016.html'),
              ('湘财证券','2010-12-07','面向风电领域，玻纤新材料空间广阔','https://www.hibor.com.cn/docdetail_423650.html'),
              ('国都证券','2007-12-03','纺织型玻纤龙头企业','https://www.hibor.com.cn/docdetail_47087.html'),
              ('申银万国','2007-12-06','玻纤深加工行业龙头','https://www.hibor.com.cn/docdetail_47448.html'),
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36','Referer':'https://www.hibor.com.cn/','Accept-Language':'zh-CN,zh;q=0.9'})
          def decode(r):
              for enc in ('utf-8','gb18030','gbk'):
                  try:return r.content.decode(enc)
                  except UnicodeDecodeError:pass
              return r.content.decode('utf-8','ignore')
          for broker,date,title,url in pages:
              r=s.get(url,timeout=60,allow_redirects=True); r.raise_for_status()
              text=html.unescape(decode(r)).replace('\\/','/')
              visible=re.sub(r'<script\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S)
              visible=re.sub(r'<style\b[^>]*>.*?</style>',' ',visible,flags=re.I|re.S)
              visible=re.sub(r'<[^>]+>',' ',visible); visible=re.sub(r'\s+',' ',visible).strip()
              links=[]
              for m in re.finditer(r'<(?:a|form|iframe|embed|object|source|script)\b([^>]*)>',text,flags=re.I|re.S):
                  tag=m.group(0); attrs=m.group(1)
                  for key,val in re.findall(r'(href|src|action|data|value|onclick)=["\']([^"\']+)["\']',attrs,flags=re.I):
                      u=urljoin(r.url,html.unescape(unquote(val)))
                      if any(k in (key+' '+u+' '+tag).lower() for k in ['download','down','file','attach','pdf','doc','preview','view','report','read']):
                          links.append({'key':key,'url':u,'tag':re.sub(r'\s+',' ',tag)[:500]})
              snippets=[]
              for needle in ['docid','documentid','reportid','downurl','downloadurl','fileurl','pdfurl','attachment','download','downfile','getfile','viewpdf','readpdf','preview','original','sourcefile']:
                  for pos in [m.start() for m in re.finditer(needle,text,flags=re.I)][:15]:
                      snippets.append({'needle':needle,'text':re.sub(r'\s+',' ',text[max(0,pos-300):pos+700])})
              scripts=[]
              for src in re.findall(r'<script\b[^>]*src=["\']([^"\']+)["\']',text,flags=re.I):
                  scripts.append(urljoin(r.url,src))
              print('PAGE_JSON='+json.dumps({'broker':broker,'date':date,'title':title,'url':url,'final':r.url,'bytes':len(r.content),'visible_head':visible[:700],'links':links,'snippets':snippets,'scripts':scripts},ensure_ascii=False))
          PY
