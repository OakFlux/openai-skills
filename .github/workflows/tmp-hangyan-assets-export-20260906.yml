name: Export Hangyan public assets
on:
  push:
    branches: [tmp-hangyan-assets-export-20260906]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public assets
        run: |
          mkdir -p out
          curl -L --retry 3 -A 'Mozilla/5.0' 'https://www.hangyan.co/reports/3399260180989347557' -o out/report.html
          curl -L --retry 3 -A 'Mozilla/5.0' -e 'https://www.hangyan.co/reports/3399260180989347557' 'https://cdn.hangyan.co/assets/application-ec845e69.js' -o out/application.js
          wc -c out/*
      - uses: actions/upload-artifact@v4
        with:
          name: hangyan-public-assets
          path: out
          retention-days: 1
          compression-level: 0
