name: Probe Sina public Lee and Man Paper report API 20260908

on:
  push:
    paths:
      - '.github/workflows/lee-man-paper-sina-probe-20260908.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch public JS and API candidates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json,re
          from urllib.parse import urljoin
          import requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Referer':'https://stock.finance.sina.com.cn/hkstock/view/hk_report.php?reportid=840894205940'})
          base='https://n.sinaimg.cn/finance/hk/report/stockReportDetail.js?ts=3.99'
          r=s.get(base,timeout=60); print('JS',r.status_code,len(r.content),r.url); open('stockReportDetail.js','wb').write(r.content)
          text=r.text
          print(text[:50000])
          urls=sorted(set(re.findall(r'https?://[^\"\'<>\s]+',text)))
          print('URLS',json.dumps(urls,ensure_ascii=False,indent=2))
          # Extract quoted strings around api/report/detail tokens.
          strings=re.findall(r'[\"\']([^\"\']{4,300})[\"\']',text)
          hits=[x for x in strings if any(k in x.lower() for k in ['api','report','detail','hkstock','openapi'])]
          print('HITS',json.dumps(hits,ensure_ascii=False,indent=2))
          # Probe common public Sina openapi patterns found/guessed from the JS naming.
          cands=[]
          for path in hits:
            if path.startswith('//'): cands.append('https:'+path)
            elif path.startswith('/'): cands.append(urljoin('https://stock.finance.sina.com.cn',path))
            elif path.startswith('http'): cands.append(path)
          guessed=[
            'https://stock.finance.sina.com.cn/hkstock/api/openapi.php/HK_StockService.getReportDetail?reportid=840894205940',
            'https://stock.finance.sina.com.cn/hkstock/api/openapi.php/HK_ReportService.getReportDetail?reportid=840894205940',
            'https://stock.finance.sina.com.cn/hkstock/api/jsonp.php/var%20data=/HK_StockService.getReportDetail?reportid=840894205940',
            'https://stock.finance.sina.com.cn/hkstock/api/jsonp.php/var%20data=/HK_ReportService.getReportDetail?reportid=840894205940',
          ]
          seen=set()
          for u in cands+guessed:
            if u in seen: continue
            seen.add(u)
            try:
              rr=s.get(u,timeout=30)
              print('PROBE',rr.status_code,len(rr.content),rr.url,rr.text[:3000].replace('\n',' '))
            except Exception as e: print('ERR',u,repr(e))
          PY
      - name: Upload JS
        uses: actions/upload-artifact@v4
        with:
          name: lee-man-paper-sina-probe
          path: stockReportDetail.js
          if-no-files-found: error
          retention-days: 7
