name: Inspect CGN New Energy report source internals
on:
  push:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect HTML snippets and download endpoints
        run: |
          python - <<'PY'
          import requests,re,json
          from bs4 import BeautifulSoup
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.sgpjbg.com/'})
          u='https://www.hangyan.co/charts/2825601013707179854'
          r=s.get(u,timeout=90); t=r.text
          print('CHART',r.status_code,len(t))
          for term in ['稳步成长的新能源运营商','中广核新能源','2022-04-22','2825601013707179854']:
            pos=t.find(term); print('TERM',term,'POS',pos)
            if pos>=0: print(t[max(0,pos-2000):pos+4000])
          print('REPORT_ID_PATTERNS')
          for pat in [r'/reports/\d+',r'report[_-]?id[^0-9]{0,20}(\d{10,})',r'data-[^=]+="[^"]+"',r'\b\d{15,22}\b']:
            vals=list(dict.fromkeys(re.findall(pat,t,re.I)))
            print('PAT',pat,'COUNT',len(vals),'VALS',vals[:100])

          for rid in ['70108','44868']:
            url=f'https://www.sgpjbg.com/bgdown/{rid}.html'
            resp=s.get(url,timeout=90,allow_redirects=False)
            print('\nDOWN',rid,resp.status_code,resp.headers.get('location'),resp.headers.get('content-type'),len(resp.content),resp.url)
            print('MAGIC',resp.content[:32])
            if resp.status_code in [301,302,303,307,308]:
              loc=requests.compat.urljoin(resp.url,resp.headers.get('location',''))
              rr=s.get(loc,timeout=90,allow_redirects=False)
              print('FOLLOW',rr.status_code,rr.headers.get('location'),rr.headers.get('content-type'),len(rr.content),rr.url,rr.content[:32])
            page=s.get(f'https://www.sgpjbg.com/baogao/{rid}.html',timeout=90)
            txt=page.text
            for term in ['pdfPath','pdfurl','fileUrl','FileUpload','pageCount','pdfjs','viewer','imgList','flashvars','bgdown']:
              if term.lower() in txt.lower():
                print('FOUND_TERM',rid,term)
                for m in re.finditer(term,txt,re.I):
                  print(txt[max(0,m.start()-500):m.start()+1200])
                  break
            for pat in [r'https?://[^"\'<>\s]+(?:\.pdf|\.jpg|\.png)[^"\'<>\s]*',r'/FileUpload/[^"\'<>\s]+',r'\b[a-f0-9]{32}\b']:
              vals=list(dict.fromkeys(re.findall(pat,txt,re.I)))
              if vals: print('ASSET_PAT',rid,pat,'COUNT',len(vals),'VALS',vals[:50])
          PY
