name: Count Qingsong Health public broker report pages 20260919

on:
  push:
    paths:
      - '.github/workflows/qingsong-health-fxbaogao-image-count-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install requests
        run: python -m pip install --quiet requests
      - name: Count pages concurrently
        shell: bash
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import requests
          items=[('5188870','2025/12/15'),('5319486','2026/03/23')]
          def probe(args):
              rid,date,i=args
              u=f'https://public.fxbaogao.com/report-image/{date}/{rid}-{i}.png'
              try:
                  r=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/'},timeout=(4,8),stream=True)
                  head=next(r.iter_content(16),b'')
                  return rid,i,r.status_code,r.headers.get('content-type'),r.headers.get('content-length'),head,u
              except Exception as e:
                  return rid,i,'ERR',None,None,repr(e).encode(),u
          tasks=[(rid,date,i) for rid,date in items for i in range(1,61)]
          rows=[]
          with ThreadPoolExecutor(max_workers=24) as ex:
              for f in as_completed([ex.submit(probe,t) for t in tasks]): rows.append(f.result())
          for rid,date in items:
              valid=[]
              for row in sorted([r for r in rows if r[0]==rid],key=lambda x:x[1]):
                  _,i,status,ctype,cl,head,u=row
                  ok=status==200 and head.startswith(b'\x89PNG')
                  if ok: valid.append((i,ctype,cl))
                  elif i<=5 or (valid and i<=max(x[0] for x in valid)+3): print('FAIL',rid,i,status,ctype,cl,head[:30],flush=True)
              print('VALID',rid,valid,flush=True)
          PY
