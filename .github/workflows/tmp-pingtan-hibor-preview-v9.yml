name: Temporary Pingtan Hibor public preview probe v9

on:
  push:
    branches: [tmp/pingtan-development-reports-20260829]
    paths: [.github/workflows/tmp-pingtan-hibor-preview-v9.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet requests beautifulsoup4 pypdf
      - name: Probe public preview and scripts
        run: |
          mkdir -p out/pages out/pdfs
          python - <<'PY'
          import hashlib, html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          O=Path('out'); H=O/'pages'; P=O/'pdfs'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          ids=['601896','608471','927456','1177086','1248887','1344452','1353966']
          logs=[]; records=[]; pdfs=[]; candidates=set(); seen_hash=set()
          def note(*a):
              x=' '.join(str(v) for v in a); print(x,flush=True); logs.append(x)
          def text_of(r):
              for enc in [r.encoding,r.apparent_encoding,'gb18030','utf-8']:
                  if enc:
                      try:return r.content.decode(enc,'replace')
                      except:pass
              return r.content.decode('utf-8','replace')
          def save_pdf(content,url,tag='report'):
              if len(content)<1500 or not content.lstrip().startswith(b'%PDF'):return False
              h=hashlib.sha256(content).hexdigest()
              if h in seen_hash:return True
              seen_hash.add(h); f=P/f'{tag}_{h[:12]}.pdf'; f.write_bytes(content)
              try:
                  rd=PdfReader(str(f)); pages=len(rd.pages); tx=''
                  for pg in rd.pages[:5]:
                      try:tx+='\n'+(pg.extract_text() or '')
                      except:pass
              except Exception as e:
                  note('BADPDF',url,repr(e)); f.unlink(missing_ok=True); return False
              ident=any(k in tx for k in ['平潭发展','中福实业','000592'])
              pdfs.append({'file':f.name,'url':url,'pages':pages,'bytes':len(content),'identity':ident,'text_prefix':tx[:700]})
              note('SAVEDPDF',f.name,'PAGES',pages,'IDENT',ident,url); return True
          def add_links(text,base):
              raw=html.unescape(text).replace('\\/','/')
              try:
                  soup=BeautifulSoup(text,'html.parser')
                  for tag in soup.find_all(True):
                      for a in ['href','src','data','value','action']:
                          v=tag.get(a)
                          if isinstance(v,str) and v.strip():candidates.add(urljoin(base,v.strip()))
              except:pass
              for v in re.findall(r'https?://[^\s"\'<>]+',raw,re.I):candidates.add(v.rstrip('),;'))
              for v in re.findall(r'["\']([^"\']+(?:\.pdf|download|down|preview|view|wap_detail|docdetail|clientdownload|file)[^"\']*)["\']',raw,re.I):
                  candidates.add(urljoin(base,v))
              for v in re.findall(r'(?:url|href|src|action|path)\s*[:=]\s*["\']([^"\']+)["\']',raw,re.I):
                  if any(k in v.lower() for k in ['down','pdf','preview','detail','file']):candidates.add(urljoin(base,v))

          start=[
            'https://www.hibor.com.cn/JS/sysdownload.js',
            'https://www.hibor.com.cn/js/docdetailJSN.js?ver=2020',
            'https://www.hibor.com.cn/js/docdetail.js',
            'https://www.hibor.com.cn/JS/jquery.cookie.js',
          ]
          for rid in ids:
              start += [
                f'https://www.hibor.com.cn/docdetail.asp?id={rid}',
                f'https://www.hibor.com.cn/wap_detail.aspx?id={rid}&un=&wp=2&fromtype=2&sm=1',
                f'https://www.hibor.com.cn/wap_detail.aspx?id={rid}',
                f'https://wap.hibor.com.cn/wap_detail.aspx?id={rid}&un=&wp=2&fromtype=2&sm=1',
                f'https://www.hibor.com.cn/checkauthor.asp?fromurl=http://www.hibor.com.cn/docdetail.asp?id={rid}',
                f'https://www.hibor.com.cn/hiborweb/Common/ClientDownloadRecord?id={rid}',
              ]
          for i,u in enumerate(start):
              try:
                  r=s.get(u,timeout=50,allow_redirects=True,headers={'Referer':'https://www.hibor.com.cn/'})
                  note('GET',i,r.status_code,len(r.content),r.headers.get('content-type'),r.url,'HIST',len(r.history))
                  if save_pdf(r.content,r.url,f'start_{i}'):continue
                  t=text_of(r); (H/f'start_{i}.txt').write_text(t,encoding='utf-8',errors='ignore'); add_links(t,r.url)
                  records.append({'requested':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'history':[{'status':x.status_code,'url':x.url,'location':x.headers.get('Location')} for x in r.history],'prefix':t[:1500]})
              except Exception as e:
                  note('ERR',i,u,repr(e)); records.append({'requested':u,'error':repr(e)})
              time.sleep(.25)
          # Follow only highly relevant, same-site public endpoints and direct files.
          queue=[]
          for u in candidates:
              low=u.lower()
              if any(k in low for k in ['sysdownload','clientdownload','wap_detail','docdetail','preview','.pdf','download','downfile','filedown','getfile']) and ('hibor.com.cn' in low or low.endswith('.pdf')):
                  queue.append(u)
          queue=list(dict.fromkeys(queue))[:220]
          note('CANDIDATES',len(candidates),'FOLLOW',len(queue))
          followed=[]
          for i,u in enumerate(queue):
              try:
                  r=s.get(u,timeout=50,allow_redirects=True,headers={'Referer':'https://www.hibor.com.cn/'})
                  note('FOLLOW',i,r.status_code,len(r.content),r.headers.get('content-type'),r.url)
                  if save_pdf(r.content,r.url,f'follow_{i}'):
                      followed.append({'url':u,'final':r.url,'pdf':True}); continue
                  t=text_of(r); (H/f'follow_{i}.txt').write_text(t,encoding='utf-8',errors='ignore')
                  followed.append({'url':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'prefix':t[:1500]})
              except Exception as e:
                  note('FOLLOWERR',i,u,repr(e)); followed.append({'url':u,'error':repr(e)})
              time.sleep(.2)
          (O/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'candidates.json').write_text(json.dumps(sorted(candidates),ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'followed.json').write_text(json.dumps(followed,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'pdfs.json').write_text(json.dumps(pdfs,ensure_ascii=False,indent=2),encoding='utf-8')
          (O/'log.txt').write_text('\n'.join(logs),encoding='utf-8')
          note('DONE','PDFS',len(pdfs))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pingtan-hibor-preview-v9
          path: out/
          retention-days: 3
