name: Query RoboSense prospectus records
on:
  push:
    branches:
      - tmp-robosense-prospectus-discovery-20260914
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query complete HKEX record set
        run: |
          set -euo pipefail
          mkdir -p output
          python -m pip install --quiet 'httpx[http2]'
          python - <<'PY'
          import json
          from pathlib import Path
          import httpx
          endpoint='https://www1.hkexnews.hk/search/titleSearchServlet.do'
          params={
            'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK',
            'stockId':'1000211551','documentType':'-1','fromDate':'20230101','toDate':'20260914',
            'title':'','searchType':'1','t1code':'-2','t2Gcode':'-2','t2code':'-2',
            'rowRange':'2000','lang':'EN'
          }
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=1000211551'
          }
          with httpx.Client(http2=True,timeout=60,follow_redirects=True,headers=headers) as c:
            r=c.get(endpoint,params=params)
          print('STATUS',r.status_code,'LEN',len(r.content),r.url)
          r.raise_for_status()
          outer=r.json(); inner=json.loads(outer['result']) if isinstance(outer,dict) and isinstance(outer.get('result'),str) else outer.get('result',outer)
          Path('output/records.json').write_text(json.dumps(inner,ensure_ascii=False,indent=2),encoding='utf-8')
          print('COUNT',len(inner) if isinstance(inner,list) else type(inner).__name__)
          if isinstance(inner,list):
            for item in inner:
              blob=json.dumps(item,ensure_ascii=False)
              if any(t in blob.upper() for t in ['ANNUAL REPORT','PROSPECTUS','GLOBAL OFFERING','FIRST QUARTER OF 2026','INTERIM RESULTS ANNOUNCEMENT']):
                print('MATCH',blob)
          PY
      - name: Upload records
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robosense-prospectus-records
          path: output/*
          retention-days: 1
          if-no-files-found: warn
