name: package-emeishan-000888-filings

on:
  push:
    branches:
      - tmp/emeishan-000888-filings-20261104-v1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Download validate and package reports
        run: python scripts/emeishan_000888_package.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: emeishan-000888-filings-20261104
          path: |
            emeishan_000888_2020_2025_annual_latest_quarter.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
