name: Discover Wanlin revised annual report URLs

on:
  push:
    paths:
      - '.github/workflows/wanlin-603117-revised-report-discovery-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Query CNINFO
        run: |
          python - <<'PY'
          import json, re, requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          CODE='603117'; ORG='9900023716'; COMPANY='万林物流'; FULL='江苏万林现代物流股份有限公司'
          s=requests.Session()
          s.mount('https://',HTTPAdapter(max_retries=Retry(total=4,backoff_factor=.5,status_forcelist=(403,429,500,502,503,504),allowed_methods=frozenset({'POST'}),raise_on_status=False)))
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Referer':f'https://www.cninfo.com.cn/new/disclosure/stock?orgId={ORG}&stockCode={CODE}','Origin':'https://www.cninfo.com.cn','X-Requested-With':'XMLHttpRequest'})
          endpoint='https://www.cninfo.com.cn/new/hisAnnouncement/query'
          tests=[
            ('2021','2022-05-12','2021年年度报告'),
            ('2022','2023-05-05','2022年年度报告'),
            ('2023','2024-07-13','2023年年度报告'),
          ]
          variants=[]
          for column in ('sse','szse'):
            for plate in ('sh',''):
              for stock in (f'{CODE},{ORG}',CODE,''):
                variants.append((column,plate,stock))
          for year,date,key in tests:
            print('\n===',year,date,key,'===',flush=True)
            for column,plate,stock in variants:
              payload={'pageNum':'1','pageSize':'100','column':column,'tabName':'fulltext','plate':plate,'stock':stock,'searchkey':key,'secid':'','category':'','trade':'','seDate':f'{date}~{date}','sortName':'time','sortType':'desc','isHLtitle':'true'}
              try:
                r=s.post(endpoint,data=payload,timeout=60)
                print('VAR',column,plate,repr(stock),'STATUS',r.status_code,'BYTES',len(r.content),flush=True)
                if r.status_code!=200: continue
                data=r.json(); rows=data.get('announcements') or []
                matches=[]
                for row in rows:
                  title=re.sub(r'<[^>]+>','',str(row.get('announcementTitle') or '')).replace('&amp;','&').strip()
                  code=str(row.get('secCode') or row.get('stockCode') or '')
                  name=re.sub(r'<[^>]+>','',str(row.get('secName') or row.get('stockName') or '')).strip()
                  if CODE in code or COMPANY in name or FULL in name:
                    matches.append({'title':title,'code':code,'name':name,'adjunctUrl':row.get('adjunctUrl'),'announcementId':row.get('announcementId'),'announcementTime':row.get('announcementTime')})
                if matches:
                  print('MATCHES',json.dumps(matches,ensure_ascii=False),flush=True)
              except Exception as e:
                print('ERR',column,plate,repr(stock),repr(e),flush=True)
          PY
