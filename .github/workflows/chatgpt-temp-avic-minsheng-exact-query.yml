name: chatgpt-temp-avic-minsheng-exact-query
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-avic-minsheng-exact-query.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Locate exact record
        shell: bash
        run: |
          python -m pip install --quiet requests
          python <<'PY'
          import json,requests
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Content-Type':'application/json','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          for keyword in ['港股唯一航空高科技产业集团','行稳致远迈向世界一流','中航科工（2357.HK）首次覆盖报告','中航科工 首次覆盖报告']:
            body={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':1,'pageSize':30,'keyword':keyword,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
            r=s.post('https://api.sdyanbao.com/api/file/search',json=body,timeout=30)
            o=r.json();files=(o.get('data') or {}).get('files') or []
            print('QUERY',keyword,'HTTP',r.status_code,'COUNT',len(files),'TOTAL',(o.get('data') or {}).get('total'),flush=True)
            for x in files:
              blob=json.dumps(x,ensure_ascii=False)
              if '中航科工' in blob and ('首次覆盖' in blob or '港股唯一航空高科技产业集团' in blob or '行稳致远迈向世界一流' in blob):
                print('MATCH',json.dumps(x,ensure_ascii=False),flush=True)
          PY
