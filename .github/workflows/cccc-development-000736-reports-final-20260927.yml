name: Build final CCCC Development 000736 reports package 20260927

on:
  push:
    paths:
      - '.github/workflows/cccc-development-000736-reports-final-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download, validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '中交发展_000736_2020-2025年报及2026年中期报告'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          docs = [
              {
                  'filename': '01_中交地产_000736_2020年年度报告.pdf',
                  'period': '2020年年度报告',
                  'disclosure_date': '2021-04-15',
                  'source': '新浪财经公开披露镜像（原公告附件）',
                  'urls': [
                      'https://file.finance.sina.com.cn/211.154.219.97%3A9494/MRGG/CNSESZ_STOCK/2021/2021-4/2021-04-15/7046409.PDF',
                      'https://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESZ_STOCK/2021/2021-4/2021-04-15/7046409.PDF',
                  ],
                  'year': '2020',
                  'min_pages': 100,
              },
              {
                  'filename': '02_中交地产_000736_2021年年度报告.pdf',
                  'period': '2021年年度报告',
                  'disclosure_date': '2022-04-15',
                  'source': '巨潮资讯网官方披露原件',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2022-04-15/1212925020.PDF',
                      'https://www.cninfo.com.cn/finalpage/2022-04-15/1212925020.PDF',
                  ],
                  'year': '2021',
                  'min_pages': 100,
              },
              {
                  'filename': '03_中交地产_000736_2022年年度报告.pdf',
                  'period': '2022年年度报告',
                  'disclosure_date': '2023-04-08',
                  'source': '巨潮资讯网官方披露原件',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2023-04-08/1216358368.PDF',
                      'https://www.cninfo.com.cn/finalpage/2023-04-08/1216358368.PDF',
                  ],
                  'year': '2022',
                  'min_pages': 100,
              },
              {
                  'filename': '04_中交地产_000736_2023年年度报告.pdf',
                  'period': '2023年年度报告',
                  'disclosure_date': '2024-04-08',
                  'source': '巨潮资讯网官方披露原件',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2024-04-08/1219517434.PDF',
                      'https://www.cninfo.com.cn/finalpage/2024-04-08/1219517434.PDF',
                  ],
                  'year': '2023',
                  'min_pages': 100,
              },
              {
                  'filename': '05_中交地产_000736_2024年年度报告.pdf',
                  'period': '2024年年度报告',
                  'disclosure_date': '2025-04-15',
                  'source': '巨潮资讯网官方披露原件',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2025-04-15/1223096939.PDF',
                      'https://www.cninfo.com.cn/finalpage/2025-04-15/1223096939.PDF',
                  ],
                  'year': '2024',
                  'min_pages': 100,
              },
              {
                  'filename': '06_中交地产_000736_2025年年度报告.pdf',
                  'period': '2025年年度报告',
                  'disclosure_date': '2026-04-15',
                  'source': '巨潮资讯网官方披露原件',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2026-04-15/1225104696.PDF',
                      'https://www.cninfo.com.cn/finalpage/2026-04-15/1225104696.PDF',
                  ],
                  'year': '2025',
                  'min_pages': 100,
              },
              {
                  'filename': '07_中交发展_000736_2026年半年度报告.pdf',
                  'period': '2026年半年度报告（截至2026-09-27最新定期报告）',
                  'disclosure_date': '2026-08-20',
                  'source': '巨潮资讯网官方披露原件',
                  'urls': [
                      'https://static.cninfo.com.cn/finalpage/2026-08-20/1225481227.PDF',
                      'https://www.cninfo.com.cn/finalpage/2026-08-20/1225481227.PDF',
                  ],
                  'year': '2026',
                  'min_pages': 20,
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def download_pdf(urls: list[str], dest: Path) -> str:
              errors: list[str] = []
              for url in urls:
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          referer = 'https://www.cninfo.com.cn/' if 'cninfo.com.cn' in url else 'https://vip.stock.finance.sina.com.cn/'
                          with session.get(
                              url,
                              headers={'Referer': referer, 'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8'},
                              timeout=(30, 300), allow_redirects=True, stream=True,
                          ) as r:
                              print('DOWNLOAD', dest.name, 'attempt', attempt, 'status', r.status_code, url, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                              final_url = r.url
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < 150_000 or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response: size={size}, head={head!r}')
                          tmp.replace(dest)
                          return final_url
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          records = []
          seen_hashes: set[str] = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['urls'], dest)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample = ''
              for page in reader.pages[:min(18, pages)]:
                  try:
                      sample += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', sample)
              if '000736' not in compact or not any(name in compact for name in ('中交地产', '中交城市发展控股集团', '中交发展')):
                  raise RuntimeError(f'company identity could not be verified in {dest.name}')
              if doc['year'] not in compact or not any(term in compact for term in ('年度报告', '半年度报告')):
                  raise RuntimeError(f'report period could not be verified in {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-1500:]}')

              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              record = {
                  'filename': doc['filename'],
                  'report_period': doc['period'],
                  'disclosure_date': doc['disclosure_date'],
                  'source': doc['source'],
                  'source_url': final_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          if len(records) != 7:
              raise RuntimeError(f'PDF count mismatch: {len(records)}')

          readme = [
              '中交发展（000736.SZ）2020—2025年年度报告及最新定期报告',
              '整理日期：2026-09-27',
              '',
              '公司沿革说明：证券代码000736保持不变。公司原名“中交地产股份有限公司”，2026年更名为“中交城市发展控股集团股份有限公司”，证券简称变更为“中交发展”。因此2020—2025年年度报告仍以“中交地产”或“*ST中地”名义披露。',
              '',
              '收录范围：2020—2025年完整年度报告各1份，以及截至整理日最新的2026年半年度报告。未使用年报摘要、业绩预告、审计专项报告或其他短篇公告替代完整报告。',
              '',
              '来源说明：2021—2025年报及2026年中期报告来自巨潮资讯网官方披露原件；2020年报因巨潮历史分类查询未返回该附件，本包采用新浪财经保存的原公告完整PDF镜像。',
              '',
              '文件清单：',
          ]
          for i, r in enumerate(records, 1):
              readme.extend([
                  f"{i}. {r['report_period']}",
                  f"   文件：{r['filename']}",
                  f"   披露日期：{r['disclosure_date']}；页数：{r['pages']}；大小：{r['bytes']/1048576:.2f} MiB",
                  f"   来源：{r['source']}",
                  f"   下载地址：{r['source_url']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、证券代码、公司名称、报告年度/期间、实际页数、qpdf结构、重复哈希及SHA-256。')

          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          total = sum((out / r['filename']).stat().st_size for r in records)
          print('FINAL_PACKAGE', PACKAGE, 'PDF_COUNT', len(records), 'TOTAL_BYTES', total, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: cccc-development-000736-reports-final
          path: 中交发展_000736_2020-2025年报及2026年中期报告/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
