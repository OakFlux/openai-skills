name: Discover Kangyuan 600557 broker reports 20261015

on:
  push:
    paths:
      - '.github/workflows/kangyuan-600557-broker-report-discovery-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query Eastmoney research report index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from pathlib import Path
          import requests

          code='600557'
          out=Path('discovery'); out.mkdir()
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/report/{code}.html',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          all_rows=[]; page_log=[]
          for page in range(1,11):
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2017-01-01','endTime':'2026-10-15','pageNo':str(page),
                  'fields':'','qType':'0','orgCode':'','code':code,'rcode':'',
                  'p':str(page),'pageNum':str(page),'pageNumber':str(page),
                  '_':str(int(time.time()*1000)),
              }
              r=s.get('https://reportapi.eastmoney.com/report/list',params=params,timeout=(20,90))
              r.raise_for_status()
              payload=r.json(); rows=payload.get('data') or []
              page_log.append({'page':page,'count':len(rows),'hits':payload.get('hits')})
              all_rows.extend(rows)
              if len(rows)<100: break
          fields=['infoCode','publishDate','orgSName','researcher','emRatingName','attachPages','title','encodeUrl']
          clean=[{k:r.get(k) for k in fields} for r in all_rows]
          clean.sort(key=lambda x:(int(x.get('attachPages') or 0),str(x.get('publishDate') or '')),reverse=True)
          (out/'reports.json').write_text(json.dumps(clean,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'pages.json').write_text(json.dumps(page_log,ensure_ascii=False,indent=2),encoding='utf-8')
          print('REPORT_COUNT',len(clean))
          print(json.dumps(clean,ensure_ascii=False,indent=2))
          PY

      - name: Upload discovery data
        uses: actions/upload-artifact@v4
        with:
          name: kangyuan-600557-broker-report-discovery
          path: discovery
          retention-days: 7
          if-no-files-found: error
