name: Inspect Yuheng Report Sources Final

on:
  push:
    branches:
      - tmp-yuheng-002437-broker-reports-20261004
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect candidate report APIs and pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, time, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          out = '/tmp/yuheng_inspect'
          os.makedirs(out, exist_ok=True)
          s = requests.Session()
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })
          urls = {
            'eastmoney_api_1': 'https://reportapi.eastmoney.com/report/list?code=002437&pageSize=100&pageNo=1&qType=0',
            'eastmoney_api_2': 'https://reportapi.eastmoney.com/report/list?cb=datatable&code=002437&pageSize=100&pageNo=1&qType=0',
            'eastmoney_api_3': 'https://reportapi.eastmoney.com/report/list?cb=datatable&code=002437&pageSize=100&pageNo=1&fields=&qType=0&orgCode=&rcode=&beginTime=2010-01-01&endTime=2026-10-05',
            'eastmoney_dc': 'https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_RES_REPORT_INFO&columns=ALL&filter=(SECURITY_CODE%3D%22002437%22)&pageNumber=1&pageSize=100&sortTypes=-1&sortColumns=REPORT_DATE',
            'eastmoney_page': 'https://data.eastmoney.com/report/002437.html',
            'eastmoney_stock_page': 'https://data.eastmoney.com/report/stock.jshtml?stockCode=002437',
            'jiufang_deep': 'https://www.9fzt.com/detail/sz_002437_10_818776405669.html',
            'hibor_followup': 'https://www.hibor.com.cn/repinfodetail_4916574.html',
            'microbell_followup': 'https://www.microbell.com/repinfodetail_4916574.html',
            'tonghuashun_worth': 'https://basic.10jqka.com.cn/002437/worth.html',
            'book118_deep': 'https://max.book118.com/html/2025/1212/5214002204013032.shtm',
            'fxbaogao_search': 'https://www.fxbaogao.com/search?keywords=%E8%AA%89%E8%A1%A1%E8%8D%AF%E4%B8%9A',
          }
          summary=[]
          for name,url in urls.items():
              try:
                  headers={'Referer':'https://data.eastmoney.com/'} if 'eastmoney' in name else {}
                  r=s.get(url,headers=headers,timeout=35,allow_redirects=True)
                  ct=r.headers.get('content-type','')
                  body=r.content
                  open(os.path.join(out,name+'.bin'),'wb').write(body)
                  try:
                      text=r.text
                  except Exception:
                      text=''
                  open(os.path.join(out,name+'.txt'),'w',encoding='utf-8',errors='ignore').write(text)
                  links=[]
                  if text:
                      for m in re.findall(r'https?://[^\"\'<>\\s]+', text):
                          if any(x in m.lower() for x in ['pdf','report','download','attach','file','research','研报']):
                              links.append(m[:500])
                  summary.append({'name':name,'url':url,'status':r.status_code,'final_url':r.url,'content_type':ct,'bytes':len(body),'links':links[:100]})
              except Exception as e:
                  summary.append({'name':name,'url':url,'error':repr(e)})
          open(os.path.join(out,'summary.json'),'w',encoding='utf-8').write(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: yuheng-report-source-inspection
          path: /tmp/yuheng_inspect
          retention-days: 3
