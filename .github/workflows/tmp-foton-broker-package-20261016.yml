name: Build Foton Motor broker deep-report package

on:
  push:
    branches: [tmp-foton-broker-reports-20261016]
    paths: ['.github/workflows/tmp-foton-broker-package-20261016.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='福田汽车_券商深度报告_3份'
          mkdir -p "$PACKAGE"

          download_pdf() {
            local url="$1"
            local out="$2"
            local min_pages="$3"
            echo "Downloading: $out"
            curl --http1.1 -fL --retry 6 --retry-all-errors --retry-delay 2 \
              --connect-timeout 30 --max-time 600 \
              -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36' \
              -H 'Accept: application/pdf,*/*;q=0.8' \
              -e 'https://data.eastmoney.com/report/stock.jshtml?stockcode=600166' \
              "$url" -o "$out.tmp"
            test "$(head -c 5 "$out.tmp")" = '%PDF-'
            test "$(stat -c%s "$out.tmp")" -gt 100000
            mv "$out.tmp" "$out"

            set +e
            qpdf --check "$out" >"$out.qpdf.txt" 2>&1
            qstatus=$?
            set -e
            if [ "$qstatus" -ne 0 ] && [ "$qstatus" -ne 3 ]; then
              cat "$out.qpdf.txt" >&2
              exit "$qstatus"
            fi
            rm -f "$out.qpdf.txt"

            pages=$(pdfinfo "$out" 2>/dev/null | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages"
            test "$pages" -ge "$min_pages"
            pdftotext -f 1 -l 15 "$out" "$out.txt" 2>/dev/null
            grep -Eq '北汽福田汽车股份有限公司|福田汽车|FOTON' "$out.txt"
            rm -f "$out.txt"
            pdftoppm -f 1 -l 1 -singlefile -png -r 72 "$out" "$out.render" >/dev/null 2>&1
            test -s "$out.render.png"
            rm -f "$out.render.png"
            echo "Validated: $(basename "$out") ($pages pages, $(stat -c%s "$out") bytes)"
          }

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202606121823502650_1.pdf' \
            "$PACKAGE/01_开源证券_出口新能源与重卡升级共振利润进入上行周期_首次覆盖_2026-06-12.pdf" \
            20

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202409031639711533_1.pdf' \
            "$PACKAGE/02_华安证券_商用车周期复苏新技术新产品加速落地_公司深度_2024-09-03.pdf" \
            30

          download_pdf \
            'https://pdf.dfcfw.com/pdf/H3_AP202306071590508422_1.pdf' \
            "$PACKAGE/03_国元证券_国内商用车龙头转型升级迎来业绩拐点_首次覆盖_2023-06-07.pdf" \
            45

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          folder = Path('福田汽车_券商深度报告_3份')
          meta = {
              '01_开源证券_出口新能源与重卡升级共振利润进入上行周期_首次覆盖_2026-06-12.pdf': {
                  'broker': '开源证券',
                  'date': '2026-06-12',
                  'title': '公司首次覆盖报告：出口、新能源与重卡升级共振，利润进入上行周期',
                  'index': 'AP202606121823502650',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202606121823502650_1.pdf',
              },
              '02_华安证券_商用车周期复苏新技术新产品加速落地_公司深度_2024-09-03.pdf': {
                  'broker': '华安证券',
                  'date': '2024-09-03',
                  'title': '商用车周期复苏，新技术新产品加速落地',
                  'index': 'AP202409031639711533',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202409031639711533_1.pdf',
              },
              '03_国元证券_国内商用车龙头转型升级迎来业绩拐点_首次覆盖_2023-06-07.pdf': {
                  'broker': '国元证券',
                  'date': '2023-06-07',
                  'title': '首次覆盖报告：国内商用车龙头，转型升级迎来业绩拐点',
                  'index': 'AP202306071590508422',
                  'source': 'https://pdf.dfcfw.com/pdf/H3_AP202306071590508422_1.pdf',
              },
          }

          pdfs = sorted(folder.glob('*.pdf'))
          if len(pdfs) != 3:
              raise SystemExit(f'Expected 3 PDFs, found {len(pdfs)}')

          lines = [
              '福田汽车（600166）券商深度报告资料包',
              '整理日期：2026-10-16',
              '',
              '收录原则：',
              '1. 收录首次覆盖或长篇公司深度研究的完整券商PDF。',
              '2. 排除财报点评、季报点评、网页摘要和加密预览文件。',
              '3. 文件仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for pdf in pdfs:
              item = meta[pdf.name]
              data = pdf.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              info = subprocess.check_output(
                  ['pdfinfo', str(pdf)], text=True, errors='replace', stderr=subprocess.DEVNULL
              )
              pages = int(next(line.split(':', 1)[1].strip() for line in info.splitlines() if line.startswith('Pages:')))
              total_pages += pages
              total_bytes += len(data)
              lines += [
                  f'- {pdf.name}',
                  f"  券商：{item['broker']}；发布日期：{item['date']}；页数：{pages}",
                  f"  标题：{item['title']}",
                  f"  公开索引编号：{item['index']}",
                  f"  来源：{item['source']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {pdf.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、页数、正文公司名称及首页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          zip -q -r -6 package_integrity_test.zip "$PACKAGE"
          unzip -t package_integrity_test.zip >/dev/null
          test "$(unzip -Z1 package_integrity_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_integrity_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Foton-Motor-600166-broker-deep-reports-3
          path: 福田汽车_券商深度报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
