name: Build Sanyuan Biotechnology 301206 reports package v2 20261005

on:
  push:
    paths:
      - '.github/workflows/sanyuan-biotechnology-301206-all-reports-v2-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Run corrected packaging script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          src = Path('.github/workflows/sanyuan-biotechnology-301206-all-reports-20261005.yml').read_text(encoding='utf-8')
          begin = "          python - <<'PY'\n"
          start = src.index(begin) + len(begin)
          end = src.index("\n          PY\n", start)
          script = textwrap.dedent(src[start:end])
          script = script.replace(
              "subprocess.run(['qpdf','--check',str(dest)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)",
              "subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)",
          )
          Path('/tmp/sanyuan_package.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/sanyuan_package.py
      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: sanyuan-biotechnology-301206-all-reports-v2-final
          path: |
            三元生物_301206_全部年报_招股说明书及最新季报.zip
            sanyuan_bio_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
