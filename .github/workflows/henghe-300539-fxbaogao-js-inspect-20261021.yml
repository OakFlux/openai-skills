name: Inspect FXBaogao search and viewer contracts

on:
  push:
    paths:
      - '.github/workflows/henghe-300539-fxbaogao-js-inspect-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect JS contracts
        run: |
          python - <<'PY'
          import html,json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.fxbaogao.com/','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7'})
          page_urls=['https://www.fxbaogao.com/view?id=3760192','https://www.fxbaogao.com/pdf?id=3760192','https://www.fxbaogao.com/report?keyword=%E6%A8%AA%E6%B2%B3%E7%B2%BE%E5%AF%86']
          scripts=[]
          for purl in page_urls:
            r=s.get(purl,timeout=60); print('PAGE',purl,r.status_code,len(r.content),r.url,r.headers.get('content-type')); r.raise_for_status(); r.encoding=r.apparent_encoding or r.encoding
            soup=BeautifulSoup(r.text,'html.parser')
            for tag in soup.find_all('script',src=True):
              url=urljoin(r.url,tag['src'])
              if url not in scripts: scripts.append(url)
              print('SCRIPT_SRC',url)
            for tag in soup.find_all(['link','iframe','embed','object']):
              for attr in ('href','src','data'):
                if tag.get(attr): print('ASSET',tag.name,attr,urljoin(r.url,tag.get(attr)))
          print('SCRIPT_COUNT',len(scripts))
          needles=['searchReportData/facet','searchReport/facet','reportStock/search','suggestTyping','getXcxReportInfo','isDownload','originPdfName','common/oss/signature','downloaded','getUserDownload','getUserRead','report.fxbaogao.com','pdf.worker','fileUrl','downloadUrl','pdfUrl','uuid=','reportId']
          for i,url in enumerate(scripts):
            try:
              r=s.get(url,timeout=90); print('\nJS',i,r.status_code,len(r.content),url,r.headers.get('content-type'))
              if r.status_code!=200 or len(r.content)>15_000_000: continue
              text=r.text
              found=False
              for needle in needles:
                positions=[m.start() for m in re.finditer(re.escape(needle),text,re.I)]
                if positions:
                  found=True; print('\nNEEDLE',needle,'COUNT',len(positions))
                  for pos in positions[:15]: print('CONTEXT',text[max(0,pos-4000):pos+7000])
              if found:
                for pat in [r'https?://[^\"\'<>\s]+',r'[\"\'](/[^\"\']*(?:api|search|report|pdf|download|file|view|oss)[^\"\']*)[\"\']']:
                  vals=[]
                  for m in re.finditer(pat,text,re.I):
                    v=html.unescape(m.group(1) if m.lastindex else m.group(0))
                    if any(k in v.lower() for k in ['api','search','report','pdf','download','file','view','oss']): vals.append(v)
                  for v in list(dict.fromkeys(vals))[:1000]: print('ENDPOINT',v[:3000])
            except Exception as e: print('JS_ERROR',url,repr(e))
          PY
