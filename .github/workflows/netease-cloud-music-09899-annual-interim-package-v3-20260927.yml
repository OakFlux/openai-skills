name: Build NetEase Cloud Music 09899 annual and latest interim package v3 20260927

on:
  push:
    paths:
      - '.github/workflows/netease-cloud-music-09899-annual-interim-package-v3-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download validate and package official reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE = '网易云音乐_09899_2020-2025年报_2026最新中期报告_官方原件'
          OUT = Path(PACKAGE)
          OUT.mkdir(exist_ok=True)

          docs = [
              {
                  'filename':'00_网易云音乐_09899_2020年度经审计财务资料_2021招股章程.pdf',
                  'title':'GLOBAL OFFERING / Prospectus',
                  'category':'2020年度财务资料（招股章程）',
                  'report_year':2020,
                  'disclosure_date':'2021-11-23',
                  'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2021/1123/2021112300032.pdf',
                  'min_pages':300,
              },
              {
                  'filename':'01_网易云音乐_09899_2021年年度报告.pdf',
                  'title':'Annual Report 2021',
                  'category':'年度报告','report_year':2021,'disclosure_date':'2022-04-28',
                  'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2022/0428/2022042802237.pdf','min_pages':100,
              },
              {
                  'filename':'02_网易云音乐_09899_2022年年度报告.pdf',
                  'title':'Annual Report 2022',
                  'category':'年度报告','report_year':2022,'disclosure_date':'2023-04-27',
                  'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2023/0427/2023042702497.pdf','min_pages':100,
              },
              {
                  'filename':'03_网易云音乐_09899_2023年年度报告.pdf',
                  'title':'Annual Report 2023',
                  'category':'年度报告','report_year':2023,'disclosure_date':'2024-04-25',
                  'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2024/0425/2024042501486.pdf','min_pages':100,
              },
              {
                  'filename':'04_网易云音乐_09899_2024年年度报告.pdf',
                  'title':'Annual Report 2024',
                  'category':'年度报告','report_year':2024,'disclosure_date':'2025-04-15',
                  'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0415/2025041500666.pdf','min_pages':100,
              },
              {
                  'filename':'05_网易云音乐_09899_2025年年度报告.pdf',
                  'title':'Annual Report 2025',
                  'category':'年度报告','report_year':2025,'disclosure_date':'2026-04-15',
                  'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0415/2026041501036.pdf','min_pages':100,
              },
              {
                  'filename':'06_网易云音乐_09899_2026年中期报告_最新定期报告.pdf',
                  'title':'Interim Report 2026',
                  'category':'最新中期报告','report_year':2026,'disclosure_date':'2026-09-24',
                  'url':'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0924/2026092400333.pdf','min_pages':30,
              },
          ]

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language':'en-US,en;q=0.9,zh-CN;q=0.8',
              'Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?lang=en',
          })

          def download(doc, dest):
              errors=[]
              urls=list(dict.fromkeys([
                  doc['url'],
                  doc['url'].replace('https://www1.hkexnews.hk/','https://www.hkexnews.hk/'),
              ]))
              for url in urls:
                  for attempt in range(1,5):
                      tmp=dest.with_suffix(dest.suffix+'.part')
                      try:
                          with s.get(url,timeout=(30,300),allow_redirects=True,stream=True) as r:
                              print('DOWNLOAD',dest.name,'attempt',attempt,'status',r.status_code,'url',url,'final',r.url,flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as f:
                                  for chunk in r.iter_content(1024*1024):
                                      if chunk: f.write(chunk)
                          size=tmp.stat().st_size
                          with tmp.open('rb') as f: head=f.read(8)
                          if size<100000 or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF size={size} head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt*2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          def extract_sample(reader):
              n=len(reader.pages)
              indices=list(range(min(30,n)))
              if n>35: indices += list(range(max(0,n-5),n))
              parts=[]
              for i in dict.fromkeys(indices):
                  try: parts.append(reader.pages[i].extract_text() or '')
                  except Exception: pass
              return '\n'.join(parts).lower()

          identity_terms=['cloud village','cloud music','netease music','雲音樂','网易云音乐','網易雲音樂','9899']
          records=[]; hashes=set()
          for doc in docs:
              dest=OUT/doc['filename']
              final_url=download(doc,dest)
              reader=PdfReader(str(dest),strict=False)
              pages=len(reader.pages)
              if pages<doc['min_pages']:
                  raise RuntimeError(f'unexpectedly short PDF {dest.name}: {pages} < {doc["min_pages"]}')
              text=extract_sample(reader)
              if not any(term.lower() in text for term in identity_terms):
                  raise RuntimeError(f'company identity not verified in {dest.name}')
              q=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
              if q.returncode not in (0,3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {q.stderr[-2000:]}')
              data=dest.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha in hashes: raise RuntimeError(f'duplicate PDF {dest.name}')
              hashes.add(sha)
              rec={k:doc[k] for k in ('filename','title','category','report_year','disclosure_date')}
              rec.update(source='香港交易所披露易（HKEXnews）',source_url=final_url,pages=pages,bytes=len(data),sha256=sha)
              records.append(rec)
              print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          if len(records)!=7: raise RuntimeError(f'expected 7 PDFs, got {len(records)}')
          if {r['report_year'] for r in records if r['category']=='年度报告'} != {2021,2022,2023,2024,2025}:
              raise RuntimeError('annual report coverage mismatch')

          readme=[
              '网易云音乐（09899.HK）2020—2025年度财务资料及2026年最新中期报告',
              '整理日期：2026-09-27','',
              '一、收录范围',
              '1. 2021—2025年完整年度报告，共5份。',
              '2. 2026年中期报告，共1份，披露日期为2026年9月24日。',
              '3. 2021年上市招股章程，共1份；其中包含2020年度经审计历史财务资料。','',
              '二、关于2020年报告',
              '网易云音乐于2021年12月上市，2020年没有独立上市公司年度报告。',
              '为覆盖2020年度，本包收录上市招股章程，其中载有截至2020年12月31日止年度的经审计历史财务资料。','',
              '三、关于“最新季报”',
              '香港上市主体通常发布年度报告和中期报告，而非独立季度报告。',
              '本包以2026年中期报告作为最新一期定期财务报告。','',
              '四、文件清单',
          ]
          for i,r in enumerate(records,1):
              readme += [
                  f'{i}. {r["filename"]}',
                  f'   类别：{r["category"]}；年度：{r["report_year"]}；披露日期：{r["disclosure_date"]}',
                  f'   页数：{r["pages"]}；大小：{r["bytes"]/1048576:.2f} MB',
                  f'   来源：{r["source_url"]}',
                  f'   SHA-256：{r["sha256"]}','',
              ]
          readme += ['五、完整性核验','全部PDF均已检查文件头、公司身份、实际页数、qpdf结构、重复文件及SHA-256；最终ZIP已通过CRC测试。']

          (OUT/'00_文件清单与范围说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
              for p in sorted(OUT.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zip_path) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              if len(pdfs)!=7: raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)}')
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'PDF_COUNT',len(pdfs),'SHA256',hashlib.sha256(zip_path.read_bytes()).hexdigest(),flush=True)
          print('FINAL_MANIFEST',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: netease-cloud-music-09899-annual-interim-final-v3
          path: 网易云音乐_09899_2020-2025年报_2026最新中期报告_官方原件.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
