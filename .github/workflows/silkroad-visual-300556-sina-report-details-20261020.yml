name: Inspect Silkroad Visual Sina report details 20261020

on:
  push:
    paths:
      - '.github/workflows/silkroad-visual-300556-sina-report-details-20261020.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect report detail pages and PDF links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          report_ids = [
              '772917335740',
              '755805854690',
              '554831350327',
              '543594626889',
              '542806228845',
              '539853798025',
              '537522728885',
              '530965274667',
          ]
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://stock.finance.sina.com.cn/',
          })

          for rid in report_ids:
              urls = [
                  f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/{rid}/index.phtml',
                  f'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/{rid}/index.phtml',
              ]
              print('\n\n######## RID', rid)
              for url in urls:
                  try:
                      response = session.get(url, timeout=(20, 90), allow_redirects=True)
                      text = response.content.decode(response.apparent_encoding or 'utf-8', errors='replace')
                      print('\n=== URL', url, 'STATUS', response.status_code, 'FINAL', response.url, 'LEN', len(response.content), 'CT', response.headers.get('content-type'))
                      soup = BeautifulSoup(text, 'lxml')
                      title = soup.title.get_text(' ', strip=True) if soup.title else ''
                      print('TITLE_TAG', title)
                      page_text = re.sub(r'\s+', ' ', soup.get_text(' ', strip=True))
                      print('TEXT_HEAD', page_text[:1200])
                      pdfs = []
                      links = []
                      for a in soup.find_all('a', href=True):
                          label = re.sub(r'\s+', ' ', a.get_text(' ', strip=True))
                          href = urljoin(response.url, a['href'])
                          if any(x in href.lower() for x in ['.pdf', 'download', 'down.php', 'file']) or any(x in label for x in ['下载', 'PDF', '原文']):
                              links.append((label, href))
                          if '.pdf' in href.lower():
                              pdfs.append(href)
                      print('LINKS', json.dumps(links[:50], ensure_ascii=False))
                      raw_pdf_urls = sorted(set(re.findall(r'https?://[^\s\"\'<>]+?\.pdf(?:\?[^\s\"\'<>]*)?', text, flags=re.I)))
                      print('RAW_PDFS', json.dumps(raw_pdf_urls[:50], ensure_ascii=False))
                      for pattern in [
                          r'机构[:：]\s*([^<\n]+)',
                          r'研究员[:：]\s*([^<\n]+)',
                          r'日期[:：]\s*([^<\n]+)',
                          r'pdf[^\n]{0,300}',
                          r'download[^\n]{0,300}',
                          r'http[^\"\']+\.pdf[^\"\']*',
                      ]:
                          found = re.findall(pattern, text, flags=re.I|re.S)
                          print('PATTERN', pattern, 'COUNT', len(found), 'SAMPLE', found[:10])
                  except Exception as exc:
                      print('ERROR', url, repr(exc))
          PY
