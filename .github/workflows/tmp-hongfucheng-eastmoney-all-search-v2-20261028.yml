name: Search all Eastmoney reports for Hongfucheng v2

on:
  push:
    branches: [tmp-hongfucheng-broker-reports-20261028]
    paths: ['.github/workflows/tmp-hongfucheng-eastmoney-all-search-v2-20261028.yml']

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    steps:
      - name: Paginate relevant date ranges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,re,requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          url='https://reportapi.eastmoney.com/report/list'
          windows=[('2026-09-01','2026-09-30'),('2026-10-01','2026-10-28')]
          for begin,end in windows:
            print('\nWINDOW',begin,end)
            page=1
            while True:
              params={'cb':'datatable4263982','industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':'0','orgCode':'','code':'','rcode':''}
              r=s.get(url,params=params,timeout=120); r.raise_for_status()
              t=r.text.strip(); m=re.match(r'^[^(]+\((.*)\)\s*;?$',t,re.S); p=json.loads(m.group(1) if m else t)
              rows=p.get('data') or []; hits=int(p.get('hits') or 0)
              print('PAGE',page,'ROWS',len(rows),'HITS',hits)
              for row in rows:
                blob=' '.join(str(row.get(k) or '') for k in ('title','stockName','stockCode','orgSName','orgName'))
                if '鸿富诚' in blob or '301716' in blob:
                  print('MATCH',json.dumps(row,ensure_ascii=False,sort_keys=True))
              if not rows or page>=math.ceil(hits/100): break
              page+=1
          PY
