name: Probe NEEQ downloads with browser session headers

on:
  push:
    branches: [tmp-haofan-bio-301393-reports-20261020]
    paths: ['.github/workflows/tmp-haofan-neeq-session-probe-20261020.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe via requests session
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests, itertools
          urls=[
            'https://www.neeq.com.cn/disclosure/2017/2017-05-09/1494315036_015624.pdf',
            'https://www.neeq.com.cn/disclosure/2017/2017-04-05/1491377987_174187.pdf',
          ]
          s=requests.Session()
          base_headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.7',
            'Accept-Encoding':'gzip, deflate, br',
            'Sec-Fetch-Site':'same-origin',
            'Sec-Fetch-Mode':'navigate',
            'Sec-Fetch-Dest':'document',
            'Upgrade-Insecure-Requests':'1',
          }
          for home in ['https://www.neeq.com.cn/','https://www.neeq.com.cn/disclosure/']:
            try:
              r=s.get(home,headers=base_headers,timeout=60)
              print('HOME',home,r.status_code,len(r.content),r.url,'COOKIES',s.cookies.get_dict())
            except Exception as e:
              print('HOMEERR',home,repr(e))
          variants=[
            {'Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Referer':'https://www.neeq.com.cn/'},
            {'Accept':'*/*','Referer':'https://www.neeq.com.cn/disclosure/'},
            {'Accept':'application/pdf,*/*;q=0.8','Referer':'https://www.neeq.com.cn/','Range':'bytes=0-1048575'},
            {'Accept':'application/pdf,*/*;q=0.8','Referer':'https://vip.stock.finance.sina.com.cn/'},
          ]
          for url in urls:
            for i,extra in enumerate(variants,1):
              h={**base_headers,**extra}
              try:
                r=s.get(url,headers=h,timeout=120,allow_redirects=True)
                print('TRY',i,url,'STATUS',r.status_code,'LEN',len(r.content),'URL',r.url,'TYPE',r.headers.get('content-type'),'SERVER',r.headers.get('server'),'PREFIX',r.content[:20])
              except Exception as e:
                print('ERR',i,url,repr(e))
          PY
