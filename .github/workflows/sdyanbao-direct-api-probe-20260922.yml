name: Probe Sdyanbao file download API directly 20260922

on:
  push:
    paths:
      - '.github/workflows/sdyanbao-direct-api-probe-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import requests,json,itertools
          from pathlib import Path
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'})
          out=[]
          for rid in (902006,920346):
            for endpoint in ('detail','download'):
              for method in ('post','get'):
                try:
                  u=f'https://api.sdyanbao.com/api/file/{endpoint}'
                  if method=='post': r=s.post(u,json={'id':rid},timeout=(15,45))
                  else: r=s.get(u,params={'id':rid},timeout=(15,45))
                  out.append({'rid':rid,'endpoint':endpoint,'method':method,'status':r.status_code,'headers':dict(r.headers),'body':r.text[:200000]})
                except Exception as e: out.append({'rid':rid,'endpoint':endpoint,'method':method,'error':repr(e)})
          Path('out/result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sdyanbao-direct-api-probe
          path: out
          retention-days: 7
          if-no-files-found: error
