name: Build Top Yunnong 301556 broker deep reports package

on:
  push:
    branches:
      - tmp-top-yunnong-broker-reports-20261104

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='托普云农_301556_券商深度报告_2份'
          rm -rf "$PACKAGE" /tmp/top_yunnong_broker_render
          mkdir -p "$PACKAGE" /tmp/top_yunnong_broker_render

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry

          out = Path('托普云农_301556_券商深度报告_2份')
          reports = [
              {
                  'order': 1,
                  'broker': '东吴证券',
                  'date': '2025-06-20',
                  'title': '智慧农业领军，AI+深度赋能',
                  'filename': '01_东吴证券_智慧农业领军_AI深度赋能_2025-06-20.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202506201694418837_1.pdf',
                  'info': 'https://data.eastmoney.com/report/info/AP202506201694418837.html',
                  'min_pages': 18,
                  'broker_terms': ['东吴证券'],
                  'title_terms': ['智慧农业领军', 'AI+深度赋能'],
                  'type_terms': ['公司深度研究'],
              },
              {
                  'order': 2,
                  'broker': '民生证券',
                  'date': '2024-10-17',
                  'title': '稀缺的AI+农业领军者',
                  'filename': '02_民生证券_稀缺的AI加农业领军者_2024-10-17.pdf',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202410171640334607_1.pdf',
                  'info': 'https://data.eastmoney.com/report/info/AP202410171640334607.html',
                  'min_pages': 20,
                  'broker_terms': ['民生证券', 'MINSHENGSECURITIES'],
                  'title_terms': ['稀缺的AI+农业领军者'],
                  'type_terms': ['新股研究报告'],
              },
          ]

          def make_session() -> requests.Session:
              session = requests.Session()
              session.trust_env = False
              retry = Retry(
                  total=7,
                  connect=7,
                  read=7,
                  status=7,
                  backoff_factor=1.0,
                  status_forcelist=[429, 500, 502, 503, 504],
                  allowed_methods=['GET'],
                  raise_on_status=False,
              )
              session.mount('https://', HTTPAdapter(max_retries=retry))
              session.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
                  'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              })
              return session

          def compact_text(reader: PdfReader) -> str:
              chunks = []
              for page in reader.pages:
                  try:
                      chunks.append(page.extract_text() or '')
                  except Exception:
                      pass
              return re.sub(r'\s+', '', '\n'.join(chunks))

          records = []
          for report in reports:
              session = make_session()
              response = session.get(
                  report['url'],
                  headers={'Referer': report['info']},
                  timeout=(30, 240),
                  allow_redirects=True,
              )
              data = response.content
              print('DOWNLOAD', report['broker'], response.status_code, len(data), response.headers.get('content-type'), response.url)
              if response.status_code != 200 or not data.startswith(b'%PDF-') or len(data) < 200_000:
                  raise RuntimeError(
                      f"{report['broker']}: HTTP={response.status_code}, bytes={len(data)}, type={response.headers.get('content-type')}"
                  )

              path = out / report['filename']
              path.write_bytes(data)
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'{path.name}: only {pages} pages')

              compact = compact_text(reader)
              normalized = compact.replace('＋', '+').replace(' ', '')
              if '托普云农' not in normalized or '301556' not in normalized:
                  raise RuntimeError(f'{path.name}: company identity not found')
              if not any(term.replace(' ', '') in normalized for term in report['broker_terms']):
                  raise RuntimeError(f'{path.name}: broker identity not found')
              for term in report['title_terms']:
                  if term.replace(' ', '') not in normalized:
                      raise RuntimeError(f'{path.name}: title marker not found: {term}')
              if not any(term.replace(' ', '') in normalized for term in report['type_terms']):
                  raise RuntimeError(f'{path.name}: report type marker not found')

              sha = hashlib.sha256(data).hexdigest()
              records.append({
                  **report,
                  'pages': pages,
                  'bytes': len(data),
                  'source': response.url,
                  'sha256': sha,
              })
              print('VALIDATED_TEXT', path.name, 'pages=', pages, 'sha256=', sha)

          records.sort(key=lambda item: item['order'])
          lines = [
              '托普云农（301556）券商深度报告资料包',
              '整理日期：2026-11-04',
              '',
              '收录说明：',
              '1. 本包收录两份完整券商原始PDF：一份上市后公司深度首次覆盖报告，一份上市时新股深度研究报告。',
              '2. 未使用网页摘要、截图、付费预览、AI生成内容或3—5页财报点评补足数量。',
              '3. 两份PDF均已核验公司名称、证券代码、券商名称、报告标题、报告类型、实际页数、PDF结构及首末页渲染。',
              '',
              '文件清单：',
          ]
          sums = []
          for item in records:
              lines += [
                  f"{item['order']}. {item['broker']}｜《{item['title']}》",
                  f"   报告日期：{item['date']}",
                  f"   页数：{item['pages']}页",
                  f"   文件：{item['filename']}",
                  f"   原始PDF：{item['source']}",
                  f"   信息页：{item['info']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
              sums.append(f"{item['sha256']}  {item['filename']}")
          lines += [
              f"合计：{len(records)}份PDF，{sum(x['pages'] for x in records)}页，{sum(x['bytes'] for x in records)}字节。",
              '资料仅供研究参考，不构成投资建议。',
          ]
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (out / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(lines))
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 2
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 200000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 18
            pdftotext "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -q '托普云农' "$pdf.txt"
            grep -q '301556' "$pdf.txt"
            rm -f "$pdf.txt"
            stem="/tmp/top_yunnong_broker_render/$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -l 1 -singlefile -png -r 100 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 100 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          rm -f "$PACKAGE/_metadata.json"
          zip -q -r -6 /tmp/top_yunnong_broker_test.zip "$PACKAGE"
          unzip -t /tmp/top_yunnong_broker_test.zip >/dev/null
          test "$(unzip -Z1 /tmp/top_yunnong_broker_test.zip | grep -c '\.pdf$')" -eq 2
          rm -f /tmp/top_yunnong_broker_test.zip
          ls -lh "$PACKAGE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Top-Yunnong-301556-broker-deep-reports-2
          path: 托普云农_301556_券商深度报告_2份/
          retention-days: 3
          compression-level: 6
          if-no-files-found: error
