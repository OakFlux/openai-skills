name: Discover fxbaogao 1422001 PDF 20260927

on:
  push:
    paths:
      - '.github/workflows/fxbaogao-1422001-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install tools
        run: python -m pip install --quiet requests beautifulsoup4 lxml

      - name: Inspect HTML JS and APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          out=Path('discovery'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'text/html,application/xhtml+xml,application/json,text/plain,*/*',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Referer':'https://www.fxbaogao.com/',
          })
          url='https://www.fxbaogao.com/detail/1422001'
          r=s.get(url,timeout=(30,180),allow_redirects=True)
          print('PAGE',r.status_code,len(r.content),r.headers.get('content-type'),r.url,flush=True)
          (out/'page.html').write_bytes(r.content)
          text=r.text
          soup=BeautifulSoup(text,'lxml')
          print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
          scripts=[]; links=[]
          for tag in soup.find_all(True):
            for attr in ('href','src','data-url','data-src','content','action'):
              val=tag.get(attr)
              if not val: continue
              full=urllib.parse.urljoin(r.url,str(val))
              if attr=='src' and tag.name=='script': scripts.append(full)
              if any(k in full.lower() for k in ('pdf','download','file','report','api','detail','asset','static')):
                links.append({'tag':tag.name,'attr':attr,'url':full,'text':' '.join(tag.get_text(' ',strip=True).split())[:200]})
          print('LINKS',json.dumps(links,ensure_ascii=False,indent=2)[:40000],flush=True)
          raw=[]
          for m in re.finditer(r'https?://[^\s"\'<>]+',text):
            u=m.group(0).replace('\\/','/').rstrip(');,]')
            if any(k in u.lower() for k in ('pdf','download','file','report','api','detail','asset')): raw.append(u)
          raw=list(dict.fromkeys(raw))
          print('RAW_URLS',json.dumps(raw,ensure_ascii=False,indent=2)[:30000],flush=True)
          for term in ['__NEXT_DATA__','pdf','download','下载','fileUrl','file_url','reportUrl','report_url','oss','cos','cdn','1422001']:
            print('\nTERM',term,flush=True)
            for m in list(re.finditer(re.escape(term),text,re.I))[:30]:
              print(text[max(0,m.start()-250):min(len(text),m.end()+500)].replace('\n',' ')[:1000],flush=True)
          script_records=[]
          for i,u in enumerate(dict.fromkeys(scripts),1):
            try:
              rr=s.get(u,timeout=(20,180),allow_redirects=True)
              print('SCRIPT',i,rr.status_code,len(rr.content),rr.url,flush=True)
              if rr.status_code!=200 or len(rr.content)>12_000_000: continue
              st=rr.text
              (out/f'script_{i:03d}.js').write_text(st,encoding='utf-8')
              hits=[]
              for term in ['pdf','download','report','detail','fileUrl','file_url','getReport','api/','1422001']:
                for m in list(re.finditer(re.escape(term),st,re.I))[:50]:
                  hits.append(st[max(0,m.start()-250):min(len(st),m.end()+650)])
              if hits:
                print('SCRIPT_HITS',i,u,json.dumps(hits[:100],ensure_ascii=False)[:50000],flush=True)
              script_records.append({'url':u,'status':rr.status_code,'bytes':len(rr.content),'hits':hits[:100]})
            except Exception as e:
              print('SCRIPT_ERR',u,repr(e),flush=True)
          (out/'links.json').write_text(json.dumps({'links':links,'raw':raw,'scripts':script_records},ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-1422001-discovery
          path: discovery
          retention-days: 7
          if-no-files-found: error
