name: Temporary Scan Sdyanbao Variants for Full Mengtai Reports

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-sdyanbao-mengtai-variant-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Scan search variants and enumerate all matching file records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import requests

          API='https://api.sdyanbao.com/api/file/search'
          queries=[
            '蒙泰高新',
            '蒙泰高新 300876',
            '丙纶景气触底',
            '布局碳纤维打开新增量',
            '丙纶长丝行业领跑者',
            '双基地强势进军碳纤维',
            '东北证券 蒙泰高新',
            '邱懿峰 蒙泰高新',
            '蒙泰高新 碳纤维',
            '蒙泰高新 丙纶',
          ]
          session=requests.Session()
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
            'Referer':'https://www.sdyanbao.com/report',
            'Origin':'https://www.sdyanbao.com',
            'Content-Type':'application/json;charset=UTF-8',
            'Accept':'application/json,text/plain,*/*',
            'Device':'1','X-Token':'',
          })

          unique={}
          def collect(value, source):
            if isinstance(value,dict):
              if 'id' in value and ('name' in value or 'title' in value):
                name=str(value.get('name') or value.get('title') or '')
                blob=json.dumps(value,ensure_ascii=False)
                if ('蒙泰高新' in blob or '300876' in blob) and ('丙纶' in blob or '碳纤维' in blob):
                  item={
                    'id':value.get('id'),'name':name,'page_count':value.get('page_count'),
                    'file_size':value.get('file_size'),'size':value.get('size'),
                    'create_time':value.get('create_time'),'update_time':value.get('update_time'),
                    'original_id':value.get('original_id'),'data_source':value.get('data_source'),
                    'data_source_uuid':value.get('data_source_uuid'),
                    'organization':value.get('organization'),'researcher':value.get('researcher'),
                    'author':value.get('author'),'page_url':value.get('page_url'),
                    'online_url':value.get('online_url'),'share_url':value.get('share_url'),
                    'source_queries':[source],
                  }
                  key=str(value.get('id'))
                  if key in unique:
                    unique[key]['source_queries'].append(source)
                  else:
                    unique[key]=item
              for child in value.values():collect(child,source)
            elif isinstance(value,list):
              for child in value:collect(child,source)

          request_count=0
          for query in queries:
            for order in [0,1,2,3]:
              for only_title in [0,1]:
                for hide_trader in [0,1]:
                  for page in range(1,6):
                    payload={
                      'device':1,'hideTrader':hide_trader,'onlyTitle':only_title,'order':order,
                      'page':page,'pageSize':100,'keyword':query,'opFrom':1,
                    }
                    try:
                      response=session.post(API,json=payload,timeout=60)
                      request_count+=1
                      if response.status_code!=200:
                        print('REQUEST_ERROR='+json.dumps({'query':query,'order':order,'onlyTitle':only_title,'hideTrader':hide_trader,'page':page,'status':response.status_code},ensure_ascii=False))
                        continue
                      data=response.json()
                      before=len(unique);collect(data,f'{query}|o{order}|t{only_title}|h{hide_trader}|p{page}')
                      if len(unique)>before:
                        print('NEW_MATCHES='+json.dumps({'source':f'{query}|o{order}|t{only_title}|h{hide_trader}|p{page}','total':len(unique)},ensure_ascii=False))
                      # Stop paging when API explicitly reports no files.
                      files=((data.get('data') or {}).get('files') if isinstance(data,dict) else None)
                      if isinstance(files,list) and not files:
                        break
                    except Exception as exc:
                      print('REQUEST_EXCEPTION='+json.dumps({'query':query,'order':order,'onlyTitle':only_title,'hideTrader':hide_trader,'page':page,'error':repr(exc)},ensure_ascii=False))
                    time.sleep(0.04)
          items=sorted(unique.values(),key=lambda x:(int(x.get('page_count') or 0),int(x.get('create_time') or 0)),reverse=True)
          print('REQUEST_COUNT',request_count)
          print('ALL_MATCHES='+json.dumps(items,ensure_ascii=False))
          Path('mengtai_variant_matches.json').write_text(json.dumps(items,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload scan output
        uses: actions/upload-artifact@v4
        with:
          name: mengtai-variant-scan
          path: mengtai_variant_matches.json
          retention-days: 2
          if-no-files-found: error
