name: Inspect Xiamen Cinda broker report source pages

on:
  push:
    branches:
      - tmp/xiamen-cinda-broker-reports-20261029-v1
    paths:
      - .github/workflows/xiamen-cinda-source-inspect-20261029-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect public source pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import json, re, time
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          urls = [
              'https://www.hibor.com.cn/archiver_houtai/201603.html',
              'https://www.hibor.com.cn/archiver_houtai/201605.html',
              'https://sysbg.hibor.com.cn/archiver_houtai/201603.html',
              'https://sysbg.hibor.com.cn/archiver_houtai/201605.html',
              'https://www.fxbaogao.com/detail/72772',
              'https://stock.9fzt.com/list/sz_000701_3.html',
          ]
          result = []
          keywords = ['厦门信达','布局供应链金融','与迈科金属','定增助力电子信息业务','互联网金融']
          discovered = []
          for url in urls:
              rec = {'url':url}
              try:
                  r=s.get(url,timeout=(20,180),allow_redirects=True)
                  rec.update(status=r.status_code, final_url=r.url, bytes=len(r.content), content_type=r.headers.get('content-type',''))
                  text=r.text
                  rec['title']=BeautifulSoup(text,'lxml').title.get_text(' ',strip=True) if BeautifulSoup(text,'lxml').title else ''
                  Path('out').joinpath(re.sub(r'[^A-Za-z0-9]+','_',url)[-120:]+'.html').write_text(text,encoding='utf-8',errors='ignore')
                  soup=BeautifulSoup(text,'lxml')
                  matches=[]
                  for a in soup.find_all('a',href=True):
                      label=a.get_text(' ',strip=True)
                      href=urljoin(r.url,a.get('href'))
                      blob=label+' '+href
                      if any(k in blob for k in keywords):
                          matches.append({'text':label,'href':href})
                          discovered.append(href)
                  # Extract every PDF-looking or download/API-looking link in raw source.
                  raw_links=[]
                  patterns=[
                      r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
                      r'https?://[^\s"\'<>]*(?:download|down|attachment|file)[^\s"\'<>]*',
                      r'[^"\']+(?:download|down|attachment|file)[^"\']*',
                  ]
                  for pat in patterns:
                      try:
                          for m in re.findall(pat,text,re.I):
                              if isinstance(m,tuple): m=''.join(m)
                              if m not in raw_links: raw_links.append(m)
                      except Exception as exc:
                          raw_links.append('REGEX_ERROR:'+repr(exc))
                  rec['matches']=matches[:100]
                  rec['raw_links']=raw_links[:200]
                  # Print lines around relevant terms.
                  snippets=[]
                  for k in keywords:
                      pos=text.find(k)
                      if pos>=0:
                          snippets.append({'keyword':k,'snippet':text[max(0,pos-1200):pos+2500]})
                  rec['snippets']=snippets
              except Exception as exc:
                  rec['error']=repr(exc)
              result.append(rec)
              print('PAGE',json.dumps(rec,ensure_ascii=False)[:20000])
              time.sleep(0.5)

          # Follow matching links and inspect them as well.
          followed=[]
          for url in list(dict.fromkeys(discovered))[:50]:
              item={'url':url}
              try:
                  r=s.get(url,timeout=(20,180),allow_redirects=True)
                  text=r.text
                  item.update(status=r.status_code,final_url=r.url,bytes=len(r.content),content_type=r.headers.get('content-type',''))
                  soup=BeautifulSoup(text,'lxml')
                  item['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                  links=[]
                  for a in soup.find_all('a',href=True):
                      label=a.get_text(' ',strip=True)
                      href=urljoin(r.url,a.get('href'))
                      if any(x in (label+' '+href).lower() for x in ['pdf','下载','download','attachment','file']):
                          links.append({'text':label,'href':href})
                  item['links']=links[:200]
                  item['pdf_urls']=list(dict.fromkeys(re.findall(r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',text,re.I)))[:200]
                  Path('out').joinpath('follow_'+re.sub(r'[^A-Za-z0-9]+','_',url)[-120:]+'.html').write_text(text,encoding='utf-8',errors='ignore')
              except Exception as exc:
                  item['error']=repr(exc)
              followed.append(item)
              print('FOLLOW',json.dumps(item,ensure_ascii=False)[:30000])
              time.sleep(0.5)

          Path('out/result.json').write_text(json.dumps({'pages':result,'followed':followed},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: xiamen-cinda-source-inspection-20261029
          path: out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
