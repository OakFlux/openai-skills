name: Build Hongmian 000523 peer deep reports 20261006

on:
  push:
    paths:
      - '.github/workflows/hongmian-000523-peer-deep-reports-20261006.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import shutil
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          TODAY = '2026-10-06'
          TARGET = '红棉股份（000523.SZ；原广州浪奇）'
          PACKAGE = '红棉股份_000523_相关券商深度报告_3份_食品饮料及文创园区对标'
          WORK = Path('hongmian_peer_reports_work')
          DOWNLOADS = WORK / 'downloads'
          FINAL_DIR = WORK / PACKAGE
          ART = Path('artifact_out')
          VERIFY = Path('verification_renders')
          for directory in (DOWNLOADS, FINAL_DIR, ART, VERIFY):
              directory.mkdir(parents=True, exist_ok=True)

          peers = [
              {
                  'code': '300947',
                  'name': '德必集团',
                  'reason': '文创产业园区运营与城市更新业务，可对标红棉股份旗下新仕诚的T.I.T创意园等园区运营板块',
                  'preferred': ['文创园区', '园区运营', '城市更新', '轻资产', '首次覆盖', '深度'],
              },
              {
                  'code': '605499',
                  'name': '东鹏饮料',
                  'reason': '华南起家的饮料品牌和渠道型企业，可对标广氏菠萝啤等饮料产品的品牌、渠道和全国化路径',
                  'preferred': ['全国化', '渠道', '第二曲线', '能量饮料', '首次覆盖', '深度'],
              },
              {
                  'code': '600737',
                  'name': '中粮糖业',
                  'reason': '食糖产业链龙头，可对标红棉品牌食糖业务的行业周期、成本、产能及渠道逻辑',
                  'preferred': ['糖业', '食糖', '全产业链', '周期', '首次覆盖', '深度'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/json,text/javascript,application/pdf,*/*;q=0.01',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')[:105]

          def query_reports(code: str) -> list[dict]:
              all_rows: list[dict] = []
              for page in range(1, 8):
                  params = {
                      'industryCode': '*', 'pageSize': '100', 'industry': '*',
                      'rating': '*', 'ratingChange': '*',
                      'beginTime': '2017-01-01', 'endTime': TODAY,
                      'pageNo': str(page), 'fields': '', 'qType': '0',
                      'orgCode': '', 'code': code, 'rcode': '',
                      'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
                  }
                  last = None
                  for attempt in range(1, 5):
                      try:
                          response = session.get('https://reportapi.eastmoney.com/report/list', params=params, timeout=(25, 150))
                          print('API', code, page, attempt, response.status_code, len(response.content), flush=True)
                          response.raise_for_status()
                          batch = response.json().get('data') or []
                          last = None
                          break
                      except Exception as exc:
                          last = exc
                          time.sleep(attempt * 2)
                  if last:
                      raise RuntimeError(f'API failed {code} page {page}: {last!r}')
                  all_rows.extend(batch)
                  if len(batch) < 100:
                      break
              unique = {}
              for row in all_rows:
                  key = str(row.get('infoCode') or json.dumps(row, ensure_ascii=False, sort_keys=True))
                  unique[key] = row
              return list(unique.values())

          def download_report(info_code: str, target: Path) -> str:
              variants = [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_01.pdf',
              ]
              last = None
              for url in variants:
                  try:
                      response = session.get(url, timeout=(30, 300), allow_redirects=True)
                      print('PDF', info_code, response.status_code, len(response.content), url, flush=True)
                      if response.status_code == 200 and len(response.content) > 100_000 and response.content.startswith(b'%PDF-'):
                          target.write_bytes(response.content)
                          return str(response.url)
                  except Exception as exc:
                      last = exc
              raise RuntimeError(f'No valid PDF for {info_code}: {last!r}')

          shallow_terms = [
              '季报点评', '年报点评', '中报点评', '半年报点评', '事件点评', '快报点评',
              '业绩预告', '业绩快报', '点评报告', '简评', '跟踪点评', '一季报', '三季报',
          ]
          deep_terms = ['深度', '首次覆盖', '首次', '公司深度', '深度研究', '覆盖报告', '专题研究']

          all_metadata: dict[str, list[dict]] = {}
          candidates_by_peer: dict[str, list[dict]] = {}

          for peer in peers:
              rows = query_reports(peer['code'])
              all_metadata[peer['code']] = rows
              print('METADATA', peer['code'], peer['name'], len(rows), flush=True)
              scored = []
              for row in rows:
                  title = str(row.get('title') or '').strip()
                  info_code = str(row.get('infoCode') or '')
                  if not title or not info_code:
                      continue
                  pages_meta = int(row.get('attachPages') or 0)
                  date = str(row.get('publishDate') or '')[:10]
                  year = int(date[:4]) if re.match(r'20\d{2}', date) else 0
                  explicit = any(term in title for term in deep_terms)
                  pref_hits = sum(1 for term in peer['preferred'] if term in title)
                  shallow = any(term in title for term in shallow_terms)
                  score = pref_hits * 35 + int(explicit) * 55 + min(pages_meta, 70) + max(0, year - 2020) * 4 - int(shallow) * 100
                  scored.append((score, pages_meta, date, row))
              scored.sort(key=lambda item: (item[0], item[1], item[2]), reverse=True)

              validated: list[dict] = []
              for score, pages_meta, _, row in scored[:35]:
                  title = str(row.get('title') or '').strip()
                  info_code = str(row.get('infoCode') or '')
                  target = DOWNLOADS / f'{peer["code"]}_{info_code}.pdf'
                  try:
                      source_url = download_report(info_code, target)
                      reader = PdfReader(str(target), strict=False)
                      pages = len(reader.pages)
                      indices = list(range(min(28, pages)))
                      if pages > 32:
                          indices.extend(range(max(0, pages - 4), pages))
                      text_parts = []
                      for index in dict.fromkeys(indices):
                          try:
                              text_parts.append(reader.pages[index].extract_text() or '')
                          except Exception:
                              pass
                      sample = '\n'.join(text_parts)
                      low = sample.lower()
                      identity = peer['name'] in sample or peer['code'] in sample
                      research = (
                          any(marker in sample for marker in ['证券研究报告', '公司研究', '深度研究', '投资评级', '首次覆盖'])
                          or 'equity research' in low
                          or any(term in title for term in deep_terms)
                      )
                      if not identity or not research or pages < 18 or any(term in title for term in shallow_terms):
                          print('REJECT', peer['name'], title, pages, identity, research, flush=True)
                          target.unlink(missing_ok=True)
                          continue
                      check = subprocess.run(['qpdf', '--check', str(target)], capture_output=True, text=True)
                      if check.returncode not in (0, 3):
                          raise RuntimeError(check.stderr[-800:])
                      raw = target.read_bytes()
                      record = {
                          'peer_code': peer['code'],
                          'peer_name': peer['name'],
                          'relevance_to_target': peer['reason'],
                          'title': title,
                          'broker': str(row.get('orgSName') or row.get('orgName') or '未知券商').strip(),
                          'publish_date': str(row.get('publishDate') or '')[:10],
                          'pages': pages,
                          'bytes': len(raw),
                          'sha256': hashlib.sha256(raw).hexdigest(),
                          'source_url': source_url,
                          'info_code': info_code,
                          'score': score + min(pages, 70),
                          'file': str(target),
                      }
                      validated.append(record)
                      print('VALIDATED', json.dumps({k: record[k] for k in ('peer_name','title','broker','publish_date','pages','score')}, ensure_ascii=False), flush=True)
                      if len(validated) >= 8:
                          break
                  except Exception as exc:
                      print('PROBE_ERR', peer['name'], title, repr(exc), flush=True)
                      target.unlink(missing_ok=True)
              if not validated:
                  raise RuntimeError(f'No validated deep reports found for {peer["name"]}')
              validated.sort(key=lambda item: (item['score'], item['pages'], item['publish_date']), reverse=True)
              candidates_by_peer[peer['code']] = validated

          # Select one report per business dimension, preferring different brokerages where possible.
          selected: list[dict] = []
          used_brokers: set[str] = set()
          for peer in peers:
              options = candidates_by_peer[peer['code']]
              choice = next((item for item in options if item['broker'] not in used_brokers), options[0])
              selected.append(choice)
              used_brokers.add(choice['broker'])

          manifest = []
          seen_sha: set[str] = set()
          for index, record in enumerate(selected, 1):
              if record['sha256'] in seen_sha:
                  raise RuntimeError('Duplicate selected PDF')
              seen_sha.add(record['sha256'])
              filename = f'{index:02d}_{safe(record["publish_date"])}_{safe(record["broker"])}_{safe(record["peer_name"])}_{safe(record["title"])}.pdf'
              shutil.copy2(record['file'], FINAL_DIR / filename)
              item = {key: value for key, value in record.items() if key not in ('file', 'score')}
              item['filename'] = filename
              manifest.append(item)

          readme = [
              f'{TARGET}相关券商深度报告——现有业务对标材料',
              f'整理日期：{TODAY}',
              '',
              '重要口径说明：',
              '1. 经东方财富个股研报接口、公开检索及历史证券简称交叉核对，未发现可公开直接下载且可核验的红棉股份（000523）近期公司专属深度报告或首次覆盖报告。',
              '2. 为避免用新闻、公告、季报点评或已退出业务的陈旧材料凑数，本包按红棉股份当前业务结构收录3份券商深度对标报告：文创园区运营、饮料品牌渠道、食糖产业链。',
              '3. 下列材料是横向研究资料，不代表券商对红棉股份本身的评级、目标价或盈利预测。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(manifest, 1):
              readme.extend([
                  f'{index}. {record["filename"]}',
                  f'   对标公司：{record["peer_name"]}（{record["peer_code"]}）',
                  f'   券商：{record["broker"]}',
                  f'   标题：{record["title"]}',
                  f'   日期：{record["publish_date"]}；页数：{record["pages"]}',
                  f'   与红棉股份的相关性：{record["relevance_to_target"]}',
                  f'   来源：{record["source_url"]}',
                  f'   SHA-256：{record["sha256"]}',
                  '',
              ])
          readme.append('完整性核验：已检查PDF文件头、对标公司身份、券商研究标识、实际页数、qpdf结构、重复文件及SHA-256；最终ZIP已通过CRC测试。')

          (FINAL_DIR / '00_文件清单与口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (FINAL_DIR / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (FINAL_DIR / 'SHA256SUMS.txt').write_text(''.join(f'{item["sha256"]}  {item["filename"]}\n' for item in manifest), encoding='utf-8')
          (FINAL_DIR / '检索元数据.json').write_text(json.dumps(all_metadata, ensure_ascii=False, indent=2), encoding='utf-8')

          for index, record in enumerate(manifest, 1):
              source = FINAL_DIR / record['filename']
              prefix = VERIFY / f'{index:02d}'
              result = subprocess.run(['pdftoppm', '-f', '1', '-singlefile', '-png', '-r', '110', str(source), str(prefix)], capture_output=True, text=True)
              if result.returncode != 0:
                  raise RuntimeError(f'PDF render failed for {source.name}: {result.stderr[-800:]}')

          zip_path = ART / f'{PACKAGE}.zip'
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(FINAL_DIR.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              if len(pdfs) != 3:
                  raise RuntimeError(f'Expected 3 PDFs, got {len(pdfs)}')

          print('SELECTED_FINAL', json.dumps(manifest, ensure_ascii=False, indent=2), flush=True)
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hongmian-000523-peer-deep-reports-final
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0

      - name: Upload verification renders
        uses: actions/upload-artifact@v4
        with:
          name: hongmian-000523-peer-deep-reports-renders
          path: verification_renders/*.png
          retention-days: 30
          compression-level: 0
