name: Collect Electric Chip broker research reports

on:
  push:
    branches:
      - tmp/electric-chip-600877-broker-reports-20261104-v1
    paths:
      - .github/workflows/electric-chip-600877-broker-reports-20261104.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover, download and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = "600877"
          COMPANY = "电科芯片"
          ALIASES = {"电科芯片", "声光电科", "ST电能", "中电科能源"}
          NAME_TOKENS = ("电科芯片", "声光电科", "中电科声光电", "中电科芯片", "中电科能源")
          ROOT_NAME = "电科芯片_600877_券商研究报告"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def get_json(url: str):
              last = None
              for attempt in range(4):
                  try:
                      r = session.get(url, timeout=(30, 240), allow_redirects=True)
                      print("GET_JSON", r.status_code, len(r.content), url)
                      r.raise_for_status()
                      return r.json()
                  except Exception as exc:
                      last = exc
                      print("GET_JSON_ERROR", attempt, repr(exc))
                      time.sleep(1 + attempt)
              raise last

          candidates: dict[str, dict] = {}
          for year in range(2022, 2027):
              url = f"https://raw.githubusercontent.com/metatools2023/reportlists/main/site/data/index-{year}.json"
              try:
                  data = get_json(url)
              except Exception as exc:
                  print("INDEX_FAILED", year, repr(exc))
                  continue
              for rec in data.get("reports", []):
                  info = str(rec.get("i") or "")
                  title = str(rec.get("t") or "")
                  stock = str(rec.get("s") or "")
                  blob = f"{stock} {title}"
                  if not info or int(rec.get("q") if rec.get("q") is not None else -1) != 0:
                      continue
                  if stock in ALIASES or any(token in blob for token in NAME_TOKENS) or CODE in blob:
                      candidates[info] = {
                          "infoCode": info,
                          "date": str(rec.get("d") or ""),
                          "title": title,
                          "broker": str(rec.get("o") or ""),
                          "rating": str(rec.get("r") or ""),
                          "analyst": str(rec.get("a") or ""),
                          "stock": stock,
                          "source": f"reportlists-index-{year}",
                      }

          # Known verified 2022 first-coverage report; retained as a fallback if an index field changes.
          candidates.setdefault("AP202206241574390411", {
              "infoCode": "AP202206241574390411",
              "date": "2022-06-24",
              "title": "首次覆盖：业务战略转型发挥综效；北斗短报文应用爆发在即",
              "broker": "海通国际",
              "rating": "优于大市（首次覆盖）",
              "analyst": "",
              "stock": "声光电科",
              "source": "verified-web-fallback",
          })

          print("CANDIDATE_COUNT", len(candidates))
          for item in sorted(candidates.values(), key=lambda x: (x["date"], x["infoCode"]), reverse=True):
              print("CANDIDATE", json.dumps(item, ensure_ascii=False))

          def safe_name(text: str, limit: int = 88) -> str:
              text = re.sub(r'[\\/:*?"<>|\r\n\t]+', "_", text).strip(" ._")
              return text[:limit] or "report"

          def try_download(info: str) -> tuple[bytes, str] | None:
              urls = [
                  f"https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H1_{info}_1.pdf",
                  f"https://pdf.dfcfw.com/pdf/H4_{info}_1.pdf",
              ]
              for url in urls:
                  try:
                      r = session.get(
                          url,
                          timeout=(30, 300),
                          allow_redirects=True,
                          headers={"Referer": "https://data.eastmoney.com/", "Accept": "application/pdf,*/*;q=0.8"},
                      )
                      print("PDF_PROBE", r.status_code, len(r.content), r.headers.get("content-type"), url)
                      if r.status_code == 200 and r.content.startswith(b"%PDF-") and len(r.content) > 50_000:
                          return r.content, url
                  except Exception as exc:
                      print("PDF_ERROR", url, repr(exc))
              return None

          downloaded = []
          temp_dir = Path("_downloaded")
          temp_dir.mkdir(exist_ok=True)
          for meta in sorted(candidates.values(), key=lambda x: (x["date"], x["infoCode"]), reverse=True):
              result = try_download(meta["infoCode"])
              if result is None:
                  continue
              data, url = result
              temp_path = temp_dir / f"{meta['infoCode']}.pdf"
              temp_path.write_bytes(data)
              try:
                  reader = PdfReader(str(temp_path), strict=False)
                  pages = len(reader.pages)
                  text = "\n".join((page.extract_text() or "") for page in reader.pages[: min(8, pages)])
              except Exception as exc:
                  print("PARSE_ERROR", meta["infoCode"], repr(exc))
                  continue
              compact = re.sub(r"\s+", "", text)
              if pages < 3:
                  continue
              if not (CODE in compact or any(token in compact for token in NAME_TOKENS)):
                  print("ISSUER_MISMATCH", meta["infoCode"], meta["title"], pages)
                  continue
              title = meta["title"]
              score = 0
              if "首次覆盖" in title or "首次" in title:
                  score += 70
              if "深度" in title or "战略转型" in title or "北斗短报文" in title:
                  score += 55
              if pages >= 25:
                  score += 45
              elif pages >= 15:
                  score += 35
              elif pages >= 10:
                  score += 20
              elif pages >= 5:
                  score += 8
              if meta["date"] >= "2022-01-01":
                  score += 20
              if "点评" in title and pages < 10:
                  score -= 10
              if meta["date"] < "2022-01-01":
                  score -= 100
              downloaded.append({
                  **meta,
                  "downloadUrl": url,
                  "tempPath": str(temp_path),
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "score": score,
              })
              print("DOWNLOADED", score, pages, json.dumps(meta, ensure_ascii=False))

          downloaded.sort(key=lambda x: (x["score"], x["date"], x["pages"]), reverse=True)
          # Prefer broker diversity, then fill remaining slots by score.
          selected = []
          brokers = set()
          for item in downloaded:
              broker = item["broker"] or "未知机构"
              if broker not in brokers:
                  selected.append(item)
                  brokers.add(broker)
              if len(selected) == 3:
                  break
          if len(selected) < 2:
              for item in downloaded:
                  if item not in selected:
                      selected.append(item)
                  if len(selected) == 2:
                      break
          if len(selected) < 2:
              raise RuntimeError(f"Only {len(selected)} validated public broker PDFs were found")

          manifest = []
          for idx, item in enumerate(selected, 1):
              filename = (
                  f"{idx:02d}_{safe_name(item['date'])}_{safe_name(item['broker'] or '未知机构')}_"
                  f"{safe_name(item['title'])}_{item['infoCode']}.pdf"
              )
              source_path = Path(item["tempPath"])
              output_path = PDF_DIR / filename
              output_path.write_bytes(source_path.read_bytes())
              check = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(output_path)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f"qpdf validation failed for {filename}: {check.stdout}")
              prefix = PREVIEW_DIR / output_path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "130", "-singlefile", str(output_path), str(prefix)],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"Preview failed for {filename}: {render.stdout}")
              clean = {k: v for k, v in item.items() if k != "tempPath"}
              clean.update({"filename": filename, "preview": str(Path("首页预览") / preview.name)})
              manifest.append(clean)

          readme = [
              f"{COMPANY}（{CODE}.SH）券商研究报告资料包",
              "整理日期：2026-11-04",
              "",
              f"本包收录{len(manifest)}份可公开下载并验证的券商原始PDF。",
              "优先选择首次覆盖、公司深度或页数较长的公司研究；若公开覆盖较少，保留一份较新的公司点评报告。",
              "全部文件均核对证券代码/公司名称、实际页数、PDF结构及首页渲染。",
              "",
          ]
          for idx, item in enumerate(manifest, 1):
              readme.extend([
                  f"{idx}. {item['filename']}",
                  f"   券商：{item['broker']}；日期：{item['date']}；评级：{item['rating']}；研究员：{item['analyst']}",
                  f"   标题：{item['title']}",
                  f"   页数：{item['pages']}；来源：{item['downloadUrl']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "说明：报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。",
              "核验项目：PDF文件头、公司/证券代码、页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")
          (ROOT / "manifest.json").write_text(json.dumps({
              "company": COMPANY,
              "stock_code": CODE,
              "prepared_on": "2026-11-04",
              "report_count": len(manifest),
              "files": manifest,
              "all_validated_candidates": [{k: v for k, v in x.items() if k != "tempPath"} for x in downloaded],
          }, ensure_ascii=False, indent=2), encoding="utf-8")
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "券商", "研究员", "日期", "标题", "评级", "页数", "字节数", "SHA-256", "原始PDF来源"])
              for item in manifest:
                  writer.writerow([item["filename"], item["broker"], item["analyst"], item["date"], item["title"], item["rating"], item["pages"], item["bytes"], item["sha256"], item["downloadUrl"]])
          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("electric_chip_600877_broker_reports.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != len(manifest):
                  raise RuntimeError(f"ZIP PDF count mismatch: {len(pdf_names)} vs {len(manifest)}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "files": [{k: item[k] for k in ["filename", "broker", "analyst", "date", "title", "rating", "pages", "bytes", "sha256", "downloadUrl"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: electric-chip-600877-broker-reports-20261104
          path: |
            electric_chip_600877_broker_reports.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
