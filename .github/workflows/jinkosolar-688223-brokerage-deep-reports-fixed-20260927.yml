name: Build clean JinkoSolar Energy 688223 brokerage deep reports ZIP 20260927

on:
  push:
    paths:
      - '.github/workflows/jinkosolar-688223-brokerage-deep-reports-fixed-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf ghostscript
          python -m pip install --quiet requests pypdf

      - name: Download selected deep reports and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          PACKAGE = '晶科能源_688223_券商深度报告精选_3份'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          reports = [
              {
                  'filename': '01_东吴证券_2022-05-04_技术布局追星赶月_渠道品牌厚积薄发.pdf',
                  'broker': '东吴证券',
                  'date': '2022-05-04',
                  'title': '技术布局追星赶月，渠道品牌厚积薄发',
                  'authors': '曾朵红、陈瑶、郭亚男',
                  'info_code': 'AP202205031563289682',
                  'expected_pages': 40,
                  'min_pages': 37,
                  'min_bytes': 1_200_000,
              },
              {
                  'filename': '02_国信证券_2022-03-08_全球领先的光伏组件商_N型量产加强竞争优势.pdf',
                  'broker': '国信证券',
                  'date': '2022-03-08',
                  'title': '全球领先的光伏组件商，N型量产加强竞争优势',
                  'authors': '王蔚祺、李恒源',
                  'info_code': 'AP202203081551300946',
                  'expected_pages': 44,
                  'min_pages': 41,
                  'min_bytes': 1_500_000,
              },
              {
                  'filename': '03_中银证券_2022-04-19_组件龙头回归_一体化盈利有望提升.pdf',
                  'broker': '中银证券',
                  'date': '2022-04-19',
                  'title': '组件龙头回归，一体化盈利有望提升',
                  'authors': '李可伦',
                  'info_code': 'AP202204191560189762',
                  'expected_pages': 34,
                  'min_pages': 31,
                  'min_bytes': 900_000,
              },
          ]

          def candidate_urls(info_code: str) -> list[str]:
              return [
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.PDF',
                  f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.PDF',
              ]

          def inspect_pdf(path: Path, report: dict) -> tuple[int, int, str]:
              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages'] or abs(pages - report['expected_pages']) > 3:
                  raise RuntimeError(f'page count mismatch: {pages}')
              check = subprocess.run(['qpdf', '--check', str(path)], capture_output=True, text=True)
              return pages, check.returncode, (check.stdout + '\n' + check.stderr)[-4000:]

          def repair_with_ghostscript(source: Path, destination: Path) -> None:
              subprocess.run([
                  'gs', '-q', '-dNOPAUSE', '-dBATCH', '-dSAFER',
                  '-sDEVICE=pdfwrite', '-dCompatibilityLevel=1.7',
                  '-dPDFSETTINGS=/prepress', '-dAutoRotatePages=/None',
                  f'-sOutputFile={destination}', str(source),
              ], check=True, capture_output=True, text=True, timeout=600)

          def download(report: dict, destination: Path) -> tuple[str, int, str]:
              errors: list[str] = []
              for url in candidate_urls(report['info_code']):
                  temp = destination.with_suffix(destination.suffix + '.part')
                  temp.unlink(missing_ok=True)
                  try:
                      with session.get(
                          url,
                          headers={
                              'Referer': 'https://data.eastmoney.com/report/',
                              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                          },
                          stream=True,
                          allow_redirects=True,
                          timeout=(30, 420),
                      ) as response:
                          print('DOWNLOAD', destination.name, 'status', response.status_code, url, 'final', response.url, flush=True)
                          response.raise_for_status()
                          with temp.open('wb') as file_handle:
                              for chunk in response.iter_content(chunk_size=1024 * 1024):
                                  if chunk:
                                      file_handle.write(chunk)
                      file_size = temp.stat().st_size
                      with temp.open('rb') as file_handle:
                          header = file_handle.read(8)
                      if file_size < report['min_bytes'] or not header.startswith(b'%PDF-'):
                          raise RuntimeError(f'invalid PDF response: size={file_size}, header={header!r}')

                      pages, qpdf_code, diagnostics = inspect_pdf(temp, report)
                      if qpdf_code not in (0, 3):
                          repaired = destination.with_suffix('.repaired.pdf')
                          repaired.unlink(missing_ok=True)
                          repair_with_ghostscript(temp, repaired)
                          repaired_pages, repaired_code, repaired_diagnostics = inspect_pdf(repaired, report)
                          if repaired_code not in (0, 3):
                              repaired.unlink(missing_ok=True)
                              raise RuntimeError(f'qpdf failed before and after repair: {diagnostics}; {repaired_diagnostics}')
                          temp.unlink(missing_ok=True)
                          repaired.replace(destination)
                          return str(response.url), repaired_pages, 'ghostscript-repaired'

                      temp.replace(destination)
                      return str(response.url), pages, 'original'
                  except Exception as exc:
                      errors.append(f'{url}: {exc!r}')
                      temp.unlink(missing_ok=True)
                      destination.with_suffix('.repaired.pdf').unlink(missing_ok=True)
                      time.sleep(1)
              raise RuntimeError(f"download/validation failed for {destination.name}: {errors}")

          records: list[dict] = []
          seen_hashes: set[str] = set()

          for report in reports:
              destination = OUT / report['filename']
              source_url, page_count, processing = download(report, destination)

              data = destination.read_bytes()
              sha256 = hashlib.sha256(data).hexdigest()
              if sha256 in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {destination.name}')
              seen_hashes.add(sha256)

              record = {
                  'filename': report['filename'],
                  'broker': report['broker'],
                  'date': report['date'],
                  'title': report['title'],
                  'authors': report['authors'],
                  'info_code': report['info_code'],
                  'source_url': source_url,
                  'pages': page_count,
                  'bytes': len(data),
                  'processing': processing,
                  'sha256': sha256,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '晶科能源（688223.SH）券商深度报告精选',
              '整理日期：2026-09-27',
              '',
              '筛选原则：选择完整篇幅的首次覆盖或公司深度报告，覆盖不同券商，并优先保留对一体化、N型/TOPCon技术和全球渠道进行系统分析的报告。',
              '资料来源：东方财富研究报告公开文件服务器。',
              '所有PDF均完成文件头、文件大小、页数、qpdf结构、SHA-256及ZIP CRC检查；必要时使用Ghostscript规范化重写。',
              '',
              '文件清单：',
          ]
          for index, record in enumerate(records, 1):
              readme.extend([
                  f"{index}. {record['broker']}，{record['date']}",
                  f"   标题：{record['title']}",
                  f"   作者：{record['authors']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   文件：{record['filename']}",
                  f"   来源：{record['source_url']}",
                  f"   处理：{record['processing']}；信息代码：{record['info_code']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_报告清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{record['sha256']}  {record['filename']}\n" for record in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')

          with zipfile.ZipFile(zip_path) as archive:
              bad_file = archive.testzip()
              if bad_file:
                  raise RuntimeError('ZIP CRC failure: ' + bad_file)
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_names) != 3:
                  raise RuntimeError(f'expected 3 PDFs, found {len(pdf_names)}')

          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: jinkosolar-688223-brokerage-deep-reports-fixed-20260927
          path: 晶科能源_688223_券商深度报告精选_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
