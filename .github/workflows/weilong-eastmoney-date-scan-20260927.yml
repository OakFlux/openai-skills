name: Scan Eastmoney exact dates for Weilong reports 20260927

on:
  push:
    paths:
      - '.github/workflows/weilong-eastmoney-date-scan-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: python -m pip install --quiet requests
      - name: Scan exact publication windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,re,time,datetime
          from pathlib import Path
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          API='https://reportapi.eastmoney.com/report/list'
          s=requests.Session();s.trust_env=False
          retry=Retry(total=4,backoff_factor=1,status_forcelist=[429,500,502,503,504],allowed_methods=['GET'])
          s.mount('https://',HTTPAdapter(max_retries=retry))
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/javascript,*/*;q=0.01'})
          def parse(r):
            try:return r.json()
            except Exception:
              m=re.search(r'^[^(]*\((.*)\)\s*;?$',r.text.strip(),re.S)
              return json.loads(m.group(1)) if m else {}
          windows=[('2025-02-25','2025-03-02'),('2025-04-25','2025-05-02'),('2025-06-20','2025-06-29'),('2024-10-15','2024-10-22'),('2021-05-19','2021-05-24')]
          keys=['卫龙','衛龍','09985','9985','魔芋十年','魔芋开启新纪元','辣味休闲食品龙头','辣味故事儿时诵','小辣条造就大玩家']
          matches=[];meta=[]
          for start,end in windows:
            p=1
            while True:
              params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':start,'endTime':end,'pageNo':str(p),'qType':'0','orgCode':'','code':'','rcode':'','p':str(p),'pageNum':str(p),'pageNumber':str(p)}
              r=s.get(API,params=params,timeout=(20,90));r.raise_for_status();d=parse(r)
              data=d.get('data') or []
              total=int(d.get('TotalPage') or d.get('totalPage') or 1)
              meta.append({'start':start,'end':end,'page':p,'total':total,'count':len(data),'hits':d.get('hits')})
              for rec in data:
                text=json.dumps(rec,ensure_ascii=False)
                if any(k.lower() in text.lower() for k in keys):
                  info=rec.get('infoCode') or rec.get('info_code') or rec.get('INFOCODE') or rec.get('id')
                  rec['_candidate_pdf_urls']=[]
                  if info:
                    rec['_candidate_pdf_urls']=[f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf']
                  matches.append(rec)
              print(start,end,p,total,len(data),'matches',len(matches),flush=True)
              if p>=total:break
              p+=1;time.sleep(.2)
          Path('out/matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL',json.dumps(matches,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: weilong-eastmoney-date-scan-20260927
          path: out
          retention-days: 7
          if-no-files-found: error
