name: Search Fxbaogao for Xinbang Intelligent reports 20261014

on:
  push:
    paths:
      - '.github/workflows/xinbang-301112-fxbaogao-search-20261014.yml'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Search report database
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests, time
          from pathlib import Path
          out=Path('out'); out.mkdir()
          url='https://api.fxbaogao.com/mofoun/report/searchReportData/searchListNoAuth'
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Content-Type':'application/json','Origin':'https://www.fxbaogao.com','Referer':'https://www.fxbaogao.com/'})
          queries=['信邦智能','301112','信邦智能 华金证券','信邦智能 申万宏源','信邦智能 新股','信邦智能 深度','信邦智能 汽车智能制造','信邦智能 机器人','广州信邦智能装备','英迪芯微 信邦智能']
          all_rows=[]
          for q in queries:
            for order in [1,2,3]:
              for page in range(1,8):
                body={'keywords':q,'pageIndex':page,'pageSize':20,'order':order,'nop':-1}
                try:
                  r=s.post(url,json=body,timeout=(20,120))
                  print('QUERY',q,'order',order,'page',page,'status',r.status_code,'len',len(r.content),flush=True)
                  if r.status_code!=200: break
                  j=r.json(); data=j.get('data') or {}; rows=data.get('dataList') or []
                  print('RESULTS',len(rows),'total',data.get('total') or data.get('totalCount'),flush=True)
                  for x in rows:
                    x=dict(x); x['_query']=q; x['_order']=order; x['_page']=page; all_rows.append(x)
                    print('ROW',json.dumps({k:x.get(k) for k in ['docId','title','orgName','industryName','pageNum','pubTime','pdfPath','stockCodes','reportType','docType','isDeep','isNotBroker']},ensure_ascii=False),flush=True)
                  if len(rows)<20: break
                except Exception as e:
                  print('ERR',q,order,page,repr(e),flush=True); break
                time.sleep(0.15)
          # de-dup by docId
          unique={}
          for x in all_rows:
            unique[str(x.get('docId') or x.get('id') or json.dumps(x,sort_keys=True,ensure_ascii=False))]=x
          rows=list(unique.values())
          (out/'results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          concise=[]
          for x in rows:
            c={k:x.get(k) for k in ['docId','title','orgName','industryName','pageNum','pubTime','pdfPath','stockCodes','reportType','docType','isDeep','isNotBroker']}
            concise.append(c)
          (out/'concise.json').write_text(json.dumps(concise,ensure_ascii=False,indent=2),encoding='utf-8')
          print('UNIQUE',len(rows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xinbang-301112-fxbaogao-search
          path: out
          retention-days: 7
