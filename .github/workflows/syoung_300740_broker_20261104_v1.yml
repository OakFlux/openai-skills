name: package-syoung-300740-broker-reports

on:
  push:
    branches:
      - tmp/syoung-300740-broker-20261104-v1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pillow

      - name: Query download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          COMPANY = "水羊股份"
          FULL_NAME = "水羊集团股份有限公司"
          CODE = "300740"
          PREPARED = "2026-11-04"
          ROOT_NAME = "水羊股份_300740_券商深度研究报告_3份"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          desired = [
              {
                  "sequence": 1,
                  "title_key": "从美妆平台到高奢品牌集团，高端化转型开启成长新周期",
                  "filename": "01_20260814_东吴证券_从美妆平台到高奢品牌集团_公司深度研究.pdf",
                  "report_type": "公司深度研究/首次覆盖",
              },
              {
                  "sequence": 2,
                  "title_key": "高端转型效果渐显，高奢新星冉冉升起",
                  "filename": "02_20250916_浙商证券_高端转型效果渐显高奢新星冉冉升起_公司深度.pdf",
                  "report_type": "公司深度报告",
              },
              {
                  "sequence": 3,
                  "title_key": "双轮驱动的领先美妆集团，品牌升级迎经营拐点",
                  "filename": "03_20230707_开源证券_双轮驱动的领先美妆集团_首次覆盖报告.pdf",
                  "report_type": "公司首次覆盖报告",
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Referer": f"https://data.eastmoney.com/report/{CODE}.html",
          })

          def fetch_metadata() -> list[dict]:
              url = "https://reportapi.eastmoney.com/report/list"
              params = {
                  "industryCode": "*",
                  "pageSize": "100",
                  "industry": "*",
                  "rating": "*",
                  "ratingChange": "*",
                  "beginTime": "2023-01-01",
                  "endTime": PREPARED,
                  "pageNo": "1",
                  "fields": "",
                  "qType": "0",
                  "orgCode": "",
                  "code": CODE,
                  "rcode": "",
                  "cb": "callback_syoung",
              }
              response = session.get(url, params=params, timeout=(30, 180))
              print("METADATA", response.status_code, len(response.content), response.url)
              response.raise_for_status()
              text = response.text.strip()
              match = re.search(r"^[^(]*\((.*)\)\s*;?\s*$", text, re.S)
              payload = json.loads(match.group(1) if match else text)
              rows = payload.get("data") or []
              print("METADATA_ROWS", len(rows))
              for row in rows:
                  print("REPORT", row.get("publishDate"), row.get("orgSName"), row.get("title"), row.get("infoCode"), row.get("attachPages"))
              return rows

          metadata = fetch_metadata()
          selected = []
          for spec in desired:
              candidates = [row for row in metadata if spec["title_key"] in str(row.get("title") or "")]
              if len(candidates) != 1:
                  raise RuntimeError(f"Expected one metadata match for {spec['title_key']}, got {len(candidates)}")
              row = candidates[0]
              selected.append({**spec, **row})

          def download_pdf(url: str) -> tuple[bytes, str, str]:
              last_error = None
              for attempt in range(5):
                  try:
                      response = session.get(
                          url,
                          timeout=(30, 360),
                          allow_redirects=True,
                          headers={
                              "Accept": "application/pdf,*/*;q=0.8",
                              "Referer": "https://data.eastmoney.com/",
                          },
                      )
                      print("DOWNLOAD", response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                      response.raise_for_status()
                      if response.content.startswith(b"%PDF-") and len(response.content) > 100_000:
                          return response.content, response.url, response.headers.get("content-type", "")
                      last_error = RuntimeError(f"Not a valid PDF: {response.content[:40]!r}")
                  except Exception as exc:
                      last_error = exc
                      print("DOWNLOAD_ERROR", attempt, url, repr(exc))
                      time.sleep(1 + attempt)
              raise RuntimeError(f"Download failed for {url}: {last_error}")

          manifest = []
          accepted_names = [CODE, COMPANY, FULL_NAME, "御家汇"]

          for item in selected:
              info_code = item["infoCode"]
              pdf_url = f"https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf"
              data, final_url, content_type = download_pdf(pdf_url)
              output = PDF_DIR / item["filename"]
              output.write_bytes(data)

              reader = PdfReader(str(output), strict=False)
              pages = len(reader.pages)
              expected_pages = int(item.get("attachPages") or 0)
              if expected_pages and pages != expected_pages:
                  raise RuntimeError(f"Page count mismatch for {output.name}: {pages} != {expected_pages}")
              if pages < 15:
                  raise RuntimeError(f"Report unexpectedly short: {output.name}: {pages} pages")

              text = "\n".join((page.extract_text() or "") for page in reader.pages[: min(10, pages)])
              compact = re.sub(r"\s+", "", text)
              if not any(name.replace(" ", "") in compact for name in accepted_names):
                  raise RuntimeError(f"Issuer validation failed for {output.name}")

              qpdf = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(output)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {output.name}: {qpdf.stdout}")

              prefix = PREVIEW_DIR / output.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "150", "-singlefile", str(output), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 8_000:
                  raise RuntimeError(f"Preview rendering failed for {output.name}: {render.stdout}")

              authors = item.get("researcher") or ""
              if not authors:
                  author_values = item.get("author") or []
                  authors = ",".join(str(value).split(".", 1)[-1] for value in author_values)

              rating = item.get("sRatingName") or item.get("emRatingName") or "未标注"
              publish_date = str(item.get("publishDate") or "").split(" ", 1)[0]
              record = {
                  "sequence": item["sequence"],
                  "broker": item.get("orgSName") or item.get("orgName") or "",
                  "date": publish_date,
                  "analyst": authors,
                  "rating": rating,
                  "report_type": item["report_type"],
                  "title": item.get("title") or item["title_key"],
                  "info_code": info_code,
                  "filename": item["filename"],
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_url": final_url,
                  "content_type": content_type,
                  "preview_file": str(Path("首页预览") / preview.name),
              }
              manifest.append(record)
              print("VALIDATED", record["broker"], record["date"], pages, record["sha256"], record["title"])

          if len(manifest) != 3:
              raise RuntimeError(f"Expected 3 reports, got {len(manifest)}")

          readme = [
              f"{FULL_NAME}（{CODE}.SZ）券商深度研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "本包收录3份可直接公开下载并验证的券商原始PDF，均为公司深度或首次覆盖研究。",
              "",
          ]
          for report in manifest:
              readme.extend([
                  f"{report['sequence']}. {report['filename']}",
                  f"   券商：{report['broker']}；研究员：{report['analyst']}",
                  f"   日期：{report['date']}；评级：{report['rating']}",
                  f"   类型：{report['report_type']}",
                  f"   标题：{report['title']}",
                  f"   页数：{report['pages']}；文件大小：{report['bytes']}字节",
                  f"   公开来源：{report['source_url']}",
                  f"   SHA-256：{report['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称或证券代码、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "报告版权归原券商及作者所有，仅供研究与存档，不构成投资建议。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": FULL_NAME,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "original_pdf_count": len(manifest),
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["序号", "券商", "日期", "研究员", "评级", "类型", "标题", "文件名", "页数", "字节数", "SHA-256", "公开来源", "首页预览"])
              for report in manifest:
                  writer.writerow([
                      report["sequence"], report["broker"], report["date"], report["analyst"], report["rating"],
                      report["report_type"], report["title"], report["filename"], report["pages"], report["bytes"],
                      report["sha256"], report["source_url"], report["preview_file"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{report['sha256']}  PDF文件/{report['filename']}" for report in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("syoung_300740_broker_deep_reports_3.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file_path in sorted(ROOT.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(Path(ROOT_NAME) / file_path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != 3:
                  raise RuntimeError(f"ZIP contains {len(pdf_names)} PDFs instead of 3")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "original_pdf_count": len(manifest),
              "files": [{key: report[key] for key in ["broker", "date", "analyst", "rating", "report_type", "title", "pages", "bytes", "sha256", "source_url"]} for report in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: syoung-300740-broker-deep-reports-3-20261104
          path: |
            syoung_300740_broker_deep_reports_3.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
