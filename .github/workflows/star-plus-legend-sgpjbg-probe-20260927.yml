name: Probe Star Plus Legend SGPJBG report mirrors 20260927

on:
  push:
    paths:
      - '.github/workflows/star-plus-legend-sgpjbg-probe-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect report pages and assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sgprobe
          python - <<'PY'
          from __future__ import annotations
          import html, json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls=[
            'https://www.sgpjbg.com.cn/baogao/908217.html',
            'https://www.sgpjbg.com.cn/bgdown/908217.html',
            'https://m.sgpjbg.com/bgdown/908217.html',
            'https://www.sgpjbg.com.cn/baogao/999681.html',
            'https://www.sgpjbg.com.cn/bgdown/999681.html',
            'https://m.sgpjbg.com/bgdown/999681.html',
          ]
          headers_variants=[
            {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Referer':'https://www.sgpjbg.com.cn/'},
            {'User-Agent':'Mozilla/5.0 (Linux; Android 15; Pixel 9 Pro) AppleWebKit/537.36 Chrome/151 Mobile Safari/537.36','Referer':'https://m.sgpjbg.com/'},
            {'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 Version/18.6 Mobile/15E148 Safari/604.1','Referer':'https://m.sgpjbg.com/'},
          ]
          out=[]
          for i,u in enumerate(urls):
            for hidx,h in enumerate(headers_variants):
              s=requests.Session();s.trust_env=False;s.headers.update(h)
              rec={'input':u,'ua':hidx}
              try:
                r=s.get(u,timeout=(20,90),allow_redirects=True)
                rec.update(status=r.status_code,final=r.url,type=r.headers.get('content-type'),bytes=len(r.content),headers=dict(r.headers))
                fn=Path('sgprobe')/f'{i:02d}_{hidx}.html';fn.write_bytes(r.content);rec['file']=fn.name
                text=r.text
                soup=BeautifulSoup(text,'lxml')
                rec['title']=soup.title.get_text(' ',strip=True) if soup.title else ''
                cands=set()
                for tag in soup.find_all(['a','script','iframe','embed','object','source','link','meta']):
                  for attr in ('href','src','data','content','data-url','data-src','download'):
                    v=tag.get(attr)
                    if v:
                      v=html.unescape(v).replace('\\/','/')
                      cands.add(urljoin(r.url,v))
                for pat in [
                  r'https?://[^\s"\'<>]+?\.pdf(?:\?[^\s"\'<>]*)?',
                  r'["\']([^"\']*(?:pdf|download|down|file|report)[^"\']*)["\']',
                  r'(?:pdfUrl|pdf_url|downloadUrl|download_url|fileUrl|file_url|url)\s*[:=]\s*["\']([^"\']+)["\']',
                ]:
                  for m in re.finditer(pat,text,re.I):
                    v=(m.group(1) if m.lastindex else m.group(0)).replace('\\/','/')
                    cands.add(urljoin(r.url,html.unescape(v)))
                rec['candidates']=sorted(x for x in cands if any(k in x.lower() for k in ['pdf','down','download','file','report','baogao']))[:1000]
                print('PAGE',json.dumps(rec,ensure_ascii=False)[:30000],flush=True)
                # Probe candidate direct PDFs/asset URLs lightly.
                probes=[]
                for cu in rec['candidates'][:150]:
                  try:
                    rr=s.get(cu,timeout=(15,45),allow_redirects=True,stream=True)
                    head=next(rr.iter_content(32),b'') if rr.status_code==200 else b''
                    pr={'url':cu,'status':rr.status_code,'final':rr.url,'type':rr.headers.get('content-type'),'length':rr.headers.get('content-length'),'head':repr(head[:12])}
                    if head.startswith(b'%PDF-') or 'pdf' in (rr.headers.get('content-type') or '').lower(): probes.append(pr)
                  except Exception: pass
                rec['pdf_probes']=probes
              except Exception as e: rec['error']=repr(e)
              out.append(rec);time.sleep(.4)
          Path('sgprobe/results.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          grep -RInE "\.pdf|downloadUrl|pdfUrl|fileUrl|bgdown|reportId|fileId" sgprobe > sgprobe/grep_hits.txt || true
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: star-plus-legend-sgpjbg-probe
          path: sgprobe
          retention-days: 7
          if-no-files-found: error
