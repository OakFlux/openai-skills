name: Search public PDF mirrors for Jinyao reports 20260929

on:
  push:
    paths:
      - '.github/workflows/jinyao-600488-web-search-links-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Query public search pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from html import unescape
          from urllib.parse import quote_plus, urljoin, urlparse, parse_qs

          queries = [
              '"原料药转型专科制剂 国内国际双线发展" PDF',
              '"乘行业整合东风 国内龙头迈向世界" PDF',
              '"皮质激素需求旺盛 增发加快未来发展" PDF',
              '"津药药业" "混改推动业绩高速增长" PDF',
              '600488 天药股份 深度报告 PDF',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def print_links(label, base, text):
              seen=set()
              for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                  href=unescape(m.group(1)); title=unescape(re.sub(r'<[^>]+>',' ',m.group(2))); title=re.sub(r'\s+',' ',title).strip()
                  if href.startswith('/'): href=urljoin(base,href)
                  if 'bing.com/ck/a' in href:
                      qs=parse_qs(urlparse(href).query); u=qs.get('u',[''])[0]
                      if u.startswith('a1'):
                          import base64
                          try: href=base64.b64decode(u[2:]+'===').decode()
                          except Exception: pass
                  if href.startswith(('http://','https://')) and href not in seen:
                      seen.add(href)
                      if any(k in href.lower() for k in ['pdf','report','research','yanbao','hibor','dfcfw','gelonghui','fxbaogao','reportify','pdfzj','wenku','stock']) or any(k in title for k in ['天药','津药','原料药','皮质激素','深度','研报']):
                          print(label,'LINK',title[:250],href,flush=True)

          for q in queries:
              print('\n===== QUERY',q,'=====',flush=True)
              urls=[
                  ('BING','https://www.bing.com/search?q='+quote_plus(q)+'&count=50'),
                  ('BAIDU','https://www.baidu.com/s?wd='+quote_plus(q)+'&rn=50'),
                  ('SOGOU','https://www.sogou.com/web?query='+quote_plus(q)+'&num=50'),
              ]
              for label,url in urls:
                  try:
                      r=s.get(url,timeout=(15,40),allow_redirects=True)
                      print(label,'STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'ENC',r.apparent_encoding,flush=True)
                      text=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace')
                      print_links(label,r.url,text)
                  except Exception as e:
                      print(label,'ERROR',repr(e),flush=True)
          PY
