name: Scan public Hangyan listings and upload results
on:
  push:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Scan public listing pages
        run: |
          mkdir -p out/pages
          python - <<'PY'
          import concurrent.futures
          import json
          import requests
          from pathlib import Path
          from bs4 import BeautifulSoup

          pages=list(range(700,851))+list(range(1000,1251))+list(range(1220,1401))
          keywords=('华润建材科技','华润水泥控股','01313.HK','01313.hk','1313.HK','1313HK')
          out=Path('out')

          def fetch(number):
              try:
                  r=requests.get('https://www.hangyan.co/reports',params={'page':number},headers={'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'},timeout=60)
                  if r.status_code != 200:
                      return {'page':number,'error':f'HTTP {r.status_code}'}
                  soup=BeautifulSoup(r.text,'html.parser')
                  matches=[]
                  # Search each protected report card and nearby parent block.
                  for node in soup.select('[data-controller="protected-link"]'):
                      parent=node
                      for _ in range(3):
                          if parent.parent is not None:
                              parent=parent.parent
                      text=parent.get_text(' ',strip=True)
                      if any(k in text for k in keywords):
                          matches.append({
                              'text':text[:3000],
                              'token':node.get('data-protected-link-token-value',''),
                              'href':(node.find('a').get('href') if node.find('a') else None)
                          })
                  if not matches and any(k in r.text for k in keywords):
                      matches.append({'text':'RAW_HTML_MATCH','token':'','href':None})
                  if matches:
                      (out/'pages'/f'{number}.html').write_text(r.text,encoding='utf-8')
                  return {'page':number,'matches':matches}
              except Exception as exc:
                  return {'page':number,'error':repr(exc)}

          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              for item in pool.map(fetch,pages):
                  results.append(item)
          hits=[item for item in results if item.get('matches')]
          errors=[item for item in results if item.get('error')]
          payload={'hits':hits,'errors':errors,'pages_scanned':len(pages)}
          (out/'results.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crbmt-hangyan-scan-results
          path: out
          retention-days: 1
          compression-level: 0
