name: Discover Berry Genomics report download links

on:
  pull_request:
    paths:
      - 'tasks/berry-report-link-discovery-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch report pages and inspect links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          mkdir -p output
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          pages = {
              'northeast_2025': 'https://www.nxny.com/report/view_6098637.html',
              'haitong_2020': 'https://www.nxny.com/report/view_4482804.html',
              'changjiang_2020': 'https://www.nxny.com/report/view_4416079.html',
          }
          s = requests.Session(); s.trust_env = False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://www.nxny.com/'})
          out = {}
          for name, url in pages.items():
              r = s.get(url, timeout=(20,90), allow_redirects=True)
              print('PAGE', name, r.status_code, len(r.content), r.url, flush=True)
              Path(f'output/{name}.html').write_bytes(r.content)
              soup = BeautifulSoup(r.text, 'html.parser')
              links=[]
              for tag in soup.find_all(['a','iframe','embed','object','form','script']):
                  for attr in ('href','src','action','data'):
                      value=tag.get(attr)
                      if value:
                          links.append({'tag':tag.name,'attr':attr,'value':urljoin(r.url,value),'text':tag.get_text(' ',strip=True)[:100]})
              # URLs and PDF/file-like tokens embedded in scripts/HTML
              raw_urls = sorted(set(re.findall(r'https?://[^\s"\'<>]+', r.text)))
              tokens = sorted(set(re.findall(r'[^\s"\'<>]{0,120}(?:\.pdf|download|file|attach|down)[^\s"\'<>]{0,120}', r.text, flags=re.I)))
              out[name]={'page_url':r.url,'status':r.status_code,'length':len(r.content),'links':links,'raw_urls':raw_urls,'tokens':tokens[:300]}
              print('LINKS', name, json.dumps(links, ensure_ascii=False)[:20000], flush=True)
              print('RAW_URLS', name, json.dumps(raw_urls, ensure_ascii=False)[:20000], flush=True)
              print('TOKENS', name, json.dumps(tokens[:300], ensure_ascii=False)[:20000], flush=True)
          Path('output/discovery.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: berry-report-link-discovery
          path: output/
          retention-days: 7
          if-no-files-found: error
