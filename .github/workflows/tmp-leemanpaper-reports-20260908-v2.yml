name: Build Lee Man Paper verified report package
on:
  push:
    branches:
      - tmp-leemanpaper-reports-20260908-v2
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml pypdf pymupdf playwright
          python -m playwright install --with-deps chromium
      - name: Discover official HKEX links, download and verify reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package audit
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import io
          import json
          import re
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import fitz
          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          PACKAGE = Path('package')
          AUDIT = Path('audit')
          PACKAGE.mkdir(exist_ok=True)
          AUDIT.mkdir(exist_ok=True)

          TARGETS = {
              '2020 Annual Report': {
                  'filename': '01_Lee_Man_Paper_2020_Annual_Report.pdf',
                  'year': 2020,
                  'type': 'Annual Report',
                  'minimum_pages': 100,
              },
              '2021 Annual Report': {
                  'filename': '02_Lee_Man_Paper_2021_Annual_Report.pdf',
                  'year': 2021,
                  'type': 'Annual Report',
                  'minimum_pages': 100,
              },
              '2022 Annual Report': {
                  'filename': '03_Lee_Man_Paper_2022_Annual_Report.pdf',
                  'year': 2022,
                  'type': 'Annual Report',
                  'minimum_pages': 100,
              },
              '2023 Annual Report': {
                  'filename': '04_Lee_Man_Paper_2023_Annual_Report.pdf',
                  'year': 2023,
                  'type': 'Annual Report',
                  'minimum_pages': 100,
              },
              '2024 Annual Report': {
                  'filename': '05_Lee_Man_Paper_2024_Annual_Report.pdf',
                  'year': 2024,
                  'type': 'Annual Report',
                  'minimum_pages': 100,
              },
              '2025 Annual Report': {
                  'filename': '06_Lee_Man_Paper_2025_Annual_Report.pdf',
                  'year': 2025,
                  'type': 'Annual Report',
                  'minimum_pages': 100,
              },
              '2026 Interim Report': {
                  'filename': '07_Lee_Man_Paper_2026_Interim_Report.pdf',
                  'year': 2026,
                  'type': 'Interim Report',
                  'minimum_pages': 20,
              },
          }

          title_url = 'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&lang=EN&market=SEHK&stockId=6560'
          discovered = {}
          browser_audit = []

          def norm(text: str) -> str:
              return re.sub(r'\s+', ' ', text or '').strip()

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--no-sandbox', '--disable-dev-shm-usage'])
              context = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
                  locale='en-US',
                  viewport={'width': 1440, 'height': 1100},
              )
              page = context.new_page()
              response = page.goto(title_url, wait_until='domcontentloaded', timeout=120000)
              try:
                  page.wait_for_load_state('networkidle', timeout=30000)
              except PWTimeout:
                  pass
              page.wait_for_timeout(2500)

              def collect_links() -> dict[str, str]:
                  rows = page.eval_on_selector_all(
                      'a[href]',
                      "els => els.map(e => ({text:(e.innerText||e.textContent||'').replace(/\\s+/g,' ').trim(), href:e.href}))"
                  )
                  out = {}
                  for row in rows:
                      text = norm(row.get('text', ''))
                      href = row.get('href', '')
                      for target_name in TARGETS:
                          if target_name.lower() == text.lower() and href.lower().endswith('.pdf'):
                              out[target_name] = href
                  return out

              for attempt in range(18):
                  discovered.update(collect_links())
                  browser_audit.append({
                      'attempt': attempt,
                      'found': sorted(discovered),
                      'anchor_count': page.locator('a[href]').count(),
                  })
                  if len(discovered) == len(TARGETS):
                      break
                  page.evaluate('window.scrollTo(0, document.body.scrollHeight)')
                  page.wait_for_timeout(500)
                  candidates = [
                      page.get_by_text('LOAD MORE', exact=True),
                      page.get_by_text('Load More', exact=True),
                      page.locator('button:has-text("LOAD MORE")'),
                      page.locator('a:has-text("LOAD MORE")'),
                      page.locator('[id*="load" i], [class*="load" i]'),
                  ]
                  clicked = False
                  before = page.locator('a[href]').count()
                  for locator in candidates:
                      try:
                          count = locator.count()
                          for idx in range(count - 1, -1, -1):
                              item = locator.nth(idx)
                              if item.is_visible():
                                  item.scroll_into_view_if_needed()
                                  item.click(force=True, timeout=10000)
                                  clicked = True
                                  break
                          if clicked:
                              break
                      except Exception:
                          continue
                  if not clicked:
                      break
                  for _ in range(20):
                      page.wait_for_timeout(500)
                      if page.locator('a[href]').count() > before:
                          break
              discovered.update(collect_links())
              (AUDIT / 'hkex_title_page.html').write_text(page.content(), encoding='utf-8')
              page.screenshot(path=str(AUDIT / 'hkex_title_page.png'), full_page=True)
              browser.close()

          (AUDIT / 'browser_audit.json').write_text(
              json.dumps({'title_url': title_url, 'attempts': browser_audit, 'discovered': discovered}, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          # Reliable official URLs for reports already exposed by the live HKEX title-search page.
          # These also serve as a fallback if the dynamic LOAD MORE control changes.
          official_fallbacks = {
              '2023 Annual Report': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2024/0408/2024040800539.pdf',
              '2024 Annual Report': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/0331/2025033100429.pdf',
              '2025 Annual Report': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0324/2026032400352.pdf',
          }
          for name, url in official_fallbacks.items():
              discovered.setdefault(name, url)

          missing = [name for name in TARGETS if name not in discovered]
          if missing:
              # Fallback: use FinancialFilings' regulator-sourced year archive to discover the original HKEX PDF.
              # No document is accepted unless the final URL is on hkexnews.hk and PDF identity checks pass.
              session_probe = requests.Session()
              session_probe.headers.update({'User-Agent': 'Mozilla/5.0 Chrome/131 Safari/537.36'})
              year_pages = {
                  2020: 'https://financialfilings.com/companies/lee-man-paper-manufacturing-limited/2021/',
                  2021: 'https://financialfilings.com/companies/lee-man-paper-manufacturing-limited/2022/',
                  2022: 'https://financialfilings.com/companies/lee-man-paper-manufacturing-limited/2023/',
                  2026: 'https://financialfilings.com/companies/lee-man-paper-manufacturing-limited/2026/',
              }
              for target_name in list(missing):
                  year = TARGETS[target_name]['year']
                  archive_year = year + 1 if 'Annual' in target_name else 2026
                  page_url = year_pages.get(archive_year)
                  if not page_url:
                      continue
                  try:
                      rr = session_probe.get(page_url, timeout=60)
                      text = rr.text.replace('\\/', '/')
                      # First use explicit hkexnews PDF URLs in the archive HTML near the target title.
                      positions = [m.start() for m in re.finditer(re.escape(target_name), text, re.I)]
                      windows = []
                      for pos in positions:
                          windows.append(text[max(0, pos-12000):pos+12000])
                      windows.append(text)
                      found_url = None
                      for window in windows:
                          urls = re.findall(r'https?://[^\"\'<>\\s]+?\.pdf(?:\?[^\"\'<>\\s]*)?', window, re.I)
                          hkex = [u for u in urls if 'hkexnews.hk' in u]
                          if hkex:
                              found_url = hkex[0]
                              break
                      if found_url:
                          discovered[target_name] = found_url
                  except Exception as exc:
                      browser_audit.append({'financialfilings_error': target_name, 'error': repr(exc)})

          missing = [name for name in TARGETS if name not in discovered]
          if missing:
              raise RuntimeError(f'Could not discover official HKEX PDF links for: {missing}. Found: {discovered}')

          retry = Retry(
              total=7,
              connect=7,
              read=7,
              status=7,
              backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=frozenset(['GET']),
          )
          session = requests.Session()
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9,zh-CN;q=0.8',
              'Accept': 'application/pdf,*/*;q=0.8',
              'Referer': title_url,
          })

          manifest = []
          for index, (target_name, spec) in enumerate(TARGETS.items(), 1):
              url = discovered[target_name]
              if 'hkexnews.hk' not in urlparse := url.lower():
                  raise RuntimeError(f'Non-HKEX URL rejected for {target_name}: {url}')
              last_error = None
              for attempt in range(1, 8):
                  try:
                      response = session.get(url, timeout=(30, 300), allow_redirects=True)
                      response.raise_for_status()
                      data = response.content
                      if b'%PDF-' not in data[:2048] or len(data) < 100_000:
                          raise RuntimeError(f'Invalid PDF payload ({len(data)} bytes)')
                      reader = PdfReader(io.BytesIO(data), strict=False)
                      page_count = len(reader.pages)
                      if page_count < spec['minimum_pages']:
                          raise RuntimeError(f'Unexpected page count {page_count} for {target_name}')

                      sample_indices = sorted(set([0, 1, min(5, page_count-1), max(0, page_count//2), page_count-2, page_count-1]))
                      sample_parts = []
                      for page_index in sample_indices:
                          try:
                              sample_parts.append(reader.pages[page_index].extract_text() or '')
                          except Exception:
                              pass
                      sample = norm('\n'.join(sample_parts)).upper()
                      if not any(token in sample for token in ['LEE & MAN PAPER', 'LEE AND MAN PAPER', '理文造紙', '理文造纸']):
                          raise RuntimeError(f'Company identity not found in sampled pages for {target_name}')
                      if str(spec['year']) not in sample:
                          raise RuntimeError(f'Report year {spec["year"]} not found in sampled pages for {target_name}')
                      if spec['type'] == 'Annual Report' and 'ANNUAL REPORT' not in sample:
                          raise RuntimeError(f'Annual-report identity not found for {target_name}')
                      if spec['type'] == 'Interim Report' and 'INTERIM REPORT' not in sample:
                          raise RuntimeError(f'Interim-report identity not found for {target_name}')

                      path = PACKAGE / spec['filename']
                      path.write_bytes(data)

                      # Render first and final pages to ensure the PDF is visually readable, not merely parseable.
                      doc = fitz.open(path)
                      for page_index, suffix in [(0, 'first'), (page_count-1, 'last')]:
                          pix = doc[page_index].get_pixmap(matrix=fitz.Matrix(0.8, 0.8), alpha=False)
                          render_path = AUDIT / f'{index:02d}_{spec["year"]}_{suffix}.png'
                          pix.save(str(render_path))
                      doc.close()

                      manifest.append({
                          '序号': index,
                          '文件名': path.name,
                          '报告类型': spec['type'],
                          '报告年度': spec['year'],
                          'PDF页数': page_count,
                          '文件大小_字节': len(data),
                          'SHA256': hashlib.sha256(data).hexdigest(),
                          '港交所原始链接': response.url,
                      })
                      print('VERIFIED', target_name, page_count, len(data), response.url, flush=True)
                      break
                  except Exception as exc:
                      last_error = exc
                      print('RETRY', target_name, attempt, repr(exc), flush=True)
                      time.sleep(min(2 ** attempt, 20))
              else:
                  raise RuntimeError(f'Failed to download/verify {target_name}: {last_error!r}')

          if len(manifest) != 7:
              raise RuntimeError(f'Expected 7 verified PDFs, got {len(manifest)}')

          with (PACKAGE / '文件清单与校验值.csv').open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=list(manifest[0].keys()))
              writer.writeheader()
              writer.writerows(manifest)

          readme_lines = [
              '理文造纸有限公司（Lee & Man Paper Manufacturing Limited，02314.HK）',
              '2020—2025年报及截至2026年9月8日最新定期财务报告资料包',
              '',
              '文件内容：',
              '1. 2020—2025年完整年度报告，共6份。',
              '2. 2026年中期报告，报告期截至2026年6月30日，港交所披露日期为2026年8月12日。',
              '',
              '披露口径说明：',
              '理文造纸为香港上市公司，通常不发布A股式一季报和三季报。因此，本资料包以截至当前最新的完整中期报告替代“最新季报”。',
              '',
              '完整性检查：',
              '所有PDF均来自港交所披露易（HKEXnews）原始附件；已检查PDF文件头、可解析性、公司名称、报告年度、报告类型、实际页数，并对首页及末页进行渲染检查。',
              '文件SHA-256及官方原始链接见“文件清单与校验值.csv”。',
              '',
          ]
          for row in manifest:
              readme_lines.append(f"{row['序号']}. {row['文件名']}｜{row['PDF页数']}页｜{row['港交所原始链接']}")
          (PACKAGE / 'README_CN.txt').write_text('\n'.join(readme_lines), encoding='utf-8')

          # Build and test an internal mirror archive so the exact selected contents undergo CRC validation before artifact upload.
          mirror = AUDIT / 'LeeManPaper_internal_crc_test.zip'
          with zipfile.ZipFile(mirror, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(PACKAGE.iterdir()):
                  archive.write(path, arcname=path.name)
          with zipfile.ZipFile(mirror, 'r') as archive:
              bad = archive.testzip()
              pdfs = [n for n in archive.namelist() if n.lower().endswith('.pdf')]
              if bad is not None or len(pdfs) != 7:
                  raise RuntimeError(f'CRC validation failed: bad={bad}, pdf_count={len(pdfs)}')

          result = {
              'ok': True,
              'company': 'Lee & Man Paper Manufacturing Limited',
              'stock_code': '02314.HK',
              'pdf_count': 7,
              'years': [2020, 2021, 2022, 2023, 2024, 2025],
              'latest_periodic_report': '2026 Interim Report',
              'internal_crc_test': True,
              'manifest': manifest,
              'discovered_links': discovered,
          }
          (PACKAGE / 'VALIDATION.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          (AUDIT / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PACKAGE_READY', json.dumps(result, ensure_ascii=False), flush=True)
          PY
      - name: Upload verified report package
        uses: actions/upload-artifact@v4
        with:
          name: LeeManPaper-02314-2020-2025-Annual-and-2026-Interim
          path: package/*
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeeManPaper-audit
          path: audit/*
          retention-days: 1
          if-no-files-found: warn
          compression-level: 6
