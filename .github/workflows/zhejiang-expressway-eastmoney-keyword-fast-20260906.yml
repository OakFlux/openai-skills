name: Fast Eastmoney keyword lookup for Zhejiang Expressway 20260906

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-eastmoney-keyword-fast-20260906.yml'

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query and upload matching rows
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          mkdir -p result
          python - <<'PY'
          import hashlib,json,time
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          out=Path('result')
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          base={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2000-01-01','endTime':'2030-01-01','pageNo':'1','fields':'','qType':'0','orgCode':'','code':'*','rcode':''}
          matches=[]
          for page in range(1,6):
            p={**base,'pageNo':str(page),'p':str(page),'pageNum':str(page),'pageNumber':str(page),'keyword':'浙江沪杭甬'}
            r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=(10,30))
            print('QUERY',page,r.status_code,len(r.content),r.url,flush=True)
            (out/f'page_{page}.json').write_bytes(r.content)
            data=r.json(); rows=data.get('data') or []
            print('HITS',data.get('hits'),'ROWS',len(rows),flush=True)
            for row in rows:
              blob=json.dumps(row,ensure_ascii=False)
              if '浙江沪杭甬' in blob or '沪杭甬' in blob or str(row.get('stockCode','')) in ('00576','0576','576'):
                matches.append(row); print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
            if not rows: break
            time.sleep(.5)
          uniq=[];seen=set()
          for x in matches:
            k=x.get('infoCode') or json.dumps(x,sort_keys=True,ensure_ascii=False)
            if k not in seen:seen.add(k);uniq.append(x)
          valid=[]
          for i,x in enumerate(uniq):
            info=x.get('infoCode');
            if not info:continue
            u=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf'
            r=s.get(u,timeout=(15,90),headers={'Referer':'https://data.eastmoney.com/'})
            rec={'metadata':x,'url':u,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'valid':r.content.startswith(b'%PDF-') and len(r.content)>20000}
            if rec['valid']:
              p=out/f'{i+1:02d}_{info}.pdf';p.write_bytes(r.content);rec['actual_pages']=len(PdfReader(str(p),strict=False).pages);rec['sha256']=hashlib.sha256(r.content).hexdigest();valid.append(rec)
            print('PDF',json.dumps({k:v for k,v in rec.items() if k!='metadata'},ensure_ascii=False),flush=True)
          (out/'matches.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'valid.json').write_text(json.dumps(valid,ensure_ascii=False,indent=2),encoding='utf-8')
          print('DONE',len(uniq),len(valid),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-eastmoney-keyword-fast
          path: result/
          retention-days: 7
