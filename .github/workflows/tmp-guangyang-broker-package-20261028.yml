name: Build Guangyang broker deep-report package

on:
  push:
    branches: [tmp-guangyang-broker-reports-20261028]
    paths: ['.github/workflows/tmp-guangyang-broker-package-20261028.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip
          python3 -m pip install --quiet --disable-pip-version-check requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='光洋股份_002708_券商深度报告_3份'
          mkdir -p "$PACKAGE" /tmp/guangyang_broker_check

          python3 - <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out = Path('光洋股份_002708_券商深度报告_3份')
          reports = [
              {
                  'order': 1,
                  'broker': '民生证券',
                  'date': '2022-07-29',
                  'title': '首次覆盖报告：轴承龙头积极卡位新能源，优质收购进军FPC',
                  'rating': '推荐/买入（以报告正文为准）',
                  'analysts': '邵将、尹会伟等',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202207291576689905_1.pdf',
                  'info_code': 'AP202207291576689905',
                  'filename': '01_民生证券_轴承龙头积极卡位新能源优质收购进军FPC_首次覆盖_2022-07-29.pdf',
                  'expected_pages': 51,
              },
              {
                  'order': 2,
                  'broker': '天风证券',
                  'date': '2022-12-02',
                  'title': '专精特新系列之自主轴承龙头，步入业绩反转窗口期！',
                  'rating': '买入',
                  'analysts': '于特、庞博等',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202212041580799552_1.pdf',
                  'info_code': 'AP202212041580799552',
                  'filename': '02_天风证券_专精特新系列之自主轴承龙头步入业绩反转窗口期_首次覆盖_2022-12-02.pdf',
                  'min_pages': 15,
              },
              {
                  'order': 3,
                  'broker': '东吴证券',
                  'date': '2025-10-13',
                  'title': 'FPC&低空经济&人形机器人“三擎驱动”，轴承龙头焕发新生',
                  'rating': '买入',
                  'analysts': '黄细里、郭雨蒙',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP202510131761220015_1.pdf',
                  'info_code': 'AP202510131761220015',
                  'filename': '03_东吴证券_FPC低空经济人形机器人三擎驱动轴承龙头焕发新生_深度报告_2025-10-13.pdf',
                  'expected_pages': 29,
              },
          ]

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Referer': 'https://data.eastmoney.com/report/stock.jshtml?stockcode=002708',
          })

          for item in reports:
              last = None
              for attempt in range(8):
                  try:
                      r = s.get(item['url'], timeout=(30, 360), allow_redirects=True)
                      r.raise_for_status()
                      if not r.content.startswith(b'%PDF-'):
                          raise RuntimeError(f'not PDF: {r.headers.get("content-type")} {r.content[:40]!r}')
                      if len(r.content) < 100_000:
                          raise RuntimeError(f'PDF too small: {len(r.content)}')
                      path = out / item['filename']
                      path.write_bytes(r.content)
                      pages = len(PdfReader(str(path), strict=False).pages)
                      if 'expected_pages' in item and pages != item['expected_pages']:
                          raise RuntimeError(f'expected {item["expected_pages"]} pages, got {pages}')
                      if pages < item.get('min_pages', 10):
                          raise RuntimeError(f'only {pages} pages')
                      item['pages'] = pages
                      item['bytes'] = len(r.content)
                      item['final_url'] = r.url
                      print('SAVED', item['filename'], pages, len(r.content), r.url)
                      break
                  except Exception as exc:
                      last = exc
                      time.sleep(2 + attempt)
              else:
                  raise RuntimeError(f'Failed {item["title"]}: {last!r}')

          (out / '_metadata.json').write_text(json.dumps(reports, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3

          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 100000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
              cat "$pdf.qpdf.txt" >&2
              exit "$rc"
            fi
            rm -f "$pdf.qpdf.txt"

            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 10

            pdftotext -f 1 -l "$pages" "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '常州光洋轴承股份有限公司|光洋股份' "$pdf.txt"
            case "$(basename "$pdf")" in
              01_*) grep -Eq '民生证券|MINSHENG' "$pdf.txt" ;;
              02_*) grep -Eq '天风证券|TF SECURITIES' "$pdf.txt" ;;
              03_*) grep -Eq '东吴证券|Soochow Securities|SOOCHOW' "$pdf.txt" ;;
            esac
            rm -f "$pdf.txt"

            stem="/tmp/guangyang_broker_check/$(basename "$pdf")"
            pdftoppm -f 1 -l 1 -singlefile -png -r 90 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 90 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          folder = Path('光洋股份_002708_券商深度报告_3份')
          rows = json.loads((folder / '_metadata.json').read_text(encoding='utf-8'))
          rows.sort(key=lambda x: x['order'])
          lines = [
              '光洋股份（002708）券商深度报告资料包',
              '整理日期：2026-10-28',
              '',
              '收录说明：',
              '1. 本包收录3份可公开直接下载的券商原始完整PDF，未使用网页摘要或重新排版版本替代。',
              '2. 优先选择首次覆盖或篇幅较长的公司深度报告，覆盖轴承主业、新能源汽车、FPC、低空经济与人形机器人等主题。',
              '3. 2026年浙商证券29页首次覆盖报告的公开下载入口要求登录或加密权限，因此未绕过访问控制，改选三份可公开直接取得的原始PDF。',
              '4. 资料仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums=[]; total_pages=0; total_bytes=0
          for row in rows:
              path = folder / row['filename']
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              total_pages += int(row['pages'])
              total_bytes += len(data)
              lines += [
                  f'- {path.name}',
                  f"  券商：{row['broker']}；日期：{row['date']}；页数：{row['pages']}；评级：{row['rating']}",
                  f"  标题：{row['title']}",
                  f"  分析师：{row['analysts']}",
                  f"  公开索引编号：{row['info_code']}",
                  f"  PDF来源：{row['final_url']}",
                  f"  SHA-256：{sha}",
              ]
              sums.append(f'{sha}  {path.name}')
          lines += [
              '',
              f'合计页数：{total_pages}页。',
              f'PDF原件合计大小：{total_bytes}字节。',
              '全部PDF均已通过文件头、文件大小、PDF结构、实际页数、公司名称、券商名称及首末页渲染检查。',
          ]
          (folder / '00_文件清单与说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (folder / '_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Guangyang-002708-broker-deep-reports-3
          path: 光洋股份_002708_券商深度报告_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
