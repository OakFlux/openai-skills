name: Inspect public 1c9u Ledong report links

on:
  push:
    branches:
      - chatgpt-temp-ledong-robotics-reports-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect page and public document routes
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT=Path('out'); OUT.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          urls=[
            'https://www.1c9u.com/zhishiku/%E4%BA%BA%E5%BD%A2%E6%9C%BA%E5%99%A8%E4%BA%BA%E7%9F%A5%E8%AF%86%E5%BA%93',
            'https://1c9u.com/zhishiku/%E4%BA%BA%E5%BD%A2%E6%9C%BA%E5%99%A8%E4%BA%BA%E7%9F%A5%E8%AF%86%E5%BA%93',
            'https://www.1c9u.com/?s=%E4%B9%90%E5%8A%A8%E6%9C%BA%E5%99%A8%E4%BA%BA',
            'https://1c9u.com/?s=%E4%B9%90%E5%8A%A8%E6%9C%BA%E5%99%A8%E4%BA%BA',
          ]
          all_links=[]
          for i,u in enumerate(urls):
              try:
                  r=s.get(u,timeout=60,allow_redirects=True)
                  print('\nPAGE',i,r.status_code,r.url,r.headers.get('content-type'),len(r.content))
                  print(r.text[:2500])
                  (OUT/f'page_{i}.html').write_bytes(r.content)
                  soup=BeautifulSoup(r.text,'html.parser')
                  print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '')
                  text=' '.join(soup.get_text(' ',strip=True).split())
                  print('HAS_LEDONG','乐动机器人' in text,'TEXT_AROUND')
                  pos=text.find('乐动机器人')
                  print(text[max(0,pos-1000):pos+2500] if pos>=0 else text[:1000])
                  for a in soup.find_all('a',href=True):
                      href=urllib.parse.urljoin(r.url,a['href'])
                      label=' '.join(a.get_text(' ',strip=True).split())
                      all_links.append({'page':r.url,'href':href,'label':label})
                      blob=(href+' '+label).lower()
                      if any(k in blob for k in ['乐动机器人','20260806','交银国际','1236.hk','pdf','download','下载','document','doc/','file/']):
                          print('LINK',repr(label[:600]),href)
                  scripts=[urllib.parse.urljoin(r.url,x['src']) for x in soup.find_all('script',src=True)]
                  for j,jsu in enumerate(scripts[:40]):
                      try:
                          rr=s.get(jsu,timeout=60); rr.raise_for_status()
                          (OUT/f'page_{i}_js_{j:02d}.js').write_bytes(rr.content)
                          txt=rr.text
                          if any(k in txt for k in ['乐动机器人','20260806','download','pdf','/api/']):
                              for pat in [r'https?://[^\"\'<>\\\s]+',r'[^\"\'<>\\\s]{0,220}(?:download|pdf|/api/|document|file)[^\"\'<>\\\s]{0,500}']:
                                  for hit in list(dict.fromkeys(re.findall(pat,txt,re.I)))[:300]:
                                      if any(k in hit.lower() for k in ['download','pdf','/api/','document','file']):
                                          print('JSHIT',j,repr(hit[:1200]))
                      except Exception as e: print('JSERR',jsu,repr(e))
              except Exception as e: print('PAGE_ERR',u,repr(e))
          (OUT/'links.json').write_text(json.dumps(all_links,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ledong_1c9u_Inspection
          path: out
          retention-days: 2
          if-no-files-found: error
