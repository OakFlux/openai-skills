name: Package Ascletis Pharma financial reports v2

on:
  push:
    branches:
      - chatgpt-ascletis-financial-reports-20260906
    paths:
      - '.github/workflows/package-ascletis-financial-reports-v2-20260906.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Download, validate and package reports
        run: python scripts/package_ascletis_financial_reports_v2_20260906.py
      - name: Upload report package
        uses: actions/upload-artifact@v4
        with:
          name: ascletis-financial-reports-v2-20260906
          path: |
            Ascletis_Financial_Reports_2020_2025.zip
            歌礼制药_2020-2025年报及最新季报.zip
            PACKAGE_SHA256.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
