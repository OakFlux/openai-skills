name: Build verified Sinopharm broker reports

on:
  push:
    branches:
      - tmp-sinopharm-build2-20260905

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Build package from public report resources
        run: |
          python -m pip install --quiet requests beautifulsoup4 cryptography pillow pypdf
          mkdir -p deliverable
          cat > /tmp/build_reports.py <<'PY'
          import base64
          import hashlib
          import io
          import json
          import math
          import re
          import time
          import zipfile
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
          from cryptography.hazmat.primitives.padding import PKCS7
          from PIL import Image
          from pypdf import PdfReader

          out = Path('deliverable')
          work = out / 'package'
          work.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36', 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8'})

          def fetch(url, referer=None, attempts=6):
              headers = {'Referer': referer} if referer else None
              error = None
              for attempt in range(attempts):
                  try:
                      response = session.get(url, headers=headers, timeout=(20, 90), allow_redirects=True)
                      if response.status_code == 200:
                          return response
                      error = RuntimeError(f'HTTP {response.status_code}')
                  except Exception as exc:
                      error = exc
                  time.sleep(min(2 ** attempt, 12))
              raise RuntimeError(f'failed to fetch {url}: {error}')

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def page_count(path):
              return len(PdfReader(str(path), strict=False).pages)

          def to_rgb(response, label):
              if len(response.content) < 1000:
                  raise RuntimeError(f'{label}: response too small')
              image = Image.open(io.BytesIO(response.content))
              image.load()
              if image.width < 500 or image.height < 700:
                  raise RuntimeError(f'{label}: unexpected dimensions {image.size}')
              rgba = image.convert('RGBA')
              rgb = Image.new('RGB', rgba.size, 'white')
              rgb.paste(rgba, mask=rgba.getchannel('A'))
              image.close()
              rgba.close()
              return rgb

          def images_to_pdf(images, path):
              images[0].save(path, 'PDF', save_all=True, append_images=images[1:], resolution=150.0, quality=95, subsampling=0)
              for image in images:
                  image.close()
              if page_count(path) != len(images):
                  raise RuntimeError(f'page count mismatch for {path}')

          manifest = []

          hangyan_page = 'https://www.hangyan.co/reports/3097844454174754770'
          html = fetch(hangyan_page).text
          node = BeautifulSoup(html, 'html.parser').select_one('[data-controller~="native-pdf"]')
          if node is None:
              raise RuntimeError('native-pdf element not found')
          token = node.get('data-native-pdf-cache-key-value')
          original_name = node.get('data-native-pdf-filename-value') or ''
          if not token:
              raise RuntimeError('public PDF token not found')

          def decrypt_url(value):
              encoded = value.replace('-', '+').replace('_', '/')
              encoded += '=' * ((4 - len(encoded) % 4) % 4)
              payload = base64.b64decode(encoded)
              iv = payload[:16]
              ciphertext = payload[16:]
              now = int(time.time())
              for offset in range(-8, 9):
                  bucket = math.floor((now + offset * 120) / 120)
                  key = ('cv_' + str(bucket) + 'zIDfwokaoIUFlw')[:32].ljust(32, '0').encode()
                  try:
                      decryptor = Cipher(algorithms.AES(key), modes.CBC(iv)).decryptor()
                      padded = decryptor.update(ciphertext) + decryptor.finalize()
                      unpadder = PKCS7(128).unpadder()
                      plain = unpadder.update(padded) + unpadder.finalize()
                      url = plain.decode('utf-8')
                      if url.startswith('http://') or url.startswith('https://'):
                          return url
                  except Exception:
                      pass
              raise RuntimeError('could not decrypt public PDF URL')

          original_pdf = fetch(decrypt_url(token), referer=hangyan_page, attempts=4).content
          if not original_pdf.lstrip().startswith(b'%PDF') or len(original_pdf) < 50000:
              raise RuntimeError('Hangyan file is not a valid PDF')
          full_name = '2023-05-07_兴证国际证券_创新转型逐步加速，龙头地位不断巩固_完整版.pdf'
          full_path = work / full_name
          full_path.write_bytes(original_pdf)
          reader = PdfReader(str(full_path), strict=False)
          full_pages = len(reader.pages)
          text = re.sub(r'\s+', '', ' '.join((p.extract_text() or '') for p in reader.pages[:5])).lower()
          if full_pages < 2 or not any(key in text for key in ('国药控股', '01099', '1099.hk', 'sinopharm')):
              raise RuntimeError('Hangyan PDF identity validation failed')
          manifest.append({'company': '国药控股股份有限公司', 'stock_code': '01099.HK', 'broker': '兴证国际证券', 'report_date': '2023-05-07', 'title': '创新转型逐步加速，龙头地位不断巩固', 'file': full_name, 'original_filename': original_name, 'pages': full_pages, 'size_bytes': len(original_pdf), 'sha256': digest(original_pdf), 'source_page': hangyan_page, 'access_type': '公开页面下载按钮返回的原始完整PDF'})

          cinda_page = 'https://www.sdyanbao.com/detail/938808'
          cinda_base = 'https://oss.sdyanbao.com/page/2025/12/18/1277012'
          cinda_images = [to_rgb(fetch(f'{cinda_base}/{index}.png', referer=cinda_page), f'Cinda page {index + 1}') for index in range(10)]
          cinda_name = '2025-12-05_信达证券_医药流通龙头行稳致远，高股息与经营质量优化或助力估值提升_公开预览10页.pdf'
          cinda_path = work / cinda_name
          images_to_pdf(cinda_images, cinda_path)
          cinda_data = cinda_path.read_bytes()
          manifest.append({'company': '国药控股股份有限公司', 'stock_code': '01099.HK', 'broker': '信达证券', 'report_date': '2025-12-05', 'title': '医药流通龙头行稳致远，“高股息&经营质量优化”或助力估值提升', 'file': cinda_name, 'reported_full_length_pages': 27, 'pages_included': 10, 'size_bytes': len(cinda_data), 'sha256': digest(cinda_data), 'source_page': cinda_page, 'access_type': '来源页面明确公开的前10页预览；未收录需下载权限的其余页面'})

          first_page = 'https://www.fxbaogao.com/detail/5080292'
          first_base = 'https://public.fxbaogao.com/report-image/2025/09/29/5080292'
          first_images = [to_rgb(fetch(f'{first_base}-{index}.png?x-oss-process=image/format,webp', referer=first_page), f'First Shanghai page {index}') for index in (1, 2)]
          first_name = '2025-09-26_第一上海证券_毛利率仍在下降，效率提升导致净利润率下降趋缓_公开预览2页.pdf'
          first_path = work / first_name
          images_to_pdf(first_images, first_path)
          first_data = first_path.read_bytes()
          manifest.append({'company': '国药控股股份有限公司', 'stock_code': '01099.HK', 'broker': '第一上海证券', 'report_date': '2025-09-26', 'source_page_date': '2025-09-29', 'title': '毛利率仍在下降，效率提升导致净利润率下降趋缓', 'file': first_name, 'pages_included': 2, 'size_bytes': len(first_data), 'sha256': digest(first_data), 'source_page': first_page, 'access_type': '来源页面公开的2页预览；未绕过登录或下载权限'})

          manifest_path = work / 'manifest.json'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          readme_lines = [
              '国药控股（01099.HK）券商研究报告资料包',
              '',
              '本资料包共收录3份：',
              '1. 兴证国际证券，2023-05-07，《创新转型逐步加速，龙头地位不断巩固》：公开页面下载按钮返回的原始完整PDF。',
              '2. 信达证券，2025-12-05，《医药流通龙头行稳致远，“高股息&经营质量优化”或助力估值提升》：报告全篇标注为27页，来源页面明确只公开前10页预览，本包收录该10页预览。',
              '3. 第一上海证券，2025-09-26，《毛利率仍在下降，效率提升导致净利润率下降趋缓》：来源页面公开的2页预览。',
              '',
              '所有文件均取自无需登录即可访问的公开页面或公开预览资源。对于未公开完整PDF的报告，文件名和清单均已明确标注“公开预览”，未绕过登录、付费或其他访问限制。',
              '',
              'manifest.json 包含每个文件的页数、文件大小、SHA-256及来源页面。',
          ]
          (work / 'README_来源说明.txt').write_text('\n'.join(readme_lines) + '\n', encoding='utf-8')
          checksums = [f"{item['sha256']}  {item['file']}" for item in manifest]
          checksums.append(f"{digest(manifest_path.read_bytes())}  manifest.json")
          (work / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n', encoding='utf-8')

          zip_path = out / 'guoyao_konggu_broker_reports.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(work.iterdir(), key=lambda item: item.name):
                  archive.write(path, path.name)
          with zipfile.ZipFile(zip_path, 'r') as archive:
              if archive.testzip() is not None:
                  raise RuntimeError('ZIP integrity test failed')
          print('PACKAGE', zip_path.stat().st_size, digest(zip_path.read_bytes()))
          for item in manifest:
              print('REPORT', item['broker'], item['report_date'], item.get('pages', item.get('pages_included')), item['sha256'], item['file'])
          PY
          python /tmp/build_reports.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sinopharm-broker-reports
          path: deliverable/guoyao_konggu_broker_reports.zip
          retention-days: 1
          compression-level: 0
