name: Dump Sun Art Retail 06808 official links fast 20260922

on:
  push:
    paths:
      - '.github/workflows/sunartretail-06808-linkdump-fast-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch and dump links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin, urlparse, parse_qs, unquote
          import requests
          from bs4 import BeautifulSoup

          s = requests.Session(); s.trust_env = False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          urls = [
            'https://www.sunartretail.com/en/ir/reports.php',
            'https://www.sunartretail.com/en/ir/prospectus.php',
            'https://www.irasia.com/listco/hk/sunartretail/annual/index.htm',
            'https://www.irasia.com/listco/hk/sunartretail/interim/index.htm',
            'https://www.irasia.com/listco/hk/sunartretail/listingdoc/index.htm',
          ]
          result=[]
          for url in urls:
            try:
              r=s.get(url,timeout=(10,20),allow_redirects=True)
              soup=BeautifulSoup(r.content,'lxml')
              links=[]
              for a in soup.find_all('a'):
                attrs={k:v for k,v in a.attrs.items()}
                href=a.get('href')
                links.append({
                  'text':' '.join(a.get_text(' ',strip=True).split()),
                  'href':urljoin(r.url,href) if href else None,
                  'raw_href':href,
                  'attrs':attrs,
                  'parent':' '.join((a.parent.get_text(' ',strip=True) if a.parent else '').split())[:1000],
                })
              special=[]
              for tag in soup.find_all(True):
                attrs={k:v for k,v in tag.attrs.items() if k.startswith('data') or k in ('onclick','href','src','value')}
                if attrs and any(x in json.dumps(attrs,ensure_ascii=False).lower() for x in ['pdf','annual','interim','prospect','irasia','irwebcast','ar20','ir20']):
                  special.append({'tag':tag.name,'attrs':attrs,'text':' '.join(tag.get_text(' ',strip=True).split())[:500]})
              result.append({'url':url,'status':r.status_code,'final':r.url,'content_type':r.headers.get('content-type'),'len':len(r.content),'links':links,'special':special,'html':r.text})
            except Exception as e:
              result.append({'url':url,'error':repr(e)})
          Path('sunartretail_linkdump.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          for page in result:
            print('\nPAGE',page.get('url'),page.get('status'),page.get('error'))
            for link in page.get('links',[]):
              blob=json.dumps(link,ensure_ascii=False)
              if any(x in blob.lower() for x in ['annual report','interim report','global offering','supplemental prospectus','irwebcast','doc.irasia','ar202','ir202']):
                print(blob)
          PY
      - name: Upload link dump
        uses: actions/upload-artifact@v4
        with:
          name: sunartretail-06808-linkdump-fast
          path: sunartretail_linkdump.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
