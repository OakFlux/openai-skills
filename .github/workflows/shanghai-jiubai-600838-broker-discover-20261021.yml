name: Discover Shanghai Jiubai 600838 broker reports

on:
  push:
    paths:
      - '.github/workflows/shanghai-jiubai-600838-broker-discover-20261021.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests
      - name: Query company and targeted industry report metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time,requests
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          def fetch(params,max_pages=80):
            rows=[];seen=set();total=1
            for page in range(1,max_pages+1):
              if page>total:break
              p=dict(params);p.update(pageNo=str(page),p=str(page),pageNum=str(page),pageNumber=str(page))
              payload=None
              for attempt in range(5):
                try:
                  r=s.get(api,params=p,timeout=(20,120))
                  print('HTTP',r.status_code,len(r.content),r.url)
                  if r.status_code==200:payload=r.json();break
                except Exception as e:print('ERR',repr(e))
                time.sleep(1+attempt)
              if payload is None:break
              total=min(int(payload.get('TotalPage') or 1),max_pages)
              data=payload.get('data') or []
              if isinstance(data,dict):data=data.get('list') or data.get('data') or []
              if not data:break
              for row in data:
                info=str(row.get('infoCode') or '')
                key=info or json.dumps(row,ensure_ascii=False,sort_keys=True)
                if key not in seen:seen.add(key);rows.append(row)
              if page>=total or len(data)<int(p.get('pageSize','100')):break
            return rows
          base={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2000-01-01','endTime':'2026-10-21','fields':'','orgCode':'','author':'','rcode':''}
          allout={}
          for qtype in ['0','1','2']:
            p=dict(base);p.update(qType=qtype,code='600838')
            rows=fetch(p)
            allout['code_'+qtype]=[{k:r.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']} for r in rows]
            print('COMPANY_QTYPE',qtype,'COUNT',len(rows),json.dumps(allout['code_'+qtype],ensure_ascii=False,indent=2))
          # Search focused time windows across all reports for exact company-name/title/metadata hits.
          windows=[('2000-01-01','2009-12-31'),('2010-01-01','2017-12-31'),('2018-01-01','2022-12-31'),('2023-01-01','2026-10-21')]
          hits=[];seen=set()
          for begin,end in windows:
            for qtype in ['0','1','2']:
              p=dict(base);p.update(qType=qtype,code='',beginTime=begin,endTime=end,pageSize='100')
              rows=fetch(p,120)
              for r in rows:
                blob=json.dumps(r,ensure_ascii=False)
                title=str(r.get('title') or '')
                if str(r.get('stockCode') or '')=='600838' or str(r.get('stockName') or '')=='上海九百' or '上海九百' in title or '600838' in blob:
                  info=str(r.get('infoCode') or '')
                  if info in seen:continue
                  seen.add(info)
                  hits.append({k:r.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']})
          print('GLOBAL_EXACT_HITS',json.dumps(hits,ensure_ascii=False,indent=2))
          PY
