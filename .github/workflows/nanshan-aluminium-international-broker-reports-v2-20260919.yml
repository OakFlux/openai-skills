        uses: actions/upload-artifact@v4
        with:
          name: nanshan-aluminium-international-broker-reports-final-v2
          path: 南山铝业国际_02610_券商深度报告_公开资料版_3份.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
