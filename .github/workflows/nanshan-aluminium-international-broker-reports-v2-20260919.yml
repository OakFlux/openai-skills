name: Build robust Nanshan Aluminium International broker research package 20260919

on:
  push:
    paths:
      - '.github/workflows/nanshan-aluminium-international-broker-reports-v2-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: huachuang
            order: '01'
            broker: 华创证券
            report_title: 南山铝业国际（02610.HK）深度研究报告：东南亚氧化铝龙头，电解铝筑第二成长曲线
            report_date: '2026-06-25'
            original_pages: '25'
            analysts: 刘岗、李梦娇
            rating: 推荐（首次覆盖）
            source_name: 周知报告公开研报解读页
            source_url: https://www.360why.com/enterprise/260706000010654.html
            index_url: https://www.nxny.com/report/view_6350912.html
            filename: 01_华创证券_南山铝业国际_东南亚氧化铝龙头_电解铝筑第二成长曲线_公开资料版_2026-06-25.pdf
          - key: shenwan
            order: '02'
            broker: 申万宏源
            report_title: 南山铝业国际（02610.HK）：东南亚领先氧化铝制造商，电解铝项目打开成长空间
            report_date: '2026-06-29'
            original_pages: '23'
            analysts: 公开页面未完整列示
            rating: 增持（首次覆盖）
            source_name: 周知报告公开研报解读页
            source_url: https://www.360why.com/enterprise/260702000010607.html
            index_url: https://max.book118.com/html/2026/0630/7056101064011126.shtm
            filename: 02_申万宏源_南山铝业国际_东南亚领先氧化铝制造商_电解铝项目打开成长空间_公开资料版_2026-06-29.pdf
          - key: huatai
            order: '03'
            broker: 华泰证券
            report_title: 南山铝业国际（02610.HK）：兼具稳定现金流与高成长性
            report_date: '2026-02-10'
            original_pages: '22'
            analysts: 公开页面未完整列示
            rating: 买入（首次覆盖）
            source_name: 远瞻慧库公开研报解读页
            source_url: https://www.baogaobox.com/insights/260211000025523.html
            index_url: https://hk.stockstar.com/IG2026021100010860.shtml
            filename: 03_华泰证券_南山铝业国际_兼具稳定现金流与高成长性_公开资料版_2026-02-10.pdf
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KEY: ${{ matrix.key }}
      ORDER: ${{ matrix.order }}
      BROKER: ${{ matrix.broker }}
      REPORT_TITLE: ${{ matrix.report_title }}
      REPORT_DATE: ${{ matrix.report_date }}
      ORIGINAL_PAGES: ${{ matrix.original_pages }}
      ANALYSTS: ${{ matrix.analysts }}
      RATING: ${{ matrix.rating }}
      SOURCE_NAME: ${{ matrix.source_name }}
      SOURCE_URL: ${{ matrix.source_url }}
      INDEX_URL: ${{ matrix.index_url }}
      FILENAME: ${{ matrix.filename }}
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils fonts-noto-cjk libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info
          python -m pip install --quiet requests beautifulsoup4 lxml weasyprint pypdf

      - name: Fetch one public source and render PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import html as htmlmod
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader
          from weasyprint import HTML

          env = os.environ
          key = env['KEY']
          broker = env['BROKER']
          title = env['REPORT_TITLE']
          date = env['REPORT_DATE']
          source_url = env['SOURCE_URL']
          index_url = env['INDEX_URL']
          filename = env['FILENAME']
          dest = Path('output') / filename

          FALLBACKS = {
            'huachuang': '''
              <h2>公开内容要点</h2>
              <p>华创证券将南山铝业国际定位为东南亚氧化铝龙头，并把公司从氧化铝向电解铝延伸视为第二成长曲线。公开资料显示，公司在印度尼西亚宾坦岛形成氧化铝生产、港口、电力和物流配套，400万吨设计产能已于2025年末基本建成并进入释放阶段。</p>
              <p>报告的核心判断包括：本地铝土矿采购、自备电厂和自有港口共同构成成本优势；长协客户与东南亚区位有助于稳定销售；氧化铝价格周期回落时，低成本产能具有更强的盈利韧性。报告公开解读提到，公司2025年单吨氧化铝销售成本约251美元，处于行业较低水平。</p>
              <p>成长端主要来自印尼25万吨电解铝一期项目。公开资料显示，该项目预计建设期约两年，并有进一步扩产规划。氧化铝自产、能源和港口配套可形成产业链协同。报告同时提示氧化铝价格、新项目建设进度、印尼政策和汇率等风险。</p>
              <h2>公开预测摘要</h2>
              <p>公开研报解读页面列示的预测为：2026—2028年归母净利润分别约1.94亿、2.18亿和4.13亿美元；目标价47.01港元。上述数字仅用于识别原报告观点，最终应以券商原始报告为准。</p>
            ''',
            'shenwan': '''
              <h2>公开内容要点</h2>
              <p>申万宏源首次覆盖报告把南山铝业国际概括为东南亚领先的冶金级氧化铝制造商。公司氧化铝产能集中于印尼宾坦产业园，2025年末设计产能达到400万吨。报告关注产能爬坡、低成本原料与能源、港口物流以及东南亚客户结构。</p>
              <p>公开解读显示，公司通过本地铝土矿、160MW自备火电机组和深水码头构建成本护城河；新增产能释放将推动销量提升，但氧化铝价格仍是短期盈利的重要变量。报告认为25万吨电解铝项目是公司由单一氧化铝生产商向一体化铝业集团转型的关键步骤。</p>
              <p>在估值与投资逻辑方面，报告强调“氧化铝基本盘+电解铝增量”的组合。主要不确定性包括商品价格波动、项目投产节奏、矿石与能源成本、东道国政策及海外经营风险。</p>
              <h2>公开预测摘要</h2>
              <p>公开页面列示的2026—2028年营业收入预测约为13.30亿、14.76亿和20.77亿美元，归母净利润预测约为3.12亿、4.00亿和5.38亿美元；首次覆盖给予“增持”评级。最终数据应以券商原始报告为准。</p>
            ''',
            'huatai': '''
              <h2>公开内容要点</h2>
              <p>华泰证券首次覆盖报告认为，南山铝业国际兼具氧化铝业务的现金流基础与电解铝项目的成长性。公司在印尼拥有400万吨氧化铝年产能，依托当地铝土矿、能源和港口条件形成成本优势。</p>
              <p>公开研报摘要指出，2024年公司铝土矿采购均价约35美元/吨，单吨氧化铝毛利约239美元。电解铝方面，公司计划建设25万吨年产能项目，预计2028年投产，并保留远期扩产空间。华泰测算在特定铝价假设下，项目可形成较明显的利润增量。</p>
              <p>行业判断侧重全球电解铝供给约束和氧化铝成本支撑。风险包括氧化铝和电解铝价格低于预期、新建产能进度不及预期、印尼政策变化以及能源和原料成本波动。</p>
              <h2>公开评级摘要</h2>
              <p>公开报道显示，华泰证券首次覆盖给予“买入”评级，初始目标价78.18港元。该目标价和预测基于报告发布时的假设，不代表当前估值或投资建议。</p>
            ''',
          }

          def clean_source(raw: bytes) -> tuple[str, str, bool]:
              # These sites serve UTF-8 bytes but may omit or misstate charset.
              text = raw.decode('utf-8', errors='replace')
              soup = BeautifulSoup(text, 'lxml')
              page_title = soup.title.get_text(' ', strip=True) if soup.title else ''
              body_text = soup.get_text('\n', strip=True)
              if '安全验证' in page_title or '我不是机器人' in body_text or len(body_text) < 1600 or '南山铝业国际' not in body_text:
                  return '', page_title, False

              for tag in soup(['script','style','noscript','iframe','video','audio','canvas','form','button','input','textarea','select','nav','header','footer','aside','svg']):
                  tag.decompose()
              selectors = [
                  'article','main','.article-content','.article_detail','.article-detail',
                  '.detail-content','.detail_content','.content-detail','.content_detail',
                  '.news-content','.insight-content','.post-content','.entry-content',
                  '.article','.detail','.content'
              ]
              candidates=[]
              for sel in selectors:
                  candidates.extend(soup.select(sel))
              h1=soup.find('h1')
              if h1:
                  p=h1
                  while p and p.name not in ('body','html'):
                      if len(p.get_text(' ',strip=True))>2200:
                          candidates.append(p)
                      p=p.parent
              candidates.append(soup.body or soup)
              viable=[]
              for el in candidates:
                  txt=el.get_text(' ',strip=True)
                  if '南山铝业国际' in txt and len(txt)>1800:
                      links=len(el.find_all('a'))
                      paras=len(el.find_all('p'))
                      headings=len(el.find_all(['h1','h2','h3','h4']))
                      score=len(txt)+paras*80+headings*160-links*6
                      viable.append((score,el))
              if not viable:
                  return '',page_title,False
              chosen=max(viable,key=lambda x:x[0])[1]
              clone=BeautifulSoup(str(chosen),'lxml')
              root=clone.body or clone
              for tag in root.find_all(['script','style','noscript','iframe','video','audio','canvas','form','button','input','textarea','select','nav','header','footer','aside','svg']):
                  tag.decompose()
              for tag in root.find_all(['img','picture','source']):
                  tag.decompose()
              for a in root.find_all('a'):
                  a.unwrap()
              for tag in root.find_all(True):
                  attrs=dict(tag.attrs)
                  tag.attrs={}
                  if tag.name in ('p','h1','h2','h3','h4','h5','ul','ol','li','table','thead','tbody','tr','th','td','blockquote','strong','b','em','i','div','section','span','br','hr'):
                      continue
                  tag.unwrap()
              content=str(root)
              # Remove obvious site-tail blocks when headings are encountered.
              content=re.split(r'(?:相关报告|相关文章|热门报告|热门洞察|版权说明|版权声明|问题反馈)',content,maxsplit=1)[0]
              visible=BeautifulSoup(content,'lxml').get_text(' ',strip=True)
              return content,page_title,(len(visible)>1800 and '南山铝业国际' in visible)

          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
              'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Cache-Control':'no-cache',
              'Pragma':'no-cache',
          })
          fetched=False; page_title=''; source_html=''; fetch_status='not_attempted'; error=''
          try:
              r=s.get(source_url,timeout=(25,120),allow_redirects=True)
              fetch_status=f'{r.status_code} {r.url}'
              source_html,page_title,fetched=clean_source(r.content)
          except Exception as exc:
              error=repr(exc)
          if not fetched:
              source_html=FALLBACKS[key]

          cover=f'''
            <section class="cover">
              <div class="kicker">券商深度报告公开资料整理版</div>
              <h1>{htmlmod.escape(title)}</h1>
              <div class="meta">
                <p><b>研究机构：</b>{htmlmod.escape(broker)}</p>
                <p><b>报告日期：</b>{htmlmod.escape(date)}</p>
                <p><b>原报告标示页数：</b>{htmlmod.escape(env['ORIGINAL_PAGES'])}页</p>
                <p><b>研究员：</b>{htmlmod.escape(env['ANALYSTS'])}</p>
                <p><b>评级：</b>{htmlmod.escape(env['RATING'])}</p>
              </div>
              <div class="notice"><b>版本说明：</b>本文件整理自公开可访问的研报解读、预览或新闻摘要，用于资料检索。它不是券商原始PDF，也未绕过登录、会员、付费或下载权限。页面内容与数据应以券商原始报告为准。</div>
              <div class="source"><b>公开内容来源：</b>{htmlmod.escape(env['SOURCE_NAME'])}<br>{htmlmod.escape(source_url)}<br><br><b>原报告索引或交叉核验页：</b><br>{htmlmod.escape(index_url)}</div>
            </section>
          '''
          mode='公开来源正文排版' if fetched else '公开信息摘要整理'
          body=f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
            @page {{ size:A4; margin:16mm 15mm 18mm; @bottom-center {{ content: counter(page) " / " counter(pages); font-size:8pt; color:#666; }} }}
            * {{ box-sizing:border-box; }}
            body {{ font-family:"Noto Sans CJK SC","Noto Serif CJK SC",sans-serif; color:#111; font-size:10.5pt; line-height:1.72; margin:0; }}
            .cover {{ min-height:250mm; padding:22mm 8mm 8mm; page-break-after:always; display:flex; flex-direction:column; }}
            .kicker {{ font-size:11pt; letter-spacing:.08em; margin-bottom:18mm; }}
            .cover h1 {{ font-size:23pt; line-height:1.36; margin:0 0 16mm; }}
            .meta {{ border-top:1px solid #777; border-bottom:1px solid #777; padding:5mm 0; margin-bottom:10mm; }}
            .meta p {{ margin:2mm 0; }}
            .notice {{ border:1px solid #aaa; padding:5mm; font-size:9.5pt; margin-bottom:10mm; }}
            .source {{ margin-top:auto; font-size:8.3pt; overflow-wrap:anywhere; }}
            .mode {{ font-size:9pt; color:#555; margin:0 0 7mm; padding-bottom:3mm; border-bottom:1px solid #bbb; }}
            article {{ width:100%; }}
            h1 {{ font-size:19pt; line-height:1.4; margin:0 0 7mm; }}
            h2 {{ font-size:15pt; margin:8mm 0 4mm; page-break-after:avoid; }}
            h3 {{ font-size:12.5pt; margin:6mm 0 3mm; page-break-after:avoid; }}
            h4 {{ font-size:11.5pt; margin:5mm 0 2mm; page-break-after:avoid; }}
            p {{ margin:0 0 3.5mm; text-align:justify; orphans:3; widows:3; }}
            ul,ol {{ padding-left:7mm; }} li {{ margin-bottom:2mm; }}
            table {{ width:100%; border-collapse:collapse; margin:5mm 0; font-size:8.8pt; page-break-inside:avoid; }}
            th,td {{ border:1px solid #999; padding:2mm; vertical-align:top; }}
            blockquote {{ margin:4mm 0; padding-left:4mm; border-left:2px solid #888; }}
          </style></head><body>{cover}<article><div class="mode">内容形态：{mode}</div>{source_html}</article></body></html>'''

          HTML(string=body,base_url=source_url).write_pdf(str(dest))
          reader=PdfReader(str(dest),strict=False)
          pages=len(reader.pages)
          if pages<3:
              raise RuntimeError(f'generated PDF too short: {pages}')
          sample=''
          for p in reader.pages[:min(8,pages)]:
              try: sample+='\n'+(p.extract_text() or '')
              except Exception: pass
          if '南山铝业国际' not in sample or broker not in sample:
              raise RuntimeError('identity validation failed')
          ck=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
          if ck.returncode not in (0,3):
              raise RuntimeError('qpdf validation failed: '+ck.stderr[-1000:])
          preview=Path('output')/(dest.stem+'_首页预览.png')
          subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','110',str(dest),str(preview.with_suffix(''))],check=True)
          data=dest.read_bytes(); digest=hashlib.sha256(data).hexdigest()
          rec={
              'key':key,'filename':filename,'broker':broker,'title':title,'report_date':date,
              'original_report_pages':int(env['ORIGINAL_PAGES']),'compiled_pdf_pages':pages,
              'source_name':env['SOURCE_NAME'],'source_url':source_url,'index_url':index_url,
              'fetch_status':fetch_status,'source_page_title':page_title,'source_fetched':fetched,
              'content_mode':mode,'fetch_error':error,'bytes':len(data),'sha256':digest,
              'format_note':'公开研报解读/预览或摘要整理版，非券商原始PDF',
          }
          Path('output')/(key+'.json')
          (Path('output')/(key+'.json')).write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(rec,ensure_ascii=False,indent=2))
          PY

      - name: Upload rendered report
        uses: actions/upload-artifact@v4
        with:
          name: nanshan-report-${{ matrix.key }}
          path: output
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  package:
    needs: render
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download rendered report artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nanshan-report-*
          path: gathered
          merge-multiple: true

      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, zipfile
          from datetime import date
          from pathlib import Path
          from pypdf import PdfReader

          src=Path('gathered')
          PACKAGE='南山铝业国际_02610_券商深度报告_公开资料版_3份'
          out=Path(PACKAGE); out.mkdir(exist_ok=True)
          records=[]
          for j in sorted(src.glob('*.json')):
              records.append(json.loads(j.read_text(encoding='utf-8')))
          records.sort(key=lambda r:r['filename'])
          if len(records)!=3:
              raise RuntimeError(f'expected 3 report records, got {len(records)}')
          for rec in records:
              pdf=src/rec['filename']
              if not pdf.exists(): raise RuntimeError('missing '+rec['filename'])
              if len(PdfReader(str(pdf),strict=False).pages)!=rec['compiled_pdf_pages']:
                  raise RuntimeError('page mismatch '+rec['filename'])
              (out/pdf.name).write_bytes(pdf.read_bytes())
              png=src/(pdf.stem+'_首页预览.png')
              if png.exists(): (out/png.name).write_bytes(png.read_bytes())

          readme=[
            '南山铝业国际控股有限公司（02610.HK）券商深度报告公开资料包',
            f'整理日期：{date.today().isoformat()}', '',
            '收录3份与南山铝业国际直接相关的券商深度研究资料：华创证券、申万宏源、华泰证券。',
            '重要说明：原始券商PDF所在平台设有登录、会员、付费或下载权限。本包没有绕过访问控制；所收PDF由公开可访问的研报解读、预览或新闻摘要整理排版而成，均在封面标明“公开资料整理版”，不能替代券商原始PDF。', '',
            '文件清单：'
          ]
          for i,r in enumerate(records,1):
              readme += [
                f"{i}. {r['broker']}：{r['title']}",
                f"   报告日期：{r['report_date']}；原报告标示页数：{r['original_report_pages']}页；本包PDF：{r['compiled_pdf_pages']}页",
                f"   内容形态：{r['content_mode']}",
                f"   文件：{r['filename']}",
                f"   公开内容来源：{r['source_url']}",
                f"   原报告索引/交叉核验：{r['index_url']}",
                f"   SHA-256：{r['sha256']}", ''
              ]
          readme += ['完整性核验：PDF文件身份、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (out/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(out.iterdir()): z.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip()
              if bad: raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs)!=3: raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          digest=hashlib.sha256(zpath.read_bytes()).hexdigest()
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'PDF_COUNT',len(pdfs),'SHA256',digest)
          print('FINAL_MANIFEST',json.dumps(records,ensure_ascii=False,indent=2))
          PY

