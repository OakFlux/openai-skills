name: Search Eastmoney archive by dates for ST Guangtang 20261004

on:
  push:
    paths:
      - '.github/workflows/st-guangtang-eastmoney-date-discovery-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query Eastmoney report API by exact dates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests, time
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/','Accept':'application/json,*/*'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          dates=['2016-04-25','2016-04-06','2015-05-27','2014-06-10']
          for d in dates:
            print('\n=== DATE',d,'===',flush=True)
            for page in range(1,21):
              params={
                'industryCode':'*','pageSize':'500','industry':'*','rating':'*','ratingchange':'*',
                'beginTime':d,'endTime':d,'pageNo':str(page),'fields':'','qType':'0','orgCode':'',
                'code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page),
                '_':str(int(time.time()*1000)),
              }
              r=s.get(endpoint,params=params,timeout=60)
              print('QUERY',page,r.status_code,len(r.content),r.url,flush=True)
              r.raise_for_status()
              p=r.json(); rows=p.get('data',[]) if isinstance(p,dict) else []
              print('COUNT',len(rows),flush=True)
              for row in rows:
                blob=' '.join(str(row.get(k) or '') for k in ['title','stockName','stockCode'])
                if '南宁糖业' in blob or '000911' in blob:
                  print('MATCH',json.dumps(row,ensure_ascii=False,sort_keys=True),flush=True)
              if len(rows)<500: break
          PY
