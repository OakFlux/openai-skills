name: Build verified Zhongjing 003026 filings package v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zhongjing-003026-filings-package-v2-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '003026'
          SHORT = '中晶科技'
          FULL = '浙江中晶科技股份有限公司'
          PACKAGE = '中晶科技_003026_全部年报_招股说明书_最新季报'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / '原始PDF'
          PREVIEW_DIR = ROOT / '首页预览'
          for d in (ROOT, PDF_DIR, PREVIEW_DIR):
              d.mkdir(parents=True, exist_ok=True)

          docs = [
              {'label':'2020年年度报告','title':'中晶科技：2020年年度报告','url':'https://static.cninfo.com.cn/finalpage/2021-04-28/1209837089.PDF','min_pages':80},
              {'label':'2021年年度报告','title':'中晶科技：2021年年度报告','url':'https://static.cninfo.com.cn/finalpage/2022-04-26/1213105920.PDF','min_pages':80},
              {'label':'2022年年度报告','title':'中晶科技：2022年年度报告','url':'https://static.cninfo.com.cn/finalpage/2023-04-28/1216647983.PDF','min_pages':80},
              {'label':'2023年年度报告','title':'中晶科技：2023年年度报告','url':'https://static.cninfo.com.cn/finalpage/2024-04-29/1219864876.PDF','min_pages':80},
              {'label':'2024年年度报告','title':'中晶科技：2024年年度报告','url':'https://static.cninfo.com.cn/finalpage/2025-04-29/1223369982.PDF','min_pages':80},
              {'label':'2025年年度报告','title':'中晶科技：2025年年度报告','url':'https://static.cninfo.com.cn/finalpage/2026-04-29/1225223312.PDF','min_pages':80},
              {'label':'首次公开发行股票招股说明书','title':'中晶科技：首次公开发行股票招股说明书','url':'https://static.cninfo.com.cn/finalpage/2020-12-08/1208865107.PDF','min_pages':100},
              {'label':'2026年第三季度报告','title':'中晶科技：2026年三季度报告','url':'https://static.cninfo.com.cn/finalpage/2026-10-27/1225622459.PDF','min_pages':5},
          ]

          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0 Safari/537.36',
              'Referer':'https://www.cninfo.com.cn/',
              'Accept':'application/pdf,*/*;q=0.8',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+','',text))[:100]

          manifest = []
          for idx, doc in enumerate(docs, 1):
              attempts = []
              data = None
              for attempt in range(7):
                  try:
                      r = s.get(doc['url'], timeout=(30,360), allow_redirects=True)
                      meta = {'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url}
                      attempts.append(meta)
                      if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 50_000:
                          data = r.content
                          break
                  except Exception as exc:
                      attempts.append({'error':repr(exc)})
                  time.sleep(1 + attempt)
              if data is None:
                  raise RuntimeError(f"Download failed: {doc['title']}: {attempts}")

              filename = f"{idx:02d}_{safe(doc['label'])}.pdf"
              dest = PDF_DIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f"Unexpectedly short PDF: {filename}: {pages} pages")

              text = ''
              for page in reader.pages[:min(10,pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+','',text)
              hits = [x for x in (SHORT,FULL,CODE) if re.sub(r'\s+','',x) in compact]
              if len(compact) > 500 and not hits:
                  raise RuntimeError(f"Issuer mismatch: {filename}")

              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix = PREVIEW_DIR / dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview = Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f"Preview render failed: {filename}")

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  'label':doc['label'],'title':doc['title'],'filename':str(Path('原始PDF')/filename),
                  'source_url':doc['url'],'pages':pages,'bytes':len(data),'sha256':sha,
                  'identity_hits':hits,'preview_file':str(Path('首页预览')/preview.name),
                  'download_attempts':attempts,
                  'validation':['PDF header','issuer identity','page count','qpdf structure','first-page render'],
              })

          readme = [
              '浙江中晶科技股份有限公司（003026.SZ）定期报告与发行文件资料包',
              '整理日期：2026-10-28','',
              '收录：2020—2025年年度报告全文、首次公开发行股票招股说明书全文、截至整理日最新季度报告（2026年第三季度报告）。',''
          ]
          for i,x in enumerate(manifest,1):
              readme += [f"{i}. {x['label']}",f"   页数：{x['pages']}页；文件：{x['filename']}",f"   来源：{x['source_url']}",f"   SHA-256：{x['sha256']}",'']
          readme += ['所有PDF均来自巨潮资讯公开信息披露附件。','已核验PDF文件头、公司名称/证券代码、实际页数、文档结构、首页渲染、ZIP CRC和SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zip_cn = Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_cn) as z:
              bad = z.testzip(); pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != 8:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')
          zip_en = Path('zhongjing_003026_all_annual_reports_prospectus_latest_quarter.zip')
          zip_en.write_bytes(zip_cn.read_bytes())
          print('FINAL_ZIP',zip_cn,zip_cn.stat().st_size,'SHA256',hashlib.sha256(zip_cn.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: zhongjing-003026-filings-package-v2-final
          path: |
            中晶科技_003026_全部年报_招股说明书_最新季报.zip
            zhongjing_003026_all_annual_reports_prospectus_latest_quarter.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
