name: Temporary Inspect Reportify Document API

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-inspect-reportify-document-api.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download viewer/API chunks and extract endpoint logic
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json,re
          from pathlib import Path
          import requests

          urls=[
            'https://files.reportify.cc/fe-static/_next/static/chunks/84282-771ca1e07c2640ad.js',
            'https://files.reportify.cc/fe-static/_next/static/chunks/13910-12650e49b6f66c0b.js',
            'https://files.reportify.cc/fe-static/_next/static/chunks/app/(common)/reports/%5Bid%5D/page-8c5eb4ecb28a4b43.js',
            'https://files.reportify.cc/fe-static/_next/static/chunks/52826-50829d223fefcb64.js',
            'https://files.reportify.cc/fe-static/_next/static/chunks/58982.43e8719c9b8da708.js',
          ]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://reportify.cn/reports/1118968060607336448'})
          out=Path('out');out.mkdir(exist_ok=True)
          findings=[]
          needles=[
            'document_id','documentId','knowledge/documents','/documents','documents/','getDocument',
            'pdfPage','pdf_url','url_pdf','render_type','document_total_page','preview_image',
            'getPdf','pdfFocus','signed','presign','page_url','pageUrl','page_image','image_url',
            '/reports/','resourcePrefix','readable','resource_limit','citation','bbox','getPage',
          ]
          for idx,u in enumerate(urls):
            r=s.get(u,timeout=60);r.raise_for_status();body=r.text
            path=out/f'chunk_{idx}.js';path.write_text(body,encoding='utf-8')
            snippets=[]
            for needle in needles:
              for m in list(re.finditer(re.escape(needle),body,re.I))[:100]:
                snippets.append({'needle':needle,'start':m.start(),'text':body[max(0,m.start()-2500):m.start()+7000]})
            # extract likely string literals containing API paths or storage paths
            strings=sorted(set(re.findall(r'["\']([^"\']{3,300})["\']',body)))
            relevant_strings=[x for x in strings if any(k in x.lower() for k in ['document','report','pdf','page','preview','signed','image','knowledge'])][:3000]
            findings.append({'url':u,'status':r.status_code,'bytes':len(r.content),'snippets':snippets,'relevant_strings':relevant_strings})
            print('CHUNK',u,'bytes',len(r.content),'snippets',len(snippets),flush=True)
          (out/'findings.json').write_text(json.dumps(findings,ensure_ascii=False,indent=2),encoding='utf-8')
          # Print compact endpoint-oriented output.
          for f in findings:
            print('\n###',f['url'])
            for x in f['relevant_strings']:
              if x.startswith('/') or 'api' in x.lower() or 'document' in x.lower() or 'pdf' in x.lower():
                print('STRING',x[:500])
            shown=0
            for h in f['snippets']:
              t=h['text']
              if any(k in t for k in ['/knowledge/documents','document_id','getDocument','url_pdf','pdfPage','page_url','pageUrl']):
                print('SNIP',h['needle'],t[:5000]);shown+=1
                if shown>=30:break
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reportify-document-api-findings
          path: out
          retention-days: 3
