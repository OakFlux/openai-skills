name: Package Kiwi Instruments 688045 broker reports 20261028 v2

on:
  push:
    paths:
      - '.github/workflows/kiwi-688045-broker-deep-package-20261028-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          TODAY='2026-10-28'
          CODE='688045'
          COMPANY='必易微'
          FULL='深圳市必易微电子股份有限公司'
          OUT=Path('final_out')
          RENDER=Path('verification_renders')
          ART=Path('artifact_out')
          for d in (OUT,RENDER,ART):
              d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'order':1,'broker':'民生证券','date':'2023-08-05',
              'title':'深度报告：AC-DC为基，BMS AFE、电机驱动引领未来',
              'info_code':'AP202308051593390262','expected_pages':37,'rating':'买入',
              'filename':'01_2023-08-05_民生证券_深度报告_AC-DC为基_BMS_AFE及电机驱动引领未来.pdf',
              'broker_tokens':['民生证券','民生证券研究院','民生'],
              'theme_tokens':['AC-DC','BMS','AFE','电机驱动','电源管理']
            },
            {
              'order':2,'broker':'华安证券','date':'2023-03-08',
              'title':'景气复苏+DCDC/BMS AFE等新品放量，共同推进公司成长',
              'info_code':'AP202303081584118467','expected_pages':20,'rating':'增持',
              'filename':'02_2023-03-08_华安证券_景气复苏_DCDC及BMS_AFE新品放量.pdf',
              'broker_tokens':['华安证券','华安证券研究所','华安'],
              'theme_tokens':['DCDC','BMS','AFE','电源管理','新品']
            },
            {
              'order':3,'broker':'西南证券','date':'2023-03-30',
              'title':'主业边际向好，新业务接力第二成长曲线',
              'info_code':'AP202303301584689356','expected_pages':11,'rating':'买入',
              'filename':'03_2023-03-30_西南证券_主业边际向好_新业务接力第二成长曲线.pdf',
              'broker_tokens':['西南证券','西南证券研究发展中心','西南'],
              'theme_tokens':['电源管理','AC-DC','BMS','电机驱动','新业务']
            },
          ]

          candidate_metadata=[
            {'publish_date':'2023-08-05','pages':37,'broker':'民生证券','title':'深度报告：AC-DC为基，BMS AFE、电机驱动引领未来','info_code':'AP202308051593390262','rating':'买入','selected':True},
            {'publish_date':'2023-03-08','pages':20,'broker':'华安证券','title':'景气复苏+DCDC/BMS AFE等新品放量，共同推进公司成长','info_code':'AP202303081584118467','rating':'增持','selected':True},
            {'publish_date':'2023-03-30','pages':11,'broker':'西南证券','title':'主业边际向好，新业务接力第二成长曲线','info_code':'AP202303301584689356','rating':'买入','selected':True},
          ]

          session=requests.Session(); session.trust_env=False
          session.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':f'https://data.eastmoney.com/report/{CODE}.html',
            'Accept':'application/pdf,*/*;q=0.8',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def download_pdf(info_code:str):
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf'
            ]
            last={}
            report_page=f'https://data.eastmoney.com/report/info/{info_code}.html'
            for u in urls:
              for attempt in range(1,7):
                try:
                  r=session.get(u,headers={'User-Agent':session.headers['User-Agent'],'Referer':report_page,'Accept':'application/pdf,*/*;q=0.8'},timeout=(30,420),allow_redirects=True)
                  last={'requested_url':u,'final_url':str(r.url),'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                  if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>100_000:
                    return r.content,str(r.url),last
                except Exception as e:
                  last={'requested_url':u,'error':repr(e)}
                time.sleep(attempt)
            raise RuntimeError(f'PDF download failed {info_code}: {last}')

          manifest=[]
          for item in reports:
            data,source_url,download_meta=download_pdf(item['info_code'])
            dest=OUT/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False)
            pages=len(reader.pages)
            if pages<10:
              raise RuntimeError(f'Too few pages: {dest.name} = {pages}')
            if abs(pages-item['expected_pages'])>2:
              raise RuntimeError(f'Unexpected page count: {dest.name} actual={pages} expected={item["expected_pages"]}')

            txt=RENDER/f'{item["order"]:02d}_full.txt'
            subprocess.run(['pdftotext',str(dest),str(txt)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            text=txt.read_text(encoding='utf-8',errors='ignore')
            identity_ok=any(x in text for x in [COMPANY,FULL,CODE,'深圳市必易微电子'])
            broker_ok=any(x in text for x in item['broker_tokens'])
            theme_hits={k:(k in text) for k in item['theme_tokens']}
            theme_ok=sum(theme_hits.values())>=2
            if not identity_ok:
              raise RuntimeError(f'Issuer identity check failed: {dest.name}')
            if not broker_ok:
              raise RuntimeError(f'Broker identity check failed: {dest.name}')
            if not theme_ok:
              raise RuntimeError(f'Business-theme check failed: {dest.name}: {theme_hits}')

            q=subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
            if q.returncode!=0:
              raise RuntimeError(f'qpdf check failed: {dest.name}: {q.stdout[-1200:]}')

            first=RENDER/f'{item["order"]:02d}_first'
            last=RENDER/f'{item["order"]:02d}_last'
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(first)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            subprocess.run(['pdftoppm','-f',str(pages),'-l',str(pages),'-png','-r','100','-singlefile',str(dest),str(last)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            first_png=Path(str(first)+'.png'); last_png=Path(str(last)+'.png')
            if not first_png.exists() or first_png.stat().st_size<8_000:
              raise RuntimeError(f'First-page render failed: {dest.name}')
            if not last_png.exists() or last_png.stat().st_size<3_000:
              raise RuntimeError(f'Last-page render failed: {dest.name}')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              'stock_code':CODE,'stock_name':COMPANY,'company_full_name':FULL,
              'broker':item['broker'],'publish_date':item['date'],'title':item['title'],'rating':item['rating'],
              'info_code':item['info_code'],'pages':pages,'bytes':len(data),'sha256':sha,
              'source_url':source_url,'report_page':f'https://data.eastmoney.com/report/info/{item["info_code"]}.html',
              'filename':item['filename'],'identity_check':identity_ok,'broker_check':broker_ok,
              'business_theme_hits':theme_hits,
              'validation':['PDF header','company identity','broker identity','business themes','page count','qpdf structure','first-page render','last-page render'],
              'download_meta':download_meta
            })

          if len(manifest)!=3 or len({x['sha256'] for x in manifest})!=3:
            raise RuntimeError('Report count or duplicate check failed')

          readme=[
            '必易微（688045.SH；深圳市必易微电子股份有限公司）券商研究报告资料包',
            f'整理日期：{TODAY}','',
            '收录数量：3份，均为必易微公司专属、公开可完整下载的券商研究报告。',
            '筛选口径：优先长篇深度或较完整公司研究，覆盖AC-DC、电源管理、DCDC、BMS AFE及电机驱动等核心业务与第二成长曲线。',
            '其中民生证券报告为37页明确标注的深度报告；华安证券为20页公司研究；西南证券为11页较完整公司研究。',
            '未使用新股询价、申购报告、行业报告、网页摘要、缺页预览或非券商材料补足数量。','',
            '文件清单：'
          ]
          for i,m in enumerate(manifest,1):
            readme += [
              f'{i}. {m["filename"]}',
              f'   券商：{m["broker"]}；发布日期：{m["publish_date"]}；评级：{m["rating"]}；实际页数：{m["pages"]}页',
              f'   标题：{m["title"]}',
              f'   PDF来源：{m["source_url"]}',
              f'   研报页面：{m["report_page"]}',
              f'   SHA-256：{m["sha256"]}',''
            ]
          readme += [
            '核验说明：每份PDF均已检查文件头、公司名称/证券代码、券商身份、业务关键词、实际页数、qpdf结构及首页/末页渲染；已排除重复文件。',
            '最终ZIP已执行CRC完整性检查。'
          ]
          (OUT/'00_文件清单与筛选口径.txt').write_text('\n'.join(readme),encoding='utf-8')
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'必易微长篇研报候选清单.json').write_text(json.dumps(candidate_metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'SHA256SUMS.txt').write_text(''.join(f'{m["sha256"]}  {m["filename"]}\n' for m in manifest),encoding='utf-8')

          zip_path=ART/'必易微_688045_券商研究报告_3份_公开完整PDF.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(OUT.iterdir()):
              z.write(p,arcname=p.name)
          with zipfile.ZipFile(zip_path,'r') as z:
            bad=z.testzip()
            if bad:
              raise RuntimeError(f'ZIP CRC failure: {bad}')
            if len([n for n in z.namelist() if n.lower().endswith('.pdf')])!=3:
              raise RuntimeError('ZIP PDF count mismatch')
          zip_sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',zip_sha)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-688045-broker-reports-final-v2
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

# trigger 2026-10-28T10:20:00+08:00
