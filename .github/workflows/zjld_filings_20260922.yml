name: ZJLD Official Filings Package

on:
  push:
    branches:
      - chatgpt-zjld-filings-20260922
    paths:
      - .github/workflows/zjld_filings_20260922.yml
      - scripts/build_zjld_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pypdf

      - name: Download and validate official filings
        run: python scripts/build_zjld_filings.py

      - name: List package files
        run: ls -lh output

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: zjld-official-filings-package
          path: |
            output/珍酒李渡_全部年报_招股说明书_最新定期财报.zip
            output/BUILD_SUMMARY.json
          retention-days: 1
