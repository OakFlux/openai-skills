name: Scan exact 00041 Great Eagle reports

on:
  push:
    paths:
      - '.github/workflows/greateagle-0041-exact-stock-scan-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Scan all result pages and retain exact stock matches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import concurrent.futures
          import json
          import re
          import time
          from pathlib import Path
          import requests

          API='https://api.fxbaogao.com/mofoun/report/searchReport/searchNoAuth'
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151 Safari/537.36',
            'Accept':'application/json, text/plain, */*',
            'Content-Type':'application/json;charset=UTF-8',
            'Origin':'https://www.fxbaogao.com',
            'Referer':'https://www.fxbaogao.com/rp?keywords=%E9%B9%B0%E5%90%9B&order=2&nop=-1',
          }
          def fetch_page(page:int):
            payload={'order':'2','pdfPage':'-1','pageNum':page,'pageSize':20,'paragraphSize':3,'keywords':'鹰君'}
            errors=[]
            for attempt in range(1,5):
              s=requests.Session(); s.trust_env=False; s.headers.update(headers)
              try:
                r=s.post(API,json=payload,timeout=(20,120))
                r.raise_for_status()
                data=r.json()
                if data.get('code') != 0: raise RuntimeError(data)
                return {'page':page,'status':r.status_code,'response':data}
              except Exception as e:
                errors.append(repr(e)); time.sleep(attempt)
            return {'page':page,'errors':errors}

          pages=range(1,72)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            rows=list(ex.map(fetch_page,pages))
          rows.sort(key=lambda x:x['page'])
          exact={}
          for row in rows:
            data=row.get('response',{}).get('data',{})
            for d in data.get('dataList') or []:
              stocks=d.get('stocks') or []
              exact_match=any(str(x.get('key','')).strip()=='00041' for x in stocks if isinstance(x,dict))
              if exact_match:
                exact[str(d.get('docId'))]=d
          docs=list(exact.values())
          docs.sort(key=lambda d:(int(d.get('pubTime') or 0),int(d.get('docId') or 0)),reverse=True)
          def clean(s): return re.sub(r'<[^>]+>','',str(s or ''))
          summary=[]
          for d in docs:
            summary.append({
              'docId':d.get('docId'), 'title':clean(d.get('title')), 'orgName':clean(d.get('orgName')),
              'pubTime':d.get('pubTime'), 'pubTimeStr':d.get('pubTimeStr'), 'pageNum':d.get('pageNum'),
              'docType':d.get('docType'), 'reportType':d.get('reportType'), 'isDeep':d.get('isDeep'),
              'isNotBroker':d.get('isNotBroker'), 'industryName':clean(d.get('industryName')),
              'authors':[clean(x) for x in (d.get('authors') or [])], 'language':d.get('language'),
              'pdfPath':d.get('pdfPath'), 'coverPrefix':d.get('coverPrefix'),
              'stocks':[{'key':clean(x.get('key')),'value':clean(x.get('value'))} for x in (d.get('stocks') or []) if isinstance(x,dict)],
            })
          Path('output/all_pages.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/exact_00041_full.json').write_text(json.dumps(docs,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('output/exact_00041_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PAGE_RESULTS',len(rows),'FAILED',sum(1 for x in rows if x.get('errors')),'EXACT_DOCS',len(summary),flush=True)
          for x in summary:
            print(json.dumps(x,ensure_ascii=False),flush=True)
          PY

      - name: Upload exact-match result
        uses: actions/upload-artifact@v4
        with:
          name: greateagle-0041-exact-stock-scan
          path: output
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
