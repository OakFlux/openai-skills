name: Temporary Fetch Tianfulong Filings Final

on:
  push:
    branches:
      - tmp/fetch-tianfulong-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi

      - name: Download, verify, and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path

          import requests

          ROOT = Path('tianfulong_package')
          PDF_DIR = ROOT / '01_招股说明书及定期报告'
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          documents = [
              {
                  'document_type': 'prospectus',
                  'report_year': '2025',
                  'title': '首次公开发行股票并在主板上市招股说明书',
                  'disclosure_date': '2025-08-01',
                  'filename': '01_天富龙_首次公开发行股票并在主板上市招股说明书.pdf',
                  'url': 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2025/2025-8/2025-08-01/11273290.PDF',
                  'min_pages': 250,
                  'title_token': '招股说明书',
              },
              {
                  'document_type': 'annual_report',
                  'report_year': '2025',
                  'title': '2025年年度报告',
                  'disclosure_date': '2026-04-22',
                  'filename': '02_天富龙_2025年年度报告.pdf',
                  'url': 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-4/2026-04-22/12131705.PDF',
                  'min_pages': 120,
                  'title_token': '2025年年度报告',
              },
              {
                  'document_type': 'half_year_report',
                  'report_year': '2026',
                  'title': '2026年半年度报告',
                  'disclosure_date': '2026-08-18',
                  'filename': '03_天富龙_2026年半年度报告.pdf',
                  'url': 'http://file.finance.sina.com.cn/211.154.219.97:9494/MRGG/CNSESH_STOCK/2026/2026-8/2026-08-18/12497963.PDF',
                  'min_pages': 80,
                  'title_token': '2026年半年度报告',
              },
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36',
              'Accept': 'application/pdf,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
              'Referer': 'https://vip.stock.finance.sina.com.cn/',
          })

          def looks_like_pdf(raw):
              return len(raw) > 100_000 and raw.lstrip().startswith(b'%PDF') and b'%%EOF' in raw[-32768:]

          def download(url):
              errors = []
              variants = [url]
              if url.startswith('http://'):
                  variants.append('https://' + url[len('http://'):])
              for candidate in variants:
                  for attempt in range(1, 4):
                      try:
                          print(f'GET attempt={attempt}: {candidate}')
                          with session.get(candidate, timeout=180, allow_redirects=True, stream=True) as response:
                              response.raise_for_status()
                              data = bytearray()
                              for chunk in response.iter_content(chunk_size=1024 * 256):
                                  if chunk:
                                      data.extend(chunk)
                              raw = bytes(data)
                              content_type = response.headers.get('content-type')
                          if not looks_like_pdf(raw):
                              raise RuntimeError(
                                  f'not a complete PDF; type={content_type}, bytes={len(raw)}, head={raw[:20]!r}'
                              )
                          return raw, candidate
                      except Exception as exc:
                          errors.append(f'{candidate} attempt {attempt}: {exc}')
                          time.sleep(attempt * 2)
              raise RuntimeError('Download failed:\n' + '\n'.join(errors))

          def pdf_page_count(path):
              completed = subprocess.run(
                  ['pdfinfo', str(path)], capture_output=True, text=True, check=True
              )
              match = re.search(r'^Pages:\s+(\d+)\s*$', completed.stdout, flags=re.M)
              if not match:
                  raise RuntimeError(f'Unable to parse page count for {path}')
              return int(match.group(1))

          def extract_text(path, first, last):
              with tempfile.NamedTemporaryFile(suffix='.txt', delete=False) as temp:
                  output = Path(temp.name)
              try:
                  completed = subprocess.run(
                      ['pdftotext', '-f', str(first), '-l', str(last), '-enc', 'UTF-8', str(path), str(output)],
                      capture_output=True,
                      text=True,
                  )
                  if completed.returncode != 0:
                      return ''
                  return output.read_text(encoding='utf-8', errors='ignore')
              finally:
                  output.unlink(missing_ok=True)

          manifest = []
          sha_lines = []

          for item in documents:
              raw, source_url = download(item['url'])
              path = PDF_DIR / item['filename']
              path.write_bytes(raw)

              pages = pdf_page_count(path)
              if pages < item['min_pages']:
                  raise RuntimeError(f"Unexpectedly short document: {item['title']} has {pages} pages")

              front_text = extract_text(path, 1, min(35, pages))
              compact = re.sub(r'\s+', '', front_text)
              identity_ok = any(token in compact for token in [
                  '扬州天富龙集团股份有限公司', '天富龙', '603406'
              ])
              title_ok = item['title_token'] in compact
              year_ok = item['report_year'] in compact

              if item['document_type'] == 'prospectus':
                  invalid_draft = ('招股意向书' in compact[:25000]) or ('申报稿' in compact[:25000])
                  if invalid_draft:
                      raise RuntimeError('Selected prospectus is an intention/application draft rather than the final prospectus')
              else:
                  invalid_draft = False

              if not identity_ok or not title_ok or not year_ok:
                  raise RuntimeError(
                      f"Identity/title/year check failed for {item['title']}: "
                      f"identity={identity_ok}, title={title_ok}, year={year_ok}"
                  )

              sha = hashlib.sha256(raw).hexdigest()
              rel = str(path.relative_to(ROOT))
              record = {
                  'document_type': item['document_type'],
                  'report_year': item['report_year'],
                  'title': item['title'],
                  'disclosure_date': item['disclosure_date'],
                  'file': rel,
                  'pages': pages,
                  'bytes': len(raw),
                  'sha256': sha,
                  'source_url': source_url,
                  'pdf_header_and_eof_valid': True,
                  'identity_text_matched': identity_ok,
                  'year_text_matched': year_ok,
                  'title_text_matched': title_ok,
                  'draft_markers_absent': not invalid_draft,
              }
              manifest.append(record)
              sha_lines.append(f'{sha}  {rel}')
              print(f"VERIFIED {item['title']}: pages={pages}, bytes={len(raw)}")

          (ROOT / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (ROOT / 'SHA256SUMS.txt').write_text('\n'.join(sha_lines) + '\n', encoding='utf-8')

          readme = [
              '扬州天富龙集团股份有限公司（天富龙，603406）公开披露文件包',
              '',
              '内容范围：',
              '1. 2025年8月1日正式披露的首次公开发行股票并在主板上市招股说明书；',
              '2. 上市以来全部独立年度报告：2025年年度报告；',
              '3. 截至2026年8月30日最新披露的2026年半年度报告。',
              '',
              '说明：公司于2025年8月8日在上海证券交易所主板上市，因此目前只有一份独立上市公司年度报告。',
              '上市前2022—2024年度经审计历史财务数据已包含在正式招股说明书中。',
              '本包未重复收录半年度报告摘要、招股意向书和招股说明书申报稿。',
              '',
              '校验项目：PDF文件头与EOF、可解析页数、公司名称/证券代码、报告年份和标题、SHA-256、ZIP CRC。',
              '',
              '文件清单：',
          ]
          for record in manifest:
              readme.extend([
                  f"- {record['title']}",
                  f"  披露日期：{record['disclosure_date']}",
                  f"  文件：{record['file']}",
                  f"  页数：{record['pages']}",
                  f"  大小：{record['bytes']} bytes",
                  f"  SHA256：{record['sha256']}",
                  f"  PDF来源：{record['source_url']}",
              ])
          (ROOT / 'README_来源与校验.txt').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          zip_name = '天富龙_603406_全部年报_招股说明书_2026年最新半年报_完整PDF.zip'
          with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT.name) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_name, 'r') as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC check failed at {bad}')
          print(f'CREATED {zip_name} bytes={Path(zip_name).stat().st_size}')
          PY

      - name: Upload packaged reports
        uses: actions/upload-artifact@v4
        with:
          name: tianfulong-filings-final
          path: 天富龙_603406_全部年报_招股说明书_2026年最新半年报_完整PDF.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
