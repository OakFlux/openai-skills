name: Download Huaying 000536 annual and latest quarterly reports

on:
  push:
    paths:
      - '.github/workflows/huaying-000536-reports-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Query CNINFO, download reports, and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import re
          import sys
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = "000536"
          COMPANY = "华映科技"
          TODAY = dt.date(2026, 10, 12)
          OUT = Path("package")
          PDF_DIR = OUT / "PDF"
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Origin": "https://www.cninfo.com.cn",
              "Referer": f"https://www.cninfo.com.cn/new/disclosure/stock?stockCode={CODE}",
          })

          def get_json(url: str, **kwargs):
              last = None
              for attempt in range(5):
                  try:
                      r = session.get(url, timeout=(20, 90), **kwargs)
                      print("GET", r.status_code, len(r.content), r.url, flush=True)
                      r.raise_for_status()
                      return r.json()
                  except Exception as exc:
                      last = exc
                      time.sleep(1.5 * (attempt + 1))
              raise RuntimeError(f"GET failed: {url}: {last}")

          def post_json(url: str, data: dict):
              last = None
              for attempt in range(5):
                  try:
                      r = session.post(url, data=data, timeout=(20, 120))
                      print("POST", r.status_code, len(r.content), r.url, flush=True)
                      r.raise_for_status()
                      return r.json()
                  except Exception as exc:
                      last = exc
                      time.sleep(1.5 * (attempt + 1))
              raise RuntimeError(f"POST failed: {url}: {last}")

          org_id = "gssz0000536"
          try:
              top = get_json(
                  "https://www.cninfo.com.cn/new/information/topSearch/query",
                  params={"keyWord": CODE, "maxNum": 10},
              )
              print("TOP_SEARCH", json.dumps(top, ensure_ascii=False), flush=True)
              candidates = top if isinstance(top, list) else top.get("keyBoardList") or top.get("data") or []
              for item in candidates:
                  if str(item.get("code") or item.get("stockCode") or "") == CODE:
                      org_id = item.get("orgId") or item.get("orgid") or org_id
                      break
          except Exception as exc:
              print("TOP_SEARCH_FALLBACK", repr(exc), org_id, flush=True)

          print("ORG_ID", org_id, flush=True)

          all_rows = []
          for page in range(1, 20):
              payload = {
                  "pageNum": page,
                  "pageSize": 30,
                  "column": "szse",
                  "tabName": "fulltext",
                  "plate": "sz",
                  "stock": f"{CODE},{org_id}",
                  "searchkey": "",
                  "secid": "",
                  "category": "",
                  "trade": "",
                  "seDate": "2020-01-01~2026-10-12",
                  "sortName": "",
                  "sortType": "",
                  "isHLtitle": "true",
              }
              result = post_json("https://www.cninfo.com.cn/new/hisAnnouncement/query", payload)
              rows = result.get("announcements") or result.get("data") or []
              print("PAGE", page, "ROWS", len(rows), "TOTAL", result.get("totalAnnouncement"), flush=True)
              all_rows.extend(rows)
              if len(rows) < payload["pageSize"]:
                  break

          if not all_rows:
              raise RuntimeError("CNINFO returned no announcements")

          def clean_title(value: str) -> str:
              value = re.sub(r"<[^>]+>", "", value or "")
              value = value.replace("&nbsp;", " ").replace(" ", " ")
              return re.sub(r"\s+", "", value)

          records = []
          for row in all_rows:
              title = clean_title(row.get("announcementTitle") or row.get("title") or "")
              adjunct = row.get("adjunctUrl") or row.get("url") or ""
              ts = row.get("announcementTime") or row.get("publishTime") or 0
              if isinstance(ts, str) and ts.isdigit():
                  ts = int(ts)
              if isinstance(ts, (int, float)) and ts > 10_000_000_000:
                  date = dt.datetime.fromtimestamp(ts / 1000, dt.timezone(dt.timedelta(hours=8))).date()
              elif isinstance(ts, (int, float)) and ts:
                  date = dt.datetime.fromtimestamp(ts, dt.timezone(dt.timedelta(hours=8))).date()
              else:
                  date = None
              if adjunct and not adjunct.startswith("http"):
                  url = "https://static.cninfo.com.cn/" + adjunct.lstrip("/")
              else:
                  url = adjunct
              records.append({"title": title, "date": date, "url": url, "raw": row})

          # Print all potentially relevant filings for auditing.
          for rec in records:
              if any(k in rec["title"] for k in ("年度报告", "第一季度报告", "第三季度报告", "半年度报告")):
                  print("CANDIDATE", rec["date"], rec["title"], rec["url"], flush=True)

          def is_full_annual(title: str, year: int) -> bool:
              if f"{year}年年度报告" not in title:
                  return False
              bad = ("摘要", "英文", "取消", "更正公告", "审计报告", "董事会", "监事会", "社会责任", "内部控制")
              return not any(x in title for x in bad)

          selected = []
          for year in range(2020, 2026):
              candidates = [r for r in records if is_full_annual(r["title"], year) and r["url"]]
              if not candidates:
                  raise RuntimeError(f"Missing full annual report for {year}")
              # Prefer the latest published version; revised/updated versions therefore supersede originals.
              candidates.sort(key=lambda r: (r["date"] or dt.date.min, "修订" in r["title"] or "更新" in r["title"]), reverse=True)
              chosen = candidates[0]
              chosen = dict(chosen)
              chosen["kind"] = "annual"
              chosen["year"] = year
              selected.append(chosen)

          quarter_patterns = ("第一季度报告", "第三季度报告")
          quarter_candidates = []
          for r in records:
              title = r["title"]
              if any(p in title for p in quarter_patterns) and r["url"]:
                  if not any(x in title for x in ("更正公告", "取消", "英文", "摘要")):
                      quarter_candidates.append(r)
          if not quarter_candidates:
              raise RuntimeError("No quarterly report found")
          quarter_candidates.sort(key=lambda r: r["date"] or dt.date.min, reverse=True)
          latest_quarter = dict(quarter_candidates[0])
          latest_quarter["kind"] = "quarterly"
          latest_quarter["year"] = latest_quarter["date"].year if latest_quarter["date"] else None
          selected.append(latest_quarter)

          print("SELECTED", json.dumps([{k: (str(v) if isinstance(v, dt.date) else v) for k, v in x.items() if k != "raw"} for x in selected], ensure_ascii=False, indent=2), flush=True)

          def safe_filename(text: str) -> str:
              text = re.sub(r"[\\/:*?\"<>|]", "_", text)
              text = re.sub(r"\s+", "", text)
              return text[:180]

          manifest = []
          for idx, rec in enumerate(selected, 1):
              if rec["kind"] == "annual":
                  filename = f"华映科技（000536）{rec['year']}年年度报告.pdf"
              else:
                  filename = f"华映科技（000536）{rec['title']}.pdf"
              filename = safe_filename(filename)
              if not filename.lower().endswith(".pdf"):
                  filename += ".pdf"
              path = PDF_DIR / filename

              last = None
              for attempt in range(5):
                  try:
                      with session.get(rec["url"], timeout=(20, 180), stream=True, headers={"Referer": "https://www.cninfo.com.cn/"}) as r:
                          print("DOWNLOAD", idx, r.status_code, r.headers.get("content-type"), rec["url"], flush=True)
                          r.raise_for_status()
                          with path.open("wb") as f:
                              for chunk in r.iter_content(chunk_size=1024 * 1024):
                                  if chunk:
                                      f.write(chunk)
                      break
                  except Exception as exc:
                      last = exc
                      if path.exists():
                          path.unlink()
                      time.sleep(2 * (attempt + 1))
              else:
                  raise RuntimeError(f"Download failed: {rec['url']}: {last}")

              data = path.read_bytes()
              if not data.startswith(b"%PDF") or len(data) < 50_000:
                  raise RuntimeError(f"Invalid PDF: {path} ({len(data)} bytes)")
              reader = PdfReader(str(path))
              pages = len(reader.pages)
              sha256 = hashlib.sha256(data).hexdigest()
              print("VERIFIED", path.name, len(data), "pages", pages, "sha256", sha256, flush=True)
              manifest.append({
                  "file": path.name,
                  "title": rec["title"],
                  "announcement_date": str(rec["date"]),
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": sha256,
                  "source": rec["url"],
              })

          readme_lines = [
              "华映科技（000536）2020-2025年年度报告及最新季报",
              f"整理日期：{TODAY.isoformat()}",
              "来源：巨潮资讯网（上市公司法定信息披露平台）",
              "",
              "文件清单：",
          ]
          for item in manifest:
              readme_lines.extend([
                  f"- {item['file']}",
                  f"  公告日期：{item['announcement_date']}；页数：{item['pages']}；大小：{item['bytes']}字节",
                  f"  官方来源：{item['source']}",
                  f"  SHA-256：{item['sha256']}",
              ])
          readme_lines.extend([
              "",
              "说明：‘最新季报’按第一季度报告或第三季度报告中的最新正式披露文件确定；半年度报告不计入季报。",
          ])
          (OUT / "README.txt").write_text("\n".join(readme_lines) + "\n", encoding="utf-8")
          (OUT / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")

          zip_path = Path("华映科技_000536_2020-2025年报及最新季报.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for p in sorted(PDF_DIR.iterdir()):
                  zf.write(p, arcname=f"PDF/{p.name}")
              zf.write(OUT / "README.txt", arcname="README.txt")
              zf.write(OUT / "manifest.json", arcname="manifest.json")

          print("ZIP", zip_path, zip_path.stat().st_size, flush=True)
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: huaying-000536-reports
          path: 华映科技_000536_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 7
