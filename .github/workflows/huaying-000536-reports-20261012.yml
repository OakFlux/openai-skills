name: Download Huaying 000536 annual and latest quarterly reports

on:
  push:
    paths:
      - '.github/workflows/huaying-000536-reports-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Query CNINFO, download reports, and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = "000536"
          ORG_ID = "gssz0000536"
          TODAY = dt.date(2026, 10, 12)
          OUT = Path("package")
          PDF_DIR = OUT / "PDF"
          PDF_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Origin": "https://www.cninfo.com.cn",
              "Referer": f"https://www.cninfo.com.cn/new/disclosure/stock?stockCode={CODE}&orgId={ORG_ID}",
          })

          def post_json(data: dict):
              last = None
              for attempt in range(5):
                  try:
                      r = session.post(
                          "https://www.cninfo.com.cn/new/hisAnnouncement/query",
                          data=data,
                          timeout=(20, 120),
                      )
                      print("POST", r.status_code, len(r.content), "category", data.get("category"), "search", data.get("searchkey"), "page", data.get("pageNum"), flush=True)
                      r.raise_for_status()
                      return r.json()
                  except Exception as exc:
                      last = exc
                      time.sleep(1.5 * (attempt + 1))
              raise RuntimeError(f"CNINFO query failed: {last}")

          def query(category: str = "", searchkey: str = "", se_date: str = "2020-01-01~2026-10-12", max_pages: int = 5):
              output = []
              for page in range(1, max_pages + 1):
                  payload = {
                      "pageNum": page,
                      "pageSize": 100,
                      "column": "szse",
                      "tabName": "fulltext",
                      "plate": "sz",
                      "stock": f"{CODE},{ORG_ID}",
                      "searchkey": searchkey,
                      "secid": "",
                      "category": category,
                      "trade": "",
                      "seDate": se_date,
                      "sortName": "",
                      "sortType": "",
                      "isHLtitle": "true",
                  }
                  result = post_json(payload)
                  rows = result.get("announcements") or result.get("data") or []
                  output.extend(rows)
                  print("QUERY_ROWS", len(rows), "TOTAL", result.get("totalAnnouncement"), flush=True)
                  if len(rows) < payload["pageSize"]:
                      break
              return output

          rows = []
          # CNINFO category codes: annual, first-quarter, third-quarter reports.
          rows += query(category="category_ndbg_szsh;")
          rows += query(category="category_yjdbg_szsh;", se_date="2024-01-01~2026-10-12")
          rows += query(category="category_sjdbg_szsh;", se_date="2024-01-01~2026-10-12")

          # Fallback title searches in case category behavior changes.
          if len(rows) < 10:
              rows += query(searchkey="年度报告", max_pages=3)
              rows += query(searchkey="季度报告", se_date="2024-01-01~2026-10-12", max_pages=3)

          def clean_title(value: str) -> str:
              value = re.sub(r"<[^>]+>", "", value or "")
              value = value.replace("&nbsp;", " ").replace(" ", " ")
              return re.sub(r"\s+", "", value)

          records = []
          seen = set()
          for row in rows:
              title = clean_title(row.get("announcementTitle") or row.get("title") or "")
              adjunct = row.get("adjunctUrl") or row.get("url") or ""
              ts = row.get("announcementTime") or row.get("publishTime") or 0
              if isinstance(ts, str) and ts.isdigit():
                  ts = int(ts)
              if isinstance(ts, (int, float)) and ts > 10_000_000_000:
                  date = dt.datetime.fromtimestamp(ts / 1000, dt.timezone(dt.timedelta(hours=8))).date()
              elif isinstance(ts, (int, float)) and ts:
                  date = dt.datetime.fromtimestamp(ts, dt.timezone(dt.timedelta(hours=8))).date()
              else:
                  date = None
              url = adjunct if adjunct.startswith("http") else "https://static.cninfo.com.cn/" + adjunct.lstrip("/")
              key = (title, url)
              if not title or not adjunct or key in seen:
                  continue
              seen.add(key)
              records.append({"title": title, "date": date, "url": url})

          for rec in sorted(records, key=lambda r: r["date"] or dt.date.min, reverse=True):
              print("CANDIDATE", rec["date"], rec["title"], rec["url"], flush=True)

          def is_full_annual(title: str, year: int) -> bool:
              return (
                  f"{year}年年度报告" in title
                  and not any(x in title for x in ("摘要", "英文", "取消", "更正公告", "审计报告", "董事会", "监事会", "社会责任", "内部控制"))
              )

          selected = []
          for year in range(2020, 2026):
              candidates = [r for r in records if is_full_annual(r["title"], year)]
              if not candidates:
                  # Final narrow fallback for the missing year.
                  extra = query(searchkey=f"{year}年年度报告", se_date=f"{year + 1}-01-01~{year + 2}-12-31", max_pages=2)
                  for row in extra:
                      title = clean_title(row.get("announcementTitle") or "")
                      adjunct = row.get("adjunctUrl") or ""
                      ts = row.get("announcementTime") or 0
                      date = dt.datetime.fromtimestamp(ts / 1000, dt.timezone(dt.timedelta(hours=8))).date() if ts else None
                      url = "https://static.cninfo.com.cn/" + adjunct.lstrip("/")
                      if adjunct and is_full_annual(title, year):
                          candidates.append({"title": title, "date": date, "url": url})
              if not candidates:
                  raise RuntimeError(f"Missing full annual report for {year}")
              candidates.sort(key=lambda r: (r["date"] or dt.date.min, "修订" in r["title"] or "更新" in r["title"]), reverse=True)
              chosen = dict(candidates[0])
              chosen.update({"kind": "annual", "year": year})
              selected.append(chosen)

          quarter_candidates = [
              r for r in records
              if any(p in r["title"] for p in ("第一季度报告", "第三季度报告", "一季度报告", "三季度报告"))
              and not any(x in r["title"] for x in ("更正公告", "取消", "英文", "摘要"))
          ]
          if not quarter_candidates:
              raise RuntimeError("No quarterly report found")
          quarter_candidates.sort(key=lambda r: r["date"] or dt.date.min, reverse=True)
          latest_quarter = dict(quarter_candidates[0])
          latest_quarter.update({"kind": "quarterly", "year": latest_quarter["date"].year if latest_quarter["date"] else None})
          selected.append(latest_quarter)

          print("SELECTED", json.dumps([{k: (str(v) if isinstance(v, dt.date) else v) for k, v in rec.items()} for rec in selected], ensure_ascii=False, indent=2), flush=True)

          def safe_filename(text: str) -> str:
              text = re.sub(r"[\\/:*?\"<>|]", "_", text)
              text = re.sub(r"\s+", "", text)
              return text[:180]

          manifest = []
          for idx, rec in enumerate(selected, 1):
              if rec["kind"] == "annual":
                  filename = f"华映科技（000536）{rec['year']}年年度报告.pdf"
              else:
                  filename = f"华映科技（000536）{rec['title']}.pdf"
              filename = safe_filename(filename)
              path = PDF_DIR / filename

              last = None
              for attempt in range(5):
                  try:
                      with session.get(rec["url"], timeout=(20, 180), stream=True, headers={"Referer": "https://www.cninfo.com.cn/"}) as r:
                          print("DOWNLOAD", idx, r.status_code, r.headers.get("content-type"), rec["url"], flush=True)
                          r.raise_for_status()
                          with path.open("wb") as f:
                              for chunk in r.iter_content(chunk_size=1024 * 1024):
                                  if chunk:
                                      f.write(chunk)
                      break
                  except Exception as exc:
                      last = exc
                      if path.exists():
                          path.unlink()
                      time.sleep(2 * (attempt + 1))
              else:
                  raise RuntimeError(f"Download failed: {rec['url']}: {last}")

              data = path.read_bytes()
              if not data.startswith(b"%PDF") or len(data) < 50_000:
                  raise RuntimeError(f"Invalid PDF: {path} ({len(data)} bytes)")
              reader = PdfReader(str(path))
              pages = len(reader.pages)
              sha256 = hashlib.sha256(data).hexdigest()
              print("VERIFIED", path.name, len(data), "pages", pages, "sha256", sha256, flush=True)
              manifest.append({
                  "file": path.name,
                  "title": rec["title"],
                  "announcement_date": str(rec["date"]),
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": sha256,
                  "source": rec["url"],
              })

          readme_lines = [
              "华映科技（000536）2020-2025年年度报告及最新季报",
              f"整理日期：{TODAY.isoformat()}",
              "来源：巨潮资讯网（上市公司法定信息披露平台）",
              "",
              "文件清单：",
          ]
          for item in manifest:
              readme_lines.extend([
                  f"- {item['file']}",
                  f"  公告日期：{item['announcement_date']}；页数：{item['pages']}；大小：{item['bytes']}字节",
                  f"  官方来源：{item['source']}",
                  f"  SHA-256：{item['sha256']}",
              ])
          readme_lines.extend([
              "",
              "说明：‘最新季报’按一季度报告或三季度报告中的最新正式披露文件确定；半年度报告不计入季报。",
          ])
          (OUT / "README.txt").write_text("\n".join(readme_lines) + "\n", encoding="utf-8")
          (OUT / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")

          zip_path = Path("华映科技_000536_2020-2025年报及最新季报.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for p in sorted(PDF_DIR.iterdir()):
                  zf.write(p, arcname=f"PDF/{p.name}")
              zf.write(OUT / "README.txt", arcname="README.txt")
              zf.write(OUT / "manifest.json", arcname="manifest.json")

          print("ZIP", zip_path, zip_path.stat().st_size, flush=True)
          PY

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: huaying-000536-reports
          path: 华映科技_000536_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 7
