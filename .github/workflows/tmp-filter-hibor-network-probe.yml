name: Temporary filter Hibor network probe logs

on:
  push:
    branches:
      - tmp/china-everbright-filtered-probe-20260831

permissions:
  actions: read
  contents: read

jobs:
  filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download and filter prior probe log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/OakFlux/openai-skills/actions/jobs/99402486404/logs" \
            -o job.log

          python - <<'PY'
          import re
          from pathlib import Path

          data = Path('job.log').read_text(encoding='utf-8-sig', errors='replace').splitlines()
          keys = [
              'JS_CONTEXT', 'JS_PATHS', 'PREVIEW_IMAGE', 'PREVIEW_FRAME',
              'RESOURCE_PROBE', 'BROWSER_BIN', 'BROWSER_URL', 'BROWSER_ELEMENT',
              'CLICKING', 'AFTER_CLICK', 'NEW_WINDOW', 'NETWORK_REQUEST',
              'NETWORK_RESPONSE', 'CLICK_ERROR', 'BROWSER_ERROR', 'BROWSER_LOG',
              'INTERESTING_TAG', 'CONTROL_NODE', 'FORM', 'INPUT', 'DETAIL'
          ]
          keep = []
          for line in data:
              if any(key in line for key in keys):
                  # Remove the GitHub timestamp prefix only; preserve the diagnostic.
                  line = re.sub(r'^\ufeff?\d{4}-\d{2}-\d{2}T[^ ]+Z\s+', '', line)
                  keep.append(line)
          Path('filtered.txt').write_text('\n'.join(keep) + '\n', encoding='utf-8')
          print('SOURCE_LINES', len(data))
          print('FILTERED_LINES', len(keep))
          print(Path('filtered.txt').read_text(encoding='utf-8')[:30000])
          PY
      - name: Upload filtered diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: filtered-hibor-probe
          path: filtered.txt
          retention-days: 3
          if-no-files-found: error