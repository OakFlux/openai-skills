name: Build corrected Joyoung broker report package 20260929

on:
  push:
    paths:
      - '.github/workflows/joyoung-002242-broker-report-package-v2-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf

      - name: Download public report pages and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import time
          import zipfile
          from io import BytesIO
          from pathlib import Path
          from typing import Any

          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '九阳股份_002242_券商深度及公司研究报告_公开预览版_3份'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          preview_dir = root / '首页预览'
          preview_dir.mkdir(exist_ok=True)
          work = Path('_work_joyoung_v2')
          work.mkdir(exist_ok=True)

          specs = [
              {
                  'order':1,
                  'broker':'西部证券',
                  'title':'九阳股份（002242）深度报告：经营拐点将至',
                  'date':'2023-03-08',
                  'report_type':'公司深度报告',
                  'rating':'买入（维持）',
                  'report_id':361666,
                  'expected_total_pages':27,
                  'public_pages':10,
                  'filename':'01_西部证券_九阳股份_深度报告_经营拐点将至_公开预览前10页_2023-03-08.pdf',
              },
              {
                  'order':2,
                  'broker':'华泰证券',
                  'title':'九阳股份：营收同比增速转正，盈利能力承压',
                  'date':'2024-04-17',
                  'report_type':'公司研究报告',
                  'rating':'买入（维持）',
                  'report_id':737327,
                  'expected_total_pages':7,
                  'public_pages':7,
                  'filename':'02_华泰证券_九阳股份_营收同比增速转正盈利能力承压_公开报告页7页_2024-04-17.pdf',
              },
              {
                  'order':3,
                  'broker':'华金证券',
                  'title':'九阳股份：外销向好、新品发力，经营有望改善',
                  'date':'2023-08-31',
                  'report_type':'公司研究/中报点评',
                  'rating':'增持-B（首次）',
                  'report_id':458866,
                  'expected_total_pages':7,
                  'public_pages':7,
                  'filename':'03_华金证券_九阳股份_外销向好新品发力经营有望改善_公开报告页7页_2023-08-31.pdf',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def post_json(url: str, payload: dict[str, Any]) -> dict[str, Any]:
              last: Any = None
              for attempt in range(6):
                  try:
                      response = session.post(
                          url,
                          json=payload,
                          headers={'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/'},
                          timeout=(20,120),
                      )
                      last={'status':response.status_code,'text':response.text[:500]}
                      if response.status_code==200:
                          return response.json()
                  except Exception as exc:
                      last={'error':repr(exc)}
                  time.sleep(1+attempt)
              raise RuntimeError(f'POST failed {url}: {last}')

          def fetch_image(url: str, referer: str) -> bytes:
              last: Any = None
              headers={
                  'User-Agent':session.headers['User-Agent'],
                  'Referer':referer,
                  'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
              }
              for attempt in range(7):
                  try:
                      response=session.get(url,headers=headers,timeout=(20,120),allow_redirects=True)
                      last={'status':response.status_code,'bytes':len(response.content),'content_type':response.headers.get('content-type','')}
                      if response.status_code==200 and len(response.content)>12000:
                          with Image.open(BytesIO(response.content)) as image:
                              image.verify()
                          return response.content
                  except Exception as exc:
                      last={'error':repr(exc)}
                  time.sleep(1+attempt)
              raise RuntimeError(f'Image failed {url}: {last}')

          manifest=[]
          for spec in specs:
              detail_response=post_json('https://api.sdyanbao.com/api/file/detail',{'id':spec['report_id']})
              detail=detail_response.get('data') if isinstance(detail_response,dict) else None
              if not isinstance(detail,dict):
                  raise RuntimeError(f'Invalid detail record: {spec["report_id"]}')
              detail_name=str(detail.get('name') or '')
              if '九阳股份' not in detail_name:
                  raise RuntimeError(f'Issuer mismatch {spec["report_id"]}: {detail_name}')
              page_url=str(detail.get('page_url') or '').rstrip('/')
              total_pages=int(detail.get('page_count') or spec['expected_total_pages'])
              if total_pages != spec['expected_total_pages']:
                  raise RuntimeError(f'Unexpected total pages {spec["report_id"]}: {total_pages}')
              public_pages=min(spec['public_pages'],total_pages)
              source_page=f'https://www.sdyanbao.com/detail/{spec["report_id"]}'
              wdir=work/f'report_{spec["report_id"]}'
              wdir.mkdir(exist_ok=True)
              page_files=[]
              page_urls=[]
              for page_no in range(public_pages):
                  raw=None; successful_url=None
                  for extension in ('png','jpg','jpeg'):
                      candidate=f'{page_url}/{page_no}.{extension}'
                      try:
                          raw=fetch_image(candidate,source_page)
                          successful_url=candidate
                          break
                      except Exception:
                          continue
                  if raw is None or successful_url is None:
                      raise RuntimeError(f'Missing public page {page_no} for {spec["report_id"]}')
                  with Image.open(BytesIO(raw)) as image:
                      rgba=image.convert('RGBA')
                      white=Image.new('RGBA',rgba.size,(255,255,255,255))
                      white.alpha_composite(rgba)
                      rgb=white.convert('RGB')
                      out=wdir/f'{page_no:02d}.jpg'
                      rgb.save(out,'JPEG',quality=95,subsampling=0)
                  page_files.append(out)
                  page_urls.append(successful_url)

              pdf_path=root/spec['filename']
              images=[Image.open(path).convert('RGB') for path in page_files]
              try:
                  images[0].save(pdf_path,save_all=True,append_images=images[1:],resolution=150.0,quality=95)
              finally:
                  for image in images:
                      image.close()

              reader=PdfReader(str(pdf_path),strict=False)
              pages=len(reader.pages)
              if pages!=public_pages:
                  raise RuntimeError(f'PDF page mismatch {pdf_path.name}: {pages}/{public_pages}')
              subprocess.run(['qpdf','--check',str(pdf_path)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=preview_dir/pdf_path.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','130','-singlefile',str(pdf_path),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<15000:
                  raise RuntimeError(f'Preview render failed: {pdf_path.name}')
              sha=hashlib.sha256(pdf_path.read_bytes()).hexdigest()
              manifest.append({
                  **spec,
                  'detail_name':detail_name,
                  'source_page':source_page,
                  'page_url':page_url,
                  'page_image_urls':page_urls,
                  'original_total_pages':total_pages,
                  'public_pages_in_pdf':public_pages,
                  'pdf_file':pdf_path.name,
                  'pdf_pages':pages,
                  'bytes':pdf_path.stat().st_size,
                  'sha256':sha,
                  'preview_file':str(Path('首页预览')/preview.name),
                  'document_nature':'券商报告公开展示原页',
                  'validation':['report-detail identity','all public page images','image integrity','white-background compositing','PDF page count','qpdf structure','first-page render'],
              })

          readme=[
              '九阳股份（002242.SZ）券商深度及公司研究报告公开预览资料包',
              '整理日期：2026-09-29',
              '',
              '本包收录3份券商公司研究报告公开展示的原始页面，不包含自行撰写的摘要文件。',
              '其中西部证券深度报告原文27页，公开页面提供前10页；华泰证券与华金证券报告原文均为7页，本包收录全部7个公开报告页面。',
              '完整原始附件若需要账户、会员或数据库下载权限，本包未绕过相关访问控制。',
              '',
          ]
          for index,item in enumerate(manifest,1):
              readme += [
                  f"{index}. {item['broker']}：《{item['title']}》",
                  f"   日期：{item['date']}；类型：{item['report_type']}；评级：{item['rating']}",
                  f"   原报告：{item['original_total_pages']}页；本包PDF：{item['public_pages_in_pdf']}页",
                  f"   来源：{item['source_page']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '核验项目：报告详情身份、全部公开页面图片、图像完整性、透明背景白底处理、PDF页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
              '报告版权与观点归原券商和研究员所有，仅供研究参考，不构成投资建议。',
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{item['sha256']}  {item['pdf_file']}\n" for item in manifest),encoding='utf-8')

          zip_path=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path,arcname=f'{PACKAGE}/{path.relative_to(root)}')
          with zipfile.ZipFile(zip_path) as archive:
              bad=archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs=[name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs)!=3:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          short_path=Path('joyoung_broker_reports.zip')
          short_path.write_bytes(zip_path.read_bytes())
          print('FINAL_ZIP',zip_path,zip_path.stat().st_size,'SHA256',hashlib.sha256(zip_path.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: joyoung-002242-broker-reports-corrected-final
          path: |
            九阳股份_002242_券商深度及公司研究报告_公开预览版_3份.zip
            joyoung_broker_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
