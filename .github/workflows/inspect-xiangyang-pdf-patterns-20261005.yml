name: Inspect Xiangyang PDF patterns 20261005

on:
  push:
    paths:
      - '.github/workflows/inspect-xiangyang-pdf-patterns-20261005.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe public PDF endpoints
        run: |
          python - <<'PY'
          import requests
          from urllib.parse import urlencode

          session=requests.Session(); session.trust_env=False
          session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          art='AN202608260006751682'
          urls=[
            f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',
            f'https://pdf.dfcfw.com/pdf/H2_{art}_01.pdf',
            f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',
            f'https://pdf.dfcfw.com/pdf/H3_{art}_01.pdf',
            f'https://np-cnotice-stock.eastmoney.com/api/content/ann?art_code={art}&client_source=web&page_index=1',
            f'https://np-cnotice-stock.eastmoney.com/api/content/ann?art_code={art}&client_source=web',
            f'https://data.eastmoney.com/notices/detail/000678/{art}.html',
          ]
          for url in urls:
            try:
              r=session.get(url,timeout=120,allow_redirects=True)
              print('PROBE',r.status_code,len(r.content),r.headers.get('content-type'),r.url,'HEAD',r.content[:16])
              if 'json' in str(r.headers.get('content-type')).lower() or '/api/' in url:
                print(r.text[:3000])
            except Exception as e:
              print('ERR',url,repr(e))
          PY
