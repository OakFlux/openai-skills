name: Temporary COFCO Joycome Eastmoney date scan

on:
  push:
    branches:
      - tmp-cofco-joycome-eastmoney-scan-20260905

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Scan exact report dates and download matches
        run: |
          python -m pip install requests pypdf
          cat > /tmp/cofco_em_scan.py <<'PY'
          import hashlib, io, json, re, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          windows=[
            ('2024-07-28','2024-08-05'),
            ('2023-01-10','2023-01-18'),
            ('2022-06-01','2022-06-10'),
            ('2021-03-06','2021-03-14'),
          ]
          phrases=['中粮家佳康','中糧家佳康','COFCO Joycome','背靠中粮稳健前行','养殖规模持续扩张','品牌肉放量提升','成本管控优异的全产业链弹性标的','头均盈利位列行业一梯队']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})
          endpoint='https://reportapi.eastmoney.com/report/list'
          matches=[]; seen=set()
          for begin,end in windows:
            print('\nWINDOW',begin,end)
            for qtype in ['0','1']:
              page=1
              while page<=20:
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'*','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                r=s.get(endpoint,params=params,timeout=60); r.raise_for_status(); d=r.json(); rows=d.get('data') or []
                print('Q',qtype,'PAGE',page,'ROWS',len(rows),'HITS',d.get('hits'),'TP',d.get('TotalPage'))
                for row in rows:
                  blob=json.dumps(row,ensure_ascii=False)
                  if any(p.lower() in blob.lower() for p in phrases):
                    key=str(row.get('infoCode') or blob[:200])
                    if key not in seen:
                      seen.add(key); matches.append(row); print('MATCH',blob)
                tp=int(d.get('TotalPage') or 1)
                if not rows or page>=tp: break
                page+=1
          out=Path('output'); pdfdir=out/'pdfs'; pdfdir.mkdir(parents=True,exist_ok=True)
          valid=[]
          for row in matches:
            info=str(row.get('infoCode') or '')
            if not info: continue
            ino=info[2:] if info.upper().startswith('AP') else info
            urls=[f'https://pdf.dfcfw.com/pdf/H3_AP{ino}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf']
            for u in urls:
              try:
                rr=s.get(u,timeout=60); data=rr.content
                print('PROBE',rr.status_code,len(data),rr.url)
                if data.lstrip().startswith(b'%PDF') and len(data)>30000:
                  reader=PdfReader(io.BytesIO(data),strict=False); pages=len(reader.pages)
                  text=' '.join((p.extract_text() or '') for p in reader.pages[:4]); text=re.sub(r'\s+',' ',text)
                  if not any(k in text for k in ['中粮家佳康','中糧家佳康','COFCO Joycome','1610','01610']):
                    print('REJECT_COMPANY',text[:500]); break
                  fn=f"{row.get('publishDate','')[:10]}_{row.get('orgSName','unknown')}_{re.sub(r'[\\/:*?\"<>|]+','_',row.get('title','report'))}.pdf"
                  path=pdfdir/fn; path.write_bytes(data)
                  valid.append({'file':fn,'title':row.get('title'),'broker':row.get('orgSName'),'date':row.get('publishDate'),'pages':pages,'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'url':rr.url,'text_head':text[:1000]})
                  print('VALID',json.dumps(valid[-1],ensure_ascii=False)); break
              except Exception as e: print('PROBEERR',repr(e))
          (out/'matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'valid.json').write_text(json.dumps(valid,ensure_ascii=False,indent=2),encoding='utf-8')
          if valid:
            with zipfile.ZipFile(out/'cofco_joycome_eastmoney_matches.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in pdfdir.glob('*.pdf'): z.write(p,p.name)
              z.write(out/'valid.json','valid.json')
          print('VALID_COUNT',len(valid))
          PY
          python /tmp/cofco_em_scan.py

      - name: Upload scan output
        uses: actions/upload-artifact@v4
        with:
          name: cofco-joycome-eastmoney-date-scan
          path: output
          retention-days: 1
          compression-level: 6
