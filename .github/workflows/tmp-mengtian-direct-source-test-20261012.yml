name: Test Mengtian Report Source Assets

on:
  push:
    branches:
      - tmp-mengtian-603216-broker-reports-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests beautifulsoup4 pillow pypdf
      - name: Test direct report source assets
        shell: bash
        run: |
          python - <<'PY'
          import io,json,re,requests,pathlib
          from bs4 import BeautifulSoup
          from PIL import Image,ImageSequence
          from pypdf import PdfReader
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          specs=[
            {'id':'59821','page':'https://www.sgpjbg.com/baogao/59821.html','root':'https://file.sgpjbg.com/fileroot_temp1/2022-1/21/491c4d7b-b8ac-4745-b532-ec44622e21a7/491c4d7b-b8ac-4745-b532-ec44622e21a7','gif':'https://file.sgpjbg.com/fileroot_temp1/2022-1/21/491c4d7b-b8ac-4745-b532-ec44622e21a7/ab5c5c8bf19a40f28b16bb60bb3c3f79.gif'},
            {'id':'57012','page':'https://www.sgpjbg.com/baogao/57012.html','root':'https://file.sgpjbg.com/fileroot_temp1/2021-12/13/1e36a52c-b28a-42c3-8ee2-17a139411d64/1e36a52c-b28a-42c3-8ee2-17a139411d64','gif':'https://file.sgpjbg.com/fileroot_temp1/2021-12/13/1e36a52c-b28a-42c3-8ee2-17a139411d64/3842101d79a14fb6b8b88e409f66d39b.gif'},
          ]
          pathlib.Path('asset-output').mkdir(exist_ok=True)
          allres=[]
          for spec in specs:
            page=s.get(spec['page'],timeout=45); page.raise_for_status(); page.encoding=page.apparent_encoding or 'utf-8'; html=page.text
            pathlib.Path(f"asset-output/{spec['id']}.html").write_text(html,encoding='utf-8')
            # Print useful raw contexts.
            print('\n===== HTML CONTEXT',spec['id'],'=====')
            for term in ('fileroot','PageCount','pageCount','ImageList','imgList','BookID','BookId','bookid','View.aspx','bgdown','DownLoad','swf','pdfurl','fileurl','reporturl'):
              starts=[m.start() for m in re.finditer(term,html,re.I)]
              print('TERM',term,'COUNT',len(starts))
              for pos in starts[:8]: print(html[max(0,pos-350):pos+850].replace('\n',' ')[:1400])
            urls=[]
            for base in (spec['root'],spec['gif'],f"https://www.sgpjbg.com/bgdown/{spec['id']}.html",f"https://www.sgpjbg.com/bgdown/{spec['id']}.html?dtype=0"):
              urls.append(base)
            root=spec['root']
            for tail in ('.pdf','.PDF','/file.pdf','/report.pdf','/source.pdf','/index.pdf','/download.pdf','?download=1'):
              urls.append(root+tail)
            # Include every fileroot URL from HTML.
            urls += re.findall(r'https?://[^\"\'<>\s]+fileroot[^\"\'<>\s]+',html,re.I)
            seen=[]
            for u in urls:
              u=u.rstrip('),;')
              if u not in seen: seen.append(u)
            for i,u in enumerate(seen):
              rec={'report_id':spec['id'],'url':u}
              try:
                r=s.get(u,headers={'Referer':spec['page']},timeout=60,allow_redirects=True)
                data=r.content
                rec.update({'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type'),'content_length':len(data),'first16':data[:16].hex()})
                name=f"asset-output/{spec['id']}_{i:03d}.bin"; pathlib.Path(name).write_bytes(data)
                if data.startswith(b'%PDF-'):
                  try: rec['pdf_pages']=len(PdfReader(io.BytesIO(data)).pages)
                  except Exception as e: rec['pdf_error']=repr(e)
                try:
                  im=Image.open(io.BytesIO(data)); rec['image_format']=im.format; rec['image_size']=im.size; rec['image_frames']=getattr(im,'n_frames',1)
                  frames=[]
                  for j,fr in enumerate(ImageSequence.Iterator(im)):
                    if j>=30: break
                    frames.append({'index':j,'size':fr.size,'mode':fr.mode})
                  rec['frame_sample']=frames
                except Exception as e: rec['image_error']=repr(e)
              except Exception as e:
                rec['error']=repr(e)
              allres.append(rec); print('ASSET',json.dumps(rec,ensure_ascii=False))
          pathlib.Path('asset-output/results.json').write_text(json.dumps(allres,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Mengtian-Direct-Asset-Test
          path: asset-output/*
          retention-days: 3
