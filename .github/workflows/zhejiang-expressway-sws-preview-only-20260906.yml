name: Build SWS Zhejiang Expressway public preview PDF 20260906

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-sws-preview-only-20260906.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet pillow pymupdf pypdf
      - name: Download the ten pages explicitly published as public previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/images
          for i in $(seq 0 9); do
            n=$(printf '%02d' $((i+1)))
            curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 \
              -A 'Mozilla/5.0 Chrome/151 Safari/537.36' \
              -e 'https://www.sdyanbao.com/detail/886575' \
              "https://oss.sdyanbao.com/page/2025/5/7/1192234/${i}.png" \
              -o "output/images/${n}.png"
          done
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          import pymupdf
          from PIL import Image, ImageStat
          from pypdf import PdfReader
          root=Path('output'); imgs=sorted((root/'images').glob('*.png'))
          if len(imgs)!=10: raise RuntimeError(f'expected 10 images, got {len(imgs)}')
          page_meta=[]; hashes=set(); doc=pymupdf.open()
          for i,p in enumerate(imgs,1):
              b=p.read_bytes()
              if not b.startswith(b'\x89PNG'): raise RuntimeError(f'bad PNG {p}')
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  w,h=im.size; gray=im.convert('L'); mean=ImageStat.Stat(gray).mean[0]
              if w<700 or h<1000 or mean>254.9: raise RuntimeError(f'bad image geometry/blank {p}: {w}x{h} mean={mean}')
              sha=hashlib.sha256(b).hexdigest()
              if sha in hashes: raise RuntimeError(f'duplicate page {i}')
              hashes.add(sha); page_meta.append({'page':i,'bytes':len(b),'width':w,'height':h,'sha256':sha})
              page=doc.new_page(width=w,height=h); page.insert_image(page.rect,filename=str(p),keep_proportion=False)
          pdf=root/'01_公开预览版_非完整版_申万宏源_20250423_区域经济赋能车流量长期增长_改扩建重塑资产久期.pdf'
          doc.set_metadata({'title':'浙江沪杭甬：区域经济赋能车流量长期增长，改扩建重塑资产久期（公开预览版，非完整版）','author':'申万宏源','subject':'公开预览前10页；完整报告标注21页'})
          doc.save(str(pdf),garbage=4,deflate=True,clean=True);doc.close()
          data=pdf.read_bytes()
          if not data.startswith(b'%PDF-'): raise RuntimeError('bad PDF signature')
          pages=len(PdfReader(str(pdf),strict=False).pages)
          if pages!=10: raise RuntimeError(f'page count {pages}')
          q=subprocess.run(['qpdf','--check',str(pdf)],capture_output=True,text=True)
          if q.returncode not in (0,3): raise RuntimeError(q.stdout+q.stderr)
          d=pymupdf.open(str(pdf))
          for pno in (0,9):
              pix=d.load_page(pno).get_pixmap(matrix=pymupdf.Matrix(.8,.8),alpha=False)
              rp=root/f'render_{pno+1}.png';pix.save(str(rp))
              if rp.stat().st_size<5000: raise RuntimeError('render failed')
          d.close()
          manifest={'broker':'申万宏源','report_date':'2025-04-23','title':'区域经济赋能车流量长期增长，改扩建重塑资产久期','source':'https://www.sdyanbao.com/detail/886575','full_report_pages':21,'public_preview_pages':10,'pdf_file':pdf.name,'pdf_bytes':len(data),'pdf_sha256':hashlib.sha256(data).hexdigest(),'pages':page_meta}
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zhejiang-expressway-sws-public-preview
          path: output/
          retention-days: 30
