name: Build Guangdong Hongda 002683 broker deep reports 20261029

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guangdong-hongda-002683-broker-deep-reports-20261029-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '002683'
          SHORT = '广东宏大'
          LEGACY = '宏大爆破'
          FULL_NAMES = (
              '广东宏大控股集团股份有限公司',
              '广东宏大控股股份有限公司',
              '广东宏大爆破股份有限公司',
          )
          PACKAGE = '广东宏大_002683_券商深度报告_3份'
          ROOT = Path(PACKAGE)
          PDFDIR = ROOT / '原始PDF'
          PREV = ROOT / '首页预览'
          for d in (ROOT, PDFDIR, PREV):
              d.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker': '中邮证券',
                  'date': '2025-06-27',
                  'title': '矿服民爆一体化龙头，深耕军工谱新篇',
                  'classification': '公司深度研究/首次覆盖',
                  'rating': '增持（首次）',
                  'analysts': '鲍学博、马强',
                  'info_code': 'AP202506271698423893',
                  'source_page': 'https://data.eastmoney.com/report/info/AP202506271698423893.html',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202506271698423893_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AP202506271698423893_1.pdf?1751017303000.pdf=',
                  ],
                  'min_pages': 25,
                  'broker_aliases': ['中邮证券', 'CHINA POST SECURITIES'],
              },
              {
                  'broker': '国金证券',
                  'date': '2025-04-08',
                  'title': '民爆矿服龙头，军工布局成长',
                  'classification': '公司深度研究/首次覆盖',
                  'rating': '买入（首次）',
                  'analysts': '李阳、陈屹、赵铭',
                  'info_code': 'AP202504091653579620',
                  'source_page': 'https://data.eastmoney.com/report/info/AP202504091653579620.html',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202504091653579620_1.pdf',
                  ],
                  'min_pages': 18,
                  'broker_aliases': ['国金证券', 'SINOLINK SECURITIES'],
              },
              {
                  'broker': '国信证券',
                  'date': '2024-04-29',
                  'title': '矿服业务领先的民爆一体化服务商',
                  'classification': '公司深度报告/首次覆盖',
                  'rating': '买入（首次）',
                  'analysts': '杨林、张玮航',
                  'info_code': 'AP202404291631568410',
                  'source_page': 'https://data.eastmoney.com/report/zw_stock.jshtml?infocode=AP202404291631568410',
                  'urls': [
                      'https://pdf.dfcfw.com/pdf/H3_AP202404291631568410_1.pdf',
                      'https://pdf.dfcfw.com/pdf/H3_AP202404291631568410_1.pdf?1714388317000.pdf=',
                  ],
                  'min_pages': 45,
                  'broker_aliases': ['国信证券', 'GUOSEN SECURITIES'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'

          def safe(value: str) -> str:
              value = re.sub(r'[\\/:*?"<>|]+', '_', value)
              value = re.sub(r'\s+', '', value)
              return value[:110]

          manifest = []
          for idx, rep in enumerate(reports, 1):
              data = None
              source_url = ''
              attempts = []
              for url in rep['urls']:
                  for attempt in range(6):
                      try:
                          r = session.get(
                              url,
                              headers={
                                  'User-Agent': ua,
                                  'Referer': 'https://data.eastmoney.com/report/',
                                  'Accept': 'application/pdf,*/*;q=0.8',
                                  'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          attempts.append({
                              'url': url,
                              'attempt': attempt + 1,
                              'status': r.status_code,
                              'bytes': len(r.content),
                              'content_type': r.headers.get('content-type', ''),
                              'final_url': r.url,
                          })
                          if r.status_code == 200 and r.content[:5] == b'%PDF-' and len(r.content) > 80000:
                              data = r.content
                              source_url = url
                              break
                          if r.status_code in (400, 401, 403, 404, 410):
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f"Download failed: {rep['title']}: {attempts}")

              filename = f"{idx:02d}_{safe(rep['broker'])}_广东宏大_{safe(rep['title'])}_{rep['date']}.pdf"
              dest = PDFDIR / filename
              dest.write_bytes(data)
              reader = PdfReader(str(dest), strict=False)
              pages = len(reader.pages)
              if pages < rep['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

              text = ''
              for page in reader.pages[:min(55, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              identity_terms = (SHORT, LEGACY, CODE, *FULL_NAMES)
              identity_hits = [x for x in identity_terms if re.sub(r'\s+', '', x) in compact]
              broker_hits = [
                  x for x in rep['broker_aliases']
                  if re.sub(r'\s+', '', x).lower() in compact.lower()
              ]
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer mismatch: {filename}')
              if len(compact) > 500 and not broker_hits:
                  raise RuntimeError(f'Broker mismatch: {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(dest)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              prefix = PREV / dest.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 9000:
                  raise RuntimeError(f'Preview failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **{k: v for k, v in rep.items() if k not in ('broker_aliases', 'min_pages', 'urls')},
                  'candidate_urls': rep['urls'],
                  'source_url': source_url,
                  'actual_pages': pages,
                  'filename': str(Path('原始PDF') / filename),
                  'bytes': len(data),
                  'sha256': sha,
                  'identity_hits': identity_hits,
                  'broker_hits': broker_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'issuer identity', 'broker identity',
                      'page count', 'qpdf structure', 'first-page render'
                  ],
              })
              print('VERIFIED', rep['broker'], rep['title'], pages, len(data), sha, source_url)

          total_pages = sum(x['actual_pages'] for x in manifest)
          readme = [
              '广东宏大控股集团股份有限公司（002683.SZ）券商深度研究报告资料包',
              '整理日期：2026-10-29',
              '',
              '本包收录3份公开可直接取得并通过完整性核验的券商原始PDF。',
              '筛选口径：公司深度或首次覆盖报告；不使用普通财报点评凑数。',
              '',
          ]
          for i, x in enumerate(manifest, 1):
              readme += [
                  f"{i}. {x['broker']}：《{x['title']}》",
                  f"   类型：{x['classification']}；日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
                  f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",
                  f"   来源页面：{x['source_page']}",
                  f"   SHA-256：{x['sha256']}",
                  '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、券商标识、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),
              encoding='utf-8',
          )

          chinese_zip = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(chinese_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(chinese_zip) as z:
              bad = z.testzip()
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed bad={bad} pdf_count={len(pdfs)} manifest={len(manifest)}')

          english_zip = Path('guangdong_hongda_002683_broker_deep_reports.zip')
          english_zip.write_bytes(chinese_zip.read_bytes())
          print('FINAL_ZIP', chinese_zip, chinese_zip.stat().st_size, 'SHA256', hashlib.sha256(chinese_zip.read_bytes()).hexdigest())
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: guangdong-hongda-002683-broker-deep-reports-final
          path: |
            广东宏大_002683_券商深度报告_3份.zip
            guangdong_hongda_002683_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
