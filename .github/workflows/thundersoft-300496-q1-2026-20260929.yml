name: Fetch ThunderSoft 300496 2026 Q1 report 20260929

on:
  push:
    paths:
      - '.github/workflows/thundersoft-300496-q1-2026-20260929.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install validator
        run: python -m pip install --quiet requests pypdf

      - name: Fetch official report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          out = Path('q1_out')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 Chrome/151 Safari/537.36',
              'Origin': 'https://www.cninfo.com.cn',
              'Referer': 'https://www.cninfo.com.cn/',
              'X-Requested-With': 'XMLHttpRequest',
          })
          data = {
              'pageNum': '1', 'pageSize': '100', 'column': 'szse', 'tabName': 'fulltext',
              'plate': 'sz', 'stock': '300496,9900026763', 'searchkey': '', 'secid': '',
              'category': 'category_yjdbg_szsh', 'trade': '',
              'seDate': '2026-01-01~2026-09-29', 'sortName': '', 'sortType': '', 'isHLtitle': 'true',
          }
          r = s.post('https://www.cninfo.com.cn/new/hisAnnouncement/query', data=data, timeout=180)
          print('QUERY', r.status_code, len(r.content), flush=True)
          r.raise_for_status()
          announcements = r.json().get('announcements') or []
          selected = None
          for a in announcements:
              title = re.sub(r'<[^>]+>', '', str(a.get('announcementTitle') or '')).strip()
              print('TITLE', title, flush=True)
              if re.search(r'2026年(?:第一季度|一季度)报告', title) and not any(x in title for x in ['摘要', '英文', '提示性公告']):
                  selected = (a, title)
                  break
          if not selected:
              raise RuntimeError('2026 Q1 report not found')
          a, title = selected
          url = str(a.get('adjunctUrl') or '')
          if not url.startswith('http'):
              url = 'https://static.cninfo.com.cn/' + url.lstrip('/')
          pdf = s.get(url, headers={'Referer':'https://www.cninfo.com.cn/','User-Agent':s.headers['User-Agent']}, timeout=300)
          print('DOWNLOAD', pdf.status_code, len(pdf.content), url, flush=True)
          pdf.raise_for_status()
          if not pdf.content.startswith(b'%PDF-'):
              raise RuntimeError('Not a PDF')
          pdf_path = out / '中科创达_300496_2026年第一季度报告_最新季报.pdf'
          pdf_path.write_bytes(pdf.content)
          reader = PdfReader(str(pdf_path), strict=False)
          pages = len(reader.pages)
          text = '\n'.join((reader.pages[i].extract_text() or '') for i in range(min(12, pages)))
          if not ('中科创达' in text or '300496' in text):
              raise RuntimeError('Company identity not verified')
          sha = hashlib.sha256(pdf.content).hexdigest()
          meta = {'title': title, 'source_url': url, 'pages': pages, 'bytes': len(pdf.content), 'sha256': sha}
          (out / 'metadata.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding='utf-8')
          zip_path = Path('中科创达_300496_2026年第一季度报告_官方原件.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_STORED) as z:
              z.write(pdf_path, pdf_path.name)
              z.write(out / 'metadata.json', 'metadata.json')
          print('RESULT', json.dumps(meta, ensure_ascii=False), flush=True)
          print('ZIP', zip_path, hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: thundersoft-300496-2026-q1-official
          path: 中科创达_300496_2026年第一季度报告_官方原件.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
