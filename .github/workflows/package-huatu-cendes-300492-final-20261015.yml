name: Create final Huatu Cendes report package

on:
  push:
    paths:
      - '.github/workflows/package-huatu-cendes-300492-final-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils poppler-data
          python -m pip install --quiet requests

      - name: Build package
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests

          CODE='300492'; AS_OF='2026-10-15'
          PACKAGE='华图山鼎_300492_2020-2025年报及最新季报'
          ROOT=Path(PACKAGE); PDF=ROOT/'PDF文件'; VERIFY=ROOT/'验证记录'
          PDF.mkdir(parents=True,exist_ok=True); VERIFY.mkdir(parents=True,exist_ok=True)
          s=requests.Session(); s.trust_env=False
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          s.headers.update({'User-Agent':UA,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def clean(x): return re.sub(r'<[^>]+>','',str(x or '')).replace('&nbsp;',' ').strip()
          def norm(x): return re.sub(r'[\s:：()（）【】\[\]<>《》]+','',clean(x))
          def ndate(x): return str(x.get('notice_date') or x.get('display_time') or '')[:10]

          rows=[]; seen=set(); snapshots=[]
          for page in range(1,21):
              r=s.get('https://np-anotice-stock.eastmoney.com/api/security/ann',params={
                  'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A','client_source':'web','stock_list':CODE
              },headers={'User-Agent':UA,'Referer':f'https://data.eastmoney.com/notices/stock/{CODE}.html'},timeout=90)
              r.raise_for_status(); batch=(r.json().get('data') or {}).get('list') or []
              snapshots.append({'page':page,'count':len(batch),'rows':batch}); print('PAGE',page,len(batch),flush=True)
              if not batch: break
              for x in batch:
                  key=str(x.get('art_code') or '')
                  if key and key not in seen: seen.add(key); rows.append(x)
              dates=[ndate(x) for x in batch if ndate(x)]
              if dates and min(dates)<'2019-01-01': break
          (VERIFY/'公告索引快照.json').write_text(json.dumps({'pages':snapshots,'rows':rows},ensure_ascii=False,indent=2),encoding='utf-8')

          bad_terms=('摘要','英文','独立意见','问询','回复','监管','说明','社会责任','环境报告','内部控制','审计报告','鉴证报告','专项报告','更正公告','董事会','监事会','审议','提示性公告')
          annual={}
          for x in rows:
              t=norm(x.get('title'))
              if any(k in t for k in bad_terms): continue
              m=re.search(r'(20\d{2})年年度报告(?:全文)?(?:修订版|更新后|更正后)?$',t)
              if not m: continue
              y=int(m.group(1))
              if not 2020<=y<=2025: continue
              old=annual.get(y)
              if old is None or (ndate(x),str(x.get('art_code') or ''))>(ndate(old),str(old.get('art_code') or '')): annual[y]=x
          if sorted(annual)!=[2020,2021,2022,2023,2024,2025]:
              c=[{'title':clean(x.get('title')),'date':ndate(x),'art_code':x.get('art_code')} for x in rows if '年度报告' in norm(x.get('title')) and '摘要' not in norm(x.get('title'))]
              raise RuntimeError('Annual coverage '+str(sorted(annual))+' candidates='+json.dumps(c,ensure_ascii=False))

          quarter=[]
          qmarkers=('第一季度报告','一季度报告','一季报','第三季度报告','三季度报告','三季报')
          for x in rows:
              t=norm(x.get('title'))
              if '2026年' not in t or any(k in t for k in ('摘要','英文','问询','回复','说明')): continue
              if any(k in t for k in qmarkers):
                  quarter.append(x); print('QUARTER_CANDIDATE',clean(x.get('title')),ndate(x),x.get('art_code'),flush=True)
          if not quarter: raise RuntimeError('No 2026 quarterly report found')
          q=max(quarter,key=lambda x:(ndate(x),str(x.get('art_code') or '')))
          qtitle=clean(q.get('title')); qlabel='第三季度报告' if ('第三季度' in qtitle or '三季度' in qtitle or '三季报' in qtitle) else '第一季度报告'

          selected=[]
          for i,y in enumerate(sorted(annual),1):
              x=annual[y]; selected.append({'kind':'年度报告','year':y,'title':clean(x.get('title')),'date':ndate(x),'row':x,'filename':f'{i:02d}_华图山鼎_{y}年年度报告.pdf'})
          selected.append({'kind':'最新季报','year':2026,'title':qtitle,'date':ndate(q),'row':q,'filename':f'07_华图山鼎_2026年{qlabel}_最新季报.pdf'})
          (VERIFY/'选中文件元数据.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2),encoding='utf-8')

          def download(item,path):
              art=str(item.get('art_code') or ''); page=f'https://data.eastmoney.com/notices/detail/{CODE}/{art}.html'
              urls=[f'https://pdf.dfcfw.com/pdf/H2_{art}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{art}_1.pdf',f'https://pdf.dfcfw.com/pdf/H4_{art}_1.pdf',f'https://pdf.dfcfw.com/pdf/H1_{art}_1.pdf']
              attempts=[]
              for url in urls:
                  for attempt in range(1,4):
                      try:
                          r=s.get(url,headers={'User-Agent':UA,'Referer':page,'Accept':'application/pdf,*/*;q=0.8'},timeout=240,allow_redirects=True)
                          meta={'requested_url':url,'final_url':r.url,'status':r.status_code,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'attempt':attempt}; attempts.append(meta)
                          if r.status_code==200 and r.content.startswith(b'%PDF') and len(r.content)>50000:
                              path.write_bytes(r.content); return page,r.url,attempts
                      except Exception as e: attempts.append({'requested_url':url,'attempt':attempt,'error':repr(e)})
                      time.sleep(attempt)
              raise RuntimeError('Download failed '+json.dumps({'art_code':art,'attempts':attempts},ensure_ascii=False))

          records=[]; hashes=set(); identity=('华图山鼎','山鼎设计','四川山鼎',CODE)
          for sel in selected:
              path=PDF/sel['filename']; public,source,attempts=download(sel['row'],path); data=path.read_bytes(); sha=hashlib.sha256(data).hexdigest()
              if sha in hashes: raise RuntimeError('Duplicate '+path.name)
              hashes.add(sha)
              c=subprocess.run(['qpdf','--warning-exit-0','--check',str(path)],capture_output=True,text=True)
              if c.returncode!=0: raise RuntimeError('qpdf '+path.name+' '+c.stderr[-1000:])
              info=subprocess.run(['pdfinfo',str(path)],capture_output=True,text=True); m=re.search(r'^Pages:\s+(\d+)',info.stdout,re.M)
              if info.returncode!=0 or not m: raise RuntimeError('pdfinfo '+path.name)
              pages=int(m.group(1)); txt=VERIFY/(path.stem+'_前12页.txt')
              tr=subprocess.run(['pdftotext','-f','1','-l',str(min(12,pages)),'-layout',str(path),str(txt)],capture_output=True,text=True)
              if tr.returncode!=0: raise RuntimeError('pdftotext '+path.name)
              text=norm(txt.read_text(encoding='utf-8',errors='replace'))
              if not any(k in text for k in identity): raise RuntimeError('Company check '+path.name)
              if str(sel['year']) not in text: raise RuntimeError('Year check '+path.name)
              if sel['kind']=='年度报告' and '年度报告' not in text: raise RuntimeError('Annual check '+path.name)
              if sel['kind']=='最新季报' and not any(k in text for k in ('季度报告','一季报','三季报')): raise RuntimeError('Quarter check '+path.name)
              pref=VERIFY/(path.stem+'_首页'); rr=subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','120',str(path),str(pref)],capture_output=True,text=True); png=Path(str(pref)+'.png')
              if rr.returncode!=0 or not png.exists() or png.stat().st_size<8000: raise RuntimeError('Render '+path.name)
              rb=png.stat().st_size; png.unlink(); art=str(sel['row'].get('art_code') or '')
              rec={'filename':'PDF文件/'+path.name,'document_type':sel['kind'],'title':sel['title'],'report_year':sel['year'],'disclosure_date':sel['date'],'eastmoney_art_code':art,'public_announcement_page':public,'download_url':source,'pages':pages,'bytes':len(data),'sha256':sha,'first_page_render_bytes':rb,'download_attempts':attempts}
              records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          lines=['华图山鼎（300492.SZ）2020-2025年年度报告及最新季度报告',f'整理日期：{AS_OF}','',
                 '本包共收录7份完整PDF：2020-2025年年度报告全文6份，以及截至整理日最新正式季度报告1份。',f'最新季报：{qtitle}。',
                 '年度报告均为全文，不以摘要替代；半年度报告不按季度报告计入。文件均已完成结构、页数、公司与年份身份及首页渲染检查。','','文件清单：']
          for i,r in enumerate(records,1):
              lines += [f'{i}. {r["title"]}',f'   文件：{r["filename"]}',f'   披露日期：{r["disclosure_date"]}',f'   页数：{r["pages"]}',f'   公告页面：{r["public_announcement_page"]}',f'   PDF来源：{r["download_url"]}',f'   SHA-256：{r["sha256"]}','']
          (ROOT/'00_文件清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records),encoding='utf-8')
          z=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as a:
              for f in sorted(ROOT.rglob('*')):
                  if f.is_file(): a.write(f,arcname=f'{PACKAGE}/{f.relative_to(ROOT)}')
          with zipfile.ZipFile(z) as a:
              bad=a.testzip(); pdfs=[n for n in a.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=7: raise RuntimeError(f'ZIP bad={bad} pdfs={len(pdfs)}')
          print('FINAL_PACKAGE',json.dumps({'filename':z.name,'bytes':z.stat().st_size,'sha256':hashlib.sha256(z.read_bytes()).hexdigest(),'pdf_count':7,'latest_quarter':qtitle,'pages':[r['pages'] for r in records]},ensure_ascii=False),flush=True)
          PY

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: huatu-cendes-300492-final-reports-20261015
          path: 华图山鼎_300492_2020-2025年报及最新季报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
