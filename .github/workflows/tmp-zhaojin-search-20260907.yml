name: Search public Zhaojin Mining broker report shares
on:
  push:
    branches:
      - tmp-zhaojin-search-20260907
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Search public report indexes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          mkdir -p output
          python - <<'PY'
          from __future__ import annotations
          import base64, html, json, re
          from pathlib import Path
          from urllib.parse import quote, urljoin, urlparse, parse_qs, unquote
          import requests
          from bs4 import BeautifulSoup

          out = Path('output')
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          s = requests.Session()
          s.headers.update({'User-Agent': ua, 'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.7'})
          keywords = ['招金矿业', '01818', '1818.HK', 'Zhaojin Mining']
          post_ids = set()
          result = {'searches': [], 'posts': []}

          search_urls = []
          for kw in keywords:
              search_urls.extend([
                  'https://www.ziliaoting.com/?s=' + quote(kw),
                  'https://www.ziliaoting.com/wp-json/wp/v2/search?search=' + quote(kw) + '&per_page=100',
                  'https://www.ziliaoting.com/wp-json/wp/v2/posts?search=' + quote(kw) + '&per_page=100&_fields=id,date,link,title,content',
              ])

          for url in search_urls:
              row = {'url': url}
              try:
                  r = s.get(url, timeout=90, allow_redirects=True)
                  row.update({'status': r.status_code, 'final_url': r.url, 'bytes': len(r.content)})
                  text = r.text
                  try:
                      obj = r.json()
                      row['json'] = obj
                      if isinstance(obj, list):
                          for item in obj:
                              if isinstance(item, dict) and item.get('id'):
                                  post_ids.add(int(item['id']))
                      elif isinstance(obj, dict) and obj.get('id'):
                          post_ids.add(int(obj['id']))
                  except Exception:
                      soup = BeautifulSoup(text, 'lxml')
                      links = []
                      for a in soup.find_all('a', href=True):
                          href = urljoin(r.url, a['href'])
                          label = ' '.join(a.get_text(' ', strip=True).split())
                          title = a.get('title') or ''
                          hay = label + ' ' + title
                          if re.search(r'/\d+\.html', href) and any(k.lower() in hay.lower() for k in keywords):
                              links.append({'href': href, 'text': label, 'title': title})
                              m = re.search(r'/(\d+)\.html', href)
                              if m:
                                  post_ids.add(int(m.group(1)))
                      row['links'] = links
                  print('SEARCH', url, r.status_code, 'IDS', sorted(post_ids), flush=True)
              except Exception as exc:
                  row['error'] = repr(exc)
              result['searches'].append(row)

          for pid in sorted(post_ids):
              url = f'https://www.ziliaoting.com/wp-json/wp/v2/posts/{pid}?_fields=id,date,link,title,content'
              row = {'id': pid, 'url': url}
              try:
                  r = s.get(url, timeout=90)
                  row.update({'status': r.status_code, 'bytes': len(r.content)})
                  if r.status_code == 200:
                      obj = r.json()
                      rendered = (obj.get('content') or {}).get('rendered', '')
                      soup = BeautifulSoup(rendered, 'lxml')
                      title = html.unescape(BeautifulSoup((obj.get('title') or {}).get('rendered', ''), 'lxml').get_text(' ', strip=True))
                      links = []
                      for a in soup.find_all('a', href=True):
                          href = urljoin(obj.get('link') or url, a['href'])
                          rec = {'href': href, 'text': ' '.join(a.get_text(' ', strip=True).split())}
                          token = (parse_qs(urlparse(href).query).get('golink') or [None])[0]
                          if token:
                              try:
                                  raw = unquote(token)
                                  raw += '=' * ((4 - len(raw) % 4) % 4)
                                  rec['decoded'] = base64.b64decode(raw).decode('utf-8', 'replace')
                              except Exception as exc:
                                  rec['decode_error'] = repr(exc)
                          links.append(rec)
                      row.update({
                          'title': title,
                          'date': obj.get('date'),
                          'link': obj.get('link'),
                          'links': links,
                          'content_text': ' '.join(soup.get_text(' ', strip=True).split())[:30000],
                      })
                      print('POST', pid, title, flush=True)
                      for link in links:
                          if link.get('decoded'):
                              print('DECODED', pid, link['decoded'], flush=True)
              except Exception as exc:
                  row['error'] = repr(exc)
              result['posts'].append(row)

          (out / 'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: zhaojin-broker-report-search
          path: output/*
          retention-days: 1
          if-no-files-found: error
