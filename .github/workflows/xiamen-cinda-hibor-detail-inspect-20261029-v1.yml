name: Inspect Xiamen Cinda Hibor detail pages

on:
  push:
    branches:
      - tmp/xiamen-cinda-broker-reports-20261029-v1
    paths:
      - .github/workflows/xiamen-cinda-hibor-detail-inspect-20261029-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect detail pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import json, re, time
          import requests
          from bs4 import BeautifulSoup

          urls = [
              'https://www.hibor.com.cn/docdetail_1795232.html',
              'https://www.hibor.com.cn/docdetail_1838078.html',
              'https://sysbg.hibor.com.cn/docdetail_1795232.html',
              'https://sysbg.hibor.com.cn/docdetail_1838078.html',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          result=[]
          for idx,url in enumerate(urls,1):
              rec={'url':url}
              try:
                  r=s.get(url,timeout=(20,180),allow_redirects=True)
                  raw=r.content
                  # Try declared/apparent encodings and retain whichever exposes Chinese keywords.
                  candidates=[]
                  for enc in [r.encoding,r.apparent_encoding,'utf-8','gb18030','gbk','latin1']:
                      if not enc: continue
                      try:
                          text=raw.decode(enc,errors='replace')
                          score=sum(k in text for k in ['厦门信达','与迈科金属','布局供应链金融','招商证券','安信证券'])
                          candidates.append((score,enc,text))
                      except Exception: pass
                  candidates.sort(key=lambda x:x[0],reverse=True)
                  score,enc,text=candidates[0]
                  p=Path('out')/f'detail_{idx}_{url.split("_")[-1].split(".")[0]}.html'
                  p.write_text(text,encoding='utf-8')
                  soup=BeautifulSoup(text,'lxml')
                  rec.update(status=r.status_code,final_url=r.url,bytes=len(raw),content_type=r.headers.get('content-type',''),encoding_used=enc,encoding_score=score,title=soup.title.get_text(' ',strip=True) if soup.title else '')
                  links=[]
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a.get('href'))
                      label=a.get_text(' ',strip=True)
                      blob=(label+' '+href).lower()
                      if any(k in blob for k in ['pdf','download','down','附件','下载','file','docdown','report']):
                          links.append({'text':label,'href':href})
                  rec['links']=links[:300]
                  patterns=[
                      r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
                      r'https?://[^\s"\'<>]*(?:download|down|attachment|file|docdown)[^\s"\'<>]*',
                      r'(?:download|down|attachment|file|docdown)[^"\'<>\s]*',
                      r'(?:docid|docId|reportId|fileId|filename|fileName|downurl|downUrl)\s*[:=]\s*["\']?[^,"\'<>\s}]+' ,
                  ]
                  raws=[]
                  for pat in patterns:
                      for m in re.findall(pat,text,re.I):
                          if isinstance(m,tuple): m=''.join(m)
                          if m not in raws: raws.append(m)
                  rec['raw_candidates']=raws[:500]
                  snippets=[]
                  for term in ['厦门信达','与迈科金属','布局供应链金融','研究员','分析师','页数','下载','PDF','docdetail']:
                      pos=text.find(term)
                      if pos>=0:
                          snippets.append({'term':term,'snippet':text[max(0,pos-1200):pos+3500]})
                  rec['snippets']=snippets
              except Exception as exc:
                  rec['error']=repr(exc)
              result.append(rec)
              print('DETAIL',json.dumps(rec,ensure_ascii=False)[:50000])
              time.sleep(0.5)
          Path('out/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: xiamen-cinda-hibor-detail-inspection-20261029
          path: out
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
