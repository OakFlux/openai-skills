name: Build three long Adisseo 600299 broker reports 20261016

on:
  push:
    paths:
      - '.github/workflows/adisseo-600299-three-long-broker-reports-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package three long reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='安迪苏_600299_券商深度报告_3份'
          root=Path(package); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)
          reports=[
            {
              'code':'AP202509301753457883','broker':'东吴证券','publication_date':'2025-09-30',
              'authors':'陈淑娴、周少玟','rating':'买入（首次）',
              'title':'全球蛋氨酸行业龙头，特种产品蓬勃发展','min_pages':30,'expected_pages':33,
              'filename':'01_东吴证券_安迪苏_全球蛋氨酸行业龙头特种产品蓬勃发展_2025-09-30.pdf',
              'terms':['安迪苏','600299','全球蛋氨酸行业龙头','特种产品蓬勃发展']
            },
            {
              'code':'AP202412201641382797','broker':'国信证券','publication_date':'2024-12-20',
              'authors':'原报告内载','rating':'原报告内载',
              'title':'全球领先的动物营养添加剂供应商','min_pages':35,'expected_pages':40,
              'filename':'02_国信证券_安迪苏_全球领先的动物营养添加剂供应商_2024-12-20.pdf',
              'terms':['安迪苏','600299','动物营养添加剂','全球领先']
            },
            {
              'code':'AP202004211378358775','broker':'东吴证券','publication_date':'2020-04-21',
              'authors':'原报告内载','rating':'买入（首次）',
              'title':'蛋氨酸拐点在即，VA高景气周期','min_pages':20,'expected_pages':25,
              'filename':'03_东吴证券_安迪苏_蛋氨酸拐点在即VA高景气周期_2020-04-21.pdf',
              'terms':['安迪苏','600299','蛋氨酸拐点在即','VA高景气周期']
            },
          ]

          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'
          s.headers.update({'User-Agent':ua,'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def compact(x): return re.sub(r'\s+','',str(x or ''))
          def fetch(code):
            detail=f'https://data.eastmoney.com/report/info/{code}.html'
            attempts=[]
            for prefix in ['H3','H2','H1','H4']:
              url=f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_1.pdf'
              for attempt in range(5):
                try:
                  r=s.get(url,timeout=(30,300),allow_redirects=True,headers={'User-Agent':ua,'Referer':detail,'Accept':'application/pdf,*/*;q=0.8'})
                  attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>150000:
                    return r.content,url,attempts
                except Exception as exc:
                  attempts.append({'url':url,'error':repr(exc)})
                time.sleep(1+attempt)
            raise RuntimeError(f'PDF download failed {code}: {attempts[-12:]}')

          manifest=[]
          for item in reports:
            data,url,attempts=fetch(item['code'])
            dest=root/item['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<item['min_pages']:
              raise RuntimeError(f'Too few pages: {dest.name}: {pages} < {item["min_pages"]}')
            if abs(pages-item['expected_pages'])>1:
              raise RuntimeError(f'Unexpected page count: {dest.name}: actual={pages}, expected={item["expected_pages"]}')
            text=''
            for p in reader.pages[:min(15,pages)]:
              try: text+='\n'+(p.extract_text() or '')
              except Exception: pass
            ctext=compact(text)
            issuer_hits=[x for x in ['安迪苏','600299','蓝星安迪苏'] if compact(x) in ctext]
            title_hits=[x for x in item['terms'] if compact(x) in ctext]
            if len(ctext)>500 and not issuer_hits:
              raise RuntimeError(f'Issuer identity text check failed: {dest.name}')
            if len(ctext)>500 and len(title_hits)<2:
              raise RuntimeError(f'Title keyword check failed: {dest.name}, hits={title_hits}')
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000:
              raise RuntimeError(f'Preview render failed: {dest.name}')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **item,
              'pages':pages,'bytes':len(data),'sha256':sha,
              'source_report_page':f'https://data.eastmoney.com/report/info/{item["code"]}.html',
              'pdf_url':url,
              'issuer_text_hits':issuer_hits,'title_text_hits':title_hits,'extracted_chars':len(ctext),
              'preview_file':str(Path('首页预览')/preview.name),
              'download_attempts':attempts,
              'validation':['PDF header','exact report code','minimum/expected page count','issuer and title text','qpdf structure','first-page render','SHA-256']
            })

          readme=[
            '蓝星安迪苏股份有限公司（600299.SH）券商深度报告原始PDF资料包',
            '整理日期：2026-10-16',
            '',
            '本包收录3份长篇公司深度/首次覆盖报告原始完整PDF，共98页。',
            '不含网页摘要、预览页拼接、AI总结或自行重制PDF。',
            '',
          ]
          for i,x in enumerate(manifest,1):
            readme += [
              f"{i}. {x['broker']}：《{x['title']}》",
              f"   公开发布日期：{x['publication_date']}；分析师：{x['authors']}；评级：{x['rating']}",
              f"   完整页数：{x['pages']}页；文件：{x['filename']}",
              f"   来源页面：{x['source_report_page']}",
              f"   SHA-256：{x['sha256']}",
              '',
            ]
          readme += [
            '核验项目：PDF文件头、研报编号、公司名称/证券代码、标题关键词、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
            '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3: raise RuntimeError(f'ZIP validation failed bad={bad}, pdfs={len(pdfs)}')
          Path('adisseo_three_long_reports.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: adisseo-600299-three-long-broker-reports-final
          path: |
            安迪苏_600299_券商深度报告_3份.zip
            adisseo_three_long_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
