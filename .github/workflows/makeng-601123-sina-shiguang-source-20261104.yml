name: Inspect Sina and Shiguang Makeng report sources

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-sina-shiguang-source-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pypdf
      - name: Inspect sources and linked files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import io, json, re, requests
          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          from pypdf import PdfReader

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Connection':'close'})
          urls=[
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/846069340415/index.phtml',
            'https://shiguang.cn/stock/601123/',
            'https://shiguang.cn/airesearchreport/1116812/',
          ]
          scripts=[]; candidates=[]; links=[]
          for idx,url in enumerate(urls):
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nPAGE',idx,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path('out',f'page_{idx}.html').write_bytes(r.content)
              text=r.content.decode(r.apparent_encoding or 'utf-8',errors='replace'); soup=BeautifulSoup(text,'html.parser')
              print('TITLE',soup.title.get_text(' ',strip=True) if soup.title else '',flush=True)
              for tag in soup.find_all(['a','script','iframe','embed','object','form','link','input','button']):
                attrs={k:tag.get(k) for k in ('href','src','data','action','onclick','value','name','id','class','type') if tag.get(k) is not None}
                label=' '.join(tag.get_text(' ',strip=True).split())[:500]
                for k in ('href','src','data','action'):
                  if attrs.get(k): attrs[k]=urljoin(r.url,attrs[k])
                if tag.name=='script' and attrs.get('src'): scripts.append(attrs['src'])
                raw=(label+' '+json.dumps(attrs,ensure_ascii=False)).lower()
                if any(k in raw for k in ('pdf','download','report','attachment','source','original','原文','研报')):
                  print('TAG',tag.name,json.dumps(attrs,ensure_ascii=False),label,flush=True)
                  for k in ('href','src','data','action'):
                    if attrs.get(k): candidates.append((r.url,attrs[k]))
              raw=text.replace('\\/','/')
              for pat in [
                r'https?://[^\s"\'<>]+',
                r'/(?:[^\s"\'<>]*(?:pdf|download|attachment|report|original|file)[^\s"\'<>]*)',
                r'(?:pdf|download|attachment|file|source|original)[A-Za-z_]*\s*[:=]\s*["\']([^"\']+)["\']',
                r'(?:reportid|rptid|docid|id)\s*[:=]\s*["\']?([0-9]+)',
              ]:
                for m in re.finditer(pat,raw,re.I):
                  val=m.group(1) if m.lastindex else m.group(0)
                  if val.startswith('//'):val='https:'+val
                  full=urljoin(r.url,val)
                  if any(k in full.lower() for k in ('.pdf','download','attachment','report','original','file')) or (val.isdigit() and len(val)>5):
                    print('RAW',full,flush=True); candidates.append((r.url,full))
            except Exception as e: print('PAGE_ERROR',url,repr(e),flush=True)

          for idx,url in enumerate(dict.fromkeys(scripts)):
            try:
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nSCRIPT',idx,url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              Path('out',f'script_{idx}.js').write_bytes(r.content)
              text=r.text.replace('\\/','/')
              for m in re.finditer(r'''(?:https?:)?//[^\s"'<>]+|/[A-Za-z0-9_./?=&%+,:;-]+''',text,re.I):
                val=m.group(0).rstrip('),;]}')
                if val.startswith('//'):val='https:'+val
                full=urljoin(r.url,val)
                if any(k in full.lower() for k in ('.pdf','download','attachment','report','original','file')):
                  print('SCRIPT_RAW',full,flush=True); candidates.append((url,full))
            except Exception as e:print('SCRIPT_ERROR',url,repr(e),flush=True)

          seen=set()
          for referer,url in candidates:
            if not url or url in seen or url.startswith(('javascript:','mailto:')):continue
            seen.add(url)
            try:
              r=s.get(url,headers={'Referer':referer},timeout=60,allow_redirects=True)
              print('TEST',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
              if r.content.startswith(b'%PDF'):
                rd=PdfReader(io.BytesIO(r.content),strict=False); tx=''
                for j in range(min(5,len(rd.pages))):
                  try:tx+=rd.pages[j].extract_text() or ''
                  except Exception:pass
                print('PDF_OK',json.dumps({'url':url,'resolved':r.url,'pages':len(rd.pages),'bytes':len(r.content),'text':re.sub(r'\s+',' ',tx)[:1000]},ensure_ascii=False),flush=True)
                Path('out','recovered_report.pdf').write_bytes(r.content)
            except Exception as e:print('TEST_ERROR',url,repr(e),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: makeng-601123-sina-shiguang-source-20261104
          path: out/
          if-no-files-found: error
          retention-days: 7
