name: Discover Kaichuang International reports in Hibor archives

on:
  push:
    paths:
      - '.github/workflows/kaichuang-international-hibor-discovery-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Search Hibor monthly archives and inspect matching pages
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import html, json, re
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          months=['200904','200905','201303','201304','201308','201408','201606']
          hosts=['https://www.hibor.com.cn','https://p.hibor.com.cn','https://wt.hibor.com.cn','https://sysbg.hibor.com.cn']
          paths=['/archiver_houtai/{m}.html','/archiver/{m}.html']
          matches=[]; seen=set()
          for m in months:
              for host in hosts:
                  for pat in paths:
                      url=host+pat.format(m=m)
                      try:
                          r=s.get(url,timeout=60,allow_redirects=True)
                          print('ARCHIVE',url,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                          if r.status_code!=200 or len(r.content)<500: continue
                          r.encoding=r.apparent_encoding or r.encoding
                          soup=BeautifulSoup(r.text,'lxml')
                          for a in soup.find_all('a',href=True):
                              title=' '.join(a.get_text(' ',strip=True).split())
                              href=urljoin(r.url,a.get('href'))
                              if '开创国际' in title or '600097' in title:
                                  key=(title,href)
                                  if key not in seen:
                                      seen.add(key); matches.append(key)
                                      print('ARCHIVE_MATCH',json.dumps({'title':title,'url':href},ensure_ascii=False),flush=True)
                      except Exception as e:
                          print('ARCHIVE_ERROR',url,repr(e),flush=True)
          print('MATCH_TOTAL',len(matches),flush=True)
          for title,url in matches:
              try:
                  r=s.get(url,timeout=60,allow_redirects=True)
                  print('\nDETAIL',json.dumps({'title':title,'url':url,'status':r.status_code,'final':r.url,'bytes':len(r.content),'type':r.headers.get('content-type')},ensure_ascii=False),flush=True)
                  r.encoding=r.apparent_encoding or r.encoding
                  text=r.text
                  soup=BeautifulSoup(text,'lxml')
                  page_title=' '.join((soup.title.get_text(' ',strip=True) if soup.title else '').split())
                  print('PAGE_TITLE',page_title,flush=True)
                  for tag in soup.find_all(['a','img','form','script']):
                      attrs=[]
                      for attr in ('href','src','action','onclick','data-url','data-src','data-id','data-file'):
                          if tag.get(attr): attrs.append((attr,tag.get(attr)))
                      if not attrs: continue
                      label=' '.join(tag.get_text(' ',strip=True).split())[:200]
                      joined=' '.join(str(v) for _,v in attrs)+' '+label
                      if any(k in joined.lower() for k in ('pdf','download','down','report','doc','file','img','open','原文','下载','浏览')):
                          print('NODE',tag.name,json.dumps({'label':label,'attrs':attrs},ensure_ascii=False),flush=True)
                  # Extract likely IDs and URLs.
                  for term in ('docdetail_','repinfodetail_','report/','pdf','download','BookDownLoad','viewfile','fileurl','showpdf'):
                      positions=[m.start() for m in re.finditer(re.escape(term),text,re.I)]
                      if positions:
                          print('TERM',term,'COUNT',len(positions),flush=True)
                      for pos in positions[:20]:
                          print('CTX',re.sub(r'\s+',' ',text[max(0,pos-500):pos+1800])[:2400],flush=True)
                  urls=set()
                  for m in re.finditer(r'https?://[^\s"\'<>]+',text,re.I):
                      urls.add(html.unescape(m.group(0)))
                  for u in sorted(urls):
                      if any(k in u.lower() for k in ('pdf','download','report','doc','file','image','img')):
                          print('URL',u,flush=True)
              except Exception as e:
                  print('DETAIL_ERROR',url,repr(e),flush=True)
          PY
