name: Build Greentown China deep research package 20260927

on:
  push:
    paths:
      - '.github/workflows/greentown-china-broker-final-package-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          PACKAGE='绿城中国_03900_券商深度报告_2份_公开完整PDF'
          out=Path(PACKAGE); out.mkdir(exist_ok=True)
          docs=[
            {
              'filename':'01_广发证券_绿城中国_用品质铸就穿越周期的力量_首次覆盖_2026-05-06_51页.pdf',
              'broker':'广发证券','date':'2026-05-06','title':'用品质铸就，穿越周期的力量','type':'首次覆盖深度报告',
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202605111822141436_1.pdf',
              'min_bytes':2_000_000,'min_pages':50,'max_pages':52,
              'identity':['绿城中国','03900','用品质铸就','穿越周期'],'broker_terms':['广发证券','GF Securities'],
            },
            {
              'filename':'02_兴业证券_绿城中国_稳中求进利润为王_海外公司深度研究_2022-03-15_28页.pdf',
              'broker':'兴业证券','date':'2022-03-15','title':'稳中求进，利润为王','type':'海外公司深度研究报告',
              'url':'https://pdf.dfcfw.com/pdf/H3_AP202203161552900081_1.pdf',
              'min_bytes':800_000,'min_pages':27,'max_pages':29,
              'identity':['绿城中国','03900','稳中求进','利润为王'],'broker_terms':['兴业证券','Industrial Securities'],
            },
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept':'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8','Referer':'https://data.eastmoney.com/','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})

          def download(doc,dest):
            errs=[]
            urls=[doc['url'],doc['url'].replace('https://pdf.dfcfw.com','http://pdf.dfcfw.com')]
            for u in urls:
              for attempt in range(1,5):
                tmp=dest.with_suffix(dest.suffix+'.part')
                try:
                  with s.get(u,timeout=(30,300),stream=True,allow_redirects=True) as r:
                    print('DOWNLOAD',dest.name,'attempt',attempt,'status',r.status_code,'final',r.url,flush=True)
                    r.raise_for_status()
                    with tmp.open('wb') as f:
                      for ch in r.iter_content(1024*1024):
                        if ch: f.write(ch)
                  size=tmp.stat().st_size
                  with tmp.open('rb') as f: head=f.read(8)
                  if size<doc['min_bytes'] or not head.startswith(b'%PDF-'):
                    raise RuntimeError(f'invalid PDF size={size} head={head!r}')
                  tmp.replace(dest); return str(r.url)
                except Exception as e:
                  errs.append(f'{u} attempt {attempt}: {e!r}'); tmp.unlink(missing_ok=True); time.sleep(attempt*2)
            raise RuntimeError(f'download failed {dest.name}: {errs}')

          def sample_text(reader):
            n=len(reader.pages); idx=list(range(min(15,n)))+list(range(max(0,n-3),n)); parts=[]
            for i in dict.fromkeys(idx):
              try: parts.append(reader.pages[i].extract_text() or '')
              except Exception: pass
            return '\n'.join(parts)

          recs=[]; hashes=set()
          for doc in docs:
            dest=out/doc['filename']; final=download(doc,dest)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if not (doc['min_pages']<=pages<=doc['max_pages']): raise RuntimeError(f'page count mismatch {dest.name}: {pages}')
            text=sample_text(reader).lower()
            if not any(x.lower() in text for x in doc['identity']): raise RuntimeError(f'company/title identity failed {dest.name}')
            if not any(x.lower() in text for x in doc['broker_terms']): raise RuntimeError(f'broker identity failed {dest.name}')
            q=subprocess.run(['qpdf','--check',str(dest)],capture_output=True,text=True)
            if q.returncode not in (0,3): raise RuntimeError(f'qpdf failed {dest.name}: {q.stderr[-2000:]}')
            data=dest.read_bytes(); sha=hashlib.sha256(data).hexdigest()
            if sha in hashes: raise RuntimeError('duplicate PDF '+dest.name)
            hashes.add(sha)
            rec={'filename':doc['filename'],'broker':doc['broker'],'report_date':doc['date'],'title':doc['title'],'report_type':doc['type'],'pages':pages,'bytes':len(data),'source':'东方财富Choice公开PDF服务器','source_url':final,'sha256':sha}
            recs.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          readme=[
            '绿城中国控股有限公司（03900.HK）券商深度研究报告公开完整PDF合集',
            '整理日期：2026-09-27','',
            '收录标准：仅收录可公开直接获取、PDF完整、公司及券商身份可核验、且篇幅达到深度报告标准的材料。',
            '本次共收录2份长篇报告；未使用网页摘要、付费预览、拆分页图片或公司公告凑数。','',
            '文件清单：'
          ]
          for i,r in enumerate(recs,1):
            readme += [f"{i}. {r['broker']}：《{r['title']}》",f"   类型：{r['report_type']}；发布日期：{r['report_date']}；页数：{r['pages']}",f"   文件：{r['filename']}",f"   来源：{r['source_url']}",f"   SHA-256：{r['sha256']}",'']
          readme += ['完整性核验：PDF文件头、实际页数、公司与券商身份、qpdf结构、重复文件、逐文件SHA-256及ZIP CRC。']
          (out/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(recs,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in recs),encoding='utf-8')
          z=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as a:
            for p in sorted(out.iterdir()): a.write(p,arcname=f'{PACKAGE}/{p.name}')
          with zipfile.ZipFile(z) as a:
            bad=a.testzip(); pdfs=[x for x in a.namelist() if x.lower().endswith('.pdf')]
            if bad: raise RuntimeError('ZIP CRC failure '+bad)
            if len(pdfs)!=2: raise RuntimeError(f'PDF count mismatch {len(pdfs)}')
          zipsha=hashlib.sha256(z.read_bytes()).hexdigest()
          print('FINAL_ZIP',z,z.stat().st_size,'PDF_COUNT',len(pdfs),'SHA256',zipsha,flush=True)
          print('FINAL_MANIFEST',json.dumps(recs,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: greentown-china-broker-reports-final
          path: 绿城中国_03900_券商深度报告_2份_公开完整PDF.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
