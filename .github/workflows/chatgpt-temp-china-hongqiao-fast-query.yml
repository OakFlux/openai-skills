name: chatgpt-temp-china-hongqiao-fast-query
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-china-hongqiao-fast-query.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query exact keyword and test PDF links
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf
          python <<'PY'
          import json, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/'})
          def parse(t):
            try:return json.loads(t)
            except:
              a=t.find('{');b=t.rfind('}')
              return json.loads(t[a:b+1])
          rows=[]
          for keyword in ['中国宏桥','宏桥集团','China Hongqiao']:
            p={'cb':'showData','industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':'2015-01-01','endTime':'2026-09-08','pageNo':'1','fields':'','qType':'0','orgCode':'','rcode':'','keyword':keyword,'_':int(time.time()*1000)}
            r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=60);o=parse(r.text);x=o.get('data') or []
            print('QUERY',keyword,r.status_code,'bytes',len(r.content),'hits',o.get('hits'),'total',o.get('TotalPage'),'rows',len(x),flush=True)
            for a in x:
              blob=json.dumps(a,ensure_ascii=False)
              if '中国宏桥' in blob or '01378' in blob or '1378.HK' in blob.upper() or 'CHINA HONGQIAO' in blob.upper():
                print('MATCH',blob,flush=True);rows.append(a)
          uniq=[];seen=set()
          for a in rows:
            info=a.get('infoCode')
            if info and info not in seen:seen.add(info);uniq.append(a)
          for a in uniq:
            info=a.get('infoCode');u=f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf';rr=s.get(u,timeout=120)
            pages=None
            if rr.status_code==200 and rr.content.startswith(b'%PDF'):
              p=Path(f'{info}.pdf');p.write_bytes(rr.content)
              try:pages=len(PdfReader(str(p),strict=False).pages)
              except Exception as e:pages='ERR:'+repr(e)
              p.unlink(missing_ok=True)
            print('PDF',info,rr.status_code,len(rr.content),pages,u,flush=True)
          Path('fast_records.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL_RECORDS',len(uniq),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: China-Hongqiao-Fast-Records
          path: fast_records.json
          retention-days: 1
