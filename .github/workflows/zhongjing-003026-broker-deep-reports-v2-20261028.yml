name: Build verified Zhongjing 003026 broker reports v2 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zhongjing-003026-broker-deep-reports-v2-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package verified reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='003026'
          SHORT='中晶科技'
          FULL='浙江中晶科技股份有限公司'
          PACKAGE='中晶科技_003026_券商深度报告_2份'
          ROOT=Path(PACKAGE); PDFDIR=ROOT/'原始PDF'; PREV=ROOT/'首页预览'
          for d in (ROOT,PDFDIR,PREV): d.mkdir(parents=True,exist_ok=True)

          reports=[
            {
              'broker':'开源证券','date':'2022-02-11','info_code':'AP202202111546341099',
              'title':'公司首次覆盖报告：国产硅片龙头，前景可期',
              'analysts':'刘翔、罗通','rating':'买入（首次）','min_pages':15,
              'classification':'公司首次覆盖报告'
            },
            {
              'broker':'国信证券','date':'2021-08-25','info_code':'AP202108261512499224',
              'title':'动态点评（首次评级）：深耕小尺寸半导体硅片，盈利能力突出',
              'analysts':'胡剑、胡慧、许亮、唐泓翼','rating':'增持（首次）','min_pages':8,
              'classification':'公司首次评级长篇报告'
            },
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
            'Referer':f'https://data.eastmoney.com/report/stock.jshtml?stockCode={CODE}',
            'Accept':'application/pdf,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'
          })

          def safe(x:str)->str:
            return re.sub(r'[\\/:*?"<>|]+','_',re.sub(r'\s+','',x))[:100]

          manifest=[]
          for idx,rep in enumerate(reports,1):
            data=None; source=''; attempts=[]
            for prefix in ('H3','H2','H1','H4'):
              url=f"https://pdf.dfcfw.com/pdf/{prefix}_{rep['info_code']}_1.pdf"
              for attempt in range(6):
                try:
                  r=s.get(url,timeout=(30,360),allow_redirects=True)
                  attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url})
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>80000:
                    data=r.content; source=url; break
                except Exception as exc:
                  attempts.append({'url':url,'error':repr(exc)})
                time.sleep(1+attempt)
              if data: break
            if not data: raise RuntimeError(f"Download failed: {rep['title']}: {attempts}")

            filename=f"{idx:02d}_{safe(rep['broker'])}_中晶科技_{safe(rep['title'])}_{rep['date']}.pdf"
            dest=PDFDIR/filename; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<rep['min_pages']: raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')

            text=''
            for page in reader.pages[:min(15,pages)]:
              try: text+='\n'+(page.extract_text() or '')
              except Exception: pass
            compact=re.sub(r'\s+','',text)
            hits=[x for x in (SHORT,FULL,CODE) if re.sub(r'\s+','',x) in compact]
            if len(compact)>500 and not hits: raise RuntimeError(f'Issuer mismatch: {filename}')

            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=PREV/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError(f'Preview failed: {filename}')

            sha=hashlib.sha256(data).hexdigest()
            manifest.append({**rep,'filename':str(Path('原始PDF')/filename),'actual_pages':pages,'bytes':len(data),'sha256':sha,'source_url':source,'identity_hits':hits,'preview_file':str(Path('首页预览')/preview.name),'download_attempts':attempts,'validation':['PDF header','issuer identity','page count','qpdf structure','first-page render']})

          readme=[
            '浙江中晶科技股份有限公司（003026.SZ）券商深度研究报告资料包',
            '整理日期：2026-10-28','',
            '本包收录2份公开可直接取得并完整核验的公司级券商研究PDF。',
            '另有中泰证券19页《中小尺寸硅片领先厂商，产业链一体化成长空间广阔》，但当前公开附件返回空文件，故未纳入，以免提供损坏文件。',''
          ]
          for i,x in enumerate(manifest,1):
            readme += [f"{i}. {x['broker']}：《{x['title']}》",f"   类型：{x['classification']}；日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",f"   完整页数：{x['actual_pages']}页；文件：{x['filename']}",f"   来源：{x['source_url']}",f"   SHA-256：{x['sha256']}",'']
          readme += ['报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。','已核验PDF文件头、公司名称/证券代码、实际页数、文档结构、首页渲染、ZIP CRC和SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zip_cn=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zip_cn,'w',zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(ROOT.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{ROOT.name}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_cn) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=2: raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')
          zip_en=Path('zhongjing_003026_broker_deep_reports.zip'); zip_en.write_bytes(zip_cn.read_bytes())
          print('FINAL_ZIP',zip_cn,zip_cn.stat().st_size,'SHA256',hashlib.sha256(zip_cn.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: zhongjing-003026-broker-deep-reports-v2-final
          path: |
            中晶科技_003026_券商深度报告_2份.zip
            zhongjing_003026_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
