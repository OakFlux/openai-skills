name: Probe Xiceceshi NESC PDF

on:
  push:
    branches:
      - tmp-xiceceshi-broker-reports-20261029

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe PDF
        run: |
          python3 -m pip install --quiet requests pypdf
          python3 - <<'PY'
          import re, requests
          from pathlib import Path
          from pypdf import PdfReader
          urls = [
            'https://www.nesc.cn/timerfiles/upload/report/2023/12/17/15813469.pdf',
            'https://www.nesc.cn/timerfiles/upload/report/2023/12/25/15813483.pdf',
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.nesc.cn/'})
          for i,url in enumerate(urls,1):
            try:
              r=s.get(url,timeout=(20,180),allow_redirects=True)
              print('URL',url,'status',r.status_code,'bytes',len(r.content),'type',r.headers.get('content-type'))
              if r.status_code==200 and r.content.startswith(b'%PDF-'):
                p=Path(f'/tmp/probe_{i}.pdf'); p.write_bytes(r.content)
                reader=PdfReader(str(p),strict=False)
                print('PAGES',len(reader.pages))
                text='\n'.join((reader.pages[j].extract_text() or '') for j in range(min(5,len(reader.pages))))
                lines=[re.sub(r'\s+',' ',x).strip() for x in text.splitlines() if x.strip()]
                for line in lines[:80]: print('TEXT',line)
            except Exception as e:
              print('ERROR',url,repr(e))
          PY
