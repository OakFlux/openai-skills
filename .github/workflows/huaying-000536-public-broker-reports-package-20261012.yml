name: Package public Huaying 000536 broker reports 20261012

on:
  push:
    paths:
      - '.triggers/huaying-000536-public-broker-reports-package-20261012.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install PDF validator
        run: python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          reports = [
              {
                  'date': '2017-10-15',
                  'broker': '民生证券',
                  'title': '面板业务进展顺利，模组业务持续增长',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP201710150954474386_1.pdf',
              },
              {
                  'date': '2017-07-05',
                  'broker': '民生证券',
                  'title': '第六代TFT-LCD项目量产，打造新的增长点',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP201707050693276883_1.pdf',
              },
              {
                  'date': '2017-03-22',
                  'broker': '民生证券',
                  'title': '业务结构持续优化，多产品线即将放量',
                  'url': 'https://pdf.dfcfw.com/pdf/H3_AP201703220431622866_1.pdf',
              },
          ]

          out = Path('package')
          out.mkdir(exist_ok=True)
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
              'Accept': 'application/pdf,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe(text: str) -> str:
              return re.sub(r'[\\/:*?"<>|]+', '_', text).strip(' ._')

          manifest = []
          for i, rec in enumerate(reports, 1):
              filename = f'{i:02d}_{rec["date"]}_{rec["broker"]}_{safe(rec["title"])}.pdf'
              path = out / filename
              last = None
              for attempt in range(1, 6):
                  try:
                      r = s.get(rec['url'], timeout=(20, 180), allow_redirects=True)
                      print('DOWNLOAD', i, attempt, r.status_code, len(r.content), rec['url'], 'FINAL', r.url, flush=True)
                      r.raise_for_status()
                      if not r.content.startswith(b'%PDF-') or len(r.content) < 100_000:
                          raise RuntimeError(f'not a valid PDF response: {len(r.content)} bytes')
                      path.write_bytes(r.content)
                      break
                  except Exception as exc:
                      last = exc
                      path.unlink(missing_ok=True)
                      time.sleep(attempt * 1.5)
              else:
                  raise RuntimeError(f'Download failed for {rec["title"]}: {last!r}')

              reader = PdfReader(str(path), strict=False)
              pages = len(reader.pages)
              text = ''
              for page in reader.pages[:min(6, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              if '华映科技' not in text and '000536' not in text:
                  raise RuntimeError(f'Company identity validation failed: {filename}')
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              item = {
                  **rec,
                  'filename': filename,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              manifest.append(item)
              print('VERIFIED', json.dumps(item, ensure_ascii=False), flush=True)

          readme = [
              '华映科技（000536.SZ）公开可直接下载的券商公司研究报告精选',
              '整理日期：2026-10-12',
              '',
              '说明：公开匿名渠道能够直接取得的华映科技长篇深度报告较少。本包收录3份公开、完整、可核验的券商公司研究PDF；未使用网页摘要、预览页或拼接文件。',
              '',
              '文件清单：',
          ]
          for i, item in enumerate(manifest, 1):
              readme += [
                  f'{i}. {item["filename"]}',
                  f'   券商：{item["broker"]}',
                  f'   标题：{item["title"]}',
                  f'   日期：{item["date"]}；页数：{item["pages"]}',
                  f'   公开来源：{item["url"]}',
                  f'   SHA-256：{item["sha256"]}',
                  '',
              ]
          readme += ['完整性检查：已核验PDF文件头、公司名称/证券代码、实际页数、重复文件和ZIP CRC。']
          (out / '00_文件清单与来源说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest), encoding='utf-8')

          zip_path = Path('华映科技_000536_券商公司研究报告_3份_公开完整版.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for p in sorted(out.iterdir()):
                  zf.write(p, arcname=p.name)
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError(f'ZIP CRC failure: {bad}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, zip_sha, flush=True)
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: huaying-000536-public-broker-reports
          path: 华映科技_000536_券商公司研究报告_3份_公开完整版.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
