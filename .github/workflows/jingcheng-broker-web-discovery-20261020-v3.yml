name: Search web indexes for Jingcheng broker reports 20261020 v3

on:
  push:
    paths:
      - '.github/workflows/jingcheng-broker-web-discovery-20261020-v3.yml'
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Search public indexes
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.parse
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          queries=[
            '"京城股份" 研报',
            '"京城股份" 深度报告',
            '"京城股份" 首次覆盖',
            '"京城机电股份" 研报',
            '"600860" 券商研报',
            '"600860" 深度报告',
            '"京城股份" filetype:pdf',
            '"京城机电股份" filetype:pdf',
            'site:fxbaogao.com/detail 京城股份',
            'site:yanbaoke.com/info 京城股份',
            'site:sgpjbg.com 京城股份',
            'site:pdf.dfcfw.com 京城股份',
          ]

          def clean_bing(url):
            try:
              if 'bing.com/ck/a' in url:
                qs=urllib.parse.parse_qs(urllib.parse.urlparse(url).query)
                if 'u' in qs:
                  u=qs['u'][0]
                  if u.startswith('a1'):
                    import base64
                    pad='='*((4-len(u[2:])%4)%4)
                    return base64.b64decode(u[2:]+pad).decode('utf-8','ignore')
              return url
            except Exception:
              return url

          for q in queries:
            print('\n=== QUERY',q,'===')
            for engine,url in [
              ('BING','https://www.bing.com/search?q='+urllib.parse.quote(q)+'&count=50'),
              ('BAIDU','https://www.baidu.com/s?wd='+urllib.parse.quote(q)+'&rn=50'),
              ('SOGOU','https://www.sogou.com/web?query='+urllib.parse.quote(q)+'&num=50'),
            ]:
              try:
                r=s.get(url,timeout=45)
                print(engine,'STATUS',r.status_code,'BYTES',len(r.content),'FINAL',r.url)
                soup=BeautifulSoup(r.text,'lxml')
                found=[]
                for a in soup.find_all('a',href=True):
                  title=' '.join(a.get_text(' ',strip=True).split())
                  href=clean_bing(a['href'])
                  if href.startswith('//'): href='https:'+href
                  if not href.startswith('http'): continue
                  key=(title,href)
                  if key in found: continue
                  if any(x in href.lower() for x in ['fxbaogao','yanbaoke','sgpjbg','dfcfw','stockstar','pdf','research','report','eastmoney','hexun','sina','sohu','pdf.dfcfw']):
                    found.append(key)
                for title,href in found[:80]:
                  print(engine,'LINK',json.dumps({'title':title,'url':href},ensure_ascii=False))
              except Exception as e:
                print(engine,'ERROR',repr(e))

          # Probe likely search routes on document-index sites.
          probes=[]
          keyword=urllib.parse.quote('京城股份')
          for base in ['https://www.fxbaogao.com','https://www.yanbaoke.com','https://www.sgpjbg.com']:
            for path in [f'/search?keyword={keyword}',f'/search?q={keyword}',f'/api/search?keyword={keyword}',f'/api/search?q={keyword}',f'/api/v1/search?keyword={keyword}',f'/q/{keyword}']:
              probes.append(base+path)
          for url in probes:
            try:
              r=s.get(url,timeout=30,allow_redirects=True)
              print('PROBE',r.status_code,len(r.content),r.url,r.text[:800].replace('\n',' '))
            except Exception as e:
              print('PROBE_ERROR',url,repr(e))
          PY
