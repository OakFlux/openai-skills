name: Inspect Hengbo public report page links v2 20261028

on:
  push:
    paths:
      - '.github/workflows/hengbo-301225-nxny-scrape-v2-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,html,urllib.parse,json
          from bs4 import BeautifulSoup
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          queue=['https://www.nxny.com/pj_4_4_6/','https://www.nxny.com/author/11309_p15.html','https://www.nxny.com/stype_gg_p1532/']
          visited=set()
          for u in queue:
            print('\n===',u,'===')
            try:
              r=s.get(u,timeout=(15,45),allow_redirects=True)
              print('STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,'TYPE',r.headers.get('content-type'))
              text=r.content.decode('utf-8','ignore')
              if '恒勃' not in text: text=r.content.decode('gb18030','ignore')
              soup=BeautifulSoup(text,'html.parser')
              links=[]
              for a in soup.find_all('a',href=True):
                label=' '.join(a.get_text(' ',strip=True).split())
                href=urllib.parse.urljoin(r.url,html.unescape(a['href']))
                if '恒勃' in label or '恒勃' in href or any(k in href.lower() for k in ['pdf','download','report']):
                  links.append({'label':label[:400],'href':href})
              print('LINKS',json.dumps(links[:300],ensure_ascii=False,indent=2))
              for x in links:
                if '恒勃' in x['label'] and x['href'] not in visited and x['href'].startswith('http'):
                  visited.add(x['href'])
                  try:
                    d=s.get(x['href'],timeout=(15,45),allow_redirects=True)
                    print('\n--- DETAIL',x['href'],'STATUS',d.status_code,'LEN',len(d.content),'FINAL',d.url,'TYPE',d.headers.get('content-type'))
                    dt=d.content.decode('utf-8','ignore')
                    if '恒勃' not in dt: dt=d.content.decode('gb18030','ignore')
                    ds=BeautifulSoup(dt,'html.parser')
                    dlinks=[]
                    for tag in ds.find_all(True):
                      for attr in ('href','src','data-url','data-src','data-href','value'):
                        val=tag.get(attr)
                        if not val: continue
                        full=urllib.parse.urljoin(d.url,html.unescape(str(val)).replace('\\/','/'))
                        if any(k in full.lower() for k in ['.pdf','download','file','attach','oss','report']):
                          dlinks.append({'tag':tag.name,'attr':attr,'label':' '.join(tag.get_text(' ',strip=True).split())[:200],'href':full})
                    for pat in [r'https?://[^"\'<>\s]+',r'[^"\'<>\s]+\.pdf(?:\?[^"\'<>\s]*)?']:
                      for m in re.findall(pat,dt,re.I):
                        full=urllib.parse.urljoin(d.url,html.unescape(m).replace('\\/','/'))
                        if any(k in full.lower() for k in ['.pdf','download','file','attach','oss','report']): dlinks.append({'tag':'regex','attr':'url','label':'','href':full})
                    uniq=[]; seen=set()
                    for z in dlinks:
                      if z['href'] not in seen: seen.add(z['href']); uniq.append(z)
                    print('DETAIL_LINKS',json.dumps(uniq[:400],ensure_ascii=False,indent=2))
                  except Exception as e: print('DETAIL_ERROR',repr(e))
            except Exception as e: print('ERROR',repr(e))
          PY
