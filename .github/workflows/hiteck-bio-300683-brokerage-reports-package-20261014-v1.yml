name: Build Hiteck Bio 300683 brokerage reports package 20261014

on:
  push:
    paths:
      - '.github/workflows/hiteck-bio-300683-brokerage-reports-package-20261014-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download and package reports
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE = '300683'
          COMPANY = '海特生物'
          BASE = '海特生物_300683_券商深度及重点研究报告精选'
          s = requests.Session()
          s.trust_env = False
          s.headers.update({
              'User-Agent': 'Mozilla/5.0 Chrome/155 Safari/537.36',
              'Referer': 'https://data.eastmoney.com/',
          })

          periods = [
              ('2017-01-01','2019-12-31'),
              ('2020-01-01','2022-12-31'),
              ('2023-01-01','2024-12-31'),
              ('2025-01-01','2026-10-14'),
          ]
          rows, seen = [], set()
          for begin, end in periods:
              for page in range(1, 10):
                  params = {
                      'industryCode':'*','pageSize':'100','industry':'*','rating':'*',
                      'ratingchange':'*','beginTime':begin,'endTime':end,
                      'pageNo':str(page),'fields':'','qType':'0','orgCode':'',
                      'code':CODE,'rcode':'','p':str(page),'pageNum':str(page),
                      'pageNumber':str(page),'_':str(int(time.time()*1000)),
                  }
                  r = s.get('https://reportapi.eastmoney.com/report/list', params=params, timeout=60)
                  print('QUERY', begin, end, page, r.status_code, len(r.content), flush=True)
                  r.raise_for_status()
                  batch = (r.json() or {}).get('data') or []
                  if not batch:
                      break
                  for item in batch:
                      ic = str(item.get('infoCode') or '')
                      if ic and ic not in seen and str(item.get('stockCode') or '') == CODE:
                          seen.add(ic); rows.append(item)
                  if len(batch) < 100:
                      break

          print('TOTAL_REPORTS', len(rows), flush=True)
          for item in rows:
              print('REPORT', json.dumps({k:item.get(k) for k in (
                  'title','orgSName','publishDate','infoCode','attachPages',
                  'attachSize','researcher','emRatingName','column')}, ensure_ascii=False), flush=True)

          def pages(x):
              try: return int(x.get('attachPages') or 0)
              except Exception: return 0
          def norm(x):
              return re.sub(r'[\s，,：:、。·—－\-（）()]+','',str(x or '').lower())
          def score(x):
              t, p = norm(x.get('title')), pages(x)
              v = p * 10
              if '深度' in t: v += 2500
              if any(k in t for k in ('首次覆盖','首次','首予')): v += 2000
              if any(k in t for k in ('专题','投资价值分析')): v += 1500
              if any(k in t for k in ('创新药','cpt','埃普奈明','cdmo','原料药')): v += 150
              if any(k in t for k in ('点评','快评','动态研究','业绩','年报','季报','中报','事件点评')): v -= 900
              return (v, p, str(x.get('publishDate') or ''))

          candidates = sorted([x for x in rows if pages(x) >= 8], key=score, reverse=True)
          chosen, used_codes, used_brokers = [], set(), set()
          for x in candidates:
              t = norm(x.get('title')); broker = str(x.get('orgSName') or ''); ic = str(x.get('infoCode') or '')
              if not any(k in t for k in ('深度','首次覆盖','首次','首予','专题','投资价值分析')):
                  continue
              if ic in used_codes or (broker in used_brokers and len(chosen) < 2):
                  continue
              chosen.append(x); used_codes.add(ic); used_brokers.add(broker)
              if len(chosen) == 3: break
          if len(chosen) < 3:
              for x in candidates:
                  ic = str(x.get('infoCode') or ''); broker = str(x.get('orgSName') or '')
                  if ic in used_codes or pages(x) < 12:
                      continue
                  if broker in used_brokers and len(chosen) < 2:
                      continue
                  chosen.append(x); used_codes.add(ic); used_brokers.add(broker)
                  if len(chosen) == 3: break
          if len(chosen) < 2:
              for x in candidates:
                  ic = str(x.get('infoCode') or '')
                  if ic not in used_codes:
                      chosen.append(x); used_codes.add(ic)
                      if len(chosen) == 2: break
          if len(chosen) < 2:
              raise RuntimeError(f'Only {len(chosen)} suitable reports found')
          chosen = chosen[:3]
          print('CHOSEN', json.dumps(chosen, ensure_ascii=False), flush=True)

          package = f'{BASE}_{len(chosen)}份'
          out = Path(package); out.mkdir(exist_ok=True)
          records, hashes = [], set()

          def safe(x):
              return re.sub(r'[\\/:*?"<>|\s]+','_',str(x or '').strip())[:80]
          def urls(ic):
              return [f'https://pdf.dfcfw.com/pdf/{p}_{ic}_1.pdf' for p in ('H3','H2','H4')]

          for i, item in enumerate(chosen, 1):
              broker = str(item.get('orgSName') or '券商')
              date = str(item.get('publishDate') or '')[:10]
              title = str(item.get('title') or '公司研究报告')
              ic = str(item.get('infoCode') or '')
              dest = out / f'{i:02d}_{safe(broker)}_{date}_{safe(title)}.pdf'
              err = []
              for url in urls(ic):
                  try:
                      r = s.get(url, headers={'Referer':'https://data.eastmoney.com/report/'}, timeout=(30,900))
                      print('DOWNLOAD', dest.name, r.status_code, url, flush=True)
                      r.raise_for_status()
                      data = r.content
                      if len(data) < 120000 or not data.startswith(b'%PDF-'):
                          raise RuntimeError(f'bad PDF len={len(data)}')
                      dest.write_bytes(data); source = url; break
                  except Exception as e:
                      err.append(repr(e))
              else:
                  raise RuntimeError(f'download failed {dest.name}: {err}')

              reader = PdfReader(str(dest), strict=False)
              n = len(reader.pages)
              expected = pages(item)
              if n < 8 or (expected and abs(n-expected) > 3):
                  raise RuntimeError(f'page mismatch {dest.name}: {n} vs {expected}')
              q = subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)], capture_output=True, text=True)
              if q.returncode != 0: raise RuntimeError(q.stderr[-1000:])
              root = out / (dest.stem + '_check')
              rr = subprocess.run(['pdftoppm','-f','1','-singlefile','-png','-r','96',str(dest),str(root)], capture_output=True, text=True)
              png = Path(str(root)+'.png')
              if rr.returncode != 0 or not png.exists() or png.stat().st_size < 8000:
                  raise RuntimeError(f'render failed {dest.name}')
              render_size = png.stat().st_size; png.unlink()
              text = ''.join((reader.pages[j].extract_text() or '') for j in range(min(8,n)))
              text = re.sub(r'\s+','',text)
              if COMPANY not in text and CODE not in text:
                  raise RuntimeError(f'identity failed {dest.name}')
              raw = dest.read_bytes(); digest = hashlib.sha256(raw).hexdigest()
              if digest in hashes: raise RuntimeError('duplicate PDF')
              hashes.add(digest)
              rec = {
                  'filename':dest.name,'company':'武汉海特生物制药股份有限公司',
                  'stock_code':'300683.SZ','broker':broker,'date':date,'title':title,
                  'researcher':str(item.get('researcher') or ''),'rating':str(item.get('emRatingName') or ''),
                  'info_code':ic,'detail_url':f'https://data.eastmoney.com/report/info/{ic}.html',
                  'source_pdf_url':source,'pages':n,'bytes':len(raw),'sha256':digest,
                  'first_page_render_bytes':render_size,
              }
              records.append(rec); print('VALIDATED',json.dumps(rec,ensure_ascii=False),flush=True)

          lines = [
              '武汉海特生物制药股份有限公司（海特生物，300683.SZ）券商深度及重点研究报告精选',
              '整理日期：2026-10-14','',
              f'本包收录 {len(records)} 份券商原始排版完整PDF。',
              '优先收录深度、首次覆盖、专题或篇幅较长的公司研究，不使用普通新闻或网页摘要补足数量。','',
          ]
          for i,r in enumerate(records,1):
              lines += [f"{i}. {r['broker']}，{r['date']}，{r['pages']}页",f"   标题：{r['title']}",f"   分析师：{r['researcher']}；评级：{r['rating']}",f"   文件：{r['filename']}",f"   PDF来源：{r['source_pdf_url']}",f"   SHA-256：{r['sha256']}",'']
          (out/'00_报告清单与来源说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records),encoding='utf-8')

          z = Path(package+'.zip')
          with zipfile.ZipFile(z,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as a:
              for p in sorted(out.iterdir()): a.write(p,arcname=f'{package}/{p.name}')
          with zipfile.ZipFile(z) as a:
              bad = a.testzip()
              if bad: raise RuntimeError('ZIP CRC failure '+bad)
          print('FINAL_ZIP',z.name,z.stat().st_size,'PDF_COUNT',len(records),'SHA256',hashlib.sha256(z.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: hiteck-bio-300683-brokerage-reports-20261014-v1
          path: 海特生物_300683_券商深度及重点研究报告精选_*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
