name: Probe COSL HKEX archive API 20260922
on:
  push:
    paths:
      - '.github/workflows/cosl-hkex-api-probe-20260922.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query title search API
        run: |
          python - <<'PY'
          import json, requests, re
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151 Safari/537.36','Referer':'https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=4651&lang=EN'})
          base='https://www1.hkexnews.hk/search/titleSearchServlet.do'
          for lang in ('E','zh'):
              p={'sortDir':'0','sortByOptions':'DateTime','category':'0','market':'SEHK','stockId':'4651','documentType':'-1','fromDate':'19990401','toDate':'20260922','title':'','searchType':'0','t1code':'-2','t2Gcode':'-2','t2code':'-2','rowRange':'2500','lang':lang}
              r=s.get(base,params=p,timeout=180); print('\n===',lang,r.status_code,len(r.content),r.headers.get('content-type'),r.url); r.raise_for_status()
              data=r.json(); print('KEYS',list(data)); print('META',{k:data.get(k) for k in data if k not in ('result','resultList','records','newsInfoLst')})
              rows=None
              for k in ('result','resultList','records','newsInfoLst'):
                  if isinstance(data.get(k),list): rows=data[k]; print('ROWS_KEY',k,'COUNT',len(rows)); break
              if rows is None:
                  for k,v in data.items():
                      if isinstance(v,list): rows=v; print('ROWS_KEY',k,'COUNT',len(rows)); break
              if not rows: continue
              print('FIRST',json.dumps(rows[0],ensure_ascii=False)[:4000])
              for x in rows:
                  text=' '.join(str(v) for v in x.values())
                  low=text.lower()
                  if any(k in low for k in ('annual report','年報','年度報告','global offering','prospectus','招股','全球發售','quarterly report','季度報告','interim report','中期報告')):
                      print('MATCH',json.dumps(x,ensure_ascii=False,separators=(',',':')))
          PY