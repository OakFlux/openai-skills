name: chatgpt-temp-cmbc-eastmoney-historical
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-cmbc-eastmoney-historical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query historical report records and PDF nodes
        shell: bash
        run: |
          python -m pip install --quiet requests pypdf
          python <<'PY'
          import io,json,time,re
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          W=Path('cmbc_eastmoney_historical');W.mkdir(exist_ok=True)
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://data.eastmoney.com/report/600016.html','Accept':'application/json,text/javascript,*/*'})
          windows=[
            ('2023-06-20','2023-07-20'),('2023-12-01','2023-12-31'),
            ('2021-07-20','2021-08-20'),('2019-07-01','2019-08-20'),
            ('2022-01-01','2022-12-31'),('2023-01-01','2023-12-31'),
            ('2019-01-01','2024-12-31')]
          allrows=[];seen=set();responses=[]
          def parse(t):
            a=t.find('{');b=t.rfind('}')
            return json.loads(t[a:b+1]) if a>=0 and b>a else {}
          for endpoint in ['list','jg']:
            for begin,end in windows:
              for qtype in range(0,5):
                for page in range(1,8):
                  p={'cb':'showData','pageSize':100,'pageNo':page,'qType':qtype,'code':'600016','industryCode':'*','industry':'*','rating':'','ratingChange':'','ratingchange':'','beginTime':begin,'endTime':end,'fields':'','orgCode':'','rcode':'','_':int(time.time()*1000)}
                  r=s.get(f'https://reportapi.eastmoney.com/report/{endpoint}',params=p,timeout=90)
                  print('QUERY',endpoint,begin,end,'q',qtype,'p',page,r.status_code,len(r.content),r.url,r.text[:300],flush=True)
                  responses.append({'endpoint':endpoint,'begin':begin,'end':end,'qtype':qtype,'page':page,'url':r.url,'status':r.status_code,'text':r.text})
                  if r.status_code!=200:break
                  try:o=parse(r.text)
                  except Exception as e:print('PARSE_ERROR',repr(e),flush=True);break
                  rows=o.get('data') or []
                  if isinstance(rows,dict):rows=rows.get('data') or rows.get('list') or []
                  if not isinstance(rows,list):rows=[]
                  for x in rows:
                    blob=json.dumps(x,ensure_ascii=False)
                    if '民生银行' in blob or '600016' in blob or '01988' in blob:
                      key=x.get('infoCode') or x.get('INFO_CODE') or hashlib.sha256(blob.encode()).hexdigest()
                      if key not in seen:
                        seen.add(key);allrows.append(x);print('RECORD',json.dumps(x,ensure_ascii=False),flush=True)
                  total=int(o.get('TotalPage') or o.get('totalPage') or 1)
                  if not rows or page>=total:break
          W.joinpath('responses.json').write_text(json.dumps(responses,ensure_ascii=False,indent=2),encoding='utf-8')
          W.joinpath('records.json').write_text(json.dumps(allrows,ensure_ascii=False,indent=2),encoding='utf-8')
          targets=['柳暗尽处','资产质量改善','立足民营中小微','大民生+小微','破茧成蝶','负重远行']
          valid=[]
          for x in allrows:
            title=str(x.get('title') or x.get('TITLE') or '')
            pages=int(x.get('attachPages') or x.get('ATTACH_PAGES') or 0)
            info=x.get('infoCode') or x.get('INFO_CODE')
            if not info or pages<12 or not any(t in title for t in targets):continue
            for u in [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}.pdf']:
              try:
                r=s.get(u,headers={'Referer':'https://data.eastmoney.com/'},timeout=180,allow_redirects=True)
                print('PDF',info,r.status_code,len(r.content),r.headers.get('content-type'),r.url,flush=True)
                if r.status_code==200 and r.content.startswith(b'%PDF-') and len(r.content)>50000:
                  actual=len(PdfReader(io.BytesIO(r.content),strict=False).pages)
                  rec={'title':title,'date':str(x.get('publishDate') or '')[:10],'institution':x.get('orgSName') or x.get('orgName'),'infoCode':info,'metadata_pages':pages,'actual_pages':actual,'url':r.url,'bytes':len(r.content)}
                  valid.append(rec);print('VALID',json.dumps(rec,ensure_ascii=False),flush=True);break
              except Exception as e:print('PDF_ERROR',info,repr(e),flush=True)
          W.joinpath('valid.json').write_text(json.dumps(valid,ensure_ascii=False,indent=2),encoding='utf-8')
          print('FINAL',json.dumps(valid,ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CMBC-Eastmoney-Historical
          path: cmbc_eastmoney_historical
          retention-days: 1
          compression-level: 6
