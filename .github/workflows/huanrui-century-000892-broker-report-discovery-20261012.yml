name: Inspect Huanrui Century broker report page 20261012

on:
  push:
    paths:
      - '.github/workflows/huanrui-century-000892-broker-report-discovery-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch report page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, re, requests
          from pathlib import Path
          from urllib.parse import urljoin
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          urls=['https://www.fxbaogao.com/detail/13812','https://news.futunn.com/post/28677725/happy-century-000892-annual-report-review-leading-actor-actors-sign']
          result={}
          for i,u in enumerate(urls,1):
              try:
                  r=s.get(u,timeout=(20,90),allow_redirects=True)
                  text=r.text
                  Path(f'out/page{i}.html').write_text(text,encoding='utf-8',errors='replace')
                  links=sorted(set(re.findall(r'''(?:href|src)=["']([^"']+)["']''',text,re.I)))
                  interesting=[urljoin(r.url,x) for x in links if any(k in x.lower() for k in ['pdf','download','file','report','attachment'])]
                  pdfish=sorted(set(re.findall(r'https?://[^\s"\'<>]+(?:\.pdf|pdf[^\s"\'<>]*)',text,re.I)))
                  result[u]={'status':r.status_code,'final_url':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'interesting_links':interesting[:200],'pdfish':pdfish[:200]}
              except Exception as e:
                  result[u]={'error':repr(e)}
          Path('out/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huanrui-century-report-page-inspection
          path: out
          retention-days: 7
