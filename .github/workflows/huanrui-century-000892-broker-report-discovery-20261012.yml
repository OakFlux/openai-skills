name: Search Fxbaogao for Huanrui Century reports 20261012

on:
  push:
    paths:
      - '.github/workflows/huanrui-century-000892-broker-report-discovery-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Search report pages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import json, re, time
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          search_urls=[
              'https://www.fxbaogao.com/rp?keywords=%E6%AC%A2%E7%91%9E%E4%B8%96%E7%BA%AA&order=2&nop=-1',
              'https://www.fxbaogao.com/rp?keywords=000892&order=2&nop=-1'
          ]
          ids={13812,112749,661401,114982,5128686}
          searches=[]
          for i,u in enumerate(search_urls,1):
              r=s.get(u,timeout=(20,90),allow_redirects=True)
              Path(f'out/search{i}.html').write_text(r.text,encoding='utf-8',errors='replace')
              soup=BeautifulSoup(r.text,'html.parser')
              found=[]
              for a in soup.find_all('a',href=True):
                  m=re.fullmatch(r'/detail/(\d+)',a['href'])
                  if m:
                      rid=int(m.group(1)); ids.add(rid)
                      title=' '.join(a.get_text(' ',strip=True).split())
                      found.append({'id':rid,'title':title})
              searches.append({'url':u,'status':r.status_code,'bytes':len(r.content),'found':found})
              time.sleep(.2)

          details=[]
          for rid in sorted(ids):
              u=f'https://www.fxbaogao.com/detail/{rid}'
              try:
                  r=s.get(u,timeout=(20,90),allow_redirects=True)
                  soup=BeautifulSoup(r.text,'html.parser')
                  h1=soup.find('h1'); title=' '.join(h1.get_text(' ',strip=True).split()) if h1 else ''
                  text=' '.join(soup.get_text(' ',strip=True).split())
                  img=''
                  for im in soup.find_all('img',src=True):
                      if f'/{rid}-1.' in im['src']:
                          img=urljoin(r.url,im['src']); break
                  date=''; broker=''; analyst=''
                  m=re.search(r'(20\d{2}-\d{2}-\d{2})',text)
                  if m: date=m.group(1)
                  # Metadata near title is generally date, analyst, broker.
                  meta=''
                  if h1 and h1.parent: meta=' '.join(h1.parent.get_text(' ',strip=True).split())[:800]
                  detail={'id':rid,'status':r.status_code,'title':title,'date':date,'first_image':img,'meta':meta,'bytes':len(r.content),'url':u}
                  if img:
                      clean=img.split('?')[0]
                      m=re.match(r'(.+/)'+str(rid)+r'-1\.(png|jpg|jpeg|webp)$',clean,re.I)
                      count=0; probes=[]
                      if m:
                          prefix=m.group(1)+str(rid)+'-'; ext=m.group(2)
                          for p in range(1,81):
                              pu=f'{prefix}{p}.{ext}'
                              rr=s.get(pu,timeout=(10,45),headers={'User-Agent':s.headers['User-Agent'],'Referer':u},allow_redirects=True)
                              ok=rr.status_code==200 and len(rr.content)>5000 and (rr.headers.get('content-type','').startswith('image/') or rr.content[:4] in [b'\x89PNG',b'RIFF',b'\xff\xd8\xff\xe0',b'\xff\xd8\xff\xe1'])
                              probes.append({'page':p,'status':rr.status_code,'bytes':len(rr.content),'type':rr.headers.get('content-type'),'ok':ok})
                              if not ok: break
                              count=p
                              time.sleep(.03)
                          detail['image_base']=prefix; detail['image_ext']=ext; detail['page_count_probe']=count; detail['probe_tail']=probes[-3:]
                  details.append(detail)
                  Path(f'out/detail_{rid}.html').write_text(r.text,encoding='utf-8',errors='replace')
              except Exception as e:
                  details.append({'id':rid,'url':u,'error':repr(e)})
              time.sleep(.15)
          Path('out/searches.json').write_text(json.dumps(searches,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/details.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf-8')
          print('IDS',sorted(ids))
          for d in details: print(json.dumps(d,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huanrui-century-fxbaogao-search
          path: out
          retention-days: 7
