name: Build curated Baicheng Pharma broker deep reports 20261006

on:
  push:
    paths:
      - '.github/workflows/baicheng-pharma-301096-broker-deep-reports-v2-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download validate and package curated reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, shutil, subprocess, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          CODE='301096'
          COMPANY='百诚医药'
          FULL='杭州百诚医药科技股份有限公司'
          REPORTS=[
              {
                  'info_code':'AP202603121820509714',
                  'broker':'东吴证券',
                  'date':'2026-03-12',
                  'title':'创新药进入收获期，仿制药CRO/CDMO困境反转',
              },
              {
                  'info_code':'AP202401081616760089',
                  'broker':'开源证券',
                  'date':'2024-01-08',
                  'title':'公司首次覆盖报告：深耕仿制药CRO，自研转化+CDMO打开成长空间',
              },
              {
                  'info_code':'AP202204271561963289',
                  'broker':'民生证券',
                  'date':'2022-04-27',
                  'title':'深度报告：以技术开发为核心，综合性医药研发新势力崛起',
              },
          ]
          work=Path('work'); raw=work/'raw'; final=work/'final'; art=Path('artifact_out')
          for p in (raw,final,art): p.mkdir(parents=True,exist_ok=True)
          session=requests.Session()
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept':'application/pdf,*/*',
              'Referer':'https://data.eastmoney.com/report/',
          })

          def safe(value,limit=110):
              return re.sub(r'[\\/:*?"<>|]+','_',str(value)).strip(' ._')[:limit]

          records=[]; seen=set()
          for idx,spec in enumerate(REPORTS,1):
              info=spec['info_code']
              urls=[
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',
                  f'https://pdf.dfcfw.com/pdf/H3_{info}_01.pdf',
                  f'https://pdf.dfcfw.com/pdf/H2_{info}_01.pdf',
              ]
              data=None; source=None
              for url in urls:
                  r=session.get(url,timeout=(25,180),allow_redirects=True)
                  print('PDF_GET',info,r.status_code,len(r.content),url,'FINAL',r.url,flush=True)
                  if r.status_code==200 and len(r.content)>100000 and r.content.startswith(b'%PDF-'):
                      data=r.content; source=str(r.url); break
              if data is None:
                  raise RuntimeError('No valid PDF for '+info)
              tmp=raw/f'{idx:02d}_{info}.pdf'; tmp.write_bytes(data)
              reader=PdfReader(str(tmp),strict=False); pages=len(reader.pages)
              if pages<10: raise RuntimeError(f'too short: {pages}')
              parts=[]
              indices=list(range(min(18,pages)))
              if pages>20: indices+=list(range(max(0,pages-4),pages))
              for pno in dict.fromkeys(indices):
                  try: parts.append(reader.pages[pno].extract_text() or '')
                  except Exception: pass
              sample='\n'.join(parts)
              if CODE not in sample and COMPANY not in sample and FULL not in sample:
                  raise RuntimeError('company identity check failed: '+spec['title'])
              q=subprocess.run(['qpdf','--check',str(tmp)],capture_output=True,text=True)
              if q.returncode not in (0,3): raise RuntimeError(q.stderr[-1000:])
              sha=hashlib.sha256(data).hexdigest()
              if sha in seen: raise RuntimeError('duplicate PDF')
              seen.add(sha)
              filename=f'{idx:02d}_{spec["date"]}_{safe(spec["broker"])}_{safe(spec["title"])}.pdf'
              shutil.copy2(tmp,final/filename)
              records.append({
                  'filename':filename,'broker':spec['broker'],'title':spec['title'],
                  'publish_date':spec['date'],'pages':pages,'bytes':len(data),
                  'sha256':sha,'source_url':source,'info_code':info,
              })

          readme=[
              f'{FULL}（{CODE}.SZ，证券简称：{COMPANY}）券商深度报告合集',
              '整理日期：2026-10-06','',
              '筛选说明：兼顾时效性、完整性与研究深度，收录一份2026年最新长篇深度报告、一份2024年首次覆盖报告及一份经典公司深度报告。','',
              '文件清单：'
          ]
          for i,r in enumerate(records,1):
              readme += [
                  f'{i}. {r["filename"]}',f'   券商：{r["broker"]}',f'   标题：{r["title"]}',
                  f'   日期：{r["publish_date"]}；页数：{r["pages"]}',f'   来源：{r["source_url"]}',
                  f'   SHA-256：{r["sha256"]}',''
              ]
          readme.append('完整性检查：已验证PDF文件头、公司名称/证券代码、实际页数、qpdf结构、重复文件及SHA-256；ZIP已完成CRC测试。')
          (final/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (final/'manifest.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          (final/'SHA256SUMS.txt').write_text(''.join(f'{r["sha256"]}  {r["filename"]}\n' for r in records),encoding='utf-8')

          package='百诚医药_301096_券商深度报告_3份_精选版'
          zip_path=art/f'{package}.zip'
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(final.iterdir()): z.write(p,arcname=f'{package}/{p.name}')
          with zipfile.ZipFile(zip_path) as z:
              if z.testzip(): raise RuntimeError('ZIP CRC failure')
              if sum(1 for n in z.namelist() if n.lower().endswith('.pdf'))!=3: raise RuntimeError('PDF count mismatch')
          print('FINAL_RECORDS',json.dumps(records,ensure_ascii=False,indent=2),flush=True)
          print('FINAL_ZIP',zip_path.name,zip_path.stat().st_size,'SHA256',hashlib.sha256(zip_path.read_bytes()).hexdigest(),flush=True)
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: baicheng-pharma-301096-broker-deep-reports-curated
          path: artifact_out/*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
