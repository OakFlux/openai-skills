name: Inspect Quantgroup report pages with browser network 20260919

on:
  push:
    paths:
      - '.github/workflows/quantgroup-report-browser-network-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Python dependencies
        run: python -m pip install --quiet selenium requests beautifulsoup4

      - name: Capture browser network and download links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, re, time, html
          from pathlib import Path
          from urllib.parse import urljoin
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          out=Path('quantgroup_browser_network'); out.mkdir(exist_ok=True)
          pages=[
            ('microbell','https://www.microbell.com/repinfodetail_5329571.html'),
            ('fxbaogao','https://www.fxbaogao.com/detail/5553065'),
            ('baogaobox_yingli','https://www.baogaobox.com/reports/260817000115529.html'),
            ('valuelist_yingli','https://www.valuelist.cn/871327.html'),
            ('yanbaoke_yingli','https://pc.yanbaoke.cn/info/6MX8BtbPRRyVQpwC5LWfy9'),
            ('book118_fosun','https://max.book118.com/html/2026/0712/6022231035012200.shtm'),
          ]
          opts=Options()
          opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--disable-gpu'); opts.add_argument('--window-size=1440,2200')
          opts.add_argument('--lang=zh-CN'); opts.add_argument('--disable-blink-features=AutomationControlled')
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})
          prefs={'download.default_directory':str((out/'downloads').resolve()),'download.prompt_for_download':False,'plugins.always_open_pdf_externally':True}
          opts.add_experimental_option('prefs',prefs)
          driver=webdriver.Chrome(options=opts)
          driver.execute_cdp_cmd('Page.setDownloadBehavior', {'behavior':'allow','downloadPath':str((out/'downloads').resolve())})
          allrecs=[]
          for idx,(name,url) in enumerate(pages,1):
            rec={'name':name,'input':url,'network':[],'links':[],'buttons':[],'errors':[]}
            try:
              print('\nOPEN',name,url,flush=True)
              driver.get(url); time.sleep(8)
              rec['final']=driver.current_url; rec['title']=driver.title
              src=driver.page_source
              (out/f'{idx:02d}_{name}.html').write_text(src,encoding='utf-8')
              driver.save_screenshot(str(out/f'{idx:02d}_{name}.png'))
              print('TITLE',driver.title,'FINAL',driver.current_url,'SOURCE_LEN',len(src),flush=True)
              for a in driver.find_elements(By.TAG_NAME,'a'):
                try:
                  href=a.get_attribute('href') or ''; txt=(a.text or '').strip(); outer=a.get_attribute('outerHTML') or ''
                  if href or txt:
                    rec['links'].append({'text':txt[:300],'href':href,'outer':outer[:1000]})
                    low=(txt+' '+href+' '+outer).lower()
                    if any(k in low for k in ('下载','download','pdf','原文','报告','preview','file')):
                      print('LINK',txt[:200],href,outer[:500],flush=True)
                except Exception: pass
              for e in driver.find_elements(By.XPATH,"//*[self::button or self::a or @role='button']"):
                try:
                  txt=(e.text or '').strip(); outer=e.get_attribute('outerHTML') or ''
                  low=(txt+' '+outer).lower()
                  if any(k in low for k in ('下载','download','打开报告原文','pdf','预览')):
                    rec['buttons'].append({'text':txt[:300],'outer':outer[:1500]})
                except Exception: pass
              # collect initial network
              logs=driver.get_log('performance')
              for log in logs:
                try:
                  msg=json.loads(log['message'])['message']
                  if msg['method']=='Network.responseReceived':
                    p=msg['params']; resp=p['response']; u=resp.get('url',''); mime=resp.get('mimeType','')
                    if any(k in (u+' '+mime).lower() for k in ('pdf','download','report','file','preview','attachment','api','repinfo','5329571','5553065')):
                      item={'url':u,'mime':mime,'status':resp.get('status'),'type':p.get('type'),'headers':resp.get('headers',{})}
                      rec['network'].append(item); print('NET',json.dumps(item,ensure_ascii=False)[:2000],flush=True)
                except Exception: pass
              # click likely download/original buttons one at a time and capture new network
              candidates=[]
              for xp in ["//*[contains(normalize-space(.),'下载报告')]","//*[contains(normalize-space(.),'打开报告原文')]","//*[contains(translate(normalize-space(.),'DOWNLOAD','download'),'download')]","//*[contains(@href,'.pdf')]"]:
                try:
                  for el in driver.find_elements(By.XPATH,xp):
                    if el.is_displayed(): candidates.append(el)
                except Exception: pass
              seen_outer=set()
              for ci,el in enumerate(candidates[:6]):
                try:
                  outer=el.get_attribute('outerHTML') or ''
                  if outer in seen_outer: continue
                  seen_outer.add(outer)
                  print('CLICK',ci,(el.text or '')[:100],outer[:600],flush=True)
                  driver.execute_script("arguments[0].scrollIntoView({block:'center'});",el); time.sleep(1)
                  driver.execute_script("arguments[0].click();",el); time.sleep(5)
                  print('AFTER_CLICK_URL',driver.current_url,flush=True)
                  for log in driver.get_log('performance'):
                    try:
                      msg=json.loads(log['message'])['message']
                      if msg['method']=='Network.responseReceived':
                        p=msg['params']; resp=p['response']; u=resp.get('url',''); mime=resp.get('mimeType','')
                        if any(k in (u+' '+mime).lower() for k in ('pdf','download','report','file','preview','attachment','api','repinfo','5329571','5553065')):
                          item={'url':u,'mime':mime,'status':resp.get('status'),'type':p.get('type'),'headers':resp.get('headers',{})}
                          rec['network'].append(item); print('CLICKNET',json.dumps(item,ensure_ascii=False)[:2000],flush=True)
                    except Exception: pass
                  if driver.current_url != rec['final']:
                    driver.back(); time.sleep(4)
                except Exception as e:
                  rec['errors'].append(repr(e)); print('CLICKERR',repr(e),flush=True)
              # regex direct URLs and JS object keys
              found=set()
              for pat in [r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',r'(?:pdfUrl|downloadUrl|fileUrl|reportUrl|previewUrl|url)\s*[:=]\s*["\']([^"\']+)["\']']:
                for m in re.finditer(pat,src,re.I):
                  v=m.group(1) if m.lastindex else m.group(0); found.add(html.unescape(v).replace('\\/','/'))
              rec['regex_urls']=sorted(found)
              for u in rec['regex_urls']: print('REGEXURL',u,flush=True)
            except Exception as e:
              rec['errors'].append(repr(e)); print('ERR',name,repr(e),flush=True)
            (out/f'{idx:02d}_{name}.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
            allrecs.append(rec)
          driver.quit()
          (out/'all.json').write_text(json.dumps(allrecs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

          find quantgroup_browser_network -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload browser inspection
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-report-browser-network-20260919
          path: quantgroup_browser_network
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
