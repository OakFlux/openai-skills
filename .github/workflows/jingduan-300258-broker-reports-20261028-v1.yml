name: Build Jingduan 300258 broker deep reports 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jingduan-300258-broker-reports-20261028-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          CODE = '300258'
          SHORT = '精锻科技'
          FULL = '江苏太平洋精锻科技股份有限公司'
          PACKAGE = '精锻科技_300258_券商深度报告_3份'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / '原始PDF'
          PREVIEW_DIR = ROOT / '首页预览'
          for d in (ROOT, PDF_DIR, PREVIEW_DIR):
              d.mkdir(parents=True, exist_ok=True)

          reports = [
              {
                  'broker': '东吴证券',
                  'date': '2025-06-08',
                  'title': '精密齿轮行业龙头，布局减速器卡位机器人核心部件',
                  'analysts': '黄细里、郭雨蒙',
                  'rating': '买入（首次）',
                  'info_code': 'AP202506081687237738',
                  'min_pages': 20,
                  'classification': '公司深度研究/首次覆盖',
              },
              {
                  'broker': '开源证券',
                  'date': '2023-07-05',
                  'title': '公司首次覆盖报告：国内精锻齿轮龙头，战略转型赋能长期发展',
                  'analysts': '任浪、朱莹',
                  'rating': '买入（首次）',
                  'info_code': 'AP202307051592039048',
                  'min_pages': 20,
                  'classification': '公司首次覆盖报告',
              },
              {
                  'broker': '德邦证券',
                  'date': '2023-09-14',
                  'title': '差速器齿轮隐形冠军，多元布局注入成长新动能',
                  'analysts': '俞能飞',
                  'rating': '买入（首次）',
                  'info_code': 'AP202309151598691792',
                  'min_pages': 18,
                  'classification': '公司首次覆盖报告',
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Accept': 'application/pdf,*/*;q=0.8',
          })

          def safe_name(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', '_', text)
              return re.sub(r'\s+', '', text)[:110]

          manifest = []
          total_pages = 0
          for index, report in enumerate(reports, 1):
              detail_page = f"https://data.eastmoney.com/report/info/{report['info_code']}.html"
              data = None
              source_url = ''
              attempts = []
              for prefix in ('H3', 'H2', 'H1', 'H4'):
                  url = f"https://pdf.dfcfw.com/pdf/{prefix}_{report['info_code']}_1.pdf"
                  for attempt in range(6):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': detail_page,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          meta = {
                              'url': url,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          }
                          attempts.append(meta)
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 100_000:
                              data = response.content
                              source_url = url
                              break
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
                  if data is not None:
                      break
              if data is None:
                  raise RuntimeError(f"Download failed: {report['title']}: {attempts}")

              filename = f"{index:02d}_{safe_name(report['broker'])}_精锻科技_{safe_name(report['title'])}_{report['date']}.pdf"
              destination = PDF_DIR / filename
              destination.write_bytes(data)

              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < report['min_pages']:
                  raise RuntimeError(f'Unexpectedly short PDF {filename}: {pages} pages')
              total_pages += pages

              text = ''
              for page in reader.pages[:min(20, pages)]:
                  try:
                      text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              compact = re.sub(r'\s+', '', text)
              identity_hits = [value for value in (SHORT, FULL, CODE) if re.sub(r'\s+', '', value) in compact]
              broker_hits = [value for value in (report['broker'],) if re.sub(r'\s+', '', value) in compact]
              if len(compact) > 500 and not identity_hits:
                  raise RuntimeError(f'Issuer identity mismatch: {filename}')
              if len(compact) > 500 and not broker_hits:
                  raise RuntimeError(f'Broker identity mismatch: {filename}')

              subprocess.run(
                  ['qpdf', '--warning-exit-0', '--check', str(destination)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview_prefix = PREVIEW_DIR / destination.stem
              subprocess.run(
                  ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(destination), str(preview_prefix)],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
              )
              preview = Path(str(preview_prefix) + '.png')
              if not preview.exists() or preview.stat().st_size < 10_000:
                  raise RuntimeError(f'First-page render failed: {filename}')

              sha = hashlib.sha256(data).hexdigest()
              manifest.append({
                  **report,
                  'filename': str(Path('原始PDF') / filename),
                  'actual_pages': pages,
                  'bytes': len(data),
                  'sha256': sha,
                  'source_report_page': detail_page,
                  'source_pdf_url': source_url,
                  'identity_hits': identity_hits,
                  'broker_hits': broker_hits,
                  'preview_file': str(Path('首页预览') / preview.name),
                  'download_attempts': attempts,
                  'validation': [
                      'PDF header', 'issuer identity', 'broker identity',
                      'page count', 'qpdf structure', 'first-page render',
                  ],
              })

          readme = [
              '江苏太平洋精锻科技股份有限公司（300258.SZ）券商深度研究报告资料包',
              '整理日期：2026-10-28',
              '',
              '本包收录3份公开可直接取得的券商原始完整PDF。',
              '筛选口径：公司深度、首次覆盖或首次评级，优先不同券商与较长报告；未使用普通季报点评凑数。',
              '',
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f"{index}. {item['broker']}：《{item['title']}》",
                  f"   类型：{item['classification']}；日期：{item['date']}；分析师：{item['analysts']}；评级：{item['rating']}",
                  f"   完整页数：{item['actual_pages']}页；文件：{item['filename']}",
                  f"   来源页面：{item['source_report_page']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              f'合计：{len(manifest)}份PDF，{total_pages}页。',
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '已核验PDF文件头、公司名称/证券代码、券商名称、实际页数、文档结构、首页渲染、ZIP CRC和SHA-256。',
          ]

          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest),
              encoding='utf-8',
          )

          zip_cn = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_cn, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{ROOT.name}/{path.relative_to(ROOT)}')

          with zipfile.ZipFile(zip_cn) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != 3:
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}')

          zip_en = Path('jingduan_300258_broker_deep_reports.zip')
          zip_en.write_bytes(zip_cn.read_bytes())
          zip_sha = hashlib.sha256(zip_cn.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_cn, zip_cn.stat().st_size, 'SHA256', zip_sha)
          print('TOTAL_PAGES', total_pages)
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: jingduan-300258-broker-deep-reports-final
          path: |
            精锻科技_300258_券商深度报告_3份.zip
            jingduan_300258_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
