name: Quick probe Quantgroup report page sources 20260919
on:
  push:
    paths:
      - '.github/workflows/quantgroup-quick-source-probe-20260919.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Probe sources
        shell: bash
        run: |
          set -u
          urls=(
            'https://www.microbell.com/repinfodetail_5329571.html'
            'https://www.fxbaogao.com/detail/5553065'
            'https://www.baogaobox.com/reports/260817000115529.html'
            'https://www.valuelist.cn/871327.html'
            'https://pc.yanbaoke.cn/info/6MX8BtbPRRyVQpwC5LWfy9'
            'https://max.book118.com/html/2026/0712/6022231035012200.shtm'
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1)); f="page_$i.html"
            echo "===== PAGE $i $u ====="
            curl -k -L --http1.1 --connect-timeout 8 --max-time 25 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36' -e "$u" -sS -D "headers_$i.txt" -o "$f" "$u" || true
            cat "headers_$i.txt" | tail -n 30 || true
            wc -c "$f" || true
            echo '--- PDF/URL/endpoint lines ---'
            grep -ioE '.{0,250}(https?:)?//[^"'"'"' <>]+|.{0,300}(download|下载|pdf|fileurl|pdfurl|reportid|repinfo|preview|attachment|5329571|5553065).{0,500}' "$f" | head -n 300 || true
            echo '--- script src ---'
            grep -ioE '<script[^>]+src=["'"'"'][^"'"'"']+' "$f" | head -n 100 || true
          done
