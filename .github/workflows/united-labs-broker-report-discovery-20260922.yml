name: Discover United Laboratories broker report downloads 20260922

on:
  push:
    paths:
      - '.github/workflows/united-labs-broker-report-discovery-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install browser tools
        run: |
          python -m pip install --quiet playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Probe report pages and download actions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cat > /tmp/probe.py <<'PY'
          from __future__ import annotations
          import asyncio, json, re
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright, TimeoutError as PlaywrightTimeoutError

          TARGETS = [
              ('dongwu_902006', 'https://www.sdyanbao.com/detail/902006'),
              ('cmschina_920346', 'https://www.sdyanbao.com/detail/920346'),
              ('qingbaoyuan_cmschina', 'https://m.qingbaoyuan.vip/doc/142469/'),
              ('baogaobox_kysec', 'https://www.baogaobox.com/reports/250730000070021.html'),
          ]
          OUT = Path('out')

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  ctx = await browser.new_context(
                      viewport={'width': 1440, 'height': 1000},
                      locale='zh-CN',
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36',
                      accept_downloads=True,
                  )
                  for name, url in TARGETS:
                      page = await ctx.new_page()
                      net = []
                      console = []
                      downloads = []
                      page.on('response', lambda r, net=net: net.append({
                          'status': r.status,
                          'url': r.url,
                          'type': r.request.resource_type,
                          'content_type': r.headers.get('content-type', ''),
                          'content_length': r.headers.get('content-length', ''),
                      }))
                      page.on('console', lambda m, console=console: console.append({'type': m.type, 'text': m.text}))
                      rec = {'name': name, 'input_url': url}
                      try:
                          resp = await page.goto(url, wait_until='domcontentloaded', timeout=90000)
                          rec['status'] = resp.status if resp else None
                          await page.wait_for_timeout(12000)
                          rec['final_url'] = page.url
                          rec['title'] = await page.title()
                          rec['body_text'] = (await page.locator('body').inner_text())[:150000]
                          rec['html'] = (await page.content())[:1000000]
                          rec['cookies_before'] = await ctx.cookies()
                          rec['local_storage'] = await page.evaluate("Object.fromEntries(Object.entries(localStorage))")
                          rec['session_storage'] = await page.evaluate("Object.fromEntries(Object.entries(sessionStorage))")
                          rec['frames'] = [{'url': f.url, 'name': f.name} for f in page.frames]
                          rec['scripts'] = await page.locator('script').evaluate_all("els => els.map(e => ({src:e.src||'', text:(e.textContent||'').slice(0,20000)}))")
                          rec['links'] = await page.locator('a').evaluate_all("els => els.map(e => ({href:e.href, text:(e.innerText||'').trim(), download:e.download||''})).filter(x=>x.href)")
                          rec['images'] = await page.locator('img').evaluate_all("els => els.map(e => ({src:e.currentSrc||e.src, alt:e.alt||'', w:e.naturalWidth, h:e.naturalHeight})).filter(x=>x.src)")
                          rec['buttons'] = await page.locator('button,[role=button],a').evaluate_all("els => els.map((e,i)=>({i,tag:e.tagName,text:(e.innerText||e.textContent||'').trim(),href:e.href||'',cls:e.className||''})).filter(x=>x.text)")
                          await page.screenshot(path=str(OUT/f'{name}_before.png'), full_page=True)
                          (OUT/f'{name}.html').write_text(await page.content(), encoding='utf-8')

                          # Click all visible download-like controls one by one, preserving session.
                          loc = page.get_by_text(re.compile('立即下载|下载报告|下载PDF|免费下载|下载文档'))
                          count = await loc.count()
                          rec['download_control_count'] = count
                          click_results = []
                          for idx in range(min(count, 6)):
                              el = loc.nth(idx)
                              if not await el.is_visible():
                                  continue
                              click_rec = {'index': idx, 'text': (await el.inner_text())[:200]}
                              try:
                                  async with page.expect_download(timeout=7000) as di:
                                      await el.click(timeout=15000)
                                  dl = await di.value
                                  suggested = dl.suggested_filename
                                  outpath = OUT/f'{name}_download_{idx}_{suggested}'
                                  await dl.save_as(str(outpath))
                                  click_rec.update({'download': str(outpath.name), 'suggested': suggested, 'url': dl.url, 'failure': await dl.failure()})
                                  downloads.append(click_rec)
                              except PlaywrightTimeoutError:
                                  try:
                                      await page.wait_for_timeout(3000)
                                      click_rec.update({'after_url': page.url, 'body_after': (await page.locator('body').inner_text())[-5000:]})
                                  except Exception as e:
                                      click_rec['post_error'] = repr(e)
                              except Exception as e:
                                  click_rec['error'] = repr(e)
                              click_results.append(click_rec)
                          rec['click_results'] = click_results
                          rec['cookies_after'] = await ctx.cookies()
                          await page.screenshot(path=str(OUT/f'{name}_after.png'), full_page=True)
                      except Exception as e:
                          rec['error'] = repr(e)
                          try:
                              await page.screenshot(path=str(OUT/f'{name}_error.png'), full_page=True)
                          except Exception:
                              pass
                      rec['network'] = net
                      rec['console'] = console
                      rec['downloads'] = downloads
                      (OUT/f'{name}.json').write_text(json.dumps(rec, ensure_ascii=False, indent=2), encoding='utf-8')
                      await page.close()
                  await browser.close()
          asyncio.run(main())
          PY
          python /tmp/probe.py
          grep -RInE 'https?[^[:space:]"'\''<>]+\.pdf|download|fileUrl|pdfUrl|oss|cos|report|preview|api/' out > out/grep_hits.txt || true
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > out/file_sizes.txt

      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: united-labs-broker-report-discovery
          path: out
          retention-days: 7
          if-no-files-found: error
          compression-level: 6
