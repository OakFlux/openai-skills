name: Fast Eastmoney probe for Zhejiang Expressway 20260906

on:
  push:
    paths:
      - '.github/workflows/zhejiang-expressway-eastmoney-fast-probe-20260906.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Query public Eastmoney report services
        shell: bash
        run: |
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          endpoints=[]
          base='https://reportapi.eastmoney.com/report/list'
          for code in ['00576','0576','576','HK00576','HK0576']:
            for qtype in ['0','1','2']:
              endpoints.append((f'list_{code}_{qtype}',base,{'pageSize':'100','pageNo':'1','stockCode':code,'qType':qtype,'beginTime':'2018-01-01','endTime':'2026-09-06','fields':'','orgCode':'','author':''}))
          endpoints += [
            ('suggest','https://searchapi.eastmoney.com/api/suggest/get',{'input':'浙江沪杭甬','type':'14','token':'D43BF722C8E33BDC906FB84D85E326E8'}),
            ('suggest0','https://searchapi.eastmoney.com/api/suggest/get',{'input':'浙江沪杭甬','type':'0','token':'D43BF722C8E33BDC906FB84D85E326E8'}),
          ]
          for label,url,p in endpoints:
            full=url+'?'+urllib.parse.urlencode(p)
            req=urllib.request.Request(full,headers={'User-Agent':UA,'Referer':'https://data.eastmoney.com/report/','Accept':'application/json,text/plain,*/*'})
            try:
              with urllib.request.urlopen(req,timeout=45) as r:
                b=r.read(); print('\n===',label,r.status,r.headers.get('content-type'),len(b),r.geturl(),'===',flush=True)
                txt=b.decode('utf-8','replace')
                print(txt[:60000],flush=True)
            except Exception as e: print('\n===',label,'ERROR',repr(e),'===',flush=True)
          PY
