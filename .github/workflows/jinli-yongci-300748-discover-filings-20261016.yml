name: Discover Jinli Yongci filings 20261016
on:
  push:
    paths:
      - '.github/workflows/jinli-yongci-300748-discover-filings-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Query Eastmoney announcement API
        run: |
          python - <<'PY'
          import json, requests
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/notices/stock/300748.html'})
          endpoint='https://np-anotice-stock.eastmoney.com/api/security/ann'
          all_rows=[]
          for page in range(1,31):
              params={
                  'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A',
                  'client_source':'web','stock_list':'300748','f_node':'0','s_node':'0'
              }
              r=s.get(endpoint,params=params,timeout=30)
              print('PAGE',page,'STATUS',r.status_code,'LEN',len(r.content),'URL',r.url)
              r.raise_for_status()
              obj=r.json()
              rows=(obj.get('data') or {}).get('list') or []
              print('ROWS',len(rows))
              if not rows: break
              all_rows.extend(rows)
              if len(rows)<100: break
          print('TOTAL',len(all_rows))
          keys=('年度报告','第一季度报告','第三季度报告','一季度报告','三季度报告')
          for rec in all_rows:
              title=(rec.get('title') or '').strip()
              if any(k in title for k in keys):
                  keep={k:rec.get(k) for k in ('art_code','title','notice_date','display_time','attach_url','eiTime','codes','columns')}
                  print('CANDIDATE',json.dumps(keep,ensure_ascii=False,sort_keys=True))
          PY
