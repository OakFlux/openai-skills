name: chatgpt-temp-lesso-final-three-rerun-20260908
on:
  push:
    paths:
      - '.github/workflows/chatgpt-temp-lesso-final-three-rerun-20260908.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse verified build script with corrected Haitong threshold
        shell: bash
        run: |
          python -m pip install --quiet playwright pypdf pymupdf pillow
          python <<'EXTRACT'
          from pathlib import Path
          src=Path('.github/workflows/chatgpt-temp-lesso-final-three-20260908.yml').read_text(encoding='utf-8').splitlines()
          code=[]; inside=False
          for line in src:
              if line.strip()=="python <<'PY'":
                  inside=True
                  continue
              if inside and line.strip()=='PY':
                  break
              if inside:
                  code.append(line[10:] if line.startswith('          ') else line)
          text='\n'.join(code)+'\n'
          old="rec=validate(out,r,2,1800)"
          new="rec=validate(out,r,2,1200)"
          if old not in text:
              raise SystemExit('Expected validation threshold not found')
          Path('/tmp/lesso_final_three.py').write_text(text.replace(old,new),encoding='utf-8')
          EXTRACT
          python /tmp/lesso_final_three.py
      - uses: actions/upload-artifact@v4
        with:
          name: China-Lesso-02128-Broker-Deep-Reports-Public-3-Final
          path: |
            lesso_final_three_work/China_Lesso_02128_Broker_Deep_Reports_Public_3.zip
            lesso_final_three_work/zip_metadata.json
            lesso_final_three_work/run.log
            lesso_final_three_work/qa
          retention-days: 1
          compression-level: 0
