name: Locate Makeng Mining report ID in Reportify

on:
  push:
    paths:
      - '.github/workflows/makeng-601123-reportify-page-scan-20261104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Scan report pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,requests,time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Connection':'close'})
          needles=['马矿股份','国内领先的重点独立地采铁矿山企业','IPO专题：新股精要']
          for page in range(1,61):
            url=f'https://reportify.cn/reports?page={page}&report_region=&report_types=9'
            try:
              r=s.get(url,timeout=45,allow_redirects=True)
              print('PAGE',page,r.status_code,len(r.content),r.url,flush=True)
              text=r.text
              if any(n in text for n in needles):
                print('TARGET_PAGE',page,flush=True)
                soup=BeautifulSoup(text,'html.parser')
                for a in soup.find_all('a',href=True):
                  label=' '.join(a.get_text(' ',strip=True).split())
                  full=urljoin(r.url,a['href'])
                  if any(n in label for n in needles) or ('/reports/' in full and any(n in str(a.parent) for n in needles)):
                    print('TARGET_LINK',json.dumps({'label':label,'url':full},ensure_ascii=False),flush=True)
                raw=text.replace('\\/','/')
                for n in needles:
                  start=0
                  while True:
                    i=raw.find(n,start)
                    if i<0: break
                    chunk=raw[max(0,i-5000):i+5000]
                    print('TARGET_CHUNK',n,chunk,flush=True)
                    for m in re.finditer(r'/reports/([0-9]{10,})',chunk): print('NEAR_REPORT_ID',m.group(1),flush=True)
                    for m in re.finditer(r'"report_id"\s*:\s*"?([0-9]{10,})',chunk): print('NEAR_JSON_REPORT_ID',m.group(1),flush=True)
                    start=i+len(n)
                break
              time.sleep(.08)
            except Exception as e: print('ERROR',page,repr(e),flush=True)
          PY
