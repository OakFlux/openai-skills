name: Search FXBaogao for QuantGroup reports 20260920

on:
  push:
    paths:
      - '.github/workflows/quantgroup-fxbaogao-search-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - shell: bash
        run: |
          set -euo pipefail
          mkdir out
          python - <<'PY'
          import requests,json
          from bs4 import BeautifulSoup
          from urllib.parse import urlencode,urljoin
          from pathlib import Path
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          qs=['量化派','AI战略发展赋能线上消费基本盘','智能硬件打开增长新范式']
          res=[]
          for i,q in enumerate(qs):
            u='https://www.fxbaogao.com/rp?'+urlencode({'keywords':q,'order':2,'nop':-1})
            try:
              r=s.get(u,timeout=(15,60),allow_redirects=True)
              Path(f'out/search_{i}.html').write_bytes(r.content)
              soup=BeautifulSoup(r.content,'lxml')
              links=[]
              for a in soup.find_all('a',href=True):
                text=a.get_text(' ',strip=True)
                href=urljoin(r.url,a['href'])
                if '/detail/' in href or '/view?' in href or '量化派' in text or 'AI战略' in text or '智能硬件' in text:
                  links.append({'text':text,'href':href})
              res.append({'q':q,'url':u,'status':r.status_code,'final':r.url,'title':soup.title.get_text(' ',strip=True) if soup.title else '','links':links})
            except Exception as e: res.append({'q':q,'error':repr(e)})
          Path('out/results.json').write_text(json.dumps(res,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quantgroup-fxbaogao-search
          path: out
          retention-days: 7
