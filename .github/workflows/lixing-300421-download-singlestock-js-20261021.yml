name: Download Eastmoney singlestock JS for Lixing 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-300421-download-singlestock-js-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download JavaScript and extract contexts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          import urllib.request

          url='https://data.eastmoney.com/newstatic/js/report/singlestock.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/300421.html'})
          data=urllib.request.urlopen(req,timeout=60).read()
          Path('singlestock.js').write_bytes(data)
          text=data.decode('utf-8','replace')
          contexts=[]
          terms=['report/list','reportapi','stockCode','qType','beginTime','endTime','pageSize','encodeUrl','infoCode','fetch(','ajax','jQuery.ajax','$.ajax','datatable','DataTable']
          for term in terms:
              for m in re.finditer(re.escape(term),text,re.I):
                  a=max(0,m.start()-1200); b=min(len(text),m.end()+2200)
                  contexts.append(f'\n\n===== TERM {term} AT {m.start()} =====\n{text[a:b]}')
                  if sum(1 for x in contexts if f'TERM {term} ' in x)>=10:
                      break
          Path('singlestock_contexts.txt').write_text(''.join(contexts),encoding='utf-8')
          print('JS_BYTES',len(data),'CONTEXT_CHARS',sum(len(x) for x in contexts))
          PY

      - name: Upload JS files
        uses: actions/upload-artifact@v4
        with:
          name: lixing-singlestock-js
          path: |
            singlestock.js
            singlestock_contexts.txt
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
