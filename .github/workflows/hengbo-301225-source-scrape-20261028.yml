name: Scrape Hengbo 301225 report source pages 20261028

on:
  push:
    paths:
      - '.github/workflows/hengbo-301225-source-scrape-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Scrape source pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, html, urllib.parse, json
          import requests
          from bs4 import BeautifulSoup

          urls=[
            'https://www.sdyanbao.com/detail/937833',
            'https://www.fhyanbao.com/rpview/1920166',
            'https://fxbaogao.com/detail/5106156',
            'https://www.hibor.com.cn/wap_detail.aspx?id=5119519',
            'https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/827734380241/index.phtml',
            'https://data.eastmoney.com/report/info/AP202511241787234946.html'
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          for u in urls:
            print('\n===PAGE',u,'===')
            try:
              r=s.get(u,timeout=(20,120),allow_redirects=True)
              print('STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'CTYPE',r.headers.get('content-type'))
              text=r.text
              print('HEAD',repr(text[:300]))
              soup=BeautifulSoup(text,'html.parser')
              found=[]
              for tag in soup.find_all(True):
                for attr in ('href','src','data-url','data-href','data-src','download','value'):
                  v=tag.get(attr)
                  if not v: continue
                  v=html.unescape(str(v)).replace('\\/','/')
                  full=urllib.parse.urljoin(r.url,v)
                  low=full.lower()
                  if any(k in low for k in ['.pdf','download','attach','file','report','document','resource']):
                    found.append((tag.name,attr,full))
              for pat in [r'https?://[^"\'<>\s]+', r'[^"\'<>\s]+\.pdf(?:\?[^"\'<>\s]*)?']:
                for m in re.findall(pat,text,flags=re.I):
                  full=urllib.parse.urljoin(r.url,html.unescape(m).replace('\\/','/'))
                  if any(k in full.lower() for k in ['.pdf','download','attach','file','report','document','resource']):
                    found.append(('regex','url',full))
              seen=set()
              for item in found:
                if item[2] in seen: continue
                seen.add(item[2]); print('LINK',item)
              scripts=[]
              for src in [x.get('src') for x in soup.find_all('script') if x.get('src')]:
                scripts.append(urllib.parse.urljoin(r.url,src))
              print('SCRIPTS',json.dumps(scripts[:30],ensure_ascii=False))
            except Exception as e:
              print('ERROR',repr(e))
          PY
