name: Probe exact Huabao report titles and public PDFs

on:
  push:
    branches:
      - chatgpt-huabao-international-reports-20260907
    paths:
      - '.github/workflows/chatgpt-huabao-exact-sdyanbao-pdf-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf
      - name: Query exact titles and validate PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from __future__ import annotations
          import io, json, re, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/','Origin':'https://www.sdyanbao.com','device':'1'})
          api='https://api.sdyanbao.com/api/file/search'
          phrases=[
            '香精行业龙头，业务结构多元',
            '香精行业龙头 业务结构多元',
            '经营拐点显现，多元业务矩阵共驱成长',
            '经营拐点显现 多元业务矩阵共驱成长',
            '历尽千帆，涅槃重生',
            '历尽千帆 涅槃重生',
            '轻装上阵、全面出海，盈利拐点与价值重估起点',
            '轻装上阵 全面出海 盈利拐点 价值重估',
            '真实业绩成色靓丽，海外业务快速崛起',
            '业绩进入持续改善期，烟用原料静待绽放',
            '华宝国际 00336',
          ]
          found={}; qlog=[]
          for phrase in phrases:
            for only in (1,0):
              body={'device':1,'hideTrader':0,'onlyTitle':only,'order':0,'page':1,'pageSize':100,'keyword':phrase,'pageCount':'','dateRange':'','startTime':'','endTime':'','typeIds':[],'industryIds':[],'opFrom':1}
              try:
                r=s.post(api,json=body,timeout=(10,60)); r.raise_for_status(); j=r.json()
                rows=(j.get('data') or {}).get('files') or []
                total=int((j.get('data') or {}).get('total') or 0)
                print('QUERY',repr(phrase),'ONLY',only,'ROWS',len(rows),'TOTAL',total,flush=True)
                qlog.append({'phrase':phrase,'only':only,'rows':len(rows),'total':total})
                for x in rows:
                  blob=json.dumps(x,ensure_ascii=False).replace(' ','').lower()
                  if any(t in blob for t in ['华宝国际','華寶國際','00336','0336.hk','历尽千帆','涅槃重生','轻装上阵','香精行业龙头','经营拐点显现','真实业绩成色靓丽','烟用原料静待绽放']):
                    found[str(x.get('id'))]=x
              except Exception as e:
                print('FAIL',repr(phrase),only,repr(e),flush=True)
                qlog.append({'phrase':phrase,'only':only,'error':repr(e)})
              time.sleep(.2)

          compact=[]
          for x in found.values():
            compact.append({
              'id':x.get('id'),'name':x.get('name'),'date':x.get('time_text'),'page_count':x.get('page_count'),
              'page_url':x.get('page_url'),'share_url':x.get('share_url'),'organization':(x.get('organization') or {}).get('name'),
              'researcher':(x.get('researcher') or {}).get('name'),'type':(x.get('type') or {}).get('name'),
              'stock':x.get('stock'),'data_source':x.get('data_source'),'data_source_uuid':x.get('data_source_uuid')
            })
          compact.sort(key=lambda x:(x.get('date') or '',x.get('page_count') or 0),reverse=True)
          print('RESULTS',json.dumps(compact,ensure_ascii=False,indent=2),flush=True)

          probes=[]
          for x in compact:
            uuid=str(x.get('data_source_uuid') or '')
            if not uuid.startswith('AP'): continue
            for prefix in ('H3','H2'):
              url=f'https://pdf.dfcfw.com/pdf/{prefix}_{uuid}_1.pdf'
              try:
                r=s.get(url,timeout=(10,90),allow_redirects=True)
                ok=r.status_code==200 and b'%PDF' in r.content[:4096] and len(r.content)>50000
                pages=None; text_prefix=''
                if ok:
                  reader=PdfReader(io.BytesIO(r.content),strict=False); pages=len(reader.pages)
                  text_prefix=''.join((p.extract_text() or '') for p in reader.pages[:2])[:1200]
                rec={'title':x.get('name'),'uuid':uuid,'url':url,'status':r.status_code,'bytes':len(r.content),'ok':ok,'pages':pages,'text_prefix':text_prefix}
                probes.append(rec)
                print('PDF',json.dumps(rec,ensure_ascii=False),flush=True)
                if ok: break
              except Exception as e:
                rec={'title':x.get('name'),'uuid':uuid,'url':url,'error':repr(e)}
                probes.append(rec); print('PDF_FAIL',json.dumps(rec,ensure_ascii=False),flush=True)
          Path('out/query_log.json').write_text(json.dumps(qlog,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/results.json').write_text(json.dumps(compact,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('out/pdf_probes.json').write_text(json.dumps(probes,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: huabao-exact-sdyanbao-pdf-probe
          path: out/
          retention-days: 3
          if-no-files-found: error
