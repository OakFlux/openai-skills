name: Inspect SGPJBG viewer script

on:
  pull_request:
    paths:
      - 'tasks/inspect-sgpjbg-viewer-js-20261006.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect viewer JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          from pathlib import Path
          import requests
          url='https://cache.sgpjbg.com/master/view/view2.js'
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/152 Safari/537.36','Referer':'https://www.sgpjbg.com/'})
          r=s.get(url,timeout=(20,90));print(r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True);r.raise_for_status()
          Path('output/view2.js').write_bytes(r.content)
          print(r.text[:200000],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sgpjbg-viewer-js
          path: output/view2.js
          retention-days: 7
          if-no-files-found: error
