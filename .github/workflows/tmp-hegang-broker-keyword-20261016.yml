name: Query Hegang broker reports by company name

on:
  push:
    branches: [tmp-hegang-000709-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hegang-broker-keyword-20261016.yml']

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query reports
        run: |
          curl --http1.1 -fL --retry 5 --retry-all-errors -A 'Mozilla/5.0' \
            -e 'https://data.eastmoney.com/report/' \
            'https://reportapi.eastmoney.com/report/list?cb=datatable1&industryCode=*&pageSize=500&industry=*&rating=*&ratingChange=*&beginTime=2010-01-01&endTime=2026-10-16&pageNo=1&fields=&qType=1&orgCode=&code=&keyWord=%E6%B2%B3%E9%92%A2%E8%82%A1%E4%BB%BD&rcode=' \
            -o reports.jsonp
          python3 - <<'PY'
          import json,re
          text=open('reports.jsonp',encoding='utf-8').read()
          data=json.loads(re.sub(r'^datatable\d*\(|\)$','',text))
          rows=data.get('data') or []
          print('HITS',data.get('hits'),'ROWS',len(rows))
          rows.sort(key=lambda x:x.get('publishDate') or '',reverse=True)
          for x in rows:
              print(str(x.get('publishDate',''))[:10],x.get('orgSName') or x.get('orgName'),x.get('attachPages'),x.get('infoCode'),x.get('stockCode'),x.get('stockName'),x.get('title'))
          PY
