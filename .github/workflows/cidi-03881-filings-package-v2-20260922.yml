name: Build CiDi 03881 filings package v2 20260922

on:
  push:
    paths:
      - '.github/workflows/cidi-03881-filings-package-v2-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf pillow

      - name: Download official HKEX filings, validate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          import tempfile
          import time
          import zipfile
          from pathlib import Path

          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '希迪智驾_03881_招股说明书_2025年报_2026中期报告'
          out = Path(PACKAGE)
          out.mkdir(exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Referer': 'https://www1.hkexnews.hk/',
          })

          docs = [
              {
                  'filename': '01_希迪智驾_03881_最终招股说明书_中文版_2025-12-11.pdf',
                  'title': '希迪智驾最终招股说明书（中文版）',
                  'date': '2025-12-11',
                  'type': 'prospectus',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1211/2025121100008_c.pdf',
                  'min_bytes': 5_000_000,
                  'min_pages': 400,
              },
              {
                  'filename': '02_CiDi_03881_Final_Prospectus_English_2025-12-11.pdf',
                  'title': 'CiDi final prospectus (English)',
                  'date': '2025-12-11',
                  'type': 'prospectus',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2025/1211/2025121100007.pdf',
                  'min_bytes': 5_000_000,
                  'min_pages': 400,
              },
              {
                  'filename': '03_希迪智驾_03881_2025年年度报告_中文版_2026-04-17.pdf',
                  'title': '希迪智驾2025年年度报告（中文版）',
                  'date': '2026-04-17',
                  'type': 'annual_report',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0417/2026041701290_c.pdf',
                  'min_bytes': 3_000_000,
                  'min_pages': 120,
              },
              {
                  'filename': '04_CiDi_03881_2025_Annual_Report_English_2026-04-17.pdf',
                  'title': 'CiDi 2025 Annual Report (English)',
                  'date': '2026-04-17',
                  'type': 'annual_report',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0417/2026041701289.pdf',
                  'min_bytes': 3_000_000,
                  'min_pages': 120,
              },
              {
                  'filename': '05_希迪智驾_03881_2026年中期报告_中文版_2026-08-10.pdf',
                  'title': '希迪智驾2026年中期报告（中文版）',
                  'date': '2026-08-10',
                  'type': 'interim_report',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0810/2026081000437_c.pdf',
                  'min_bytes': 2_000_000,
                  'min_pages': 50,
              },
              {
                  'filename': '06_CiDi_03881_2026_Interim_Report_English_2026-08-10.pdf',
                  'title': 'CiDi 2026 Interim Report (English)',
                  'date': '2026-08-10',
                  'type': 'interim_report',
                  'url': 'https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0810/2026081000436.pdf',
                  'min_bytes': 2_000_000,
                  'min_pages': 50,
              },
          ]

          def url_variants(url: str) -> list[str]:
              vals = [url]
              if 'www1.hkexnews.hk' in url:
                  vals.append(url.replace('www1.hkexnews.hk', 'www.hkexnews.hk'))
              elif 'www.hkexnews.hk' in url:
                  vals.append(url.replace('www.hkexnews.hk', 'www1.hkexnews.hk'))
              return list(dict.fromkeys(vals))

          def download_pdf(url: str, dest: Path, min_bytes: int) -> str:
              errors: list[str] = []
              for candidate in url_variants(url):
                  for attempt in range(1, 5):
                      tmp = dest.with_suffix(dest.suffix + '.part')
                      try:
                          with session.get(candidate, timeout=(30, 420), allow_redirects=True, stream=True) as r:
                              print('DOWNLOAD', dest.name, attempt, r.status_code, candidate, 'final', r.url, flush=True)
                              r.raise_for_status()
                              with tmp.open('wb') as fh:
                                  for chunk in r.iter_content(chunk_size=1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = tmp.stat().st_size
                          with tmp.open('rb') as fh:
                              head = fh.read(8)
                          if size < min_bytes or not head.startswith(b'%PDF-'):
                              raise RuntimeError(f'invalid PDF response size={size} head={head!r}')
                          tmp.replace(dest)
                          return str(r.url)
                      except Exception as exc:
                          errors.append(f'{candidate} attempt {attempt}: {exc!r}')
                          tmp.unlink(missing_ok=True)
                          time.sleep(attempt * 2)
              raise RuntimeError(f'download failed for {dest.name}: {errors}')

          def render_check(pdf_path: Path, pages: int) -> list[int]:
              sample_pages = sorted(set([1, max(1, pages // 2), pages]))
              with tempfile.TemporaryDirectory(prefix='render-check-') as td:
                  temp_dir = Path(td)
                  for page_no in sample_pages:
                      prefix = temp_dir / f'p{page_no}'
                      run = subprocess.run(
                          ['pdftoppm', '-f', str(page_no), '-l', str(page_no), '-singlefile', '-r', '72', '-png', str(pdf_path), str(prefix)],
                          capture_output=True,
                          text=True,
                          timeout=180,
                      )
                      if run.returncode != 0:
                          raise RuntimeError(f'pdftoppm failed: {pdf_path.name} page {page_no}: {run.stderr[-1500:]}')
                      image_path = prefix.with_suffix('.png')
                      if not image_path.exists() or image_path.stat().st_size < 3000:
                          raise RuntimeError(f'rendered image missing or too small: {pdf_path.name} page {page_no}')
                      with Image.open(image_path) as image:
                          image.verify()
                      with Image.open(image_path) as image:
                          width, height = image.size
                      if width < 300 or height < 300:
                          raise RuntimeError(f'render dimensions too small: {width}x{height}')
              return sample_pages

          records: list[dict] = []
          seen_hashes: set[str] = set()
          for doc in docs:
              dest = out / doc['filename']
              final_url = download_pdf(doc['url'], dest, doc['min_bytes'])
              reader = PdfReader(str(dest), strict=False)
              if reader.is_encrypted:
                  raise RuntimeError(f'encrypted PDF not accepted: {dest.name}')
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {dest.name}: {pages}')

              sample_text = ''
              for page in reader.pages[:min(25, pages)]:
                  try:
                      sample_text += '\n' + (page.extract_text() or '')
                  except Exception:
                      pass
              lower = sample_text.lower()
              identity_ok = any(term.lower() in lower for term in ('03881', '3881', 'cidi inc', 'cidi', '希迪智駕', '希迪智驾'))
              if not identity_ok:
                  raise RuntimeError(f'company identity could not be verified: {dest.name}')

              check = subprocess.run(['qpdf', '--check', str(dest)], capture_output=True, text=True)
              if check.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf check failed for {dest.name}: {check.stderr[-2000:]}')

              rendered_pages = render_check(dest, pages)
              data = dest.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              if sha in seen_hashes:
                  raise RuntimeError(f'duplicate PDF detected: {dest.name}')
              seen_hashes.add(sha)
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'document_type': doc['type'],
                  'disclosure_date': doc['date'],
                  'source': '香港交易所披露易（HKEXnews）',
                  'source_url': final_url,
                  'pages': pages,
                  'render_checked_pages': rendered_pages,
                  'bytes': len(data),
                  'sha256': sha,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          readme = [
              '希迪智驾科技股份有限公司（CiDi Inc.，03881.HK）港股披露文件资料包',
              '整理日期：2026-09-22',
              '',
              '收录范围：最终招股说明书、上市后全部完整年度报告，以及截至整理日最新完整阶段性财务报告。',
              '公司于2025年12月19日在香港联交所主板上市，因此截至2026年9月22日，上市后完整年度报告只有2025年年度报告。',
              '香港主板公司通常不按A股口径强制发布第一、第三季度报告。截至整理日，最新完整阶段性财务报告为2026年8月10日发布的《2026年中期报告》。本包按原始披露类型收录，不将中期报告误标为季度报告。',
              '最终招股说明书、2025年年度报告和2026年中期报告均收录中英文港交所官方PDF原件。',
              '',
              '文件清单：',
          ]
          for i, rec in enumerate(records, 1):
              readme.extend([
                  f"{i}. {rec['title']}",
                  f"   文件：{rec['filename']}",
                  f"   披露日期：{rec['disclosure_date']}；页数：{rec['pages']}；大小：{rec['bytes']/1048576:.2f} MB",
                  f"   抽样渲染核验页：{', '.join(str(x) for x in rec['render_checked_pages'])}",
                  f"   来源：{rec['source_url']}",
                  f"   SHA-256：{rec['sha256']}",
                  '',
              ])
          readme.append('完整性核验：PDF文件头、公司及证券代码身份、实际页数、非加密状态、qpdf结构检查、首/中/末页抽样渲染、文件去重、ZIP CRC及SHA-256校验。')
          (out / '00_文件清单与披露口径说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as zf:
              for path in sorted(out.iterdir()):
                  zf.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as zf:
              bad = zf.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: ' + bad)
              pdfs = [name for name in zf.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != 6:
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)}')
          zip_sha = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          print('FINAL_ZIP', zip_path, zip_path.stat().st_size, 'PDF_COUNT', len(pdfs), 'SHA256', zip_sha, flush=True)
          print('FINAL_MANIFEST', json.dumps(records, ensure_ascii=False, indent=2), flush=True)
          PY

      - name: Upload final ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: cidi-03881-filings-final-v2
          path: 希迪智驾_03881_招股说明书_2025年报_2026中期报告.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
