name: Package LuKang 600789 broker reports final 20261015

on:
  push:
    paths:
      - '.github/workflows/lukang-600789-broker-reports-final-20261015.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='鲁抗医药_600789_券商研究报告_公开完整版_3份_截至20261015'
          root=Path(package); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)
          reports=[
            {
              'broker':'西南证券','date':'2018-02-09','analysts':'朱国广、周平','rating':'买入',
              'title':'需求侧和供给侧共振，兽用抗生素量价齐升',
              'info_code':'AP201802091089674376','expected_pages':5,
              'filename':'01_西南证券_20180209_需求侧和供给侧共振_兽用抗生素量价齐升_完整版.pdf'
            },
            {
              'broker':'西南证券','date':'2018-01-26','analysts':'朱国广、周平','rating':'买入',
              'title':'环保趋严及竞争对手停产，公司受益显著',
              'info_code':'AP201801261082649325','expected_pages':5,
              'filename':'02_西南证券_20180126_环保趋严及竞争对手停产_公司受益显著_完整版.pdf'
            },
            {
              'broker':'联讯证券','date':'2018-08-27','analysts':'于庭泽','rating':'增持',
              'title':'鲁抗医药中报点评：泰乐菌素行业格局突变，公司未来业绩可期',
              'info_code':'AP201808271183521170','expected_pages':4,
              'filename':'03_联讯证券_20180827_泰乐菌素行业格局突变_公司未来业绩可期_完整版.pdf'
            }
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Referer':'https://data.eastmoney.com/report/600789.html',
            'Accept-Language':'zh-CN,zh;q=0.9'
          })

          def download(info_code:str):
            urls=[
              f'https://pdf.dfcfw.com/pdf/H3_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H2_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H1_{info_code}_1.pdf',
              f'https://pdf.dfcfw.com/pdf/H4_{info_code}_1.pdf',
            ]
            last={}
            for url in urls:
              for attempt in range(5):
                try:
                  r=s.get(url,timeout=(25,180),allow_redirects=True,headers={
                    'User-Agent':s.headers['User-Agent'],
                    'Referer':f'https://data.eastmoney.com/report/info/{info_code}.html',
                    'Accept':'application/pdf,*/*;q=0.8'
                  })
                  last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type','')}
                  if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>50000:
                    return r.content,url,last
                except Exception as e:
                  last={'url':url,'error':repr(e)}
                time.sleep(1+attempt)
            raise RuntimeError(f'download failed {info_code}: {last}')

          manifest=[]
          for r in reports:
            data,url,dl=download(r['info_code'])
            dest=root/r['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages < 4:
              raise RuntimeError(f'too few pages {dest.name}: {pages}')
            text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(8,pages)])
            compact=re.sub(r'\s+','',text)
            if not any(x in compact for x in ['鲁抗医药','山东鲁抗医药','600789']):
              txt=dest.with_suffix('.txt')
              subprocess.run(['pdftotext',str(dest),str(txt)],check=False,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if txt.exists(): compact+=re.sub(r'\s+','',txt.read_text(encoding='utf-8',errors='ignore'))
            if not any(x in compact for x in ['鲁抗医药','山东鲁抗医药','600789']):
              raise RuntimeError(f'issuer mismatch: {dest.name}')
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix)+'.png')
            if not preview.exists() or preview.stat().st_size<8000:
              raise RuntimeError(f'preview failed: {dest.name}')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({
              **r,
              'source_report_page':f"https://data.eastmoney.com/report/info/{r['info_code']}.html",
              'pdf_url':url,'actual_pages':pages,'bytes':len(data),'sha256':sha,
              'download_meta':dl,'preview_file':str(Path('首页预览')/preview.name),
              'document_nature':'券商公开原始PDF',
              'validation':['PDF header','issuer identity','page count','qpdf structure','first-page render']
            })

          readme=[
            '山东鲁抗医药股份有限公司（600789.SH）券商研究报告公开完整版资料包',
            '整理日期：2026-10-15','',
            '本包收录3份公开渠道可直接取得的券商原始PDF。经检索，公开接口仅收录4份鲁抗医药个股研报，均为2018年的4—5页公司研究或业绩点评；未发现可公开直接下载的15页以上标准长篇深度报告。',
            '本包优先保留投资逻辑较完整、观点差异较大且PDF结构正常的3份。',''
          ]
          for i,x in enumerate(manifest,1):
            readme += [
              f"{i}. {x['broker']}：《{x['title']}》",
              f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",
              f"   页数：{x['actual_pages']}页；文件：{x['filename']}",
              f"   来源页面：{x['source_report_page']}",
              f"   SHA-256：{x['sha256']}",''
            ]
          readme += [
            '报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
            '核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')

          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=3:
              raise RuntimeError(f'zip validation failed bad={bad} pdfs={len(pdfs)}')
          Path('lukang_broker_reports_3.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: lukang-600789-broker-reports-final-20261015
          path: |
            鲁抗医药_600789_券商研究报告_公开完整版_3份_截至20261015.zip
            lukang_broker_reports_3.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
