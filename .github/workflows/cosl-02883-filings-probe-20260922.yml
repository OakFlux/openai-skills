name: Probe COSL 02883 filing archive 20260922
on:
  push:
    paths:
      - '.github/workflows/cosl-02883-filings-probe-20260922.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Parse HKEX archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-HK,zh;q=0.9,en;q=0.8'})
          base='https://www1.hkexnews.hk/search/titlesearch.xhtml?category=0&market=SEHK&stockId=4651'
          for lang in ('EN','ZH'):
              u=base+'&lang='+lang
              r=s.get(u,timeout=(30,180)); r.raise_for_status()
              print('\n===',lang,'STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,flush=True)
              soup=BeautifulSoup(r.text,'html.parser')
              rows=[]
              for a in soup.find_all('a',href=True):
                  label=' '.join(a.get_text(' ',strip=True).split())
                  href=urljoin(r.url,a['href'])
                  low=label.lower()
                  if ('annual report' in low or '年報' in label or '年度報告' in label or 'global offering' in low or 'prospectus' in low or '招股' in label or '全球發售' in label or 'quarterly report' in low or '季度報告' in label or 'interim report' in low or '中期報告' in label):
                      rows.append((label,href))
              # de-duplicate while preserving order
              seen=set(); out=[]
              for x in rows:
                  if x not in seen:
                      seen.add(x); out.append(x)
              print('MATCH_COUNT',len(out),flush=True)
              for label,href in out:
                  print('DOC',repr(label),href,flush=True)
          PY