name: Temporary Publish Melco Report Package

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-publish-melco-package.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/melco-international-reports-20260831
          fetch-depth: 0

      - name: Wait for resolver run and download package
        shell: bash
        run: |
          set -euo pipefail
          workflow='tmp-resolve-package-melco-pdfs.yml'
          run_id=''
          for i in $(seq 1 90); do
            run_id=$(gh run list --workflow "$workflow" --branch tmp/melco-international-reports-20260831 --limit 1 --json databaseId,status,conclusion --jq '.[0].databaseId // empty')
            status=$(gh run list --workflow "$workflow" --branch tmp/melco-international-reports-20260831 --limit 1 --json status --jq '.[0].status // empty')
            conclusion=$(gh run list --workflow "$workflow" --branch tmp/melco-international-reports-20260831 --limit 1 --json conclusion --jq '.[0].conclusion // empty')
            echo "resolver run=$run_id status=$status conclusion=$conclusion"
            if [[ -n "$run_id" && "$status" == 'completed' ]]; then
              [[ "$conclusion" == 'success' ]] || { echo 'Resolver failed'; exit 1; }
              break
            fi
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo 'Resolver run not found'; exit 1; }
          rm -rf downloaded
          mkdir -p downloaded
          gh run download "$run_id" -n melco-international-final-package -D downloaded
          find downloaded -type f -maxdepth 4 -printf '%p\n'

      - name: Copy to stable paths and commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables/melco
          zip_file=$(find downloaded -type f -name '新濠国际发展_00200_HK_券商研究报告_*份_完整PDF.zip' | head -n 1)
          manifest=$(find downloaded -type f -name manifest.json | head -n 1)
          readme=$(find downloaded -type f -name '说明.txt' | head -n 1)
          [[ -n "$zip_file" && -f "$zip_file" ]] || { echo 'Formal ZIP not found'; exit 1; }
          cp "$zip_file" 'deliverables/melco/新濠国际发展_00200_HK_券商深度报告_公开完整PDF.zip'
          [[ -n "$manifest" && -f "$manifest" ]] && cp "$manifest" deliverables/melco/manifest.json
          [[ -n "$readme" && -f "$readme" ]] && cp "$readme" deliverables/melco/说明.txt
          git config user.name 'OpenAI Research Packager'
          git config user.email 'actions@users.noreply.github.com'
          git add deliverables/melco
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore: publish Melco International broker report package'
            git push origin HEAD:tmp/melco-international-reports-20260831
          fi

      - name: Upload stable package
        uses: actions/upload-artifact@v4
        with:
          name: melco-international-stable-package
          path: deliverables/melco
          retention-days: 3
          if-no-files-found: error
