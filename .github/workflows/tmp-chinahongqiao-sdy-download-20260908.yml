name: Inspect China Hongqiao Waterdrop downloads
on:
  push:
    branches:
      - tmp-chinahongqiao-sdy-download-20260908
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install Playwright binding
        run: python -m pip install --quiet playwright
      - name: Inspect public download controls
        run: |
          set -euo pipefail
          mkdir -p output
          python - <<'PY'
          import hashlib, json, re, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          items={'886387':'west','892745':'huachuang'}
          chrome=shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          result={}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage'])
            ctx=browser.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',locale='zh-CN',accept_downloads=True)
            for rid,label in items.items():
              page=ctx.new_page()
              rec={'network':[],'downloads':[],'clicks':[]}
              def response(resp,rec=rec):
                try: ct=resp.headers.get('content-type','')
                except: ct=''
                if re.search(r'pdf|download|file|report|detail|api|oss|cdn',resp.url,re.I) or 'pdf' in ct.lower():
                  rec['network'].append({'url':resp.url,'status':resp.status,'content_type':ct})
              page.on('response',response)
              try:
                r=page.goto(f'https://www.sdyanbao.com/detail/{rid}',wait_until='domcontentloaded',timeout=90000)
                try: page.wait_for_load_state('networkidle',timeout=25000)
                except PWTimeout: pass
                page.wait_for_timeout(2000)
                rec['status']=r.status if r else None
                rec['title']=page.title()
                rec['links']=page.eval_on_selector_all('a',"els=>els.map(e=>({text:(e.innerText||e.textContent||'').trim(),href:e.href,download:e.download||''}))")
                rec['buttons']=page.eval_on_selector_all('button',"els=>els.map(e=>({text:(e.innerText||e.textContent||'').trim(),disabled:e.disabled}))")
                rec['html']=page.content()
                Path(f'output/{rid}.html').write_text(rec['html'],encoding='utf-8')
                loc=page.get_by_text('立即下载',exact=True)
                rec['download_controls']=loc.count()
                if loc.count():
                  try:
                    with page.expect_download(timeout=10000) as di:
                      loc.first.click(timeout=10000)
                    d=di.value
                    target=Path('output')/f'{rid}_{d.suggested_filename}'
                    d.save_as(str(target))
                    data=target.read_bytes()
                    rec['downloads'].append({'file':str(target),'url':d.url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'magic':data[:8].hex()})
                  except Exception as e:
                    rec['clicks'].append({'error':repr(e),'url_after':page.url})
                    page.wait_for_timeout(2000)
                    rec['after_body']=' '.join(page.locator('body').inner_text().split())[:20000]
                    rec['after_html']=page.content()
                    Path(f'output/{rid}_after.html').write_text(rec['after_html'],encoding='utf-8')
                rec['final_url']=page.url
              except Exception as e:
                rec['error']=repr(e)
              result[rid]=rec
              print('RESULT',rid,json.dumps({'downloads':rec.get('downloads'),'clicks':rec.get('clicks'),'network':rec.get('network')[-30:]},ensure_ascii=False),flush=True)
              page.close()
            browser.close()
          Path('output/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: chinahongqiao-waterdrop-download-inspection
          path: output/*
          retention-days: 1
