name: Capture Hubei Energy public report API responses

on:
  push:
    branches: [tmp-hubei-energy-broker-reports-20261016]
    paths: ['.github/workflows/tmp-hubei-energy-fx-api-responses-20261016.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query public report APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture
          BASE='https://api.fxbaogao.com'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36'
          common=(-A "$UA" -H 'Accept: application/json, text/plain, */*' -H 'Origin: https://www.fxbaogao.com' -e 'https://www.fxbaogao.com/view?id=5191475')

          curl --http1.1 -sS -L --max-time 120 "${common[@]}" -D capture/preview.headers \
            "$BASE/mofoun/report/report/getReportPreviewImages?reportId=5191475" -o capture/preview.body
          curl --http1.1 -sS -L --max-time 120 "${common[@]}" -D capture/downloadbean.headers \
            "$BASE/mofoun/report/report/downloadReportByBean?reportId=5191475" -o capture/downloadbean.body
          curl --http1.1 -sS -L --max-time 120 "${common[@]}" -D capture/filedownload.headers \
            "$BASE/mofoun/report/report/file/downloadReport?reportId=5191475" -o capture/filedownload.body
          curl --http1.1 -sS -L --max-time 120 "${common[@]}" -D capture/predown.headers \
            "$BASE/mofoun/report/report/report/preDownV2?reportId=5191475" -o capture/predown.body

          for payload in '{"id":5191475}' '{"reportId":5191475}' '{"id":"5191475","isEnglish":0}'; do
            idx=$(printf '%s' "$payload" | sha256sum | cut -c1-8)
            curl --http1.1 -sS -L --max-time 120 "${common[@]}" \
              -H 'Content-Type: application/json;charset=UTF-8' \
              -D "capture/detail_${idx}.headers" \
              -X POST "$BASE/mofoun/report/searchReport/detail" \
              --data "$payload" -o "capture/detail_${idx}.body"
            printf '%s\n' "$payload" > "capture/detail_${idx}.payload"
          done

          file capture/*
          wc -c capture/*
      - name: Upload responses
        uses: actions/upload-artifact@v4
        with:
          name: hubei-energy-public-report-api-responses
          path: capture/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
