name: Agile Group Report DOM Probe

on:
  push:
    branches:
      - chatgpt-agilegroup-filings-20260927
    paths:
      - .github/workflows/agilegroup_report_dom_probe_20260927.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Inspect report page structure and year filters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, urllib3
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          bases=[
            'https://www.agile.com.cn/en/invest/report?level_id=1000000143',
            'https://www.agile.com.cn/invest/report',
          ]
          suffixes=['', '&year=2020','&year=2021','&year=2022','&year=2023','&year=2024','&year=2025','&page=2','&p=2']
          for base in bases:
            for suffix in suffixes:
              url=base+suffix if '?' in base else base+suffix.replace('&','?',1)
              try:
                r=s.get(url,timeout=45,verify=False,allow_redirects=True)
                r.encoding=r.apparent_encoding or 'utf-8'
                html=r.text
                soup=BeautifulSoup(html,'html.parser')
                title=soup.title.get_text(' ',strip=True) if soup.title else ''
                pdfs=[]
                for match in re.finditer(r'[^\"\'<>\s]+\.pdf(?:\?[^\"\'<>\s]*)?',html,re.I):
                  raw=match.group(0)
                  start=max(0,match.start()-700); end=min(len(html),match.end()+700)
                  context=' '.join(html[start:end].split())
                  pdfs.append({'raw':raw,'url':urljoin(r.url,raw),'context':context})
                print('\n===',url,'STATUS',r.status_code,'BYTES',len(r.content),'TITLE',title,'PDF_COUNT',len(pdfs),'===')
                print(json.dumps(pdfs,ensure_ascii=False,indent=2))
                forms=[]
                for form in soup.find_all('form'):
                  forms.append({'action':form.get('action'),'method':form.get('method'),'text':' '.join(form.get_text(' ',strip=True).split())[:600], 'inputs':[dict(x.attrs) for x in form.find_all(['input','select','button'])]})
                print('FORMS',json.dumps(forms,ensure_ascii=False,indent=2))
                inline=[]
                for script in soup.find_all('script'):
                  if script.get('src'): continue
                  text=script.get_text('\n',strip=True)
                  if any(k in text.lower() for k in ['ajax','report','year','page']): inline.append(text[:5000])
                print('INLINE_SCRIPTS',json.dumps(inline,ensure_ascii=False,indent=2))
              except Exception as exc:
                print('ERROR',url,repr(exc))
          PY
