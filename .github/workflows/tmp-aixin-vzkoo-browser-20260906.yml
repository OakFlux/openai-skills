name: Temporary Aixin Vzkoo browser inspection
on:
  push:
    branches:
      - tmp-aixin-vzkoo-browser-20260906
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Chromium
        shell: bash
        run: |
          python -m pip install --quiet playwright pypdf
          python -m playwright install --with-deps chromium
      - name: Inspect page and try download
        shell: bash
        run: |
          mkdir -p output
          python - <<'PY'
          import io,json,re
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from pypdf import PdfReader
          url='https://www.vzkoo.com/document/1126926038310001149384a3edee.html'
          records=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              context=browser.new_context(viewport={'width':1440,'height':1200},locale='zh-CN',user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36')
              page=context.new_page()
              page.on('response',lambda response: records.append({'url':response.url,'status':response.status,'type':response.request.resource_type,'content_type':response.headers.get('content-type','')}))
              response=page.goto(url,wait_until='domcontentloaded',timeout=120000)
              page.wait_for_timeout(10000)
              print('GOTO',response.status if response else None,'TITLE',page.title(),'URL',page.url,flush=True)
              body=page.locator('body').inner_text(timeout=30000)
              Path('output/body.txt').write_text(body,encoding='utf-8')
              print(body[:5000],flush=True)
              links=[]
              for index in range(min(page.locator('a').count(),300)):
                  item=page.locator('a').nth(index)
                  links.append({'text':item.inner_text(timeout=5000).strip()[:300],'href':item.get_attribute('href') or ''})
              buttons=[]
              for index in range(min(page.locator('button').count(),200)):
                  item=page.locator('button').nth(index)
                  buttons.append({'text':item.inner_text(timeout=5000).strip()[:300],'title':item.get_attribute('title') or ''})
              Path('output/links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
              Path('output/buttons.json').write_text(json.dumps(buttons,ensure_ascii=False,indent=2),encoding='utf-8')
              Path('output/responses.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
              Path('output/page.html').write_text(page.content(),encoding='utf-8')
              page.screenshot(path='output/page.png',full_page=True)
              for item in links+buttons:
                  text=(item.get('text') or '')+(item.get('title') or '')+(item.get('href') or '')
                  if any(key in text.lower() for key in ['下载','全文','原文','pdf','报告']): print('CONTROL',json.dumps(item,ensure_ascii=False),flush=True)
              for selector in ['text=下载报告','text=免费下载','text=立即下载','text=查看全文','text=查看原文']:
                  loc=page.locator(selector)
                  if loc.count():
                      print('TRY',selector,loc.count(),flush=True)
                      try:
                          with page.expect_download(timeout=30000) as pending:
                              loc.first.click(timeout=15000)
                          download=pending.value
                          target=Path('output')/(download.suggested_filename or 'download.pdf')
                          download.save_as(str(target))
                          data=target.read_bytes()
                          if b'%PDF-' in data[:1024]: print('PDF_DOWNLOAD',target.name,len(data),len(PdfReader(io.BytesIO(data),strict=False).pages),flush=True)
                      except Exception as exc:
                          print('DOWNLOAD_ERROR',selector,repr(exc),flush=True)
              browser.close()
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: aixin-vzkoo-browser
          path: output/*
          retention-days: 1
          if-no-files-found: error
