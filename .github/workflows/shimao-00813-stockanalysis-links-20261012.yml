name: Extract Shimao filing links 20261012

on:
  push:
    paths:
      - '.github/workflows/shimao-00813-stockanalysis-links-20261012.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Extract filing links
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          url='https://stockanalysis.com/filings/HKG:0813/'
          s=requests.Session(); s.trust_env=False
          r=s.get(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'en-US,en;q=0.9'},timeout=60)
          print('STATUS',r.status_code,'LEN',len(r.content),'FINAL',r.url,flush=True)
          r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          for a in soup.find_all('a'):
              text=' '.join(a.get_text(' ',strip=True).split())
              href=a.get('href')
              if not href: continue
              full=urljoin(r.url,href)
              if any(k in text for k in ['H1 2026','H2 2025','H2 2024','H2 2023','H2 2022','H2 2021','H2 2020']):
                  print('A',repr(text),'=>',full,flush=True)
          print('HTML_START',flush=True)
          idx=r.text.find('H1 2026')
          print(r.text[max(0,idx-5000):idx+30000],flush=True)
          PY
