name: Probe public Quantgroup broker PDFs 20260919
on:
  push:
    paths:
      - '.github/workflows/quantgroup-public-pdf-probe-20260919.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf
      - name: Download and inspect direct public PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quantgroup_public_pdf_probe
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          import requests
          from pypdf import PdfReader
          docs=[
            ('HASC','https://api.hasc.com.hk/uploads/02685_HK_4281dc2d69.pdf'),
            ('Cyberquote','https://research.cyberquote.com.hk/page/htm/kc/share_recommend/pdf/2685Report.pdf'),
          ]
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept':'application/pdf,*/*;q=0.8'})
          out=Path('quantgroup_public_pdf_probe'); recs=[]
          for i,(name,url) in enumerate(docs,1):
            p=out/f'{i:02d}_{name}.pdf'
            try:
              r=s.get(url,timeout=(20,180),allow_redirects=True)
              print('GET',name,r.status_code,r.url,r.headers.get('content-type'),len(r.content),flush=True)
              r.raise_for_status(); p.write_bytes(r.content)
              if not r.content.startswith(b'%PDF-'): raise RuntimeError('not pdf')
              reader=PdfReader(str(p),strict=False); pages=len(reader.pages)
              text='\n'.join((pg.extract_text() or '') for pg in reader.pages[:min(pages,8)])
              q=subprocess.run(['qpdf','--check',str(p)],capture_output=True,text=True)
              rec={'name':name,'input':url,'final':r.url,'bytes':len(r.content),'pages':pages,'sha256':hashlib.sha256(r.content).hexdigest(),'qpdf':q.returncode,'text':text[:30000]}
              recs.append(rec); print('META',json.dumps({k:v for k,v in rec.items() if k!='text'},ensure_ascii=False),flush=True); print('TEXT_START',name,text[:8000],flush=True)
            except Exception as e:
              print('ERR',name,repr(e),flush=True); recs.append({'name':name,'input':url,'error':repr(e)})
          (out/'metadata.json').write_text(json.dumps(recs,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: quantgroup-public-pdf-probe-20260919
          path: quantgroup_public_pdf_probe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
