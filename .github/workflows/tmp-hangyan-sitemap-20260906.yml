name: Inspect Hangyan sitemap
on:
  push:
    branches: [tmp-hangyan-sitemap-20260906]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public robots and sitemap files
        run: |
          for u in \
            https://www.hangyan.co/robots.txt \
            https://www.hangyan.co/sitemap.xml \
            https://www.hangyan.co/sitemap_index.xml \
            https://www.hangyan.co/sitemaps.xml; do
            echo "===== $u ====="
            curl -L --max-time 60 -A 'Mozilla/5.0' -D - "$u" | head -c 50000
            echo
          done
