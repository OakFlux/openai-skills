name: Temporary Ruishu report discovery

on:
  push:
    branches:
      - task-greentown-public-20260828

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Inspect public site and find Greentown reports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4 playwright
          python3 -m playwright install chromium >/dev/null 2>&1
          python3 <<'PY'
          import asyncio
          import json
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          OUT = Path('output')
          OUT.mkdir(exist_ok=True)
          base = 'https://www.ruishubaogao.com'
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36'})
          urls = [
              base+'/',
              base+'/robots.txt',
              base+'/sitemap.xml',
              base+'/report-detail/10770',
              base+'/search?q=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD',
              base+'/search?keyword=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD',
              base+'/reports?keyword=%E7%BB%BF%E5%9F%8E%E4%B8%AD%E5%9B%BD',
          ]
          req_summary=[]
          for i,u in enumerate(urls):
              try:
                  r=s.get(u,timeout=60,allow_redirects=True)
                  print('REQ',u,r.status_code,r.url,r.headers.get('content-type'),len(r.content))
                  (OUT/f'req_{i}.txt').write_bytes(r.content)
                  req_summary.append({'url':u,'status':r.status_code,'final':r.url,'content_type':r.headers.get('content-type'),'size':len(r.content),'headers':dict(r.headers)})
                  if 'text/html' in (r.headers.get('content-type') or ''):
                      soup=BeautifulSoup(r.text,'html.parser')
                      print('TITLE',soup.title.string if soup.title else None)
                      print('SCRIPTS',[urljoin(r.url,x.get('src')) for x in soup.find_all('script') if x.get('src')])
                      print('LINKS',[(a.get_text(' ',strip=True)[:80],urljoin(r.url,a.get('href'))) for a in soup.find_all('a') if a.get('href')][:50])
              except Exception as e:
                  print('REQ ERROR',u,repr(e)); req_summary.append({'url':u,'error':repr(e)})
          (OUT/'requests_summary.json').write_text(json.dumps(req_summary,ensure_ascii=False,indent=2),encoding='utf-8')

          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True)
                  context=await browser.new_context(accept_downloads=True,viewport={'width':1440,'height':1000})
                  page=await context.new_page()
                  network=[]
                  page.on('request',lambda req: network.append({'kind':'request','method':req.method,'url':req.url,'resource_type':req.resource_type,'post_data':req.post_data}))
                  page.on('response',lambda resp: network.append({'kind':'response','status':resp.status,'url':resp.url,'content_type':resp.headers.get('content-type')}))
                  for label,u in [('home',base+'/'),('detail',base+'/report-detail/10770')]:
                      network.clear()
                      try:
                          resp=await page.goto(u,wait_until='networkidle',timeout=90000)
                          print('PW',label,'status',resp.status if resp else None,'url',page.url,'title',await page.title())
                          await page.screenshot(path=str(OUT/f'{label}.png'),full_page=True)
                          html=await page.content(); (OUT/f'{label}.html').write_text(html,encoding='utf-8')
                          text=await page.locator('body').inner_text(); (OUT/f'{label}.txt').write_text(text,encoding='utf-8')
                          links=await page.locator('a').evaluate_all("els => els.map(a => ({text:(a.innerText||'').trim(),href:a.href})).filter(x=>x.href)")
                          buttons=await page.locator('button').evaluate_all("els => els.map(b => ({text:(b.innerText||'').trim(),html:b.outerHTML.slice(0,500)}))")
                          inputs=await page.locator('input').evaluate_all("els => els.map(i => ({type:i.type,placeholder:i.placeholder,name:i.name,value:i.value,outer:i.outerHTML.slice(0,500)}))")
                          (OUT/f'{label}_dom.json').write_text(json.dumps({'links':links,'buttons':buttons,'inputs':inputs},ensure_ascii=False,indent=2),encoding='utf-8')
                          (OUT/f'{label}_network.json').write_text(json.dumps(network,ensure_ascii=False,indent=2),encoding='utf-8')
                          print('BUTTONS',buttons[:20]); print('INPUTS',inputs[:20]); print('LINKS',links[:50])
                          print('NETWORK URLS',[x['url'] for x in network if any(k in x['url'].lower() for k in ['api','download','pdf','report'])][:200])
                      except Exception as e:
                          print('PW ERROR',label,repr(e))
                  try:
                      await page.goto(base+'/',wait_until='networkidle',timeout=90000)
                      inputs=page.locator('input')
                      n=await inputs.count()
                      for idx in range(n):
                          inp=inputs.nth(idx)
                          ph=(await inp.get_attribute('placeholder') or '')
                          tp=(await inp.get_attribute('type') or '')
                          if '搜' in ph or tp=='search':
                              print('SEARCH INPUT',idx,ph,tp)
                              await inp.fill('绿城中国')
                              await inp.press('Enter')
                              await page.wait_for_timeout(5000)
                              print('SEARCH RESULT URL',page.url,'TITLE',await page.title())
                              await page.screenshot(path=str(OUT/'search_result.png'),full_page=True)
                              (OUT/'search_result.html').write_text(await page.content(),encoding='utf-8')
                              (OUT/'search_result.txt').write_text(await page.locator('body').inner_text(),encoding='utf-8')
                              break
                  except Exception as e:
                      print('SEARCH ERROR',repr(e))
                  await browser.close()
          asyncio.run(main())
          PY
      - name: Upload inspection files
        uses: actions/upload-artifact@v4
        with:
          name: ruishu-discovery
          path: output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
