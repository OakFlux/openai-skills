name: Temporary Hibor document viewer endpoint probe

on:
  push:
    branches:
      - tmp/china-everbright-hibor-js-probe-20260831
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml
      - name: Inspect HTML controls, JS bundle, and likely file URLs
        shell: bash
        run: |
          python - <<'PY'
          import json, re, requests, urllib.parse
          from bs4 import BeautifulSoup

          base='https://www.hibor.com.cn/repinfodetail_5073681.html'
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6','Referer':'https://www.hibor.com.cn/'})
          r=s.get(base,timeout=60)
          r.encoding=r.apparent_encoding or 'utf-8'
          html=r.text
          soup=BeautifulSoup(html,'lxml')
          print('PAGE',r.status_code,len(r.content),flush=True)

          # Print all controls and nearby HTML containing key phrases/IDs.
          for phrase in ['打开报告原文','下载报告','点击浏览报告原文','5073633','202604222229109838','CheckMd5File','downLoad','download','showPdf','openPdf']:
              pos=html.lower().find(phrase.lower())
              print('\nPHRASE',phrase,'POS',pos,flush=True)
              if pos>=0:
                  print(html[max(0,pos-2000):pos+3000],flush=True)

          for tag in soup.find_all(True):
              attrs=dict(tag.attrs)
              blob=(tag.get_text(' ',strip=True)+' '+json.dumps(attrs,ensure_ascii=False)).lower()
              if any(k.lower() in blob for k in ['打开报告原文','下载报告','5073633','202604222229109838','checkmd5file','download','pdf']):
                  print('TAG',tag.name,'TEXT',repr(tag.get_text(' ',strip=True)[:300]),'ATTRS',json.dumps(attrs,ensure_ascii=False),flush=True)

          # Fetch all JS sources and find endpoint/function strings.
          scripts=[]
          for tag in soup.find_all('script',src=True):
              u=urllib.parse.urljoin(r.url,tag['src'])
              try:
                  jr=s.get(u,timeout=60)
                  jr.encoding=jr.apparent_encoding or jr.encoding or 'utf-8'
                  scripts.append((u,jr.text))
                  print('\nJS_FETCH',jr.status_code,len(jr.content),u,flush=True)
              except Exception as e:
                  print('JS_ERROR',u,repr(e),flush=True)
          for u,text in scripts:
              low=text.lower()
              if any(k in low for k in ['docdetail','download','checkmd5','openreport','pdf','original']):
                  print('\n=== JS_RELEVANT',u,'LEN',len(text),flush=True)
                  for patt in ['download','checkmd5','pdf','openreport','reportoriginal','docdetail','showoriginal','readreport','clientdownload']:
                      starts=[m.start() for m in re.finditer(patt,low)]
                      print('JS_PATTERN',patt,'COUNT',len(starts),flush=True)
                      for pos in starts[:30]:
                          print('SNIP',repr(text[max(0,pos-500):pos+1000]),flush=True)

          # Try likely original-file URL patterns inferred from the visible preview asset.
          token='202604222229109838'
          guesses=[]
          hosts=['https://huibobjb.hibor.com.cn','https://www.hibor.com.cn','https://pdf.hibor.com.cn','https://file.hibor.com.cn','https://report.hibor.com.cn']
          paths=[
              f'/CheckMd5File/pdf/2026/4/{token}.pdf',
              f'/CheckMd5File/Pdf/2026/4/{token}.pdf',
              f'/CheckMd5File/file/2026/4/{token}.pdf',
              f'/CheckMd5File/files/2026/4/{token}.pdf',
              f'/CheckMd5File/img/2026/4/{token}.pdf',
              f'/CheckMd5File/2026/4/{token}.pdf',
              f'/report/2026/4/{token}.pdf',
              f'/pdf/2026/4/{token}.pdf',
              f'/upload/2026/4/{token}.pdf',
              f'/uploads/2026/4/{token}.pdf',
          ]
          for host in hosts:
              for path in paths:
                  guesses.append(host+path)
          for u in guesses:
              try:
                  gr=s.get(u,timeout=20,allow_redirects=True,headers={'Referer':base,'Accept':'application/pdf,*/*;q=0.8'})
                  if gr.status_code not in [404,403] or len(gr.content)>2000:
                      print('GUESS',gr.status_code,len(gr.content),gr.headers.get('content-type'),gr.url,gr.content[:12].hex(),flush=True)
              except Exception as e:
                  pass
          PY
