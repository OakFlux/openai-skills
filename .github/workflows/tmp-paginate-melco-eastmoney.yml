name: Temporary Paginate Eastmoney for Melco Reports

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-paginate-melco-eastmoney.yml

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Paginate report APIs and validate matching PDFs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests pypdf
          python - <<'PY'
          import io, json, math, time
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://data.eastmoney.com/','Accept':'application/json,text/plain,*/*','Accept-Language':'zh-CN,zh;q=0.9'})
          exact_dates=['2024-08-16','2025-03-03','2025-05-09','2025-08-01','2025-08-02','2025-08-04','2025-11-07','2025-11-08','2025-11-10','2025-11-11','2026-04-20']
          matches=[]; diagnostics=[]
          def match_row(row):
            blob=json.dumps(row,ensure_ascii=False).lower()
            code=str(row.get('stockCode') or row.get('code') or row.get('SECURITY_CODE') or '')
            name=str(row.get('stockName') or row.get('SECURITY_NAME_ABBR') or '')
            title=str(row.get('title') or row.get('REPORT_TITLE') or '')
            return code in ['00200','0200','200','HK00200','00200.HK'] or '新濠国际发展' in name or '新濠國際發展' in name or '新濠国际发展' in title or 'melco international' in blob
          def query(params,label,max_pages=12):
            for page in range(1,max_pages+1):
              p=dict(params);p['pageNo']=str(page);p['_']=str(int(time.time()*1000))
              for attempt in range(3):
                try:
                  r=s.get('https://reportapi.eastmoney.com/report/list',params=p,timeout=45);r.raise_for_status();obj=r.json();rows=obj.get('data') or []
                  diagnostics.append({'label':label,'page':page,'hits':obj.get('hits'),'size':obj.get('size'),'rows':len(rows),'url':r.url})
                  for row in rows:
                    if match_row(row):
                      item={'source':label,'page':page,'row':row}
                      key=json.dumps(row,sort_keys=True,ensure_ascii=False)
                      if not any(json.dumps(x['row'],sort_keys=True,ensure_ascii=False)==key for x in matches):matches.append(item)
                  if not rows or len(rows)<int(p.get('pageSize','100')):return
                  break
                except Exception as e:
                  if attempt==2:diagnostics.append({'label':label,'page':page,'error':repr(e)});return
                  time.sleep(1+attempt)
          base={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','fields':'','orgCode':'','author':'','rcode':''}
          for date in exact_dates:
            for q in ['0','1','2']:
              p={**base,'beginTime':date,'endTime':date,'qType':q,'code':''}
              query(p,f'global_{date}_q{q}',12)
          # Direct code variants, both code and stockCode parameters.
          for code in ['00200','0200','HK00200','00200.HK','200']:
            for q in ['0','1','2','3']:
              p={**base,'pageSize':'500','beginTime':'2010-01-01','endTime':'2026-08-31','qType':q,'code':code}
              query(p,f'code_{code}_q{q}',3)
              p2={**base,'pageSize':'500','beginTime':'2010-01-01','endTime':'2026-08-31','qType':q,'code':'','stockCode':code}
              query(p2,f'stockCode_{code}_q{q}',3)
          # Validate likely PDF URLs.
          validated=[]; outdir=Path('out/pdfs');outdir.mkdir(parents=True,exist_ok=True)
          for m in matches:
            row=m['row'];info=str(row.get('infoCode') or row.get('INFO_CODE') or row.get('infocode') or '')
            title=str(row.get('title') or row.get('REPORT_TITLE') or '')
            broker=str(row.get('orgSName') or row.get('orgName') or row.get('ORG_SNAME') or '')
            date=str(row.get('publishDate') or row.get('NOTICE_DATE') or '')[:10]
            urls=[]
            for k in ['attachUrl','pdfUrl','downloadUrl','fileUrl','encodeUrl','url']:
              v=row.get(k)
              if isinstance(v,str) and '.pdf' in v.lower():urls.append(('https:'+v) if v.startswith('//') else v.replace('http://','https://',1))
            if info:urls += [f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf?{int(time.time()*1000)}.pdf']
            rec={'source':m['source'],'page':m['page'],'infoCode':info,'title':title,'broker':broker,'date':date,'row':row,'attempts':[],'ok':False}
            for u in dict.fromkeys(urls):
              try:
                r=s.get(u,timeout=80,allow_redirects=True);a={'url':u,'final':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'head':r.content[:8].hex()}
                if r.status_code==200 and r.content.lstrip().startswith(b'%PDF') and len(r.content)>20000:
                  reader=PdfReader(io.BytesIO(r.content),strict=False);a['pages']=len(reader.pages);a['encrypted']=bool(reader.is_encrypted)
                  first=''
                  try:first=' '.join((reader.pages[0].extract_text() or '').split())[:2000]
                  except Exception:pass
                  a['first']=first
                  fn='{}_{}_{}_{}.pdf'.format(date,broker,title,info).replace('/','_').replace('\\','_')[:180]
                  path=outdir/fn;path.write_bytes(r.content)
                  rec.update({'ok':True,'pages':len(reader.pages),'bytes':len(r.content),'pdf_url':r.url,'saved':str(path),'first':first});rec['attempts'].append(a);break
                rec['attempts'].append(a)
              except Exception as e:rec['attempts'].append({'url':u,'error':repr(e)})
            validated.append(rec)
          result={'matches':matches,'validated':validated,'diagnostics':diagnostics}
          Path('out/melco_paginated.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCH_COUNT='+str(len(matches)),flush=True)
          print('MATCHES='+json.dumps([{'source':x['source'],'page':x['page'],'row':x['row']} for x in matches],ensure_ascii=False),flush=True)
          print('VALIDATED='+json.dumps([{'infoCode':x['infoCode'],'date':x['date'],'broker':x['broker'],'title':x['title'],'pages':x.get('pages'),'url':x.get('pdf_url')} for x in validated if x.get('ok')],ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: melco-eastmoney-paginated
          path: out
          retention-days: 3
