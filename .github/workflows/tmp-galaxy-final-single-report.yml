name: Temporary Galaxy Microelectronics final public report package

on:
  push:
    branches:
      - tmp/galaxy-microelectronics-broker-reports-20260830
    paths:
      - .github/workflows/tmp-galaxy-final-single-report.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet requests PyMuPDF Pillow
      - name: Download, validate, and package report
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path

          import pymupdf
          import requests
          from PIL import Image, ImageDraw

          OUT = Path('galaxy_final')
          PDFDIR = OUT / 'pdfs'
          RENDERDIR = OUT / 'renders'
          for path in (OUT, PDFDIR, RENDERDIR):
              path.mkdir(parents=True, exist_ok=True)

          meta = {
              'date': '2026-04-16',
              'org': '华源证券',
              'title': '深耕半导体分立器件，积极拓展新兴市场',
              'analysts': ['葛星甫', '刘晓宁', '孟爽'],
              'code': 'AP202604161821266092',
              'expected_pages': 13,
          }

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.6',
          })
          urls = [
              'https://pdf.dfcfw.com/pdf/H3_AP202604161821266092_1.pdf?1776361430000.pdf',
              'https://pdf.dfcfw.com/pdf/H3_AP202604161821266092_1.pdf',
              'https://pdf.dfcfw.com/pdf/H3_AP202604161821266092.pdf',
          ]
          data = None
          source_url = None
          attempts = []
          for url in urls:
              try:
                  response = session.get(
                      url,
                      timeout=90,
                      allow_redirects=True,
                      headers={
                          'Referer': 'https://data.eastmoney.com/',
                          'Accept': 'application/pdf,*/*;q=0.8',
                      },
                  )
                  attempts.append({
                      'url': url,
                      'status': response.status_code,
                      'bytes': len(response.content),
                      'type': response.headers.get('content-type'),
                      'magic': response.content[:12].hex(),
                  })
                  print('DOWNLOAD', json.dumps(attempts[-1], ensure_ascii=False), flush=True)
                  if response.status_code == 200 and len(response.content) > 50_000 and response.content.lstrip().startswith(b'%PDF'):
                      data = response.content
                      source_url = response.url
                      break
              except Exception as exc:
                  attempts.append({'url': url, 'error': repr(exc)})
                  print('ERROR', url, repr(exc), flush=True)
          if data is None:
              raise RuntimeError(f'Could not download original PDF: {attempts}')

          filename = '2026-04-16_华源证券_银河微电_深耕半导体分立器件积极拓展新兴市场.pdf'
          pdf_path = PDFDIR / filename
          pdf_path.write_bytes(data)

          doc = pymupdf.open(str(pdf_path))
          pages = doc.page_count
          if pages != meta['expected_pages']:
              raise RuntimeError(f'Expected {meta["expected_pages"]} pages, got {pages}')
          sample_indices = sorted(set([0, 1, min(5, pages - 1), pages // 2, pages - 1]))
          text = '\n'.join(doc.load_page(index).get_text('text') for index in sample_indices)
          compact = re.sub(r'\s+', '', text)
          if not any(key in compact for key in ['银河微电', '688689', '常州银河世纪微电子股份有限公司']):
              raise RuntimeError('Company identity was not found in sampled pages')
          for label, index in [('first', 0), ('middle', pages // 2), ('last', pages - 1)]:
              pix = doc.load_page(index).get_pixmap(matrix=pymupdf.Matrix(0.9, 0.9), alpha=False)
              pix.save(str(RENDERDIR / f'{label}.png'))
          encrypted = bool(doc.is_encrypted)
          doc.close()

          digest = hashlib.sha256(data).hexdigest()
          record = {
              **meta,
              'file': filename,
              'pages': pages,
              'bytes': len(data),
              'sha256': digest,
              'encrypted': encrypted,
              'source_url': source_url,
              'identity_verified': True,
          }
          (OUT / 'selected_reports.json').write_text(json.dumps([record], ensure_ascii=False, indent=2), encoding='utf-8')
          readme = [
              '银河微电（688689.SH）公开券商公司研报下载包',
              '',
              '完整原始PDF数量：1份',
              '',
              f"1. {record['date']}｜{record['org']}｜{record['title']}｜{record['pages']}页｜分析师：{'、'.join(record['analysts'])}",
              '',
              '公开机构覆盖数据库截至2026-08-30仅检索到这一份以银河微电为主体的券商公司报告。',
              '为避免误导，本包没有用年报、招股书、行业周报、量化选股报告、重复版本或缺页预览凑足2—3份。',
              '已核验PDF文件头、公司名称及证券代码、实际页数和加密状态，并检查首页、中间页与末页；ZIP完整性测试通过。',
              '版权归原发布机构及作者所有，仅供研究参考。',
          ]
          (OUT / 'README.txt').write_text('\n'.join(readme), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(f'{digest}  {filename}\n', encoding='utf-8')
          (OUT / 'download_attempts.json').write_text(json.dumps(attempts, ensure_ascii=False, indent=2), encoding='utf-8')

          # Visual contact sheet for QA.
          thumbs = []
          for label in ['first', 'middle', 'last']:
              with Image.open(RENDERDIR / f'{label}.png') as image:
                  image = image.convert('RGB')
                  image.thumbnail((320, 420))
                  canvas = Image.new('RGB', (340, 460), 'white')
                  canvas.paste(image, ((340 - image.width) // 2, 10))
                  ImageDraw.Draw(canvas).text((12, 435), label, fill='black')
                  thumbs.append(canvas)
          sheet = Image.new('RGB', (340 * 3, 460), 'white')
          for index, thumb in enumerate(thumbs):
              sheet.paste(thumb, (index * 340, 0))
          sheet.save(OUT / 'contact_sheet.jpg', quality=90)

          zip_path = OUT / 'galaxy_microelectronics_public_broker_report.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as archive:
              archive.write(pdf_path, pdf_path.name)
              for name in ['README.txt', 'selected_reports.json', 'SHA256SUMS.txt']:
                  archive.write(OUT / name, name)
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError(f'ZIP integrity failure: {bad}')
              pdf_names = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdf_names) != 1:
                  raise RuntimeError(f'ZIP contains {len(pdf_names)} PDFs instead of 1')
          print((OUT / 'README.txt').read_text(encoding='utf-8'), flush=True)
          print('FINAL_ZIP', zip_path.stat().st_size, digest, flush=True)
          PY
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-microelectronics-final-public-report
          path: galaxy_final/
          retention-days: 3
          if-no-files-found: error
