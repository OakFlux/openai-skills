name: Build Laobaixing 603883 annual reports package v2 20261015

on:
  push:
    paths:
      - '.github/workflows/laobaixing-603883-annual-reports-2020-2025-20261015-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package filings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          from typing import Any
          import requests
          from pypdf import PdfReader

          STOCK_CODE='603883'
          COMPANY_SHORT='老百姓'
          COMPANY_FULL='老百姓大药房连锁股份有限公司'
          PACKAGE='老百姓_603883_2020-2025年报及最新季报'
          ROOT=Path(PACKAGE); ROOT.mkdir(exist_ok=True)
          PREV=Path('_validation_previews'); PREV.mkdir(exist_ok=True)

          annual_specs=[
              ('2020','01_老百姓_2020年年度报告.pdf'),
              ('2021','02_老百姓_2021年年度报告.pdf'),
              ('2022','03_老百姓_2022年年度报告.pdf'),
              ('2023','04_老百姓_2023年年度报告.pdf'),
              ('2024','05_老百姓_2024年年度报告.pdf'),
              ('2025','06_老百姓_2025年年度报告.pdf'),
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/notices/stock/{STOCK_CODE}.html',
              'Accept':'application/json,text/plain,*/*',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          api='https://np-anotice-stock.eastmoney.com/api/security/ann'
          all_rows=[]; search_pages=[]
          for page in range(1,101):
              params={
                  'sr':'-1','page_size':'50','page_index':str(page),
                  'ann_type':'A','client_source':'web','stock_list':STOCK_CODE,
                  'f_node':'0','s_node':'0',
              }
              data=None; last=None
              for attempt in range(8):
                  try:
                      r=s.get(api,params=params,timeout=(20,120))
                      last={'status':r.status_code,'text':r.text[:200]}
                      if r.status_code==200:
                          data=r.json(); break
                  except Exception as exc:
                      last={'error':repr(exc)}
                  time.sleep(1+attempt)
              if data is None:
                  raise RuntimeError(f'API failed page {page}: {last}')
              rows=((data.get('data') or {}).get('list') or [])
              search_pages.append({'page':page,'count':len(rows)})
              print('PAGE',page,'ROWS',len(rows))
              if not rows: break
              all_rows.extend(rows)
              time.sleep(0.08)

          def compact(text:str)->str:
              return re.sub(r'\s+','',text or '')
          def art_code(row:dict[str,Any])->str:
              return str(row.get('art_code') or row.get('artCode') or '')
          def date_value(row:dict[str,Any])->str:
              return str(row.get('display_time') or '')

          bad=[
              '摘要','英文版','取消','问询','回复','审计报告','董事会','监事会','更正公告',
              '提示性公告','社会责任报告','环境、社会及管治报告','可持续发展报告',
              '独立董事述职报告','内部控制评价报告','财务决算报告','年度报告说明会',
              '年度报告网上说明会','募集资金','会计师事务所','前期会计差错更正后的财务报表',
              '财务报表及相关附注','业绩预告'
          ]

          def choose(variants:list[str], period:str):
              candidates=[]
              for row in all_rows:
                  raw=str(row.get('title') or '')
                  title=compact(raw)
                  matched=next((v for v in variants if compact(v) in title),None)
                  if not matched or any(compact(x) in title for x in bad):
                      continue
                  score=50
                  key=compact(matched)
                  if title.endswith(key): score+=35
                  if title==key: score+=20
                  if title.startswith(COMPANY_SHORT) or title.startswith(COMPANY_FULL): score+=15
                  if any(x in title for x in ['更正后','修订版','更新后','修订稿']): score+=100
                  if any(x in title for x in ['取消版','已取消']): score-=100
                  candidates.append((score,date_value(row),row,matched))
              candidates.sort(key=lambda x:(x[0],x[1]),reverse=True)
              if not candidates:
                  sample=[str(r.get('title') or '') for r in all_rows if period in str(r.get('title') or '')][:50]
                  raise RuntimeError(f'Missing {variants}; nearby={sample}')
              log=[{'period':period,'score':sc,'date':dt,'title':rw.get('title'),'art_code':art_code(rw),'matched':mt} for sc,dt,rw,mt in candidates[:20]]
              return candidates[0][2],log

          selected=[]; candidate_logs={}
          for year,filename in annual_specs:
              row,log=choose([f'{year}年年度报告'],year)
              candidate_logs[f'{year}年年度报告']=log
              selected.append({'period':year,'filename':filename,'min_pages':80,'doc_type':'年度报告','row':row})

          quarter_options=[
              (['2026年第三季度报告','2026年三季度报告'],'2026Q3','2026年第三季度报告'),
              (['2026年第一季度报告','2026年一季度报告'],'2026Q1','2026年第一季度报告'),
              (['2025年第三季度报告','2025年三季度报告'],'2025Q3','2025年第三季度报告'),
              (['2025年第一季度报告','2025年一季度报告'],'2025Q1','2025年第一季度报告'),
          ]
          quarter_row=None; quarter_period=None; quarter_label=None; quarter_log=[]
          for variants,period,label in quarter_options:
              try:
                  quarter_row,quarter_log=choose(variants,period)
                  quarter_period=period; quarter_label=label; break
              except RuntimeError:
                  continue
          if quarter_row is None:
              raise RuntimeError('No quarterly report found')
          candidate_logs['最新季报']=quarter_log
          selected.append({'period':quarter_period,'filename':f'07_老百姓_{quarter_label}_最新季报.pdf','min_pages':5,'doc_type':'最新季报','row':quarter_row})

          def fetch_pdf(art:str,referer:str):
              urls=[f'https://pdf.dfcfw.com/pdf/H{x}_{art}_1.pdf' for x in (2,3,1,4)]
              last={}
              for url in urls:
                  for attempt in range(5):
                      try:
                          r=s.get(url,timeout=(30,420),allow_redirects=True,headers={
                              'User-Agent':s.headers['User-Agent'],'Referer':referer,'Accept':'application/pdf,*/*;q=0.8'})
                          last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url}
                          if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>30000:
                              return r.content,last,url
                      except Exception as exc:
                          last={'url':url,'error':repr(exc)}
                      time.sleep(1+attempt)
              raise RuntimeError(f'PDF download failed {art}: {last}')

          manifest=[]
          for idx,spec in enumerate(selected,1):
              row=spec.pop('row')
              art=art_code(row)
              if not art: raise RuntimeError(f'No art code: {spec["filename"]}')
              detail=f'https://data.eastmoney.com/notices/detail/{STOCK_CODE}/{art}.html'
              data,download_meta,pdf_url=fetch_pdf(art,detail)
              dest=ROOT/spec['filename']; dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
              if pages<spec['min_pages']:
                  raise RuntimeError(f'Too few pages {dest.name}: {pages}')
              text=''
              for p in reader.pages[:min(20,pages)]:
                  try: text+='\n'+(p.extract_text() or '')
                  except Exception: pass
              if not any(x in text for x in ['老百姓','603883','老百姓大药房']):
                  raise RuntimeError(f'Issuer mismatch: {dest.name}')
              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix=PREV/f'{idx:02d}'
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(dest),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix)+'.png')
              if not preview.exists() or preview.stat().st_size<10000:
                  raise RuntimeError(f'Preview failed: {dest.name}')
              sha=hashlib.sha256(data).hexdigest()
              manifest.append({
                  **spec,
                  'announcement_title':row.get('title'),'announcement_date':row.get('display_time'),'art_code':art,
                  'announcement_detail_page':detail,'mirror_pdf_url':pdf_url,
                  'official_cninfo_index':f'https://www.cninfo.com.cn/new/disclosure/stock?stockCode={STOCK_CODE}',
                  'official_sse_profile':f'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId={STOCK_CODE}',
                  'actual_pages':pages,'bytes':len(data),'sha256':sha,'download_meta':download_meta,
                  'validation':['PDF header','announcement title','issuer identity','page count','qpdf structure','first-page render']
              })

          readme=[
              '老百姓大药房连锁股份有限公司（603883.SH）2020-2025年年度报告及最新季报资料包',
              '整理日期：2026-10-15','',
              '本包收录2020年至2025年六份完整年度报告，以及截至整理日最新已正式披露的独立季度报告。',
              '年度报告均为全文，不以年度报告摘要替代；如存在修订版或更正后版本，优先收录最新修订文件。',
              '半年度报告不属于“季报”，因此未混入本标准包。',''
          ]
          for i,item in enumerate(manifest,1):
              readme += [
                  f'{i}. {item["filename"]}',
                  f'   公告标题：{item["announcement_title"]}',
                  f'   公告日期：{item["announcement_date"]}；页数：{item["actual_pages"]}',
                  f'   公告页面：{item["announcement_detail_page"]}',
                  f'   SHA-256：{item["sha256"]}',''
              ]
          readme += [
              '来源说明：PDF取自公开公告镜像，并按证券代码、公司名称、公告标题和报告年份逐一核验。',
              '核验项目：PDF文件头、公告标题、公司名称/证券代码、页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。'
          ]
          (ROOT/'00_文件清单与来源说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'candidate_selection_log.json').write_text(json.dumps(candidate_logs,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'announcement_search_pages.json').write_text(json.dumps(search_pages,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f'{x["sha256"]}  {x["filename"]}\n' for x in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zpath) as z:
              badfile=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if badfile or len(pdfs)!=7:
                  raise RuntimeError(f'ZIP validation failed bad={badfile} pdfs={len(pdfs)}')
          alias=Path('laobaixing_603883_2020_2025_annual_latest_quarterly.zip')
          alias.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('LATEST_QUARTER',quarter_period,quarter_label)
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: laobaixing-603883-annual-reports-final-v2
          path: |
            老百姓_603883_2020-2025年报及最新季报.zip
            laobaixing_603883_2020_2025_annual_latest_quarterly.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
