name: Temporary China Everbright source capture

on:
  push:
    branches:
      - tmp/china-everbright-source-capture-20260831
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 lxml Pillow
      - name: Capture HTML, JS, and preview assets
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, requests, urllib.parse
          from bs4 import BeautifulSoup
          from PIL import Image
          import io

          out=pathlib.Path('captured_sources'); out.mkdir()
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6'})
          targets={
            'hibor_5073681.html':'https://www.hibor.com.cn/repinfodetail_5073681.html',
            'fx_5370196_detail.html':'https://www.fxbaogao.com/detail/5370196',
            'fx_5370196_view.html':'https://www.fxbaogao.com/view?id=5370196',
            'fx_5040903_detail.html':'https://www.fxbaogao.com/detail/5040903',
            'fx_5040903_view.html':'https://www.fxbaogao.com/view?id=5040903',
          }
          manifest=[]
          for name,url in targets.items():
            try:
              r=s.get(url,timeout=90,allow_redirects=True)
              p=out/name; p.write_bytes(r.content)
              manifest.append({'name':name,'url':url,'final_url':r.url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),'encoding':r.encoding,'apparent':r.apparent_encoding})
              print('FETCH',name,r.status_code,len(r.content),r.url,flush=True)
            except Exception as e:
              manifest.append({'name':name,'url':url,'error':repr(e)})
              print('ERROR',name,repr(e),flush=True)

          # Fetch JS assets referenced by Hibor page.
          hp=out/'hibor_5073681.html'
          if hp.exists():
            html=hp.read_bytes().decode('utf-8','replace')
            soup=BeautifulSoup(html,'lxml')
            for i,tag in enumerate(soup.find_all('script',src=True)):
              u=urllib.parse.urljoin('https://www.hibor.com.cn/repinfodetail_5073681.html',tag['src'])
              try:
                r=s.get(u,timeout=60)
                name=f'hibor_script_{i}.js'
                (out/name).write_bytes(r.content)
                manifest.append({'name':name,'url':u,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type')})
                print('JS',i,r.status_code,len(r.content),u,flush=True)
              except Exception as e:
                print('JS_ERROR',i,u,repr(e),flush=True)

          # Capture visible preview gif and first two fx images.
          assets={
            'hibor_preview.gif':'https://huibobjb.hibor.com.cn/CheckMd5File/img/2026/4/202604222229109838.gif',
            'fx5370196_1.png':'https://public.fxbaogao.com/report-image/2026/04/17/5370196-1.png',
            'fx5370196_2.png':'https://public.fxbaogao.com/report-image/2026/04/17/5370196-2.png',
            'fx5040903_1.png':'https://public.fxbaogao.com/report-image/2025/09/03/5040903-1.png',
            'fx5040903_2.png':'https://public.fxbaogao.com/report-image/2025/09/03/5040903-2.png',
          }
          for name,url in assets.items():
            try:
              r=s.get(url,timeout=60,headers={'Referer':'https://www.fxbaogao.com/' if 'fx' in name else 'https://www.hibor.com.cn/'})
              (out/name).write_bytes(r.content)
              extra={}
              try:
                im=Image.open(io.BytesIO(r.content)); extra={'format':im.format,'size':im.size,'frames':getattr(im,'n_frames',1)}
              except Exception as e:
                extra={'image_error':repr(e)}
              manifest.append({'name':name,'url':url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type'),**extra})
              print('ASSET',name,r.status_code,len(r.content),extra,flush=True)
            except Exception as e:
              print('ASSET_ERROR',name,repr(e),flush=True)

          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: china-everbright-source-capture
          path: captured_sources/
          retention-days: 3
          if-no-files-found: error
