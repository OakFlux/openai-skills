name: Curate Xinquan 603179 recent broker deep reports 20261028

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xinquan-603179-broker-reports-curated-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, subprocess, time, zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          COMPANY='新泉股份'
          COMPANY_FULL='江苏新泉汽车饰件股份有限公司'
          STOCK_CODE='603179'
          AS_OF='2026-10-28'
          PACKAGE='新泉股份_603179_券商深度与公司研究报告_近年完整版_3份_截至20261028'
          ROOT=Path(PACKAGE); PDF_DIR=ROOT/'PDF原文'; PREVIEW_DIR=ROOT/'首页预览'
          PDF_DIR.mkdir(parents=True,exist_ok=True); PREVIEW_DIR.mkdir(parents=True,exist_ok=True)

          reports=[
              {
                  'info_code':'AP202509041738723994','report_date':'2025-09-04','broker':'国信证券',
                  'title':'全球化加速推进，看好座椅助力下主业中长期韧性',
                  'analysts':'唐旭霞、余珊','rating':'增持/优于大市','min_pages':10,
              },
              {
                  'info_code':'AP202412271641454138','report_date':'2024-12-27','broker':'开源证券',
                  'title':'公司深度报告：自主内外饰龙头，产品开拓+全球布局打开成长空间',
                  'analysts':'任浪、张越','rating':'买入','min_pages':20,
              },
              {
                  'info_code':'AP202412291641463292','report_date':'2024-12-29','broker':'西南证券',
                  'title':'汽车内饰件龙头，全球化进程开启',
                  'analysts':'郑连声、冯安琪','rating':'买入','min_pages':20,
              },
          ]

          session=requests.Session(); session.trust_env=False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer':'https://data.eastmoney.com/report/',
              'Accept':'application/pdf,*/*;q=0.8','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def safe_name(s):
              s=re.sub(r'[\\/:*?"<>|]+','_',str(s or '')); s=re.sub(r'\s+','',s).strip('._')
              return s[:100] or '报告'

          def download(code):
              last={}
              for prefix in ['H3','H2','H1','H4']:
                  url=f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_1.pdf'
                  for attempt in range(7):
                      try:
                          r=session.get(url,timeout=(25,360),allow_redirects=True)
                          last={'url':url,'status':r.status_code,'bytes':len(r.content),'content_type':r.headers.get('content-type',''),'final_url':r.url}
                          if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>100000:
                              return r.content,url,last
                      except Exception as exc:
                          last={'url':url,'error':repr(exc)}
                      time.sleep(1+attempt)
              raise RuntimeError(f'download failed {code}: {last}')

          manifest=[]
          for idx,spec in enumerate(reports,1):
              data,url,meta=download(spec['info_code'])
              filename=f"{idx:02d}_{safe_name(spec['broker'])}_新泉股份_{safe_name(spec['title'])}_{spec['report_date']}.pdf"
              dest=PDF_DIR/filename; dest.write_bytes(data)
              reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
              if pages<spec['min_pages']: raise RuntimeError(f'too few pages: {filename}: {pages}')
              text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(25,pages)])
              compact=re.sub(r'\s+','',text)
              if not any(k in compact for k in [COMPANY,COMPANY_FULL,STOCK_CODE]):
                  raise RuntimeError(f'issuer mismatch: {filename}')
              subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              prefix_path=PREVIEW_DIR/dest.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','140','-singlefile',str(dest),str(prefix_path)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              preview=Path(str(prefix_path)+'.png')
              if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError(f'preview failed: {filename}')
              sha=hashlib.sha256(data).hexdigest()
              manifest.append({**spec,'filename':filename,'actual_pages':pages,'bytes':len(data),'pdf_url':url,
                  'source_report_page':f"https://data.eastmoney.com/report/info/{spec['info_code']}.html",
                  'sha256':sha,'download_meta':meta,'issuer_identity_check':True,
                  'preview_file':str(Path('首页预览')/preview.name),
                  'validation':['PDF header','issuer identity','minimum page count','qpdf structure','first-page render']})

          readme=[
              '江苏新泉汽车饰件股份有限公司（603179.SH）近年券商深度与公司研究报告资料包',
              f'整理基准日：{AS_OF}','','本包收录3份公开可直接取得并完成全文核验的券商原始完整PDF。',
              '筛选标准：优先近年公司深度、全球化、品类扩张与座椅业务研究；排除年报、季报、中报和事件短评。',''
          ]
          for i,m in enumerate(manifest,1):
              readme += [f"{i}. {m['broker']}：《{m['title']}》",
                  f"   日期：{m['report_date']}；分析师：{m['analysts']}；评级：{m['rating']}",
                  f"   完整页数：{m['actual_pages']}页；文件：PDF原文/{m['filename']}",
                  f"   来源页面：{m['source_report_page']}",f"   SHA-256：{m['sha256']}",'']
          readme += ['报告内容和版权归原券商及作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (ROOT/'00_文件清单与说明.txt').write_text('\n'.join(readme),encoding='utf-8')
          (ROOT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'SHA256SUMS.txt').write_text(''.join(f"{m['sha256']}  PDF原文/{m['filename']}\n" for m in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(ROOT.rglob('*')):
                  if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(ROOT)}')
          with zipfile.ZipFile(zpath) as z:
              bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
              if bad or len(pdfs)!=3: raise RuntimeError(f'zip validation failed: bad={bad}, pdfs={len(pdfs)}')
          short=Path('xinquan_603179_recent_broker_deep_reports.zip'); short.write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print('REPORT_COUNT',len(manifest)); print('MANIFEST',json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: xinquan-603179-recent-broker-reports-final-20261028
          path: |
            新泉股份_603179_券商深度与公司研究报告_近年完整版_3份_截至20261028.zip
            xinquan_603179_recent_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
