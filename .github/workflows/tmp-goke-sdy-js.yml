name: Temporary inspect Sdyanbao download JavaScript

on:
  push:
    branches: [tmp-goke-sdy-js-20260830]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch page and grep download handlers
        shell: bash
        run: |
          python - <<'PY'
          import re, requests, urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.sdyanbao.com/'})
          for fid in [889842,412539,675371]:
            u=f'https://www.sdyanbao.com/detail/{fid}'
            r=s.get(u,timeout=60); print('\nPAGE',fid,r.status_code,len(r.content),r.url)
            html=r.text; soup=BeautifulSoup(html,'html.parser')
            print('SCRIPTS', [urllib.parse.urljoin(r.url,x['src']) for x in soup.find_all('script',src=True)])
            for needle in ['download','立即下载','data_source_uuid','original_id','file_url','page_url','api/file']:
              for m in list(re.finditer(re.escape(needle),html,re.I))[:10]:
                p=m.start(); print('HTML_CTX',needle,html[max(0,p-600):p+1800].replace('\n',' ')[:2400])
            for x in soup.find_all('script',src=True):
              jsu=urllib.parse.urljoin(r.url,x['src'])
              try:
                j=s.get(jsu,timeout=60); text=j.text
                if any(k in text.lower() for k in ['download','api/file','data_source_uuid','original_id']):
                  print('\nJS',jsu,j.status_code,len(j.content))
                  for needle in ['download','api/file','data_source_uuid','original_id','file_url','page_url']:
                    for m in list(re.finditer(re.escape(needle),text,re.I))[:40]:
                      p=m.start(); print('JS_CTX',needle,text[max(0,p-700):p+2500].replace('\n',' ')[:3200])
              except Exception as e: print('JS_ERR',jsu,repr(e))
          PY
