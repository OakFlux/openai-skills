name: Discover Deep Sanda filings
on:
  push:
    paths: ['.github/workflows/shensangda-000032-discovery-20261016.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python - <<'PY'
          import json, requests, re
          from pathlib import Path
          s=requests.Session(); s.trust_env=False
          s.headers['User-Agent']='Mozilla/5.0'
          rows=[]
          for p in range(1,80):
              u='https://np-anotice-stock.eastmoney.com/api/security/ann'
              q={'sr':'-1','page_size':'100','page_index':p,'ann_type':'A','client_source':'web','stock_list':'000032','f_node':'0','s_node':'0'}
              d=s.get(u,params=q,timeout=90).json(); b=((d.get('data') or {}).get('list') or [])
              if not b: break
              rows += b
          out=[]
          for r in rows:
              t=str(r.get('title') or ''); c=re.sub(r'\s+','',t)
              if ('年度报告' in c or '招股说明书' in c or '招股意向书' in c or '第一季度报告' in c or '第三季度报告' in c) and '摘要' not in c:
                  out.append({'title':t,'date':r.get('display_time'),'art_code':r.get('art_code') or r.get('artCode')})
          Path('discovery').mkdir(); Path('discovery/relevant.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TOTAL',len(rows),'RELEVANT',len(out)); print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shensangda-filing-discovery
          path: discovery
