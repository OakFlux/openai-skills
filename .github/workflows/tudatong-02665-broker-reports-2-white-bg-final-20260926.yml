name: Build corrected Tudatong 02665 broker report package 2 reports 20260926

on:
  push:
    paths:
      - '.github/workflows/tudatong-02665-broker-reports-2-white-bg-final-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf

      - name: Build corrected package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess, time, zipfile
          from io import BytesIO
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE='图达通_02665_券商深度报告_公开预览版_2份'
          root=Path(PACKAGE); root.mkdir(exist_ok=True)
          renders=root/'首页预览'; renders.mkdir(exist_ok=True)
          work=Path('_work_corrected'); work.mkdir(exist_ok=True)

          reports=[
            {
              'broker':'国盛证券',
              'title':'图达通：聚焦激光雷达双路线布局，车端爆发及多元场景打开成长空间',
              'date':'2026-04-23',
              'analysts':'丁逸朦、刘晓恬',
              'rating':'买入（首次）',
              'original_pages':21,
              'source_page':'https://www.fxbaogao.com/detail/5371458',
              'image_urls':[
                'https://public.fxbaogao.com/report-image/2026/04/23/5371458-1.png',
                'https://public.fxbaogao.com/report-image/2026/04/23/5371458-2.png',
              ],
              'filename':'01_国盛证券_图达通_聚焦激光雷达双路线布局车端爆发及多元场景打开成长空间_公开预览版_2026-04-23.pdf',
            },
            {
              'broker':'西部证券',
              'title':'图达通：聚焦1550&905nm路线，车端拓客及多元应用驱动增长',
              'date':'2026-06-29',
              'analysts':'齐天翔',
              'rating':'买入（首次）',
              'original_pages':22,
              'source_page':'https://www.fxbaogao.com/detail/5511320',
              'image_urls':[
                'https://public.fxbaogao.com/report-image/2026/06/29/5511320-1.png',
                'https://public.fxbaogao.com/report-image/2026/06/29/5511320-2.png',
              ],
              'filename':'02_西部证券_图达通_聚焦1550及905nm路线车端拓客及多元应用驱动增长_公开预览版_2026-06-29.pdf',
            },
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://www.fxbaogao.com/','Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'})

          def fetch_image(url):
            last=None
            for attempt in range(4):
              try:
                r=s.get(url,timeout=(15,40),allow_redirects=True)
                last=(r.status_code,len(r.content),r.headers.get('content-type'))
                if r.status_code==200 and len(r.content)>20000:
                  with Image.open(BytesIO(r.content)) as im: im.verify()
                  return r.content
              except Exception as e: last=repr(e)
              time.sleep(attempt+1)
            raise RuntimeError(f'failed image {url}: {last}')

          def flatten_on_white(path: Path) -> Image.Image:
            with Image.open(path) as src:
              rgba=src.convert('RGBA')
              canvas=Image.new('RGBA',rgba.size,(255,255,255,255))
              canvas.alpha_composite(rgba)
              return canvas.convert('RGB')

          manifest=[]
          for idx,rec in enumerate(reports,1):
            wd=work/f'r{idx}'; wd.mkdir(exist_ok=True)
            ips=[]
            for pno,url in enumerate(rec['image_urls'],1):
              ip=wd/f'{pno:02d}.png'; ip.write_bytes(fetch_image(url)); ips.append(ip)
            opened=[]
            out=root/rec['filename']
            try:
              for ip in ips: opened.append(flatten_on_white(ip))
              opened[0].save(out,save_all=True,append_images=opened[1:],resolution=150.0,quality=95)
            finally:
              for im in opened: im.close()
            pages=len(PdfReader(str(out),strict=False).pages)
            if pages!=2: raise RuntimeError(f'page mismatch {out}: {pages}')
            subprocess.run(['qpdf','--check',str(out)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            # Render every page for verification; keep both page previews.
            page_render_dir=renders/out.stem
            page_render_dir.mkdir(exist_ok=True)
            subprocess.run(['pdftoppm','-png','-r','130',str(out),str(page_render_dir/'page')],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            rendered=sorted(page_render_dir.glob('page-*.png'))
            if len(rendered)!=2 or any(p.stat().st_size<20000 for p in rendered): raise RuntimeError('render failed')
            sha=hashlib.sha256(out.read_bytes()).hexdigest()
            manifest.append({**rec,'public_preview_pages':pages,'pdf_file':out.name,'bytes':out.stat().st_size,'sha256':sha,'rendered_pages':[str(Path('首页预览')/out.stem/p.name) for p in rendered],'validation':['image integrity','transparency composited on white','PDF page count','qpdf structure','all-page render']})

          lines=['图达通（02665.HK）券商深度报告公开预览资料包','整理日期：2026-09-26','',
                 '本包收录2份图达通首次覆盖深度报告的公开预览原页。完整券商PDF需登录或具备相应访问权限。',
                 '本包没有绕过登录、会员或付费限制，PDF文件名已明确标注“公开预览版”。',
                 '预览PNG含透明通道，本包已按白色纸张背景正确合成，避免正文或表格文字因透明背景而不可见。','']
          for i,r in enumerate(manifest,1):
            lines += [f"{i}. {r['broker']}：《{r['title']}》",f"   日期：{r['date']}；评级：{r['rating']}；分析师：{r['analysts']}",f"   原报告：{r['original_pages']}页；本PDF：{r['public_preview_pages']}页公开原始预览页面",f"   来源页面：{r['source_page']}",f"   SHA-256：{r['sha256']}",'']
          lines += ['报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['pdf_file']}\n" for r in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); assert bad is None,bad
            assert len([n for n in z.namelist() if n.lower().endswith('.pdf')])==2
          print('FINAL_ZIP',zpath,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tudatong-02665-broker-reports-public-preview-corrected-final
          path: 图达通_02665_券商深度报告_公开预览版_2份.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
