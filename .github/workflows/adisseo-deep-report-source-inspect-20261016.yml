name: Inspect public sources for Adisseo deep report PDF 20261016

on:
  push:
    paths:
      - '.github/workflows/adisseo-deep-report-source-inspect-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install inspection tools
        run: python -m pip install --quiet curl_cffi beautifulsoup4 lxml

      - name: Fetch and inspect pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import urljoin
          from curl_cffi import requests
          from bs4 import BeautifulSoup

          out=Path('adisseo_source_inspect'); out.mkdir(exist_ok=True)
          targets={
            'sgpjbg':'https://www.sgpjbg.com/baogao/4125.html',
            'vzkoo':'https://www.vzkoo.com/document/202510090d4a401acd591e49f0de2a92.html',
            'yanbaoke':'https://www.yanbaoke.com/info/GGXCCJ8MXobXVExBDJ2WNr',
          }
          sess=requests.Session(impersonate='chrome')
          summary=[]
          for name,url in targets.items():
            print('\n=== TARGET',name,url,'===',flush=True)
            try:
              r=sess.get(url,timeout=120,allow_redirects=True,headers={
                'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
                'Referer':'https://www.google.com/',
              })
              print('STATUS',r.status_code,'FINAL',r.url,'BYTES',len(r.content),'TYPE',r.headers.get('content-type'),flush=True)
              text=r.text
              (out/f'{name}.html').write_text(text,encoding='utf-8',errors='replace')
              soup=BeautifulSoup(text,'lxml')
              found=[]
              for tag in soup.find_all(True):
                for attr in ['href','src','data-src','data-url','data-file','data-pdf','data-download','content','value']:
                  val=tag.get(attr)
                  if not val or not isinstance(val,str): continue
                  absu=urljoin(str(r.url),val)
                  if any(k in absu.lower() for k in ['pdf','download','file','document','oss','report','baogao','yanbao','docid','preview']):
                    found.append({'tag':tag.name,'attr':attr,'value':val,'absolute':absu})
              # Extract URL-like strings and JSON keys from raw source.
              raw_urls=sorted(set(re.findall(r'https?://[^\s"\'<>`\\]+',text,re.I)))
              for u in raw_urls:
                if any(k in u.lower() for k in ['pdf','download','file','document','oss','report','baogao','yanbao','preview']):
                  found.append({'tag':'raw','attr':'url','value':u,'absolute':u})
              contexts=[]
              for key in ['.pdf','download','fileUrl','pdfUrl','docId','documentId','reportId','oss','preview','sourceUrl','attachment','attach']:
                pos=0; count=0
                while True:
                  pos=text.lower().find(key.lower(),pos)
                  if pos<0 or count>=20: break
                  contexts.append({'key':key,'context':text[max(0,pos-500):pos+1500]})
                  pos+=len(key); count+=1
              # De-duplicate.
              seen=set(); dedup=[]
              for x in found:
                k=x['absolute']
                if k in seen: continue
                seen.add(k); dedup.append(x)
              (out/f'{name}_links.json').write_text(json.dumps(dedup,ensure_ascii=False,indent=2),encoding='utf-8')
              (out/f'{name}_contexts.json').write_text(json.dumps(contexts,ensure_ascii=False,indent=2),encoding='utf-8')
              print('MATCHED_LINKS',json.dumps(dedup[:80],ensure_ascii=False,indent=2),flush=True)
              print('CONTEXTS',json.dumps(contexts[:30],ensure_ascii=False,indent=2)[:30000],flush=True)
              summary.append({'name':name,'url':url,'status':r.status_code,'final':str(r.url),'bytes':len(r.content),'matched_links':len(dedup),'contexts':len(contexts)})
            except Exception as exc:
              print('ERROR',repr(exc),flush=True)
              summary.append({'name':name,'url':url,'error':repr(exc)})
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('\nSUMMARY',json.dumps(summary,ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload inspection output
        uses: actions/upload-artifact@v4
        with:
          name: adisseo-deep-report-source-inspect
          path: adisseo_source_inspect
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
