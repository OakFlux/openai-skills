name: Discover historical bearing reports for Lixing 20261021

on:
  push:
    paths:
      - '.github/workflows/lixing-300421-historical-bearing-discover-20261021.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - run: python -m pip install --quiet requests
      - name: Query historical bearing reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,json,time
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36','Referer':'https://data.eastmoney.com/report/'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[
            ('2022-02-25','2022-03-04'),
            ('2022-06-24','2022-07-02'),
            ('2022-08-04','2022-08-12'),
            ('2022-10-17','2022-10-25'),
            ('2023-01-07','2023-01-16'),
            ('2023-02-24','2023-03-05'),
            ('2023-06-20','2023-07-05'),
            ('2023-11-01','2023-12-31'),
            ('2024-01-01','2024-02-29'),
          ]
          terms=['轴承','滚子','滚动体','钢球','陶瓷球']
          all_found=[];seen=set()
          for begin,end in windows:
            print('\nWINDOW',begin,end)
            for qtype in ['0','1','2']:
              found=[];total=1
              for page in range(1,121):
                if page>total:break
                p={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','author':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                payload=None
                for attempt in range(5):
                  try:
                    r=s.get(api,params=p,timeout=(20,120))
                    if r.status_code==200:payload=r.json();break
                  except Exception as e:print('ERR',begin,qtype,page,repr(e))
                  time.sleep(1+attempt)
                if payload is None:break
                total=min(int(payload.get('TotalPage') or 1),120)
                data=payload.get('data') or []
                if isinstance(data,dict):data=data.get('list') or data.get('data') or []
                if not data:break
                for row in data:
                  title=str(row.get('title') or '')
                  info=str(row.get('infoCode') or '')
                  pages=int(float(row.get('attachPages') or 0))
                  if info and info not in seen and pages>=10 and any(t in title for t in terms):
                    item={k:row.get(k) for k in ['infoCode','title','orgSName','orgName','publishDate','attachPages','researcher','emRatingName','stockCode','stockName','industryName']}
                    found.append(item);all_found.append(item);seen.add(info)
                if page>=total or len(data)<100:break
              print('QTYPE',qtype,'FOUND',json.dumps(found,ensure_ascii=False,indent=2))
          print('\nALL_FOUND',json.dumps(all_found,ensure_ascii=False,indent=2))
          PY
