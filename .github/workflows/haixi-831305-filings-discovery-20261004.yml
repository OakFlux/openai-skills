name: Discover Haixi Communication 831305 filings 20261004

on:
  push:
    paths:
      - '.github/workflows/haixi-831305-filings-discovery-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Query public announcement API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, json, re, requests, time

          STOCK='831305'
          s=requests.Session(); s.trust_env=False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Referer':'https://data.eastmoney.com/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })
          endpoint='https://np-anotice-stock.eastmoney.com/api/security/ann'
          rows=[]
          for page in range(1, 25):
              params={
                  'sr':'-1','page_size':'100','page_index':str(page),'ann_type':'A',
                  'client_source':'web','stock_list':STOCK,'f_node':'0','s_node':'0'
              }
              r=s.get(endpoint,params=params,timeout=60)
              print('QUERY',page,r.status_code,len(r.content),r.url,flush=True)
              r.raise_for_status()
              payload=r.json(); data=payload.get('data') if isinstance(payload,dict) else None
              batch=[]
              if isinstance(data,dict): batch=data.get('list') or data.get('data') or data.get('rows') or []
              elif isinstance(data,list): batch=data
              if not batch: break
              rows.extend(batch)
              if len(batch)<100: break
              time.sleep(.2)

          def clean(x):
              return re.sub(r'\s+','',html.unescape(re.sub(r'<[^>]+>','',str(x or ''))))
          def code(row):
              return str(row.get('art_code') or row.get('artCode') or row.get('infoCode') or '')
          def date(row):
              raw=str(row.get('notice_date') or row.get('display_time') or row.get('noticeDate') or '')
              m=re.search(r'(20\d{2})-(\d{2})-(\d{2})',raw)
              return '-'.join(m.groups()) if m else raw

          seen=set(); out=[]
          for row in rows:
              c=code(row)
              if c and c not in seen:
                  seen.add(c); out.append(row)
          print('TOTAL',len(out),flush=True)
          keys=('年度报告','季度报告','一季度报告','三季度报告','半年度报告','招股说明书','公开发行说明书','上市公告书')
          for row in out:
              title=clean(row.get('title') or row.get('announcementTitle'))
              if any(k in title for k in keys):
                  print('MATCH',json.dumps({'title':title,'art_code':code(row),'date':date(row)},ensure_ascii=False),flush=True)
          PY
