name: Temporary Inspect Eastmoney Stock Calendar API

on:
  push:
    branches:
      - tmp/tianshun-wind-reports-20260830
    paths:
      - .github/workflows/tmp-tianshun-calendar-api-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect stock calendar page and scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import html,json,re,requests
          from pathlib import Path
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          page='https://data.eastmoney.com/stockcalendar/002531.html'
          r=s.get(page,timeout=60);r.raise_for_status()
          text=html.unescape(r.text).replace('\\/','/')
          soup=BeautifulSoup(text,'html.parser')
          scripts=[urljoin(r.url,t.get('src')) for t in soup.find_all('script') if t.get('src')]
          findings={'page_status':r.status_code,'page_bytes':len(r.content),'scripts':scripts,'page_snippets':[],'script_hits':[]}
          needles=['stockcalendar','RPTA_WEB_STOCKCALENDAR','calendar','reportName','研报','report','002531','datacenter-web','api/data','event']
          for needle in needles:
            for m in list(re.finditer(re.escape(needle),text,re.I))[:20]:
              findings['page_snippets'].append({'needle':needle,'text':re.sub(r'\s+',' ',text[max(0,m.start()-500):m.start()+1800])})
          for u in scripts:
            try:
              q=s.get(u,timeout=60);body=html.unescape(q.text).replace('\\/','/')
              hits=[]
              for needle in needles:
                for m in list(re.finditer(re.escape(needle),body,re.I))[:40]:
                  hits.append({'needle':needle,'text':re.sub(r'\s+',' ',body[max(0,m.start()-700):m.start()+2400])})
              urls=sorted(set(re.findall(r'https?://[^"\'<>\s]+',body,re.I)))
              if hits or any('calendar' in x.lower() or 'data.eastmoney' in x.lower() for x in urls):
                findings['script_hits'].append({'url':u,'status':q.status_code,'bytes':len(q.content),'hits':hits[:300],'urls':[x for x in urls if any(k in x.lower() for k in ['calendar','data.eastmoney','datacenter','api'])][:200]})
            except Exception as e:
              findings['script_hits'].append({'url':u,'error':repr(e)})
          Path('out').mkdir(exist_ok=True)
          Path('out/tianshun_calendar_api_findings.json').write_text(json.dumps(findings,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'scripts':len(scripts),'script_hits':len(findings['script_hits']),'page_snippets':len(findings['page_snippets'])},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tianshun-calendar-api-findings
          path: out/tianshun_calendar_api_findings.json
          retention-days: 3
