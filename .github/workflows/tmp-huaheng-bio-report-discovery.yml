name: Temporary Huaheng Biotech broker report discovery

on:
  push:
    branches:
      - tmp-huaheng-bio-reports-20260830
    paths:
      - .github/workflows/tmp-huaheng-bio-report-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query public report indexes and test PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math, re, requests

          CODE='688639'
          NAME='华恒生物'
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Referer':f'https://data.eastmoney.com/report/{CODE}.html',
              'Accept':'application/json,text/plain,*/*',
          })

          # Current Eastmoney API.
          body={
              'pageSize':300,'pageNo':1,'p':1,'pageNum':1,'pageNumber':1,
              'beginTime':'2020-01-01','endTime':'2026-08-30','code':CODE,
              'industryCode':'*','rating':None,'ratingChange':None,'orgCode':None,'rcode':''
          }
          r=s.post('https://reportapi.eastmoney.com/report/list2',json=body,
                   headers={'Referer':'https://data.eastmoney.com/','Content-Type':'application/json','Accept':'application/json,text/plain,*/*'},timeout=90)
          print('EM_LIST2',r.status_code,len(r.content),r.headers.get('content-type'),r.url)
          print('EM_HEAD',r.text[:500])
          r.raise_for_status(); obj=r.json(); rows=obj.get('data') or []
          print('EM_ROWS',len(rows),'HITS',obj.get('hits'))
          for row in rows:
              meta={k:row.get(k) for k in [
                  'publishDate','orgSName','orgName','title','attachPages','attachSize','infoCode',
                  'encodeUrl','stockCode','stockName','reportType','emRatingName','sRatingName',
                  'researcher','author','column','indvIsNew'
              ]}
              print('EM_REPORT',json.dumps(meta,ensure_ascii=False))
              info=row.get('infoCode')
              if info:
                  for pre in ['H3','H2','H1']:
                      u=f'https://pdf.dfcfw.com/pdf/{pre}_{info}_1.pdf'
                      try:
                          x=s.get(u,headers={'Accept':'application/pdf,*/*','Referer':'https://data.eastmoney.com/'},timeout=60,allow_redirects=True)
                          print('EM_PDF',info,pre,x.status_code,len(x.content),x.headers.get('content-type'),x.content[:8].hex(),x.url)
                      except Exception as e:
                          print('EM_PDF_ERR',info,pre,repr(e))

          # Public Sdyanbao index to locate reports not in Eastmoney.
          sd=requests.Session(); sd.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Origin':'https://www.sdyanbao.com','Referer':'https://www.sdyanbao.com/',
              'Content-Type':'application/json;charset=UTF-8','Accept':'application/json,text/plain,*/*'
          })
          seen=set()
          for q in [NAME,CODE,'安徽华恒生物科技','华恒生物 首次覆盖','华恒生物 深度报告']:
              for page in range(1,6):
                  payload={'device':1,'hideTrader':0,'onlyTitle':0,'order':0,'page':page,'pageSize':100,'keyword':q,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':[],'industryIds':[]}
                  rr=sd.post('https://api.sdyanbao.com/api/file/search',json=payload,timeout=90)
                  print('\nSD_SEARCH',q,page,rr.status_code,len(rr.content),rr.headers.get('content-type'))
                  rr.raise_for_status(); data=(rr.json().get('data') or {}); files=data.get('files') or []
                  print('SD_TOTAL',data.get('total'),'COUNT',len(files))
                  for f in files:
                      fid=f.get('id')
                      if fid in seen: continue
                      stock=f.get('stock') or {}
                      blob=' '.join([str(f.get('name') or ''),str(f.get('content') or '')[:1500],str(stock.get('name') or ''),str(stock.get('code') or '')])
                      if NAME not in blob and CODE not in blob and '安徽华恒生物科技' not in blob:
                          continue
                      seen.add(fid)
                      meta={
                          'id':fid,'name':f.get('name'),'date':f.get('time_text'),'pages':f.get('page_count'),
                          'size':f.get('file_size'),'type':(f.get('type') or {}).get('name'),
                          'organization':(f.get('organization') or {}).get('name'),'stock':stock,
                          'researcher':f.get('researcher'),'uuid':f.get('data_source_uuid'),
                          'data_source':f.get('data_source'),'original_id':f.get('original_id'),
                          'page_url':f.get('page_url'),'share_url':f.get('share_url'),
                          'summary':str(f.get('summary') or '')[:500]
                      }
                      print('SD_REPORT',json.dumps(meta,ensure_ascii=False))
                      uuid=str(f.get('data_source_uuid') or '')
                      for info in re.findall(r'AP\d+',uuid):
                          for pre in ['H3','H2','H1']:
                              u=f'https://pdf.dfcfw.com/pdf/{pre}_{info}_1.pdf'
                              x=s.get(u,headers={'Accept':'application/pdf,*/*','Referer':'https://data.eastmoney.com/'},timeout=60,allow_redirects=True)
                              print('SD_AP_PDF',fid,info,pre,x.status_code,len(x.content),x.headers.get('content-type'),x.content[:8].hex(),x.url)
                  if not files or page*100>=int(data.get('total') or 0): break
          PY
