name: Inspect CITIC Pandairy image assets
on:
  push:
    paths: ['.github/workflows/pandairy-citic-image-assets-20261104.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import json,re,html
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          u='https://www.sgpjbg.com/baogao/28394.html'
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 Chrome/155','Accept-Language':'zh-CN,zh;q=0.9'})
          r=s.get(u,timeout=90);print('FETCH',r.status_code,len(r.content),r.url,flush=True)
          soup=BeautifulSoup(r.text,'html.parser')
          items=[]
          for tag in soup.find_all(True):
            for attr in ('src','href','data-src','data-original','data-url','value','content'):
              val=tag.get(attr)
              if val:
                val=str(val)
                if any(k in val.lower() for k in ('fileroot','file.sgpjbg','bookgroup','fileupload','28394','.gif','.jpg','.jpeg','.png','.webp')):
                  items.append({'tag':tag.name,'attr':attr,'url':urljoin(r.url,html.unescape(val)),'text':tag.get_text(' ',strip=True)[:200]})
          print('ASSETS',json.dumps(items,ensure_ascii=False,indent=2),flush=True)
          for m in re.findall(r'https?://[^\"\'<> ]+|/[^\"\'<> ]+',html.unescape(r.text),re.I):
            if any(k in m.lower() for k in ('fileroot','file.sgpjbg','bookgroup','fileupload','28394','.gif','.jpg','.jpeg','.png','.webp')):
              print('RAWURL',urljoin(r.url,m.rstrip(');,]')),flush=True)
          PY
