name: Query Hipine filing endpoints

on:
  push:
    branches:
      - tmp-hipine-filings-20260914

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect endpoints
        shell: bash
        run: |
          cat > /tmp/query.py <<'PY'
          import json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup
          S=requests.Session(); S.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.neeq.com.cn/'})

          def get(u,**kw):
              try:
                  r=S.get(u,timeout=40,**kw)
                  print('\nGET',u,'->',r.status_code,r.url,len(r.content),r.headers.get('content-type'))
                  return r
              except Exception as e:
                  print('ERR',u,repr(e)); return None

          print('=== exact mobile inline query function ===')
          r=get('https://www.neeq.cc/m/company/info_public.html')
          if r:
              t=r.content.decode('utf-8','ignore')
              for key in ['function queryInfoList','/info/list.do','companyCode','pageSize','keyword']:
                  pos=t.find(key)
                  if pos>=0: print('CTX',key,t[max(0,pos-1200):pos+3000])

          print('=== desktop JS endpoint contexts ===')
          r=get('https://www.neeq.com.cn/template/1/bluewise/_files/js/index/index.min.js')
          if r:
              t=r.text
              for key in ['/disclosureInfoController/companyAnnouncementNoCache.do','/disclosureInfoController/companyAnnouncement.do','companyCode=']:
                  start=0
                  while True:
                      pos=t.find(key,start)
                      if pos<0: break
                      print('CTX',key,'POS',pos,t[max(0,pos-2500):pos+4500])
                      start=pos+1

          print('=== Eastmoney notice-list HTML ===')
          for code in ['838948','873888']:
              for u in [f'https://xinsanban.eastmoney.com/Article/NoticeList/{code}',f'https://xinsanban.eastmoney.com/Article/NoticeList/{code}?pageIndex=2',f'https://xinsanban.eastmoney.com/Article/NoticeList/{code}/2']:
                  r=get(u)
                  if not r: continue
                  t=r.text
                  soup=BeautifulSoup(t,'html.parser')
                  print('TITLE',soup.title.string if soup.title else None)
                  hits=[]
                  for a in soup.find_all('a',href=True):
                      href=urljoin(r.url,a['href']); text=' '.join(a.get_text(' ',strip=True).split())
                      if 'NoticeContent' in href or code in text or '年度报告' in text or '公开转让' in text:
                          hits.append((text,href))
                  print('LINKS',json.dumps(hits[:200],ensure_ascii=False,indent=2))
                  for key in ['NoticeContent','pageIndex','pageCount','totalPage','Ajax','ajax','NoticeList']:
                      pos=t.find(key)
                      if pos>=0: print('ECTX',code,key,t[max(0,pos-1000):pos+2500])

          print('=== NEEQ endpoint parameter probes ===')
          endpoints=['https://www.neeq.com.cn/disclosureInfoController/companyAnnouncement.do','https://www.neeq.com.cn/disclosureInfoController/companyAnnouncementNoCache.do']
          probes=[
              {'companyCode':'838948','page':0,'size':100},
              {'companyCode':'838948','page':0,'pageSize':100},
              {'companyCode':'838948','pageNum':0,'pageSize':100},
              {'companyCode':'838948','stockCode':'838948','page':0,'size':100},
              {'companyCode':'838948','disclosureType':'5','page':0,'size':100},
              {'companyCode':'838948','keyword':'838948','page':0,'size':100},
              {'companyCode':'838948','isNewThree':'1','page':0,'size':100},
              {'companyCode':'838948','xxfcbj':'1','page':0,'size':100},
              {'companyCode':'838948','startTime':'2016-01-01','endTime':'2019-12-31','page':0,'size':100},
          ]
          for ep in endpoints:
              for p in probes:
                  try:
                      r=S.get(ep,params=p,timeout=30)
                      body=r.text[:1000].replace('\n',' ')
                      print('PROBE',ep,r.url,r.status_code,len(r.content),body)
                  except Exception as e: print('PERR',ep,p,repr(e))
          PY
          python /tmp/query.py | tee query.log
      - uses: actions/upload-artifact@v4
        with:
          name: hipine-query-log
          path: query.log
          retention-days: 3
