name: Temporary fxbaogao public reader inspection v2

on:
  push:
    branches:
      - tmp-johnson-electric-reports-20260831
    paths:
      - .github/workflows/tmp-fxbaogao-interface-inspect-v2.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare libraries
        run: python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 pillow
      - name: Inspect detail HTML, scripts, APIs and public page assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, re, requests, urllib.parse
          from PIL import Image
          from bs4 import BeautifulSoup

          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          session=requests.Session(); session.headers.update({'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/json,*/*'})
          reports=[('5099547','国泰海通'),('5138556','爱建证券'),('5284768','国盛证券')]
          for rid,label in reports:
              url=f'https://www.fxbaogao.com/detail/{rid}'
              r=session.get(url,timeout=90,allow_redirects=True)
              print('\n=== DETAIL',rid,label,r.status_code,len(r.content),r.headers.get('content-type'),r.url,'===')
              text=r.text
              print('HEAD',text[:1200])
              soup=BeautifulSoup(text,'html.parser')
              for tag in soup.find_all(['a','button','iframe','embed','object','source','img']):
                  blob=str(tag).lower()
                  if any(k in blob for k in ['pdf','download','reader','preview','report-image','page']):
                      attrs={k:v for k,v in tag.attrs.items() if k in ['href','src','data','data-src','onclick','id','class']}
                      if attrs: print('TAG',json.dumps({'tag':tag.name,'text':tag.get_text(' ',strip=True)[:200],'attrs':attrs},ensure_ascii=False))
              for pat in [
                  r'https?://[^\s"\'<>]+\.pdf(?:\?[^\s"\'<>]*)?',
                  r'https?://[^\s"\'<>]+(?:report-image|reader|preview|download|file)[^\s"\'<>]*',
                  r'/_next/static/[^\s"\'<>]+\.js',
              ]:
                  vals=sorted(set(re.findall(pat,text,re.I)))
                  for v in vals[:200]: print('ASSET',v)
              scripts=[]
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',text,re.I):
                  scripts.append(urllib.parse.urljoin(r.url,src))
              for jsurl in scripts:
                  try:
                      js=session.get(jsurl,timeout=60).text
                      if rid in js or any(n.lower() in js.lower() for n in ['report-image','downloadurl','pdfurl','pagecount','reader','preview']):
                          print('JS_HIT',jsurl,'LEN',len(js))
                          for needle in [rid,'report-image','downloadUrl','pdfUrl','pageCount','page_count','reader','preview']:
                              for h in list(re.finditer(re.escape(needle),js,re.I))[:10]:
                                  p=h.start(); print('JS_CTX',needle,js[max(0,p-600):p+2200][:2800])
                  except Exception as e: print('JS_ERR',jsurl,repr(e))

              # Test links found directly in the HTML.
              direct=[]
              for attr in ['href','src','data-src']:
                  for tag in soup.find_all(attrs={attr:True}):
                      val=urllib.parse.urljoin(r.url,str(tag.get(attr)))
                      if any(k in val.lower() for k in ['.pdf','report-image','preview','reader','download']): direct.append(val)
              for u in sorted(set(direct)):
                  try:
                      x=session.get(u,headers={'Referer':r.url},timeout=60,allow_redirects=True)
                      print('DIRECT_TEST',u,x.status_code,len(x.content),x.headers.get('content-type'),repr(x.content[:20]),x.url)
                      if x.status_code==200 and str(x.headers.get('content-type') or '').startswith('image/') and len(x.content)>5000:
                          im=Image.open(io.BytesIO(x.content)); print('IMAGE_INFO',im.size,im.format)
                  except Exception as e: print('DIRECT_ERR',u,repr(e))
          PY
