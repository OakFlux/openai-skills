name: Build iSoftStone broker deep report previews 20260927

on:
  push:
    paths:
      - '.github/workflows/isoftstone-301236-broker-deep-reports-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf

      - name: Discover public previews, build PDFs and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from io import BytesIO
          from pathlib import Path
          from typing import Any

          import requests
          from PIL import Image
          from pypdf import PdfReader

          PACKAGE = '软通动力_301236_券商深度报告_公开预览版'
          root = Path(PACKAGE)
          root.mkdir(exist_ok=True)
          preview_dir = root / '首页预览'
          preview_dir.mkdir(exist_ok=True)
          work = Path('_isoftstone_report_work')
          work.mkdir(exist_ok=True)

          targets = [
              {
                  'priority': 1,
                  'broker': '国泰海通证券',
                  'title': '软通动力（301236）首次覆盖：软硬协同，有望受益于信创拓展',
                  'short_title': '软硬协同，有望受益于信创拓展',
                  'date': '2026-03-10',
                  'analysts': '杨林、魏宗（以报告原页为准）',
                  'rating': '增持（首次覆盖）',
                  'known_id': None,
                  'queries': ['软通动力 软硬协同 有望受益于信创拓展','软硬协同 有望受益于信创拓展','软通动力 国泰海通 首次覆盖'],
                  'required': ['软通动力','软硬协同','信创拓展'],
              },
              {
                  'priority': 2,
                  'broker': '西部证券',
                  'title': '软通动力（301236）首次覆盖：全面的数字技术服务提供商，赋能千行百业',
                  'short_title': '全面的数字技术服务提供商，赋能千行百业',
                  'date': '2024-05-21',
                  'analysts': '郑宏达',
                  'rating': '买入（首次覆盖）',
                  'known_id': None,
                  'queries': ['软通动力 全面的数字技术服务提供商 赋能千行百业','全面的数字技术服务提供商 赋能千行百业','软通动力 西部证券 首次覆盖'],
                  'required': ['软通动力','全面的数字技术服务提供商','赋能千行百业'],
              },
              {
                  'priority': 3,
                  'broker': '国泰君安证券',
                  'title': '软通动力（301236）首次覆盖报告：全面布局华为生态的核心服务商',
                  'short_title': '全面布局华为生态的核心服务商',
                  'date': '2023-12-12',
                  'analysts': '李沐华、李博伦',
                  'rating': '增持（首次覆盖）',
                  'known_id': 681452,
                  'queries': ['软通动力 全面布局华为生态 核心服务商'],
                  'required': ['软通动力','全面布局华为生态','核心服务商'],
              },
              {
                  'priority': 4,
                  'broker': '德邦证券',
                  'title': '软通动力（301236）首次覆盖：深度受益信创浪潮，向产品化公司转型',
                  'short_title': '深度受益信创浪潮，向产品化公司转型',
                  'date': '2023-03-03',
                  'analysts': '赵伟博',
                  'rating': '买入（首次覆盖）',
                  'known_id': None,
                  'queries': ['软通动力 深度受益信创浪潮 向产品化公司转型','深度受益信创浪潮 向产品化公司转型','软通动力 德邦证券 首次覆盖'],
                  'required': ['软通动力','深度受益信创浪潮','产品化公司转型'],
              },
              {
                  'priority': 5,
                  'broker': '浙商证券',
                  'title': '软通动力（301236）深度报告：深入参与华为生态，软硬结合全栈赋能',
                  'short_title': '深入参与华为生态，软硬结合全栈赋能',
                  'date': '2024-06-05',
                  'analysts': '以报告原页为准',
                  'rating': '以报告原页为准',
                  'known_id': None,
                  'queries': ['软通动力 深入参与华为生态 软硬结合全栈赋能','深入参与华为生态 软硬结合全栈赋能','软通动力 浙商证券 深度报告'],
                  'required': ['软通动力','深入参与华为生态','软硬结合全栈赋能'],
              },
          ]

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/',
              'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def post_json(url: str, payload: dict[str, Any]) -> dict[str, Any]:
              last = None
              for attempt in range(6):
                  try:
                      r = session.post(url, json=payload, timeout=(20, 120))
                      last = {'status':r.status_code,'text':r.text[:500]}
                      if r.status_code == 200:
                          return r.json()
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'POST failed {url}: {last}')

          def collect_records(obj: Any) -> list[dict[str, Any]]:
              out: list[dict[str, Any]] = []
              def walk(x: Any) -> None:
                  if isinstance(x, dict):
                      if isinstance(x.get('id'), int) and isinstance(x.get('name'), str):
                          out.append(x)
                      for v in x.values():
                          walk(v)
                  elif isinstance(x, list):
                      for v in x:
                          walk(v)
              walk(obj)
              dedup = {}
              for r in out:
                  dedup[r['id']] = r
              return list(dedup.values())

          def norm(s: str) -> str:
              return re.sub(r'[\s（）()：:，,。；;、·—\-_/&＋+“”"‘’]+','',s or '').lower()

          search_log: dict[str, Any] = {}
          record_pool: dict[int, dict[str, Any]] = {}

          def search(q: str) -> list[dict[str, Any]]:
              if q in search_log:
                  return collect_records(search_log[q])
              payload = {
                  'device':1,'hideTrader':0,'onlyTitle':1,'order':0,
                  'page':1,'pageSize':100,'keyword':q,'pageCount':0,
                  'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':'',
              }
              data = post_json('https://api.sdyanbao.com/api/file/search', payload)
              search_log[q] = data
              recs = collect_records(data)
              for r in recs:
                  record_pool[r['id']] = r
              return recs

          for q in ['软通动力','301236']:
              try:
                  search(q)
              except Exception:
                  pass
          for t in targets:
              for q in t['queries']:
                  try:
                      search(q)
                  except Exception:
                      pass

          chosen = []
          used_ids = set()
          for t in targets:
              selected = None
              if t['known_id']:
                  selected = {'id':t['known_id'],'name':t['title']}
              else:
                  scored = []
                  for r in record_pool.values():
                      name = str(r.get('name') or '')
                      text = norm(name)
                      score = 0
                      for term in t['required']:
                          if norm(term) in text:
                              score += 12
                      if norm(t['short_title']) in text:
                          score += 24
                      if norm(t['broker'].replace('证券','')) in text:
                          score += 4
                      if '软通动力' in name:
                          score += 3
                      scored.append((score, r))
                  scored.sort(key=lambda x: (x[0], x[1].get('id',0)), reverse=True)
                  for score, r in scored:
                      if score >= 24 and r['id'] not in used_ids:
                          selected = r
                          break
              if not selected or int(selected['id']) in used_ids:
                  continue
              try:
                  detail = post_json('https://api.sdyanbao.com/api/file/detail', {'id':int(selected['id'])})
                  data = detail.get('data') if isinstance(detail, dict) else None
                  if not isinstance(data, dict) or not data.get('page_url') or not data.get('page_count'):
                      continue
                  chosen.append((t, selected, data))
                  used_ids.add(int(selected['id']))
              except Exception:
                  continue
              if len(chosen) >= 3:
                  break

          if len(chosen) < 2:
              raise RuntimeError(f'Only {len(chosen)} suitable public previews found; need at least 2')

          def fetch_image(url: str) -> bytes:
              last = None
              for attempt in range(6):
                  try:
                      r = session.get(url, timeout=(20,120), allow_redirects=True, headers={
                          'User-Agent':session.headers['User-Agent'],
                          'Referer':'https://www.sdyanbao.com/',
                          'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8',
                      })
                      last = {'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type','')}
                      if r.status_code == 200 and len(r.content) > 10000:
                          with Image.open(BytesIO(r.content)) as im:
                              im.verify()
                          return r.content
                  except Exception as exc:
                      last = {'error':repr(exc)}
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Image download failed {url}: {last}')

          manifest = []
          for idx, (t, selected, data) in enumerate(chosen, 1):
              total_pages = int(data['page_count'])
              preview_pages = min(10, total_pages)
              base = str(data['page_url']).rstrip('/')
              wdir = work / f'r{idx}'
              wdir.mkdir(exist_ok=True)
              page_files = []
              for pno in range(preview_pages):
                  raw = fetch_image(f'{base}/{pno}.png')
                  src = wdir / f'{pno:02d}_src.png'
                  src.write_bytes(raw)
                  with Image.open(src) as im:
                      rgba = im.convert('RGBA')
                      white = Image.new('RGBA', rgba.size, (255,255,255,255))
                      white.alpha_composite(rgba)
                      rgb = white.convert('RGB')
                      out = wdir / f'{pno:02d}.jpg'
                      rgb.save(out, 'JPEG', quality=95, subsampling=0)
                      page_files.append(out)

              safe_title = re.sub(r'[\\/:*?"<>|]+','_',t['short_title'])
              pdf_name = f'{idx:02d}_{t["broker"]}_软通动力_{safe_title}_公开预览前{preview_pages}页_{t["date"]}.pdf'
              pdf_path = root / pdf_name
              imgs = [Image.open(p).convert('RGB') for p in page_files]
              try:
                  imgs[0].save(pdf_path, save_all=True, append_images=imgs[1:], resolution=150.0, quality=95)
              finally:
                  for im in imgs:
                      im.close()

              reader = PdfReader(str(pdf_path), strict=False)
              actual_pages = len(reader.pages)
              if actual_pages != preview_pages:
                  raise RuntimeError(f'PDF page mismatch {pdf_name}: {actual_pages} vs {preview_pages}')
              subprocess.run(['qpdf','--check',str(pdf_path)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              prefix = preview_dir / pdf_path.stem
              subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','125','-singlefile',str(pdf_path),str(prefix)], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              cover = Path(str(prefix)+'.png')
              if not cover.exists() or cover.stat().st_size < 10000:
                  raise RuntimeError(f'Cover render failed: {pdf_name}')
              sha = hashlib.sha256(pdf_path.read_bytes()).hexdigest()
              report_id = int(data.get('id') or selected['id'])
              manifest.append({
                  **t,
                  'source_report_id':report_id,
                  'source_record_name':selected.get('name'),
                  'source_detail_page':f'https://www.sdyanbao.com/detail/{report_id}',
                  'page_image_base':base,
                  'original_total_pages':total_pages,
                  'public_preview_pages':preview_pages,
                  'pdf_file':pdf_name,
                  'actual_pdf_pages':actual_pages,
                  'bytes':pdf_path.stat().st_size,
                  'sha256':sha,
                  'cover_preview':str(Path('首页预览')/cover.name),
                  'validation':['all preview images downloaded','image integrity','white-background compositing','PDF page count','qpdf structure','cover render'],
              })

          readme = [
              '软通动力（301236.SZ）券商深度报告公开预览资料包',
              '整理日期：2026-09-27',
              '',
              f'本包收录{len(manifest)}份券商公司深度或首次覆盖报告的公开预览原页。',
              '完整原始PDF在相关研报平台需要账户或下载权限；本包未绕过登录、会员或付费限制，因此所有文件均明确标注为“公开预览版”。',
              '',
          ]
          for i, r in enumerate(manifest, 1):
              readme += [
                  f"{i}. {r['broker']}：《{r['title']}》",
                  f"   日期：{r['date']}；分析师：{r['analysts']}；评级：{r['rating']}",
                  f"   原报告：{r['original_total_pages']}页；本PDF：公开预览前{r['public_preview_pages']}页",
                  f"   来源页面：{r['source_detail_page']}",
                  f"   SHA-256：{r['sha256']}",
                  '',
              ]
          readme += [
              '报告内容及版权归原券商和作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：预览图片完整性、白底校正、PDF页数、PDF结构、首页渲染、ZIP CRC及SHA-256。',
          ]
          (root/'00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps({'search_log':search_log,'reports':manifest}, ensure_ascii=False, indent=2), encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['pdf_file']}\n" for r in manifest), encoding='utf-8')

          final_name = f'软通动力_301236_券商深度报告_公开预览版_{len(manifest)}份.zip'
          zpath = Path(final_name)
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, arcname=f'{root.name}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
              bad = z.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC failure: '+bad)
              pdfs = [n for n in z.namelist() if n.lower().endswith('.pdf')]
              if len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP PDF count mismatch: {len(pdfs)} vs {len(manifest)}')
          print('FINAL_ZIP', zpath, zpath.stat().st_size, hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: isoftstone-301236-broker-deep-reports-public-previews
          path: 软通动力_301236_券商深度报告_公开预览版_*.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
