name: Temporary Capture Reportify Melco Page Assets V2

on:
  push:
    branches:
      - tmp/melco-international-reports-20260831
    paths:
      - .github/workflows/tmp-capture-reportify-melco-pages-v2.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Python dependencies and inspect browser paths
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium requests pillow pypdf
          echo 'Chrome candidates:'
          which -a google-chrome google-chrome-stable chromium chromium-browser || true
          find /opt /usr/local /usr/bin -maxdepth 5 -type f \( -name 'google-chrome*' -o -name 'chromedriver' -o -name 'chromium' \) -print 2>/dev/null | head -100 || true
          for x in /opt/google/chrome/google-chrome /usr/bin/google-chrome-stable /usr/bin/google-chrome /usr/local/share/chromedriver-linux64/chromedriver /usr/bin/chromedriver; do
            if [ -x "$x" ]; then "$x" --version || true; fi
          done

      - name: Capture network requests and public page images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import re
          import subprocess
          import time
          from pathlib import Path

          import requests
          from PIL import Image
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service

          OUT = Path('out')
          OUT.mkdir(exist_ok=True)
          ASSET_DIR = OUT / 'assets'
          ASSET_DIR.mkdir(exist_ok=True)

          targets = [
              {'report_id':'1118968060607336448','url':'https://reportify.cn/reports/1118968060607336448','expected_title':'澳门总GGR恢复超行业，市场份额和EM增长','expected_pages':15},
              {'report_id':'1052271542572027904','url':'https://reportify.cn/reports/1052271542572027904','expected_title':'2024年三季报业绩点评','expected_pages':4},
              {'report_id':'962339654089314304','url':'https://reportify.cn/reports/962339654089314304','expected_title':'2023年四季报点评','expected_pages':4},
          ]

          def version_major(path):
              try:
                  out = subprocess.check_output([path, '--version'], text=True, stderr=subprocess.STDOUT)
                  m = re.search(r'(\d+)\.', out)
                  return int(m.group(1)) if m else None, out.strip()
              except Exception:
                  return None, ''

          chrome_candidates = [
              '/opt/google/chrome/google-chrome',
              '/usr/bin/google-chrome-stable',
              '/usr/bin/google-chrome',
              '/usr/bin/chromium',
              '/usr/bin/chromium-browser',
          ]
          driver_candidates = [
              '/usr/local/share/chromedriver-linux64/chromedriver',
              '/usr/local/bin/chromedriver',
              '/usr/bin/chromedriver',
          ]
          chrome = next((x for x in chrome_candidates if Path(x).is_file() and Path(x).stat().st_size > 100000), None)
          if not chrome:
              # Some executable launchers are symlinks; accept the first working candidate.
              for x in chrome_candidates:
                  if Path(x).exists() and version_major(x)[0]:
                      chrome = x
                      break
          if not chrome:
              raise RuntimeError('No working Chrome binary found')
          chrome_major, chrome_version = version_major(chrome)
          print('CHROME', chrome, chrome_version)

          matched_driver = None
          for x in driver_candidates:
              if Path(x).exists():
                  major, text = version_major(x)
                  print('DRIVER_CANDIDATE', x, text)
                  if major == chrome_major:
                      matched_driver = x
                      break

          options = Options()
          options.binary_location = chrome
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1600,1200','--lang=zh-CN','--remote-debugging-pipe']:
              options.add_argument(arg)
          options.set_capability('goog:loggingPrefs', {'performance':'ALL','browser':'ALL'})

          if matched_driver:
              driver = webdriver.Chrome(service=Service(matched_driver), options=options)
          else:
              # Selenium Manager downloads a compatible driver if no matching preinstalled one exists.
              driver = webdriver.Chrome(options=options)

          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 Chrome/151.0 Safari/537.36','Referer':'https://reportify.cn/'})
          all_results=[]
          try:
              for target in targets:
                  rid=target['report_id']
                  report_dir=ASSET_DIR/rid
                  report_dir.mkdir(parents=True,exist_ok=True)
                  # clear accumulated performance logs before navigation
                  try: driver.get_log('performance')
                  except Exception: pass
                  driver.get(target['url'])
                  time.sleep(10)
                  # Walk the page rather than only jumping to bottom, triggering virtualized/lazy report pages.
                  total_height=driver.execute_script('return Math.max(document.body.scrollHeight,document.documentElement.scrollHeight)') or 5000
                  y=0
                  while y < total_height + 2000:
                      driver.execute_script(f'window.scrollTo(0,{y});')
                      time.sleep(0.5)
                      y += 700
                      total_height=max(total_height,driver.execute_script('return Math.max(document.body.scrollHeight,document.documentElement.scrollHeight)') or total_height)
                  time.sleep(5)
                  page_source=driver.page_source
                  (report_dir/'page_source.html').write_text(page_source,encoding='utf-8')
                  driver.save_screenshot(str(report_dir/'viewport.png'))
                  dom=driver.execute_script('''
                    const out=[];
                    document.querySelectorAll('*').forEach(el=>{
                      ['src','href','data-src','data-url','data-file','data-download','poster'].forEach(k=>{
                        const v=el.getAttribute&&el.getAttribute(k); if(v) out.push(v);
                      });
                      const bg=getComputedStyle(el).backgroundImage;
                      if(bg&&bg!=='none') out.push(bg);
                    });
                    return {title:document.title,urls:out,text:(document.body?document.body.innerText:'').slice(0,50000),html:document.documentElement.outerHTML.slice(0,2000000)};
                  ''')
                  logs=driver.get_log('performance')
                  reqs=[];responses={}
                  for entry in logs:
                      try: msg=json.loads(entry['message'])['message']
                      except Exception: continue
                      p=msg.get('params',{})
                      if msg.get('method')=='Network.requestWillBeSent':
                          q=p.get('request',{});u=q.get('url')
                          if u:reqs.append({'url':u,'method':q.get('method'),'type':p.get('type'),'postData':q.get('postData')})
                      elif msg.get('method')=='Network.responseReceived':
                          q=p.get('response',{});u=q.get('url')
                          if u:responses[u]={'status':q.get('status'),'mimeType':q.get('mimeType'),'encodedDataLength':q.get('encodedDataLength')}
                  candidates=[]
                  candidates += [u for u in dom.get('urls',[]) if isinstance(u,str)]
                  candidates += [x['url'] for x in reqs]
                  candidates += re.findall(r'https?://[^"\'<>\s]+',page_source)
                  cleaned=[]
                  for u in candidates:
                      if u.startswith('url('):u=u[4:].strip(')"\'')
                      if u not in cleaned:cleaned.append(u)
                  interesting=[u for u in cleaned if rid in u or any(k in u.lower() for k in ['api.reportify','s.reportify','files.reportify','document','preview','/report/','.pdf','.png','.jpg','.jpeg','.webp','page_image','page-image'])]
                  downloads=[]
                  for idx,u in enumerate(interesting):
                      if not u.startswith('http'):continue
                      try:
                          r=session.get(u,timeout=45,allow_redirects=True);body=r.content;ctype=(r.headers.get('content-type') or '').lower()
                          rec={'url':u,'final_url':r.url,'status':r.status_code,'content_type':ctype,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest() if body else ''}
                          ext=None
                          if r.status_code==200 and body:
                              if body.lstrip().startswith(b'%PDF'):ext='.pdf'
                              else:
                                  try:
                                      im=Image.open(io.BytesIO(body));fmt=(im.format or 'png').lower().replace('jpeg','jpg');ext='.'+fmt;rec['image_size']=list(im.size)
                                  except Exception:pass
                          if ext:
                              path=report_dir/f'{idx:05d}{ext}';path.write_bytes(body);rec['saved_as']=str(path)
                          downloads.append(rec)
                      except Exception as exc:downloads.append({'url':u,'error':repr(exc)})
                  result={**target,'chrome_version':chrome_version,'document_title':dom.get('title'),'body_text_head':dom.get('text'),'network_requests':reqs,'responses':responses,'interesting_urls':interesting,'downloads':downloads}
                  all_results.append(result)
                  print('REPORT_RESULT='+json.dumps({'report_id':rid,'title':result['document_title'],'network':len(reqs),'interesting':len(interesting),'saved':[x for x in downloads if x.get('saved_as')]},ensure_ascii=False),flush=True)
          finally:
              driver.quit()
          (OUT/'reportify_capture.json').write_text(json.dumps(all_results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload capture results
        uses: actions/upload-artifact@v4
        with:
          name: reportify-melco-page-capture-v2
          path: out
          retention-days: 3
          if-no-files-found: error
