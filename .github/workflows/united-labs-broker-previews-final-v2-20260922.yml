name: Build United Laboratories broker report public preview package v2 20260922

on:
  push:
    paths:
      - '.github/workflows/united-labs-broker-previews-final-v2-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pillow pypdf

      - name: Download public report preview pages and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, time, zipfile
          from pathlib import Path
          import requests
          from PIL import Image
          from pypdf import PdfReader
          import subprocess

          PACKAGE='联邦制药_03933_券商深度报告_公开预览版_2份'
          root=Path(PACKAGE); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)
          work=Path('_work'); work.mkdir(exist_ok=True)

          reports=[
            {
              'broker':'东吴证券',
              'title':'联邦制药（03933.HK）：创新突破，三靶点战略联姻诺和诺德',
              'date':'2025-07-12',
              'rating':'买入（首次）',
              'analysts':'朱国广、冉胜男',
              'original_pages':25,
              'public_preview_pages':10,
              'page_base':'https://oss.sdyanbao.com/page/2025/7/24/1215139',
              'source_page':'https://www.sdyanbao.com/detail/902006',
              'filename':'01_东吴证券_联邦制药_创新突破三靶点战略联姻诺和诺德_公开预览版_2025-07-12.pdf',
            },
            {
              'broker':'招商证券',
              'title':'联邦制药（03933.HK）：创新药初结硕果，后续管线丰富，主业拓增长新曲线',
              'date':'2025-09-16',
              'rating':'强烈推荐（首次）',
              'analysts':'梁广楷、许菲菲、侯彪',
              'original_pages':29,
              'public_preview_pages':10,
              'page_base':'https://oss.sdyanbao.com/page/2025/9/22/1248844',
              'source_page':'https://www.sdyanbao.com/detail/920346',
              'filename':'02_招商证券_联邦制药_创新药初结硕果后续管线丰富主业拓增长新曲线_公开预览版_2025-09-16.pdf',
            }
          ]

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Referer':'https://www.sdyanbao.com/','Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8'})

          def fetch(url):
            last=None
            for attempt in range(5):
              try:
                r=s.get(url,timeout=(20,90),allow_redirects=True)
                last=(r.status_code,len(r.content),r.headers.get('content-type'))
                if r.status_code==200 and len(r.content)>20000:
                  try:
                    from io import BytesIO
                    with Image.open(BytesIO(r.content)) as im: im.verify()
                    return r.content
                  except Exception: pass
              except Exception as e: last=repr(e)
              time.sleep(1+attempt)
            raise RuntimeError(f'failed {url}: {last}')

          manifest=[]
          for idx,rec in enumerate(reports,1):
            wdir=work/f'r{idx}'; wdir.mkdir(exist_ok=True)
            imgs=[]
            for p in range(rec['public_preview_pages']):
              data=fetch(f"{rec['page_base']}/{p}.png")
              ip=wdir/f'{p:02d}.png'; ip.write_bytes(data)
              with Image.open(ip) as im: im.verify()
              imgs.append(ip)
            out=root/rec['filename']
            opened=[]
            try:
              for ip in imgs:
                opened.append(Image.open(ip).convert('RGB'))
              opened[0].save(out,save_all=True,append_images=opened[1:],resolution=150.0,quality=95)
            finally:
              for im in opened: im.close()
            reader=PdfReader(str(out)); pages=len(reader.pages)
            if pages!=rec['public_preview_pages']: raise RuntimeError(f'page mismatch {out}: {pages}')
            text=(reader.pages[0].extract_text() or '')
            subprocess.run(['qpdf','--check',str(out)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix=previews/out.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','110','-singlefile',str(out),str(prefix)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            png=Path(str(prefix)+'.png')
            if not png.exists() or png.stat().st_size<20000: raise RuntimeError('render failure')
            sha=hashlib.sha256(out.read_bytes()).hexdigest()
            manifest.append({**rec,'pdf_file':out.name,'actual_pdf_pages':pages,'bytes':out.stat().st_size,'sha256':sha,'preview_file':str(Path('首页预览')/png.name),'validation':['all public images downloaded','image integrity','PDF page count','qpdf structure','first-page render']})

          lines=['联邦制药（03933.HK）券商深度报告公开预览资料包','整理日期：2026-09-22','',
                 '本包含2份近期首次覆盖/深度报告的公开预览原页。完整PDF下载需登录或会员，本包没有绕过访问控制。','']
          for i,r in enumerate(manifest,1):
            lines += [f"{i}. {r['broker']}：《{r['title']}》",f"   日期：{r['date']}；评级：{r['rating']}；分析师：{r['analysts']}",f"   原报告：{r['original_pages']}页；本PDF：前{r['public_preview_pages']}页公开原始页面",f"   来源页面：{r['source_page']}",f"   SHA-256：{r['sha256']}",'']
          lines += ['报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['pdf_file']}\n" for r in manifest),encoding='utf-8')

          zpath=Path(PACKAGE+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{PACKAGE}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); assert bad is None,bad
            assert len([n for n in z.namelist() if n.lower().endswith('.pdf')])==2
          print('ZIP',zpath,zpath.stat().st_size,hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: united-labs-broker-reports-public-preview-final-v2
          path: 联邦制药_03933_券商深度报告_公开预览版_2份.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
