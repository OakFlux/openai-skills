name: Temporary Locate SGPJBG Mengtai Report ID

on:
  push:
    branches:
      - tmp/fetch-mengtai-reports-20260830
    paths:
      - .github/workflows/tmp-scan-sgpjbg-id-mengtai.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Scan likely report ID range concurrently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, html, json, re, requests

          ranges=[range(129500,130501),range(128500,129500)]
          ids=[i for rg in ranges for i in rg]
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'}

          def fetch(report_id):
            url=f'https://www.sgpjbg.com/baogao/{report_id}.html'
            try:
              r=requests.get(url,headers=headers,timeout=18,allow_redirects=True)
              if r.status_code!=200 or len(r.content)<3000:return None
              text=html.unescape(r.text)
              if '蒙泰高新' not in text and '丙纶长丝行业领跑者' not in text:return None
              title=''
              m=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
              if m:title=re.sub(r'<[^>]+>',' ',m.group(1));title=re.sub(r'\s+',' ',title).strip()
              h1=''
              m=re.search(r'<h1[^>]*>(.*?)</h1>',text,re.I|re.S)
              if m:h1=re.sub(r'<[^>]+>',' ',m.group(1));h1=re.sub(r'\s+',' ',h1).strip()
              return {'id':report_id,'url':r.url,'bytes':len(r.content),'title':title,'h1':h1}
            except Exception:return None

          found=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex:
            for result in ex.map(fetch,ids,chunksize=10):
              if result:
                found.append(result);print('FOUND='+json.dumps(result,ensure_ascii=False),flush=True)
          print('ALL_FOUND='+json.dumps(found,ensure_ascii=False))
          if not found:raise RuntimeError('Mengtai report not found in scanned ranges')
          PY
