name: Inspect bearing reports qtype1 20261005
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-bearing-reports-qtype1-20261005.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query industry report metadata
        run: |
          python - <<'PY'
          import json
          import requests
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'})
          api='https://reportapi.eastmoney.com/report/list'
          windows=[('2025-06-01','2025-06-15'),('2022-05-20','2022-06-10'),('2022-02-20','2022-03-10'),('2022-10-01','2022-11-30')]
          for begin,end in windows:
            for qtype in ('1','2','3'):
              for page in range(1,8):
                params={'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*','beginTime':begin,'endTime':end,'pageNo':str(page),'fields':'','qType':qtype,'orgCode':'','code':'','rcode':'','p':str(page),'pageNum':str(page),'pageNumber':str(page)}
                r=s.get(api,params=params,timeout=120)
                print('STATUS',begin,end,'Q',qtype,'PAGE',page,r.status_code,len(r.content))
                r.raise_for_status(); rows=r.json().get('data') or []
                print('COUNT',len(rows))
                for row in rows:
                  title=str(row.get('title') or '')
                  if any(k in title for k in ['轴承','雷迪克','人形机器人']):
                    print('MATCH',json.dumps(row,ensure_ascii=False))
                if len(rows)<100:
                  break
          PY
