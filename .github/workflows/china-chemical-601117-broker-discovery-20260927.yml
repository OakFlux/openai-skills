name: Discover China Chemical 601117 broker research reports 20260927

on:
  push:
    paths:
      - '.github/workflows/china-chemical-601117-broker-discovery-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Query Eastmoney and inspect public PDFs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, time
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from pypdf import PdfReader

          OUT = Path('china_chemical_broker_discovery')
          PDF_DIR = OUT / 'candidate_pdfs'
          OUT.mkdir(exist_ok=True)
          PDF_DIR.mkdir(exist_ok=True)

          s = requests.Session(); s.trust_env = False
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept':'application/json,text/javascript,*/*;q=0.01',
              'Referer':'https://data.eastmoney.com/',
          })

          API='https://reportapi.eastmoney.com/report/list'
          all_records=[]; queries=[]; errors=[]
          codes=['601117','SH601117','601117.SH','1.601117']
          for code in codes:
              params={
                  'industryCode':'*','pageSize':'100','industry':'*','rating':'*','ratingChange':'*',
                  'beginTime':'2010-01-01','endTime':'2026-09-27','pageNo':'1','fields':'',
                  'qType':'0','orgCode':'','code':code,'rcode':'','p':'1','pageNum':'1','pageNumber':'1'
              }
              try:
                  r=s.get(API,params=params,timeout=(30,120)); print('QUERY',code,r.status_code,len(r.content),r.url,flush=True)
                  r.raise_for_status()
                  try: d=r.json()
                  except Exception:
                      t=r.text.strip(); m=re.search(r'^[^(]*\((.*)\)\s*;?$',t,re.S); d=json.loads(m.group(1)) if m else None
                  queries.append({'code':code,'url':r.url,'payload':d})
                  if isinstance(d,dict):
                      recs=d.get('data') or d.get('Data') or d.get('result') or []
                      if isinstance(recs,list): all_records.extend(recs)
              except Exception as e:
                  errors.append({'code':code,'error':repr(e)})
              time.sleep(.4)

          # De-duplicate and retain records genuinely belonging to China Chemical Engineering (601117).
          by_key={}
          for rec in all_records:
              txt=json.dumps(rec,ensure_ascii=False)
              low=txt.lower()
              if not any(k in txt for k in ['601117','中国化学']) and 'china national chemical engineering' not in low:
                  continue
              key=str(rec.get('infoCode') or rec.get('info_code') or rec.get('id') or hashlib.sha256(txt.encode()).hexdigest())
              by_key[key]=rec
          records=list(by_key.values())
          def date_of(r): return str(r.get('publishDate') or r.get('publish_date') or r.get('date') or '')[:10]
          records.sort(key=date_of,reverse=True)
          (OUT/'eastmoney_queries.json').write_text(json.dumps(queries,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'all_matching_records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2),encoding='utf-8')
          print('MATCHING_RECORDS',len(records),flush=True)

          def value(r,*names):
              for n in names:
                  if r.get(n) not in (None,''): return r.get(n)
              return ''
          def title_of(r): return str(value(r,'title','Title','reportTitle','report_title'))
          def org_of(r): return str(value(r,'orgSName','orgName','org_name','orgSname','researcherOrg'))
          def info_of(r): return str(value(r,'infoCode','info_code','id'))
          def safe_name(x): return re.sub(r'[\\/:*?"<>|\r\n]+','_',x).strip(' .')[:130]
          def candidate_urls(r):
              info=info_of(r)
              vals=[]
              for k,v in r.items():
                  if isinstance(v,str) and ('pdf' in v.lower() or 'dfcfw.com' in v.lower()): vals.append(v.replace('\\/','/'))
              if info:
                  vals += [
                      f'https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{info}_01.pdf',
                      f'https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf',
                      f'https://pdf.dfcfw.com/pdf/H3_{info}_1.html',
                  ]
              out=[]
              for u in vals:
                  if u.startswith('//'): u='https:'+u
                  if u.startswith('http') and u not in out: out.append(u)
              return out

          keyword_re=re.compile(r'深度|首次覆盖|公司深度|投资价值|专题|行业龙头|工程龙头|一带一路|出海|价值重估|国企改革|化学工程|成长空间|全球',re.I)
          shortlist=[]
          # Prioritize keyword matches, then recent reports. Probe up to 70 unique reports.
          ordered=sorted(records,key=lambda r:(bool(keyword_re.search(title_of(r))),date_of(r)),reverse=True)[:70]
          for idx,rec in enumerate(ordered,1):
              title=title_of(rec); org=org_of(rec); info=info_of(rec); pub=date_of(rec)
              if not title: continue
              got=None; used_url=None; err=[]
              for url in candidate_urls(rec):
                  try:
                      rr=s.get(url,timeout=(25,150),allow_redirects=True)
                      head=rr.content[:8]
                      print('PROBE',idx,rr.status_code,len(rr.content),url,'FINAL',rr.url,flush=True)
                      if rr.status_code==200 and len(rr.content)>120000 and head.startswith(b'%PDF-'):
                          got=rr.content; used_url=rr.url; break
                  except Exception as e: err.append(repr(e))
              if got is None: continue
              fn=f'{idx:03d}_{safe_name(pub)}_{safe_name(org)}_{safe_name(title)}.pdf'
              p=PDF_DIR/fn; p.write_bytes(got)
              try:
                  reader=PdfReader(str(p),strict=False); pages=len(reader.pages)
                  text=[]
                  for j in range(min(8,pages)):
                      try: text.append(reader.pages[j].extract_text() or '')
                      except Exception: pass
                  sample='\n'.join(text)
                  low=sample.lower()
                  identity=any(x in sample for x in ['中国化学','中国化学工程']) or '601117' in sample or 'china national chemical engineering' in low
                  report_identity=any(x in low for x in ['证券研究报告','company report','equity research','公司研究','首次覆盖','深度研究'])
                  rec2={
                      'filename':fn,'title':title,'broker':org,'publish_date':pub,'info_code':info,
                      'source_url':used_url,'pages':pages,'bytes':len(got),'sha256':hashlib.sha256(got).hexdigest(),
                      'keyword_match':bool(keyword_re.search(title)),'identity_verified':identity,
                      'research_report_markers':report_identity,'first_page_text':sample[:5000],
                      'record':rec,
                  }
                  shortlist.append(rec2)
                  print('VALID',json.dumps({k:rec2[k] for k in ['title','broker','publish_date','pages','source_url','identity_verified','keyword_match']},ensure_ascii=False),flush=True)
                  # Keep discovery bundle manageable; remove very short or wrong-company files.
                  if pages<8 or not identity: p.unlink(missing_ok=True)
              except Exception as e:
                  p.unlink(missing_ok=True); errors.append({'title':title,'parse_error':repr(e)})
              time.sleep(.15)

          shortlist.sort(key=lambda x:(x['identity_verified'],x['pages'],x['keyword_match'],x['publish_date']),reverse=True)
          (OUT/'validated_candidates.json').write_text(json.dumps(shortlist,ensure_ascii=False,indent=2),encoding='utf-8')
          (OUT/'errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=['中国化学（601117.SH）券商报告发现结果','']
          for i,x in enumerate(shortlist,1):
              lines.append(f"{i}. {x['publish_date']} | {x['broker']} | {x['pages']}页 | {x['title']} | {x['source_url']}")
          (OUT/'候选清单.txt').write_text('\n'.join(lines),encoding='utf-8')
          print('FINAL_CANDIDATES',json.dumps([{k:x[k] for k in ['filename','title','broker','publish_date','pages','source_url','identity_verified','keyword_match']} for x in shortlist],ensure_ascii=False,indent=2),flush=True)
          PY

      - name: Upload discovery bundle
        uses: actions/upload-artifact@v4
        with:
          name: china-chemical-601117-broker-discovery
          path: china_chemical_broker_discovery
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
