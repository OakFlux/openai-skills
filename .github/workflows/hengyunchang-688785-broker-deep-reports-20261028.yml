name: Build Hengyunchang 688785 broker deep reports 20261028

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hengyunchang-688785-broker-deep-reports-20261028.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from typing import Any

          import requests
          from pypdf import PdfReader

          CODE = '688785'
          SHORT = '恒运昌'
          FULL = '深圳市恒运昌真空技术股份有限公司'
          PACKAGE = '恒运昌_688785_券商深度报告_3份'
          ROOT = Path(PACKAGE)
          PDF_DIR = ROOT / '原始PDF'
          PREVIEW_DIR = ROOT / '首页预览'
          for directory in (ROOT, PDF_DIR, PREVIEW_DIR):
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Referer': f'https://data.eastmoney.com/report/stock.jshtml?stockCode={CODE}',
              'Accept': 'application/json,text/plain,*/*',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          API = 'https://reportapi.eastmoney.com/report/list'
          request_log: list[dict[str, Any]] = []

          def fetch_page(params: dict[str, str]) -> dict[str, Any]:
              last: dict[str, Any] = {}
              for attempt in range(7):
                  try:
                      response = session.get(API, params=params, timeout=(20, 120))
                      last = {
                          'url': response.url,
                          'status': response.status_code,
                          'bytes': len(response.content),
                          'content_type': response.headers.get('content-type', ''),
                          'prefix': response.text[:180],
                      }
                      request_log.append(last)
                      if response.status_code == 200:
                          return response.json()
                  except Exception as exc:
                      last = {'url': API, 'params': params, 'attempt': attempt + 1, 'error': repr(exc)}
                      request_log.append(last)
                  time.sleep(1 + attempt)
              raise RuntimeError(f'Report API failed: {last}')

          def rows_from(payload: dict[str, Any]) -> list[dict[str, Any]]:
              rows = payload.get('data') or []
              if isinstance(rows, dict):
                  rows = rows.get('list') or rows.get('data') or []
              return [item for item in rows if isinstance(item, dict)] if isinstance(rows, list) else []

          all_rows: list[dict[str, Any]] = []
          seen: set[str] = set()
          for page in range(1, 11):
              params = {
                  'industryCode': '*', 'pageSize': '100', 'industry': '*',
                  'rating': '*', 'ratingChange': '*',
                  'beginTime': '2025-01-01', 'endTime': '2026-10-28',
                  'pageNo': str(page), 'fields': '', 'qType': '0',
                  'orgCode': '', 'author': '', 'code': CODE, 'rcode': '',
                  'p': str(page), 'pageNum': str(page), 'pageNumber': str(page),
              }
              payload = fetch_page(params)
              rows = rows_from(payload)
              for row in rows:
                  key = str(row.get('infoCode') or '') or json.dumps(row, ensure_ascii=False, sort_keys=True)
                  if key not in seen:
                      seen.add(key)
                      all_rows.append(row)
              total_pages = int(payload.get('TotalPage') or payload.get('totalPage') or 0)
              if not rows or (total_pages and page >= total_pages) or len(rows) < 100:
                  break
              time.sleep(0.2)

          # Ensure the two known public reports remain available even if the API index is temporarily incomplete.
          fallback_rows = [
              {
                  'infoCode': 'AP202601111816924128',
                  'stockCode': CODE,
                  'stockName': SHORT,
                  'orgSName': '华金证券',
                  'publishDate': '2026-01-11 00:00:00.000',
                  'attachPages': 13,
                  'title': '新股覆盖研究：恒运昌',
                  'researcher': '李蕙',
                  'emRatingName': '',
              },
              {
                  'infoCode': 'AP202608051827666953',
                  'stockCode': CODE,
                  'stockName': SHORT,
                  'orgSName': '中邮证券',
                  'publishDate': '2026-08-05 00:00:00.000',
                  'attachPages': 5,
                  'title': '加速射频电源产业化，打造等离子体工艺部件平台',
                  'researcher': '吴文吉,翟一梦',
                  'emRatingName': '买入',
              },
          ]
          for row in fallback_rows:
              key = row['infoCode']
              if key not in seen:
                  seen.add(key)
                  all_rows.append(row)

          def norm(value: Any) -> str:
              return re.sub(r'\s+', '', str(value or ''))

          def pages_meta(row: dict[str, Any]) -> int:
              try:
                  return int(float(row.get('attachPages') or 0))
              except Exception:
                  return 0

          def date_text(row: dict[str, Any]) -> str:
              return str(row.get('publishDate') or '')[:10]

          print('ALL_CANDIDATES')
          for row in sorted(all_rows, key=lambda item: date_text(item), reverse=True):
              print(json.dumps({
                  'infoCode': row.get('infoCode'),
                  'stockCode': row.get('stockCode'),
                  'stockName': row.get('stockName'),
                  'orgSName': row.get('orgSName'),
                  'publishDate': row.get('publishDate'),
                  'attachPages': row.get('attachPages'),
                  'title': row.get('title'),
                  'researcher': row.get('researcher'),
                  'rating': row.get('emRatingName') or row.get('sRatingName'),
              }, ensure_ascii=False))

          preferred_phrases = [
              '首次覆盖', '新股覆盖研究', '加速射频电源产业化',
              '研发投入影响短期利润', '国产半导体射频电源头部供应商',
              '等离子体工艺部件平台',
          ]
          excluded_phrases = ['点评', '业绩说明会', '调研纪要', '投资者关系', '周报', '日报']
          candidates: list[dict[str, Any]] = []
          for row in all_rows:
              code = str(row.get('stockCode') or '')
              name = str(row.get('stockName') or '')
              title = str(row.get('title') or '')
              info = str(row.get('infoCode') or '')
              broker = str(row.get('orgSName') or row.get('orgName') or '')
              if code not in ('', CODE) and SHORT not in name:
                  continue
              if not info or not broker or pages_meta(row) < 5:
                  continue
              compact_title = norm(title)
              score = pages_meta(row) * 8
              for phrase in preferred_phrases:
                  if norm(phrase) in compact_title:
                      score += 180
              if '首次' in title:
                  score += 80
              if '覆盖' in title:
                  score += 60
              if '新股' in title:
                  score += 30
              if any(phrase in title for phrase in excluded_phrases) and '首次' not in title:
                  score -= 200
              if date_text(row) >= '2026-01-01':
                  score += 20
              candidates.append({**row, '_score': score})

          candidates.sort(key=lambda item: (int(item['_score']), pages_meta(item), date_text(item)), reverse=True)

          def download_pdf(row: dict[str, Any]) -> tuple[bytes, str, list[dict[str, Any]]]:
              info = str(row.get('infoCode') or '')
              detail = f'https://data.eastmoney.com/report/info/{info}.html'
              attempts: list[dict[str, Any]] = []
              for prefix in ('H3', 'H2', 'H1', 'H4'):
                  url = f'https://pdf.dfcfw.com/pdf/{prefix}_{info}_1.pdf'
                  for attempt in range(6):
                      try:
                          response = session.get(
                              url,
                              headers={
                                  'User-Agent': session.headers['User-Agent'],
                                  'Referer': detail,
                                  'Accept': 'application/pdf,*/*;q=0.8',
                              },
                              timeout=(30, 360),
                              allow_redirects=True,
                          )
                          meta = {
                              'url': url,
                              'status': response.status_code,
                              'bytes': len(response.content),
                              'content_type': response.headers.get('content-type', ''),
                              'final_url': response.url,
                          }
                          attempts.append(meta)
                          if response.status_code == 200 and response.content[:5] == b'%PDF-' and len(response.content) > 80_000:
                              return response.content, url, attempts
                      except Exception as exc:
                          attempts.append({'url': url, 'attempt': attempt + 1, 'error': repr(exc)})
                      time.sleep(1 + attempt)
              raise RuntimeError(f'PDF download failed for {row.get("title")}: {attempts[-20:]}')

          def safe_name(text: str) -> str:
              text = re.sub(r'[\\/:*?"<>|]+', '_', text)
              return re.sub(r'\s+', '', text)[:100]

          manifest: list[dict[str, Any]] = []
          used_brokers: set[str] = set()
          download_errors: list[dict[str, Any]] = []

          for row in candidates:
              if len(manifest) >= 3:
                  break
              broker = str(row.get('orgSName') or row.get('orgName') or '')
              if broker in used_brokers:
                  continue
              try:
                  data, source_url, attempts = download_pdf(row)
                  reader = PdfReader(Path('/dev/null')) if False else PdfReader
                  temp_name = PDF_DIR / f'_temp_{row.get("infoCode")}.pdf'
                  temp_name.write_bytes(data)
                  pdf_reader = PdfReader(str(temp_name), strict=False)
                  actual_pages = len(pdf_reader.pages)
                  if actual_pages < 5:
                      raise RuntimeError(f'Unexpectedly short PDF: {actual_pages} pages')
                  text = ''
                  for page in pdf_reader.pages[:min(15, actual_pages)]:
                      try:
                          text += '\n' + (page.extract_text() or '')
                      except Exception:
                          pass
                  compact = norm(text)
                  identity_hits = [value for value in (SHORT, FULL, CODE) if norm(value) in compact]
                  if len(compact) > 500 and not identity_hits:
                      raise RuntimeError('Issuer identity mismatch')

                  date = date_text(row)
                  title = str(row.get('title') or '')
                  final_name = f'{len(manifest)+1:02d}_{safe_name(broker)}_恒运昌_{safe_name(title)}_{date}.pdf'
                  dest = PDF_DIR / final_name
                  temp_name.replace(dest)
                  subprocess.run(
                      ['qpdf', '--warning-exit-0', '--check', str(dest)],
                      check=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  prefix = PREVIEW_DIR / dest.stem
                  subprocess.run(
                      ['pdftoppm', '-f', '1', '-l', '1', '-png', '-r', '125', '-singlefile', str(dest), str(prefix)],
                      check=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                  )
                  preview = Path(str(prefix) + '.png')
                  if not preview.exists() or preview.stat().st_size < 10_000:
                      raise RuntimeError('First-page render failed')
                  sha = hashlib.sha256(data).hexdigest()
                  manifest.append({
                      'broker': broker,
                      'date': date,
                      'title': title,
                      'analysts': row.get('researcher') or row.get('author'),
                      'rating': row.get('emRatingName') or row.get('sRatingName'),
                      'metadata_pages': pages_meta(row),
                      'actual_pages': actual_pages,
                      'filename': str(Path('原始PDF') / final_name),
                      'bytes': len(data),
                      'sha256': sha,
                      'info_code': row.get('infoCode'),
                      'source_report_page': f'https://data.eastmoney.com/report/info/{row.get("infoCode")}.html',
                      'source_pdf_url': source_url,
                      'identity_hits': identity_hits,
                      'preview_file': str(Path('首页预览') / preview.name),
                      'selection_score': row.get('_score'),
                      'download_attempts': attempts,
                      'validation': ['PDF header', 'issuer identity', 'page count', 'qpdf structure', 'first-page render'],
                  })
                  used_brokers.add(broker)
              except Exception as exc:
                  download_errors.append({
                      'broker': broker,
                      'title': row.get('title'),
                      'info_code': row.get('infoCode'),
                      'error': repr(exc),
                  })
                  temp = PDF_DIR / f'_temp_{row.get("infoCode")}.pdf'
                  if temp.exists():
                      temp.unlink()

          if len(manifest) < 2:
              raise RuntimeError('Fewer than two verified reports were downloaded: ' + json.dumps(download_errors, ensure_ascii=False))

          readme = [
              '深圳市恒运昌真空技术股份有限公司（688785.SH）券商研究报告资料包',
              '整理日期：2026-10-28',
              '',
              f'本包收录{len(manifest)}份公开可直接取得并通过完整性核验的券商原始PDF。',
              '筛选口径：优先公司首次覆盖、新股覆盖和较完整的公司研究，优先不同券商。',
              '',
          ]
          for index, item in enumerate(manifest, 1):
              readme += [
                  f"{index}. {item['broker']}：《{item['title']}》",
                  f"   日期：{item['date']}；分析师：{item['analysts']}；评级：{item['rating']}",
                  f"   完整页数：{item['actual_pages']}页；文件：{item['filename']}",
                  f"   来源页面：{item['source_report_page']}",
                  f"   SHA-256：{item['sha256']}",
                  '',
              ]
          readme += [
              '报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。',
              '核验项目：PDF文件头、公司名称/证券代码、实际页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。',
          ]

          (ROOT / '00_文件清单与说明.txt').write_text('\n'.join(readme), encoding='utf-8')
          (ROOT / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'candidate_ranking.json').write_text(json.dumps(candidates, ensure_ascii=False, indent=2, default=str), encoding='utf-8')
          (ROOT / 'download_errors.json').write_text(json.dumps(download_errors, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'request_log.json').write_text(json.dumps(request_log, ensure_ascii=False, indent=2), encoding='utf-8')
          (ROOT / 'SHA256SUMS.txt').write_text(
              ''.join(f"{item['sha256']}  {item['filename']}\n" for item in manifest),
              encoding='utf-8',
          )

          zip_cn = Path(f'恒运昌_688785_券商深度报告_{len(manifest)}份.zip')
          with zipfile.ZipFile(zip_cn, 'w', zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in sorted(ROOT.rglob('*')):
                  if path.is_file():
                      archive.write(path, arcname=f'{ROOT.name}/{path.relative_to(ROOT)}')
          with zipfile.ZipFile(zip_cn) as archive:
              bad = archive.testzip()
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if bad or len(pdfs) != len(manifest):
                  raise RuntimeError(f'ZIP validation failed: bad={bad}, pdf_count={len(pdfs)}, manifest={len(manifest)}')

          zip_en = Path('hengyunchang_688785_broker_deep_reports.zip')
          zip_en.write_bytes(zip_cn.read_bytes())
          print('FINAL_ZIP', zip_cn, zip_cn.stat().st_size, 'SHA256', hashlib.sha256(zip_cn.read_bytes()).hexdigest())
          print('MANIFEST', json.dumps(manifest, ensure_ascii=False, indent=2))
          print('DOWNLOAD_ERRORS', json.dumps(download_errors, ensure_ascii=False, indent=2))
          PY

      - name: Upload final ZIP files
        uses: actions/upload-artifact@v4
        with:
          name: hengyunchang-688785-broker-deep-reports-final
          path: |
            恒运昌_688785_券商深度报告_*.zip
            hengyunchang_688785_broker_deep_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
