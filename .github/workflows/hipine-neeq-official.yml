name: Hipine NEEQ official discovery

on:
  push:
    branches:
      - tmp-hipine-neeq-official-20260914

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect official NEEQ pages and scripts
        shell: bash
        run: |
          cat > /tmp/neeq.py <<'PY'
          from __future__ import annotations
          import json,re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          S=requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9','Referer':'https://www.neeq.com.cn/'})

          def get(u,**kw):
              try:
                  r=S.get(u,timeout=(20,60),allow_redirects=True,**kw)
                  print('GET',u,'->',r.status_code,r.url,len(r.content),r.headers.get('content-type'),flush=True)
                  return r
              except Exception as e:
                  print('ERR',u,repr(e),flush=True); return None

          pages=[
              'https://www.neeq.com.cn/disclosure/announcement.html',
              'https://www.neeq.com.cn/products/neeq_listed_companies/related_announcement.html?companyCode=838948&typename=G',
              'https://www.neeq.com.cn/products/neeq_listed_companies/related_announcement.html?companyCode=873888&typename=G',
          ]
          scripts=[]
          for u in pages:
              r=get(u)
              if not r: continue
              text=r.content.decode('utf-8','ignore')
              print('PAGE_HEAD',u,text[:3000],flush=True)
              for key in ('companyCode','related','announcement','disclosureType','xxfcbj','typename','iframe','Controller'):
                  pos=0;c=0
                  while True:
                      i=text.lower().find(key.lower(),pos)
                      if i<0: break
                      print('PCTX',u,key,i,text[max(0,i-1600):i+4500],flush=True)
                      pos=i+len(key);c+=1
                      if c>=15: break
              soup=BeautifulSoup(text,'html.parser')
              ss=[urljoin(r.url,s['src']) for s in soup.find_all('script',src=True)]
              scripts.extend(ss)
              print('SCRIPTS',u,json.dumps(ss,ensure_ascii=False,indent=2),flush=True)
              frames=[urljoin(r.url,f['src']) for f in soup.find_all('iframe',src=True)]
              print('IFRAMES',u,json.dumps(frames,ensure_ascii=False,indent=2),flush=True)
              for frame in frames:
                  fr=get(frame)
                  if not fr: continue
                  ft=fr.content.decode('utf-8','ignore')
                  print('FRAME_HEAD',frame,ft[:5000],flush=True)
                  fs=BeautifulSoup(ft,'html.parser')
                  fss=[urljoin(fr.url,s['src']) for s in fs.find_all('script',src=True)]
                  scripts.extend(fss)
                  print('FRAME_SCRIPTS',frame,json.dumps(fss,ensure_ascii=False,indent=2),flush=True)

          all_endpoints=set()
          for su in sorted(set(scripts)):
              r=get(su)
              if not r: continue
              text=r.content.decode('utf-8','ignore')
              endpoints=set(re.findall(r'["\'](/[^"\']+(?:\.do|\.json|/api/[^"\']*))["\']',text,re.I))
              if endpoints or any(k.lower() in text.lower() for k in ('companyannouncement','related_announcement','destfilepath','companycode','disclosuretype')):
                  print('\n--- SCRIPT',su,'bytes',len(text),'---',flush=True)
                  all_endpoints.update(urljoin(su,e) for e in endpoints)
                  print('ENDPOINTS',json.dumps(sorted(endpoints),ensure_ascii=False,indent=2),flush=True)
                  for key in ('companyAnnouncement','related_announcement','relatedAnnouncement','destFilePath','companyCode','disclosureType','xxfcbj','typename','stockInfoResult','Controller'):
                      pos=0;c=0
                      while True:
                          i=text.lower().find(key.lower(),pos)
                          if i<0: break
                          print('JCTX',key,i,text[max(0,i-2200):i+6500],flush=True)
                          pos=i+len(key);c+=1
                          if c>=18: break
              
          print('ALL_ENDPOINTS',json.dumps(sorted(all_endpoints),ensure_ascii=False,indent=2),flush=True)
          # Broadly test promising endpoint/parameter combinations. Responses are logged for manual refinement.
          candidates=[e for e in all_endpoints if any(k in e.lower() for k in ('announcement','disclosure','stockinfo','related'))]
          candidates += [
              'https://www.neeq.com.cn/disclosureInfoController/companyAnnouncement.do',
              'https://www.neeq.com.cn/disclosureInfoController/companyAnnouncementNoCache.do',
          ]
          variants=[]
          for code in ('838948','873888'):
              variants += [
                  {'page':'0','pageSize':'500','companyCode':code,'disclosureType':'5','isNewThree':'1','xxfcbj':'3','typename':'G'},
                  {'page':'0','pageSize':'500','companyCode':code,'disclosureType[]':'5','isNewThree':'1','xxfcbj[]':'3','typename':'G'},
                  {'page':'0','pageSize':'500','zqdm':code,'disclosureType':'5','isNewThree':'1','xxfcbj':'3','typename':'G'},
                  {'page':'0','pageSize':'500','stockCode':code,'disclosureType':'5','isNewThree':'1','xxfcbj':'3','typename':'G'},
                  {'page':'0','pageSize':'500','companyCode':code,'startTime':'2016-01-01','endTime':'2026-09-14','typename':'G'},
                  {'page':'0','pageSize':'500','companyCode':code,'keyword':'年度报告','typename':'G'},
              ]
          seen=set()
          for ep in candidates:
              if ep in seen: continue
              seen.add(ep)
              for p in variants:
                  for method in ('GET','POST'):
                      try:
                          rr=S.request(method,ep,params=p if method=='GET' else None,data=p if method=='POST' else None,timeout=(15,45),headers={'Referer':pages[1]})
                          body=rr.content.decode('utf-8','ignore')
                          if len(body)>250 or 'content' in body or 'destFilePath' in body:
                              print('TEST',method,rr.url,rr.status_code,len(rr.content),json.dumps(p,ensure_ascii=False),body[:15000].replace('\n',' '),flush=True)
                      except Exception as e:
                          print('TESTERR',method,ep,json.dumps(p,ensure_ascii=False),repr(e),flush=True)
          PY
          python /tmp/neeq.py | tee neeq.log
      - uses: actions/upload-artifact@v4
        with:
          name: hipine-neeq-official-log
          path: neeq.log
          retention-days: 3
