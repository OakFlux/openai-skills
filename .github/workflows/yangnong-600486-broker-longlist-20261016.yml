name: Find long-form Yangnong Chemical brokerage reports 20261016
on:
  push:
    paths:
      - '.github/workflows/yangnong-600486-broker-longlist-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Query all Eastmoney report pages
        run: |
          python - <<'PY'
          import json, requests
          url = 'https://reportapi.eastmoney.com/report/list'
          headers = {'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/'}
          all_rows=[]
          for page in range(1,6):
              params = {
                  'industryCode':'*','pageSize':'100','industry':'*',
                  'rating':'*','ratingChange':'*','beginTime':'2010-01-01',
                  'endTime':'2030-01-01','pageNo':str(page),'fields':'','qType':'0',
                  'orgCode':'','code':'600486','rcode':'','p':str(page),
                  'pageNum':str(page),'pageNumber':str(page)
              }
              r=requests.get(url,params=params,headers=headers,timeout=30)
              r.raise_for_status()
              rows=(r.json().get('data') or [])
              print('PAGE',page,'ROWS',len(rows))
              all_rows.extend(rows)
              if len(rows)<100: break
          seen=set(); selected=[]
          for rec in all_rows:
              code=rec.get('infoCode')
              if not code or code in seen: continue
              seen.add(code)
              title=str(rec.get('title') or '')
              pages=int(rec.get('attachPages') or 0)
              if pages>=15 or any(k in title for k in ('深度','首次覆盖','价值分析','投资价值')):
                  selected.append(rec)
          selected.sort(key=lambda r:(int(r.get('attachPages') or 0), str(r.get('publishDate') or '')), reverse=True)
          print('LONG_COUNT',len(selected))
          for i,rec in enumerate(selected,1):
              out={k:rec.get(k) for k in ['infoCode','title','publishDate','orgSName','orgName','researcher','emRatingName','attachPages','attachSize','reportType']}
              print('LONG',i,json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
