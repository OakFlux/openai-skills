name: grand-pharma-jsdiag
on:
  push:
    branches: [chatgpt-temp-grand-pharma-jsdiag-20260905]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch viewer JavaScript
        run: |
          mkdir -p diag
          base='https://www.fxbaogao.com/_fxbg/2609031714/js'
          curl -L --fail -A 'Mozilla/5.0' "$base/runtime.f87a2ed9ca0214da6c96.js" -o diag/runtime.js
          curl -L --fail -A 'Mozilla/5.0' "$base/antd-table.efc2d913db806c205059.chunk.js" -o diag/table.js
          curl -L --fail -A 'Mozilla/5.0' "$base/vendors~app-pages-fxbg-main-js.dabdfdee4aa31d0d4b4a.chunk.js" -o diag/vendors.js
          curl -L --fail -A 'Mozilla/5.0' "$base/app-pages-fxbg-main-js.71ff9d5297a4e28fc829.chunk.js" -o diag/main.js
          grep -Eo 'https?://[^" ]+|/[A-Za-z0-9_.?=&/-]*(api|view|pdf|download|document|report|page)[A-Za-z0-9_.?=&/-]*' diag/*.js | sort -u > diag/endpoints.txt || true
          grep -Eo '[0-9]+\.[a-f0-9]+\.chunk\.js' diag/runtime.js | sort -u > diag/chunks.txt || true
          wc -c diag/*
      - uses: actions/upload-artifact@v4
        with:
          name: Grand-Pharma-JS-Diagnostics
          path: diag
          retention-days: 1
