name: Build Jianshe Industry 002265 broker reports final v2

on:
  push:
    paths:
      - '.github/workflows/jianshe-industry-002265-broker-reports-final-v2-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf

      - name: Download and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,re,subprocess,time,zipfile
          from pathlib import Path
          import requests
          from pypdf import PdfReader

          package='建设工业_002265_券商研究报告_完整PDF_2份'
          root=Path(package); root.mkdir(exist_ok=True)
          previews=root/'首页预览'; previews.mkdir(exist_ok=True)
          specs=[
            {'broker':'中航证券','date':'2026-09-09','analysts':'王菁菁、梁晨、张超','rating':'增持','title':'2026年半年报点评：特品放量驱动营收+40%，Q2单季利润弹性释放','codes':['AP202609091829174390','AP202609141829364007'],'filename':'01_中航证券_建设工业_2026年半年报点评_特品放量驱动营收增长_2026-09-09.pdf'},
            {'broker':'太平洋证券','date':'2025-06-04','analysts':'马浩然','rating':'增持（首次覆盖）','title':'主营业务保持稳定，“一核两翼”向新发展','codes':['AP202506051685101820'],'filename':'02_太平洋证券_建设工业_主营业务保持稳定一核两翼向新发展_2025-06-04.pdf'}
          ]
          s=requests.Session(); s.trust_env=False
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36'

          def fetch(spec):
            attempts=[]
            for code in spec['codes']:
              for prefix in ['H3','H2','H1','H4']:
                url=f'https://pdf.dfcfw.com/pdf/{prefix}_{code}_1.pdf'
                for n in range(4):
                  try:
                    r=s.get(url,timeout=(25,180),allow_redirects=True,headers={'User-Agent':ua,'Referer':f'https://data.eastmoney.com/report/info/{code}.html','Accept':'application/pdf,*/*;q=0.8'})
                    attempts.append({'url':url,'status':r.status_code,'bytes':len(r.content),'type':r.headers.get('content-type','')})
                    if r.status_code==200 and r.content[:5]==b'%PDF-' and len(r.content)>50000:
                      return r.content,code,url,attempts
                  except Exception as e:
                    attempts.append({'url':url,'error':repr(e)})
                  time.sleep(1+n)
            raise RuntimeError(json.dumps(attempts[-10:],ensure_ascii=False))

          manifest=[]
          for spec in specs:
            data,code,url,attempts=fetch(spec)
            dest=root/spec['filename']; dest.write_bytes(data)
            reader=PdfReader(str(dest),strict=False); pages=len(reader.pages)
            if pages<3: raise RuntimeError(f'too few pages {dest.name}: {pages}')
            text='\n'.join((p.extract_text() or '') for p in reader.pages[:min(10,pages)])
            compact=re.sub(r'\s+','',text)
            text_identity=[x for x in ['建设工业','002265','西仪股份'] if x in compact]
            subprocess.run(['qpdf','--warning-exit-0','--check',str(dest)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            prefix_path=previews/dest.stem
            subprocess.run(['pdftoppm','-f','1','-l','1','-png','-r','150','-singlefile',str(dest),str(prefix_path)],check=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
            preview=Path(str(prefix_path)+'.png')
            if not preview.exists() or preview.stat().st_size<10000: raise RuntimeError('preview failed')
            sha=hashlib.sha256(data).hexdigest()
            manifest.append({**{k:v for k,v in spec.items() if k!='codes'},'selected_info_code':code,'source_report_page':f'https://data.eastmoney.com/report/info/{code}.html','pdf_url':url,'pages':pages,'bytes':len(data),'sha256':sha,'text_identity_matches':text_identity,'text_chars_extracted':len(text),'preview_file':str(Path('首页预览')/preview.name),'validation':['PDF header','source info-code mapping','page count','qpdf structure','first-page render'],'download_attempts':attempts})

          lines=['建设工业集团（云南）股份有限公司（002265.SZ）券商研究报告完整PDF资料包','整理日期：2026-10-16','','本包收录2份公开可直接取得的券商原始完整PDF。公开索引中未发现第三份同等质量的公司覆盖报告，因此未使用行业周报或机构调研纪要凑数。','']
          for i,x in enumerate(manifest,1):
            lines += [f"{i}. {x['broker']}：《{x['title']}》",f"   日期：{x['date']}；分析师：{x['analysts']}；评级：{x['rating']}",f"   完整页数：{x['pages']}页；文件：{x['filename']}",f"   来源页面：{x['source_report_page']}",f"   SHA-256：{x['sha256']}",'']
          lines += ['报告内容及版权归原券商与作者所有，仅供研究参考，不构成投资建议。','核验项目：PDF文件头、研报信息代码映射、页数、qpdf结构、首页渲染、ZIP CRC及SHA-256。']
          (root/'00_文件清单与说明.txt').write_text('\n'.join(lines),encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'SHA256SUMS.txt').write_text(''.join(f"{x['sha256']}  {x['filename']}\n" for x in manifest),encoding='utf-8')
          zpath=Path(package+'.zip')
          with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6,allowZip64=True) as z:
            for p in sorted(root.rglob('*')):
              if p.is_file(): z.write(p,arcname=f'{package}/{p.relative_to(root)}')
          with zipfile.ZipFile(zpath) as z:
            bad=z.testzip(); pdfs=[n for n in z.namelist() if n.lower().endswith('.pdf')]
            if bad or len(pdfs)!=2: raise RuntimeError(f'zip failed {bad} {len(pdfs)}')
          Path('jianshe_industry_broker_reports.zip').write_bytes(zpath.read_bytes())
          print('FINAL_ZIP',zpath,zpath.stat().st_size,'SHA256',hashlib.sha256(zpath.read_bytes()).hexdigest())
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: jianshe-industry-002265-broker-reports-final-v2
          path: |
            建设工业_002265_券商研究报告_完整PDF_2份.zip
            jianshe_industry_broker_reports.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
