name: Probe FXBaogao public viewer JS 20260919

on:
  push:
    paths:
      - '.github/workflows/fxbaogao-viewer-js-probe-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Fetch public viewer assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fxviewer
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import json,requests
          from bs4 import BeautifulSoup
          s=requests.Session();s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          page='https://www.fxbaogao.com/view?id=5454573'
          r=s.get(page,timeout=(20,90));r.raise_for_status()
          Path('fxviewer/page.html').write_bytes(r.content)
          soup=BeautifulSoup(r.text,'lxml')
          assets=[]
          for tag in soup.find_all(['script','link']):
            val=tag.get('src') or tag.get('href')
            if val:assets.append(urljoin(r.url,val))
          # include known public config/chunks
          rec=[]
          for i,u in enumerate(dict.fromkeys(assets)):
            try:
              ar=s.get(u,headers={'Referer':page},timeout=(20,120),allow_redirects=True)
              print('ASSET',i,ar.status_code,len(ar.content),ar.url,flush=True)
              ext='.js' if ('javascript' in (ar.headers.get('content-type') or '').lower() or u.endswith('.js')) else '.bin'
              fn=Path(f'fxviewer/asset_{i:02d}{ext}')
              fn.write_bytes(ar.content)
              rec.append({'index':i,'input_url':u,'final_url':ar.url,'status':ar.status_code,'type':ar.headers.get('content-type'),'bytes':len(ar.content),'file':fn.name})
            except Exception as e:
              rec.append({'index':i,'input_url':u,'error':repr(e)})
          Path('fxviewer/assets.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          import re,json
          patterns=[r'https?://[^"\'`\\\s]+',r'["\'](/[^"\']*(?:report|pdf|view|download|preview|image|mofoun|api)[^"\']*)["\']',r'(?:url|baseURL|apiUrl|fileUrl|pdfUrl|downloadUrl)\s*[:=]\s*["\']([^"\']+)["\']']
          out=[]
          for f in sorted(Path('fxviewer').glob('asset_*.js')):
            t=f.read_text('utf-8','ignore')
            hits=[]
            for pat in patterns:
              for m in re.finditer(pat,t,re.I):
                v=m.group(1) if m.lastindex else m.group(0)
                if len(v)<1000 and any(k in v.lower() for k in ['api','report','pdf','download','view','preview','image','mofoun','fxbaogao','hufangde']): hits.append(v)
            # contextual snippets around selected terms
            snippets=[]
            for term in ['api.fxbaogao.com','/mofoun/','/report/','/pdf','download','preview','report-image','sourceUrl','fileUrl','pdfUrl','pageNum','totalPage']:
              start=0
              while True:
                i=t.lower().find(term.lower(),start)
                if i<0:break
                snippets.append({'term':term,'pos':i,'text':t[max(0,i-300):i+700]})
                start=i+1
                if sum(1 for x in snippets if x['term']==term)>=30:break
            out.append({'file':f.name,'bytes':len(t),'hits':sorted(set(hits)),'snippets':snippets})
          Path('fxviewer/analysis.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False)[:50000])
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fxbaogao-viewer-js-probe
          path: fxviewer
          retention-days: 7
          if-no-files-found: warn
