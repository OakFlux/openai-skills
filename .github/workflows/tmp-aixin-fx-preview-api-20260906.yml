name: Temporary Aixin Fx preview metadata
on:
  push:
    branches:
      - tmp-aixin-fx-preview-api-20260906
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch preview JSON
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          mkdir -p output
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          ids=['5605896','5472548','5601555','5252285','5248517','5248522']
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.fxbaogao.com/','Origin':'https://www.fxbaogao.com','Accept':'application/json, text/plain, */*'})
          summary={}
          for report_id in ids:
              url=f'https://api.fxbaogao.com/mofoun/report/report/getReportPreviewImages?reportId={report_id}'
              r=s.get(url,timeout=90)
              print('FETCH',report_id,r.status_code,len(r.content),r.text[:2000],flush=True)
              Path(f'output/{report_id}.txt').write_bytes(r.content)
              try: summary[report_id]=r.json()
              except Exception as e: summary[report_id]={'status':r.status_code,'error':repr(e),'text':r.text[:5000]}
          Path('output/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: aixin-fx-preview-metadata
          path: output/*
          retention-days: 1
          if-no-files-found: error
