name: Temporary Kaisheng Sdyanbao API query

on:
  push:
    branches:
      - tmp-kaisheng-sdyapi-20260905

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query reports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          out=Path('out'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
              'Origin':'https://www.sdyanbao.com',
              'Referer':'https://www.sdyanbao.com/report',
              'Content-Type':'application/json;charset=UTF-8',
              'Accept':'application/json, text/plain, */*',
              'Accept-Language':'zh-CN,zh;q=0.9',
          })
          endpoint='https://api.sdyanbao.com/api/file/search'
          base={'device':1,'hideTrader':0,'onlyTitle':0,'order':1,'page':1,'pageSize':100,'pageCount':0,'dateRange':0,'startTime':'','endTime':'','typeIds':'','industryIds':''}
          queries=['凯盛新能','洛阳玻璃','600876','01108','1108']
          allfiles={}
          for q in queries:
              body=dict(base); body['keyword']=q
              r=s.post(endpoint,json=body,timeout=90)
              print('QUERY',q,r.status_code,len(r.content),r.text[:150],flush=True)
              r.raise_for_status()
              obj=r.json(); (out/f'{q}.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
              data=obj.get('data') or {}
              files=data.get('files') or []
              print('TOTAL',q,data.get('total'),data.get('totalFile'),'FILES',len(files),flush=True)
              for f in files:
                  key=str(f.get('id') or f.get('original_id') or f.get('name'))
                  allfiles[key]=f
                  print('REC',json.dumps({k:f.get(k) for k in ['id','name','page_count','size','time_text','create_time','original_id','page_url','share_url','organization','type','stock','file_size','status']},ensure_ascii=False),flush=True)
          (out/'allfiles.json').write_text(json.dumps(list(allfiles.values()),ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: kaisheng-sdyapi-results
          path: out/*
          retention-days: 1
          if-no-files-found: error
