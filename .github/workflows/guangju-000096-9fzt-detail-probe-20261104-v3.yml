name: Probe Guangju 9fzt detail pages

on:
  push:
    branches:
      - tmp/guangju-000096-broker-reports-20261104-v1
    paths:
      - .github/workflows/guangju-000096-9fzt-detail-probe-20261104-v3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Inspect detail pages
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          urls = [
            "https://www.9fzt.com/detail/sz_000096_10_800916178208.html",
            "https://www.9fzt.com/detail/sz_000096_10_548343534656.html",
            "https://www.9fzt.com/detail/sz_000096_10_476288751279.html",
          ]
          s = requests.Session(); s.trust_env=False
          s.headers.update({"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36","Accept-Language":"zh-CN,zh;q=0.9"})
          for url in urls:
            r=s.get(url,timeout=(20,120),allow_redirects=True)
            print("\n=== PAGE",url,"===")
            print("STATUS",r.status_code,"FINAL",r.url,"BYTES",len(r.content),"TYPE",r.headers.get("content-type"))
            text=r.content.decode(r.apparent_encoding or "utf-8",errors="replace")
            print("HEAD",text[:1500].replace("\n"," "))
            soup=BeautifulSoup(text,"lxml")
            print("TITLE",soup.title.get_text(" ",strip=True) if soup.title else "")
            visible=" ".join(soup.get_text(" ",strip=True).split())
            print("VISIBLE",visible[:5000])
            links=[]
            for tag in soup.find_all(True):
              for attr in ["href","src","data-url","data-src","data-href"]:
                v=tag.get(attr)
                if v:
                  full=urljoin(r.url,v)
                  if full not in links: links.append(full)
            for full in links:
              if any(x in full.lower() for x in ["pdf","report","download","研报","document","api"]):
                print("LINK",full)
            aps=sorted(set(re.findall(r"AP\d{10,}",text)))
            print("AP_CODES",aps)
            pdfs=sorted(set(re.findall(r"https?://[^\s\"'<>]+?\.pdf(?:\?[^\s\"'<>]*)?",text,re.I)))
            print("PDF_URLS",pdfs)
            for pat in ["800916178208","548343534656","476288751279","综合能源供应商","受益于成品油定价机制","多重催化剂"]:
              idx=text.find(pat)
              if idx>=0: print("AROUND",pat,text[max(0,idx-500):idx+1500].replace("\n"," "))
          PY
