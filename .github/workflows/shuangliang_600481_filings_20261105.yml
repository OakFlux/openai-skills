name: package-shuangliang-600481-filings

on:
  push:
    branches:
      - tmp/shuangliang-600481-filings-20261105-v1

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml

      - name: Download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          COMPANY = "双良节能"
          FULL_NAME = "双良节能系统股份有限公司"
          CODE = "600481"
          PREPARED = "2026-11-05"
          ROOT_NAME = "双良节能_600481_2020-2025年报及最新季报"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF文件"
          PREVIEW_DIR = ROOT / "首页预览"
          PDF_DIR.mkdir(parents=True, exist_ok=True)
          PREVIEW_DIR.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          def clean(value: str) -> str:
              return re.sub(r"\s+", "", value or "")

          def fetch_html(url: str) -> tuple[str, str]:
              response = session.get(url, timeout=(30, 240), allow_redirects=True)
              print("HTML", response.status_code, len(response.content), response.url, response.headers.get("content-type"))
              response.raise_for_status()
              response.encoding = response.apparent_encoding or "gbk"
              return response.text, response.url

          def parse_annual_candidates() -> list[dict]:
              list_urls = [
                  "https://money.finance.sina.com.cn/corp/go.php/vCB_AllBulletin/stockid/600481.phtml?ftype=ndbg",
                  "https://vip.stock.finance.sina.com.cn/corp/go.php/vCB_Bulletin/stockid/600481/page_type/ndbg.phtml",
              ]
              collected = []
              for list_url in list_urls:
                  try:
                      html, final_url = fetch_html(list_url)
                  except Exception as exc:
                      print("LIST_ERROR", list_url, repr(exc))
                      continue
                  soup = BeautifulSoup(html, "lxml")
                  for anchor in soup.find_all("a", href=True):
                      title = " ".join(anchor.get_text(" ", strip=True).split())
                      compact_title = clean(title)
                      if "年度报告" not in compact_title or "摘要" in compact_title:
                          continue
                      year_match = re.search(r"(2020|2021|2022|2023|2024|2025)年?度报告", compact_title)
                      if not year_match:
                          continue
                      href = urljoin(final_url, anchor["href"])
                      if "BulletinDetail" not in href:
                          continue
                      id_match = re.search(r"(?:id=|/)(\d{6,})(?:&|$)", href)
                      item_id = int(id_match.group(1)) if id_match else 0
                      collected.append({
                          "year": int(year_match.group(1)),
                          "title": title,
                          "compact_title": compact_title,
                          "detail_url": href,
                          "item_id": item_id,
                      })
              dedup = {}
              for item in collected:
                  key = item["item_id"] or item["detail_url"]
                  dedup[key] = item
              rows = list(dedup.values())
              print("ANNUAL_CANDIDATES", len(rows))
              for row in sorted(rows, key=lambda x: (x["year"], x["item_id"]), reverse=True):
                  print("ANNUAL_ROW", row["year"], row["item_id"], row["title"], row["detail_url"])
              return rows

          def pick_annual(rows: list[dict], year: int) -> dict:
              candidates = [row for row in rows if row["year"] == year]
              if not candidates:
                  raise RuntimeError(f"No annual report candidate for {year}")

              def score(row: dict) -> tuple[int, int, int]:
                  title = row["compact_title"]
                  corrected = 2 if ("更正后" in title or "更新后" in title) else 0
                  full_text = 1 if "摘要" not in title else 0
                  return corrected, full_text, row["item_id"]

              chosen = max(candidates, key=score)
              print("ANNUAL_PICK", year, chosen["item_id"], chosen["title"], chosen["detail_url"])
              return chosen

          def extract_sina_download(detail_url: str) -> str:
              html, final_url = fetch_html(detail_url)
              soup = BeautifulSoup(html, "lxml")
              candidates = []
              for anchor in soup.find_all("a", href=True):
                  text = clean(anchor.get_text(" ", strip=True))
                  href = urljoin(final_url, anchor["href"])
                  if "下载公告" in text or "file.finance.sina.com.cn" in href or href.lower().endswith(".pdf"):
                      candidates.append(href)
              for match in re.findall(r"https?://[^\s\"'<>]+", html):
                  candidate = match.replace("&amp;", "&")
                  if "file.finance.sina.com.cn" in candidate or candidate.lower().endswith(".pdf"):
                      candidates.append(candidate)
              for candidate in dict.fromkeys(candidates):
                  if "file.finance.sina.com.cn" in candidate or candidate.lower().endswith(".pdf"):
                      print("DETAIL_PDF", candidate)
                      return candidate
              raise RuntimeError(f"No downloadable PDF found on {detail_url}")

          def date_from_url(url: str) -> str:
              match = re.search(r"/(20\d{2}-\d{2}-\d{2})/", url)
              return match.group(1) if match else ""

          annual_rows = parse_annual_candidates()
          documents = []
          for sequence, year in enumerate(range(2020, 2026), start=1):
              row = pick_annual(annual_rows, year)
              direct_url = extract_sina_download(row["detail_url"])
              corrected = "更正后" in row["compact_title"] or "更新后" in row["compact_title"]
              display_period = f"{year}年年度报告（更正后）" if corrected else f"{year}年年度报告"
              documents.append({
                  "sequence": sequence,
                  "category": "年度报告",
                  "period": display_period,
                  "year": year,
                  "announcement_date": date_from_url(direct_url),
                  "filename": f"{sequence:02d}_{display_period}.pdf",
                  "minimum_pages": 100,
                  "detail_url": row["detail_url"],
                  "urls": [direct_url, direct_url.replace("http://", "https://", 1)],
              })

          documents.append({
              "sequence": 7,
              "category": "季度报告",
              "period": "2026年第三季度报告",
              "year": 2026,
              "announcement_date": "2026-10-31",
              "filename": "07_2026年第三季度报告.pdf",
              "minimum_pages": 5,
              "detail_url": "https://www.cninfo.com.cn/new/disclosure/stock?stockCode=600481",
              "urls": [
                  "https://static.cninfo.com.cn/finalpage/2026-10-31/1225650705.PDF",
              ],
          })

          accepted_names = [CODE, COMPANY, FULL_NAME, "SHUANGLIANG", "双良节能系统"]

          def compact_pdf_text(reader: PdfReader) -> str:
              count = len(reader.pages)
              indices = list(range(min(16, count)))
              if count > 16:
                  indices.extend(range(max(16, count - 3), count))
              text = "\n".join((reader.pages[i].extract_text() or "") for i in sorted(set(indices)))
              return clean(text)

          def download_valid_pdf(document: dict) -> tuple[bytes, str, str, int]:
              last_error = None
              for url in dict.fromkeys(document["urls"]):
                  for attempt in range(4):
                      try:
                          response = session.get(
                              url,
                              timeout=(30, 480),
                              allow_redirects=True,
                              headers={
                                  "Accept": "application/pdf,*/*;q=0.8",
                                  "Referer": document["detail_url"],
                              },
                          )
                          print("DOWNLOAD", document["period"], response.status_code, len(response.content), response.url, response.headers.get("content-type"))
                          response.raise_for_status()
                          if not response.content.startswith(b"%PDF-") or len(response.content) < 50_000:
                              raise RuntimeError(f"Not a valid PDF response: {response.content[:60]!r}")

                          temp = Path("candidate.pdf")
                          temp.write_bytes(response.content)
                          reader = PdfReader(str(temp), strict=False)
                          pages = len(reader.pages)
                          if pages < document["minimum_pages"]:
                              raise RuntimeError(f"Document too short: {pages} pages")
                          compact = compact_pdf_text(reader)
                          if not any(clean(name) in compact for name in accepted_names):
                              raise RuntimeError("Issuer validation failed")

                          year = document["year"]
                          if document["category"] == "年度报告":
                              period_ok = (f"{year}年年度报告" in compact) or (f"{year}年度报告" in compact)
                          else:
                              period_ok = "2026年第三季度报告" in compact
                          if not period_ok:
                              raise RuntimeError("Period validation failed")

                          return response.content, response.url, response.headers.get("content-type", ""), pages
                      except Exception as exc:
                          last_error = exc
                          print("DOWNLOAD_ERROR", document["period"], attempt, url, repr(exc))
                          time.sleep(1 + attempt)
              raise RuntimeError(f"Unable to obtain {document['period']}: {last_error}")

          manifest = []
          for document in documents:
              data, source_url, content_type, pages = download_valid_pdf(document)
              path = PDF_DIR / document["filename"]
              path.write_bytes(data)

              qpdf = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if qpdf.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {path.name}: {qpdf.stdout}")

              prefix = PREVIEW_DIR / path.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "140", "-singlefile", str(path), str(prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 6_000:
                  raise RuntimeError(f"Preview rendering failed for {path.name}: {render.stdout}")

              record = {
                  "sequence": document["sequence"],
                  "category": document["category"],
                  "period": document["period"],
                  "announcement_date": document["announcement_date"] or date_from_url(source_url),
                  "filename": document["filename"],
                  "pages": pages,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "source_url": source_url,
                  "detail_url": document["detail_url"],
                  "content_type": content_type,
                  "preview_file": str(Path("首页预览") / preview.name),
              }
              manifest.append(record)
              print("VALIDATED", record["period"], record["announcement_date"], record["pages"], record["sha256"])

          if len(manifest) != 7:
              raise RuntimeError(f"Expected 7 documents, got {len(manifest)}")

          readme = [
              f"{FULL_NAME}（{CODE}.SH）2020—2025年年度报告及最新季度报告资料包",
              f"整理日期：{PREPARED}",
              "",
              "文件构成：2020—2025年年度报告全文共6份，以及截至整理日最新独立季度报告——2026年第三季度报告1份。",
              "2020年年度报告存在后续更正版本，本包采用“更正后”全文，未使用已被替代的早期版本。",
              "已排除年度报告摘要、半年度报告、审计附件、提示性公告及其他非正文文件。",
              "",
          ]
          for item in manifest:
              readme.extend([
                  f"{item['sequence']}. {item['filename']}",
                  f"   类型：{item['category']}；报告：{item['period']}",
                  f"   公告日期：{item['announcement_date']}",
                  f"   PDF页数：{item['pages']}；文件大小：{item['bytes']}字节",
                  f"   公告页面：{item['detail_url']}",
                  f"   下载来源：{item['source_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、公司名称或证券代码、报告期间、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "文件仅供研究、教学与信息存档使用。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": FULL_NAME,
              "stock_code": CODE,
              "prepared_on": PREPARED,
              "file_count": len(manifest),
              "annual_report_count": 6,
              "latest_quarter": "2026年第三季度报告",
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")

          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["序号", "类型", "报告", "公告日期", "文件名", "页数", "字节数", "SHA-256", "公告页面", "下载来源", "首页预览"])
              for item in manifest:
                  writer.writerow([
                      item["sequence"], item["category"], item["period"], item["announcement_date"],
                      item["filename"], item["pages"], item["bytes"], item["sha256"],
                      item["detail_url"], item["source_url"], item["preview_file"],
                  ])

          (ROOT / "SHA256SUMS.txt").write_text(
              "\n".join(f"{item['sha256']}  PDF文件/{item['filename']}" for item in manifest) + "\n",
              encoding="utf-8",
          )

          zip_path = Path("shuangliang_600481_2020_2025_annual_latest_quarter.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file_path in sorted(ROOT.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, arcname=str(Path(ROOT_NAME) / file_path.relative_to(ROOT)))

          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed at {bad}")
              pdf_names = [name for name in archive.namelist() if name.lower().endswith(".pdf")]
              if len(pdf_names) != 7:
                  raise RuntimeError(f"ZIP contains {len(pdf_names)} PDFs instead of 7")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "file_count": len(manifest),
              "annual_report_count": 6,
              "latest_quarter": "2026年第三季度报告",
              "files": [{key: item[key] for key in ["period", "announcement_date", "pages", "bytes", "sha256", "source_url"]} for item in manifest],
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: shuangliang-600481-filings-20261105
          path: |
            shuangliang_600481_2020_2025_annual_latest_quarter.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
