name: Probe Hibor report detail downloads 20261014

on:
  push:
    paths:
      - '.github/workflows/zzmd-hibor-detail-probe-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe report pages and downloadable assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4 lxml
          python - <<'PY'
          from __future__ import annotations
          import json, re, urllib.parse
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          ids=['101288']
          out=Path('zzmd_hibor_detail_probe'); out.mkdir(exist_ok=True)
          s=requests.Session(); s.trust_env=False
          s.headers.update({
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
            'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8',
            'Referer':'https://www.hibor.com.cn/',
          })
          pages=[]; assets=[]
          for did in ids:
            urls=[
              f'https://www.hibor.com.cn/docdetail_{did}.html',
              f'https://wap.hibor.com.cn/docdetail_{did}.html',
              f'https://www.hibor.com.cn/repinfodetail_{did}.html',
              f'https://wap.hibor.com.cn/repinfodetail_{did}.html',
              f'http://www.hibor.com.cn/docdetail_{did}.html',
              f'http://wap.hibor.com.cn/docdetail_{did}.html',
            ]
            for idx,url in enumerate(urls):
              try:
                r=s.get(url,timeout=(20,90),allow_redirects=True)
                enc=r.apparent_encoding or r.encoding or 'gb18030'; r.encoding=enc
                text=r.text
                safe=f'{did}_{idx}_{urllib.parse.urlparse(r.url).netloc}'.replace(':','_')
                (out/f'{safe}.html').write_text(text,encoding='utf-8',errors='replace')
                soup=BeautifulSoup(text,'lxml')
                rec={'id':did,'requested':url,'status':r.status_code,'final':r.url,'bytes':len(r.content),'content_type':r.headers.get('content-type'),'title':soup.title.get_text(' ',strip=True) if soup.title else ''}
                pages.append(rec)
                print('\nPAGE',json.dumps(rec,ensure_ascii=False))
                found=[]
                for tag in soup.find_all(True):
                  for attr in ['href','src','data-src','data-url','data-href','action','value']:
                    val=tag.get(attr)
                    if isinstance(val,str) and val.strip():
                      v=val.strip()
                      if any(k in v.lower() for k in ['pdf','download','down','attach','upload','file','doc','read','view','preview','image']) or did in v:
                        found.append({'tag':tag.name,'attr':attr,'raw':v,'url':urllib.parse.urljoin(r.url,v),'text':' '.join(tag.get_text(' ',strip=True).split())[:200]})
                # Raw regex URLs and paths
                pats=[
                  r'https?://[^\"\'<>\s]+',
                  r'[\"\']([^\"\']*(?:pdf|download|down|attach|upload|file|preview|read|view)[^\"\']*)[\"\']',
                ]
                for pat in pats:
                  for m in re.finditer(pat,text,re.I):
                    v=m.group(1) if m.lastindex else m.group(0)
                    found.append({'tag':'raw','attr':'regex','raw':v,'url':urllib.parse.urljoin(r.url,v),'text':''})
                uniq=[]; seen=set()
                for x in found:
                  u=x['url'].replace('&amp;','&')
                  if u not in seen:
                    seen.add(u); x['url']=u; uniq.append(x)
                (out/f'{safe}_assets.json').write_text(json.dumps(uniq,ensure_ascii=False,indent=2),encoding='utf-8')
                for x in uniq:
                  assets.append({'page':r.url,**x})
                print('ASSETS',len(uniq))
                print(json.dumps(uniq[:100],ensure_ascii=False,indent=2)[:30000])
                # Save relevant snippets
                snippets=[]
                for needle in ['报告原文','点击浏览','下载','PDF','Image','101288']:
                  start=0
                  while True:
                    pos=text.find(needle,start)
                    if pos<0: break
                    snippets.append({'needle':needle,'snippet':text[max(0,pos-800):pos+1800]})
                    start=pos+len(needle)
                (out/f'{safe}_snippets.json').write_text(json.dumps(snippets,ensure_ascii=False,indent=2),encoding='utf-8')
              except Exception as exc:
                pages.append({'id':did,'requested':url,'error':repr(exc)})

          # Probe likely assets, save any PDFs/images.
          probed=[]
          for i,x in enumerate(assets):
            u=x['url']
            if not u.startswith(('http://','https://')): continue
            if any(bad in u for bad in ['javascript:','mailto:']): continue
            if not any(k in u.lower() for k in ['pdf','download','down','attach','upload','file','doc','read','view','preview','image','101288']): continue
            try:
              rr=s.get(u,timeout=(15,60),allow_redirects=True,headers={'User-Agent':s.headers['User-Agent'],'Referer':x['page'],'Accept':'application/pdf,image/*,*/*;q=0.5'},stream=False)
              meta={'url':u,'status':rr.status_code,'final':rr.url,'bytes':len(rr.content),'content_type':rr.headers.get('content-type',''),'first16':rr.content[:16].hex()}
              probed.append(meta)
              if rr.status_code==200 and rr.content[:5]==b'%PDF-' and len(rr.content)>10000:
                (out/f'asset_{i:03d}.pdf').write_bytes(rr.content)
                meta['saved']=f'asset_{i:03d}.pdf'
              elif rr.status_code==200 and rr.content[:4] in [b'\x89PNG',b'\xff\xd8\xff\xe0',b'\xff\xd8\xff\xe1'] and len(rr.content)>5000:
                ext='.png' if rr.content[:4]==b'\x89PNG' else '.jpg'
                (out/f'asset_{i:03d}{ext}').write_bytes(rr.content)
                meta['saved']=f'asset_{i:03d}{ext}'
              print('PROBE',json.dumps(meta,ensure_ascii=False))
            except Exception as exc:
              probed.append({'url':u,'error':repr(exc)})
          (out/'pages.json').write_text(json.dumps(pages,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'all_assets.json').write_text(json.dumps(assets,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'probed.json').write_text(json.dumps(probed,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Upload probe output
        uses: actions/upload-artifact@v4
        with:
          name: zzmd-hibor-detail-probe-20261014
          path: zzmd_hibor_detail_probe
          retention-days: 2
          if-no-files-found: error
