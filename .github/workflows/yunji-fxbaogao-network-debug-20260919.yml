name: Debug Yunji Fxbaogao public report viewer 20260919

on:
  push:
    paths:
      - '.github/workflows/yunji-fxbaogao-network-debug-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Inspect public report pages and network
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio, json, re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from playwright.async_api import async_playwright

          out = Path('fxbaogao-debug')
          out.mkdir(exist_ok=True)
          ids = ['5357306','5312314','5274246']
          ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36'

          # Raw HTTP inspection first.
          session = requests.Session(); session.trust_env = False
          session.headers.update({'User-Agent': ua, 'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.8'})
          for rid in ids:
              for kind, url in [('detail',f'https://www.fxbaogao.com/detail/{rid}'),('view',f'https://www.fxbaogao.com/view?id={rid}')]:
                  try:
                      r = session.get(url, timeout=(20,90), allow_redirects=True)
                      print('RAW',rid,kind,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                      (out/f'{rid}-{kind}-raw.html').write_bytes(r.content)
                      text = r.text
                      soup=BeautifulSoup(text,'html.parser')
                      links=[]
                      for tag in soup.find_all(['script','link','a','img']):
                          for attr in ('src','href','data-src','data-url'):
                              val=tag.get(attr)
                              if val: links.append(val)
                      (out/f'{rid}-{kind}-links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
                      for needle in (rid,'report-image','.pdf','api','pageCount','totalPage','view'):
                          positions=[m.start() for m in re.finditer(re.escape(needle),text,re.I)]
                          for pos in positions[:20]:
                              print('CONTEXT',rid,kind,needle,repr(text[max(0,pos-250):pos+500]),flush=True)
                  except Exception as e:
                      print('RAWERR',rid,kind,repr(e),flush=True)

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled'])
                  context = await browser.new_context(user_agent=ua, viewport={'width':1440,'height':1100}, locale='zh-CN')
                  for rid in ids:
                      page = await context.new_page()
                      network=[]
                      console=[]
                      page.on('console', lambda msg, rid=rid: console.append({'type':msg.type,'text':msg.text}))
                      page.on('request', lambda req, rid=rid: network.append({'event':'request','method':req.method,'url':req.url,'resource_type':req.resource_type,'post_data':req.post_data}))
                      page.on('response', lambda resp, rid=rid: network.append({'event':'response','status':resp.status,'url':resp.url,'resource_type':resp.request.resource_type,'content_type':resp.headers.get('content-type','')}))
                      for kind, url in [('detail',f'https://www.fxbaogao.com/detail/{rid}'),('view',f'https://www.fxbaogao.com/view?id={rid}')]:
                          try:
                              print('GOTO',rid,kind,url,flush=True)
                              resp=await page.goto(url,wait_until='domcontentloaded',timeout=120000)
                              print('GOT',rid,kind,resp.status if resp else None,page.url,flush=True)
                              await page.wait_for_timeout(5000)
                              # Try natural scroll to trigger lazy loading.
                              for i in range(15):
                                  await page.mouse.wheel(0,1500)
                                  await page.wait_for_timeout(400)
                              # Click likely free viewer link/buttons if present.
                              selectors=['text=点击免费查看完整报告','text=查看完整报告','text=报告原文','a[href*="/view"]','button:has-text("查看")']
                              for sel in selectors:
                                  try:
                                      loc=page.locator(sel).first
                                      if await loc.count() and await loc.is_visible():
                                          print('CLICK',rid,kind,sel,await loc.get_attribute('href'),flush=True)
                                          async with page.expect_navigation(wait_until='domcontentloaded',timeout=30000):
                                              await loc.click()
                                          await page.wait_for_timeout(5000)
                                          break
                                  except Exception as e:
                                      print('CLICKERR',rid,kind,sel,repr(e),flush=True)
                              for i in range(20):
                                  await page.mouse.wheel(0,1800)
                                  await page.wait_for_timeout(350)
                              html=await page.content()
                              (out/f'{rid}-{kind}-browser.html').write_text(html,encoding='utf-8')
                              await page.screenshot(path=str(out/f'{rid}-{kind}.png'),full_page=True)
                              state={
                                  'url':page.url,
                                  'title':await page.title(),
                                  'cookies':await context.cookies(),
                                  'localStorage':await page.evaluate("Object.fromEntries(Object.entries(localStorage))"),
                                  'sessionStorage':await page.evaluate("Object.fromEntries(Object.entries(sessionStorage))"),
                                  'body_text':(await page.locator('body').inner_text())[:30000],
                              }
                              (out/f'{rid}-{kind}-state.json').write_text(json.dumps(state,ensure_ascii=False,indent=2),encoding='utf-8')
                          except Exception as e:
                              print('BROWSERERR',rid,kind,repr(e),flush=True)
                      (out/f'{rid}-network.json').write_text(json.dumps(network,ensure_ascii=False,indent=2),encoding='utf-8')
                      (out/f'{rid}-console.json').write_text(json.dumps(console,ensure_ascii=False,indent=2),encoding='utf-8')
                      print('FILTERED_NETWORK',rid,flush=True)
                      seen=set()
                      for item in network:
                          u=item.get('url','')
                          if any(x in u.lower() for x in ['report-image','.pdf','api','5357306','5312314','5274246','oss','viewer','download']):
                              key=(item.get('event'),u,item.get('status'))
                              if key not in seen:
                                  seen.add(key); print(json.dumps(item,ensure_ascii=False),flush=True)
                      await page.close()
                  await browser.close()
          asyncio.run(main())
          PY

      - name: Upload debug bundle
        uses: actions/upload-artifact@v4
        with:
          name: yunji-fxbaogao-debug
          path: fxbaogao-debug
          if-no-files-found: error
          retention-days: 7
