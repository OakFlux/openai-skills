name: Inspect HJTime Fxbaogao detail anchors 20261012

on:
  push:
    paths:
      - '.github/workflows/hjtime-603101-fxbaogao-detail-anchor-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Inspect detail anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,re,json,urllib.parse
          from bs4 import BeautifulSoup
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Referer':'https://www.fxbaogao.com/','Accept-Language':'zh-CN,zh;q=0.9'})
          for did in ('5271496','5261391'):
            for base in ('https://www.fxbaogao.com/detail/','https://fxbaogao.com/detail/'):
              url=base+did
              try:
                r=s.get(url,timeout=(15,60),allow_redirects=True)
                print('PAGE',did,r.status_code,len(r.content),r.url,r.headers.get('content-type'),flush=True)
                text=r.text
                soup=BeautifulSoup(text,'lxml')
                anchors=[]
                for a in soup.find_all('a',href=True):
                  anchors.append({'text':' '.join(a.get_text(' ',strip=True).split()),'title':a.get('title'),'href':urllib.parse.urljoin(r.url,a['href'])})
                print('ANCHORS',did,json.dumps(anchors[:500],ensure_ascii=False),flush=True)
                for pat in ('点击查看原文','pdfPath','auth_key','preDown','download','fileUrl','report/2026','5271496','5261391'):
                  snips=[]
                  for m in list(re.finditer(pat,text,re.I))[:50]: snips.append(text[max(0,m.start()-500):min(len(text),m.end()+1000)])
                  if snips: print('SNIPS',did,pat,json.dumps(snips,ensure_ascii=False),flush=True)
              except Exception as e: print('ERR',did,url,repr(e),flush=True)
          PY
