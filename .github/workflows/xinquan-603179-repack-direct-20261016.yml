name: Repack Xinquan 603179 reports for direct download

on:
  push:
    paths:
      - '.github/workflows/xinquan-603179-repack-direct-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download completed source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming direct
          gh run download 38837902285 \
            --repo OakFlux/openai-skills \
            --name xinquan-603179-annual-reports-final \
            --dir incoming
          ls -lah incoming

      - name: Extract final report package
        shell: bash
        run: |
          set -euo pipefail
          unzip -q 'incoming/新泉股份_603179_2020-2025年报及最新季报.zip' -d direct
          test -d 'direct/新泉股份_603179_2020-2025年报及最新季报'
          pdf_count="$(find 'direct/新泉股份_603179_2020-2025年报及最新季报' -type f -iname '*.pdf' | wc -l)"
          test "$pdf_count" -eq 7
          find 'direct/新泉股份_603179_2020-2025年报及最新季报' -type f -maxdepth 2 -print

      - name: Upload directly usable ZIP contents
        uses: actions/upload-artifact@v4
        with:
          name: xinquan-603179-reports-direct
          path: direct/新泉股份_603179_2020-2025年报及最新季报
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
