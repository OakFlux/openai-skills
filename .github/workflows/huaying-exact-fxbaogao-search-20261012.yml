name: Exact search Huaying deep reports in fxbaogao 20261012

on:
  push:
    paths:
      - '.triggers/huaying-exact-fxbaogao-search-20261012.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query exact titles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, requests, re
          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0','Content-Type':'application/json','Accept':'application/json,*/*'})
          ep='https://api.fxbaogao.com/mofoun/report/searchReportData/searchListNoAuth'
          queries=[
            '华映科技 华丽转身 拐点将现',
            '华丽转身 拐点将现',
            '华映科技 溢流玻璃 6代IGZO',
            '溢流玻璃 6代IGZO 打开新成长空间',
            '华映科技 IGZO OLED 3D玻璃',
            'IGZO OLED 紧跟巨头步伐 3D玻璃有望爆发',
            '华映科技 深度报告',
            '华映科技 000536 2016',
          ]
          seen={}
          for q in queries:
            for order in (1,3,2):
              for page in range(1,8):
                body={'keywords':q,'pageIndex':page,'pageSize':20,'order':order,'nop':-1}
                try:
                  r=s.post(ep,json=body,timeout=60)
                  print('Q',q,'ORDER',order,'PAGE',page,'STATUS',r.status_code,'BYTES',len(r.content),flush=True)
                  if r.status_code!=200: break
                  j=r.json(); rows=((j.get('data') or {}).get('dataList') or [])
                  print('ROWS',len(rows),'TOTAL',((j.get('data') or {}).get('total') or (j.get('data') or {}).get('totalCount')),flush=True)
                  for row in rows:
                    blob=json.dumps(row,ensure_ascii=False)
                    if any(k in blob for k in ['华映科技','000536','华丽转身','溢流玻璃','IGZO','3D玻璃']):
                      did=str(row.get('docId') or row.get('id') or '')
                      if did: seen[did]=row
                      print('MATCH',json.dumps(row,ensure_ascii=False),flush=True)
                  if len(rows)<20: break
                except Exception as e:
                  print('ERR',q,order,page,repr(e),flush=True); break
          print('UNIQUE',len(seen),flush=True)
          for did,row in seen.items(): print('FINAL',did,json.dumps(row,ensure_ascii=False),flush=True)
          PY
