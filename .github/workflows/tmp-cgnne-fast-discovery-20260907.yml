name: Quick CGN New Energy report discovery
on:
  push:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch and inspect pages
        run: |
          python - <<'PY'
          import requests,re,json
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          urls=['https://www.hangyan.co/charts/2825601013707179854','https://www.sgpjbg.com/baogao/70108.html','https://www.sgpjbg.com/baogao/44868.html']
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          for u in urls:
            r=s.get(u,timeout=90)
            print('\nURL',u,'STATUS',r.status_code,'SIZE',len(r.content),'FINAL',r.url)
            print('HEAD',r.text[:800].replace('\n',' '))
            soup=BeautifulSoup(r.text,'html.parser')
            for a in soup.find_all('a',href=True):
              href=urljoin(r.url,a['href']); text=a.get_text(' ',strip=True)
              if '/reports/' in href or '.pdf' in href.lower() or 'download' in href.lower() or '下载' in text:
                print('A',json.dumps({'text':text[:150],'href':href},ensure_ascii=False))
            for pat in [r'https?://[^"\'<>\s]+\.pdf[^"\'<>\s]*',r'/reports/\d+',r'pdfUrl["\']?\s*[:=]\s*["\']([^"\']+)',r'fileUrl["\']?\s*[:=]\s*["\']([^"\']+)']:
              vals=list(dict.fromkeys(re.findall(pat,r.text,re.I)))
              if vals: print('PAT',pat,json.dumps(vals[:100],ensure_ascii=False))
          PY
