name: Export Hangyan chart pages
on:
  push:
    branches: [tmp-hangyan-chart-export-20260906]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch chart pages
        run: |
          mkdir -p out
          curl -L --retry 3 -A 'Mozilla/5.0' 'https://www.hangyan.co/charts/2536171657060419515' -o out/chart1.html
          curl -L --retry 3 -A 'Mozilla/5.0' 'https://www.hangyan.co/charts/2926948901774689740' -o out/chart2.html
          wc -c out/*
      - uses: actions/upload-artifact@v4
        with:
          name: hangyan-chart-pages
          path: out
          retention-days: 1
          compression-level: 0
