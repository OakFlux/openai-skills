name: Probe Kinco Sina download links

on:
  push:
    paths:
      - '.github/workflows/kinco-sina-download-link-probe-20261028.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Fetch and inspect Sina bulletin pages
        run: |
          python - <<'PY'
          import json,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          ids=[7079356,10962008,12058320,12216398]
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          for bid in ids:
              url=f'https://vip.stock.finance.sina.com.cn/corp/view/vCB_AllBulletinDetail.php?id={bid}&stockid=688160'
              r=s.get(url,timeout=60,allow_redirects=True)
              print('\nPAGE',bid,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
              enc=r.apparent_encoding or 'gb18030'
              text=r.content.decode(enc,errors='replace')
              print('ENC',enc,'TITLE',re.findall(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)[:1])
              soup=BeautifulSoup(text,'lxml')
              for a in soup.find_all('a',href=True):
                  label=' '.join(a.get_text(' ',strip=True).split())
                  href=urljoin(r.url,a['href'])
                  if any(k in href.lower() for k in ('file.finance.sina','pdf','download','mrgg')) or '下载公告' in label:
                      print('LINK',json.dumps({'label':label,'href':href},ensure_ascii=False))
              patterns=[r'https?://[^\"\'<>\s]+',r'(?:file_url|download_url|fileUrl|url)\s*[:=]\s*[\"\']([^\"\']+)[\"\']']
              for pat in patterns:
                  vals=[]
                  for m in re.finditer(pat,text,re.I):
                      v=m.group(1) if m.lastindex else m.group(0)
                      v=v.replace('\\/','/')
                      if any(k in v.lower() for k in ('file.finance.sina','pdf','mrgg','download')):vals.append(v)
                  for v in list(dict.fromkeys(vals)):
                      print('REGEX',v[:1000])
          PY
