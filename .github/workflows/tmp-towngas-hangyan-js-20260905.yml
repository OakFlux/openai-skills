name: Temporary Towngas Hangyan PDF endpoint inspection

on:
  push:
    branches:
      - tmp-towngas-broker-reports-20260905

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect JavaScript and PDF endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import re
          import requests
          from pathlib import Path

          urls = [
            'https://cdn.hangyan.co/assets/application-ec845e69.js',
            'https://www.hangyan.co/reports/3860972724125959389',
          ]
          s = requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36','Referer':'https://www.hangyan.co/'})
          for url in urls:
            r=s.get(url,timeout=90)
            print('FETCH',url,r.status_code,len(r.content),r.headers.get('content-type'),r.url,flush=True)
            text=r.text
            Path('fetched_'+re.sub(r'[^A-Za-z0-9]+','_',url)+'.txt').write_text(text,encoding='utf-8')
            for kw in ['native-pdf','cacheKey','cache-key','download','pdfjs','webviewer','iframe','filename','signed','presign','reports/']:
              positions=[m.start() for m in re.finditer(re.escape(kw),text,re.I)]
              print('KEYWORD',url,kw,'COUNT',len(positions),flush=True)
              for pos in positions[:20]:
                print('CONTEXT',kw,text[max(0,pos-900):pos+1800],flush=True)
            for pat in [r'https?://[^\s"\'<>`]+',r'["\'](/[^"\']*(?:pdf|download|cache|document|file)[^"\']*)["\']']:
              for match in re.findall(pat,text,re.I):
                value=match if isinstance(match,str) else match[0]
                print('URLMATCH',value[:800],flush=True)
          PY

      - name: Upload inspection output
        uses: actions/upload-artifact@v4
        with:
          name: towngas-hangyan-js-inspection
          path: fetched_*.txt
          retention-days: 1
          if-no-files-found: error
