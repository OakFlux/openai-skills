name: Check Bona Film report pages

on:
  push:
    paths:
      - '.github/workflows/check-bona-report-pages-20261012.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read public report pages
        run: |
          for id in 188006 187485 165292 165491; do
            echo "===== $id ====="
            curl -L --max-time 60 -A 'Mozilla/5.0' "https://www.sgpjbg.com/baogao/${id}.html" -o "/tmp/${id}.html"
            wc -c "/tmp/${id}.html"
            grep -Eio 'https?://[^"'"'"' <>]+' "/tmp/${id}.html" | grep -Ei 'pdf|down|file|preview|upload' | head -100 || true
            grep -Ei 'pdf|download|downurl|fileurl|preview' "/tmp/${id}.html" | head -100 || true
          done
