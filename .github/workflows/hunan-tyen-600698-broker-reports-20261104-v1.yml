name: Package Hunan Tyen 600698 broker research reports

on:
  push:
    branches:
      - tmp/hunan-tyen-600698-broker-reports-20261104-v1
    paths:
      - .github/workflows/hunan-tyen-600698-broker-reports-20261104-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          python -m pip install --quiet requests pypdf beautifulsoup4 lxml

      - name: Discover download validate and package reports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          CODE = "600698"
          B_CODE = "900946"
          COMPANY = "湖南天雁"
          FULL = "湖南天雁机械股份有限公司"
          PREPARED = "2026-11-04"
          ROOT_NAME = "湖南天雁_600698_券商研究报告"
          ROOT = Path(ROOT_NAME)
          PDF_DIR = ROOT / "PDF原件"
          PREVIEW_DIR = ROOT / "首页预览"
          DISCOVERY_DIR = ROOT / "检索记录"
          for directory in [PDF_DIR, PREVIEW_DIR, DISCOVERY_DIR]:
              directory.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
          })

          known = [
              {
                  "date": "2014-05-18",
                  "broker": "西南证券",
                  "analyst": "徐永超；研究助理：高翔、梁超、简洁",
                  "rating": "中性（首次）",
                  "report_type": "公司深度报告",
                  "title": "涡轮增压民族龙头，加快布局汽涡市场",
                  "info_code": "AP201405200005854672",
                  "urls": [
                      "https://pdf.dfcfw.com/pdf/H3_AP201405200005854672_1.pdf",
                      "https://pdf.dfcfw.com/pdf/H2_AP201405200005854672_1.pdf",
                  ],
                  "detail_url": "https://data.eastmoney.com/report/info/AP201405200005854672.html",
                  "priority": 1000,
              },
              {
                  "date": "2014-10-28",
                  "broker": "渤海证券",
                  "analyst": "郑连声",
                  "rating": "公开页面未标注",
                  "report_type": "公司季报点评",
                  "title": "业绩承压，国资改革预期是公司股价催化剂",
                  "info_code": "AP201410280007460622",
                  "urls": [
                      "https://pdf.dfcfw.com/pdf/H3_AP201410280007460622_1.pdf",
                      "https://pdf.dfcfw.com/pdf/H2_AP201410280007460622_1.pdf",
                  ],
                  "detail_url": "https://data.eastmoney.com/report/info/AP201410280007460622.html",
                  "priority": 700,
              },
          ]

          source_pages = [
              "https://www.fxbaogao.com/detail/1056934",
              "https://www.fxbaogao.com/detail/1835541",
              "https://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/search/rptid/479202950239/index.phtml",
              "https://www.futunn.com/hk/stock/600698-SH/institutional-ratings",
          ]

          def request(method: str, url: str, **kwargs):
              last = None
              for attempt in range(5):
                  try:
                      response = session.request(method, url, timeout=(25, 300), allow_redirects=True, **kwargs)
                      print("REQUEST", method, response.status_code, len(response.content), response.url)
                      return response
                  except Exception as exc:
                      last = exc
                      print("REQUEST_ERROR", method, url, attempt, repr(exc))
                      time.sleep(1 + attempt)
              raise RuntimeError(f"request failed: {url}: {last}")

          discovered_urls = []
          page_records = []
          for page_url in source_pages:
              try:
                  response = request("GET", page_url)
                  text_candidates = []
                  for encoding in [response.encoding, response.apparent_encoding, "utf-8", "gb18030", "gbk"]:
                      if not encoding:
                          continue
                      try:
                          text_candidates.append(response.content.decode(encoding, errors="replace"))
                      except Exception:
                          pass
                  text = max(text_candidates, key=len, default="")
                  safe_page_name = re.sub(r"[^A-Za-z0-9._-]+", "_", page_url)[:140] + ".html"
                  (DISCOVERY_DIR / safe_page_name).write_text(text, encoding="utf-8")
                  urls = []
                  soup = BeautifulSoup(text, "lxml")
                  for tag in soup.find_all(True):
                      for attr in ["href", "src", "data-url", "data-href", "data-src"]:
                          value = tag.get(attr)
                          if value and ".pdf" in value.lower():
                              urls.append(urljoin(response.url, value.strip()))
                  for match in re.findall(r"(?:https?:)?//[^\s\"'<>\\]+\.pdf(?:\?[^\s\"'<>\\]*)?|[^\s\"'<>\\]+\.pdf(?:\?[^\s\"'<>\\]*)?", text, flags=re.I):
                      urls.append(urljoin(response.url, html.unescape(match.strip())))
                  unique = []
                  for url in urls:
                      url = url.replace("\\/", "/").replace("&amp;", "&")
                      if url not in unique:
                          unique.append(url)
                  discovered_urls.extend(unique)
                  page_records.append({"page_url": page_url, "status": response.status_code, "final_url": response.url, "pdf_candidates": unique})
                  print("PAGE_PDF_CANDIDATES", page_url, json.dumps(unique, ensure_ascii=False))
              except Exception as exc:
                  page_records.append({"page_url": page_url, "error": repr(exc)})

          # Query Eastmoney's public stock-report API across historical windows.
          api_records = []
          for begin, end in [
              ("2005-01-01", "2010-12-31"),
              ("2011-01-01", "2016-12-31"),
              ("2017-01-01", "2021-12-31"),
              ("2022-01-01", "2026-11-04"),
          ]:
              for stock_code in [CODE, B_CODE]:
                  body = {
                      "pageSize": 100,
                      "pageNo": 1,
                      "p": 1,
                      "pageNum": 1,
                      "pageNumber": 1,
                      "beginTime": begin,
                      "endTime": end,
                      "code": stock_code,
                      "industryCode": "*",
                      "rating": None,
                      "ratingChange": None,
                      "orgCode": None,
                      "rcode": "",
                  }
                  try:
                      response = request(
                          "POST",
                          "https://reportapi.eastmoney.com/report/list2",
                          json=body,
                          headers={"Content-Type": "application/json", "Referer": "https://data.eastmoney.com/report/"},
                      )
                      obj = response.json()
                      batch = obj.get("data") or []
                      print("LIST2", stock_code, begin, end, "ROWS", len(batch), "HITS", obj.get("hits"))
                      api_records.extend(batch)
                  except Exception as exc:
                      print("LIST2_FAILED", stock_code, begin, end, repr(exc))

          (DISCOVERY_DIR / "source_page_discovery.json").write_text(json.dumps(page_records, ensure_ascii=False, indent=2), encoding="utf-8")
          (DISCOVERY_DIR / "eastmoney_api_records.json").write_text(json.dumps(api_records, ensure_ascii=False, indent=2), encoding="utf-8")

          seen_info = {item["info_code"] for item in known}
          for row in api_records:
              if not isinstance(row, dict):
                  continue
              info = str(row.get("infoCode") or row.get("INFO_CODE") or "").strip()
              if not info or info in seen_info:
                  continue
              seen_info.add(info)
              title = str(row.get("title") or row.get("REPORT_TITLE") or "").strip()
              broker = str(row.get("orgSName") or row.get("orgName") or row.get("ORG_NAME") or "").strip()
              analyst = str(row.get("researcher") or row.get("RESEARCHER") or "").strip()
              publish = str(row.get("publishDate") or row.get("REPORT_DATE") or "").strip()
              rating = str(row.get("emRatingName") or row.get("ratingName") or "").strip()
              if not title:
                  continue
              known.append({
                  "date": publish[:10] if publish else "未知日期",
                  "broker": broker or "未知券商",
                  "analyst": analyst,
                  "rating": rating,
                  "report_type": "券商公司研究报告",
                  "title": title,
                  "info_code": info,
                  "urls": [
                      f"https://pdf.dfcfw.com/pdf/H3_{info}_1.pdf",
                      f"https://pdf.dfcfw.com/pdf/H2_{info}_1.pdf",
                      f"https://pdf.dfcfw.com/pdf/H1_{info}_1.pdf",
                      f"https://pdf.dfcfw.com/pdf/H4_{info}_1.pdf",
                  ],
                  "detail_url": f"https://data.eastmoney.com/report/info/{info}.html",
                  "priority": 500,
              })

          # Add discovered PDF links as last-resort candidates. Metadata will be read from first pages.
          discovered_urls_unique = []
          for url in discovered_urls:
              if url not in discovered_urls_unique:
                  discovered_urls_unique.append(url)
          for idx, url in enumerate(discovered_urls_unique, 1):
              known.append({
                  "date": "未知日期",
                  "broker": "待从PDF核验",
                  "analyst": "",
                  "rating": "",
                  "report_type": "券商公司研究报告",
                  "title": f"公开页面发现的候选报告{idx}",
                  "info_code": f"DISCOVERED_{idx}",
                  "urls": [url],
                  "detail_url": url,
                  "priority": 200,
              })

          def safe_name(text: str, limit: int = 180) -> str:
              text = re.sub(r'[\\/:*?"<>|\r\n\t]+', "_", text)
              return re.sub(r"\s+", " ", text).strip(" ._")[:limit] or "report"

          validated = []
          hashes = set()
          temp_dir = Path("candidate_pdfs")
          temp_dir.mkdir(exist_ok=True)

          for spec in known:
              data = None
              used_url = None
              attempts = []
              for url in spec.get("urls") or []:
                  try:
                      response = request(
                          "GET",
                          url,
                          headers={"Referer": spec.get("detail_url") or "https://data.eastmoney.com/", "Accept": "application/pdf,*/*;q=0.8"},
                      )
                      record = {
                          "url": url,
                          "status": response.status_code,
                          "bytes": len(response.content),
                          "content_type": response.headers.get("content-type", ""),
                          "magic": response.content[:8].hex(),
                          "final_url": response.url,
                      }
                      attempts.append(record)
                      print("PDF_PROBE", json.dumps(record, ensure_ascii=False))
                      if response.status_code == 200 and response.content.startswith(b"%PDF-") and len(response.content) > 50_000:
                          data = response.content
                          used_url = response.url
                          break
                  except Exception as exc:
                      attempts.append({"url": url, "error": repr(exc)})
              if data is None:
                  continue

              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  continue
              hashes.add(digest)
              temp_path = temp_dir / f"{safe_name(spec['info_code'])}.pdf"
              temp_path.write_bytes(data)
              try:
                  reader = PdfReader(str(temp_path), strict=False)
                  pages = len(reader.pages)
                  text_parts = []
                  for page in reader.pages[: min(20, pages)]:
                      try:
                          text_parts.append(page.extract_text() or "")
                      except Exception:
                          pass
                  text = "\n".join(text_parts)
              except Exception as exc:
                  print("PARSE_FAILED", spec["info_code"], repr(exc))
                  continue

              if pages < 3:
                  print("SKIP_TOO_SHORT", spec["info_code"], pages)
                  continue
              issuer_ok = COMPANY in text or FULL in text or CODE in text or B_CODE in text or "ST轻骑" in text or "济南轻骑" in text
              if not issuer_ok:
                  print("SKIP_ISSUER_MISMATCH", spec["info_code"], pages, spec["title"])
                  continue

              # Recover metadata from PDF when candidate came from a generic page.
              broker = spec["broker"]
              title = spec["title"]
              report_type = spec["report_type"]
              date = spec["date"]
              analyst = spec["analyst"]
              rating = spec["rating"]
              if broker == "待从PDF核验":
                  broker_patterns = ["西南证券", "长城证券", "国泰君安", "国泰海通", "渤海证券", "中信证券", "海通证券", "申万宏源"]
                  broker = next((x for x in broker_patterns if x in text), "未知券商")
                  first_lines = [re.sub(r"\s+", " ", line).strip() for line in text.splitlines() if line.strip()]
                  title_candidates = [line for line in first_lines[:80] if COMPANY in line or "轻骑" in line]
                  if title_candidates:
                      title = title_candidates[0][:80]
                  date_match = re.search(r"20\d{2}[ 年./-]+\d{1,2}[ 月./-]+\d{1,2}", text[:5000])
                  if date_match:
                      date = date_match.group(0)

              score = int(spec.get("priority") or 0) + min(pages, 60) * 3
              if "深度" in title or "深度" in text[:4000]:
                  score += 150
              if "首次" in title or "首次" in text[:4000]:
                  score += 60
              if pages >= 12:
                  score += 40
              if pages >= 20:
                  score += 40
              if "季报点评" in report_type or "季报点评" in title:
                  score -= 60

              validated.append({
                  **spec,
                  "broker": broker,
                  "title": title,
                  "report_type": report_type,
                  "date": date,
                  "analyst": analyst,
                  "rating": rating,
                  "actual_pages": pages,
                  "bytes": len(data),
                  "sha256": digest,
                  "pdf_url": used_url,
                  "temp_path": str(temp_path),
                  "score": score,
                  "download_attempts": attempts,
                  "text_sample": text[:5000],
              })

          validated.sort(key=lambda item: (item["score"], item["actual_pages"], item["date"]), reverse=True)
          (DISCOVERY_DIR / "validated_candidates.json").write_text(json.dumps(validated, ensure_ascii=False, indent=2), encoding="utf-8")
          print("VALIDATED_COUNT", len(validated))
          for item in validated:
              print("VALID", item["score"], item["actual_pages"], item["broker"], item["title"], item["info_code"])

          selected = []
          title_keys = set()
          for item in validated:
              key = re.sub(r"\W+", "", item["title"])
              if key in title_keys:
                  continue
              title_keys.add(key)
              selected.append(item)
              if len(selected) >= 3:
                  break
          if len(selected) < 2:
              raise RuntimeError(f"Only {len(selected)} valid reports found: {validated}")

          manifest = []
          for index, item in enumerate(selected, 1):
              date_slug = re.sub(r"[^0-9]", "", item["date"])[:8] or "unknown"
              filename = safe_name(f"{index:02d}_{date_slug}_{item['broker']}_{item['title']}.pdf")
              source_path = Path(item["temp_path"])
              destination = PDF_DIR / filename
              destination.write_bytes(source_path.read_bytes())

              check = subprocess.run(
                  ["qpdf", "--warning-exit-0", "--check", str(destination)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if check.returncode != 0:
                  raise RuntimeError(f"qpdf failed for {filename}: {check.stdout}")

              preview_prefix = PREVIEW_DIR / destination.stem
              render = subprocess.run(
                  ["pdftoppm", "-f", "1", "-l", "1", "-png", "-r", "140", "-singlefile", str(destination), str(preview_prefix)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              preview = Path(str(preview_prefix) + ".png")
              if render.returncode != 0 or not preview.exists() or preview.stat().st_size < 5_000:
                  raise RuntimeError(f"preview failed for {filename}: {render.stdout}")

              manifest.append({
                  "filename": filename,
                  "date": item["date"],
                  "broker": item["broker"],
                  "analyst": item["analyst"],
                  "rating": item["rating"],
                  "title": item["title"],
                  "report_type": item["report_type"],
                  "info_code": item["info_code"],
                  "actual_pages": item["actual_pages"],
                  "bytes": item["bytes"],
                  "sha256": item["sha256"],
                  "detail_url": item["detail_url"],
                  "pdf_url": item["pdf_url"],
                  "preview_file": str(Path("首页预览") / preview.name),
              })

          readme = [
              f"湖南天雁（{CODE}.SH；B股代码{B_CODE}）券商研究报告资料包",
              f"整理日期：{PREPARED}",
              "",
              f"本包收录{len(manifest)}份公开可直接下载并完成结构核验的券商原始PDF。",
              "优先选择公司深度、首次覆盖及篇幅较完整的公司研究；如公开深度报告数量不足，以相关公司点评补足。",
              "报告版权归原券商及作者所有，仅供研究参考，不构成投资建议。",
              "",
          ]
          for index, item in enumerate(manifest, 1):
              readme.extend([
                  f"{index}. {item['filename']}",
                  f"   券商：{item['broker']}；类型：{item['report_type']}；研究员：{item['analyst'] or '公开元数据未标注'}；发布日期：{item['date']}",
                  f"   标题：{item['title']}",
                  f"   评级：{item['rating'] or '公开元数据未标注'}；实际页数：{item['actual_pages']}页；文件大小：{item['bytes']}字节",
                  f"   原始PDF：{item['pdf_url']}",
                  f"   来源页面：{item['detail_url']}",
                  f"   SHA-256：{item['sha256']}",
                  "",
              ])
          readme.extend([
              "核验项目：PDF文件头、发行人名称/证券代码、实际页数、qpdf结构、首页渲染、逐文件SHA-256及ZIP CRC。",
              "未使用网页摘要或自行重排文件替代券商原始PDF。",
          ])
          (ROOT / "README_报告清单与核验说明.txt").write_text("\n".join(readme), encoding="utf-8")

          payload = {
              "company": COMPANY,
              "full_company_name": FULL,
              "stock_code": CODE,
              "b_share_code": B_CODE,
              "prepared_on": PREPARED,
              "report_count": len(manifest),
              "all_files_are_original_broker_pdfs": True,
              "files": manifest,
          }
          (ROOT / "manifest.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          with (ROOT / "manifest.csv").open("w", newline="", encoding="utf-8-sig") as handle:
              writer = csv.writer(handle)
              writer.writerow(["文件名", "报告类型", "券商", "研究员", "发布日期", "标题", "评级", "页数", "字节数", "SHA-256", "来源页面", "PDF地址"])
              for item in manifest:
                  writer.writerow([item["filename"], item["report_type"], item["broker"], item["analyst"], item["date"], item["title"], item["rating"], item["actual_pages"], item["bytes"], item["sha256"], item["detail_url"], item["pdf_url"]])
          (ROOT / "SHA256SUMS.txt").write_text("\n".join(f"{item['sha256']}  PDF原件/{item['filename']}" for item in manifest) + "\n", encoding="utf-8")

          zip_path = Path("hunan_tyen_600698_broker_reports.zip")
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(ROOT.rglob("*")):
                  if path.is_file():
                      archive.write(path, arcname=str(Path(ROOT_NAME) / path.relative_to(ROOT)))
          with zipfile.ZipFile(zip_path, "r") as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise RuntimeError(f"ZIP CRC failed: {bad}")

          result = {
              "package": zip_path.name,
              "zip_bytes": zip_path.stat().st_size,
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "report_count": len(manifest),
              "files": manifest,
          }
          Path("result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          print("PACKAGE_RESULT", json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: hunan-tyen-600698-broker-reports-20261104
          path: |
            hunan_tyen_600698_broker_reports.zip
            result.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
