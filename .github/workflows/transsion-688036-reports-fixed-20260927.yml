name: Build final Transsion Holdings 688036 reports ZIP 20260927

on:
  push:
    paths:
      - '.github/workflows/transsion-688036-reports-fixed-20260927.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf
          python -m pip install --quiet requests pypdf

      - name: Download official reports and build final ZIP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import subprocess
          import time
          import zipfile
          from pathlib import Path

          import requests
          from pypdf import PdfReader

          STOCK = '688036'
          PACKAGE = '传音控股_688036_2020-2025年报及2026最新季报与半年报'
          OUT = Path(PACKAGE)
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
          })

          def parse_json_or_jsonp(text: str):
              text = text.strip().lstrip('\ufeff')
              if text.startswith('{') or text.startswith('['):
                  return json.loads(text)
              match = re.search(r'^[^(]*\((.*)\)\s*;?$', text, flags=re.S)
              if not match:
                  raise RuntimeError('SSE response is not JSON/JSONP')
              return json.loads(match.group(1))

          endpoint = 'https://query.sse.com.cn/security/stock/queryCompanyBulletin.do'
          params = {
              'isPagination': 'true',
              'productId': STOCK,
              'keyWord': '',
              'securityType': '0101,120100,020100,020200,120200',
              'reportType2': 'DQBG',
              'reportType': '',
              'beginDate': '2021-01-01',
              'endDate': '2026-09-27',
              'pageHelp.pageSize': '100',
              'pageHelp.pageCount': '50',
              'pageHelp.pageNo': '1',
              'pageHelp.beginPage': '1',
              'pageHelp.cacheSize': '1',
              'pageHelp.endPage': '5',
              '_': str(int(time.time() * 1000)),
          }
          response = session.get(
              endpoint,
              params=params,
              headers={'Referer': f'https://www.sse.com.cn/assortment/stock/list/info/announcement/index.shtml?productId={STOCK}'},
              timeout=(15, 45),
          )
          print('SSE_QUERY', response.status_code, len(response.content), response.url, flush=True)
          response.raise_for_status()
          payload = parse_json_or_jsonp(response.text)
          source_rows = payload.get('result') or payload.get('pageHelp', {}).get('data') or payload.get('data') or []
          if not source_rows:
              raise RuntimeError('SSE API returned no periodic reports')

          def clean(value: str) -> str:
              return re.sub(r'\s+', '', re.sub(r'<[^>]+>', '', value or ''))

          rows = []
          for row in source_rows:
              title = clean(str(row.get('TITLE') or row.get('title') or ''))
              url = str(row.get('URL') or row.get('url') or '')
              date = str(row.get('SSEDATE') or row.get('date') or '')
              if title and url:
                  rows.append({'title': title, 'url': url, 'date': date})

          print('CANDIDATES_BEGIN', flush=True)
          for row in rows:
              print(json.dumps(row, ensure_ascii=False), flush=True)
          print('CANDIDATES_END', flush=True)

          def date_key(row: dict) -> int:
              return int(re.sub(r'\D', '', row['date']) or 0)

          def is_full(title: str) -> bool:
              return not any(term in title for term in (
                  '摘要', '英文版', '审计报告', '内部控制', '社会责任', 'ESG',
                  '可持续发展', '提示性公告', '更正公告', '问询函', '回复公告',
              ))

          docs = []
          for year in range(2020, 2026):
              matches = [
                  row for row in rows
                  if is_full(row['title']) and (
                      f'{year}年年度报告' in row['title'] or f'{year}年度报告' in row['title']
                  )
              ]
              if not matches:
                  raise RuntimeError(f'missing annual report for {year}')
              matches.sort(key=lambda row: (('修订' in row['title']) or ('更新' in row['title']), date_key(row)), reverse=True)
              docs.append({
                  'filename': f'{year - 2019:02d}_传音控股_688036_{year}年年度报告.pdf',
                  'title': f'传音控股{year}年年度报告',
                  'period': f'{year}年度',
                  'row': matches[0],
                  'min_pages': 70,
                  'min_bytes': 700_000,
              })

          quarter_matches = [
              row for row in rows
              if '2026' in row['title'] and is_full(row['title']) and any(
                  term in row['title'] for term in ('第一季度报告', '一季度报告', '第三季度报告', '三季度报告')
              )
          ]
          if not quarter_matches:
              raise RuntimeError('missing 2026 quarterly report')
          quarter_matches.sort(key=date_key, reverse=True)
          qrow = quarter_matches[0]
          qlabel = '2026年第三季度报告' if ('第三季度' in qrow['title'] or '三季度' in qrow['title']) else '2026年第一季度报告'
          docs.append({
              'filename': f'07_传音控股_688036_{qlabel}.pdf',
              'title': f'传音控股{qlabel}',
              'period': '2026年第三季度' if '第三季度' in qlabel else '2026年第一季度',
              'row': qrow,
              'min_pages': 4,
              'min_bytes': 80_000,
          })

          half_matches = [
              row for row in rows
              if '2026' in row['title'] and is_full(row['title']) and ('半年度报告' in row['title'] or '中期报告' in row['title'])
          ]
          if half_matches:
              half_matches.sort(key=date_key, reverse=True)
              docs.append({
                  'filename': '08_传音控股_688036_2026年半年度报告.pdf',
                  'title': '传音控股2026年半年度报告',
                  'period': '截至2026年6月30日止六个月',
                  'row': half_matches[0],
                  'min_pages': 35,
                  'min_bytes': 350_000,
              })

          def url_variants(raw: str) -> list[str]:
              raw = raw.strip()
              if raw.startswith('http://') or raw.startswith('https://'):
                  urls = [raw]
              else:
                  path = '/' + raw.lstrip('/')
                  # Static host is more reliable for PDF downloads than the web front end.
                  urls = ['https://static.sse.com.cn' + path, 'https://www.sse.com.cn' + path]
              expanded = []
              for url in urls:
                  expanded.append(url)
                  if url.startswith('http://'):
                      expanded.append('https://' + url[len('http://'):])
                  if 'www.sse.com.cn/disclosure/' in url:
                      expanded.append(url.replace('www.sse.com.cn/disclosure/', 'static.sse.com.cn/disclosure/'))
                  if 'static.sse.com.cn/disclosure/' in url:
                      expanded.append(url.replace('static.sse.com.cn/disclosure/', 'www.sse.com.cn/disclosure/'))
              return list(dict.fromkeys(expanded))

          def download_pdf(doc: dict, destination: Path) -> str:
              errors = []
              for url in url_variants(doc['row']['url']):
                  for attempt in range(1, 4):
                      temp = destination.with_suffix('.pdf.part')
                      try:
                          with session.get(
                              url,
                              headers={'Referer': 'https://www.sse.com.cn/', 'Accept': 'application/pdf,*/*;q=0.8'},
                              stream=True,
                              allow_redirects=True,
                              timeout=(15, 120),
                          ) as result:
                              print('DOWNLOAD', destination.name, attempt, result.status_code, url, 'FINAL', result.url, flush=True)
                              result.raise_for_status()
                              with temp.open('wb') as fh:
                                  for chunk in result.iter_content(1024 * 1024):
                                      if chunk:
                                          fh.write(chunk)
                          size = temp.stat().st_size
                          if size < doc['min_bytes'] or temp.read_bytes()[:5] != b'%PDF-':
                              raise RuntimeError(f'invalid PDF response size={size}')
                          temp.replace(destination)
                          return str(result.url)
                      except Exception as exc:
                          temp.unlink(missing_ok=True)
                          errors.append(f'{url} attempt {attempt}: {exc!r}')
                          time.sleep(attempt)
              raise RuntimeError(f'download failed for {destination.name}: {errors}')

          records = []
          hashes = set()
          for doc in docs:
              destination = OUT / doc['filename']
              source_url = download_pdf(doc, destination)
              reader = PdfReader(str(destination), strict=False)
              pages = len(reader.pages)
              if pages < doc['min_pages']:
                  raise RuntimeError(f'page count too small for {destination.name}: {pages}')
              qpdf = subprocess.run(['qpdf', '--check', str(destination)], capture_output=True, text=True)
              if qpdf.returncode not in (0, 3):
                  raise RuntimeError(f'qpdf validation failed for {destination.name}: {qpdf.stderr[-1000:]}')
              data = destination.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest in hashes:
                  raise RuntimeError(f'duplicate PDF: {destination.name}')
              hashes.add(digest)
              record = {
                  'filename': doc['filename'],
                  'title': doc['title'],
                  'period': doc['period'],
                  'announcement_title': doc['row']['title'],
                  'announcement_date': doc['row']['date'],
                  'source_url': source_url,
                  'pages': pages,
                  'bytes': len(data),
                  'sha256': digest,
              }
              records.append(record)
              print('VALIDATED', json.dumps(record, ensure_ascii=False), flush=True)

          notes = [
              '深圳传音控股股份有限公司（688036.SH）2020—2025年年度报告及2026年最新季报/半年报',
              '整理日期：2026-09-27',
              '',
              '收录内容：2020—2025年完整年度报告、截至整理日最新的2026年季度报告，以及2026年半年度报告（如已披露）。',
              '资料来源：上海证券交易所。',
              '所有PDF均完成文件头、大小、页数、qpdf结构、SHA-256及ZIP CRC检查。',
              '',
              '文件清单：',
          ]
          for i, record in enumerate(records, 1):
              notes.extend([
                  f"{i}. {record['title']}",
                  f"   文件：{record['filename']}",
                  f"   报告期：{record['period']}；页数：{record['pages']}；大小：{record['bytes']/1048576:.2f} MB",
                  f"   公告标题：{record['announcement_title']}；公告日期：{record['announcement_date']}",
                  f"   官方来源：{record['source_url']}",
                  f"   SHA-256：{record['sha256']}",
                  '',
              ])

          (OUT / '00_文件清单与官方来源说明.txt').write_text('\n'.join(notes), encoding='utf-8')
          (OUT / 'manifest.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          (OUT / 'SHA256SUMS.txt').write_text(''.join(f"{r['sha256']}  {r['filename']}\n" for r in records), encoding='utf-8')

          zip_path = Path(PACKAGE + '.zip')
          with zipfile.ZipFile(zip_path, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              for path in sorted(OUT.iterdir()):
                  archive.write(path, arcname=f'{PACKAGE}/{path.name}')
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise RuntimeError('ZIP CRC error: ' + bad)
              pdfs = [name for name in archive.namelist() if name.lower().endswith('.pdf')]
              if len(pdfs) != len(records):
                  raise RuntimeError(f'PDF count mismatch: {len(pdfs)} vs {len(records)}')
          print('FINAL_ZIP', zip_path.name, zip_path.stat().st_size, 'PDF_COUNT', len(records), 'SHA256', hashlib.sha256(zip_path.read_bytes()).hexdigest(), flush=True)
          PY

      - name: Upload completed package
        uses: actions/upload-artifact@v4
        with:
          name: transsion-688036-final-package-20260927
          path: 传音控股_688036_2020-2025年报及2026最新季报与半年报.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
