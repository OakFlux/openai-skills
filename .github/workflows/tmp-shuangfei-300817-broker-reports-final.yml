name: Build Available Shuangfei 300817 Broker Reports

on:
  push:
    branches:
      - tmp-shuangfei-300817-broker-reports-20260929

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: python -m pip install requests pypdf pymupdf
      - name: Download, verify and package available original reports
        shell: bash
        run: |
          cat > /tmp/package_shuangfei.py <<'PY'
          import hashlib, json, re, zipfile
          from pathlib import Path
          import requests, pymupdf
          from pypdf import PdfReader

          OUT = Path('output_final'); SEL = OUT / 'selected'; REND = OUT / 'renders'
          SEL.mkdir(parents=True, exist_ok=True); REND.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/report/'})

          reports = [
              {
                  'org':'华鑫证券', 'date':'2020-01-21',
                  'title':'新股询价报告：双飞股份',
                  'info_code':'AP202001211374413683',
                  'authors':'',
              },
              {
                  'org':'东莞证券', 'date':'2020-01-21',
                  'title':'新股网下申购询价建议报告（双飞股份）',
                  'info_code':'AP202001211374418344',
                  'authors':'',
              },
          ]

          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
              return h.hexdigest()

          manifest=[]
          for idx, r in enumerate(reports,1):
              url=f"https://pdf.dfcfw.com/pdf/H3_{r['info_code']}_1.pdf"
              raw=OUT/f"{r['info_code']}.pdf"
              resp=session.get(url,timeout=90); resp.raise_for_status(); raw.write_bytes(resp.content)
              if raw.read_bytes()[:5] != b'%PDF-': raise RuntimeError(f'not PDF: {url}')
              reader=PdfReader(str(raw),strict=False); pages=len(reader.pages)
              if pages < 2: raise RuntimeError(f'too few pages: {pages}')
              text=''.join((reader.pages[i].extract_text() or '') for i in range(min(pages,3)))
              compact=re.sub(r'\s+','',text)
              if not any(k in compact for k in ('双飞股份','双飞集团','300817')):
                  raise RuntimeError(f'company identity not found: {r["title"]}')
              doc=pymupdf.open(raw)
              render_dir=REND/r['info_code']; render_dir.mkdir(parents=True,exist_ok=True)
              for pageno in sorted(set([0,pages-1])):
                  pix=doc.load_page(pageno).get_pixmap(matrix=pymupdf.Matrix(1.0,1.0),alpha=False)
                  out=render_dir/f'page-{pageno+1:02d}.png'; pix.save(out)
                  if out.stat().st_size < 4000: raise RuntimeError('blank render')
              doc.close()
              safe_title=re.sub(r'[\\/:*?"<>|]','_',r['title'])
              filename=f"{idx:02d}_{r['org']}_{r['date']}_{safe_title}.pdf"
              dst=SEL/filename; dst.write_bytes(raw.read_bytes())
              item=dict(r); item.update({'pages':pages,'source_pdf_url':url,'package_filename':filename,'sha256':sha256(dst),'size_bytes':dst.stat().st_size})
              manifest.append(item)

          readme=[
              '# 双飞集团（300817）公开可得券商研报原始PDF整理包', '',
              '检索结论：公开个股研报数据库仅检索到2份可直接下载并核验的券商报告，均为2020年上市阶段的新股询价/申购建议报告；未检索到2—3份真正的公司深度覆盖报告。',
              '本包没有使用公司公告、行业报告、网页摘要或AI重排版文件补足数量。', '',
          ]
          for i,x in enumerate(manifest,1):
              readme += [f"## {i}. {x['title']}",f"- 机构：{x['org']}",f"- 日期：{x['date']}",f"- 页数：{x['pages']}",f"- 文件：`{x['package_filename']}`",f"- 原始PDF：{x['source_pdf_url']}",f"- SHA-256：`{x['sha256']}`",'']
          (SEL/'README_文件清单与检索说明.md').write_text('\n'.join(readme),encoding='utf-8')
          (SEL/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (SEL/'SHA256SUMS.txt').write_text('\n'.join(f"{x['sha256']}  {x['package_filename']}" for x in manifest)+'\n',encoding='utf-8')

          zip_cn=OUT/'双飞集团_300817_券商研报_原始PDF_2份_20260929.zip'
          zip_en=OUT/'Shuangfei_Group_300817_Broker_Reports_Original_PDFs_2_20260929.zip'
          for zp in (zip_cn,zip_en):
              with zipfile.ZipFile(zp,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as zf:
                  for p in sorted(SEL.iterdir()): zf.write(p,arcname=p.name)
              with zipfile.ZipFile(zp) as zf:
                  bad=zf.testzip()
                  if bad: raise RuntimeError(f'ZIP CRC failure: {bad}')
          summary={'count':2,'reports':manifest,'zip_cn':str(zip_cn),'zip_en':str(zip_en),'zip_sha256':sha256(zip_cn)}
          (OUT/'package_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python /tmp/package_shuangfei.py
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shuangfei-300817-Available-Broker-Reports
          path: |
            output_final/*.zip
            output_final/package_summary.json
          if-no-files-found: error
          retention-days: 3
