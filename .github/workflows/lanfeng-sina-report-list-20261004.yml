name: Search Sina Lanfeng Biochemical reports 20261004
on:
  push:
    paths:
      - '.github/workflows/lanfeng-sina-report-list-20261004.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet requests beautifulsoup4 lxml
      - name: Fetch report lists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          from bs4 import BeautifulSoup

          s=requests.Session(); s.trust_env=False
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Referer':'https://finance.sina.com.cn/'})
          rows=[]
          for p in range(1,11):
            u=f'https://stock.finance.sina.com.cn/stock/go.php/vReport_List/kind/search/index.phtml?symbol=sz002513&t1=all&p={p}'
            r=s.get(u,timeout=60)
            Path(f'out/page{p}.html').write_bytes(r.content)
            text=r.content.decode('gb18030','replace')
            soup=BeautifulSoup(text,'lxml')
            for a in soup.find_all('a',href=True):
              href=a.get('href','')
              title=' '.join(a.get_text(' ',strip=True).split())
              m=re.search(r'/vReport_Show/kind/search/rptid/(\d+)/index\.phtml',href)
              if not m: continue
              parent=a.find_parent('tr')
              cells=[]
              if parent:
                cells=[' '.join(td.get_text(' ',strip=True).split()) for td in parent.find_all(['td','th'])]
              rows.append({'page':p,'report_id':m.group(1),'title':title,'href':href,'cells':cells})
            print('PAGE',p,'status',r.status_code,'bytes',len(r.content),'matches',sum(1 for x in rows if x['page']==p))
            if '下一页' not in text and p>1:
              break
          uniq={x['report_id']:x for x in rows}
          result=list(uniq.values())
          Path('out/reports.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lanfeng-sina-report-list
          path: out
          retention-days: 7
          if-no-files-found: error
