name: Build Ningbo Huaxiang broker research package v2

on:
  push:
    branches:
      - tmp-ningbo-huaxiang-broker-reports-20261028

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Install PDF tools and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils zip unzip fonts-noto-cjk
          python3 -m pip install --quiet --disable-pip-version-check requests weasyprint pypdf

      - name: Build and validate package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE='宁波华翔_002048_券商研究资料_3份'
          mkdir -p "$PACKAGE" /tmp/nbhx_broker_check

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from pypdf import PdfReader
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          from weasyprint import HTML

          OUT = Path('宁波华翔_002048_券商研究资料_3份')
          session = requests.Session()
          session.trust_env = False
          retry = Retry(
              total=8, connect=8, read=8, status=8, backoff_factor=1.0,
              status_forcelist=[429, 500, 502, 503, 504],
              allowed_methods=['GET'], raise_on_status=False,
          )
          session.mount('https://', HTTPAdapter(max_retries=retry))
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/155 Safari/537.36',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.5',
          })

          def fetch_pdf(url: str, referer: str) -> requests.Response:
              last = None
              for attempt in range(8):
                  try:
                      response = session.get(
                          url,
                          headers={
                              'Accept': 'application/pdf,application/octet-stream;q=0.9,*/*;q=0.8',
                              'Referer': referer,
                          },
                          timeout=(30, 360),
                          allow_redirects=True,
                      )
                      if response.status_code == 200 and response.content.startswith(b'%PDF-'):
                          return response
                      last = RuntimeError(f'HTTP={response.status_code}, bytes={len(response.content)}')
                  except Exception as exc:
                      last = exc
                  time.sleep(min(2 + attempt, 10))
              raise RuntimeError(f'PDF download failed: {last!r}')

          def render_digest(
              filename: str,
              title: str,
              broker: str,
              analysts: str,
              date: str,
              original_pages: int,
              source_url: str,
              sections: list[tuple[str, str]],
          ) -> int:
              body = []
              for heading, paragraph in sections:
                  body.append(f'<h2>{html.escape(heading)}</h2>')
                  body.append(f'<p>{html.escape(paragraph)}</p>')
              document = f'''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
              @page {{ size:A4; margin:17mm 16mm 19mm; @bottom-center {{ content:counter(page); font-size:9pt; color:#666; }} }}
              body {{ font-family:"Noto Sans CJK SC","Noto Sans CJK",sans-serif; color:#111; font-size:10.4pt; line-height:1.72; }}
              h1 {{ font-size:18pt; line-height:1.4; margin:0 0 7mm; }}
              h2 {{ font-size:13pt; line-height:1.45; margin:6mm 0 2.5mm; page-break-after:avoid; }}
              p {{ margin:0 0 4mm; text-align:justify; orphans:3; widows:3; }}
              .meta {{ border-top:1px solid #555; border-bottom:1px solid #aaa; padding:3mm 0; margin-bottom:5mm; font-size:9.3pt; line-height:1.65; }}
              .notice {{ background:#f2f2f2; border-left:3px solid #777; padding:3.5mm 4mm; margin-bottom:6mm; font-size:9pt; }}
              .source {{ border-top:1px solid #bbb; padding-top:4mm; word-break:break-all; font-size:8.5pt; color:#555; margin-top:8mm; }}
              </style></head><body>
              <h1>{html.escape(title)}</h1>
              <div class="meta">券商：{html.escape(broker)}<br>分析师：{html.escape(analysts)}<br>发布日期：{date}<br>原始报告公开索引页数：{original_pages}页<br>本文件版本：公开摘要精读版</div>
              <div class="notice"><strong>版本说明：</strong>原始报告附件在公开平台需要登录、积分或会员权限。本文件依据无需登录即可查看的报告介绍、核心结论和公开索引信息重新归纳，属于研究摘要，不是券商原始PDF，也不包含原报告的完整图表、附录和逐页正文。</div>
              {''.join(body)}
              <div class="source">公开信息页：{html.escape(source_url)}<br>资料仅供研究参考，不构成投资建议。</div>
              </body></html>'''
              path = OUT / filename
              HTML(string=document, base_url=source_url).write_pdf(path)
              pages = len(PdfReader(str(path), strict=False).pages)
              if pages < 2:
                  raise RuntimeError(f'digest too short: {filename}, pages={pages}')
              print('DIGEST', filename, pages, path.stat().st_size)
              return pages

          records = []

          # 1. Public original PDF.
          original_url = 'https://pdf.dfcfw.com/pdf/H3_AP202506271698458026_1.pdf'
          original_info = 'https://data.eastmoney.com/report/info/AP202506271698458026.html'
          response = fetch_pdf(original_url, original_info)
          original_name = '01_国金证券_剥离欧洲轻装行布局机器人启新篇_原始PDF_2025-06-26.pdf'
          original_path = OUT / original_name
          original_path.write_bytes(response.content)
          original_pages = len(PdfReader(str(original_path), strict=False).pages)
          if original_pages != 33:
              raise RuntimeError(f'Unexpected original page count: {original_pages}')
          records.append({
              'order': 1,
              'file': original_name,
              'broker': '国金证券',
              'date': '2025-06-26',
              'title': '剥离欧洲轻装行，布局机器人启新篇',
              'file_status': '券商原始完整PDF',
              'original_report_pages': 33,
              'current_file_pages': original_pages,
              'source': response.url,
          })
          print('ORIGINAL', original_name, original_pages, len(response.content), response.url)

          # 2. Public-summary digest of Zhongtai Securities' locked 28-page report.
          zt_title = '革故鼎新稳根基，从汽车零部件到机器人全栈供应商'
          zt_source = 'https://www.nxny.com/report/view_6304571.html'
          zt_sections = [
              ('报告定位与核心判断', '该报告将宁波华翔定位为正在完成资产质量修复、客户结构升级与第二增长曲线培育的全球化汽车零部件企业。研究框架同时考察传统汽车内外饰、金属件和电子件业务，以及机器人整机装配、关节模组和PEEK轻量化材料等新业务。报告认为，欧洲亏损资产退出后，公司利润表可读性和资源配置效率将明显改善，汽车主业与机器人业务的协同价值可能成为后续估值重构的主要线索。'),
              ('海外业务调整与盈利修复', '公开摘要显示，公司在2025年完成欧洲主要亏损主体剥离，处置过程对当期归母利润产生一次性影响，但持续性经营负担随之下降。北美业务的经营性亏损已有收窄迹象，东南亚基地保持相对稳定。该报告更关注剥离完成后的正常化盈利能力，认为2026年一季度利润率回升可作为经营修复的早期信号，但海外改善速度、汇率和客户需求仍需持续跟踪。'),
              ('汽车主业的客户与产品逻辑', '公司汽车业务覆盖内饰件、外饰件、金属结构件和电子件。报告认为，公司一方面依靠大众、宝马、奔驰等传统高端客户维持质量和盈利基础，另一方面持续提高比亚迪、奇瑞、吉利、赛力斯、小米、理想等自主品牌客户占比。智能座舱配置升级、轻量化需求和大总成供货能力有助于提升单车价值量；芜湖、重庆等新增产能则需要依靠已获定点项目逐步释放。'),
              ('机器人与PEEK材料增长曲线', '报告将与智元机器人的合作视为公司从汽车零部件向机器人硬件平台延伸的重要抓手。公司利用既有的精密制造、系统集成、供应链管理和规模化装配能力切入整机及关节模组生产，并布局PEEK材料一体化产能。公开信息显示，机器人交付规模、产线爬坡、PEEK成本控制和终端应用验证是该业务兑现的关键变量。该方向空间较大，但现阶段仍处于产能建设和客户验证阶段。'),
              ('盈利预测框架与主要风险', '公开摘要给出了2026—2028年收入和利润增长预测，并以汽车主业修复、机器人放量及PEEK材料降本作为主要驱动。估值结论依赖新业务进展和利润恢复速度。主要风险包括汽车销量和客户项目不及预期、产品降价与原材料成本上升、海外经营改善慢于预期、机器人及PEEK产业化节奏不及预期，以及公开数据更新滞后。'),
          ]
          zt_name = '02_中泰证券_革故鼎新稳根基从汽车零部件到机器人全栈供应商_公开摘要精读版_2026-05-28.pdf'
          zt_pages = render_digest(
              zt_name, zt_title, '中泰证券', '何俊艺、袁泽生', '2026-05-28', 28,
              zt_source, zt_sections,
          )
          records.append({
              'order': 2,
              'file': zt_name,
              'broker': '中泰证券',
              'date': '2026-05-28',
              'title': zt_title,
              'file_status': '公开摘要精读版，非券商原始附件',
              'original_report_pages': 28,
              'current_file_pages': zt_pages,
              'source': zt_source,
          })

          # 3. Public-summary digest of Western Securities' locked 30-page report.
          xb_title = '全面拥抱人形机器人产业，全球PEEK龙头潜力初显'
          xb_source = 'https://www.nxny.com/report/view_6219478.html'
          xb_sections = [
              ('首次覆盖的研究主线', '西部证券的首次覆盖报告围绕三个问题展开：合资品牌销量变化对公司汽车业务的冲击、传统零部件业务的持续成长来源，以及机器人和PEEK材料能否形成新的利润中心。报告的总体判断是，欧洲亏损资产退出后公司盈利能力有望回到更正常的水平，自主品牌客户扩张可部分对冲合资客户需求波动，智能底盘、机器人和新材料布局则提供中长期成长弹性。'),
              ('欧洲业务剥离后的经营质量', '公司过去的欧洲业务长期承受较高成本和亏损压力，对合并利润形成拖累。报告认为，2025年完成相关资产剥离后，短期处置损失与收入出表会扰动财务数据，但后续利润质量和管理效率有望改善。判断修复是否成立，需要结合国内业务毛利率、北美业务减亏、经营现金流和扣非利润变化，而不能只观察一次性的归母利润增速。'),
              ('自主品牌与智能底盘布局', '公司正在提高自主品牌项目占比，以降低对单一合资客户周期的依赖。除传统内外饰和金属件外，报告重点关注智能底盘等汽车智能化产品。该领域目前仍由国际供应商占据较强地位，公司能否借助现有整车客户关系、制造体系和本地化服务能力实现国产替代，将决定汽车业务未来的产品升级幅度。'),
              ('机器人合作与PEEK产业化', '报告把人形机器人视为公司最具弹性的新增量。公司与智元机器人在合资平台、整机装配、供应链协同、应用场景、产业投资和海外拓展等方面开展合作，并规划PEEK材料产能。汽车制造积累可迁移到机器人装配和零部件生产，但新业务的竞争壁垒最终仍取决于良率、成本、交付规模、材料认证及稳定客户订单。'),
              ('估值方法与风险提示', '公开摘要采用2026年预期利润和目标市盈率进行估值，并给予首次覆盖“买入”判断。该估值对欧洲业务退出后的利润恢复、智能底盘进展和机器人业务放量较为敏感。主要风险包括汽车行业景气度下降、海外业务改善不及预期、新业务拓展慢于计划、PEEK产能利用率不足、客户集中度及公开行业数据更新不及时。'),
          ]
          xb_name = '03_西部证券_全面拥抱人形机器人产业全球PEEK龙头潜力初显_公开摘要精读版_2026-02-13.pdf'
          xb_pages = render_digest(
              xb_name, xb_title, '西部证券', '齐天翔、张磊', '2026-02-13', 30,
              xb_source, xb_sections,
          )
          records.append({
              'order': 3,
              'file': xb_name,
              'broker': '西部证券',
              'date': '2026-02-13',
              'title': xb_title,
              'file_status': '公开摘要精读版，非券商原始附件',
              'original_report_pages': 30,
              'current_file_pages': xb_pages,
              'source': xb_source,
          })

          (OUT / '_metadata.json').write_text(json.dumps(records, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          test "$(find "$PACKAGE" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for pdf in "$PACKAGE"/*.pdf; do
            test "$(head -c 5 "$pdf")" = '%PDF-'
            test "$(stat -c%s "$pdf")" -gt 70000
            set +e
            qpdf --check "$pdf" >"$pdf.qpdf.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then cat "$pdf.qpdf.txt" >&2; exit "$rc"; fi
            rm -f "$pdf.qpdf.txt"
            pages=$(pdfinfo "$pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')
            test -n "$pages" && test "$pages" -ge 2
            pdftotext -f 1 -l "$pages" "$pdf" "$pdf.txt" 2>/dev/null || true
            grep -Eq '宁波华翔电子股份有限公司|宁波华翔' "$pdf.txt"
            case "$(basename "$pdf")" in
              01_*) grep -Eq '国金证券' "$pdf.txt" ;;
              02_*) grep -Eq '中泰证券' "$pdf.txt" ;;
              03_*) grep -Eq '西部证券' "$pdf.txt" ;;
            esac
            rm -f "$pdf.txt"
            stem="/tmp/nbhx_broker_check/$(basename "$pdf")"
            pdftoppm -f 1 -l 1 -singlefile -png -r 90 "$pdf" "$stem.first" >/dev/null 2>&1
            pdftoppm -f "$pages" -l "$pages" -singlefile -png -r 90 "$pdf" "$stem.last" >/dev/null 2>&1
            test -s "$stem.first.png" && test -s "$stem.last.png"
            echo "VALIDATED $(basename "$pdf") pages=$pages bytes=$(stat -c%s "$pdf")"
          done
          test "$(pdfinfo "$PACKAGE/01_国金证券_剥离欧洲轻装行布局机器人启新篇_原始PDF_2025-06-26.pdf" | awk -F: '/^Pages:/{gsub(/ /,"",$2);print $2}')" -eq 33

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          folder = Path('宁波华翔_002048_券商研究资料_3份')
          records = json.loads((folder / '_metadata.json').read_text(encoding='utf-8'))
          records.sort(key=lambda item: item['order'])
          lines = [
              '宁波华翔（002048）券商研究资料包',
              '整理日期：2026-10-28',
              '',
              '重要版本说明：',
              '1. 国金证券《剥离欧洲轻装行，布局机器人启新篇》为公开渠道直接下载的券商原始完整PDF，共33页。',
              '2. 中泰证券28页深度覆盖报告、西部证券30页首次覆盖报告的原始附件需要登录、积分或会员权限；本包未绕过访问控制。',
              '3. 后两份文件根据公开报告介绍与核心观点重新归纳，属于公开摘要精读版，不是券商原始PDF，未包含原报告完整图表、附录和逐页正文。',
              '4. 资料仅供研究参考，不构成投资建议。',
              '',
              '文件清单：',
          ]
          sums = []
          total_pages = 0
          total_bytes = 0
          for record in records:
              path = folder / record['file']
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              total_pages += int(record['current_file_pages'])
              total_bytes += len(data)
              lines += [
                  f'- {path.name}',
                  f"  券商：{record['broker']}；发布日期：{record['date']}",
                  f"  标题：{record['title']}",
                  f"  文件性质：{record['file_status']}",
                  f"  原报告公开索引页数：{record['original_report_pages']}；当前文件页数：{record['current_file_pages']}",
                  f"  公开来源：{record['source']}",
                  f'  SHA-256：{sha}',
              ]
              sums.append(f'{sha}  {path.name}')
          lines += [
              '',
              f'当前3份PDF合计页数：{total_pages}页。',
              f'当前PDF合计大小：{total_bytes}字节。',
              '全部文件均已通过PDF文件头、文件大小、结构完整性、公司名称、券商名称、实际页数及首末页渲染检查。',
          ]
          (folder / '00_文件清单与版本说明.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          (folder / '_metadata.json').unlink()
          print('\n'.join(lines))
          PY

          zip -q -r -6 package_test.zip "$PACKAGE"
          unzip -t package_test.zip >/dev/null
          test "$(unzip -Z1 package_test.zip | grep -c '\.pdf$')" -eq 3
          rm -f package_test.zip
          ls -lh "$PACKAGE"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Ningbo-Huaxiang-002048-broker-research-package-3-v2
          path: 宁波华翔_002048_券商研究资料_3份/
          retention-days: 2
          compression-level: 6
          if-no-files-found: error
