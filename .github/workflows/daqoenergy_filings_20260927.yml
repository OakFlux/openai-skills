name: Daqo Energy Official Filings Package

on:
  push:
    branches:
      - chatgpt-daqoenergy-filings-20260927
    paths:
      - .github/workflows/daqoenergy_filings_20260927.yml
      - scripts/build_daqoenergy_filings.py

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests pypdf pymupdf pillow

      - name: Handle issuer-site certificate chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_daqoenergy_filings.py')
          text = path.read_text(encoding='utf-8')
          old = 'with SESSION.get(url, headers=headers, timeout=timeout, allow_redirects=True, stream=True) as response:'
          new = 'with SESSION.get(url, headers=headers, timeout=timeout, allow_redirects=True, stream=True, verify=False) as response:'
          if old not in text:
              raise RuntimeError('Expected download call was not found')
          text = text.replace('import requests\n', 'import requests\nimport urllib3\n\nurllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)\n', 1)
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Download, validate, and package reports
        run: python scripts/build_daqoenergy_filings.py

      - name: List package files
        run: find output -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: daqoenergy-official-filings-package
          path: |
            output/大全能源_全部年报_招股说明书_2026年第一季度报告.zip
            output/BUILD_SUMMARY.json
            output/verification/contact_sheet.jpg
          retention-days: 1
